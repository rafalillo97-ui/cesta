hvis du tilslutter en pulsmåler, samt skridt, vægt eller kalorier, hvis du importerer data fra din sundhedsapp eller fra Health Connect. Hvis du bruger afsnittene Graviditet eller Baby, de oplysninger, du indtaster dér (graviditetsuge, babyens alder, noter).\u003c/p>\n  \u003cp>\u003cstrong>Fotos og indhold:\u003c/strong> de fotos, du uploader eller analyserer med kunstig intelligens, samt chatbeskeder.\u003c/p>\n  \u003cp>\u003cstrong>Forholdet til trænere, venner og fællesskab:\u003c/strong> anmodninger, forbindelser og det, du deler med dem (se afsnit 5).\u003c/p>\n  \u003cp>\u003cstrong>Invitations- og bidragsprogram:\u003c/strong> din invitationskode, de brugere, du inviterer, og de fødevarer, du bidrager med til databasen.\u003c/p>\n  \u003cp>\u003cstrong>Tekniske oplysninger og brugsdata:\u003c/strong> type enhed og browser, IP-adresse, sprog, fejllogge fra appen og en grundlæggende brugslog (hvilke skærmbilleder du åbner, og på hvilket trin i oprettelsen du afbryder, uden noget sundhedsindhold og uden skærmbilledet for modulet Bodybuilding). Hvis du er logget ind, knyttes brugsloggen til din bruger. De bruges, så appen fungerer, så fejl kan rettes, og så appen kan forbedres. Retsgrundlag: vores legitime interesse.\u003c/p>\n  \u003cp>\u003cstrong>Notifikationer:\u003c/strong> hvis du aktiverer dem, gemmer vi din enheds tekniske identifikator for at kunne sende dem til dig. Hvis du også aktiverer påmindelsen om stribe, gemmer vi desuden det tidspunkt, du vælger, din tidszone, din nuværende stribe og datoen for din seneste registrering, så vi kan minde dig i tide. Retsgrundlag: dit samtykke (den tilladelse, du giver i din browser eller på din mobil, og påmindelsens kontakt), som du til enhver tid kan trække tilbage ved at deaktivere dem.\u003c/p>\n  \u003cp>\u003cstrong>Betalinger:\u003c/strong> hvis du tegner et betalt abonnement, håndteres betalingen af Stripe. Vi ser eller gemmer ikke dine kortoplysninger; vi modtager kun status for dit abonnement.\u003c/p>\n\n  \u003ch2>3. Hvad vi bruger dem til, og på hvilket retsgrundlag\u003c/h2>\n  \u003cp>\u003cstrong>Levere tjenesten til dig\u003c/strong> (oprette din konto, beregne dine mål for kalorier og makronæringsstoffer, udarbejde din indkøbsliste, vise dine fremskridt, administrere dit abonnement). Retsgrundlag: opfyldelse af kontrakten.\u003c/p>\n  \u003cp>\u003cstrong>Behandle dine helbredsoplysninger.\u003c/strong> Retsgrundlag: dit udtrykkelige samtykke, som du giver, når du opretter kontoen, og som du til enhver tid kan trække tilbage ved at slette din konto. Hvis du ikke giver det, kan vi ikke tilbyde dig tjenesten.\u003c/p>\n  \u003cp>\u003cstrong>Funktioner med kunstig intelligens\u003c/strong> (genkende fødevarer på et foto, ernæringschat, opsummeringer af fremskridt). Retsgrundlag: dit samtykke, når du bruger funktionen.\u003c/p>\n  \u003cp>\u003cstrong>Sikkerhed, indholdsmoderation og fejlretning.\u003c/strong> Retsgrundlag: vores legitime interesse i at holde appen sikker og i drift.\u003c/p>\n  \u003cp>\u003cstrong>Retlige forpligtelser\u003c/strong> (fakturering, anmodninger fra myndigheder). Retsgrundlag: overholdelse af en retlig forpligtelse.\u003c/p>\n  \u003cp>Vi bruger aldrig dine oplysninger til reklameformål og sælger dem aldrig.\u003c/p>\n\n  \u003ch2>4. Automatiske afgørelser og kunstig intelligens\u003c/h2>\n  \u003cp>AI'ens skøn (kalorier i en ret, chatforslag) er vejledende og kan indeholde fejl. Der træffes ingen afgørelser med retsvirkning for dig, som udelukkende er baseret på automatisk behandling. Kontrollér altid det, AI'en foreslår.\u003c/p>\n\n  \u003ch2>5. Fællesskab, venner og trænere\u003c/h2>\n  \u003cp>Din profil er \u003cstrong>privat som standard\u003c/strong>. Hvis du gør den offentlig eller accepterer et venskab, kan den pågældende se dit brugernavn, dine menuer og dine fotos.\u003c/p>\n  \u003cp>Hvis du \u003cstrong>forbinder dig med en træner\u003c/strong>, kan træneren se de oplysninger, du deler med vedkommende (for eksempel dine fremskridt, dine menuer og din træning samt chatbeskederne), for at kunne rådgive dig. Det er dig, der beslutter, om du vil forbinde dig, og du kan afbryde forbindelsen, når du vil. Betalinger mellem træner og atlet sker uden for appen, og cesta. er ikke part i dem.\u003c/p>\n\n  \u003ch2>6. Hvem der ellers modtager dine oplysninger\u003c/h2>\n  \u003cp>Vi deler kun de nødvendige oplysninger med leverandører, der handler på vores vegne (databehandlere):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — database, autentificering, lagring af fotos og serverfunktioner.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — kun hvis du bruger fotoanalysen eller chatten med AI, samt til automatisk moderation af de fotos, du uploader (afsnit 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — betaling af abonnementer.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — når du søger efter et produkt på navn eller stregkode, sendes søgningen dertil for at hente produktets oplysninger.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — modtager tekniske fejlrapporter fra appen (servere i Den Europæiske Union).\u003c/p>\n  \u003cp>\u003cstrong>Webhosting og indholdsleveringsnetværk\u003c/strong> (Netlify eller GitHub Pages, jsDelivr, cdnjs) — leverer appen og dens biblioteker og ser derved din IP-adresse.\u003c/p>\n  \u003cp>Linkene til tekniske videoer om øvelser åbner en ekstern søgemaskine (YouTube), kun når du selv trykker på dem.\u003c/p>\n\n  \u003ch2>7. Internationale overførsler\u003c/h2>\n  \u003cp>Dine oplysninger gemmes på Supabase-servere i London (Storbritannien), som er omfattet af en afgørelse om tilstrækkeligt beskyttelsesniveau fra Europa-Kommissionen. Google og Stripe kan behandle oplysninger uden for Det Europæiske Økonomiske Samarbejdsområde (for eksempel i USA) med hjemmel i EU-USA-rammen for databeskyttelse eller i standardkontraktbestemmelser godkendt af Kommissionen.\u003c/p>\n\n  \u003ch2>8. Moderation af indhold og fotos\u003c/h2>\n  \u003cp>Ethvert fotografi, du uploader — profilfoto, fremskridtsfoto, foto af retter, af produkter, du bidrager med, eller sendt via chat — gennemgår et automatisk modereringsfilter med kunstig intelligens (Google Gemini), før det accepteres.\u003c/p>\n  \u003cp>Vi afviser og gemmer ikke noget billede, der indeholder: nøgenhed eller eksplicit eller antydende seksuelt indhold; grov vold eller foruroligende indhold; hadsymboler eller hadefulde, racistiske eller homofobiske budskaber; eller ethvert ulovligt indhold, herunder indhold, der kan udgøre seksuel udnyttelse eller seksuelt misbrug af børn. Hvis et foto afvises, kasseres filen, og den bliver aldrig gemt.\u003c/p>\n  \u003cp>Søgemaskinen til tekniske videoer tillader kun søgning på reelle øvelsesnavne fra en lukket liste; den sender aldrig fri tekst uden kontrol.\u003c/p>\n  \u003cp>Hvis vi opdager, eller får rapporteret, at en konto gentagne gange uploader forbudt indhold, kan vi suspendere eller slette den og opbevare det strengt nødvendige bevismateriale, hvis loven forpligter os til at indberette det til myndighederne. Du kan rapportere upassende indhold via »Rapportér en fejl« i indstillingerne eller ved at skrive til cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Hvor længe vi opbevarer dine oplysninger\u003c/h2>\n  \u003cp>Så længe din konto er aktiv. Hvis du sletter den, slettes dine oplysninger permanent og uigenkaldeligt fra vores database; de kan kun forblive i sikkerhedskopier, som vi opbevarer i højst 8 uger, og som overskrives med jævne mellemrum. Hvis din konto er inaktiv i mere end 18 måneder (regnet fra din seneste registrering i appen), sletter vi den på grund af inaktivitet. Faktureringsoplysninger for abonnementer opbevares i det tidsrum, som skatte- og regnskabslovgivningen kræver.\u003c/p>\n\n  \u003ch2>10. Dine rettigheder\u003c/h2>\n  \u003cp>Du kan få indsigt i dine oplysninger, få dem berigtiget (ved at redigere din profil), eksportere dem (Indstillinger → »Eksportér mine data« og, hvis du har modulet Bodybuilding, »Download mine Bodybuilding-data«), anmode om sletning (knappen »Slet min konto«), gøre indsigelse mod eller anmode om begrænsning af behandlingen, anmode om dataportabilitet og til enhver tid trække dit samtykke tilbage. Skriv til os på cestafitness@gmail.com, så svarer vi inden for den lovbestemte frist (én måned).\u003c/p>\n  \u003cp>Hvis du mener, at vi ikke har behandlet dine oplysninger korrekt, kan du indgive en klage til den spanske databeskyttelsesmyndighed (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Sikkerhed\u003c/h2>\n  \u003cp>Kommunikationen er krypteret, adgangskoderne gemmes krypteret, og hver bruger kan kun få adgang til sine egne oplysninger gennem adgangsregler i databasen. Hvis der skulle opstå et brud på persondatasikkerheden, som berører dig, ville vi underrette dig og give tilsynsmyndigheden besked inden for de lovbestemte frister.\u003c/p>\n\n  \u003ch2>12. Mindreårige\u003c/h2>\n  \u003cp>cesta. henvender sig ikke til børn under 18 år, og du må ikke oprette en konto, hvis du ikke er fyldt 18. Hvis du bruger afsnittene Baby eller Familie, behandler vi de oplysninger om mindreårige, du indtaster, på dit ansvar som mor, far eller værge og kun for at tilbyde dig disse funktioner.\u003c/p>\n\n  \u003ch2>13. Lagring på din enhed (cookies)\u003c/h2>\n  \u003cp>Vi bruger ingen reklame- eller sporingscookies. Vi gemmer kun oplysninger på din enhed, som er strengt nødvendige for, at appen fungerer: din session, sproget, dine præferencer og en kopi til brug offline. Derfor viser vi ikke en cookiemeddelelse. Fejlrapporterne fra Sentry er tekniske og bruges ikke til reklame.\u003c/p>\n\n  \u003ch2>13 bis. Modulet Bodybuilding: styrket beskyttelse af sundhedsoplysninger\u003c/h2>\n  \u003cp>\u003cstrong>Hvilke data.\u003c/strong> Kun hvis du tegner modulet og selv indtaster dem: stoffets navn, indtagelsesvej, dosis, dato, hyppighed og injektionssted, noter, den angivne halveringstid, dit lager (mængder og udløbsdatoer), værdierne fra dine blodprøver og deres referenceintervaller, dine daglige trivselsscorer, tegningsdatoen og de lægerapporter, du uploader. Det er sundhedsoplysninger, en særlig kategori i databeskyttelsesforordningen (GDPR) (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Retsgrundlag.\u003c/strong> Dit udtrykkelige samtykke (art. 9, stk. 2, litra a, i GDPR), som du giver ved at markere feltet, når du tegner modulet. Du kan når som helst trække det tilbage ved at slette dine moduldata; tilbagetrækningen påvirker ikke tidligere behandling. Vi gemmer datoen og versionen af den tekst, du har samtykket til, som bevis.\u003c/p>\n  \u003cp>\u003cstrong>Formål og modtagere.\u003c/strong> Kun for at levere modulet (log, kalender, kurver og rapporter). Vi bruger dem ikke til reklame eller profilering, vi sælger dem ikke, og tilknyttede trænere, venner og Fællesskabet kan ikke se dem. AI-chatten modtager ikke dine registreringer; den modtager kun de beskeder, du skriver i chatten. Supabase opbevarer dem som databehandler; betalinger behandles af Stripe, som ikke modtager disse data. Hvis du nævner et stof i chatten, sendes den tekst til den AI-udbyder, der behandler chatten (Google Gemini); skriv ikke oplysninger, du ikke vil dele.\u003c/p>\n  \u003cp>\u003cstrong>Sikkerhed og opbevaring.\u003c/strong> Tabeller med adgang begrænset til din bruger og et privat lager til dine rapporter, med kryptering under overførsel og i hvile. De opbevares, så længe du bruger modulet, og indtil du sletter dem, eller i op til 18 måneders inaktivitet på kontoen. Når du sletter din konto, slettes også dine registreringer og lægerapporter, og ethvert aktivt abonnement opsiges.\u003c/p>\n  \u003cp>\u003cstrong>Dine rettigheder og mindreårige.\u003c/strong> Du kan få indsigt i, berigtige og slette disse data i selve modulet og udøve dine øvrige rettigheder som forklaret i afsnit 10. Modulet er forbudt for personer under 18 år.\u003c/p>\n\n  \u003ch2>14. Sundhedsadvarsel\u003c/h2>\n  \u003cp>cesta. er ikke et medicinsk udstyr og erstatter ikke rådgivning fra en læge, klinisk diætist eller træner. Hvis du er gravid, ammer, har en sygdom eller er i behandling, bør du rådføre dig med en fagperson, før du ændrer din kost eller din fysiske aktivitet. Beregningerne og AI'ens skøn er vejledende.\u003c/p>\n\n  \u003ch2>15. Ændringer af denne politik\u003c/h2>\n  \u003cp>Hvis vi ændrer noget væsentligt, giver vi dig besked i forvejen i appen og beder dig igen om samtykke, når loven kræver det.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","fi":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Päivitetty viimeksi: 25.9.2026\u003c/p>\n  \u003cp>\u003cstrong>Tiivistelmä:\u003c/strong> cesta. käsittelee terveystietoja (paino, kehon mitat, harjoitukset, syke), joita yleinen tietosuoja-asetus (GDPR) pitää erityisiin henkilötietoryhmiin kuuluvina tietoina. Käytämme niitä vain palvelun tarjoamiseen sinulle, emme koskaan mainontaan emmekä myy niitä kolmansille osapuolille.\u003c/p>\n\n  \u003ch2>1. Kuka on rekisterinpitäjä\u003c/h2>\n  \u003cp>Tietojesi rekisterinpitäjä on \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Jos sinulla on kysyttävää yksityisyydestä, kirjoita osoitteeseen cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Mitä tietoja keräämme\u003c/h2>\n  \u003cp>\u003cstrong>Tili ja profiili:\u003c/strong> sähköpostiosoite, salasana (tallennetaan salattuna), käyttäjänimi, paino, pituus, ikä, sukupuoli, aktiivisuustaso, tavoite ja kieli.\u003c/p>\n  \u003cp>\u003cstrong>Terveys ja fyysinen kunto:\u003c/strong> painon ja mittojen historia, kirjatut ruokalistat ja elintarvikkeet, paastoaminen, harjoitukset (sarjat, toistot, painot, tauot), syke, jos yhdistät sykemittarin, sekä askeleet, paino tai kalorit, jos tuot tietoja terveyssovelluksestasi tai Health Connectista. Jos käytät Raskaus- tai Vauva-osioita, niihin kirjaamasi tiedot (raskausviikko, vauvan ikä, muistiinpanot).\u003c/p>\n  \u003cp>\u003cstrong>Valokuvat ja sisältö:\u003c/strong> lataamasi tai tekoälyllä analysoimasi valokuvat sekä keskusteluviestit.\u003c/p>\n  \u003cp>\u003cstrong>Suhde valmentajiin, ystäviin ja yhteisöön:\u003c/strong> pyynnöt, yhteydet ja se, mitä jaat heidän kanssaan (ks. kohta 5).\u003c/p>\n  \u003cp>\u003cstrong>Kutsu- ja avustusohjelma:\u003c/strong> kutsukoodisi, kutsumasi käyttäjät ja tietokantaan lisäämäsi elintarvikkeet.\u003c/p>\n  \u003cp>\u003cstrong>Tekniset tiedot ja käyttötiedot:\u003c/strong> laitteen ja selaimen tyyppi, IP-osoite, kieli, sovelluksen virhelokit ja perustason käyttöloki (mitä näyttöjä avaat ja missä rekisteröitymisen vaiheessa keskeytät, ilman mitään terveystietoja ja ilman Kehonrakennus-moduulin näyttöä). Jos olet kirjautunut sisään, käyttöloki yhdistetään käyttäjääsi. Niiden avulla sovellus toimii, virheet voidaan korjata ja sovellusta voidaan parantaa. Oikeusperuste: oikeutettu etumme.\u003c/p>\n  \u003cp>\u003cstrong>Ilmoitukset:\u003c/strong> jos otat ne käyttöön, tallennamme laitteesi teknisen tunnisteen niiden lähettämistä varten. Jos otat käyttöön myös putken muistutuksen, tallennamme lisäksi valitsemasi kellonajan, aikavyöhykkeesi, nykyisen putkesi ja viimeisimmän kirjauksesi päivämäärän, jotta voimme muistuttaa sinua ajoissa. Oikeusperuste: suostumuksesi (selaimessa tai puhelimessa antamasi lupa sekä muistutuksen kytkin), jonka voit peruuttaa milloin tahansa poistamalla ne käytöstä.\u003c/p>\n  \u003cp>\u003cstrong>Maksut:\u003c/strong> jos tilaat maksullisen tilauksen, veloituksen hoitaa Stripe. Emme näe emmekä tallenna korttitietojasi; saamme vain tilauksesi tilan.\u003c/p>\n\n  \u003ch2>3. Mihin käytämme tietoja ja millä oikeusperusteella\u003c/h2>\n  \u003cp>\u003cstrong>Palvelun tarjoaminen sinulle\u003c/strong> (tilisi luominen, kalori- ja makroravinnetavoitteidesi laskeminen, ostoslistasi laatiminen, edistymisesi näyttäminen, tilauksesi hallinta). Oikeusperuste: sopimuksen täyttäminen.\u003c/p>\n  \u003cp>\u003cstrong>Terveystietojesi käsittely.\u003c/strong> Oikeusperuste: nimenomainen suostumuksesi, jonka annat tiliä luodessasi ja jonka voit peruuttaa milloin tahansa poistamalla tilisi. Jos et anna sitä, emme voi tarjota sinulle palvelua.\u003c/p>\n  \u003cp>\u003cstrong>Tekoälytoiminnot\u003c/strong> (elintarvikkeiden tunnistaminen valokuvasta, ravitsemuskeskustelu, edistymisyhteenvedot). Oikeusperuste: suostumuksesi toimintoa käyttäessäsi.\u003c/p>\n  \u003cp>\u003cstrong>Tietoturva, sisällön moderointi ja virheiden korjaaminen.\u003c/strong> Oikeusperuste: oikeutettu etumme pitää sovellus turvallisena ja toiminnassa.\u003c/p>\n  \u003cp>\u003cstrong>Lakisääteiset velvoitteet\u003c/strong> (laskutus, viranomaisten pyynnöt). Oikeusperuste: lakisääteisen velvoitteen noudattaminen.\u003c/p>\n  \u003cp>Emme koskaan käytä tietojasi mainontaan emmekä myy niitä.\u003c/p>\n\n  \u003ch2>4. Automaattinen päätöksenteko ja tekoäly\u003c/h2>\n  \u003cp>Tekoälyn arviot (annoksen kalorit, keskusteluehdotukset) ovat suuntaa-antavia ja voivat sisältää virheitä. Sinua koskevia oikeusvaikutuksia tuottavia päätöksiä ei tehdä pelkästään automaattisen käsittelyn perusteella. Tarkista aina, mitä tekoäly sinulle ehdottaa.\u003c/p>\n\n  \u003ch2>5. Yhteisö, ystävät ja valmentajat\u003c/h2>\n  \u003cp>Profiilisi on \u003cstrong>oletuksena yksityinen\u003c/strong>. Jos teet siitä julkisen tai hyväksyt ystävyyden, kyseinen henkilö näkee käyttäjänimesi, ruokalistasi ja valokuvasi.\u003c/p>\n  \u003cp>Jos \u003cstrong>liityt valmentajan yhteyteen\u003c/strong>, valmentaja voi nähdä tiedot, jotka jaat hänen kanssaan (esimerkiksi edistymisesi, ruokalistasi ja harjoituksesi sekä keskusteluviestit), jotta hän voi neuvoa sinua. Sinä päätät, liitytkö valmentajan yhteyteen, ja voit katkaista yhteyden milloin haluat. Valmentajan ja urheilijan väliset maksut hoidetaan sovelluksen ulkopuolella, eikä cesta. ole niissä osapuolena.\u003c/p>\n\n  \u003ch2>6. Ketkä muut saavat tietosi\u003c/h2>\n  \u003cp>Jaamme vain tarpeelliset tiedot palveluntarjoajille, jotka toimivat puolestamme (henkilötietojen käsittelijät):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — tietokanta, todennus, valokuvien tallennus ja palvelintoiminnot.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — vain jos käytät valokuva-analyysiä tai tekoälykeskustelua, sekä lataamiesi valokuvien automaattiseen moderointiin (kohta 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — tilausten veloitus.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — kun haet tuotetta nimellä tai viivakoodilla, haku lähetetään sinne tuotteen tietojen noutamiseksi.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — vastaanottaa sovelluksen teknisiä virheraportteja (palvelimet Euroopan unionissa).\u003c/p>\n  \u003cp>\u003cstrong>Verkkopalvelinhotelli ja sisällönjakeluverkot\u003c/strong> (Netlify tai GitHub Pages, jsDelivr, cdnjs) — toimittavat sovelluksen ja sen kirjastot ja näkevät siten IP-osoitteesi.\u003c/p>\n  \u003cp>Liikkeiden tekniikkavideoiden linkit avaavat ulkoisen hakukoneen (YouTube) vain, kun itse painat niitä.\u003c/p>\n\n  \u003ch2>7. Tietojen siirrot kolmansiin maihin\u003c/h2>\n  \u003cp>Tietosi tallennetaan Supabasen palvelimille Lontoossa (Yhdistynyt kuningaskunta), jota koskee Euroopan komission tietosuojan riittävyyttä koskeva päätös. Google ja Stripe voivat käsitellä tietoja Euroopan talousalueen ulkopuolella (esimerkiksi Yhdysvalloissa) EU:n ja Yhdysvaltojen välisen tietosuojakehyksen tai komission hyväksymien vakiosopimuslausekkeiden nojalla.\u003c/p>\n\n  \u003ch2>8. Sisällön ja valokuvien moderointi\u003c/h2>\n  \u003cp>Jokainen lataamasi valokuva — profiilikuva, edistymiskuva, ruoka-annosten kuva, lisäämiesi tuotteiden kuva tai keskustelussa lähetetty kuva — käy läpi tekoälyyn perustuvan automaattisen moderointisuodattimen (Google Gemini) ennen hyväksymistä.\u003c/p>\n  \u003cp>Hylkäämme emmekä tallenna kuvaa, joka sisältää: alastomuutta tai selkeää tai vihjailevaa seksuaalista sisältöä; graafista väkivaltaa tai häiritsevää sisältöä; vihasymboleja tai vihamielisiä, rasistisia tai homofobisia viestejä; tai mitä tahansa laitonta sisältöä, mukaan lukien sisältö, joka voisi muodostaa lasten seksuaalista hyväksikäyttöä tai riistoa. Jos valokuva hylätään, tiedosto poistetaan, eikä sitä koskaan tallenneta.\u003c/p>\n  \u003cp>Tekniikkavideoiden hakukone sallii vain todellisten liikenimien haun suljetusta luettelosta; se ei koskaan lähetä vapaata tekstiä tarkistamatta.\u003c/p>\n  \u003cp>Jos havaitsemme tai meille ilmoitetaan tilistä, joka lataa toistuvasti kiellettyä sisältöä, voimme jäädyttää tai poistaa sen ja säilyttää ehdottoman välttämättömän todistusaineiston, jos laki velvoittaa meidät ilmoittamaan siitä viranomaisille. Voit ilmoittaa sopimattomasta sisällöstä asetusten kohdassa ”Ilmoita virheestä” tai kirjoittamalla osoitteeseen cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Kuinka kauan säilytämme tietojasi\u003c/h2>\n  \u003cp>Niin kauan kuin tilisi on aktiivinen. Jos poistat sen, tietosi poistetaan pysyvästi ja peruuttamattomasti tietokannastamme; ne voivat säilyä vain varmuuskopioissa, joita säilytämme enintään 8 viikkoa ja jotka ylikirjoitetaan säännöllisesti. Jos tilisi on ollut käyttämättömänä yli 18 kuukautta (laskettuna viimeisestä sovellukseen tekemästäsi kirjauksesta), poistamme sen käyttämättömyyden vuoksi. Tilausten laskutustietoja säilytetään niin kauan kuin verolainsäädäntö ja kirjanpitolainsäädäntö edellyttävät.\u003c/p>\n\n  \u003ch2>10. Oikeutesi\u003c/h2>\n  \u003cp>Voit tutustua tietoihisi, oikaista ne (muokkaamalla profiiliasi), viedä ne (Asetukset → ”Vie omat tietoni” ja, jos sinulla on Kehonrakennus-moduuli, ”Lataa Kehonrakennus-tietoni”), pyytää niiden poistamista (painike ”Poista tilini”), vastustaa käsittelyä tai pyytää sen rajoittamista, pyytää tietojen siirtämistä järjestelmästä toiseen ja peruuttaa suostumuksesi milloin tahansa. Kirjoita meille osoitteeseen cestafitness@gmail.com, niin vastaamme lakisääteisessä määräajassa (yksi kuukausi).\u003c/p>\n  \u003cp>Jos katsot, ettemme ole käsitelleet tietojasi asianmukaisesti, voit tehdä valituksen Espanjan tietosuojaviranomaiselle (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Tietoturva\u003c/h2>\n  \u003cp>Tietoliikenne on salattua, salasanat tallennetaan salattuina, ja jokainen käyttäjä pääsee käsiksi vain omiin tietoihinsa tietokannan pääsynhallintasääntöjen avulla. Jos sinua koskeva tietoturvaloukkaus tapahtuisi, ilmoittaisimme siitä sinulle ja valvontaviranomaiselle lakisääteisissä määräajoissa.\u003c/p>\n\n  \u003ch2>12. Alaikäiset\u003c/h2>\n  \u003cp>cesta. ei ole suunnattu alle 18-vuotiaille, eikä sinun tule luoda tiliä, jos et ole täyttänyt 18 vuotta. Jos käytät Vauva- tai Perhe-osioita, käsittelemme antamiasi alaikäisten tietoja sinun vastuullasi äitinä, isänä tai huoltajana ja vain näiden toimintojen tarjoamiseksi sinulle.\u003c/p>\n\n  \u003ch2>13. Tallennus laitteellesi (evästeet)\u003c/h2>\n  \u003cp>Emme käytä mainos- tai seurantaevästeitä. Tallennamme laitteellesi vain sellaisia tietoja, jotka ovat ehdottoman välttämättömiä sovelluksen toiminnalle: istuntosi, kielen, asetuksesi ja kopion offline-käyttöä varten. Siksi emme näytä evästeilmoitusta. Sentryn virheraportit ovat teknisiä, eikä niitä käytetä mainontaan.\u003c/p>\n\n  \u003ch2>13 bis. Kehonrakennus-moduuli: terveystietojen tehostettu suojaus\u003c/h2>\n  \u003cp>\u003cstrong>Mitä tietoja.\u003c/strong> Vain jos tilaat moduulin ja syötät tiedot itse: aineen nimi, antotapa, annos, päivämäärä, tiheys ja pistoskohta, muistiinpanot, ilmoittamasi puoliintumisaika, varastosi (määrät ja vanhenemispäivät), laboratoriokokeidesi arvot ja niiden viitealueet, päivittäiset hyvinvointipisteesi, tilauspäivämäärä ja lataamasi lääkärinlausunnot. Nämä ovat terveystietoja, jotka kuuluvat yleisen tietosuoja-asetuksen (GDPR) erityisiin henkilötietoryhmiin (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Oikeusperuste.\u003c/strong> Nimenomainen suostumuksesi (GDPR art. 9(2)(a)), jonka annat rastittamalla ruudun tilausta tehdessäsi. Voit peruuttaa sen milloin tahansa poistamalla moduulin tietosi; peruuttaminen ei vaikuta aiempaan käsittelyyn. Säilytämme todisteena päivämäärän ja sen tekstiversion, johon suostuit.\u003c/p>\n  \u003cp>\u003cstrong>Tarkoitus ja vastaanottajat.\u003c/strong> Vain moduulin tarjoamiseksi sinulle (kirjaus, kalenteri, käyrät ja raportit). Emme käytä tietoja mainontaan tai profilointiin, emme myy niitä, eivätkä linkitetyt valmentajat, ystävät tai Yhteisö näe niitä. Tekoälychatti ei saa kirjauksiasi; se saa vain viestit, jotka kirjoitat chattiin. Supabase tallentaa tiedot henkilötietojen käsittelijänä; maksut käsittelee Stripe, joka ei saa näitä tietoja. Jos mainitset aineen chatissa, teksti lähetetään chatin käsittelevälle tekoälypalveluntarjoajalle (Google Gemini); älä kirjoita tietoja, joita et halua jakaa.\u003c/p>\n  \u003cp>\u003cstrong>Tietoturva ja säilytys.\u003c/strong> Taulukot, joihin pääsy on rajattu käyttäjääsi, ja yksityinen tallennustila raporteillesi, salauksella siirron aikana ja levossa. Tiedot säilytetään niin kauan kuin käytät moduulia ja kunnes poistat ne, tai enintään 18 kuukautta tilin passiivisuutta. Kun poistat tilisi, myös kirjauksesi ja lääkärinlausuntosi poistetaan ja kaikki aktiiviset tilaukset peruutetaan.\u003c/p>\n  \u003cp>\u003cstrong>Oikeutesi ja alaikäiset.\u003c/strong> Voit tutustua näihin tietoihin, oikaista ja poistaa ne itse moduulissa sekä käyttää muita oikeuksiasi kohdassa 10 kuvatulla tavalla. Moduuli on kielletty alle 18-vuotiailta.\u003c/p>\n\n  \u003ch2>14. Terveysvaroitus\u003c/h2>\n  \u003cp>cesta. ei ole lääkinnällinen laite eikä korvaa lääkärin, ravitsemusterapeutin tai valmentajan neuvoja. Jos olet raskaana, imetät, sairastat jotakin tai saat hoitoa, käänny ammattilaisen puoleen ennen kuin muutat ruokavaliotasi tai fyysistä aktiivisuuttasi. Laskelmat ja tekoälyn arviot ovat suuntaa-antavia.\u003c/p>\n\n  \u003ch2>15. Muutokset tähän käytäntöön\u003c/h2>\n  \u003cp>Jos muutamme jotakin olennaista, ilmoitamme siitä sinulle sovelluksessa etukäteen ja pyydämme suostumuksesi uudelleen, kun laki sitä edellyttää.\u003c/p>\n\n  \u003ch2>16. Yhteystiedot\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","cs":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Poslední aktualizace: 25. 9. 2026\u003c/p>\n  \u003cp>\u003cstrong>Shrnutí:\u003c/strong> cesta. zpracovává údaje o zdravotním stavu (hmotnost, tělesné míry, tréninky, srdeční tep), které GDPR považuje za zvláštní kategorii osobních údajů. Využíváme je výhradně k poskytování služby, nikdy k reklamním účelům ani k jejich prodeji třetím osobám.\u003c/p>\n\n  \u003ch2>1. Kdo je správcem\u003c/h2>\n  \u003cp>Správcem vašich osobních údajů je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). S jakýmkoli dotazem týkajícím se ochrany soukromí se obracejte na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Jaké údaje shromažďujeme\u003c/h2>\n  \u003cp>\u003cstrong>Účet a profil:\u003c/strong> e-mail, heslo (uložené v zašifrované podobě), uživatelské jméno, hmotnost, výška, věk, pohlaví, úroveň aktivity, cíl a jazyk.\u003c/p>\n  \u003cp>\u003cstrong>Zdraví a fyzická kondice:\u003c/strong> historie hmotnosti a tělesných měr, zaznamenané jídelníčky a potraviny, půst, tréninky (série, opakování, zátěže, odpočinek), srdeční tep, pokud připojíte hrudní pás či jiný snímač, a kroky, hmotnost nebo kalorie, pokud importujete údaje ze své zdravotní aplikace nebo z Health Connect. Pokud používáte sekce Těhotenství nebo Miminko, údaje, které do nich zapíšete (týden těhotenství, věk miminka, poznámky).\u003c/p>\n  \u003cp>\u003cstrong>Fotografie a obsah:\u003c/strong> fotografie, které nahrajete nebo které analyzujete pomocí umělé inteligence, a zprávy v chatu.\u003c/p>\n  \u003cp>\u003cstrong>Vztahy s trenéry, přáteli a komunitou:\u003c/strong> žádosti, propojení a vše, co s nimi sdílíte (viz bod 5).\u003c/p>\n  \u003cp>\u003cstrong>Program pozvánek a příspěvků:\u003c/strong> váš pozvánkový kód, pozvaní uživatelé a potraviny, které do databáze přispějete.\u003c/p>\n  \u003cp>\u003cstrong>Technické údaje a údaje o používání:\u003c/strong> typ zařízení a prohlížeče, IP adresa, jazyk, záznamy o chybách aplikace a základní záznam o používání (které obrazovky otevíráte a v kterém kroku registrace odcházíte, bez jakéhokoli zdravotního obsahu a bez obrazovky modulu Kulturistika). Pokud jste přihlášeni, je tento záznam o používání spojen s vaším uživatelem. Slouží k tomu, aby aplikace fungovala, aby bylo možné opravovat chyby a aby se aplikace zlepšovala. Právní základ: náš oprávněný zájem.\u003c/p>\n  \u003cp>\u003cstrong>Oznámení:\u003c/strong> pokud je zapnete, uchováváme technický identifikátor vašeho zařízení, abychom vám je mohli posílat. Pokud zapnete také připomínku série, uchováváme navíc vámi zvolený čas, vaše časové pásmo, vaši aktuální sérii a datum vašeho posledního záznamu, abychom vám mohli včas připomenout. Právní základ: váš souhlas (oprávnění, které udělujete ve svém prohlížeči nebo v telefonu, a přepínač připomínky), který můžete kdykoli odvolat jejich vypnutím.\u003c/p>\n  \u003cp>\u003cstrong>Platby:\u003c/strong> pokud si zakoupíte placený tarif, platbu zpracovává Stripe. Údaje o vaší platební kartě nevidíme ani neukládáme; obdržíme pouze informaci o stavu vašeho předplatného.\u003c/p>\n\n  \u003ch2>3. K čemu je používáme a na jakém právním základě\u003c/h2>\n  \u003cp>\u003cstrong>Poskytování služby\u003c/strong> (vytvoření vašeho účtu, výpočet vašich cílů v oblasti kalorií a makroživin, vytvoření nákupního seznamu, zobrazení vašeho pokroku, správa vašeho předplatného). Právní základ: plnění smlouvy.\u003c/p>\n  \u003cp>\u003cstrong>Zpracování údajů o vašem zdravotním stavu.\u003c/strong> Právní základ: váš výslovný souhlas, který nám udělíte při vytvoření účtu a který můžete kdykoli odvolat smazáním svého účtu. Pokud jej neudělíte, nemůžeme vám službu poskytovat.\u003c/p>\n  \u003cp>\u003cstrong>Funkce umělé inteligence\u003c/strong> (rozpoznání potravin na fotografii, výživový chat, shrnutí pokroku). Právní základ: váš souhlas při použití dané funkce.\u003c/p>\n  \u003cp>\u003cstrong>Zabezpečení, moderace obsahu a oprava chyb.\u003c/strong> Právní základ: náš oprávněný zájem na zajištění bezpečného a funkčního provozu aplikace.\u003c/p>\n  \u003cp>\u003cstrong>Zákonné povinnosti\u003c/strong> (fakturace, požadavky orgánů veřejné moci). Právní základ: splnění právní povinnosti.\u003c/p>\n  \u003cp>Vaše údaje nikdy nepoužíváme k reklamním účelům ani je neprodáváme.\u003c/p>\n\n  \u003ch2>4. Automatizovaná rozhodnutí a umělá inteligence\u003c/h2>\n  \u003cp>Odhady umělé inteligence (kalorie jídla, návrhy v chatu) jsou pouze orientační a mohou obsahovat chyby. Nejsou přijímána žádná rozhodnutí s právními účinky vůči vám, která by vycházela výhradně z automatizovaného zpracování. Vždy si zkontrolujte, co vám umělá inteligence navrhuje.\u003c/p>\n\n  \u003ch2>5. Komunita, přátelé a trenéři\u003c/h2>\n  \u003cp>Váš profil je \u003cstrong>ve výchozím nastavení soukromý\u003c/strong>. Pokud jej zveřejníte nebo přijmete přátelství, tato osoba uvidí vaše uživatelské jméno, jídelníčky a fotografie.\u003c/p>\n  \u003cp>Pokud se \u003cstrong>propojíte s trenérem\u003c/strong>, bude moci vidět informace, které s ním sdílíte (například váš pokrok, jídelníčky a tréninky a zprávy v chatu), aby vás mohl poradensky vést. O propojení rozhodujete vy a kdykoli je můžete zrušit. Platby mezi trenérem a svěřencem probíhají mimo aplikaci a cesta. do nich nezasahuje.\u003c/p>\n\n  \u003ch2>6. Kdo další vaše údaje získává\u003c/h2>\n  \u003cp>Nezbytné údaje sdílíme pouze s poskytovateli, kteří jednají naším jménem jako zpracovatelé:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — databáze, autentizace, ukládání fotografií a serverové funkce.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — pouze pokud používáte analýzu fotografií nebo chat s umělou inteligencí, a dále k automatické moderaci fotografií, které nahráváte (bod 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — zpracování plateb za předplatné.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — když vyhledáváte produkt podle názvu nebo čárového kódu, je toto vyhledávání odesláno za účelem získání údajů o něm.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — přijímá technické zprávy o chybách aplikace (servery v Evropské unii).\u003c/p>\n  \u003cp>\u003cstrong>Webhosting a sítě pro doručování obsahu\u003c/strong> (Netlify nebo GitHub Pages, jsDelivr, cdnjs) — poskytují aplikaci a její knihovny a přitom vidí vaši IP adresu.\u003c/p>\n  \u003cp>Odkazy na videa s technikou cviků otevírají externí vyhledávač (YouTube) pouze tehdy, když na ně kliknete.\u003c/p>\n\n  \u003ch2>7. Mezinárodní předávání údajů\u003c/h2>\n  \u003cp>Vaše údaje jsou uloženy na serverech Supabase v Londýně (Spojené království), pro které existuje rozhodnutí Evropské komise o odpovídající ochraně. Google a Stripe mohou zpracovávat údaje mimo Evropský hospodářský prostor (například ve Spojených státech) na základě Rámce EU–USA pro ochranu osobních údajů nebo standardních smluvních doložek schválených Komisí.\u003c/p>\n\n  \u003ch2>8. Moderace obsahu a fotografií\u003c/h2>\n  \u003cp>Každá fotografie, kterou nahrajete — profilová fotografie, fotografie pokroku, jídel, produktů, k nimž přispíváte, nebo fotografie odeslaná v chatu — projde před přijetím automatickým moderačním filtrem využívajícím umělou inteligenci (Google Gemini).\u003c/p>\n  \u003cp>Odmítáme a neukládáme žádný obraz, který obsahuje: nahotu nebo explicitní či sugestivní sexuální obsah; grafické násilí nebo znepokojivý obsah; symboly nebo sdělení nenávisti, rasistická či homofobní; nebo jakýkoli protiprávní obsah, včetně jakéhokoli obsahu, který by mohl představovat sexuální vykořisťování nebo zneužívání dětí. Pokud je fotografie odmítnuta, soubor je zahozen a vůbec se neuloží.\u003c/p>\n  \u003cp>Vyhledávač videí s technikou umožňuje vyhledávat pouze skutečné názvy cviků z uzavřeného seznamu; nikdy neodesílá neověřený volný text.\u003c/p>\n  \u003cp>Pokud zjistíme nebo nám je oznámeno, že účet opakovaně nahrává zakázaný obsah, můžeme jej pozastavit nebo zrušit a uchovat důkazy v rozsahu, který je nezbytně nutný, pokud nám zákon ukládá povinnost oznámit je orgánům veřejné moci. Nevhodný obsah můžete nahlásit prostřednictvím funkce „Nahlásit chybu“ v nastavení nebo napsáním na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Jak dlouho vaše údaje uchováváme\u003c/h2>\n  \u003cp>Po dobu, po kterou je váš účet aktivní. Pokud jej smažete, vaše údaje budou z naší databáze trvale a nevratně odstraněny; mohou zůstat pouze v záložních kopiích, které uchováváme nejvýše 8 týdnů a které se pravidelně přepisují. Pokud je váš účet neaktivní déle než 18 měsíců (počítáno od vašeho posledního záznamu v aplikaci), z důvodu neaktivity jej zrušíme. Fakturační údaje k předplatnému uchováváme po dobu, kterou vyžadují daňové a obchodní předpisy.\u003c/p>\n\n  \u003ch2>10. Vaše práva\u003c/h2>\n  \u003cp>Máte právo na přístup ke svým údajům, na jejich opravu (úpravou svého profilu), na jejich export (Nastavení → „Exportovat moje data“ a, pokud máte modul Kulturistika, „Stáhnout má data z Kulturistiky“), na jejich výmaz (tlačítko „Smazat můj účet“), právo vznést námitku proti zpracování nebo požadovat jeho omezení, právo na přenositelnost údajů a právo kdykoli odvolat svůj souhlas. Napište nám na cestafitness@gmail.com a odpovíme vám v zákonné lhůtě (jeden měsíc).\u003c/p>\n  \u003cp>Pokud se domníváte, že jsme s vašimi údaji nenakládali správně, můžete podat stížnost u Španělské agentury pro ochranu údajů (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Zabezpečení\u003c/h2>\n  \u003cp>Komunikace je šifrována, hesla jsou ukládána v zašifrované podobě a každý uživatel má přístup pouze ke svým vlastním údajům prostřednictvím pravidel přístupu v databázi. V případě porušení zabezpečení, které by se vás týkalo, vás o něm budeme informovat a ve stanovených zákonných lhůtách upozorníme dozorový úřad.\u003c/p>\n\n  \u003ch2>12. Nezletilé osoby\u003c/h2>\n  \u003cp>cesta. není určena osobám mladším 18 let a pokud jim ještě není 18 let, nesmíte si vytvořit účet. Pokud používáte sekce Miminko nebo Rodina, zpracováváme údaje nezletilých, které zadáte, na vaši odpovědnost jako matky, otce či zákonného zástupce, a to výhradně za účelem poskytování těchto funkcí.\u003c/p>\n\n  \u003ch2>13. Ukládání v zařízení (cookies)\u003c/h2>\n  \u003cp>Nepoužíváme reklamní ani sledovací cookies. Ve vašem zařízení ukládáme pouze informace nezbytně nutné pro fungování aplikace: vaši relaci, jazyk, vaše předvolby a kopii pro používání offline. Z tohoto důvodu vám nezobrazujeme upozornění na cookies. Zprávy o chybách ze Sentry jsou technické povahy a nepoužívají se k reklamě.\u003c/p>\n\n  \u003ch2>13 bis. Modul Kulturistika: posílená ochrana údajů o zdraví\u003c/h2>\n  \u003cp>\u003cstrong>Jaké údaje.\u003c/strong> Pouze pokud si modul předplatíš a zadáš je sám/sama: název látky, cesta podání, dávka, datum, frekvence a místo vpichu, poznámky, uvedený poločas rozpadu, tvoje zásoby (množství a expirace), hodnoty tvých rozborů a jejich referenční rozmezí, tvoje hodnocení denní pohody, datum uzavření předplatného a lékařské zprávy, které nahraješ. Jde o údaje o zdraví, zvláštní kategorii podle GDPR (čl. 9).\u003c/p>\n  \u003cp>\u003cstrong>Právní základ.\u003c/strong> Váš výslovný souhlas (čl. 9 odst. 2 písm. a) GDPR), který udělujete zaškrtnutím políčka při uzavření předplatného. Můžete jej kdykoli odvolat smazáním svých údajů v modulu; odvolání nemá vliv na dřívější zpracování. Jako důkaz uchováváme datum a verzi textu, s nímž jste souhlasili.\u003c/p>\n  \u003cp>\u003cstrong>Účel a příjemci.\u003c/strong> Pouze za účelem poskytování modulu (evidence, kalendář, křivky a zprávy). Nepoužíváme je pro reklamu ani profilování, neprodáváme je a propojení trenéři, přátelé ani Komunita je nevidí. Chat s AI vaše záznamy nedostává; dostává pouze zprávy, které do chatu napíšete. Ukládá je Supabase jako zpracovatel; platby zpracovává Stripe, který tyto údaje nedostává. Pokud v chatu zmíníš látku, tento text se odešle poskytovateli AI, který chat zpracovává (Google Gemini); nepiš údaje, které nechceš sdílet.\u003c/p>\n  \u003cp>\u003cstrong>Zabezpečení a uchovávání.\u003c/strong> Tabulky s přístupem omezeným na vašeho uživatele a soukromé úložiště pro vaše zprávy, se šifrováním při přenosu i v klidu. Uchovávají se po dobu, kdy modul používáte, a dokud je nesmažete, nebo nejdéle 18 měsíců nečinnosti účtu. Při smazání účtu se smažou také vaše záznamy a lékařské zprávy a zruší se jakékoli aktivní předplatné.\u003c/p>\n  \u003cp>\u003cstrong>Vaše práva a nezletilí.\u003c/strong> Tyto údaje můžete přistupovat, opravovat a mazat přímo v modulu a ostatní práva uplatňovat způsobem popsaným v části 10. Modul je zakázán osobám mladším 18 let.\u003c/p>\n\n  \u003ch2>14. Zdravotní upozornění\u003c/h2>\n  \u003cp>cesta. není zdravotnický prostředek ani nenahrazuje radu lékaře, nutričního terapeuta či trenéra. Pokud jste těhotná, kojíte, trpíte nemocí nebo podstupujete léčbu, poraďte se před změnou stravy či fyzické aktivity s odborníkem. Výpočty a odhady umělé inteligence jsou pouze orientační.\u003c/p>\n\n  \u003ch2>15. Změny těchto zásad\u003c/h2>\n  \u003cp>Pokud změníme něco podstatného, oznámíme vám to předem v aplikaci a v případech, kdy to zákon vyžaduje, vás znovu požádáme o souhlas.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","sk":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Posledná aktualizácia: 25. 9. 2026\u003c/p>\n  \u003cp>\u003cstrong>Zhrnutie:\u003c/strong> cesta. spracúva údaje o zdravotnom stave (hmotnosť, telesné miery, tréningy, srdcová frekvencia), ktoré GDPR považuje za osobitnú kategóriu osobných údajov. Používame ich výlučne na poskytovanie služby, nikdy na reklamné účely ani na ich predaj tretím stranám.\u003c/p>\n\n  \u003ch2>1. Kto je prevádzkovateľom\u003c/h2>\n  \u003cp>Prevádzkovateľom vašich osobných údajov je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). S akoukoľvek otázkou týkajúcou sa ochrany súkromia sa obráťte na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Aké údaje zbierame\u003c/h2>\n  \u003cp>\u003cstrong>Účet a profil:\u003c/strong> e-mail, heslo (uložené v zašifrovanej podobe), používateľské meno, hmotnosť, výška, vek, pohlavie, úroveň aktivity, cieľ a jazyk.\u003c/p>\n  \u003cp>\u003cstrong>Zdravie a fyzická kondícia:\u003c/strong> história hmotnosti a telesných mier, zaznamenané jedálničky a potraviny, pôst, tréningy (série, opakovania, záťaže, odpočinok), srdcová frekvencia, ak pripojíte hrudný pás alebo iný snímač, a kroky, hmotnosť alebo kalórie, ak importujete údaje zo svojej zdravotnej aplikácie alebo z Health Connect. Ak používate sekcie Tehotenstvo alebo Bábätko, údaje, ktoré do nich zapíšete (týždeň tehotenstva, vek bábätka, poznámky).\u003c/p>\n  \u003cp>\u003cstrong>Fotografie a obsah:\u003c/strong> fotografie, ktoré nahráte alebo ktoré analyzujete pomocou umelej inteligencie, a správy v chate.\u003c/p>\n  \u003cp>\u003cstrong>Vzťahy s trénermi, priateľmi a komunitou:\u003c/strong> žiadosti, prepojenia a všetko, čo s nimi zdieľate (pozri bod 5).\u003c/p>\n  \u003cp>\u003cstrong>Program pozvánok a príspevkov:\u003c/strong> váš pozývací kód, pozvaní používatelia a potraviny, ktoré prispejete do databázy.\u003c/p>\n  \u003cp>\u003cstrong>Technické údaje a údaje o používaní:\u003c/strong> typ zariadenia a prehliadača, IP adresa, jazyk, záznamy o chybách aplikácie a základný záznam o používaní (ktoré obrazovky otvárate a v ktorom kroku registrácie odchádzate, bez akéhokoľvek zdravotného obsahu a bez obrazovky modulu Kulturistika). Ak ste prihlásení, tento záznam o používaní je spojený s vaším používateľom. Slúžia na to, aby aplikácia fungovala, aby bolo možné opravovať chyby a aby sa aplikácia zlepšovala. Právny základ: náš oprávnený záujem.\u003c/p>\n  \u003cp>\u003cstrong>Oznámenia:\u003c/strong> ak ich zapnete, uchovávame technický identifikátor vášho zariadenia, aby sme vám ich mohli posielať. Ak zapnete aj pripomienku série, uchovávame navyše vami zvolený čas, vaše časové pásmo, vašu aktuálnu sériu a dátum vášho posledného záznamu, aby sme vám mohli včas pripomenúť. Právny základ: váš súhlas (oprávnenie, ktoré udeľujete vo svojom prehliadači alebo v telefóne, a prepínač pripomienky), ktorý môžete kedykoľvek odvolať ich vypnutím.\u003c/p>\n  \u003cp>\u003cstrong>Platby:\u003c/strong> ak si zakúpite platený plán, platbu spracúva Stripe. Údaje o vašej platobnej karte nevidíme ani neukladáme; dostávame iba informáciu o stave vášho predplatného.\u003c/p>\n\n  \u003ch2>3. Na čo ich používame a na akom právnom základe\u003c/h2>\n  \u003cp>\u003cstrong>Poskytovanie služby\u003c/strong> (vytvorenie vášho účtu, výpočet vašich cieľov v oblasti kalórií a makroživín, vytvorenie nákupného zoznamu, zobrazenie vášho pokroku, správa vášho predplatného). Právny základ: plnenie zmluvy.\u003c/p>\n  \u003cp>\u003cstrong>Spracúvanie údajov o vašom zdravotnom stave.\u003c/strong> Právny základ: váš výslovný súhlas, ktorý nám udelíte pri vytvorení účtu a ktorý môžete kedykoľvek odvolať zmazaním svojho účtu. Ak ho neudelíte, nemôžeme vám službu poskytovať.\u003c/p>\n  \u003cp>\u003cstrong>Funkcie umelej inteligencie\u003c/strong> (rozpoznanie potravín na fotografii, výživový chat, zhrnutia pokroku). Právny základ: váš súhlas pri použití danej funkcie.\u003c/p>\n  \u003cp>\u003cstrong>Bezpečnosť, moderovanie obsahu a oprava chýb.\u003c/strong> Právny základ: náš oprávnený záujem na zabezpečení bezpečnej a funkčnej prevádzky aplikácie.\u003c/p>\n  \u003cp>\u003cstrong>Zákonné povinnosti\u003c/strong> (fakturácia, požiadavky orgánov verejnej moci). Právny základ: splnenie zákonnej povinnosti.\u003c/p>\n  \u003cp>Vaše údaje nikdy nepoužívame na reklamné účely ani ich nepredávame.\u003c/p>\n\n  \u003ch2>4. Automatizované rozhodovanie a umelá inteligencia\u003c/h2>\n  \u003cp>Odhady umelej inteligencie (kalórie jedla, návrhy v chate) sú len orientačné a môžu obsahovať chyby. Nie sú prijímané žiadne rozhodnutia s právnymi účinkami voči vám, ktoré by vychádzali výlučne z automatizovaného spracúvania. Vždy si skontrolujte, čo vám umelá inteligencia navrhuje.\u003c/p>\n\n  \u003ch2>5. Komunita, priatelia a tréneri\u003c/h2>\n  \u003cp>Váš profil je \u003cstrong>predvolene súkromný\u003c/strong>. Ak ho zverejníte alebo prijmete priateľstvo, táto osoba uvidí vaše používateľské meno, jedálničky a fotografie.\u003c/p>\n  \u003cp>Ak sa \u003cstrong>prepojíte s trénerom\u003c/strong>, bude môcť vidieť informácie, ktoré s ním zdieľate (napríklad váš pokrok, jedálničky a tréningy a správy v chate), aby vás mohol poradensky viesť. O prepojení rozhodujete vy a môžete ho kedykoľvek zrušiť. Platby medzi trénerom a zverencom prebiehajú mimo aplikácie a cesta. do nich nezasahuje.\u003c/p>\n\n  \u003ch2>6. Kto ďalší získava vaše údaje\u003c/h2>\n  \u003cp>Nevyhnutné údaje zdieľame iba s poskytovateľmi, ktorí konajú v našom mene ako sprostredkovatelia:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — databáza, autentifikácia, ukladanie fotografií a serverové funkcie.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — iba ak používate analýzu fotografií alebo chat s umelou inteligenciou, a tiež na automatické moderovanie fotografií, ktoré nahrávate (bod 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — spracovanie platieb za predplatné.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — keď vyhľadávate produkt podľa názvu alebo čiarového kódu, toto vyhľadávanie sa odosiela na získanie údajov o ňom.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — prijíma technické správy o chybách aplikácie (servery v Európskej únii).\u003c/p>\n  \u003cp>\u003cstrong>Webhosting a siete na doručovanie obsahu\u003c/strong> (Netlify alebo GitHub Pages, jsDelivr, cdnjs) — poskytujú aplikáciu a jej knižnice a pritom vidia vašu IP adresu.\u003c/p>\n  \u003cp>Odkazy na videá s technikou cvikov otvárajú externý vyhľadávač (YouTube) iba vtedy, keď na ne kliknete.\u003c/p>\n\n  \u003ch2>7. Medzinárodné prenosy\u003c/h2>\n  \u003cp>Vaše údaje sú uložené na serveroch Supabase v Londýne (Spojené kráľovstvo), pre ktoré existuje rozhodnutie Európskej komisie o primeranosti ochrany. Google a Stripe môžu spracúvať údaje mimo Európskeho hospodárskeho priestoru (napríklad v Spojených štátoch) na základe Rámca ochrany údajov medzi EÚ a USA alebo štandardných zmluvných doložiek schválených Komisiou.\u003c/p>\n\n  \u003ch2>8. Moderovanie obsahu a fotografií\u003c/h2>\n  \u003cp>Každá fotografia, ktorú nahráte — profilová fotografia, fotografia pokroku, jedál, produktov, ktoré prispievate, alebo fotografia odoslaná v chate — prejde pred prijatím automatickým moderačným filtrom využívajúcim umelú inteligenciu (Google Gemini).\u003c/p>\n  \u003cp>Odmietame a neukladáme žiadny obraz, ktorý obsahuje: nahotu alebo explicitný či sugestívny sexuálny obsah; grafické násilie alebo znepokojujúci obsah; symboly alebo posolstvá nenávisti, rasistické či homofóbne; alebo akýkoľvek protiprávny obsah, vrátane akéhokoľvek obsahu, ktorý by mohol predstavovať sexuálne vykorisťovanie alebo zneužívanie detí. Ak je fotografia odmietnutá, súbor sa zahodí a vôbec sa neuloží.\u003c/p>\n  \u003cp>Vyhľadávač videí s technikou umožňuje vyhľadávať iba skutočné názvy cvikov z uzavretého zoznamu; nikdy neodosiela neoverený voľný text.\u003c/p>\n  \u003cp>Ak zistíme alebo nám je nahlásené, že účet opakovane nahráva zakázaný obsah, môžeme ho pozastaviť alebo zrušiť a uchovať dôkazy v rozsahu, ktorý je nevyhnutne potrebný, ak nám zákon ukladá povinnosť oznámiť ich orgánom verejnej moci. Nevhodný obsah môžete nahlásiť prostredníctvom funkcie „Nahlásiť chybu“ v nastaveniach alebo napísaním na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Ako dlho vaše údaje uchovávame\u003c/h2>\n  \u003cp>Po dobu, počas ktorej je váš účet aktívny. Ak ho zmažete, vaše údaje budú z našej databázy natrvalo a nenávratne odstránené; môžu zostať iba v záložných kópiách, ktoré uchovávame najviac 8 týždňov a ktoré sa pravidelne prepisujú. Ak je váš účet neaktívny dlhšie ako 18 mesiacov (počítané od vášho posledného záznamu v aplikácii), z dôvodu neaktivity ho zrušíme. Fakturačné údaje k predplatnému uchovávame po dobu, ktorú vyžadujú daňové a obchodné predpisy.\u003c/p>\n\n  \u003ch2>10. Vaše práva\u003c/h2>\n  \u003cp>Máte právo na prístup k svojim údajom, na ich opravu (úpravou svojho profilu), na ich export (Nastavenia → „Exportovať moje údaje“ a, ak máte modul Kulturistika, „Stiahnuť moje údaje z Kulturistiky“), na ich vymazanie (tlačidlo „Odstrániť môj účet“), právo namietať proti spracúvaniu alebo požadovať jeho obmedzenie, právo na prenosnosť údajov a právo kedykoľvek odvolať svoj súhlas. Napíšte nám na cestafitness@gmail.com a odpovieme vám v zákonnej lehote (jeden mesiac).\u003c/p>\n  \u003cp>Ak sa domnievate, že sme s vašimi údajmi nenakladali správne, môžete podať sťažnosť Španielskej agentúre na ochranu údajov (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Bezpečnosť\u003c/h2>\n  \u003cp>Komunikácia je šifrovaná, heslá sú ukladané v zašifrovanej podobe a každý používateľ má prístup iba k svojim vlastným údajom prostredníctvom pravidiel prístupu v databáze. V prípade porušenia ochrany osobných údajov, ktoré by sa vás týkalo, vás o ňom budeme informovať a v stanovených zákonných lehotách upozorníme dozorný orgán.\u003c/p>\n\n  \u003ch2>12. Maloleté osoby\u003c/h2>\n  \u003cp>cesta. nie je určená osobám mladším ako 18 rokov a ak ešte nemáte 18 rokov, nesmiete si vytvoriť účet. Ak používate sekcie Bábätko alebo Rodina, údaje maloletých, ktoré zadáte, spracúvame na vašu zodpovednosť ako matky, otca alebo zákonného zástupcu, a to výlučne na poskytovanie týchto funkcií.\u003c/p>\n\n  \u003ch2>13. Ukladanie v zariadení (cookies)\u003c/h2>\n  \u003cp>Nepoužívame reklamné ani sledovacie cookies. Vo vašom zariadení ukladáme iba informácie nevyhnutne potrebné na fungovanie aplikácie: vašu reláciu, jazyk, vaše preferencie a kópiu na používanie offline. Z tohto dôvodu vám nezobrazujeme upozornenie na cookies. Správy o chybách zo Sentry sú technickej povahy a nepoužívajú sa na reklamu.\u003c/p>\n\n  \u003ch2>13 bis. Modul Kulturistika: posilnená ochrana údajov o zdraví\u003c/h2>\n  \u003cp>\u003cstrong>Aké údaje.\u003c/strong> Iba ak si modul predplatíš a zadáš ich sám/sama: názov látky, spôsob podania, dávka, dátum, frekvencia a miesto vpichu, poznámky, uvedený polčas rozpadu, tvoje zásoby (množstvá a expirácie), hodnoty tvojich rozborov a ich referenčné rozpätia, tvoje hodnotenia dennej pohody, dátum uzatvorenia predplatného a lekárske správy, ktoré nahráš. Ide o údaje o zdraví, osobitnú kategóriu podľa GDPR (čl. 9).\u003c/p>\n  \u003cp>\u003cstrong>Právny základ.\u003c/strong> Váš výslovný súhlas (čl. 9 ods. 2 písm. a) GDPR), ktorý udeľujete zaškrtnutím políčka pri uzatvorení predplatného. Môžete ho kedykoľvek odvolať vymazaním svojich údajov v module; odvolanie nemá vplyv na skoršie spracúvanie. Ako dôkaz uchovávame dátum a verziu textu, s ktorým ste súhlasili.\u003c/p>\n  \u003cp>\u003cstrong>Účel a príjemcovia.\u003c/strong> Iba na poskytovanie modulu (evidencia, kalendár, krivky a správy). Nepoužívame ich na reklamu ani profilovanie, nepredávame ich a prepojení tréneri, priatelia ani Komunita ich nevidia. Chat s AI vaše záznamy nedostáva; dostáva iba správy, ktoré do chatu napíšete. Ukladá ich Supabase ako sprostredkovateľ; platby spracúva Stripe, ktorý tieto údaje nedostáva. Ak v chate spomenieš látku, tento text sa odošle poskytovateľovi AI, ktorý chat spracúva (Google Gemini); nepíš údaje, ktoré nechceš zdieľať.\u003c/p>\n  \u003cp>\u003cstrong>Bezpečnosť a uchovávanie.\u003c/strong> Tabuľky s prístupom obmedzeným na vášho používateľa a súkromné úložisko pre vaše správy, so šifrovaním pri prenose aj v pokoji. Uchovávajú sa po dobu, kým modul používate, a kým ich nevymažete, alebo najviac 18 mesiacov nečinnosti účtu. Pri vymazaní účtu sa vymažú aj vaše záznamy a lekárske správy a zruší sa každé aktívne predplatné.\u003c/p>\n  \u003cp>\u003cstrong>Vaše práva a maloletí.\u003c/strong> K týmto údajom môžete pristupovať, opravovať ich a vymazať ich priamo v module a ostatné práva uplatniť spôsobom uvedeným v časti 10. Modul je zakázaný osobám mladším ako 18 rokov.\u003c/p>\n\n  \u003ch2>14. Zdravotné upozornenie\u003c/h2>\n  \u003cp>cesta. nie je zdravotnícka pomôcka ani nenahrádza radu lekára, nutričného terapeuta alebo trénera. Ak ste tehotná, dojčíte, trpíte chorobou alebo podstupujete liečbu, poraďte sa pred zmenou stravy alebo fyzickej aktivity s odborníkom. Výpočty a odhady umelej inteligencie sú len orientačné.\u003c/p>\n\n  \u003ch2>15. Zmeny týchto zásad\u003c/h2>\n  \u003cp>Ak zmeníme niečo podstatné, oznámime vám to vopred v aplikácii a v prípadoch, keď to zákon vyžaduje, vás opäť požiadame o súhlas.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","hu":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Utolsó frissítés: 2026. 09. 25.\u003c/p>\n  \u003cp>\u003cstrong>Összefoglaló:\u003c/strong> a cesta. egészségügyi adatokat (testsúly, testméretek, edzések, pulzusszám) kezel, amelyeket a GDPR a személyes adatok különleges kategóriájának tekint. Ezeket kizárólag a szolgáltatás nyújtására használjuk, soha nem reklámcélokra, és nem adjuk el harmadik feleknek.\u003c/p>\n\n  \u003ch2>1. Ki az adatkezelő\u003c/h2>\n  \u003cp>Az Ön személyes adatainak adatkezelője: \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Az adatvédelemmel kapcsolatos bármely kérdésével forduljon a cestafitness@gmail.com címhez.\u003c/p>\n\n  \u003ch2>2. Milyen adatokat gyűjtünk\u003c/h2>\n  \u003cp>\u003cstrong>Fiók és profil:\u003c/strong> e-mail-cím, jelszó (titkosítva tárolva), felhasználónév, testsúly, magasság, életkor, nem, aktivitási szint, cél és nyelv.\u003c/p>\n  \u003cp>\u003cstrong>Egészség és fizikai állapot:\u003c/strong> testsúly- és testméret-előzmények, rögzített étrendek és élelmiszerek, böjt, edzések (szériák, ismétlések, súlyok, pihenőidők), pulzusszám, ha pulzusmérőt csatlakoztat, valamint lépésszám, testsúly vagy kalória, ha adatokat importál egészségügyi alkalmazásából vagy a Health Connectből. Ha a Terhesség vagy a Baba szekciót használja, az azokba beírt adatok (terhességi hét, a baba életkora, jegyzetek).\u003c/p>\n  \u003cp>\u003cstrong>Fényképek és tartalom:\u003c/strong> az Ön által feltöltött vagy mesterséges intelligenciával elemzett fényképek, valamint a csevegőüzenetek.\u003c/p>\n  \u003cp>\u003cstrong>Kapcsolat edzőkkel, barátokkal és a közösséggel:\u003c/strong> kérelmek, kapcsolatok és mindaz, amit velük megoszt (lásd az 5. pontot).\u003c/p>\n  \u003cp>\u003cstrong>Meghívási és hozzájárulási program:\u003c/strong> az Ön meghívókódja, a meghívott felhasználók és az Ön által az adatbázishoz hozzáadott élelmiszerek.\u003c/p>\n  \u003cp>\u003cstrong>Technikai és használati adatok:\u003c/strong> az eszköz és a böngésző típusa, IP-cím, nyelv, az alkalmazás hibanaplói és egy alapvető használati napló (mely képernyőket nyitja meg, és a regisztráció melyik lépésénél lép ki, egészségügyi tartalom nélkül és a Testépítés modul képernyőjét nem beleértve). Ha bejelentkezett, ez a használati napló az Ön felhasználójához kapcsolódik. Ezek az alkalmazás működéséhez, a hibák javításához és az alkalmazás fejlesztéséhez szükségesek. Jogalap: jogos érdekünk.\u003c/p>\n  \u003cp>\u003cstrong>Értesítések:\u003c/strong> ha bekapcsolja őket, eltároljuk az eszköze technikai azonosítóját, hogy elküldhessük Önnek az értesítéseket. Ha a sorozat-emlékeztetőt is bekapcsolja, eltároljuk az Ön által választott időpontot, az időzónáját, a jelenlegi sorozatát és az utolsó bejegyzése dátumát is, hogy időben emlékeztethessük. Jogalap: az Ön hozzájárulása (az engedély, amelyet a böngészőjében vagy a telefonján ad meg, valamint az emlékeztető kapcsolója), amelyet bármikor visszavonhat azok kikapcsolásával.\u003c/p>\n  \u003cp>\u003cstrong>Fizetések:\u003c/strong> ha fizetős csomagot vásárol, a fizetést a Stripe kezeli. Bankkártyaadatait nem látjuk és nem tároljuk; kizárólag az előfizetése állapotáról kapunk információt.\u003c/p>\n\n  \u003ch2>3. Mire használjuk ezeket, és mi a jogalapja\u003c/h2>\n  \u003cp>\u003cstrong>A szolgáltatás nyújtása\u003c/strong> (fiókja létrehozása, kalória- és makrotápanyag-céljainak kiszámítása, bevásárlólistájának elkészítése, haladásának megjelenítése, előfizetésének kezelése). Jogalap: a szerződés teljesítése.\u003c/p>\n  \u003cp>\u003cstrong>Egészségügyi adatainak kezelése.\u003c/strong> Jogalap: az Ön kifejezett hozzájárulása, amelyet a fiók létrehozásakor ad meg, és amelyet bármikor visszavonhat a fiókja törlésével. Ha nem adja meg, nem tudjuk nyújtani a szolgáltatást.\u003c/p>\n  \u003cp>\u003cstrong>Mesterséges intelligencia funkciók\u003c/strong> (élelmiszerek azonosítása fényképen, táplálkozási csevegés, haladási összefoglalók). Jogalap: az Ön hozzájárulása a funkció használatakor.\u003c/p>\n  \u003cp>\u003cstrong>Biztonság, tartalommoderálás és hibajavítás.\u003c/strong> Jogalap: az alkalmazás biztonságos és működő állapotban tartásához fűződő jogos érdekünk.\u003c/p>\n  \u003cp>\u003cstrong>Jogi kötelezettségek\u003c/strong> (számlázás, hatósági megkeresések). Jogalap: jogi kötelezettség teljesítése.\u003c/p>\n  \u003cp>Adatait soha nem használjuk reklámcélokra, és nem adjuk el.\u003c/p>\n\n  \u003ch2>4. Automatizált döntéshozatal és mesterséges intelligencia\u003c/h2>\n  \u003cp>A mesterséges intelligencia becslései (egy étel kalóriatartalma, csevegési javaslatok) tájékoztató jellegűek, és hibákat tartalmazhatnak. Kizárólag automatizált adatkezelésen alapuló, Önre nézve joghatással járó döntést nem hozunk. Mindig ellenőrizze, amit a mesterséges intelligencia javasol.\u003c/p>\n\n  \u003ch2>5. Közösség, barátok és edzők\u003c/h2>\n  \u003cp>Az Ön profilja \u003cstrong>alapértelmezés szerint privát\u003c/strong>. Ha nyilvánossá teszi, vagy elfogad egy ismerősi kérelmet, az illető látni fogja az Ön felhasználónevét, étrendjeit és fényképeit.\u003c/p>\n  \u003cp>Ha \u003cstrong>összekapcsolódik egy edzővel\u003c/strong>, az láthatja az Ön által vele megosztott információkat (például haladását, étrendjeit és edzéseit, valamint a csevegőüzeneteket), hogy tanácsot tudjon adni Önnek. Az összekapcsolódásról Ön dönt, és bármikor megszüntetheti. Az edző és a sportoló közötti kifizetések az alkalmazáson kívül történnek, és a cesta. nem vesz részt bennük.\u003c/p>\n\n  \u003ch2>6. Kik kapják még az adatait\u003c/h2>\n  \u003cp>A szükséges adatokat kizárólag olyan szolgáltatókkal osztjuk meg, akik nevünkben adatfeldolgozóként járnak el:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — adatbázis, hitelesítés, fényképek tárolása és szerveroldali funkciók.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — csak ha fényképelemzést vagy a mesterséges intelligenciás csevegést használja, valamint az Ön által feltöltött fényképek automatikus moderálására (8. pont).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — az előfizetések díjának beszedése.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — amikor név vagy vonalkód alapján keres egy terméket, a keresést elküldjük a termék adatainak lekéréséhez.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — az alkalmazás hibáiról szóló technikai jelentéseket fogad (az Európai Unióban lévő szerverek).\u003c/p>\n  \u003cp>\u003cstrong>Webtárhely és tartalomszolgáltató hálózatok\u003c/strong> (Netlify vagy GitHub Pages, jsDelivr, cdnjs) — kiszolgálják az alkalmazást és annak könyvtárait, és eközben látják az Ön IP-címét.\u003c/p>\n  \u003cp>A gyakorlatok technikáját bemutató videókra mutató hivatkozások csak akkor nyitnak meg külső keresőt (YouTube), ha Ön rákattint.\u003c/p>\n\n  \u003ch2>7. Nemzetközi adattovábbítás\u003c/h2>\n  \u003cp>Adatait a Supabase londoni (Egyesült Királyság) szerverein tároljuk, amelyekre az Európai Bizottság megfelelőségi határozata vonatkozik. A Google és a Stripe az Európai Gazdasági Térségen kívül (például az Egyesült Államokban) is kezelhet adatokat, az EU–USA adatvédelmi keretrendszer vagy a Bizottság által jóváhagyott általános adatvédelmi szerződési kikötések alapján.\u003c/p>\n\n  \u003ch2>8. Tartalom- és fényképmoderálás\u003c/h2>\n  \u003cp>Minden Ön által feltöltött fénykép — profilkép, haladást bemutató kép, ételekről készült kép, az Ön által beküldött termékekről készült kép vagy csevegésben küldött kép — elfogadás előtt átmegy egy automatikus, mesterséges intelligenciát használó moderálási szűrőn (Google Gemini).\u003c/p>\n  \u003cp>Elutasítunk és nem tárolunk minden olyan képet, amely tartalmaz: meztelenséget vagy kifejezett, illetve sejtető szexuális tartalmat; kegyetlen erőszakot vagy felkavaró tartalmat; gyűlöletkeltő, rasszista vagy homofób szimbólumokat vagy üzeneteket; vagy bármilyen jogellenes tartalmat, ideértve minden olyan tartalmat, amely gyermekek szexuális kizsákmányolását vagy bántalmazását valósíthatja meg. Ha egy fényképet elutasítunk, a fájlt eldobjuk, és az nem kerül tárolásra.\u003c/p>\n  \u003cp>A technikai videókeresés kizárólag egy zárt listán szereplő, valós gyakorlatneveket engedélyez; soha nem küld el ellenőrizetlen szabad szöveget.\u003c/p>\n  \u003cp>Ha észleljük, vagy jelentik nekünk, hogy egy fiók ismételten tiltott tartalmat tölt fel, felfüggeszthetjük vagy törölhetjük, és a bizonyítékokat szigorúan a szükséges mértékben megőrizhetjük, ha a jog kötelez minket arra, hogy azokat a hatóságoknak bejelentsük. Nem megfelelő tartalmat a beállításokban a „Hiba jelentése” menüponton keresztül vagy a cestafitness@gmail.com címre írva jelenthet.\u003c/p>\n\n  \u003ch2>9. Mennyi ideig őrizzük meg az adatait\u003c/h2>\n  \u003cp>Amíg fiókja aktív. Ha törli, adatai véglegesen és visszafordíthatatlanul törlődnek adatbázisunkból; kizárólag a biztonsági másolatokban maradhatnak meg, amelyeket legfeljebb 8 hétig őrzünk, és amelyeket rendszeresen felülírunk. Ha fiókja több mint 18 hónapig inaktív (az alkalmazásban rögzített utolsó bejegyzésétől számítva), inaktivitás miatt töröljük. Az előfizetések számlázási adatait az adó- és kereskedelmi jogszabályok által előírt ideig őrizzük meg.\u003c/p>\n\n  \u003ch2>10. Az Ön jogai\u003c/h2>\n  \u003cp>Jogosult adataihoz hozzáférni, azokat helyesbíteni (profiljának szerkesztésével), exportálni (Beállítások → „Adataim exportálása” és, ha rendelkezik a Testépítés modullal, „Testépítés adataim letöltése”), törlésüket kérni („Fiókom törlése” gomb), tiltakozni az adatkezelés ellen vagy kérni annak korlátozását, kérni az adathordozhatóságot, és hozzájárulását bármikor visszavonni. Írjon nekünk a cestafitness@gmail.com címre, és a jogszabályi határidőn (egy hónap) belül válaszolunk.\u003c/p>\n  \u003cp>Ha úgy véli, hogy adatait nem megfelelően kezeltük, panaszt nyújthat be a Spanyol Adatvédelmi Hatóságnál (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Biztonság\u003c/h2>\n  \u003cp>A kommunikáció titkosított, a jelszavakat titkosítva tároljuk, és minden felhasználó az adatbázisban érvényes hozzáférési szabályok révén kizárólag a saját adataihoz fér hozzá. Ha Önt érintő adatvédelmi incidens történne, erről tájékoztatnánk Önt, és a jogszabályi határidőn belül értesítenénk a felügyeleti hatóságot.\u003c/p>\n\n  \u003ch2>12. Kiskorúak\u003c/h2>\n  \u003cp>A cesta. nem 18 év alatti személyeknek szól, és 18 év alatt nem hozhat létre fiókot. Ha a Baba vagy a Család szekciót használja, az Ön által megadott kiskorúak adatait az Ön, mint szülő vagy törvényes képviselő felelősségére kezeljük, kizárólag e funkciók nyújtása céljából.\u003c/p>\n\n  \u003ch2>13. Tárolás az eszközén (cookie-k)\u003c/h2>\n  \u003cp>Nem használunk reklám- vagy nyomkövető cookie-kat. Az eszközén kizárólag az alkalmazás működéséhez feltétlenül szükséges információkat tároljuk: a munkamenetet, a nyelvet, a beállításait és egy másolatot az offline használathoz. Ezért nem jelenítünk meg cookie-figyelmeztetést. A Sentry hibajelentései technikai jellegűek, és nem használjuk őket reklámcélokra.\u003c/p>\n\n  \u003ch2>13 bis. Testépítés modul: fokozottan védett egészségügyi adatok\u003c/h2>\n  \u003cp>\u003cstrong>Milyen adatok.\u003c/strong> Csak ha előfizetsz a modulra, és te magad rögzíted őket: az anyag neve, a bevitel módja, adag, dátum, gyakoriság és az injekció helye, jegyzetek, a megadott felezési idő, a készleted (mennyiségek és lejáratok), a laboreredményeid értékei és referenciatartományaik, a napi közérzeti pontszámaid, az előfizetés dátuma és az általad feltöltött orvosi jelentések. Ezek egészségügyi adatok, a GDPR szerinti különleges kategória (9. cikk).\u003c/p>\n  \u003cp>\u003cstrong>Jogalap.\u003c/strong> A kifejezett hozzájárulásod (GDPR 9. cikk (2) bekezdés a) pont), amelyet az előfizetéskor a jelölőnégyzet bejelölésével adsz meg. Bármikor visszavonhatod a modul adatainak törlésével; a visszavonás nem érinti a korábbi adatkezelést. Bizonyítékként megőrizzük a hozzájárulásod dátumát és az általad elfogadott szöveg verzióját.\u003c/p>\n  \u003cp>\u003cstrong>Cél és címzettek.\u003c/strong> Kizárólag a modul nyújtása céljából (nyilvántartás, naptár, görbék és jelentések). Nem használjuk reklámra vagy profilalkotásra, nem adjuk el, és a kapcsolt edzők, barátok és a Közösség nem látják. Az MI-csevegés nem kapja meg a nyilvántartásaidat; csak azokat az üzeneteket kapja, amelyeket a csevegésben beírsz. Az adatokat a Supabase tárolja adatfeldolgozóként; a fizetéseket a Stripe dolgozza fel, amely nem kapja meg ezeket az adatokat. Ha a csevegésben megemlítesz egy anyagot, a szöveg a csevegést feldolgozó MI-szolgáltatóhoz kerül (Google Gemini); ne írj be olyan adatot, amelyet nem szeretnél megosztani.\u003c/p>\n  \u003cp>\u003cstrong>Biztonság és megőrzés.\u003c/strong> A felhasználódra korlátozott hozzáférésű táblák és privát tároló a jelentéseid számára, átvitel közben és tárolás közben is titkosítva. Addig őrizzük, amíg használod a modult és amíg nem törlöd, vagy legfeljebb 18 hónapnyi fiókinaktivitásig. Fiókod törlésekor a nyilvántartásaid és orvosi jelentéseid is törlődnek, és minden aktív előfizetés megszűnik.\u003c/p>\n  \u003cp>\u003cstrong>Jogaid és a kiskorúak.\u003c/strong> Ezekhez az adatokhoz magából a modulból hozzáférhetsz, helyesbítheted és törölheted őket, egyéb jogaidat pedig a 10. pontban leírtak szerint gyakorolhatod. A modul 18 év alattiak számára tilos.\u003c/p>\n\n  \u003ch2>14. Egészségügyi figyelmeztetés\u003c/h2>\n  \u003cp>A cesta. nem orvostechnikai eszköz, és nem helyettesíti orvos, dietetikus-táplálkozási szakember vagy edző tanácsát. Ha várandós, szoptat, betegsége van vagy kezelés alatt áll, étrendje vagy fizikai aktivitása megváltoztatása előtt kérjen szakmai tanácsot. A számítások és a mesterséges intelligencia becslései tájékoztató jellegűek.\u003c/p>\n\n  \u003ch2>15. A szabályzat módosításai\u003c/h2>\n  \u003cp>Ha bármi lényegeset módosítunk, azt előre jelezzük az alkalmazásban, és ahol a jog megköveteli, ismét a hozzájárulását kérjük.\u003c/p>\n\n  \u003ch2>16. Kapcsolat\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","bg":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Последна актуализация: 25.09.2026 г.\u003c/p>\n  \u003cp>\u003cstrong>Резюме:\u003c/strong> cesta. обработва здравни данни (тегло, телесни мерки, тренировки, сърдечен ритъм), които ОРЗД счита за специална категория лични данни. Използваме ги единствено за предоставяне на услугата, никога за реклама и не ги продаваме на трети лица.\u003c/p>\n\n  \u003ch2>1. Кой е администраторът\u003c/h2>\n  \u003cp>Администратор на вашите лични данни е \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). За всякакви въпроси, свързани с поверителността, пишете на cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Какви данни събираме\u003c/h2>\n  \u003cp>\u003cstrong>Акаунт и профил:\u003c/strong> имейл, парола (съхранявана в криптиран вид), потребителско име, тегло, ръст, възраст, пол, ниво на активност, цел и език.\u003c/p>\n  \u003cp>\u003cstrong>Здраве и физическа форма:\u003c/strong> история на теглото и телесните мерки, записани менюта и храни, гладуване, тренировки (серии, повторения, тежести, почивки), сърдечен ритъм, ако свържете пулсомер, както и стъпки, тегло или калории, ако импортирате данни от своето здравно приложение или от Health Connect. Ако използвате разделите „Бременност“ или „Бебе“, данните, които въвеждате в тях (седмица на бременността, възраст на бебето, бележки).\u003c/p>\n  \u003cp>\u003cstrong>Снимки и съдържание:\u003c/strong> снимките, които качвате или анализирате с изкуствен интелект, и съобщенията в чата.\u003c/p>\n  \u003cp>\u003cstrong>Връзка с треньори, приятели и общността:\u003c/strong> заявки, връзки и всичко, което споделяте с тях (вж. точка 5).\u003c/p>\n  \u003cp>\u003cstrong>Програма за покани и приноси:\u003c/strong> вашият код за покана, поканените потребители и храните, които добавяте в базата данни.\u003c/p>\n  \u003cp>\u003cstrong>Технически данни и данни за ползване:\u003c/strong> тип устройство и браузър, IP адрес, език, регистри на грешките на приложението и основен регистър на ползването (кои екрани отваряте и на коя стъпка от регистрацията се отказвате, без никакво здравно съдържание и без екрана на модула Културизъм). Ако сте влезли в профила си, този регистър на ползването се свързва с вашия потребител. Те служат за работата на приложението, за отстраняване на грешки и за подобряването му. Правно основание: нашият законен интерес.\u003c/p>\n  \u003cp>\u003cstrong>Известия:\u003c/strong> ако ги включите, съхраняваме техническия идентификатор на устройството ви, за да ви ги изпращаме. Ако включите и напомнянето за серия, съхраняваме също избрания от вас час, часовата ви зона, текущата ви серия и датата на последния ви запис, за да можем да ви напомним навреме. Правно основание: вашето съгласие (разрешението, което давате в браузъра или в телефона си, и превключвателят на напомнянето), което можете да оттеглите по всяко време, като ги изключите.\u003c/p>\n  \u003cp>\u003cstrong>Плащания:\u003c/strong> ако сключите платен план, плащането се обработва от Stripe. Ние не виждаме и не съхраняваме данните на вашата карта; получаваме само състоянието на вашия абонамент.\u003c/p>\n\n  \u003ch2>3. За какво ги използваме и на какво правно основание\u003c/h2>\n  \u003cp>\u003cstrong>Предоставяне на услугата\u003c/strong> (създаване на вашия акаунт, изчисляване на вашите цели за калории и макронутриенти, генериране на списъка ви за пазаруване, показване на напредъка ви, управление на абонамента ви). Правно основание: изпълнение на договор.\u003c/p>\n  \u003cp>\u003cstrong>Обработване на вашите здравни данни.\u003c/strong> Правно основание: вашето изрично съгласие, което давате при създаването на акаунта и можете да оттеглите по всяко време, като изтриете акаунта си. Ако не го дадете, не можем да ви предоставяме услугата.\u003c/p>\n  \u003cp>\u003cstrong>Функции с изкуствен интелект\u003c/strong> (разпознаване на храни от снимка, чат за хранене, обобщения на напредъка). Правно основание: вашето съгласие при използване на функцията.\u003c/p>\n  \u003cp>\u003cstrong>Сигурност, модериране на съдържание и отстраняване на грешки.\u003c/strong> Правно основание: нашият законен интерес да поддържаме приложението сигурно и работещо.\u003c/p>\n  \u003cp>\u003cstrong>Правни задължения\u003c/strong> (фактуриране, искания от органи на властта). Правно основание: изпълнение на правно задължение.\u003c/p>\n  \u003cp>Никога не използваме вашите данни за рекламни цели и не ги продаваме.\u003c/p>\n\n  \u003ch2>4. Автоматизирани решения и изкуствен интелект\u003c/h2>\n  \u003cp>Оценките на изкуствения интелект (калории на ястие, предложения в чата) са ориентировъчни и могат да съдържат грешки. Не се вземат решения с правни последици за вас, основаващи се единствено на автоматизирано обработване. Винаги проверявайте това, което ви предлага изкуственият интелект.\u003c/p>\n\n  \u003ch2>5. Общност, приятели и треньори\u003c/h2>\n  \u003cp>Вашият профил е \u003cstrong>частен по подразбиране\u003c/strong>. Ако го направите публичен или приемете приятелство, този човек вижда вашето потребителско име, менюта и снимки.\u003c/p>\n  \u003cp>Ако \u003cstrong>се свържете с треньор\u003c/strong>, той ще може да вижда информацията, която споделяте с него (например вашия напредък, менюта и тренировки и съобщенията в чата), за да ви консултира. Вие решавате дали да се свържете и можете да прекратите връзката, когато пожелаете. Плащанията между треньор и състезател се извършват извън приложението и cesta. не участва в тях.\u003c/p>\n\n  \u003ch2>6. Кой друг получава вашите данни\u003c/h2>\n  \u003cp>Споделяме необходимите данни само с доставчици, които действат от наше име като обработващи лични данни:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — база данни, автентикация, съхранение на снимки и сървърни функции.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — само ако използвате анализа на снимки или чата с изкуствен интелект, както и за автоматично модериране на снимките, които качвате (точка 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — събиране на плащания за абонаменти.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — когато търсите продукт по име или баркод, търсенето се изпраща, за да се получат данните за него.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — получава технически доклади за грешки на приложението (сървъри в Европейския съюз).\u003c/p>\n  \u003cp>\u003cstrong>Уеб хостинг и мрежи за доставка на съдържание\u003c/strong> (Netlify или GitHub Pages, jsDelivr, cdnjs) — предоставят приложението и неговите библиотеки и при това виждат вашия IP адрес.\u003c/p>\n  \u003cp>Връзките към видеа с техника на упражненията отварят външна търсачка (YouTube) само когато ги натиснете.\u003c/p>\n\n  \u003ch2>7. Международни трансфери\u003c/h2>\n  \u003cp>Вашите данни се съхраняват на сървъри на Supabase в Лондон (Обединеното кралство), за които е налице решение на Европейската комисия относно адекватното ниво на защита. Google и Stripe могат да обработват данни извън Европейското икономическо пространство (например в Съединените щати) въз основа на Рамката за защита на личните данни ЕС—САЩ или на стандартни договорни клаузи, одобрени от Комисията.\u003c/p>\n\n  \u003ch2>8. Модериране на съдържание и снимки\u003c/h2>\n  \u003cp>Всяка снимка, която качвате — профилна снимка, снимка на напредъка, на ястия, на продукти, които добавяте, или изпратена в чата — преминава през автоматичен филтър за модериране с изкуствен интелект (Google Gemini), преди да бъде приета.\u003c/p>\n  \u003cp>Отхвърляме и не съхраняваме никакво изображение, което съдържа: голота или явно, или внушаващо сексуално съдържание; графично насилие или смущаващо съдържание; символи или послания на омраза, расистки или хомофобски; или всякакво незаконно съдържание, включително всяко съдържание, което може да представлява сексуална експлоатация или насилие над деца. Ако една снимка бъде отхвърлена, файлът се унищожава и изобщо не се съхранява.\u003c/p>\n  \u003cp>Търсачката за видеа с техника позволява търсене само на реални имена на упражнения от затворен списък; никога не изпраща непроверен свободен текст.\u003c/p>\n  \u003cp>Ако установим или ни бъде докладвано, че акаунт многократно качва забранено съдържание, можем да го спрем или изтрием и да запазим строго необходимите доказателства, ако законът ни задължава да ги съобщим на органите на властта. Можете да докладвате неподходящо съдържание чрез „Докладвай грешка“ в настройките или като пишете на cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Колко дълго съхраняваме вашите данни\u003c/h2>\n  \u003cp>Докато акаунтът ви е активен. Ако го изтриете, данните ви се изтриват окончателно и безвъзвратно от нашата база данни; могат да останат само в резервните копия, които съхраняваме най-много 8 седмици и които периодично се презаписват. Ако акаунтът ви остане над 18 месеца без активност (считано от последния ви запис в приложението), го изтриваме поради неактивност. Данните за фактуриране на абонаментите се съхраняват толкова дълго, колкото изискват данъчното и търговското законодателство.\u003c/p>\n\n  \u003ch2>10. Вашите права\u003c/h2>\n  \u003cp>Можете да получите достъп до данните си, да ги коригирате (като редактирате профила си), да ги експортирате (Настройки → „Експортирай моите данни“ и, ако имате модула Културизъм, „Изтегли моите данни от Културизъм“), да поискате изтриването им (бутон „Изтрий моя акаунт“), да възразите срещу обработването им или да поискате ограничаването му, да поискате преносимост и да оттеглите съгласието си по всяко време. Пишете ни на cestafitness@gmail.com и ще ви отговорим в законоустановения срок (един месец).\u003c/p>\n  \u003cp>Ако смятате, че данните ви не са обработвани правилно, можете да подадете жалба до Испанската агенция за защита на данните (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Сигурност\u003c/h2>\n  \u003cp>Комуникациите са криптирани, паролите се съхраняват в криптиран вид и всеки потребител има достъп само до собствените си данни чрез правила за достъп в базата данни. Ако настъпи нарушение на сигурността, което ви засяга, ще ви уведомим и ще уведомим надзорния орган в законоустановените срокове.\u003c/p>\n\n  \u003ch2>12. Непълнолетни лица\u003c/h2>\n  \u003cp>cesta. не е насочено към лица под 18 години и не бива да създавате акаунт, ако не сте навършили тази възраст. Ако използвате разделите „Бебе“ или „Семейство“, данните на непълнолетни, които въвеждате, се обработват под ваша отговорност като майка, баща или законен представител и само за да ви предоставим тези функции.\u003c/p>\n\n  \u003ch2>13. Съхранение на вашето устройство (бисквитки)\u003c/h2>\n  \u003cp>Не използваме рекламни бисквитки или бисквитки за проследяване. На вашето устройство съхраняваме единствено информация, строго необходима за работата на приложението: вашата сесия, езика, предпочитанията ви и копие за използване без връзка с интернет. Затова не ви показваме известие за бисквитки. Докладите за грешки на Sentry са технически и не се използват за реклама.\u003c/p>\n\n  \u003ch2>13 bis. Модул Културизъм: данни за здравето с повишена защита\u003c/h2>\n  \u003cp>\u003cstrong>Какви данни.\u003c/strong> Само ако се абонирате за модула и ги въведете сами: наименование на веществото, начин на приемане, доза, дата, честота и място на инжектиране, бележки, посоченият период на полуразпад, вашият инвентар (количества и срокове на годност), стойностите от вашите изследвания и техните референтни граници, вашите оценки за ежедневно благосъстояние, датата на сключване на абонамента и медицинските доклади, които качите. Това са данни за здравето, специална категория по ОРЗД (Общ регламент относно защитата на данните) (чл. 9).\u003c/p>\n  \u003cp>\u003cstrong>Правно основание.\u003c/strong> Вашето изрично съгласие (чл. 9, параграф 2, буква а) от ОРЗД), което давате, като отбележите квадратчето при сключването на абонамента. Можете да го оттеглите по всяко време, като изтриете данните си от модула; оттеглянето не засяга обработването преди това. Като доказателство съхраняваме датата и версията на текста, с който сте се съгласили.\u003c/p>\n  \u003cp>\u003cstrong>Цел и получатели.\u003c/strong> Единствено за да ви предоставим модула (записи, календар, криви
