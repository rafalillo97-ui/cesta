 и доклади). Не ги използваме за реклама или профилиране, не ги продаваме и свързаните треньори, приятели и Общността не ги виждат. Чатът с ИИ не получава вашите записи; получава само съобщенията, които пишете в чата. Съхраняват се от Supabase като обработващ лични данни; плащанията се обработват от Stripe, който не получава тези данни. Ако споменеш вещество в чата, този текст се изпраща на доставчика на ИИ, който обработва чата (Google Gemini); избягвай да въвеждаш данни, които не искаш да споделяш.\u003c/p>\n  \u003cp>\u003cstrong>Сигурност и съхранение.\u003c/strong> Таблици с достъп, ограничен до вашия потребител, и частно хранилище за вашите доклади, с криптиране при пренос и в покой. Съхраняват се, докато използвате модула и докато не ги изтриете, или до 18 месеца неактивност на профила. При изтриване на профила ви се изтриват и вашите записи и медицински доклади и се отменя всеки активен абонамент.\u003c/p>\n  \u003cp>\u003cstrong>Вашите права и непълнолетните.\u003c/strong> Можете да достъпвате, коригирате и изтривате тези данни от самия модул и да упражнявате останалите си права, както е обяснено в раздел 10. Модулът е забранен за лица под 18 години.\u003c/p>\n\n  \u003ch2>14. Здравно предупреждение\u003c/h2>\n  \u003cp>cesta. не е медицинско изделие и не замества съвета на лекар, диетолог-нутриционист или треньор. Ако сте бременна, кърмите, имате заболяване или следвате лечение, консултирайте се със специалист, преди да променяте храненето или физическата си активност. Изчисленията и оценките на изкуствения интелект са ориентировъчни.\u003c/p>\n\n  \u003ch2>15. Промени в тази политика\u003c/h2>\n  \u003cp>Ако променим нещо съществено, ще ви уведомим предварително в приложението и, когато законът го изисква, отново ще поискаме вашето съгласие.\u003c/p>\n\n  \u003ch2>16. Контакт\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","hr":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Posljednje ažuriranje: 25. 9. 2026.\u003c/p>\n  \u003cp>\u003cstrong>Sažetak:\u003c/strong> cesta. obrađuje podatke o zdravlju (težina, tjelesne mjere, treninzi, srčani ritam), koje GDPR smatra posebnom kategorijom osobnih podataka. Koristimo ih isključivo za pružanje usluge, nikada za oglašavanje niti za prodaju trećim stranama.\u003c/p>\n\n  \u003ch2>1. Tko je voditelj obrade\u003c/h2>\n  \u003cp>Voditelj obrade tvojih podataka je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Za sva pitanja o privatnosti piši na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Koje podatke prikupljamo\u003c/h2>\n  \u003cp>\u003cstrong>Račun i profil:\u003c/strong> e-adresa, lozinka (pohranjena u šifriranom obliku), korisničko ime, težina, visina, dob, spol, razina aktivnosti, cilj i jezik.\u003c/p>\n  \u003cp>\u003cstrong>Zdravlje i tjelesna kondicija:\u003c/strong> povijest težine i mjera, evidentirani jelovnici i namirnice, post, treninzi (serije, ponavljanja, težine, odmori), srčani ritam ako povežeš pulsmetar te koraci, težina ili kalorije ako uvezeš podatke iz svoje zdravstvene aplikacije ili iz Health Connecta. Ako koristiš odjeljke Trudnoća ili Beba, podaci koje u njih upišeš (tjedan trudnoće, dob bebe, bilješke).\u003c/p>\n  \u003cp>\u003cstrong>Fotografije i sadržaj:\u003c/strong> fotografije koje učitaš ili analiziraš umjetnom inteligencijom te poruke u chatu.\u003c/p>\n  \u003cp>\u003cstrong>Odnos s trenerima, prijateljima i zajednicom:\u003c/strong> zahtjevi, veze i sve što podijeliš s njima (vidi odjeljak 5).\u003c/p>\n  \u003cp>\u003cstrong>Program pozivnica i doprinosa:\u003c/strong> tvoj pozivni kod, pozvani korisnici i namirnice koje doprineseš bazi podataka.\u003c/p>\n  \u003cp>\u003cstrong>Tehnički podaci i podaci o korištenju:\u003c/strong> vrsta uređaja i preglednika, IP adresa, jezik, zapisi o pogreškama aplikacije i osnovni zapis o korištenju (koje zaslone otvaraš i na kojem koraku registracije odustaješ, bez ikakvog zdravstvenog sadržaja i bez zaslona modula Bodybuilding). Ako si prijavljen, taj se zapis o korištenju povezuje s tvojim korisnikom. Služe za rad aplikacije, ispravljanje pogrešaka i njezino poboljšanje. Pravna osnova: naš legitimni interes.\u003c/p>\n  \u003cp>\u003cstrong>Obavijesti:\u003c/strong> ako ih uključiš, pohranjujemo tehnički identifikator tvog uređaja kako bismo ti ih slali. Ako uključiš i podsjetnik za niz, pohranjujemo i vrijeme koje odabereš, tvoju vremensku zonu, tvoj trenutačni niz i datum tvog posljednjeg unosa kako bismo te mogli pravodobno podsjetiti. Pravna osnova: tvoja privola (dopuštenje koje daješ u pregledniku ili na mobitelu i prekidač podsjetnika), koju možeš povući u bilo kojem trenutku njihovim isključivanjem.\u003c/p>\n  \u003cp>\u003cstrong>Plaćanja:\u003c/strong> ako ugovoriš plaćeni plan, naplatu obavlja Stripe. Mi ne vidimo niti pohranjujemo podatke tvoje kartice; primamo samo status tvoje pretplate.\u003c/p>\n\n  \u003ch2>3. U koje svrhe ih koristimo i na kojoj pravnoj osnovi\u003c/h2>\n  \u003cp>\u003cstrong>Pružanje usluge\u003c/strong> (otvaranje tvog računa, izračun tvojih ciljeva kalorija i makronutrijenata, izrada popisa za kupnju, prikaz tvog napretka, upravljanje tvojom pretplatom). Pravna osnova: izvršenje ugovora.\u003c/p>\n  \u003cp>\u003cstrong>Obrada tvojih podataka o zdravlju.\u003c/strong> Pravna osnova: tvoja izričita privola, koju daješ prilikom otvaranja računa i koju u svakom trenutku možeš povući brisanjem svog računa. Ako je ne daš, ne možemo ti pružiti uslugu.\u003c/p>\n  \u003cp>\u003cstrong>Funkcije umjetne inteligencije\u003c/strong> (prepoznavanje namirnica na fotografiji, chat o prehrani, sažeci napretka). Pravna osnova: tvoja privola pri korištenju funkcije.\u003c/p>\n  \u003cp>\u003cstrong>Sigurnost, moderiranje sadržaja i ispravljanje pogrešaka.\u003c/strong> Pravna osnova: naš legitimni interes da aplikacija bude sigurna i ispravna.\u003c/p>\n  \u003cp>\u003cstrong>Zakonske obveze\u003c/strong> (izdavanje računa, zahtjevi tijela vlasti). Pravna osnova: poštovanje pravne obveze.\u003c/p>\n  \u003cp>Tvoje podatke nikada ne koristimo u svrhu oglašavanja niti ih prodajemo.\u003c/p>\n\n  \u003ch2>4. Automatizirane odluke i umjetna inteligencija\u003c/h2>\n  \u003cp>Procjene umjetne inteligencije (kalorije jela, prijedlozi u chatu) samo su okvirne i mogu sadržavati pogreške. Ne donose se odluke koje bi imale pravne učinke na tebe isključivo na temelju automatizirane obrade. Uvijek provjeri ono što ti predlaže umjetna inteligencija.\u003c/p>\n\n  \u003ch2>5. Zajednica, prijatelji i treneri\u003c/h2>\n  \u003cp>Tvoj je profil \u003cstrong>prema zadanim postavkama privatan\u003c/strong>. Ako ga učiniš javnim ili prihvatiš prijateljstvo, ta osoba vidi tvoje korisničko ime, jelovnike i fotografije.\u003c/p>\n  \u003cp>Ako se \u003cstrong>povežeš s trenerom\u003c/strong>, on će moći vidjeti informacije koje podijeliš s njim (na primjer tvoj napredak, jelovnike i treninge te poruke u chatu) kako bi te savjetovao. Ti odlučuješ hoćeš li se povezati i možeš prekinuti vezu kada želiš. Plaćanja između trenera i sportaša obavljaju se izvan aplikacije, a cesta. u njima ne sudjeluje.\u003c/p>\n\n  \u003ch2>6. Tko još prima tvoje podatke\u003c/h2>\n  \u003cp>Nužne podatke dijelimo samo s pružateljima usluga koji djeluju u naše ime:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — baza podataka, autentifikacija, pohrana fotografija i poslužiteljske funkcije.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — samo ako koristiš analizu fotografija ili chat s umjetnom inteligencijom te za automatsko moderiranje fotografija koje učitavaš (odjeljak 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — naplata pretplata.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — kada pretražuješ proizvod po nazivu ili barkodu, taj se upit šalje radi dobivanja podataka o proizvodu.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — prima tehnička izvješća o pogreškama aplikacije (poslužitelji u Europskoj uniji).\u003c/p>\n  \u003cp>\u003cstrong>Web-hosting i mreže za isporuku sadržaja\u003c/strong> (Netlify ili GitHub Pages, jsDelivr, cdnjs) — isporučuju aplikaciju i njezine biblioteke te pritom vide tvoju IP adresu.\u003c/p>\n  \u003cp>Poveznice na videozapise tehnike vježbi otvaraju vanjsku tražilicu (YouTube) samo kada ti to odabereš.\u003c/p>\n\n  \u003ch2>7. Međunarodni prijenosi\u003c/h2>\n  \u003cp>Tvoji se podaci pohranjuju na poslužiteljima Supabasea u Londonu (Ujedinjena Kraljevina), za koje postoji odluka Europske komisije o primjerenosti. Google i Stripe mogu obrađivati podatke izvan Europskoga gospodarskog prostora (na primjer u Sjedinjenim Američkim Državama) na temelju Okvira za privatnost podataka EU–SAD ili standardnih ugovornih klauzula koje je odobrila Komisija.\u003c/p>\n\n  \u003ch2>8. Moderiranje sadržaja i fotografija\u003c/h2>\n  \u003cp>Svaka fotografija koju učitaš — profilna fotografija, fotografija napretka, jela, proizvoda koje doprinosiš ili poslana putem chata — prije prihvaćanja prolazi kroz automatski filtar za moderiranje umjetnom inteligencijom (Google Gemini).\u003c/p>\n  \u003cp>Odbijamo i ne pohranjujemo nijednu sliku koja sadrži: golotinju ili izričit ili sugestivan seksualni sadržaj; grafičko nasilje ili uznemirujući sadržaj; simbole ili poruke mržnje, rasističke ili homofobne; ili bilo koji nezakonit sadržaj, uključujući svaki sadržaj koji bi mogao predstavljati seksualno iskorištavanje ili zlostavljanje djece. Ako je fotografija odbijena, datoteka se odbacuje i nikada se ne pohranjuje.\u003c/p>\n  \u003cp>Tražilica videozapisa tehnike omogućuje samo pretraživanje stvarnih naziva vježbi iz zatvorenog popisa; nikada ne šalje neprovjeren slobodan tekst.\u003c/p>\n  \u003cp>Ako otkrijemo ili nam se prijavi račun koji opetovano učitava zabranjeni sadržaj, možemo ga suspendirati ili izbrisati te zadržati strogo nužne dokaze ako nas zakon obvezuje da ih priopćimo tijelima vlasti. Neprimjeren sadržaj možeš prijaviti putem opcije „Prijavi grešku” u postavkama ili pisanjem na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Koliko dugo čuvamo tvoje podatke\u003c/h2>\n  \u003cp>Dok je tvoj račun aktivan. Ako ga izbrišeš, tvoji se podaci trajno i nepovratno brišu iz naše baze podataka; mogu ostati samo u sigurnosnim kopijama, koje čuvamo najviše 8 tjedana i koje se periodički prebrisuju. Ako tvoj račun bude neaktivan dulje od 18 mjeseci (računajući od tvog posljednjeg unosa u aplikaciji), brišemo ga zbog neaktivnosti. Podaci o naplati pretplata čuvaju se onoliko dugo koliko zahtijevaju porezni i trgovački propisi.\u003c/p>\n\n  \u003ch2>10. Tvoja prava\u003c/h2>\n  \u003cp>Možeš pristupiti svojim podacima, ispraviti ih (uređivanjem profila), izvesti ih (Postavke → „Izvezi moje podatke” i, ako imaš modul Bodybuilding, „Preuzmi moje podatke iz modula Bodybuilding”), zatražiti njihovo brisanje (gumb „Izbriši moj račun”), uložiti prigovor na obradu ili zatražiti njezino ograničenje, zatražiti prenosivost podataka te u svakom trenutku povući svoju privolu. Piši nam na cestafitness@gmail.com i odgovorit ćemo ti u zakonskom roku (mjesec dana).\u003c/p>\n  \u003cp>Ako smatraš da nismo ispravno obrađivali tvoje podatke, možeš podnijeti pritužbu Španjolskoj agenciji za zaštitu podataka (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Sigurnost\u003c/h2>\n  \u003cp>Komunikacija je šifrirana, lozinke se pohranjuju u šifriranom obliku, a svaki korisnik može pristupiti samo vlastitim podacima putem pravila pristupa u bazi podataka. Ako dođe do povrede sigurnosti koja bi se odnosila na tebe, obavijestit ćemo te o tome i obavijestiti nadzorno tijelo u zakonskim rokovima.\u003c/p>\n\n  \u003ch2>12. Maloljetnici\u003c/h2>\n  \u003cp>cesta. nije namijenjena osobama mlađim od 18 godina i ne smiješ otvoriti račun ako nemaš navršenih 18 godina. Ako koristiš odjeljke Beba ili Obitelj, podatke maloljetnika koje uneseš obrađujemo pod tvojom odgovornošću kao majke, oca ili zakonskog skrbnika i samo radi pružanja tih funkcija.\u003c/p>\n\n  \u003ch2>13. Pohrana na tvom uređaju (kolačići)\u003c/h2>\n  \u003cp>Ne koristimo oglašivačke kolačiće niti kolačiće za praćenje. Na tvom uređaju pohranjujemo samo informacije koje su strogo nužne za rad aplikacije: tvoju sesiju, jezik, tvoje postavke i kopiju za korištenje bez internetske veze. Zbog toga ti ne prikazujemo obavijest o kolačićima. Sentryjeva izvješća o pogreškama tehnička su i ne koriste se za oglašavanje.\u003c/p>\n\n  \u003ch2>13 bis. Modul Bodybuilding: pojačana zaštita podataka o zdravlju\u003c/h2>\n  \u003cp>\u003cstrong>Koji podaci.\u003c/strong> Samo ako ugovoriš modul i sam/a ih uneseš: naziv tvari, put primjene, doza, datum, učestalost i mjesto injekcije, bilješke, navedeno poluvrijeme, tvoja zaliha (količine i rokovi trajanja), vrijednosti tvojih laboratorijskih nalaza i njihovi referentni rasponi, tvoje ocjene dnevne dobrobiti, datum ugovaranja i liječnička izvješća koja učitaš. To su podaci o zdravlju, posebna kategorija prema Općoj uredbi o zaštiti podataka (GDPR) (čl. 9.).\u003c/p>\n  \u003cp>\u003cstrong>Pravna osnova.\u003c/strong> Tvoja izričita privola (čl. 9. st. 2. točka (a) GDPR-a), koju daješ označavanjem okvira prilikom ugovaranja. Možeš je povući u bilo kojem trenutku brisanjem svojih podataka iz modula; povlačenje ne utječe na prethodnu obradu. Kao dokaz čuvamo datum i verziju teksta na koju si dao/dala privolu.\u003c/p>\n  \u003cp>\u003cstrong>Svrha i primatelji.\u003c/strong> Isključivo radi pružanja modula (evidencija, kalendar, krivulje i izvješća). Ne koristimo ih za oglašavanje niti za izradu profila, ne prodajemo ih, a povezani treneri, prijatelji i Zajednica ih ne vide. Chat s umjetnom inteligencijom ne prima tvoje zapise; prima samo poruke koje sam/a upišeš u chat. Pohranjuje ih Supabase kao izvršitelj obrade; plaćanja obrađuje Stripe, koji ne prima ove podatke. Ako u chatu spomeneš tvar, taj se tekst šalje pružatelju umjetne inteligencije koji obrađuje chat (Google Gemini); nemoj upisivati podatke koje ne želiš dijeliti.\u003c/p>\n  \u003cp>\u003cstrong>Sigurnost i čuvanje.\u003c/strong> Tablice s pristupom ograničenim na tvog korisnika i privatna pohrana za tvoja izvješća, uz šifriranje u prijenosu i u mirovanju. Čuvaju se dok koristiš modul i dok ih ne izbrišeš, odnosno najviše 18 mjeseci neaktivnosti računa. Brisanjem računa brišu se i tvoji zapisi i liječnička izvješća te se otkazuje svaka aktivna pretplata.\u003c/p>\n  \u003cp>\u003cstrong>Tvoja prava i maloljetnici.\u003c/strong> Možeš pristupiti tim podacima, ispraviti ih i izbrisati izravno iz modula te ostvariti ostala prava kako je objašnjeno u odjeljku 10. Modul je zabranjen osobama mlađim od 18 godina.\u003c/p>\n\n  \u003ch2>14. Zdravstvena napomena\u003c/h2>\n  \u003cp>cesta. nije medicinski proizvod niti zamjenjuje savjet liječnika, dijetetičara-nutricionista ili trenera. Ako si trudna, dojiš, imaš bolest ili slijediš liječenje, prije promjene prehrane ili tjelesne aktivnosti posavjetuj se sa stručnom osobom. Izračuni i procjene umjetne inteligencije samo su okvirni.\u003c/p>\n\n  \u003ch2>15. Izmjene ove politike\u003c/h2>\n  \u003cp>Ako promijenimo nešto važno, unaprijed ćemo te o tome obavijestiti u aplikaciji i, kada to zakon zahtijeva, ponovno ćemo zatražiti tvoju privolu.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","sl":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Zadnja posodobitev: 25. 9. 2026\u003c/p>\n  \u003cp>\u003cstrong>Povzetek:\u003c/strong> cesta. obdeluje podatke o zdravju (telesna teža, telesne mere, treningi, srčni utrip), ki jih splošna uredba o varstvu podatkov (GDPR) šteje za posebno vrsto osebnih podatkov. Uporabljamo jih samo za zagotavljanje storitve, nikoli za oglaševanje ali prodajo tretjim osebam.\u003c/p>\n\n  \u003ch2>1. Kdo je upravljavec\u003c/h2>\n  \u003cp>Upravljavec tvojih podatkov je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Za vsa vprašanja o zasebnosti piši na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Katere podatke zbiramo\u003c/h2>\n  \u003cp>\u003cstrong>Račun in profil:\u003c/strong> e-poštni naslov, geslo (shranjeno v šifrirani obliki), uporabniško ime, teža, višina, starost, spol, raven aktivnosti, cilj in jezik.\u003c/p>\n  \u003cp>\u003cstrong>Zdravje in telesna pripravljenost:\u003c/strong> zgodovina teže in mer, vpisani jedilniki in živila, post, treningi (serije, ponovitve, teže, odmori), srčni utrip, če povežeš merilnik srčnega utripa, ter koraki, teža ali kalorije, če uvoziš podatke iz svoje zdravstvene aplikacije ali iz storitve Health Connect. Če uporabljaš razdelka Nosečnost ali Dojenček, podatki, ki jih vanju vneseš (teden nosečnosti, starost dojenčka, opombe).\u003c/p>\n  \u003cp>\u003cstrong>Fotografije in vsebina:\u003c/strong> fotografije, ki jih naložiš ali analiziraš z umetno inteligenco, in sporočila v klepetu.\u003c/p>\n  \u003cp>\u003cstrong>Odnos s trenerji, prijatelji in skupnostjo:\u003c/strong> zahteve, povezave in vse, kar deliš z njimi (glej razdelek 5).\u003c/p>\n  \u003cp>\u003cstrong>Program povabil in prispevkov:\u003c/strong> tvoja koda za povabilo, povabljeni uporabniki in živila, ki jih prispevaš v zbirko podatkov.\u003c/p>\n  \u003cp>\u003cstrong>Tehnični podatki in podatki o uporabi:\u003c/strong> vrsta naprave in brskalnika, naslov IP, jezik, zapisi o napakah aplikacije in osnovni zapis o uporabi (katere zaslone odpreš in pri katerem koraku registracije odstopiš, brez kakršne koli zdravstvene vsebine in brez zaslona modula Bodybuilding). Če si prijavljen, se ta zapis o uporabi poveže z tvojim uporabnikom. Služijo delovanju aplikacije, odpravljanju napak in njenemu izboljšanju. Pravna podlaga: naš zakoniti interes.\u003c/p>\n  \u003cp>\u003cstrong>Obvestila:\u003c/strong> če jih vklopiš, hranimo tehnični identifikator tvoje naprave, da ti jih lahko pošiljamo. Če vklopiš tudi opomnik za niz, hranimo še uro, ki jo izbereš, tvoj časovni pas, tvoj trenutni niz in datum tvojega zadnjega vnosa, da te lahko pravočasno opomnimo. Pravna podlaga: tvoja privolitev (dovoljenje, ki ga daš v brskalniku ali na telefonu, in stikalo opomnika), ki jo lahko kadar koli prekličeš z njunim izklopom.\u003c/p>\n  \u003cp>\u003cstrong>Plačila:\u003c/strong> če skleneš plačljivi paket, obračun izvaja Stripe. Podatkov tvoje kartice ne vidimo in jih ne hranimo; prejmemo samo stanje tvoje naročnine.\u003c/p>\n\n  \u003ch2>3. Za kaj jih uporabljamo in na kateri pravni podlagi\u003c/h2>\n  \u003cp>\u003cstrong>Zagotavljanje storitve\u003c/strong> (ustvarjanje tvojega računa, izračun tvojih ciljev glede kalorij in makrohranil, priprava nakupovalnega seznama, prikaz tvojega napredka, upravljanje tvoje naročnine). Pravna podlaga: izvajanje pogodbe.\u003c/p>\n  \u003cp>\u003cstrong>Obdelava tvojih podatkov o zdravju.\u003c/strong> Pravna podlaga: tvoja izrecna privolitev, ki jo daš ob ustvarjanju računa in jo lahko kadar koli prekličeš z izbrisom računa. Če je ne daš, ti storitve ne moremo zagotoviti.\u003c/p>\n  \u003cp>\u003cstrong>Funkcije umetne inteligence\u003c/strong> (prepoznavanje živil na fotografiji, klepet o prehrani, povzetki napredka). Pravna podlaga: tvoja privolitev ob uporabi funkcije.\u003c/p>\n  \u003cp>\u003cstrong>Varnost, moderiranje vsebine in odpravljanje napak.\u003c/strong> Pravna podlaga: naš zakoniti interes za varno in delujočo aplikacijo.\u003c/p>\n  \u003cp>\u003cstrong>Zakonske obveznosti\u003c/strong> (izdajanje računov, zahteve organov). Pravna podlaga: izpolnitev zakonske obveznosti.\u003c/p>\n  \u003cp>Tvojih podatkov nikoli ne uporabljamo za oglaševanje in jih ne prodajamo.\u003c/p>\n\n  \u003ch2>4. Avtomatizirane odločitve in umetna inteligenca\u003c/h2>\n  \u003cp>Ocene umetne inteligence (kalorije jedi, predlogi v klepetu) so zgolj okvirne in lahko vsebujejo napake. Odločitve, ki bi imele pravne učinke za tebe, se ne sprejemajo izključno na podlagi avtomatizirane obdelave. Vedno preveri, kar ti predlaga umetna inteligenca.\u003c/p>\n\n  \u003ch2>5. Skupnost, prijatelji in trenerji\u003c/h2>\n  \u003cp>Tvoj profil je \u003cstrong>privzeto zaseben\u003c/strong>. Če ga narediš javnega ali sprejmeš prijateljstvo, ta oseba vidi tvoje uporabniško ime, jedilnike in fotografije.\u003c/p>\n  \u003cp>Če se \u003cstrong>povežeš s trenerjem\u003c/strong>, bo ta lahko videl informacije, ki jih deliš z njim (na primer tvoj napredek, jedilnike in treninge ter sporočila v klepetu), da te lahko svetuje. O povezavi odločaš ti in jo lahko kadar koli prekineš. Plačila med trenerjem in športnikom potekajo zunaj aplikacije, cesta. pa vanje ne posega.\u003c/p>\n\n  \u003ch2>6. Kdo še prejema tvoje podatke\u003c/h2>\n  \u003cp>Potrebne podatke delimo samo z ponudniki, ki delujejo v našem imenu (pogodbeni obdelovalci):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — zbirka podatkov, overjanje, shranjevanje fotografij in strežniške funkcije.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — samo če uporabljaš analizo fotografij ali klepet z umetno inteligenco ter za samodejno moderiranje fotografij, ki jih naložiš (razdelek 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — obračun naročnin.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — ko iščeš izdelek po imenu ali črtni kodi, se ta iskalna poizvedba pošlje zaradi pridobitve podatkov o izdelku.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — prejema tehnična poročila o napakah aplikacije (strežniki v Evropski uniji).\u003c/p>\n  \u003cp>\u003cstrong>Spletno gostovanje in omrežja za dostavo vsebine\u003c/strong> (Netlify ali GitHub Pages, jsDelivr, cdnjs) — dostavljajo aplikacijo in njene knjižnice ter pri tem vidijo tvoj naslov IP.\u003c/p>\n  \u003cp>Povezave na videoposnetke tehnike vaj odprejo zunanji iskalnik (YouTube) samo, ko ti tako izbereš.\u003c/p>\n\n  \u003ch2>7. Mednarodni prenosi\u003c/h2>\n  \u003cp>Tvoji podatki so shranjeni na strežnikih podjetja Supabase v Londonu (Združeno kraljestvo), za katerega velja sklep Evropske komisije o ustreznosti. Google in Stripe lahko obdelujeta podatke zunaj Evropskega gospodarskega prostora (na primer v Združenih državah Amerike) na podlagi okvira EU–ZDA za varstvo podatkov ali standardnih pogodbenih klavzul, ki jih je odobrila Komisija.\u003c/p>\n\n  \u003ch2>8. Moderiranje vsebine in fotografij\u003c/h2>\n  \u003cp>Vsaka fotografija, ki jo naložiš — profilna fotografija, fotografija napredka, jedi, izdelkov, ki jih prispevaš, ali poslana po klepetu — pred sprejetjem preide skozi samodejni filter za moderiranje z umetno inteligenco (Google Gemini).\u003c/p>\n  \u003cp>Zavrnemo in ne shranimo nobene slike, ki vsebuje: golotico ali izrecno oziroma vzpodbudno spolno vsebino; grafično nasilje ali vznemirljivo vsebino; simbole ali sporočila sovraštva, rasistična ali homofobna; ali kakršno koli nezakonito vsebino, vključno z vsako vsebino, ki bi lahko pomenila spolno izkoriščanje ali zlorabo otrok. Če je fotografija zavrnjena, se datoteka zavrže in se nikoli ne shrani.\u003c/p>\n  \u003cp>Iskalnik videoposnetkov tehnike omogoča samo iskanje pravih imen vaj iz zaprtega seznama; nikoli ne pošlje nepreverjenega prostega besedila.\u003c/p>\n  \u003cp>Če zaznamo ali nam je prijavljen račun, ki ponavljajoče nalaga prepovedano vsebino, ga lahko začasno onemogočimo ali izbrišemo ter hranimo strogo potrebne dokaze, če nas zakon zavezuje, da jih sporočimo organom. Neprimerno vsebino lahko prijaviš prek možnosti „Prijavi napako“ v nastavitvah ali s pisanjem na cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Kako dolgo hranimo tvoje podatke\u003c/h2>\n  \u003cp>Dokler je tvoj račun aktiven. Če ga izbrišeš, se tvoji podatki trajno in nepovratno izbrišejo iz naše zbirke podatkov; ostanejo lahko le v varnostnih kopijah, ki jih hranimo največ 8 tednov in se redno prepisujejo. Če je tvoj račun več kot 18 mesecev neaktiven (od tvojega zadnjega vnosa v aplikaciji), ga izbrišemo zaradi neaktivnosti. Podatki o obračunu naročnin se hranijo toliko časa, kolikor zahtevajo davčni in gospodarski predpisi.\u003c/p>\n\n  \u003ch2>10. Tvoje pravice\u003c/h2>\n  \u003cp>Dostopaš lahko do svojih podatkov, jih popraviš (z urejanjem profila), izvoziš (Nastavitve → „Izvozi moje podatke“ in, če imaš modul Bodybuilding, „Prenesi moje podatke modula Bodybuilding“), zahtevaš njihov izbris (gumb „Izbriši moj račun“), ugovarjaš obdelavi ali zahtevaš njeno omejitev, zahtevaš prenosljivost podatkov ter kadar koli prekličeš svojo privolitev. Piši nam na cestafitness@gmail.com in odgovorili ti bomo v zakonskem roku (en mesec).\u003c/p>\n  \u003cp>Če meniš, da nismo pravilno obdelovali tvojih podatkov, lahko vložiš pritožbo pri španski agenciji za varstvo podatkov (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Varnost\u003c/h2>\n  \u003cp>Komunikacija je šifrirana, gesla so shranjena v šifrirani obliki, vsak uporabnik pa lahko dostopa samo do lastnih podatkov prek pravil dostopa v zbirki podatkov. Če bi prišlo do kršitve varnosti, ki bi se te tikala, bi te o tem obvestili in v zakonskih rokih obvestili nadzorni organ.\u003c/p>\n\n  \u003ch2>12. Mladoletniki\u003c/h2>\n  \u003cp>cesta. ni namenjena osebam, mlajšim od 18 let, in računa ne smeš ustvariti, če nimaš dopolnjenih 18 let. Če uporabljaš razdelka Dojenček ali Družina, podatke mladoletnikov, ki jih vneseš, obdelujemo pod tvojo odgovornostjo kot mati, oče ali zakoniti skrbnik in samo za zagotavljanje teh funkcij.\u003c/p>\n\n  \u003ch2>13. Shranjevanje v tvoji napravi (piškotki)\u003c/h2>\n  \u003cp>Ne uporabljamo oglaševalskih piškotkov ali piškotkov za sledenje. V tvoji napravi shranjujemo samo informacije, ki so nujno potrebne za delovanje aplikacije: tvojo sejo, jezik, tvoje nastavitve in kopijo za uporabo brez povezave. Zato ti ne prikazujemo obvestila o piškotkih. Poročila o napakah storitve Sentry so tehnična in se ne uporabljajo za oglaševanje.\u003c/p>\n\n  \u003ch2>13 bis. Modul Bodybuilding: okrepljena zaščita podatkov o zdravju\u003c/h2>\n  \u003cp>\u003cstrong>Kateri podatki.\u003c/strong> Samo če skleneš naročnino na modul in jih vneseš sam/a: ime snovi, pot vnosa, odmerek, datum, pogostost in mesto injiciranja, opombe, navedeni razpolovni čas, tvoja zaloga (količine in roki uporabe), vrednosti tvojih izvidov in njihova referenčna območja, tvoje ocene dnevnega počutja, datum sklenitve in zdravniška poročila, ki jih naložiš. To so podatki o zdravju, posebna vrsta podatkov po Splošni uredbi o varstvu podatkov (GDPR) (čl. 9).\u003c/p>\n  \u003cp>\u003cstrong>Pravna podlaga.\u003c/strong> Tvoja izrecna privolitev (čl. 9(2)(a) GDPR), ki jo podaš s potrditvijo polja ob sklenitvi naročnine. Kadar koli jo lahko prekličeš z izbrisom svojih podatkov v modulu; preklic ne vpliva na prejšnjo obdelavo. Kot dokaz hranimo datum in različico besedila, s katero si privolil/a.\u003c/p>\n  \u003cp>\u003cstrong>Namen in prejemniki.\u003c/strong> Samo za zagotavljanje modula (dnevnik, koledar, krivulje in poročila). Ne uporabljamo jih za oglaševanje ali oblikovanje profilov, ne prodajamo jih in povezani trenerji, prijatelji ter Skupnost jih ne vidijo. Klepet z umetno inteligenco ne prejema tvojih zapisov; prejme samo sporočila, ki jih vpišeš v klepet. Hrani jih Supabase kot obdelovalec; plačila obdeluje Stripe, ki teh podatkov ne prejema. Če v klepetu omeniš snov, se to besedilo pošlje ponudniku umetne inteligence, ki klepet obdeluje (Google Gemini); ne vnašaj podatkov, ki jih ne želiš deliti.\u003c/p>\n  \u003cp>\u003cstrong>Varnost in hramba.\u003c/strong> Tabele z dostopom, omejenim na tvojega uporabnika, in zasebno shrambo za tvoja poročila, s šifriranjem med prenosom in v mirovanju. Hranijo se, dokler uporabljaš modul in dokler jih ne izbrišeš, oziroma do 18 mesecev neaktivnosti računa. Ob izbrisu računa se izbrišejo tudi tvoji zapisi in zdravniška poročila, vsaka aktivna naročnina pa se prekliče.\u003c/p>\n  \u003cp>\u003cstrong>Tvoje pravice in mladoletniki.\u003c/strong> Do teh podatkov lahko dostopaš, jih popraviš in izbrišeš v samem modulu ter uveljavljaš druge pravice, kot je pojasnjeno v razdelku 10. Modul je prepovedan osebam, mlajšim od 18 let.\u003c/p>\n\n  \u003ch2>14. Zdravstveno opozorilo\u003c/h2>\n  \u003cp>cesta. ni medicinski pripomoček in ne nadomešča nasveta zdravnika, dietetika-nutricionista ali trenerja. Če si noseča, doješ, imaš bolezen ali se zdraviš, se pred spremembo prehrane ali telesne dejavnosti posvetuj s strokovnjakom. Izračuni in ocene umetne inteligence so zgolj okvirni.\u003c/p>\n\n  \u003ch2>15. Spremembe te politike\u003c/h2>\n  \u003cp>Če spremenimo kaj pomembnega, te bomo o tem vnaprej obvestili v aplikaciji in, kadar to zahteva zakon, znova zaprosili za tvojo privolitev.\u003c/p>\n\n  \u003ch2>16. Stik\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","et":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Viimati uuendatud: 25.09.2026\u003c/p>\n  \u003cp>\u003cstrong>Kokkuvõte:\u003c/strong> cesta. töötleb terviseandmeid (kaal, kehamõõdud, treeningud, südame löögisagedus), mida isikuandmete kaitse üldmäärus (GDPR) käsitab isikuandmete eriliigina. Kasutame neid ainult teenuse osutamiseks, mitte kunagi reklaamiks ega kolmandatele isikutele müümiseks.\u003c/p>\n\n  \u003ch2>1. Kes on vastutav töötleja\u003c/h2>\n  \u003cp>Sinu andmete vastutav töötleja on \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Privaatsusküsimustega pöördu aadressil cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Milliseid andmeid me kogume\u003c/h2>\n  \u003cp>\u003cstrong>Konto ja profiil:\u003c/strong> e-posti aadress, parool (salvestatud krüpteeritult), kasutajanimi, kaal, pikkus, vanus, sugu, aktiivsustase, eesmärk ja keel.\u003c/p>\n  \u003cp>\u003cstrong>Tervis ja füüsiline vorm:\u003c/strong> kaalu ja mõõtude ajalugu, registreeritud menüüd ja toidud, paastumine, treeningud (seeriad, kordused, raskused, puhkeajad), südame löögisagedus, kui ühendad pulsimõõturi, ning sammud, kaal või kalorid, kui impordid andmeid oma terviserakendusest või Health Connectist. Kui kasutad jaotisi Rasedus või Beebi, siis andmed, mille neisse sisestad (rasedusnädal, beebi vanus, märkmed).\u003c/p>\n  \u003cp>\u003cstrong>Fotod ja sisu:\u003c/strong> fotod, mille üles laadid või laed tehisintellektiga analüüsimiseks, ning vestlussõnumid.\u003c/p>\n  \u003cp>\u003cstrong>Suhted treenerite, sõprade ja kogukonnaga:\u003c/strong> taotlused, seosed ja kõik, mida nendega jagad (vt jaotis 5).\u003c/p>\n  \u003cp>\u003cstrong>Kutsete ja panuste programm:\u003c/strong> sinu kutsekood, kutsutud kasutajad ja toidud, mida andmebaasi panustad.\u003c/p>\n  \u003cp>\u003cstrong>Tehnilised ja kasutusandmed:\u003c/strong> seadme ja brauseri tüüp, IP-aadress, keel, rakenduse vealogid ja põhiline kasutuslogi (milliseid ekraane avad ja millisel registreerimise sammul loobud, ilma igasuguse terviseandmete sisuta ja ilma Kulturismi mooduli ekraanita). Kui oled sisse logitud, seotakse see kasutuslogi sinu kasutajaga. Need on vajalikud rakenduse toimimiseks, vigade parandamiseks ja rakenduse täiustamiseks. Õiguslik alus: meie õigustatud huvi.\u003c/p>\n  \u003cp>\u003cstrong>Teavitused:\u003c/strong> kui lülitad need sisse, salvestame sinu seadme tehnilise tunnuse, et saaksime need sulle saata. Kui lülitad sisse ka seeria meeldetuletuse, salvestame lisaks sinu valitud kellaaja, ajavööndi, praeguse seeria ja viimase sisestuse kuupäeva, et saaksime sind õigel ajal meelde tuletada. Õiguslik alus: sinu nõusolek (luba, mille annad oma brauseris või telefonis, ning meeldetuletuse lüliti), mille võid igal ajal tagasi võtta, lülitades need välja.\u003c/p>\n  \u003cp>\u003cstrong>Maksed:\u003c/strong> kui sõlmid tasulise paketi, teeb makse töötlemise Stripe. Meie ei näe ega salvesta sinu kaardi andmeid; saame ainult teavet sinu tellimuse seisu kohta.\u003c/p>\n\n  \u003ch2>3. Milleks me neid kasutame ja mis õiguslikul alusel\u003c/h2>\n  \u003cp>\u003cstrong>Teenuse osutamine\u003c/strong> (konto loomine, sinu kalori- ja makrotoitainete eesmärkide arvutamine, ostunimekirja koostamine, sinu edenemise kuvamine, sinu tellimuse haldamine). Õiguslik alus: lepingu täitmine.\u003c/p>\n  \u003cp>\u003cstrong>Sinu terviseandmete töötlemine.\u003c/strong> Õiguslik alus: sinu selgesõnaline nõusolek, mille annad konto loomisel ja mille saad igal ajal tagasi võtta oma konto kustutamisega. Kui sa nõusolekut ei anna, ei saa me sulle teenust osutada.\u003c/p>\n  \u003cp>\u003cstrong>Tehisintellekti funktsioonid\u003c/strong> (toidu tuvastamine fotolt, toitumisvestlus, edenemise kokkuvõtted). Õiguslik alus: sinu nõusolek funktsiooni kasutamisel.\u003c/p>\n  \u003cp>\u003cstrong>Turvalisus, sisu modereerimine ja vigade parandamine.\u003c/strong> Õiguslik alus: meie õigustatud huvi hoida rakendus turvalise ja töökorras.\u003c/p>\n  \u003cp>\u003cstrong>Õigusaktidest tulenevad kohustused\u003c/strong> (arvete esitamine, ametiasutuste nõuded). Õiguslik alus: õigusliku kohustuse täitmine.\u003c/p>\n  \u003cp>Me ei kasuta sinu andmeid kunagi reklaamieesmärkidel ega müü neid.\u003c/p>\n\n  \u003ch2>4. Automatiseeritud otsused ja tehisintellekt\u003c/h2>\n  \u003cp>Tehisintellekti hinnangud (roa kalorsus, vestluse soovitused) on ligikaudsed ja võivad sisaldada vigu. Sinu suhtes ei tehta õiguslike tagajärgedega otsuseid ainult automatiseeritud töötlemise põhjal. Kontrolli alati üle, mida tehisintellekt sulle pakub.\u003c/p>\n\n  \u003ch2>5. Kogukond, sõbrad ja treenerid\u003c/h2>\n  \u003cp>Sinu profiil on \u003cstrong>vaikimisi privaatne\u003c/strong>. Kui teed selle avalikuks või nõustud sõprussuhtega, näeb see isik sinu kasutajanime, menüüsid ja fotosid.\u003c/p>\n  \u003cp>Kui \u003cstrong>seod end treeneriga\u003c/strong>, näeb treener teavet, mida temaga jagad (näiteks sinu edenemist, menüüsid ja treeninguid ning vestlussõnumeid), et sind nõustada. Sina otsustad, kas end siduda, ja saad sideme igal ajal katkestada. Treeneri ja sportlase vahelised maksed toimuvad väljaspool rakendust ning cesta. neis ei osale.\u003c/p>\n\n  \u003ch2>6. Kes veel sinu andmeid saab\u003c/h2>\n  \u003cp>Jagame vajalikke andmeid ainult meie nimel tegutsevate teenusepakkujatega (volitatud töötlejatega):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — andmebaas, autentimine, fotode salvestamine ja serverifunktsioonid.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — ainult siis, kui kasutad fotoanalüüsi või tehisintellekti vestlust, ning üleslaaditavate fotode automaatseks modereerimiseks (jaotis 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — tellimuste eest tasumine.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — kui otsid toodet nime või vöötkoodi järgi, saadetakse see otsing tootandmete saamiseks.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — saab rakenduse vigade tehnilisi aruandeid (serverid Euroopa Liidus).\u003c/p>\n  \u003cp>\u003cstrong>Veebimajutus ja sisuedastusvõrgud\u003c/strong> (Netlify või GitHub Pages, jsDelivr, cdnjs) — edastavad rakendust ja selle teeke ning näevad seejuures sinu IP-aadressi.\u003c/p>\n  \u003cp>Harjutuste tehnikavideote lingid avavad välise otsingumootori (YouTube) ainult siis, kui sina seda valid.\u003c/p>\n\n  \u003ch2>7. Rahvusvahelised andmeedastused\u003c/h2>\n  \u003cp>Sinu andmeid hoitakse Supabase'i serverites Londonis (Ühendkuningriik), mille suhtes kehtib Euroopa Komisjoni piisavusotsus. Google ja Stripe võivad töödelda andmeid väljaspool Euroopa Majanduspiirkonda (näiteks Ameerika Ühendriikides), tuginedes ELi ja USA andmeprivaatsuse raamistikule või komisjoni kinnitatud standardsetele lepingutingimustele.\u003c/p>\n\n  \u003ch2>8. Sisu ja fotode modereerimine\u003c/h2>\n  \u003cp>Iga foto, mille üles laadid — profiilifoto, edenemisfoto, roogade fotod, panustatavate toodete fotod või vestluses saadetud foto — läbib enne vastuvõtmist tehisintellektil põhineva automaatse modereerimisfiltri (Google Gemini).\u003c/p>\n  \u003cp>Lükkame tagasi ja ei salvesta ühtegi pilti, mis sisaldab: alastust või otsest või vihjavat seksuaalset sisu; graafilist vägivalda või häirivat sisu; vihkamise, rassistlikke või homofoobseid sümboleid või sõnumeid; või mis tahes ebaseaduslikku sisu, sealhulgas sisu, mis võib kujutada endast laste seksuaalset ärakasutamist või väärkohtlemist. Kui foto lükatakse tagasi, faili kustutatakse ja seda ei salvestata kunagi.\u003c/p>\n  \u003cp>Tehnikavideote otsing lubab otsida ainult suletud loetelus olevaid tegelikke harjutuste nimesid; see ei saada kunagi kontrollimata vabateksti.\u003c/p>\n  \u003cp>Kui tuvastame või meile teatatakse kontost, mis laadib korduvalt üles keelatud sisu, võime selle peatada või kustutada ning säilitada rangelt vajalikke tõendeid, kui seadus kohustab meid neist ametiasutusi teavitama. Sobimatust sisust saad teatada seadetes valiku „Teata veast“ kaudu või kirjutades aadressile cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Kui kaua me sinu andmeid säilitame\u003c/h2>\n  \u003cp>Seni, kuni sinu konto on aktiivne. Kui selle kustutad, kustutatakse sinu andmed meie andmebaasist jäädavalt ja pöördumatult; need võivad jääda vaid varukoopiatesse, mida säilitame kuni 8 nädalat ja mis kirjutatakse korrapäraselt üle. Kui sinu konto on üle 18 kuu tegevuseta (alates sinu viimasest sissekandest rakenduses), kustutame selle tegevusetuse tõttu. Tellimuste arveldusandmeid säilitatakse nii kaua, kui maksu- ja äriõigus nõuab.\u003c/p>\n\n  \u003ch2>10. Sinu õigused\u003c/h2>\n  \u003cp>Sul on õigus oma andmetega tutvuda, neid parandada (profiili muutes), eksportida (Seaded → „Ekspordi minu andmed“ ja, kui sul on Kulturismi moodul, „Laadi alla minu Kulturismi andmed“), nõuda nende kustutamist (nupp „Kustuta minu konto“), esitada töötlemise kohta vastuväiteid või nõuda selle piiramist, nõuda andmete ülekandmist ning võtta oma nõusolek igal ajal tagasi. Kirjuta meile aadressil cestafitness@gmail.com ja vastame sulle seadusjärgse tähtaja jooksul (üks kuu).\u003c/p>\n  \u003cp>Kui arvad, et me pole sinu andmeid õigesti töödelnud, võid esitada kaebuse Hispaania andmekaitseametile (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Turvalisus\u003c/h2>\n  \u003cp>Side on krüpteeritud, paroolid salvestatakse krüpteeritult ja iga kasutaja pääseb ligi ainult oma andmetele andmebaasi juurdepääsureeglite kaudu. Kui toimuks sind puudutav turvaintsident, teavitaksime sind sellest ja järelevalveasutust seadusjärgsetes tähtaegades.\u003c/p>\n\n  \u003ch2>12. Alaealised\u003c/h2>\n  \u003cp>cesta. ei ole mõeldud alla 18-aastastele ja sa ei tohi luua kontot, kui sa pole 18-aastane. Kui kasutad jaotisi Beebi või Pere, töötleme sinu sisestatud alaealiste andmeid sinu vastutusel ema, isa või seadusliku hooldajana ning ainult nende funktsioonide pakkumiseks.\u003c/p>\n\n  \u003ch2>13. Salvestamine sinu seadmes (küpsised)\u003c/h2>\n  \u003cp>Me ei kasuta reklaami- ega jälgimisküpsiseid. Salvestame sinu seadmes ainult rakenduse toimimiseks rangelt vajalikku teavet: sinu seansi, keele, eelistused ja koopia kasutamiseks ilma internetiühenduseta. Seetõttu me ei näita sulle küpsisteteadet. Sentry veaaruanded on tehnilised ja neid ei kasutata reklaamiks.\u003c/p>\n\n  \u003ch2>13 bis. Moodul Kulturism: terviseandmete tugevdatud kaitse\u003c/h2>\n  \u003cp>\u003cstrong>Millised andmed.\u003c/strong> Ainult siis, kui tellid mooduli ja sisestad andmed ise: aine nimetus, manustamisviis, annus, kuupäev, sagedus ja süstekoht, märkmed, märgitud poolestusaeg, sinu varu (kogused ja aegumiskuupäevad), sinu analüüside väärtused ja nende referentsvahemikud, sinu igapäevased heaolu hinnangud, tellimise kuupäev ja üleslaaditud arstlikud aruanded. Need on terviseandmed, isikuandmete kaitse üldmääruse (GDPR) eriliik (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Õiguslik alus.\u003c/strong> Sinu selgesõnaline nõusolek (GDPR art. 9 lõike 2 punkt a), mille annad tellimisel ruutu märkides. Võid selle igal ajal tagasi võtta, kustutades oma mooduli andmed; tagasivõtmine ei mõjuta varasemat töötlemist. Tõendina säilitame kuupäeva ja selle teksti versiooni, millega nõustusid.\u003c/p>\n  \u003cp>\u003cstrong>Eesmärk ja vastuvõtjad.\u003c/strong> Ainult mooduli osutamiseks sulle (logi, kalender, kõverad ja aruanded). Me ei kasuta neid reklaamiks ega profiilide koostamiseks, ei müü neid ning seotud treenerid, sõbrad ja Kogukond neid ei näe. Tehisintellekti vestlus ei saa sinu kirjeid; ta saab ainult sõnumid, mille vestlusesse kirjutad. Andmeid salvestab Supabase volitatud töötlejana; makseid töötleb Stripe, kes neid andmeid ei saa. Kui mainid vestluses mõnda ainet, saadetakse see tekst vestlust töötleva tehisintellekti pakkujale (Google Gemini); ära kirjuta andmeid, mida sa ei soovi jagada.\u003c/p>\n  \u003cp>\u003cstrong>Turvalisus ja säilitamine.\u003c/strong> Tabelid, millele juurdepääs on piiratud sinu kasutajaga, ja privaatne hoidla sinu aruannete jaoks, krüpteeritud edastamisel ja puhkeolekus. Neid säilitatakse seni, kuni mooduli kasutad ja kuni need kustutad, või kuni 18 kuud konto passiivsust. Konto kustutamisel kustutatakse ka sinu kirjed ja arstlikud aruanded ning tühistatakse iga aktiivne tellimus.\u003c/p>\n  \u003cp>\u003cstrong>Sinu õigused ja alaealised.\u003c/strong> Sul on õigus neid andmeid moodulis endas vaadata, parandada ja kustutada ning kasutada teisi õigusi, nagu on selgitatud jaotises 10. Moodul on alla 18-aastastele keelatud.\u003c/p>\n\n  \u003ch2>14. Terviseteade\u003c/h2>\n  \u003cp>cesta. ei ole meditsiiniseade ega asenda arsti, dietoloogi-toitumisnõustaja ega treeneri nõuannet. Kui oled rase, toidad last rinnaga, põed haigust või oled ravil, konsulteeri enne toitumise või kehalise aktiivsuse muutmist spetsialistiga. Arvutused ja tehisintellekti hinnangud on ligikaudsed.\u003c/p>\n\n  \u003ch2>15. Selle poliitika muudatused\u003c/h2>\n  \u003cp>Kui muudame midagi olulist, teavitame sind sellest rakenduses ette ning küsime, kui seadus seda nõuab, uuesti sinu nõusolekut.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","lv":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Pēdējo reizi atjaunināts: 25.09.2026.\u003c/p>\n  \u003cp>\u003cstrong>Kopsavilkums:\u003c/strong> cesta. apstrādā veselības datus (svaru, ķermeņa izmērus, treniņus, sirdsdarbības ātrumu), kurus VDAR uzskata par īpašu personas datu kategoriju. Mēs tos izmantojam tikai pakalpojuma sniegšanai, nekad reklāmai un nepārdodam trešajām personām.\u003c/p>\n\n  \u003ch2>1. Kas ir pārzinis\u003c/h2>\n  \u003cp>Tavu datu pārzinis ir \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Jautājumos par privātumu raksti uz cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Kādus datus mēs vācam\u003c/h2>\n  \u003cp>\u003cstrong>Konts un profils:\u003c/strong> e-pasta adrese, parole (glabājas šifrētā veidā), lietotājvārds, svars, augums, vecums, dzimums, aktivitātes līmenis, mērķis un valoda.\u003c/p>\n  \u003cp>\u003cstrong>Veselība un fiziskā forma:\u003c/strong> svara un izmēru vēsture, reģistrētās ēdienkartes un pārtikas produkti, badošanās, treniņi (sērijas, atkārtojumi, svari, atpūtas pauzes), sirdsdarbības ātrums, ja pieslēdz pulsometru, kā arī soļi, svars vai kalorijas, ja importē datus no savas veselības lietotnes vai no Health Connect. Ja izmanto sadaļas Grūtniecība vai Mazulis, dati, ko tajās ievadi (grūtniecības nedēļa, mazuļa vecums, piezīmes).\u003c/p>\n  \u003cp>\u003cstrong>Fotoattēli un saturs:\u003c/strong> fotoattēli, ko augšupielādē vai analizē ar mākslīgo intelektu, un tērzēšanas ziņojumi.\u003c/p>\n  \u003cp>\u003cstrong>Attiecības ar treneriem, draugiem un kopienu:\u003c/strong> pieprasījumi, saites un viss, ko ar viņiem kopīgo (skat. 5. sadaļu).\u003c/p>\n  \u003cp>\u003cstrong>Uzaicinājumu un ieguldījumu programma:\u003c/strong> tavs uzaicinājuma kods, uzaicinātie lietotāji un pārtikas produkti, ko pievieno datubāzei.\u003c/p>\n  \u003cp>\u003cstrong>Tehniskie un lietošanas dati:\u003c/strong> ierīces un pārlūkprogrammas veids, IP adrese, valoda, lietotnes kļūdu žurnāli un pamata lietošanas žurnāls (kurus ekrānus atver un kurā reģistrācijas solī pārtrauc, bez jebkāda veselības satura un neiekļaujot Muskuļu veidošanas moduļa ekrānu). Ja esi pieteicies, šis lietošanas žurnāls tiek saistīts ar tavu lietotāju. Tie nepieciešami lietotnes darbībai, kļūdu labošanai un lietotnes uzlabošanai. Juridiskais pamats: mūsu leģitīmā interese.\u003c/p>\n  \u003cp>\u003cstrong>Paziņojumi:\u003c/strong> ja tos ieslēdz, mēs saglabājam tavas ierīces tehnisko identifikatoru, lai tos tev nosūtītu. Ja ieslēdz arī sērijas atgādinājumu, mēs saglabājam arī tavu izvēlēto laiku, tavu laika joslu, tavu pašreizējo sēriju un pēdējā ieraksta datumu, lai varētu tev laikus atgādināt. Juridiskais pamats: tava piekrišana (atļauja, ko dod savā pārlūkprogrammā vai tālrunī, un atgādinājuma slēdzis), ko vari atsaukt jebkurā laikā, tos izslēdzot.\u003c/p>\n  \u003cp>\u003cstrong>Maksājumi:\u003c/strong> ja noslēdz maksas plānu, maksājumu apstrādā Stripe. Mēs neredzam un neglabājam tavas kartes datus; saņemam tikai informāciju par tava abonementa statusu.\u003c/p>\n\n  \u003ch2>3. Kam mēs tos izmantojam un uz kāda juridiskā pamata\u003c/h2>\n  \u003cp>\u003cstrong>Pakalpojuma sniegšana\u003c/strong> (konta izveide, tavu kaloriju un makroelementu mērķu aprēķināšana, iepirkumu saraksta izveide, tava progresa attēlošana, tava abonementa pārvaldība). Juridiskais pamats: līguma izpilde.\u003c/p>\n  \u003cp>\u003cstrong>Tavu veselības datu apstrāde.\u003c/strong> Juridiskais pamats: tava nepārprotama piekrišana, ko sniedz, veidojot kontu, un ko vari jebkurā laikā atsaukt, dzēšot savu kontu. Ja to nesniedz, mēs nevaram tev sniegt pakalpojumu.\u003c/p>\n  \u003cp>\u003cstrong>Mākslīgā intelekta funkcijas\u003c/strong> (pārtikas atpazīšana fotoattēlā, uztura tērzēšana, progresa kopsavilkumi). Juridiskais pamats: tava piekrišana, izmantojot funkciju.\u003c/p>\n  \u003cp>\u003cstrong>Drošība, satura moderēšana un kļūdu labošana.\u003c/strong> Juridiskais pamats: mūsu leģitīmās intereses nodrošināt lietotnes drošību un darbību.\u003c/p>\n  \u003cp>\u003cstrong>Juridiskie pienākumi\u003c/strong> (rēķinu izsniegšana, iestāžu pieprasījumi). Juridiskais pamats: juridiskā pienākuma izpilde.\u003c/p>\n  \u003cp>Mēs nekad neizmantojam tavus datus reklāmas nolūkiem un tos nepārdodam.\u003c/p>\n\n  \u003ch2>4. Automatizēti lēmumi un mākslīgais intelekts\u003c/h2>\n  \u003cp>Mākslīgā intelekta aplēses (ēdiena kalorijas, tērzēšanas ieteikumi) ir orientējošas un var saturēt kļūdas. Attiecībā uz tevi netiek pieņemti lēmumi ar juridiskām sekām, pamatojoties tikai uz automatizētu apstrādi. Vienmēr pārbaudi to, ko tev iesaka mākslīgais intelekts.\u003c/p>\n\n  \u003ch2>5. Kopiena, draugi un treneri\u003c/h2>\n  \u003cp>Tavs profils ir \u003cstrong>pēc noklusējuma privāts\u003c/strong>. Ja to padari publisku vai pieņem draudzību, šī persona redz tavu lietotājvārdu, ēdienkartes un fotoattēlus.\u003c/p>\n  \u003cp>Ja \u003cstrong>sasaisti sevi ar treneri\u003c/strong>, viņš varēs redzēt informāciju, ko ar viņu kopīgo (piemēram, tavu progresu, ēdienkartes un treniņus, kā arī tērzēšanas ziņojumus), lai tevi konsultētu. Tu pats izlemj, vai sasaistīties, un vari saikni pārtraukt, kad vēlies. Maksājumi starp treneri un sportistu tiek veikti ārpus lietotnes, un cesta. tajos nepiedalās.\u003c/p>\n\n  \u003ch2>6. Kas vēl saņem tavus datus\u003c/h2>\n  \u003cp>Nepieciešamos datus mēs kopīgojam tikai ar pakalpojumu sniedzējiem, kas darbojas mūsu uzdevumā (apstrādātājiem):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — datubāze, autentifikācija, fotoattēlu glabāšana un servera funkcijas.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — tikai tad, ja izmanto fotoattēlu analīzi vai tērzēšanu ar mākslīgo intelektu, kā arī augšupielādēto fotoattēlu automātiskai moderēšanai (8. sadaļa).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — abonementu maksājumu apstrāde.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — kad meklē produktu pēc nosaukuma vai svītrkoda, šis meklēšanas pieprasījums tiek nosūtīts, lai iegūtu produkta datus.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — saņem tehniskus ziņojumus par lietotnes kļūdām (serveri Eiropas Savienībā).\u003c/p>\n  \u003cp>\u003cstrong>Tīmekļa mitināšana un satura piegādes tīkli\u003c/strong> (Netlify vai GitHub Pages, jsDelivr, cdnjs) — piegādā lietotni un tās bibliotēkas un tādējādi redz tavu IP adresi.\u003c/p>\n  \u003cp>Saites uz vingrinājumu tehnikas video atver ārēju meklētāju (YouTube) tikai tad, kad to izvēlies tu.\u003c/p>\n\n  \u003ch2>7. Starptautiskā datu pārsūtīšana\u003c/h2>\n  \u003cp>Tavi dati tiek glabāti Supabase serveros Londonā (Apvienotā Karaliste), attiecībā uz kuru Eiropas Komisija ir pieņēmusi lēmumu par aizsardzības līmeņa pietiekamību. Google un Stripe var apstrādāt datus ārpus Eiropas Ekonomikas zonas (piemēram, Amerikas Savienotajās Valstīs), pamatojoties uz ES un ASV datu privātuma regulējumu vai Komisijas apstiprinātām standarta līguma klauzulām.\u003c/p>\n\n  \u003ch2>8. Satura un fotoattēlu moderēšana\u003c/h2>\n  \u003cp>Katrs fotoattēls, ko augšupielādē — profila fotoattēls, progresa fotoattēls, ēdienu fotoattēli, pievienoto produktu fotoattēli vai tērzēšanā nosūtīts fotoattēls — pirms pieņemšanas tiek apstrādāts ar automātisku moderēšanas filtru, kas izmanto mākslīgo intelektu (Google Gemini).\u003c/p>\n  \u003cp>Mēs noraidām un neglabājam nevienu attēlu, kas satur: kailumu vai atklātu vai mājienveida seksuālu saturu; grafisku vardarbību vai satraucošu saturu; naida, rasistiskus vai homofobiskus simbolus vai vēstījumus; vai jebkādu nelikumīgu saturu, tostarp jebkuru saturu, kas varētu būt bērnu seksuāla izmantošana vai vardarbība pret bērniem. Ja fotoattēls tiek noraidīts, fails tiek izmests un nekad netiek saglabāts.\u003c/p>\n  \u003cp>Tehnikas video meklētājs ļauj meklēt tikai īstus vingrinājumu nosaukumus no slēgta saraksta; tas nekad nesūta neverificētu brīvu tekstu.\u003c/p>\n  \u003cp>Ja konstatējam vai mums tiek ziņots par kontu, kas atkārtoti augšupielādē aizliegtu saturu, mēs varam to apturēt vai dzēst un saglabāt stingri nepieciešamos pierādījumus, ja likums mums uzliek pienākumu par tiem paziņot iestādēm. Par nepiemērotu saturu vari ziņot, izmantojot iestatījumos opciju „Ziņot par kļūdu” vai rakstot uz cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Cik ilgi mēs glabājam tavus datus\u003c/h2>\n  \u003cp>Kamēr tavs konts ir aktīvs. Ja to izdzēsīsi, tavi dati tiek dzēsti neatgriezeniski un pilnībā no mūsu datubāzes; tie var palikt tikai rezerves kopijās, ko glabājam ne ilgāk kā 8 nedēļas un kas tiek periodiski pārrakstītas. Ja tavs konts ir neaktīvs ilgāk par 18 mēnešiem (skaitot no tava pēdējā ieraksta lietotnē), mēs to dzēšam neaktivitātes dēļ. Abonementu norēķinu dati tiek glabāti tik ilgi, cik prasa nodokļu un komerctiesību normas.\u003c/p>\n\n  \u003ch2>10. Tavas tiesības\u003c/h2>\n  \u003cp>Tu vari piekļūt saviem datiem, tos labot (rediģējot profilu), eksportēt (Iestatījumi → „Eksportēt manus datus” un, ja tev ir Muskuļu veidošanas modulis, „Lejupielādēt manus Muskuļu veidošanas datus”), pieprasīt to dzēšanu (poga „Dzēst manu kontu”), iebilst pret apstrādi vai pieprasīt tās ierobežošanu, pieprasīt datu pārnesamību un jebkurā laikā atsaukt savu piekrišanu. Raksti mums uz cestafitness@gmail.com, un mēs atbildēsim likumā noteiktajā termiņā (viens mēnesis).\u003c/p>\n  \u003cp>Ja uzskati, ka mēs neesam pareizi apstrādājuši tavus datus, vari iesniegt sūdzību Spānijas Datu aizsardzības aģentūrā (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Drošība\u003c/h2>\n  \u003cp>Saziņa ir šifrēta, paroles tiek glabātas šifrētā veidā, un katrs lietotājs var piekļūt tikai saviem datiem, izmantojot piekļuves noteikumus datubāzē. Ja notiktu drošības incidents, kas tevi skartu, mēs tev par to paziņotu un likumā noteiktajos termiņos informētu uzraudzības iestādi.\u003c/p>\n\n  \u003ch2>12. Nepilngadīgie\u003c/h2>\n  \u003cp>cesta. nav paredzēta personām, kas jaunākas par 18 gadiem, un tev nav atļauts veidot kontu, ja tev vēl nav 18 gadu. Ja izmanto sadaļas Mazulis vai Ģimene, nepilngadīgo datus, ko ievadi, mēs apstrādājam uz tavu atbildību kā mātes, tēva vai likumiskā aizbildņa un tikai šo funkciju nodrošināšanai.\u003c/p>\n\n  \u003ch2>13. Glabāšana tavā ierīcē (sīkdatnes)\u003c/h2>\n  \u003cp>Mēs neizmantojam reklāmas vai izsekošanas sīkdatnes. Tavā ierīcē glabājam tikai lietotnes darbībai stingri nepieciešamo informāciju: tavu sesiju, valodu, tavus iestatījumus un kopiju izmantošanai bez interneta savienojuma. Tāpēc mēs tev nerādām paziņojumu par sīkdatnēm. Sentry kļūdu ziņojumi ir tehniski, un tos neizmanto reklāmai.\u003c/p>\n\n  \u003ch2>13 bis. Muskuļu veidošanas modulis: pastiprināta veselības datu aizsardzība\u003c/h2>\n  \u003cp>\u003cstrong>Kādi dati.\u003c/strong> Tikai tad, ja noformē moduli un pats tos ievadi: vielas nosaukums, lietošanas veids, deva, datums, biežums un injekcijas vieta, piezīmes, norādītais pussabrukšanas periods, tavi krājumi (daudzumi un derīguma termiņi), tavu analīžu vērtības un to references intervāli, tavi ikdienas pašsajūtas vērtējumi, abonēšanas datums un augšupielādētie medicīniskie ziņojumi. Tie ir veselības dati — īpaša datu kategorija saskaņā ar VDAR (9. pants).\u003c/p>\n  \u003cp>\u003cstrong>Tiesiskais pamats.\u003c/strong> Tava nepārprotamā piekrišana (VDAR 9. panta 2. punkta a) apakšpunkts), ko tu sniedz, atzīmējot izvēles rūtiņu, noformējot abonementu. Tu vari to atsaukt jebkurā laikā, izdzēšot sava moduļa datus; atsaukšana neietekmē iepriekšējo apstrādi. Mēs kā pierādījumu saglabājam datumu un teksta versiju, kurai tu piekriti.\u003c/p>\n  \u003cp>\u003cstrong>Nolūks un saņēmēji.\u003c/strong> Tikai lai sniegtu tev moduli (uzskaite, kalendārs, līknes un ziņojumi). Mēs tos neizmantojam reklāmai vai profilēšanai, nepārdodam, un piesaistītie treneri, draugi un Kopiena tos neredz. MI tērzēšana nesaņem tavus ierakstus; tā saņem tikai ziņojumus, ko tu pats raksti tērzēšanā. Datus glabā Supabase kā apstrādātājs; maksājumus apstrādā Stripe, kas šos datus nesaņem. Ja tērzēšanā pieminēsi vielu, šis teksts tiek nosūtīts MI pakalpojumu sniedzējam, kas apstrādā tērzēšanu (Google Gemini); nerakstī datus, ko nevēlies kopīgot.\u003c/p>\n  \u003cp>\u003cstrong>Drošība un glabāšana.\u003c/strong> Tabulas ar piekļuvi tikai tavam lietotājam un privāta krātuve taviem ziņojumiem, ar šifrēšanu pārsūtīšanas laikā un glabāšanas laikā. Dati tiek glabāti, kamēr izmanto moduli un līdz tos izdzēs, vai līdz 18 mēnešiem konta neaktivitātes. Dzēšot kontu, tiek izdzēsti arī tavi ieraksti un medicīniskie ziņojumi, un tiek atcelts jebkurš aktīvs abonements.\u003c/p>\n  \u003cp>\u003cstrong>Tavas tiesības un nepilngadīgie.\u003c/strong> Tu vari piekļūt šiem datiem, tos labot un dzēst pašā modulī un izmantot pārējās tiesības, kā paskaidrots 10. sadaļā. Modulis ir aizliegts personām līdz 18 gadu vecumam.\u003c/p>\n\n  \u003ch2>14. Veselības brīdinājums\u003c/h2>\n  \u003cp>cesta. nav medicīnas ierīce un neaizstāj ārsta, dietologa-uztura speciālista vai trenera padomu. Ja esi stāvoklī, baro ar krūti, tev ir slimība vai ārstējies, pirms maini uzturu vai fizisko aktivitāti, konsultējies ar speciālistu. Aprēķini un mākslīgā intelekta aplēses ir orientējoši.\u003c/p>\n\n  \u003ch2>15. Izmaiņas šajā politikā\u003c/h2>\n  \u003cp>Ja mainīsim kaut ko būtisku, mēs par to iepriekš paziņosim lietotnē un, ja to prasa likums, atkārtoti lūgsim tavu piekrišanu.\u003c/p>\n\n  \u003ch2>16. Kontakti\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","lt":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Paskutinį kartą atnaujinta: 2026-09-25\u003c/p>\n  \u003cp>\u003cstrong>Santrauka:\u003c/strong> cesta. tvarko sveikatos duomenis (svorį, kūno matmenis, treniruotes, pulsą), kuriuos BDAR laiko ypatingų kategorijų asmens duomenimis. Naudojame juos tik tam, kad teiktume tau paslaugą, niekada reklamos tikslais ir jų netransliuojame trečiosioms šalims.\u003c/p>\n\n  \u003ch2>1. Kas yra duomenų valdytojas\u003c/h2>\n  \u003cp>Tavo duomenų valdytojas yra \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Bet kokiais privatumo klausimais rašyk adresu cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Kokius duomenis renkame\u003c/h2>\n  \u003cp>\u003cstrong>Paskyra ir profilis:\u003c/strong> el. pašto adresas, slaptažodis (saugomas užšifruotas), naudotojo vardas, svoris, ūgis, amžius, lytis, aktyvumo lygis, tikslas ir kalba.\u003c/p>\n  \u003cp>\u003cstrong>Sveikata ir fizinė forma:\u003c/strong> svorio ir matmenų istorija, užregistruoti valgiaraščiai ir maisto produktai, badavimas, treniruotės (serijos, pakartojimai, svoriai, poilsio pertraukos), pulsas, jei prijungi pulsometrą, taip pat žingsniai, svoris ar kalorijos, jei importuoji duomenis iš savo sveikatos programėlės arba iš Health Connect. Jei naudoji skyrius „Nėštumas“ ar „Kūdikis“, – jose įrašytus duomenis (nėštumo savaitę, kūdikio amžių, pastabas).\u003c/p>\n  \u003cp>\u003cstrong>Nuotraukos ir turinys:\u003c/strong> nuotraukos, kurias įkeli arba analizuoji naudodamas dirbtinį intelektą, ir pokalbio žinutės.\u003c/p>\n  \u003cp>\u003cstrong>Ryšys su treneriais, draugais ir bendruomene:\u003c/strong> prašymai, ryšiai ir tai, ką su jais dalijiesi (žr. 5 skirsnį).\u003c/p>\n  \u003cp>\u003cstrong>Kvietimų ir indėlių programa:\u003c/strong> tavo kvietimo kodas, pakviesti naudotojai ir maisto produktai, kuriuos pateiki į duomenų bazę.\u003c/p>\n  \u003cp>\u003cstrong>Techniniai ir naudojimo duomenys:\u003c/strong> įrenginio ir naršyklės tipas, IP adresas, kalba, programėlės klaidų žurnalai ir pagrindinis naudojimo žurnalas (kuriuos ekranus atidarai ir kuriame registracijos žingsnyje nutrauki, be jokio sveikatos turinio ir neįtraukiant Kultūrizmo modulio ekrano). Jei esi prisijungęs, šis naudojimo žurnalas susiejamas su tavo naudotoju. Jie reikalingi, kad programėlė veiktų, kad galėtume taisyti triktis ir ją tobulinti. Teisinis pagrindas: mūsų teisėtas interesas.\u003c/p>\n  \u003cp>\u003cstrong>Pranešimai:\u003c/strong> jei juos įjungi, saugome techninį tavo įrenginio identifikatorių, kad galėtume juos tau siųsti. Jei įjungi ir serijos priminimą, papildomai saugome tavo pasirinktą laiką, tavo laiko juostą, tavo dabartinę seriją ir paskutinio įrašo datą, kad galėtume tau laiku priminti. Teisinis pagrindas: tavo sutikimas (leidimas, kurį duodi naršyklėje ar telefone, ir priminimo jungiklis), kurį gali bet kada atšaukti juos išjungęs.\u003c/p>\n  \u003cp>\u003cstrong>Mokėjimai:\u003c/strong> jei užsisakai mokamą planą, mokėjimą tvarko Stripe. Mes nematome ir nesaugome tavo kortelės duomenų; gauname tik tavo prenumeratos būseną.\u003c/p>\n\n  \u003ch2>3. Kam juos naudojame ir koks teisinis pagrindas\u003c/h2>\n  \u003cp>\u003cstrong>Paslaugos teikimas\u003c/strong> (paskyros sukūrimas, kalorijų ir makroelementų tikslų apskaičiavimas, pirkinių sąrašo sudarymas, pažangos rodymas, prenumeratos valdymas). Teisinis pagrindas: sutarties vykdymas.\u003c/p>\n  \u003cp>\u003cstrong>Sveikatos duomenų tvarkymas.\u003c/strong> Teisinis pagrindas: tavo aiškus sutikimas, kurį duodi kurdamas paskyrą ir kurį bet kada gali atšaukti ištrindamas paskyrą. Jei sutikimo neduodi, negalime tau teikti paslaugos.\u003c/p>\n  \u003cp>\u003cstrong>Dirbtinio intelekto funkcijos\u003c/strong> (maisto atpažinimas iš nuotraukos, mitybos pokalbis, pažangos santraukos). Teisinis pagrindas: tavo sutikimas, kai naudoji funkciją.\u003c/p>\n  \u003cp>\u003cstrong>Saugumas, turinio moderavimas ir klaidų taisymas.\u003c/strong> Teisinis pagrindas: mūsų teisėtas interesas išlaikyti programėlę saugią ir veikiančią.\u003c/p>\n  \u003cp>\u003cstrong>Teisinės prievolės\u003c/strong> (sąskaitų faktūrų išrašymas, institucijų reikalavimai). Teisinis pagrindas: teisinės prievolės vykdymas.\u003c/p>\n  \u003cp>Niekada nenaudojame tavo duomenų reklamos tikslais ir jų neparduodame.\u003c/p>\n\n  \u003ch2>4. Automatizuoti sprendimai ir dirbtinis intelektas\u003c/h2>\n  \u003cp>DI vertinimai (patiekalo kalorijos, pokalbio pasiūlymai) yra orientaciniai ir gali būti klaidingi. Vien automatizuoto duomenų tvarkymo pagrindu nepriimami sprendimai, turintys teisinių pasekmių tau. Visada peržiūrėk tai, ką siūlo DI.\u003c/p>\n\n  \u003ch2>5. Bendruomenė, draugai ir treneriai\u003c/h2>\n  \u003cp>Tavo profilis pagal numatytuosius nustatymus yra \u003cstrong>privatus\u003c/strong>. Jei padarai jį viešą arba priimi draugystės kvietimą, tas asmuo mato tavo naudotojo vardą, valgiaraščius ir nuotraukas.\u003c/p>\n  \u003cp>Jei \u003cstrong>susiesi su treneriu\u003c/strong>, jis galės matyti informaciją, kuria su juo dalijiesi (pavyzdžiui, tavo pažangą, valgiaraščius ir treniruotes bei pokalbio žinutes), kad galėtų tave konsultuoti. Tu pats sprendi, ar susieti paskyras, ir gali jas atsieti bet kada. Mokėjimai tarp trenerio ir sportininko vykdomi ne programėlėje, o cesta. juose nedalyvauja.\u003c/p>\n\n  \u003ch2>6. Kas dar gauna tavo duomenis\u003c/h2>\n  \u003cp>Dalijamės tik būtinais duomenimis su tiekėjais, kurie veikia mūsų vardu:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — duomenų bazė, autentifikavimas, nuotraukų saugykla ir serverio funkcijos.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — tik jei naudoji nuotraukų analizę ar pokalbį su DI ir automatiniam tavo įkeltų nuotraukų moderavimui (8 skirsnis).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — prenumeratų apmokėjimas.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — kai ieškai produkto pagal pavadinimą ar brūkšninį kodą, ši paieška siunčiama, kad būtų gauti jo duomenys.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — gauna techninius programėlės klaidų pranešimus (serveriai Europos Sąjungoje).\u003c/p>\n  \u003cp>\u003cstrong>Interneto svetainių prieglobos ir turinio pristatymo tinklai\u003c/strong> (Netlify arba GitHub Pages, jsDelivr, cdnjs) — pateikia programėlę ir jos bibliotekas ir taip mato tavo IP adresą.\u003c/p>\n  \u003cp>Nuorodos į pratimų technikos vaizdo įrašus atveria išorinę paieškos sistemą (YouTube) tik tada, kai pats paspaudi.\u003c/p>\n\n  \u003ch2>7. Tarptautiniai duomenų perdavimai\u003c/h2>\n  \u003cp>Tavo duomenys saugomi Supabase serveriuose Londone (Jungtinė Karalystė), kuriai taikomas Europos Komisijos priimtas adekvatumo sprendimas. Google ir Stripe gali tvarkyti duomenis už Europos ekonominės erdvės ribų (pavyzdžiui, Jungtinėse Amerikos Valstijose), remdamiesi ES ir JAV duomenų privatumo programa arba Komisijos patvirtintomis standartinėmis sutarčių sąlygomis.\u003c/p>\n\n  \u003ch2>8. Turinio ir nuotraukų moderavimas\u003c/h2>\n  \u003cp>Kiekviena tavo įkelta nuotrauka — profilio, pažangos, patiekalų, tavo pateiktų produktų arba išsiųsta pokalbyje — prieš ją priimant praeina automatinį moderavimo filtrą, naudojantį dirbtinį intelektą (Google Gemini).\u003c/p>\n  \u003cp>Atmetame ir nesaugome jokio vaizdo, kuriame yra: nuogumo ar aiškaus arba užuominomis reiškiamo seksualinio turinio; grafinio smurto ar bauginančio turinio; neapykantos, rasistinių ar homofobinių simbolių ar žinučių; arba bet kokio neteisėto turinio, įskaitant bet kokį turinį, kuris galėtų būti vaikų seksualinis išnaudojimas ar prievarta prieš vaikus. Jei nuotrauka atmetama, failas išmetamas ir jis net nebus išsaugotas.\u003c/p>\n  \u003cp>Technikos vaizdo įrašų paieška leidžia ieškoti tik tikrų pratimų pavadinimų iš uždaro sąrašo; ji niekada nesiunčia nepatikrinto laisvo teksto.\u003c/p>\n  \u003cp>Jei nustatome arba mums pranešama apie paskyrą, kuri pakartotinai įkelia draudžiamą turinį, galime ją sustabdyti arba ištrinti ir saugoti griežtai būtinus įrodymus, jei įstatymas įpareigoja apie tai pranešti institucijoms. Apie netinkamą turinį gali pranešti per „Pranešk apie klaidą“ nustatymuose arba parašęs adresu cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Kiek laiko saugome tavo duomenis\u003c/h2>\n  \u003cp>Kol tavo paskyra aktyvi. Jei ją ištrini, tavo duomenys visam laikui ir negrįžtamai ištrinami iš mūsų duomenų bazės; jie gali likti tik atsarginėse kopijose, kurias saugome ne ilgiau kaip 8 savaites ir kurios periodiškai perrašomos. Jei tavo paskyra neaktyvi ilgiau nei 18 mėnesių (skaičiuojant nuo tavo paskutinio įrašo programėlėje), ištriname ją dėl neaktyvumo. Prenumeratų atsiskaitymo duomenys saugomi tiek, kiek reikalauja mokesčių ir prekybos teisės aktai.\u003c/p>\n\n  \u003ch2>10. Tavo teisės\u003c/h2>\n  \u003cp>Gali susipažinti su savo duomenimis, juos ištaisyti (redaguodamas profilį), eksportuoti (Nustatymai → „Eksportuoti mano duomenis“ ir, jei turi Kultūrizmo modulį, „Atsisiųsti mano Kultūrizmo duomenis“), prašyti juos ištrinti (mygtukas „Ištrinti mano paskyrą“), nesutikti su jų tvarkymu arba jį apriboti, prašyti duomenų perkeliamumo ir bet kada atšaukti sutikimą. Rašyk mums adresu cestafitness@gmail.com ir atsakysime per teisės aktų nustatytą terminą (vieną mėnesį).\u003c/p>\n  \u003cp>Jei manai, kad tavo duomenys buvo tvarkomi netinkamai, gali pateikti skundą Ispanijos duomenų apsaugos agentūrai (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Saugumas\u003c/h2>\n  \u003cp>Ryšiai yra šifruojami, slaptažodžiai saugomi užšifruoti, o kiekvienas naudotojas gali pasiekti tik savo duomenis pagal duomenų bazės prieigos taisykles. Jei įvyktų saugumo pažeidimas, kuris tave paveiktų, apie tai tau pranešime ir informuosime priežiūros instituciją teisės aktų nustatytais terminais.\u003c/p>\n\n  \u003ch2>12. Nepilnamečiai\u003c/h2>\n  \u003cp>cesta. nėra skirta jaunesniems nei 18 metų asmenims, ir tu neturi kurti paskyros, jei tokio amžiaus nesi sulaukęs. Jei naudoji skyrius „Kūdikis“ ar „Šeima“, nepilnamečių duomenis, kuriuos įvedi, tvarkome tavo atsakomybe kaip motinos, tėvo ar teisėto globėjo ir tik tam, kad galėtume tau teikti šias funkcijas.\u003c/p>\n\n  \u003ch2>13. Saugojimas tavo įrenginyje (slapukai)\u003c/h2>\n  \u003cp>Nenaudojame reklamos ar sekimo slapukų. Tavo įrenginyje saugome tik informaciją, kuri yra griežtai būtina programėlei veikti: tavo sesiją, kalbą, nuostatas ir kopiją, skirtą naudoti neprisijungus prie interneto. Todėl nerodome slapukų pranešimo. Sentry klaidų ataskaitos yra techninės ir nenaudojamos reklamai.\u003c/p>\n\n  \u003ch2>13 bis. Kultūrizmo modulis: sustiprinta sveikatos duomenų apsauga\u003c/h2>\n  \u003cp>\u003cstrong>Kokie duomenys.\u003c/strong> Tik jei užsisakai modulį ir juos pats įvedi: medžiagos pavadinimas, vartojimo būdas, dozė, data, dažnumas ir injekcijos vieta, pastabos, nurodyta pusinės eliminacijos trukmė, tavo inventorius (kiekiai ir galiojimo laikai), tavo tyrimų reikšmės ir jų referencinės ribos, kasdienės savijautos įvertinimai, užsakymo data ir įkeltos medicininės ataskaitos. Tai sveikatos duomenys – ypatingoji duomenų kategorija pagal BDAR (9 str.).\u003c/p>\n  \u003cp>\u003cstrong>Teisinis pagrindas.\u003c/strong> Tavo aiškus sutikimas (BDAR 9 str. 2 d. a p.), kurį duodi pažymėdamas langelį užsisakydamas. Gali jį atšaukti bet kada ištrindamas savo modulio duomenis; atšaukimas neturi įtakos ankstesniam tvarkymui. Kaip įrodymą saugome datą ir teksto versiją, su kuria sutikai.\u003c/p>\n  \u003cp>\u003cstrong>Tikslas ir gavėjai.\u003c/strong> Tik tam, kad tau teiktume modulį (žymėjimas, kalendorius, kreivės ir ataskaitos). Jų nenaudojame reklamai ar profiliavimui, neparduodame, ir susieti treneriai, draugai bei Bendruomenė jų nemato. DI pokalbis negauna tavo įrašų; jis gauna tik žinutes, kurias pats rašai pokalbyje. Juos saugo Supabase kaip duomenų tvarkytojas; mokėjimus apdoroja Stripe, kuris šių duomenų negauna. Jei pokalbyje paminėsi medžiagą, tas tekstas siunčiamas pokalbį apdorojančiam DI teikėjui (Google Gemini); nerašyk duomenų, kuriais nenori dalytis.\u003c/p>\n  \u003cp>\u003cstrong>Sauga ir saugojimas.\u003c/strong> Lentelės, prieinamos tik tavo naudotojui, ir privati saugykla tavo ataskaitoms, su šifravimu perdavimo metu ir saugant. Duomenys saugomi, kol naudojiesi moduliu ir kol juos ištrinsi, arba iki 18 mėnesių paskyros neaktyvumo. Ištrynus paskyrą taip pat ištrinami tavo įrašai ir medicininės ataskaitos, o bet kokia aktyvi prenumerata atšaukiama.\u003c/p>\n  \u003cp>\u003cstrong>Tavo teisės ir nepilnamečiai.\u003c/strong> Gali susipažinti su šiais duomenimis, juos ištaisyti ir ištrinti pačiame modulyje bei pasinaudoti kitomis teisėmis, kaip paaiškinta 10 skyriuje. Modulis draudžiamas jaunesniems nei 18 metų asmenims.\u003c/p>\n\n  \u003ch2>14. Sveikatos įspėjimas\u003c/h2>\n  \u003cp>cesta. nėra medicinos priemonė ir nepakeičia gydytojo, dietologo ar trenerio patarimo. Jei esi nėščia, žindai, sergi liga ar laikaisi gydymo, prieš keisdama mitybą ar fizinį aktyvumą pasitark su specialistu. Skaičiavimai ir DI vertinimai yra orientaciniai.\u003c/p>\n\n  \u003ch2>15. Šios politikos pakeitimai\u003c/h2>\n  \u003cp>Jei pakeisime ką nors svarbaus, apie tai iš anksto pranešime programėlėje ir, kai to reikalauja įstatymas, vėl paprašysime tavo sutikimo.\u003c/p>\n\n  \u003ch2>16. Kontaktai\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","mt":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Aġġornata l-aħħar: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Sommarju:\u003c/strong> cesta. tipproċessa data dwar is-saħħa (piż, kejl tal-ġisem, taħriġ, rata tal-qalb), li l-GDPR tikkunsidra bħala kategorija speċjali ta' data personali. Nużawha biss biex nipprovdulek is-servizz, qatt għal skopijiet ta' reklamar u qatt ma nbiegħuha lil partijiet terzi.\u003c/p>\n\n  \u003ch2>1. Min huwa l-kontrollur\u003c/h2>\n  \u003cp>Il-kontrollur tad-data tiegħek huwa \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Għal kwalunkwe mistoqsija dwar il-privatezza, ikteb lil cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Liema data niġbru\u003c/h2>\n  \u003cp>\u003cstrong>Kont u profil:\u003c/strong> email, password (maħżuna kriptata), isem tal-utent, piż, tul, età, sess, livell ta' attività, għan u lingwa.\u003c/p>\n  \u003cp>\u003cstrong>Saħħa u kundizzjoni fiżika:\u003c/strong> storja tal-piż u tal-kejl, menus u ikel irreġistrat, sawm, taħriġ (sets, repetizzjonijiet, piżijiet, mistrieħ), rata tal-qalb jekk tgħaqqad monitor tal-qalb, u passi, piż jew kaloriji jekk timporta data mill-app tas-saħħa tiegħek jew minn Health Connect. Jekk tuża t-taqsimiet tat-Tqala jew tat-Tarbija, id-data li tikteb fihom (ġimgħa tat-tqala, età tat-tarbija, noti).\u003c/p>\n  \u003cp>\u003cstrong>Ritratti u kontenut:\u003c/strong> ir-ritratti li tgħabbi jew tanalizza bl-intelliġenza artifiċjali, u l-messaġġi taċ-chat.\u003c/p>\n  \u003cp>\u003cstrong>Relazzjoni ma' surġenti, ħbieb u komunità:\u003c/strong> talbiet, rabtiet u dak li taqsam magħhom (ara t-taqsima 5).\u003c/p>\n  \u003cp>\u003cstrong>Programm ta' stediniet u kontribuzzjonijiet:\u003c/strong> il-kodiċi ta' stedina tiegħek, l-utenti mistiedna u l-ikel li tikkontribwixxi fil-bażi tad-data.\u003c/p>\n  \u003cp>\u003cstrong>Data teknika u tal-użu:\u003c/strong> tip ta' apparat u browser, indirizz IP, lingwa, rekords ta' żbalji tal-applikazzjoni u rekord bażiku tal-użu (liema skrejjen tiftaħ u f'liema pass tar-reġistrazzjoni tabbanduna, mingħajr ebda kontenut tas-saħħa u mingħajr l-iskrin tal-modulu Bodybuilding). Jekk illoggjajt, dan ir-rekord tal-użu jitqabbad mal-utent tiegħek. Jservu biex l-app taħdem, biex nikkoreġu l-ħsarat u biex intejbuha. Bażi legali: l-interess leġittimu tagħna.\u003c/p>\n  \u003cp>\u003cstrong>Notifiki:\u003c/strong> jekk tattivahom, niżammu l-identifikatur tekniku tal-apparat tiegħek biex nibagħtuhom lilek. Jekk tattiva wkoll it-tfakkira tas-serje, niżammu wkoll il-ħin li tagħżel, iż-żona tal-ħin tiegħek, is-serje attwali tiegħek u d-data tal-aħħar reġistrazzjoni tiegħek, biex inkunu nistgħu nfakkrukom fil-ħin. Bażi legali: il-kunsens tiegħek (il-permess li tagħti fil-browser jew fuq il-mowbajl tiegħek u l-iswiċċ tat-tfakkira), li tista' tirtira f'kull ħin billi tiddiżattivahom.\u003c/p>\n  \u003cp>\u003cstrong>Pagamenti:\u003c/strong> jekk tissottoskrivi għal pjan bi ħlas, Stripe jieħu ħsieb il-ħlas. Aħna ma narawx u ma naħżnux id-dettalji tal-karta tiegħek; nirċievu biss l-istatus tas-sottoskrizzjoni tiegħek.\u003c/p>\n\n  \u003ch2>3. Għal xiex nużawha u fuq liema bażi legali\u003c/h2>\n  \u003cp>\u003cstrong>Biex nipprovdulek is-servizz\u003c/strong> (toħloq il-kont tiegħek, tikkalkula l-miri tiegħek tal-kaloriji u tal-makronutrijenti, tiġġenera l-lista tax-xiri, turi l-progress tiegħek, timmaniġġja s-sottoskrizzjoni tiegħek). Bażi legali: l-eżekuzzjoni tal-kuntratt.\u003c/p>\n  \u003cp>\u003cstrong>Biex nipproċessaw id-data tiegħek dwar is-saħħa.\u003c/strong> Bażi legali: il-kunsens espliċitu tiegħek, li tagħtina meta toħloq il-kont u li tista' tirtira f'kull ħin billi tħassar il-kont tiegħek. Jekk ma tagħtihx, ma nistgħux nipprovdulek is-servizz.\u003c/p>\n  \u003cp>\u003cstrong>Funzjonijiet tal-intelliġenza artifiċjali\u003c/strong> (identifikazzjoni tal-ikel f'ritratt, chat dwar in-nutrizzjoni, sommarji tal-progress). Bażi legali: il-kunsens tiegħek meta tuża l-funzjoni.\u003c/p>\n  \u003cp>\u003cstrong>Sigurtà, moderazzjoni tal-kontenut u korrezzjoni ta' żbalji.\u003c/strong> Bażi legali: l-interess leġittimu tagħna li nżommu l-applikazzjoni sikura u li taħdem.\u003c/p>\n  \u003cp>\u003cstrong>Obbligi legali\u003c/strong> (fatturazzjoni, rekwiżiti tal-awtoritajiet). Bażi legali: il-konformità ma' obbligu legali.\u003c/p>\n  \u003cp>Qatt ma nużaw id-data tiegħek għal skopijiet ta' reklamar u qatt ma nbiegħuha.\u003c/p>\n\n  \u003ch2>4. Deċiżjonijiet awtomatizzati u intelliġenza artifiċjali\u003c/h2>\n  \u003cp>L-istimi tal-IA (kaloriji ta' platt, suġġerimenti taċ-chat) huma indikattivi u jistgħu jkun fihom żbalji. Ma jittieħdux deċiżjonijiet b'effetti legali fuqek ibbażati biss fuq proċessar awtomatizzat. Dejjem irrevedi dak li tipproponi l-IA.\u003c/p>\n\n  \u003ch2>5. Komunità, ħbieb u surġenti\u003c/h2>\n  \u003cp>Il-profil tiegħek huwa \u003cstrong>privat awtomatikament\u003c/strong>. Jekk tagħmlu pubbliku jew taċċetta ħbiberija, dik il-persuna tara l-isem tal-utent tiegħek, il-menus u r-ritratti.\u003c/p>\n  \u003cp>Jekk \u003cstrong>tgħaqqad ma' surġent\u003c/strong>, dan ikun jista' jara l-informazzjoni li taqsam miegħu (pereżempju l-progress tiegħek, il-menus u t-taħriġ tiegħek, u l-messaġġi taċ-chat) biex jagħtik parir. Int tiddeċiedi jekk tgħaqqadx u tista' tneħħi r-rabta meta trid. Il-ħlasijiet bejn is-surġent u l-atleta jsiru barra mill-app u cesta. ma tiħux sehem fihom.\u003c/p>\n\n  \u003ch2>6. Min ieħor jirċievi d-data tiegħek\u003c/h2>\n  \u003cp>Naqsmu biss id-data meħtieġa ma' fornituri li jaġixxu f'isimna:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — bażi tad-data, awtentikazzjoni, ħażna tar-ritratti u funzjonijiet tas-server.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — biss jekk tuża l-analiżi tar-ritratti jew iċ-chat bl-IA, u biex jiġu moderati awtomatikament ir-ritratti li tgħabbi (taqsima 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — ħlas tas-sottoskrizzjonijiet.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — meta tfittex prodott skont l-isem jew il-barcode tiegħu, dik it-tfittxija tintbagħat biex tinkiseb id-data tiegħu.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — jirċievi rapporti tekniċi ta' żbalji tal-applikazzjoni (servers fl-Unjoni Ewropea).\u003c/p>\n  \u003cp>\u003cstrong>Hosting tal-web u netwerks ta' kunsinna tal-kontenut\u003c/strong> (Netlify jew GitHub Pages, jsDelivr, cdnjs) — jiservu l-applikazzjoni u l-libreriji tagħha u, meta jagħmlu dan, jaraw l-indirizz IP tiegħek.\u003c/p>\n  \u003cp>Il-links għal vidjows tat-teknika tal-eżerċizzji jiftħu magna tat-tfittxija esterna (YouTube) biss meta int tagħfas.\u003c/p>\n\n  \u003ch2>7. Trasferimenti internazzjonali\u003c/h2>\n  \u003cp>Id-data tiegħek tinħażen fuq servers ta' Supabase f'Londra (Renju Unit), li għandu deċiżjoni ta' adegwatezza tal-Kummissjoni Ewropea. Google u Stripe jistgħu jipproċessaw data barra ż-Żona Ekonomika Ewropea (pereżempju fl-Istati Uniti), bis-saħħa tal-Qafas tal-Privatezza tad-Data UE-Stati Uniti jew ta' klawsoli kontrattwali standard approvati mill-Kummissjoni.\u003c/p>\n\n  \u003ch2>8. Moderazzjoni tal-kontenut u tar-ritratti\u003c/h2>\n  \u003cp>Kull ritratt li tgħabbi — ritratt tal-profil, tal-progress, ta' platti, ta' prodotti li tikkontribwixxi, jew mibgħut permezz taċ-chat — jgħaddi minn filtru awtomatiku ta' moderazzjoni bl-intelliġenza artifiċjali (Google Gemini) qabel ma jiġi aċċettat.\u003c/p>\n  \u003cp>Nirrifjutaw u ma naħżnux ebda immaġni li fiha: nudità jew kontenut sesswali espliċitu jew suġġestiv; vjolenza grafika jew kontenut inkwetanti; simboli jew messaġġi ta' mibgħeda, razzisti jew omofobiċi; jew kwalunkwe kontenut illegali, inkluż kwalunkwe kontenut li jista' jikkostitwixxi sfruttament jew abbuż sesswali tat-tfal. Jekk ritratt jiġi rrifjutat, il-fajl jintrema u qatt ma jinħażen.\u003c/p>\n  \u003cp>L-għodda tat-tfittxija tal-vidjows tat-teknika tippermetti biss tfittxija ta' ismijiet reali ta' eżerċizzji minn lista magħluqa; qatt ma tibgħat test ħieles mhux verifikat.\u003c/p>\n  \u003cp>Jekk nindunaw, jew jirrapportawlna, b'kont li jgħabbi kontenut projbit b'mod ripetut, nistgħu nissospendu jew inħassru, u nżommu l-evidenza strettament meħtieġa jekk il-liġi tobbligana nikkomunikawha lill-awtoritajiet. Tista' tirrapporta kontenut mhux xieraq minn «Irrapporta żball» fl-issettjar jew billi tikteb lil cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Kemm iddum inżommu d-data tiegħek\u003c/h2>\n  \u003cp>Sakemm il-kont tiegħek ikun attiv. Jekk tħassru, id-data tiegħek titneħħa b'mod permanenti u irriversibbli mid-database tagħna; tista' tibqa' biss fil-kopji ta' backup, li ninżammu għal massimu ta' 8 ġimgħat u li jinkitbu fuqhom perjodikament. Jekk il-kont tiegħek jgħaddi aktar minn 18-il xahar mingħajr attività (magħduda mill-aħħar reġistrazzjoni tiegħek fl-app), inħassruh minħabba inattività. Id-data tal-fatturazzjoni tas-sottoskrizzjonijiet tinżamm sakemm tirrikjedi l-leġiżlazzjoni fiskali u kummerċjali.\u003c/p>\n\n  \u003ch2>10. Id-drittijiet tiegħek\u003c/h2>\n  \u003cp>Tista' taċċessa d-data tiegħek, tikkoreġiha (billi teditja l-profil tiegħek), tesportaha (Settings → «Esporta d-data tiegħi» u, jekk għandek il-modulu Bodybuilding, «Niżżel id-dejta tiegħi tal-Bodybuilding»), titlob it-tħassir tagħha (buttuna «Ħassar il-kont tiegħi»), topponi jew tillimita l-ipproċessar tagħha, titlob il-portabbiltà tagħha u tirtira l-kunsens tiegħek f'kull ħin. Ikteb lil cestafitness@gmail.com u nirrispondulek fi żmien il-limitu legali (xahar).\u003c/p>\n  \u003cp>Jekk temmen li ma ttrattajniex sew id-data tiegħek, tista' tressaq ilment quddiem l-Aġenzija Spanjola għall-Protezzjoni tad-Data (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Sigurtà\u003c/h2>\n  \u003cp>Il-komunikazzjonijiet huma kriptati, il-passwords jinħażnu kriptati u kull utent jista' jaċċessa biss id-data tiegħu stess permezz ta' regoli ta' aċċess fil-bażi tad-data. Jekk ikun hemm ksur tas-sigurtà li jolqotek, nikkomunikawlek dan u ninfurmaw lill-awtorità superviżorja fil-limiti ta' żmien legali.\u003c/p>\n\n  \u003ch2>12. Minorenni\u003c/h2>\n  \u003cp>cesta. mhijiex intiża għal persuni taħt l-18-il sena u m'għandekx toħloq kont jekk ma għandekx din l-età. Jekk tuża t-taqsimiet tat-Tarbija jew tal-Familja, id-data ta' minorenni li tidħol nittrattawha taħt ir-responsabbiltà tiegħek bħala omm, missier jew tutur legali, u biss biex nipprovdulek dawn il-funzjonijiet.\u003c/p>\n\n  \u003ch2>13. Ħażna fuq l-apparat tiegħek (cookies)\u003c/h2>\n  \u003cp>Ma nużawx cookies ta' reklamar jew ta' traċċar. Fuq l-apparat tiegħek i
