var DOCS={"es":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Última actualización: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Resumen:\u003c/strong> cesta. trata datos de salud (peso, medidas corporales, entrenamientos, ritmo cardíaco), que el RGPD considera una categoría especial de datos. Solo los usamos para prestarte el servicio, nunca para publicidad ni para venderlos a terceros.\u003c/p>\n\n  \u003ch2>1. Quién es el responsable\u003c/h2>\n  \u003cp>El responsable del tratamiento de tus datos es \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Para cualquier cuestión sobre privacidad, escribe a cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Qué datos recogemos\u003c/h2>\n  \u003cp>\u003cstrong>Cuenta y perfil:\u003c/strong> email, contraseña (guardada cifrada), nombre de usuario, peso, altura, edad, sexo, nivel de actividad, objetivo e idioma.\u003c/p>\n  \u003cp>\u003cstrong>Salud y forma física:\u003c/strong> historial de peso y medidas, menús y alimentos registrados, ayuno, entrenamientos (series, repeticiones, pesos, descansos), ritmo cardíaco si conectas un pulsómetro, y pasos, peso o calorías si importas datos de tu app de salud o de Health Connect. Si usas las secciones de Embarazo o de Bebé, los datos que escribas en ellas (semana de embarazo, edad del bebé, notas).\u003c/p>\n  \u003cp>\u003cstrong>Fotos y contenido:\u003c/strong> las fotos que subes o analizas con inteligencia artificial, y los mensajes de chat.\u003c/p>\n  \u003cp>\u003cstrong>Relación con entrenadores, amigos y comunidad:\u003c/strong> solicitudes, vínculos y lo que compartas con ellos (ver apartado 5).\u003c/p>\n  \u003cp>\u003cstrong>Programa de invitaciones y aportaciones:\u003c/strong> tu código de invitación, los usuarios invitados y los alimentos que aportes a la base de datos.\u003c/p>\n  \u003cp>\u003cstrong>Datos técnicos y de uso:\u003c/strong> tipo de dispositivo y navegador, dirección IP, idioma, registros de errores de la aplicación y un registro básico de uso (qué pantallas abres y en qué paso del registro abandonas, sin ningún contenido de salud y sin incluir la pantalla del módulo Culturismo). Si has iniciado sesión, ese registro de uso se asocia a tu usuario. Sirven para que la app funcione, para corregir fallos y para mejorarla. Base legal: nuestro interés legítimo.\u003c/p>\n  \u003cp>\u003cstrong>Notificaciones:\u003c/strong> si las activas, guardamos el identificador técnico de tu dispositivo para enviártelas. Si activas además el recordatorio de racha, guardamos también la hora que elijas, tu zona horaria, tu racha actual y la fecha de tu último registro, para poder avisarte a tiempo. Base legal: tu consentimiento (el permiso que das en tu navegador o en tu móvil y el interruptor del recordatorio), que puedes retirar cuando quieras desactivándolos.\u003c/p>\n  \u003cp>\u003cstrong>Pagos:\u003c/strong> si contratas un plan de pago, Stripe gestiona el cobro. Nosotros no vemos ni guardamos los datos de tu tarjeta; solo recibimos el estado de tu suscripción.\u003c/p>\n\n  \u003ch2>3. Para qué los usamos y con qué base legal\u003c/h2>\n  \u003cp>\u003cstrong>Prestarte el servicio\u003c/strong> (crear tu cuenta, calcular tus objetivos de calorías y macronutrientes, generar tu lista de la compra, mostrar tu progreso, gestionar tu suscripción). Base legal: la ejecución del contrato.\u003c/p>\n  \u003cp>\u003cstrong>Tratar tus datos de salud.\u003c/strong> Base legal: tu consentimiento explícito, que nos das al crear la cuenta y puedes retirar en cualquier momento borrando tu cuenta. Si no lo das, no podemos ofrecerte el servicio.\u003c/p>\n  \u003cp>\u003cstrong>Funciones de inteligencia artificial\u003c/strong> (identificar alimentos en una foto, chat de nutrición, resúmenes de progreso). Base legal: tu consentimiento al usar la función.\u003c/p>\n  \u003cp>\u003cstrong>Seguridad, moderación de contenido y corrección de errores.\u003c/strong> Base legal: nuestro interés legítimo en mantener la aplicación segura y funcionando.\u003c/p>\n  \u003cp>\u003cstrong>Obligaciones legales\u003c/strong> (facturación, requerimientos de autoridades). Base legal: el cumplimiento de una obligación legal.\u003c/p>\n  \u003cp>Nunca usamos tus datos con fines publicitarios ni los vendemos.\u003c/p>\n\n  \u003ch2>4. Decisiones automatizadas e inteligencia artificial\u003c/h2>\n  \u003cp>Las estimaciones de la IA (calorías de un plato, sugerencias de chat) son orientativas y pueden contener errores. No se toman decisiones con efectos jurídicos sobre ti basadas únicamente en tratamientos automatizados. Revisa siempre lo que te propone la IA.\u003c/p>\n\n  \u003ch2>5. Comunidad, amigos y entrenadores\u003c/h2>\n  \u003cp>Tu perfil es \u003cstrong>privado por defecto\u003c/strong>. Si lo haces público o aceptas una amistad, esa persona ve tu nombre de usuario, menús y fotos.\u003c/p>\n  \u003cp>Si te \u003cstrong>vinculas con un entrenador\u003c/strong>, este podrá ver la información que compartas con él (por ejemplo tu progreso, tus menús y entrenamientos, y los mensajes del chat) para asesorarte. Eres tú quien decide vincularte y puedes desvincularte cuando quieras. Los pagos entre entrenador y atleta se hacen fuera de la app y cesta. no interviene en ellos.\u003c/p>\n\n  \u003ch2>6. Quién más recibe tus datos\u003c/h2>\n  \u003cp>Solo compartimos los datos necesarios con proveedores que actúan por nuestra cuenta:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — base de datos, autenticación, almacenamiento de fotos y funciones de servidor.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — solo si usas el análisis de fotos o el chat con IA, y para moderar automáticamente las fotos que subes (apartado 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — cobro de suscripciones.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — cuando buscas un producto por su nombre o código de barras, se envía esa búsqueda para obtener sus datos.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — recibe informes técnicos de errores de la aplicación (servidores en la Unión Europea).\u003c/p>\n  \u003cp>\u003cstrong>Alojamiento web y redes de distribución de contenido\u003c/strong> (Netlify o GitHub Pages, jsDelivr, cdnjs) — sirven la aplicación y sus bibliotecas y, al hacerlo, ven tu dirección IP.\u003c/p>\n  \u003cp>Los enlaces a vídeos de técnica de ejercicios abren un buscador externo (YouTube) solo cuando tú pulsas.\u003c/p>\n\n  \u003ch2>7. Transferencias internacionales\u003c/h2>\n  \u003cp>Tus datos se almacenan en servidores de Supabase en Londres (Reino Unido), que cuenta con una decisión de adecuación de la Comisión Europea. Google y Stripe pueden tratar datos fuera del Espacio Económico Europeo (por ejemplo en Estados Unidos), amparándose en el Marco de Privacidad de Datos UE-EE. UU. o en cláusulas contractuales tipo aprobadas por la Comisión.\u003c/p>\n\n  \u003ch2>8. Moderación de contenido y fotos\u003c/h2>\n  \u003cp>Toda fotografía que subas —foto de perfil, de progreso, de platos, de productos que aportes, o enviada por chat— pasa por un filtro automático de moderación con inteligencia artificial (Google Gemini) antes de aceptarse.\u003c/p>\n  \u003cp>Rechazamos y no guardamos ninguna imagen que contenga: desnudez o contenido sexual explícito o insinuante; violencia gráfica o contenido perturbador; símbolos o mensajes de odio, racistas u homófobos; o cualquier contenido ilegal, incluido cualquier contenido que pueda constituir explotación o abuso sexual infantil. Si una foto se rechaza, el archivo se descarta y no llega a guardarse.\u003c/p>\n  \u003cp>El buscador de vídeos de técnica solo permite buscar nombres reales de ejercicios de una lista cerrada; nunca envía texto libre sin verificar.\u003c/p>\n  \u003cp>Si detectamos, o nos reportan, una cuenta que sube repetidamente contenido prohibido, podemos suspenderla o eliminarla, y conservar la evidencia estrictamente necesaria si la ley nos obliga a comunicarla a las autoridades. Puedes reportar contenido inapropiado desde «Reporta un fallo» en los ajustes o escribiendo a cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Cuánto tiempo conservamos tus datos\u003c/h2>\n  \u003cp>Mientras tu cuenta esté activa. Si la borras, tus datos se eliminan de nuestra base de datos de forma permanente e irreversible; solo pueden permanecer en las copias de seguridad, que conservamos como máximo 8 semanas y que se sobrescriben periódicamente. Si tu cuenta pasa más de 18 meses sin actividad (contados desde tu último registro en la app), la eliminamos por inactividad. Los datos de facturación de las suscripciones se conservan durante el tiempo que exija la normativa fiscal y mercantil.\u003c/p>\n\n  \u003ch2>10. Tus derechos\u003c/h2>\n  \u003cp>Puedes acceder a tus datos, rectificarlos (editando tu perfil), exportarlos (Ajustes → «Exportar mis datos» y, si tienes el módulo Culturismo, «Descargar mis datos de Culturismo»), pedir su supresión (botón «Borrar mi cuenta»), oponerte o limitar su tratamiento, pedir su portabilidad y retirar tu consentimiento en cualquier momento. Escríbenos a cestafitness@gmail.com y te responderemos en el plazo legal (un mes).\u003c/p>\n  \u003cp>Si crees que no hemos tratado bien tus datos, puedes presentar una reclamación ante la Agencia Española de Protección de Datos (www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Seguridad\u003c/h2>\n  \u003cp>Las comunicaciones van cifradas, las contraseñas se guardan cifradas y cada usuario solo puede acceder a sus propios datos mediante reglas de acceso en la base de datos. Si hubiera una brecha de seguridad que te afectara, te lo comunicaríamos y avisaríamos a la autoridad de control en los plazos legales.\u003c/p>\n\n  \u003ch2>12. Menores de edad\u003c/h2>\n  \u003cp>cesta. no está dirigida a menores de 18 años y no debes crear una cuenta si no los tienes. Si usas las secciones de Bebé o de Familiar, los datos de menores que introduzcas los tratamos bajo tu responsabilidad como madre, padre o tutor legal, y solo para ofrecerte esas funciones.\u003c/p>\n\n  \u003ch2>13. Almacenamiento en tu dispositivo (cookies)\u003c/h2>\n  \u003cp>No usamos cookies de publicidad ni de seguimiento. Guardamos en tu dispositivo únicamente información estrictamente necesaria para que la app funcione: tu sesión, el idioma, tus preferencias y una copia para usarla sin conexión. Por eso no te mostramos un aviso de cookies. Los informes de errores de Sentry son técnicos y no se usan para publicidad.\u003c/p>\n\n  \u003ch2>13 bis. Módulo Culturismo: datos de salud reforzados\u003c/h2>\n  \u003cp>\u003cstrong>Qué datos.\u003c/strong> Solo si contratas el módulo y los introduces tú: nombre de la sustancia, vía, dosis, fecha, frecuencia y punto de inyección, notas, la vida media indicada, tu inventario (cantidades y caducidades), los valores de tus analíticas y sus rangos de referencia, tus puntuaciones de bienestar diario, la fecha de contratación y los informes médicos que subas. Son datos de salud, una categoría especial del RGPD (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Base legal.\u003c/strong> Tu consentimiento explícito (art. 9.2.a RGPD), que das marcando la casilla al contratar. Puedes retirarlo en cualquier momento borrando tus datos del módulo; la retirada no afecta al tratamiento anterior. Guardamos la fecha y la versión del texto en que consentiste, como prueba.\u003c/p>\n  \u003cp>\u003cstrong>Para qué y con quién.\u003c/strong> Solo para prestarte el módulo (registro, calendario, curvas e informes). No los usamos para publicidad ni para elaborar perfiles, no los vendemos y no los ven entrenadores vinculados, amigos ni la Comunidad. El chat con IA no recibe tus registros; solo recibe los mensajes que tú escribes en el chat. Los almacena Supabase como encargado del tratamiento; los pagos los procesa Stripe, que no recibe estos datos. Si mencionas una sustancia en el chat, ese texto se envía al proveedor de IA que procesa el chat (Google Gemini); evita escribir datos que no quieras compartir.\u003c/p>\n  \u003cp>\u003cstrong>Seguridad y conservación.\u003c/strong> Tablas con acceso restringido a tu usuario y un almacén privado para tus informes, con cifrado en tránsito y en reposo. Se conservan mientras uses el módulo y hasta que los borres, o hasta 18 meses sin actividad en la cuenta. Al borrar tu cuenta se eliminan también tus registros y tus informes médicos y se cancela cualquier suscripción activa.\u003c/p>\n  \u003cp>\u003cstrong>Tus derechos y menores.\u003c/strong> Puedes acceder, rectificar y suprimir estos datos desde el propio módulo y ejercer el resto de derechos como se explica en el apartado 10. El módulo está prohibido a menores de 18 años.\u003c/p>\n\n  \u003ch2>14. Aviso de salud\u003c/h2>\n  \u003cp>cesta. no es un producto sanitario ni sustituye el consejo de un médico, dietista-nutricionista o entrenador. Si estás embarazada, das el pecho, tienes una enfermedad o sigues un tratamiento, consulta con un profesional antes de cambiar tu alimentación o tu actividad física. Los cálculos y las estimaciones de la IA son orientativos.\u003c/p>\n\n  \u003ch2>15. Cambios en esta política\u003c/h2>\n  \u003cp>Si cambiamos algo importante, te lo diremos en la app con antelación y, cuando la ley lo exija, te pediremos de nuevo tu consentimiento.\u003c/p>\n\n  \u003ch2>16. Contacto\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","en":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Last updated: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Summary:\u003c/strong> cesta. processes health data (weight, body measurements, workouts, heart rate), which the GDPR regards as a special category of data. We use it only to provide you with the service, never for advertising and never to sell it to third parties.\u003c/p>\n\n  \u003ch2>1. Who is the controller\u003c/h2>\n  \u003cp>The controller of your data is \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). For any privacy-related matter, write to cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. What data we collect\u003c/h2>\n  \u003cp>\u003cstrong>Account and profile:\u003c/strong> email address, password (stored encrypted), username, weight, height, age, sex, activity level, goal and language.\u003c/p>\n  \u003cp>\u003cstrong>Health and fitness:\u003c/strong> weight and measurement history, menus and foods logged, fasting, workouts (sets, repetitions, weights, rest times), heart rate if you connect a heart rate monitor, and steps, weight or calories if you import data from your health app or from Health Connect. If you use the Pregnancy or Baby sections, the data you enter in them (week of pregnancy, baby's age, notes).\u003c/p>\n  \u003cp>\u003cstrong>Photos and content:\u003c/strong> the photos you upload or analyse with artificial intelligence, and chat messages.\u003c/p>\n  \u003cp>\u003cstrong>Relationship with trainers, friends and the community:\u003c/strong> requests, links and whatever you share with them (see section 5).\u003c/p>\n  \u003cp>\u003cstrong>Referral and contribution programme:\u003c/strong> your invitation code, the users you invite and the foods you contribute to the database.\u003c/p>\n  \u003cp>\u003cstrong>Technical and usage data:\u003c/strong> type of device and browser, IP address, language, application error logs and a basic usage log (which screens you open and at which step of registration you leave, without any health content and without including the screen of the Bodybuilding module). If you are logged in, this usage log is linked to your user. They are used so that the app works, to fix faults and to improve it. Legal basis: our legitimate interest.\u003c/p>\n  \u003cp>\u003cstrong>Notifications:\u003c/strong> if you turn them on, we store the technical identifier of your device in order to send them to you. If you also turn on the streak reminder, we additionally store the time you choose, your time zone, your current streak and the date of your last log, so that we can remind you on time. Legal basis: your consent (the permission you give in your browser or on your phone and the reminder switch), which you may withdraw at any time by turning them off.\u003c/p>\n  \u003cp>\u003cstrong>Payments:\u003c/strong> if you take out a paid plan, Stripe handles the payment. We neither see nor store your card details; we only receive the status of your subscription.\u003c/p>\n\n  \u003ch2>3. What we use it for and on what legal basis\u003c/h2>\n  \u003cp>\u003cstrong>Providing you with the service\u003c/strong> (creating your account, calculating your calorie and macronutrient targets, generating your shopping list, showing your progress, managing your subscription). Legal basis: performance of a contract.\u003c/p>\n  \u003cp>\u003cstrong>Processing your health data.\u003c/strong> Legal basis: your explicit consent, which you give us when you create your account and which you may withdraw at any time by deleting your account. If you do not give it, we cannot offer you the service.\u003c/p>\n  \u003cp>\u003cstrong>Artificial intelligence features\u003c/strong> (identifying foods in a photo, nutrition chat, progress summaries). Legal basis: your consent when you use the feature.\u003c/p>\n  \u003cp>\u003cstrong>Security, content moderation and error correction.\u003c/strong> Legal basis: our legitimate interest in keeping the application secure and running.\u003c/p>\n  \u003cp>\u003cstrong>Legal obligations\u003c/strong> (invoicing, requests from authorities). Legal basis: compliance with a legal obligation.\u003c/p>\n  \u003cp>We never use your data for advertising purposes and we never sell it.\u003c/p>\n\n  \u003ch2>4. Automated decisions and artificial intelligence\u003c/h2>\n  \u003cp>AI estimates (calories in a dish, chat suggestions) are indicative and may contain errors. No decisions producing legal effects concerning you are taken based solely on automated processing. Always review what the AI suggests to you.\u003c/p>\n\n  \u003ch2>5. Community, friends and trainers\u003c/h2>\n  \u003cp>Your profile is \u003cstrong>private by default\u003c/strong>. If you make it public or accept a friendship, that person sees your username, menus and photos.\u003c/p>\n  \u003cp>If you \u003cstrong>link up with a trainer\u003c/strong>, the trainer will be able to see the information you share with them (for example your progress, your menus and workouts, and chat messages) in order to advise you. It is you who decides to link up, and you may unlink at any time. Payments between trainer and athlete are made outside the app and cesta. is not involved in them.\u003c/p>\n\n  \u003ch2>6. Who else receives your data\u003c/h2>\n  \u003cp>We share only the necessary data with providers acting on our behalf:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — database, authentication, photo storage and server functions.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — only if you use photo analysis or the AI chat, and to automatically moderate the photos you upload (section 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — collection of subscription payments.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — when you search for a product by name or barcode, that search is sent in order to obtain its data.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — receives technical error reports from the application (servers in the European Union).\u003c/p>\n  \u003cp>\u003cstrong>Web hosting and content delivery networks\u003c/strong> (Netlify or GitHub Pages, jsDelivr, cdnjs) — serve the application and its libraries and, in doing so, see your IP address.\u003c/p>\n  \u003cp>Links to exercise technique videos open an external search engine (YouTube) only when you click.\u003c/p>\n\n  \u003ch2>7. International transfers\u003c/h2>\n  \u003cp>Your data is stored on Supabase servers in London (United Kingdom), which benefits from an adequacy decision of the European Commission. Google and Stripe may process data outside the European Economic Area (for example in the United States), relying on the EU-US Data Privacy Framework or on standard contractual clauses approved by the Commission.\u003c/p>\n\n  \u003ch2>8. Content and photo moderation\u003c/h2>\n  \u003cp>Every photograph you upload — profile photo, progress photo, photos of dishes, of products you contribute, or sent by chat — goes through an automatic artificial intelligence moderation filter (Google Gemini) before being accepted.\u003c/p>\n  \u003cp>We reject and do not store any image containing: nudity or explicit or suggestive sexual content; graphic violence or disturbing content; hateful, racist or homophobic symbols or messages; or any illegal content, including any content that may constitute child sexual exploitation or abuse. If a photo is rejected, the file is discarded and is never stored.\u003c/p>\n  \u003cp>The technique video search only allows searching for real exercise names from a closed list; it never sends unverified free text.\u003c/p>\n  \u003cp>If we detect, or are notified of, an account that repeatedly uploads prohibited content, we may suspend or delete it, and retain the evidence strictly necessary if the law requires us to report it to the authorities. You can report inappropriate content through “Report a bug” in the settings or by writing to cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. How long we keep your data\u003c/h2>\n  \u003cp>For as long as your account is active. If you delete it, your data is permanently and irreversibly erased from our database; it may only remain in backups, which we keep for a maximum of 8 weeks and which are periodically overwritten. If your account remains inactive for more than 18 months (counted from your last entry in the app), we delete it due to inactivity. Billing data for subscriptions is kept for as long as tax and commercial law require.\u003c/p>\n\n  \u003ch2>10. Your rights\u003c/h2>\n  \u003cp>You may access your data, rectify it (by editing your profile), export it (Settings → “Export my data” and, if you have the Bodybuilding module, “Download my Bodybuilding data”), request its erasure (“Delete my account” button), object to or restrict its processing, request its portability and withdraw your consent at any time. Write to us at cestafitness@gmail.com and we will reply within the legal time limit (one month).\u003c/p>\n  \u003cp>If you believe we have not handled your data properly, you may lodge a complaint with the Spanish Data Protection Agency (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Security\u003c/h2>\n  \u003cp>Communications are encrypted, passwords are stored encrypted and each user can access only their own data through access rules in the database. If there were a security breach affecting you, we would notify you and inform the supervisory authority within the legal time limits.\u003c/p>\n\n  \u003ch2>12. Minors\u003c/h2>\n  \u003cp>cesta. is not aimed at children under 18 and you must not create an account if you are not at least that age. If you use the Baby or Family sections, we process the data of minors that you enter under your responsibility as mother, father or legal guardian, and only to offer you those features.\u003c/p>\n\n  \u003ch2>13. Storage on your device (cookies)\u003c/h2>\n  \u003cp>We do not use advertising or tracking cookies. We store on your device only information strictly necessary for the app to work: your session, language, preferences and a copy for offline use. For that reason we do not show you a cookie notice. Sentry error reports are technical and are not used for advertising.\u003c/p>\n\n  \u003ch2>13 bis. Bodybuilding module: enhanced health data\u003c/h2>\n  \u003cp>\u003cstrong>What data.\u003c/strong> Only if you subscribe to the module and enter it yourself: substance name, route, dose, date, frequency and injection site, notes, the half-life you specify, your inventory (quantities and expiry dates), your lab test values and their reference ranges, your daily wellbeing scores, the subscription date and any medical reports you upload. This is health data, a special category under the GDPR (Art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Legal basis.\u003c/strong> Your explicit consent (Art. 9(2)(a) GDPR), which you give by ticking the box when you subscribe. You can withdraw it at any time by deleting your module data; withdrawal does not affect earlier processing. We keep the date and the version of the text you consented to, as proof.\u003c/p>\n  \u003cp>\u003cstrong>Purpose and recipients.\u003c/strong> Only to provide you with the module (log, calendar, curves and reports). We do not use it for advertising or profiling, we do not sell it, and linked trainers, friends and the Community cannot see it. The AI chat does not receive your records; it only receives the messages you type in the chat. Supabase stores it as data processor; payments are processed by Stripe, which does not receive this data. If you mention a substance in the chat, that text is sent to the AI provider that processes the chat (Google Gemini); avoid typing data you do not want to share.\u003c/p>\n  \u003cp>\u003cstrong>Security and retention.\u003c/strong> Tables restricted to your user and a private storage for your reports, encrypted in transit and at rest. It is kept while you use the module and until you delete it, or up to 18 months of account inactivity. When you delete your account, your records and medical reports are also deleted and any active subscription is cancelled.\u003c/p>\n  \u003cp>\u003cstrong>Your rights and minors.\u003c/strong> You can access, rectify and erase this data from the module itself and exercise your other rights as explained in section 10. The module is prohibited for anyone under 18.\u003c/p>\n\n  \u003ch2>14. Health notice\u003c/h2>\n  \u003cp>cesta. is not a medical device and does not replace the advice of a doctor, dietitian-nutritionist or trainer. If you are pregnant, breastfeeding, have an illness or are undergoing treatment, consult a professional before changing your diet or physical activity. Calculations and AI estimates are indicative.\u003c/p>\n\n  \u003ch2>15. Changes to this policy\u003c/h2>\n  \u003cp>If we change anything important, we will tell you in the app in advance and, where the law requires it, we will ask for your consent again.\u003c/p>\n\n  \u003ch2>16. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","fr":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Dernière mise à jour : 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Résumé :\u003c/strong> cesta. traite des données de santé (poids, mensurations, entraînements, fréquence cardiaque), que le RGPD considère comme une catégorie particulière de données. Nous ne les utilisons que pour vous fournir le service, jamais à des fins publicitaires ni pour les vendre à des tiers.\u003c/p>\n\n  \u003ch2>1. Qui est le responsable du traitement\u003c/h2>\n  \u003cp>Le responsable du traitement de vos données est \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Pour toute question relative à la vie privée, écrivez à cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Quelles données nous collectons\u003c/h2>\n  \u003cp>\u003cstrong>Compte et profil :\u003c/strong> adresse e-mail, mot de passe (conservé sous forme chiffrée), nom d'utilisateur, poids, taille, âge, sexe, niveau d'activité, objectif et langue.\u003c/p>\n  \u003cp>\u003cstrong>Santé et condition physique :\u003c/strong> historique du poids et des mensurations, menus et aliments enregistrés, jeûne, entraînements (séries, répétitions, charges, temps de repos), fréquence cardiaque si vous connectez un cardiofréquencemètre, ainsi que pas, poids ou calories si vous importez des données depuis votre application de santé ou depuis Health Connect. Si vous utilisez les rubriques Grossesse ou Bébé, les données que vous y saisissez (semaine de grossesse, âge du bébé, notes).\u003c/p>\n  \u003cp>\u003cstrong>Photos et contenus :\u003c/strong> les photos que vous téléversez ou faites analyser par intelligence artificielle, ainsi que les messages du chat.\u003c/p>\n  \u003cp>\u003cstrong>Relations avec les coachs, les amis et la communauté :\u003c/strong> demandes, liens et ce que vous partagez avec eux (voir la section 5).\u003c/p>\n  \u003cp>\u003cstrong>Programme de parrainage et de contributions :\u003c/strong> votre code de parrainage, les utilisateurs parrainés et les aliments que vous ajoutez à la base de données.\u003c/p>\n  \u003cp>\u003cstrong>Données techniques et d'utilisation :\u003c/strong> type d'appareil et de navigateur, adresse IP, langue, journaux d'erreurs de l'application et un journal d'utilisation de base (quels écrans vous ouvrez et à quelle étape de l'inscription vous abandonnez, sans aucun contenu de santé et sans inclure l'écran du module Musculation). Si vous êtes connecté, ce journal d'utilisation est associé à votre utilisateur. Elles servent au bon fonctionnement de l'application, à la correction des défauts et à son amélioration. Base juridique : notre intérêt légitime.\u003c/p>\n  \u003cp>\u003cstrong>Notifications :\u003c/strong> si vous les activez, nous conservons l'identifiant technique de votre appareil afin de vous les envoyer. Si vous activez également le rappel de série, nous conservons aussi l'heure que vous choisissez, votre fuseau horaire, votre série en cours et la date de votre dernier enregistrement, afin de pouvoir vous prévenir à temps. Base juridique : votre consentement (l'autorisation que vous donnez dans votre navigateur ou sur votre mobile et l'interrupteur du rappel), que vous pouvez retirer à tout moment en les désactivant.\u003c/p>\n  \u003cp>\u003cstrong>Paiements :\u003c/strong> si vous souscrivez un abonnement payant, Stripe gère l'encaissement. Nous ne voyons ni ne conservons les données de votre carte ; nous recevons uniquement l'état de votre abonnement.\u003c/p>\n\n  \u003ch2>3. Pourquoi nous les utilisons et sur quelle base juridique\u003c/h2>\n  \u003cp>\u003cstrong>Vous fournir le service\u003c/strong> (créer votre compte, calculer vos objectifs de calories et de macronutriments, générer votre liste de courses, afficher votre progression, gérer votre abonnement). Base juridique : l'exécution du contrat.\u003c/p>\n  \u003cp>\u003cstrong>Traiter vos données de santé.\u003c/strong> Base juridique : votre consentement explicite, que vous nous donnez lors de la création du compte et que vous pouvez retirer à tout moment en supprimant votre compte. Si vous ne le donnez pas, nous ne pouvons pas vous proposer le service.\u003c/p>\n  \u003cp>\u003cstrong>Fonctions d'intelligence artificielle\u003c/strong> (identifier des aliments sur une photo, chat nutrition, résumés de progression). Base juridique : votre consentement lors de l'utilisation de la fonction.\u003c/p>\n  \u003cp>\u003cstrong>Sécurité, modération des contenus et correction des erreurs.\u003c/strong> Base juridique : notre intérêt légitime à maintenir l'application sûre et en état de fonctionnement.\u003c/p>\n  \u003cp>\u003cstrong>Obligations légales\u003c/strong> (facturation, demandes des autorités). Base juridique : le respect d'une obligation légale.\u003c/p>\n  \u003cp>Nous n'utilisons jamais vos données à des fins publicitaires et nous ne les vendons pas.\u003c/p>\n\n  \u003ch2>4. Décisions automatisées et intelligence artificielle\u003c/h2>\n  \u003cp>Les estimations de l'IA (calories d'un plat, suggestions du chat) sont données à titre indicatif et peuvent comporter des erreurs. Aucune décision produisant des effets juridiques à votre égard n'est prise sur le seul fondement d'un traitement automatisé. Vérifiez toujours ce que l'IA vous propose.\u003c/p>\n\n  \u003ch2>5. Communauté, amis et coachs\u003c/h2>\n  \u003cp>Votre profil est \u003cstrong>privé par défaut\u003c/strong>. Si vous le rendez public ou acceptez une demande d'ami, cette personne voit votre nom d'utilisateur, vos menus et vos photos.\u003c/p>\n  \u003cp>Si vous \u003cstrong>vous associez à un coach\u003c/strong>, celui-ci pourra consulter les informations que vous partagez avec lui (par exemple votre progression, vos menus et entraînements, et les messages du chat) afin de vous conseiller. C'est vous qui décidez de vous associer et vous pouvez rompre ce lien à tout moment. Les paiements entre coach et athlète s'effectuent en dehors de l'application et cesta. n'y intervient pas.\u003c/p>\n\n  \u003ch2>6. Qui d'autre reçoit vos données\u003c/h2>\n  \u003cp>Nous ne partageons que les données nécessaires avec des prestataires agissant pour notre compte :\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — base de données, authentification, stockage des photos et fonctions serveur.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — uniquement si vous utilisez l'analyse de photos ou le chat IA, et pour modérer automatiquement les photos que vous téléversez (section 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — encaissement des abonnements.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — lorsque vous recherchez un produit par son nom ou son code-barres, cette recherche est transmise afin d'obtenir ses données.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — reçoit des rapports techniques d'erreurs de l'application (serveurs situés dans l'Union européenne).\u003c/p>\n  \u003cp>\u003cstrong>Hébergement web et réseaux de diffusion de contenu\u003c/strong> (Netlify ou GitHub Pages, jsDelivr, cdnjs) — distribuent l'application et ses bibliothèques et, ce faisant, voient votre adresse IP.\u003c/p>\n  \u003cp>Les liens vers des vidéos de technique d'exercices ouvrent un moteur de recherche externe (YouTube) uniquement lorsque vous cliquez.\u003c/p>\n\n  \u003ch2>7. Transferts internationaux\u003c/h2>\n  \u003cp>Vos données sont stockées sur des serveurs de Supabase à Londres (Royaume-Uni), pays bénéficiant d'une décision d'adéquation de la Commission européenne. Google et Stripe peuvent traiter des données en dehors de l'Espace économique européen (par exemple aux États-Unis), sur la base du cadre de protection des données UE-États-Unis ou de clauses contractuelles types approuvées par la Commission.\u003c/p>\n\n  \u003ch2>8. Modération des contenus et des photos\u003c/h2>\n  \u003cp>Toute photographie que vous téléversez — photo de profil, de progression, de plats, de produits que vous ajoutez, ou envoyée par chat — passe par un filtre automatique de modération par intelligence artificielle (Google Gemini) avant d'être acceptée.\u003c/p>\n  \u003cp>Nous rejetons et ne conservons aucune image contenant : de la nudité ou un contenu sexuel explicite ou suggestif ; de la violence explicite ou un contenu choquant ; des symboles ou messages haineux, racistes ou homophobes ; ou tout contenu illégal, y compris tout contenu pouvant constituer de l'exploitation ou des abus sexuels sur mineurs. Si une photo est rejetée, le fichier est supprimé et n'est jamais conservé.\u003c/p>\n  \u003cp>Le moteur de recherche de vidéos de technique ne permet de rechercher que des noms d'exercices réels issus d'une liste fermée ; il n'envoie jamais de texte libre non vérifié.\u003c/p>\n  \u003cp>Si nous détectons, ou si l'on nous signale, un compte qui téléverse de façon répétée des contenus interdits, nous pouvons le suspendre ou le supprimer, et conserver les éléments de preuve strictement nécessaires si la loi nous oblige à les communiquer aux autorités. Vous pouvez signaler un contenu inapproprié depuis « Signaler un problème » dans les paramètres ou en écrivant à cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Durée de conservation de vos données\u003c/h2>\n  \u003cp>Tant que votre compte est actif. Si vous le supprimez, vos données sont effacées de notre base de données de manière définitive et irréversible ; elles ne peuvent subsister que dans les copies de sauvegarde, que nous conservons au maximum 8 semaines et qui sont écrasées périodiquement. Si votre compte reste plus de 18 mois sans activité (à compter de votre dernière saisie dans l'application), nous le supprimons pour inactivité. Les données de facturation des abonnements sont conservées pendant la durée exigée par la réglementation fiscale et commerciale.\u003c/p>\n\n  \u003ch2>10. Vos droits\u003c/h2>\n  \u003cp>Vous pouvez accéder à vos données, les rectifier (en modifiant votre profil), les exporter (Paramètres → « Exporter mes données » et, si vous avez le module Musculation, « Télécharger mes données de Musculation »), demander leur effacement (bouton « Supprimer mon compte »), vous opposer à leur traitement ou en demander la limitation, demander leur portabilité et retirer votre consentement à tout moment. Écrivez-nous à cestafitness@gmail.com et nous vous répondrons dans le délai légal (un mois).\u003c/p>\n  \u003cp>Si vous estimez que vos données n'ont pas été traitées correctement, vous pouvez introduire une réclamation auprès de l'Agence espagnole de protection des données (Agencia Española de Protección de Datos, www.aepd.es), ou auprès de l'autorité de contrôle de votre pays de résidence.\u003c/p>\n\n  \u003ch2>11. Sécurité\u003c/h2>\n  \u003cp>Les communications sont chiffrées, les mots de passe sont conservés sous forme chiffrée et chaque utilisateur ne peut accéder qu'à ses propres données grâce à des règles d'accès dans la base de données. En cas de violation de données susceptible de vous affecter, nous vous en informerions et avertirions l'autorité de contrôle dans les délais légaux.\u003c/p>\n\n  \u003ch2>12. Mineurs\u003c/h2>\n  \u003cp>cesta. ne s'adresse pas aux enfants de moins de 18 ans et vous ne devez pas créer de compte si vous n'avez pas cet âge. Si vous utilisez les rubriques Bébé ou Famille, nous traitons les données de mineurs que vous saisissez sous votre responsabilité de mère, de père ou de représentant légal, et uniquement pour vous proposer ces fonctions.\u003c/p>\n\n  \u003ch2>13. Stockage sur votre appareil (cookies)\u003c/h2>\n  \u003cp>Nous n'utilisons ni cookies publicitaires ni cookies de suivi. Nous enregistrons sur votre appareil uniquement les informations strictement nécessaires au fonctionnement de l'application : votre session, la langue, vos préférences et une copie permettant une utilisation hors ligne. C'est pourquoi nous ne vous affichons pas de bandeau de cookies. Les rapports d'erreurs de Sentry sont techniques et ne sont pas utilisés à des fins publicitaires.\u003c/p>\n\n  \u003ch2>13 bis. Module Musculation : données de santé à protection renforcée\u003c/h2>\n  \u003cp>\u003cstrong>Quelles données.\u003c/strong> Uniquement si tu souscris au module et que tu les saisis toi-même : nom de la substance, voie d'administration, dose, date, fréquence et site d'injection, notes, la demi-vie indiquée, ton inventaire (quantités et dates de péremption), les valeurs de tes analyses et leurs plages de référence, tes scores de bien-être quotidien, la date de souscription et les rapports médicaux que tu téléverses. Ce sont des données de santé, une catégorie particulière au sens du RGPD (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Base juridique.\u003c/strong> Votre consentement explicite (art. 9, par. 2, point a) du RGPD), que vous donnez en cochant la case lors de la souscription. Vous pouvez le retirer à tout moment en supprimant vos données du module ; le retrait n'affecte pas le traitement antérieur. Nous conservons la date et la version du texte auquel vous avez consenti, à titre de preuve.\u003c/p>\n  \u003cp>\u003cstrong>Finalité et destinataires.\u003c/strong> Uniquement pour vous fournir le module (suivi, calendrier, courbes et rapports). Nous ne les utilisons ni à des fins publicitaires ni pour établir des profils, nous ne les vendons pas et les coachs liés, les amis et la Communauté ne les voient pas. Le chat IA ne reçoit pas vos enregistrements ; il ne reçoit que les messages que vous écrivez dans le chat. Supabase les stocke en tant que sous-traitant ; les paiements sont traités par Stripe, qui ne reçoit pas ces données. Si tu mentionnes une substance dans le chat, ce texte est envoyé au fournisseur d'IA qui traite le chat (Google Gemini) ; évite d'écrire des données que tu ne souhaites pas partager.\u003c/p>\n  \u003cp>\u003cstrong>Sécurité et conservation.\u003c/strong> Tables à accès restreint à votre utilisateur et espace de stockage privé pour vos rapports, avec chiffrement en transit et au repos. Elles sont conservées tant que vous utilisez le module et jusqu'à ce que vous les supprimiez, ou jusqu'à 18 mois d'inactivité du compte. Lorsque vous supprimez votre compte, vos enregistrements et vos rapports médicaux sont également supprimés et tout abonnement actif est résilié.\u003c/p>\n  \u003cp>\u003cstrong>Vos droits et les mineurs.\u003c/strong> Vous pouvez accéder à ces données, les rectifier et les effacer depuis le module lui-même et exercer vos autres droits comme expliqué à la section 10. Le module est interdit aux moins de 18 ans.\u003c/p>\n\n  \u003ch2>14. Avertissement sur la santé\u003c/h2>\n  \u003cp>cesta. n'est pas un dispositif médical et ne remplace pas l'avis d'un médecin, d'un diététicien-nutritionniste ou d'un coach. Si vous êtes enceinte, si vous allaitez, si vous êtes atteint(e) d'une maladie ou suivez un traitement, consultez un professionnel avant de modifier votre alimentation ou votre activité physique. Les calculs et les estimations de l'IA sont indicatifs.\u003c/p>\n\n  \u003ch2>15. Modifications de cette politique\u003c/h2>\n  \u003cp>Si nous modifions un élément important, nous vous en informerons à l'avance dans l'application et, lorsque la loi l'exige, nous solliciterons de nouveau votre consentement.\u003c/p>\n\n  \u003ch2>16. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","de":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Letzte Aktualisierung: 25.09.2026\u003c/p>\n  \u003cp>\u003cstrong>Zusammenfassung:\u003c/strong> cesta. verarbeitet Gesundheitsdaten (Gewicht, Körpermaße, Trainingseinheiten, Herzfrequenz), die die DSGVO als besondere Kategorie personenbezogener Daten einstuft. Wir verwenden sie ausschließlich, um Ihnen den Dienst bereitzustellen, niemals für Werbung und niemals, um sie an Dritte zu verkaufen.\u003c/p>\n\n  \u003ch2>1. Wer ist der Verantwortliche\u003c/h2>\n  \u003cp>Verantwortlicher für die Verarbeitung Ihrer Daten ist \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Bei Fragen zum Datenschutz schreiben Sie an cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Welche Daten wir erheben\u003c/h2>\n  \u003cp>\u003cstrong>Konto und Profil:\u003c/strong> E-Mail-Adresse, Passwort (verschlüsselt gespeichert), Benutzername, Gewicht, Größe, Alter, Geschlecht, Aktivitätsniveau, Ziel und Sprache.\u003c/p>\n  \u003cp>\u003cstrong>Gesundheit und Fitness:\u003c/strong> Verlauf von Gewicht und Körpermaßen, erfasste Menüs und Lebensmittel, Fasten, Trainingseinheiten (Sätze, Wiederholungen, Gewichte, Pausen), Herzfrequenz, wenn Sie einen Herzfrequenzmesser verbinden, sowie Schritte, Gewicht oder Kalorien, wenn Sie Daten aus Ihrer Gesundheits-App oder aus Health Connect importieren. Wenn Sie die Bereiche Schwangerschaft oder Baby nutzen, die Daten, die Sie dort eingeben (Schwangerschaftswoche, Alter des Babys, Notizen).\u003c/p>\n  \u003cp>\u003cstrong>Fotos und Inhalte:\u003c/strong> die Fotos, die Sie hochladen oder mit künstlicher Intelligenz analysieren lassen, sowie Chat-Nachrichten.\u003c/p>\n  \u003cp>\u003cstrong>Beziehung zu Trainern, Freunden und zur Community:\u003c/strong> Anfragen, Verknüpfungen und das, was Sie mit ihnen teilen (siehe Abschnitt 5).\u003c/p>\n  \u003cp>\u003cstrong>Einladungs- und Beitragsprogramm:\u003c/strong> Ihr Einladungscode, die eingeladenen Nutzer und die Lebensmittel, die Sie zur Datenbank beisteuern.\u003c/p>\n  \u003cp>\u003cstrong>Technische Daten und Nutzungsdaten:\u003c/strong> Geräte- und Browsertyp, IP-Adresse, Sprache, Fehlerprotokolle der Anwendung und ein einfaches Nutzungsprotokoll (welche Bildschirme Sie öffnen und bei welchem Schritt der Registrierung Sie abbrechen, ohne Gesundheitsinhalte und ohne den Bildschirm des Bodybuilding-Moduls). Wenn Sie angemeldet sind, wird dieses Nutzungsprotokoll Ihrem Nutzer zugeordnet. Sie dienen dazu, dass die App funktioniert, Fehler zu beheben und sie zu verbessern. Rechtsgrundlage: unser berechtigtes Interesse.\u003c/p>\n  \u003cp>\u003cstrong>Benachrichtigungen:\u003c/strong> Wenn Sie sie aktivieren, speichern wir die technische Kennung Ihres Geräts, um sie Ihnen zu senden. Wenn Sie zusätzlich die Serien-Erinnerung aktivieren, speichern wir außerdem die von Ihnen gewählte Uhrzeit, Ihre Zeitzone, Ihre aktuelle Serie und das Datum Ihres letzten Eintrags, um Sie rechtzeitig erinnern zu können. Rechtsgrundlage: Ihre Einwilligung (die Berechtigung, die Sie in Ihrem Browser oder auf Ihrem Handy erteilen, sowie der Schalter der Erinnerung), die Sie jederzeit widerrufen können, indem Sie sie deaktivieren.\u003c/p>\n  \u003cp>\u003cstrong>Zahlungen:\u003c/strong> Wenn Sie einen kostenpflichtigen Tarif abschließen, wickelt Stripe die Zahlung ab. Wir sehen und speichern Ihre Kartendaten nicht; wir erhalten lediglich den Status Ihres Abonnements.\u003c/p>\n\n  \u003ch2>3. Wofür wir sie verwenden und auf welcher Rechtsgrundlage\u003c/h2>\n  \u003cp>\u003cstrong>Bereitstellung des Dienstes\u003c/strong> (Erstellung Ihres Kontos, Berechnung Ihrer Kalorien- und Makronährstoffziele, Erstellung Ihrer Einkaufsliste, Darstellung Ihres Fortschritts, Verwaltung Ihres Abonnements). Rechtsgrundlage: Vertragserfüllung.\u003c/p>\n  \u003cp>\u003cstrong>Verarbeitung Ihrer Gesundheitsdaten.\u003c/strong> Rechtsgrundlage: Ihre ausdrückliche Einwilligung, die Sie uns bei der Kontoerstellung erteilen und die Sie jederzeit widerrufen können, indem Sie Ihr Konto löschen. Wenn Sie sie nicht erteilen, können wir Ihnen den Dienst nicht anbieten.\u003c/p>\n  \u003cp>\u003cstrong>Funktionen mit künstlicher Intelligenz\u003c/strong> (Erkennung von Lebensmitteln auf einem Foto, Ernährungs-Chat, Zusammenfassungen des Fortschritts). Rechtsgrundlage: Ihre Einwilligung bei Nutzung der Funktion.\u003c/p>\n  \u003cp>\u003cstrong>Sicherheit, Inhaltsmoderation und Fehlerbehebung.\u003c/strong> Rechtsgrundlage: unser berechtigtes Interesse, die Anwendung sicher und funktionsfähig zu halten.\u003c/p>\n  \u003cp>\u003cstrong>Rechtliche Verpflichtungen\u003c/strong> (Rechnungsstellung, Anfragen von Behörden). Rechtsgrundlage: Erfüllung einer rechtlichen Verpflichtung.\u003c/p>\n  \u003cp>Wir verwenden Ihre Daten niemals zu Werbezwecken und verkaufen sie nicht.\u003c/p>\n\n  \u003ch2>4. Automatisierte Entscheidungen und künstliche Intelligenz\u003c/h2>\n  \u003cp>Die Schätzungen der KI (Kalorien eines Gerichts, Chat-Vorschläge) sind unverbindliche Richtwerte und können Fehler enthalten. Es werden keine Entscheidungen mit rechtlicher Wirkung Ihnen gegenüber ausschließlich auf Grundlage einer automatisierten Verarbeitung getroffen. Prüfen Sie stets, was Ihnen die KI vorschlägt.\u003c/p>\n\n  \u003ch2>5. Community, Freunde und Trainer\u003c/h2>\n  \u003cp>Ihr Profil ist \u003cstrong>standardmäßig privat\u003c/strong>. Wenn Sie es öffentlich machen oder eine Freundschaft annehmen, sieht diese Person Ihren Benutzernamen, Ihre Menüs und Fotos.\u003c/p>\n  \u003cp>Wenn Sie sich \u003cstrong>mit einem Trainer verknüpfen\u003c/strong>, kann dieser die Informationen einsehen, die Sie mit ihm teilen (zum Beispiel Ihren Fortschritt, Ihre Menüs und Trainingseinheiten sowie die Chat-Nachrichten), um Sie zu beraten. Sie entscheiden selbst, ob Sie sich verknüpfen, und können die Verknüpfung jederzeit wieder lösen. Zahlungen zwischen Trainer und Athlet erfolgen außerhalb der App, und cesta. ist daran nicht beteiligt.\u003c/p>\n\n  \u003ch2>6. Wer sonst Ihre Daten erhält\u003c/h2>\n  \u003cp>Wir geben nur die erforderlichen Daten an Dienstleister weiter, die in unserem Auftrag handeln:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — Datenbank, Authentifizierung, Speicherung von Fotos und Serverfunktionen.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — nur, wenn Sie die Fotoanalyse oder den KI-Chat nutzen, sowie zur automatischen Moderation der von Ihnen hochgeladenen Fotos (Abschnitt 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — Einzug der Abonnementzahlungen.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — wenn Sie ein Produkt nach Name oder Barcode suchen, wird diese Suchanfrage übermittelt, um die Produktdaten abzurufen.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — erhält technische Fehlerberichte der Anwendung (Server in der Europäischen Union).\u003c/p>\n  \u003cp>\u003cstrong>Webhosting und Content-Delivery-Netzwerke\u003c/strong> (Netlify oder GitHub Pages, jsDelivr, cdnjs) — liefern die Anwendung und ihre Bibliotheken aus und sehen dabei Ihre IP-Adresse.\u003c/p>\n  \u003cp>Links zu Videos mit Übungstechniken öffnen eine externe Suchmaschine (YouTube) nur, wenn Sie darauf klicken.\u003c/p>\n\n  \u003ch2>7. Internationale Datenübermittlungen\u003c/h2>\n  \u003cp>Ihre Daten werden auf Servern von Supabase in London (Vereinigtes Königreich) gespeichert, für das ein Angemessenheitsbeschluss der Europäischen Kommission vorliegt. Google und Stripe können Daten außerhalb des Europäischen Wirtschaftsraums (zum Beispiel in den Vereinigten Staaten) verarbeiten, gestützt auf das EU-US-Datenschutzrahmenabkommen (Data Privacy Framework) oder auf von der Kommission genehmigte Standardvertragsklauseln.\u003c/p>\n\n  \u003ch2>8. Moderation von Inhalten und Fotos\u003c/h2>\n  \u003cp>Jedes Foto, das Sie hochladen — Profilfoto, Fortschrittsfoto, Fotos von Gerichten, von Produkten, die Sie beisteuern, oder per Chat gesendete Fotos —, durchläuft vor der Annahme einen automatischen Moderationsfilter mit künstlicher Intelligenz (Google Gemini).\u003c/p>\n  \u003cp>Wir lehnen jedes Bild ab und speichern es nicht, das Folgendes enthält: Nacktheit oder explizite bzw. anzügliche sexuelle Inhalte; drastische Gewaltdarstellungen oder verstörende Inhalte; hasserfüllte, rassistische oder homophobe Symbole oder Botschaften; oder jegliche rechtswidrigen Inhalte, einschließlich Inhalten, die sexuelle Ausbeutung oder sexuellen Missbrauch von Kindern darstellen könnten. Wird ein Foto abgelehnt, wird die Datei verworfen und gelangt nie zur Speicherung.\u003c/p>\n  \u003cp>Die Suche nach Technikvideos erlaubt nur die Suche nach echten Übungsnamen aus einer geschlossenen Liste; es wird niemals ungeprüfter Freitext gesendet.\u003c/p>\n  \u003cp>Wenn wir ein Konto feststellen oder gemeldet bekommen, das wiederholt verbotene Inhalte hochlädt, können wir es sperren oder löschen und die unbedingt erforderlichen Beweismittel aufbewahren, falls das Gesetz uns zur Meldung an die Behörden verpflichtet. Unangemessene Inhalte können Sie über „Fehler melden“ in den Einstellungen oder per E-Mail an cestafitness@gmail.com melden.\u003c/p>\n\n  \u003ch2>9. Wie lange wir Ihre Daten aufbewahren\u003c/h2>\n  \u003cp>Solange Ihr Konto aktiv ist. Wenn Sie es löschen, werden Ihre Daten aus unserer Datenbank dauerhaft und unwiderruflich gelöscht; sie können nur noch in Sicherungskopien verbleiben, die wir höchstens 8 Wochen aufbewahren und die regelmäßig überschrieben werden. Bleibt Ihr Konto mehr als 18 Monate ohne Aktivität (gerechnet ab Ihrem letzten Eintrag in der App), löschen wir es wegen Inaktivität. Abrechnungsdaten der Abonnements werden so lange aufbewahrt, wie es das Steuer- und Handelsrecht verlangt.\u003c/p>\n\n  \u003ch2>10. Ihre Rechte\u003c/h2>\n  \u003cp>Sie können Auskunft über Ihre Daten erhalten, sie berichtigen (durch Bearbeiten Ihres Profils), exportieren (Einstellungen → „Meine Daten exportieren“ und, wenn Sie das Bodybuilding-Modul haben, „Meine Bodybuilding-Daten herunterladen“), ihre Löschung verlangen (Schaltfläche „Mein Konto löschen“), der Verarbeitung widersprechen oder deren Einschränkung verlangen, Datenübertragbarkeit verlangen und Ihre Einwilligung jederzeit widerrufen. Schreiben Sie uns an cestafitness@gmail.com; wir antworten innerhalb der gesetzlichen Frist (ein Monat).\u003c/p>\n  \u003cp>Wenn Sie der Ansicht sind, dass wir Ihre Daten nicht ordnungsgemäß verarbeitet haben, können Sie Beschwerde bei der Spanischen Datenschutzagentur (Agencia Española de Protección de Datos, www.aepd.es) oder bei der Aufsichtsbehörde Ihres Wohnsitzlandes einlegen.\u003c/p>\n\n  \u003ch2>11. Sicherheit\u003c/h2>\n  \u003cp>Die Kommunikation ist verschlüsselt, Passwörter werden verschlüsselt gespeichert, und jeder Nutzer kann über Zugriffsregeln in der Datenbank nur auf seine eigenen Daten zugreifen. Sollte es zu einer Verletzung der Datensicherheit kommen, die Sie betrifft, würden wir Sie benachrichtigen und die Aufsichtsbehörde innerhalb der gesetzlichen Fristen informieren.\u003c/p>\n\n  \u003ch2>12. Minderjährige\u003c/h2>\n  \u003cp>cesta. richtet sich nicht an Kinder unter 18 Jahren, und Sie dürfen kein Konto erstellen, wenn Sie dieses Alter nicht erreicht haben. Wenn Sie die Bereiche Baby oder Familie nutzen, verarbeiten wir die von Ihnen eingegebenen Daten Minderjähriger unter Ihrer Verantwortung als Mutter, Vater oder gesetzlicher Vertreter und nur, um Ihnen diese Funktionen anzubieten.\u003c/p>\n\n  \u003ch2>13. Speicherung auf Ihrem Gerät (Cookies)\u003c/h2>\n  \u003cp>Wir verwenden keine Werbe- oder Tracking-Cookies. Wir speichern auf Ihrem Gerät ausschließlich Informationen, die für das Funktionieren der App unbedingt erforderlich sind: Ihre Sitzung, die Sprache, Ihre Einstellungen und eine Kopie zur Offline-Nutzung. Deshalb zeigen wir Ihnen keinen Cookie-Hinweis an. Die Fehlerberichte von Sentry sind technischer Natur und werden nicht für Werbung verwendet.\u003c/p>\n\n  \u003ch2>13 bis. Modul Bodybuilding: besonders geschützte Gesundheitsdaten\u003c/h2>\n  \u003cp>\u003cstrong>Welche Daten.\u003c/strong> Nur wenn du das Modul abonnierst und sie selbst eingibst: Name der Substanz, Art der Anwendung, Dosis, Datum, Häufigkeit und Injektionsstelle, Notizen, die von dir angegebene Halbwertszeit, dein Bestand (Mengen und Ablaufdaten), die Werte deiner Laboranalysen und deren Referenzbereiche, deine täglichen Wohlbefindenswerte, das Abschlussdatum des Abonnements und die von dir hochgeladenen medizinischen Berichte. Es handelt sich um Gesundheitsdaten, eine besondere Kategorie nach der DSGVO (Art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Rechtsgrundlage.\u003c/strong> Deine ausdrückliche Einwilligung (Art. 9 Abs. 2 Buchst. a DSGVO), die du durch Setzen des Häkchens beim Abschluss erteilst. Du kannst sie jederzeit widerrufen, indem du deine Moduldaten löschst; der Widerruf berührt nicht die Rechtmäßigkeit der bis dahin erfolgten Verarbeitung. Wir speichern als Nachweis das Datum und die Version des Textes, in den du eingewilligt hast.\u003c/p>\n  \u003cp>\u003cstrong>Zweck und Empfänger.\u003c/strong> Ausschließlich zur Bereitstellung des Moduls (Protokoll, Kalender, Kurven und Berichte). Wir verwenden sie weder für Werbung noch für Profiling, wir verkaufen sie nicht und verknüpfte Trainer, Freunde und die Community sehen sie nicht. Der KI-Chat erhält deine Einträge nicht; er erhält nur die Nachrichten, die du im Chat schreibst. Supabase speichert sie als Auftragsverarbeiter; Zahlungen werden von Stripe abgewickelt, das diese Daten nicht erhält. Wenn du im Chat eine Substanz erwähnst, wird dieser Text an den KI-Anbieter gesendet, der den Chat verarbeitet (Google Gemini); gib keine Daten ein, die du nicht teilen möchtest.\u003c/p>\n  \u003cp>\u003cstrong>Sicherheit und Aufbewahrung.\u003c/strong> Tabellen mit auf deinen Nutzer beschränktem Zugriff und ein privater Speicher für deine Berichte, verschlüsselt bei der Übertragung und im Ruhezustand. Sie werden aufbewahrt, solange du das Modul nutzt und bis du sie löschst, oder bis zu 18 Monate Kontoinaktivität. Wenn du dein Konto löschst, werden auch deine Einträge und medizinischen Berichte gelöscht und jedes aktive Abonnement wird gekündigt.\u003c/p>\n  \u003cp>\u003cstrong>Deine Rechte und Minderjährige.\u003c/strong> Du kannst diese Daten über das Modul selbst einsehen, berichtigen und löschen und deine übrigen Rechte ausüben, wie in Abschnitt 10 erläutert. Das Modul ist für Personen unter 18 Jahren untersagt.\u003c/p>\n\n  \u003ch2>14. Gesundheitshinweis\u003c/h2>\n  \u003cp>cesta. ist kein Medizinprodukt und ersetzt nicht den Rat eines Arztes, Ernährungsberaters (Diätassistenten) oder Trainers. Wenn Sie schwanger sind, stillen, an einer Erkrankung leiden oder sich in Behandlung befinden, sprechen Sie mit einer Fachperson, bevor Sie Ihre Ernährung oder Ihre körperliche Aktivität ändern. Die Berechnungen und Schätzungen der KI sind unverbindliche Richtwerte.\u003c/p>\n\n  \u003ch2>15. Änderungen dieser Richtlinie\u003c/h2>\n  \u003cp>Wenn wir etwas Wesentliches ändern, informieren wir Sie rechtzeitig in der App und holen, sofern das Gesetz es verlangt, erneut Ihre Einwilligung ein.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","it":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Ultimo aggiornamento: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Riepilogo:\u003c/strong> cesta. tratta dati relativi alla salute (peso, misure corporee, allenamenti, frequenza cardiaca), che il GDPR considera una categoria particolare di dati. Li utilizziamo solo per fornirti il servizio, mai per finalità pubblicitarie né per venderli a terzi.\u003c/p>\n\n  \u003ch2>1. Chi è il titolare del trattamento\u003c/h2>\n  \u003cp>Il titolare del trattamento dei tuoi dati è \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Per qualsiasi questione relativa alla privacy, scrivi a cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Quali dati raccogliamo\u003c/h2>\n  \u003cp>\u003cstrong>Account e profilo:\u003c/strong> indirizzo e-mail, password (conservata in forma cifrata), nome utente, peso, altezza, età, sesso, livello di attività, obiettivo e lingua.\u003c/p>\n  \u003cp>\u003cstrong>Salute e forma fisica:\u003c/strong> storico di peso e misure, menu e alimenti registrati, digiuno, allenamenti (serie, ripetizioni, pesi, recuperi), frequenza cardiaca se colleghi un cardiofrequenzimetro, e passi, peso o calorie se importi dati dalla tua app di salute o da Health Connect. Se utilizzi le sezioni Gravidanza o Bebè, i dati che vi inserisci (settimana di gravidanza, età del bebè, note).\u003c/p>\n  \u003cp>\u003cstrong>Foto e contenuti:\u003c/strong> le foto che carichi o fai analizzare con l'intelligenza artificiale e i messaggi della chat.\u003c/p>\n  \u003cp>\u003cstrong>Rapporto con allenatori, amici e community:\u003c/strong> richieste, collegamenti e ciò che condividi con loro (vedi la sezione 5).\u003c/p>\n  \u003cp>\u003cstrong>Programma di inviti e contributi:\u003c/strong> il tuo codice invito, gli utenti invitati e gli alimenti che aggiungi al database.\u003c/p>\n  \u003cp>\u003cstrong>Dati tecnici e di utilizzo:\u003c/strong> tipo di dispositivo e di browser, indirizzo IP, lingua, registri degli errori dell'applicazione e un registro di utilizzo di base (quali schermate apri e in quale passaggio della registrazione abbandoni, senza alcun contenuto sanitario e senza includere la schermata del modulo Bodybuilding). Se hai effettuato l'accesso, questo registro di utilizzo è associato al tuo utente. Servono a far funzionare l'app, a correggere i malfunzionamenti e a migliorarla. Base giuridica: il nostro legittimo interesse.\u003c/p>\n  \u003cp>\u003cstrong>Notifiche:\u003c/strong> se le attivi, conserviamo l'identificativo tecnico del tuo dispositivo per inviartele. Se attivi anche il promemoria della serie, conserviamo inoltre l'ora che scegli, il tuo fuso orario, la tua serie attuale e la data della tua ultima registrazione, per poterti avvisare in tempo. Base giuridica: il tuo consenso (l'autorizzazione che concedi nel tuo browser o sul tuo cellulare e l'interruttore del promemoria), che puoi revocare in qualsiasi momento disattivandoli.\u003c/p>\n  \u003cp>\u003cstrong>Pagamenti:\u003c/strong> se sottoscrivi un piano a pagamento, la riscossione è gestita da Stripe. Non vediamo né conserviamo i dati della tua carta; riceviamo soltanto lo stato del tuo abbonamento.\u003c/p>\n\n  \u003ch2>3. Per quali finalità li utilizziamo e su quale base giuridica\u003c/h2>\n  \u003cp>\u003cstrong>Fornirti il servizio\u003c/strong> (creare il tuo account, calcolare i tuoi obiettivi di calorie e macronutrienti, generare la tua lista della spesa, mostrare i tuoi progressi, gestire il tuo abbonamento). Base giuridica: l'esecuzione del contratto.\u003c/p>\n  \u003cp>\u003cstrong>Trattare i tuoi dati relativi alla salute.\u003c/strong> Base giuridica: il tuo consenso esplicito, che ci presti al momento della creazione dell'account e che puoi revocare in qualsiasi momento eliminando il tuo account. Se non lo presti, non possiamo offrirti il servizio.\u003c/p>\n  \u003cp>\u003cstrong>Funzioni di intelligenza artificiale\u003c/strong> (identificare alimenti in una foto, chat di nutrizione, riepiloghi dei progressi). Base giuridica: il tuo consenso al momento dell'utilizzo della funzione.\u003c/p>\n  \u003cp>\u003cstrong>Sicurezza, moderazione dei contenuti e correzione degli errori.\u003c/strong> Base giuridica: il nostro legittimo interesse a mantenere l'applicazione sicura e funzionante.\u003c/p>\n  \u003cp>\u003cstrong>Obblighi di legge\u003c/strong> (fatturazione, richieste delle autorità). Base giuridica: l'adempimento di un obbligo legale.\u003c/p>\n  \u003cp>Non utilizziamo mai i tuoi dati per finalità pubblicitarie né li vendiamo.\u003c/p>\n\n  \u003ch2>4. Decisioni automatizzate e intelligenza artificiale\u003c/h2>\n  \u003cp>Le stime dell'IA (calorie di un piatto, suggerimenti della chat) hanno valore indicativo e possono contenere errori. Non vengono prese decisioni che producano effetti giuridici nei tuoi confronti basate unicamente su un trattamento automatizzato. Verifica sempre ciò che ti propone l'IA.\u003c/p>\n\n  \u003ch2>5. Community, amici e allenatori\u003c/h2>\n  \u003cp>Il tuo profilo è \u003cstrong>privato per impostazione predefinita\u003c/strong>. Se lo rendi pubblico o accetti un'amicizia, quella persona vede il tuo nome utente, i tuoi menu e le tue foto.\u003c/p>\n  \u003cp>Se ti \u003cstrong>colleghi a un allenatore\u003c/strong>, questi potrà vedere le informazioni che condividi con lui (ad esempio i tuoi progressi, i tuoi menu e allenamenti e i messaggi della chat) per fornirti consulenza. Sei tu a decidere se collegarti e puoi scollegarti quando vuoi. I pagamenti tra allenatore e atleta avvengono al di fuori dell'app e cesta. non vi interviene.\u003c/p>\n\n  \u003ch2>6. Chi altro riceve i tuoi dati\u003c/h2>\n  \u003cp>Condividiamo solo i dati necessari con fornitori che agiscono per nostro conto:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — database, autenticazione, archiviazione delle foto e funzioni server.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — solo se utilizzi l'analisi delle foto o la chat con IA, e per moderare automaticamente le foto che carichi (sezione 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — riscossione degli abbonamenti.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — quando cerchi un prodotto per nome o codice a barre, tale ricerca viene inviata per ottenerne i dati.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — riceve segnalazioni tecniche di errori dell'applicazione (server nell'Unione europea).\u003c/p>\n  \u003cp>\u003cstrong>Hosting web e reti di distribuzione dei contenuti\u003c/strong> (Netlify o GitHub Pages, jsDelivr, cdnjs) — erogano l'applicazione e le sue librerie e, nel farlo, vedono il tuo indirizzo IP.\u003c/p>\n  \u003cp>I link ai video sulla tecnica degli esercizi aprono un motore di ricerca esterno (YouTube) solo quando li clicchi.\u003c/p>\n\n  \u003ch2>7. Trasferimenti internazionali\u003c/h2>\n  \u003cp>I tuoi dati sono conservati su server di Supabase a Londra (Regno Unito), che beneficia di una decisione di adeguatezza della Commissione europea. Google e Stripe possono trattare dati al di fuori dello Spazio economico europeo (ad esempio negli Stati Uniti), sulla base del quadro UE-USA per la protezione dei dati personali (Data Privacy Framework) o di clausole contrattuali tipo approvate dalla Commissione.\u003c/p>\n\n  \u003ch2>8. Moderazione di contenuti e foto\u003c/h2>\n  \u003cp>Ogni fotografia che carichi — foto del profilo, dei progressi, dei piatti, dei prodotti che aggiungi o inviata tramite chat — viene sottoposta a un filtro automatico di moderazione con intelligenza artificiale (Google Gemini) prima di essere accettata.\u003c/p>\n  \u003cp>Rifiutiamo e non conserviamo alcuna immagine che contenga: nudità o contenuti sessuali espliciti o allusivi; violenza esplicita o contenuti sconvolgenti; simboli o messaggi d'odio, razzisti od omofobi; o qualsiasi contenuto illegale, compreso qualsiasi contenuto che possa costituire sfruttamento o abuso sessuale di minori. Se una foto viene rifiutata, il file viene scartato e non viene mai conservato.\u003c/p>\n  \u003cp>Il motore di ricerca dei video sulla tecnica consente di cercare solo nomi reali di esercizi da un elenco chiuso; non invia mai testo libero non verificato.\u003c/p>\n  \u003cp>Se rileviamo, o ci viene segnalato, un account che carica ripetutamente contenuti vietati, possiamo sospenderlo o eliminarlo e conservare le prove strettamente necessarie qualora la legge ci obblighi a comunicarle alle autorità. Puoi segnalare contenuti inappropriati da «Segnala un problema» nelle impostazioni o scrivendo a cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Per quanto tempo conserviamo i tuoi dati\u003c/h2>\n  \u003cp>Finché il tuo account è attivo. Se lo elimini, i tuoi dati vengono cancellati dalla nostra banca dati in modo permanente e irreversibile; possono rimanere solo nelle copie di backup, che conserviamo per un massimo di 8 settimane e che vengono periodicamente sovrascritte. Se il tuo account resta inattivo per più di 18 mesi (a decorrere dalla tua ultima registrazione nell'app), lo eliminiamo per inattività. I dati di fatturazione degli abbonamenti sono conservati per il tempo richiesto dalla normativa fiscale e commerciale.\u003c/p>\n\n  \u003ch2>10. I tuoi diritti\u003c/h2>\n  \u003cp>Puoi accedere ai tuoi dati, rettificarli (modificando il tuo profilo), esportarli (Impostazioni → «Esporta i miei dati» e, se hai il modulo Bodybuilding, «Scarica i miei dati di Bodybuilding»), chiederne la cancellazione (pulsante «Elimina il mio account»), opporti al loro trattamento o chiederne la limitazione, chiederne la portabilità e revocare il tuo consenso in qualsiasi momento. Scrivici a cestafitness@gmail.com e ti risponderemo entro il termine di legge (un mese).\u003c/p>\n  \u003cp>Se ritieni che non abbiamo trattato correttamente i tuoi dati, puoi presentare un reclamo all'Agenzia spagnola per la protezione dei dati (Agencia Española de Protección de Datos, www.aepd.es) o all'autorità di controllo del tuo paese di residenza, ad esempio il Garante per la protezione dei dati personali.\u003c/p>\n\n  \u003ch2>11. Sicurezza\u003c/h2>\n  \u003cp>Le comunicazioni sono cifrate, le password sono conservate in forma cifrata e ogni utente può accedere solo ai propri dati tramite regole di accesso nel database. Qualora si verificasse una violazione di sicurezza che ti riguardi, te lo comunicheremmo e avviseremmo l'autorità di controllo entro i termini di legge.\u003c/p>\n\n  \u003ch2>12. Minori\u003c/h2>\n  \u003cp>cesta. non è rivolta ai minori di 18 anni e non devi creare un account se non hai questa età. Se utilizzi le sezioni Bebè o Famiglia, trattiamo i dati dei minori che inserisci sotto la tua responsabilità di madre, padre o tutore legale e solo per offrirti tali funzioni.\u003c/p>\n\n  \u003ch2>13. Archiviazione sul tuo dispositivo (cookie)\u003c/h2>\n  \u003cp>Non utilizziamo cookie pubblicitari né di tracciamento. Salviamo sul tuo dispositivo esclusivamente le informazioni strettamente necessarie al funzionamento dell'app: la tua sessione, la lingua, le tue preferenze e una copia per l'uso offline. Per questo motivo non ti mostriamo un banner sui cookie. Le segnalazioni di errore di Sentry sono di natura tecnica e non vengono usate per la pubblicità.\u003c/p>\n\n  \u003ch2>13 bis. Modulo Bodybuilding: dati sulla salute a tutela rafforzata\u003c/h2>\n  \u003cp>\u003cstrong>Quali dati.\u003c/strong> Solo se sottoscrivi il modulo e li inserisci tu: nome della sostanza, via di somministrazione, dose, data, frequenza e sito di iniezione, note, l'emivita indicata, il tuo inventario (quantità e scadenze), i valori delle tue analisi e i relativi intervalli di riferimento, i tuoi punteggi di benessere giornaliero, la data di sottoscrizione e i referti medici che carichi. Sono dati relativi alla salute, una categoria particolare ai sensi del GDPR (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Base giuridica.\u003c/strong> Il tuo consenso esplicito (art. 9, par. 2, lett. a) GDPR), che presti spuntando la casella al momento della sottoscrizione. Puoi revocarlo in qualsiasi momento cancellando i tuoi dati del modulo; la revoca non pregiudica il trattamento precedente. Conserviamo la data e la versione del testo a cui hai prestato il consenso, come prova.\u003c/p>\n  \u003cp>\u003cstrong>Finalità e destinatari.\u003c/strong> Solo per fornirti il modulo (registro, calendario, curve e referti). Non li usiamo per pubblicità né per la profilazione, non li vendiamo e gli allenatori collegati, gli amici e la Community non li vedono. La chat con IA non riceve i tuoi registri; riceve solo i messaggi che scrivi nella chat. Li conserva Supabase in qualità di responsabile del trattamento; i pagamenti sono elaborati da Stripe, che non riceve questi dati. Se menzioni una sostanza nella chat, quel testo viene inviato al fornitore di IA che elabora la chat (Google Gemini); evita di scrivere dati che non vuoi condividere.\u003c/p>\n  \u003cp>\u003cstrong>Sicurezza e conservazione.\u003c/strong> Tabelle con accesso limitato al tuo utente e un archivio privato per i tuoi referti, con crittografia in transito e a riposo. Vengono conservati finché usi il modulo e fino a quando li cancelli, oppure fino a 18 mesi di inattività dell'account. Quando elimini il tuo account, vengono eliminati anche i tuoi registri e i tuoi referti medici e viene annullato qualsiasi abbonamento attivo.\u003c/p>\n  \u003cp>\u003cstrong>I tuoi diritti e i minori.\u003c/strong> Puoi accedere, rettificare e cancellare questi dati dal modulo stesso ed esercitare gli altri diritti come spiegato nella sezione 10. Il modulo è vietato ai minori di 18 anni.\u003c/p>\n\n  \u003ch2>14. Avvertenza sulla salute\u003c/h2>\n  \u003cp>cesta. non è un dispositivo medico e non sostituisce il parere di un medico, di un dietista-nutrizionista o di un allenatore. Se sei in gravidanza, allatti, hai una malattia o segui una terapia, consulta un professionista prima di modificare la tua alimentazione o la tua attività fisica. I calcoli e le stime dell'IA hanno valore indicativo.\u003c/p>\n\n  \u003ch2>15. Modifiche a questa informativa\u003c/h2>\n  \u003cp>Se modificheremo qualcosa di importante, te lo comunicheremo in anticipo nell'app e, quando la legge lo richieda, ti chiederemo nuovamente il consenso.\u003c/p>\n\n  \u003ch2>16. Contatti\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","pt":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Última atualização: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Resumo:\u003c/strong> a cesta. trata dados de saúde (peso, medidas corporais, treinos, frequência cardíaca), que o RGPD considera uma categoria especial de dados. Utilizamo-los apenas para lhe prestar o serviço, nunca para publicidade nem para os vender a terceiros.\u003c/p>\n\n  \u003ch2>1. Quem é o responsável\u003c/h2>\n  \u003cp>O responsável pelo tratamento dos seus dados é \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Para qualquer questão sobre privacidade, escreva para cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Que dados recolhemos\u003c/h2>\n  \u003cp>\u003cstrong>Conta e perfil:\u003c/strong> email, palavra-passe (guardada de forma cifrada), nome de utilizador, peso, altura, idade, sexo, nível de atividade, objetivo e idioma.\u003c/p>\n  \u003cp>\u003cstrong>Saúde e condição física:\u003c/strong> histórico de peso e medidas, ementas e alimentos registados, jejum, treinos (séries, repetições, cargas, descansos), frequência cardíaca se ligar um monitor cardíaco, e passos, peso ou calorias se importar dados da sua aplicação de saúde ou do Health Connect. Se utilizar as secções de Gravidez ou de Bebé, os dados que nelas introduzir (semana de gestação, idade do bebé, notas).\u003c/p>\n  \u003cp>\u003cstrong>Fotografias e conteúdos:\u003c/strong> as fotografias que carrega ou analisa com inteligência artificial e as mensagens de chat.\u003c/p>\n  \u003cp>\u003cstrong>Relação com treinadores, amigos e comunidade:\u003c/strong> pedidos, ligações e o que partilhar com eles (ver ponto 5).\u003c/p>\n  \u003cp>\u003cstrong>Programa de convites e contributos:\u003c/strong> o seu código de convite, os utilizadores convidados e os alimentos que contribuir para a base de dados.\u003c/p>\n  \u003cp>\u003cstrong>Dados técnicos e de utilização:\u003c/strong> tipo de dispositivo e de navegador, endereço IP, idioma, registos de erros da aplicação e um registo básico de utilização (que ecrãs abre e em que passo do registo abandona, sem qualquer conteúdo de saúde e sem incluir o ecrã do módulo Musculação). Se iniciou sessão, esse registo de utilização fica associado ao seu utilizador. Servem para que a app funcione, para corrigir falhas e para a melhorar. Base jurídica: o nosso interesse legítimo.\u003c/p>\n  \u003cp>\u003cstrong>Notificações:\u003c/strong> se as ativar, guardamos o identificador técnico do seu dispositivo para lhas enviar. Se ativar também o lembrete de sequência, guardamos ainda a hora que escolher, o seu fuso horário, a sua sequência atual e a data do seu último registo, para o podermos avisar a tempo. Base jurídica: o seu consentimento (a permissão que dá no seu navegador ou no seu telemóvel e o interruptor do lembrete), que pode retirar a qualquer momento desativando-os.\u003c/p>\n  \u003cp>\u003cstrong>Pagamentos:\u003c/strong> se subscrever um plano pago, a Stripe gere a cobrança. Nós não vemos nem guardamos os dados do seu cartão; apenas recebemos o estado da sua subscrição.\u003c/p>\n\n  \u003ch2>3. Para que os utilizamos e com que fundamento jurídico\u003c/h2>\n  \u003cp>\u003cstrong>Prestar-lhe o serviço\u003c/strong> (criar a sua conta, calcular os seus objetivos de calorias e macronutrientes, gerar a sua lista de compras, mostrar o seu progresso, gerir a sua subscrição). Fundamento jurídico: a execução do contrato.\u003c/p>\n  \u003cp>\u003cstrong>Tratar os seus dados de saúde.\u003c/strong> Fundamento jurídico: o seu consentimento explícito, que nos dá ao criar a conta e que pode retirar a qualquer momento eliminando a sua conta. Se não o der, não podemos oferecer-lhe o serviço.\u003c/p>\n  \u003cp>\u003cstrong>Funcionalidades de inteligência artificial\u003c/strong> (identificar alimentos numa fotografia, chat de nutrição, resumos de progresso). Fundamento jurídico: o seu consentimento ao utilizar a funcionalidade.\u003c/p>\n  \u003cp>\u003cstrong>Segurança, moderação de conteúdos e correção de erros.\u003c/strong> Fundamento jurídico: o nosso interesse legítimo em manter a aplicação segura e em funcionamento.\u003c/p>\n  \u003cp>\u003cstrong>Obrigações legais\u003c/strong> (faturação, pedidos de autoridades). Fundamento jurídico: o cumprimento de uma obrigação jurídica.\u003c/p>\n  \u003cp>Nunca utilizamos os seus dados para fins publicitários nem os vendemos.\u003c/p>\n\n  \u003ch2>4. Decisões automatizadas e inteligência artificial\u003c/h2>\n  \u003cp>As estimativas da IA (calorias de um prato, sugestões do chat) são meramente indicativas e podem conter erros. Não são tomadas decisões que produzam efeitos jurídicos na sua esfera com base exclusivamente em tratamentos automatizados. Verifique sempre o que a IA lhe propõe.\u003c/p>\n\n  \u003ch2>5. Comunidade, amigos e treinadores\u003c/h2>\n  \u003cp>O seu perfil é \u003cstrong>privado por defeito\u003c/strong>. Se o tornar público ou aceitar uma amizade, essa pessoa vê o seu nome de utilizador, ementas e fotografias.\u003c/p>\n  \u003cp>Se se \u003cstrong>associar a um treinador\u003c/strong>, este poderá ver a informação que partilhar com ele (por exemplo, o seu progresso, as suas ementas e treinos, e as mensagens do chat) para o aconselhar. É o utilizador quem decide associar-se e pode desassociar-se quando quiser. Os pagamentos entre treinador e atleta são feitos fora da app e a cesta. não intervém nos mesmos.\u003c/p>\n\n  \u003ch2>6. Quem mais recebe os seus dados\u003c/h2>\n  \u003cp>Só partilhamos os dados necessários com prestadores de serviços que atuam por nossa conta:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — base de dados, autenticação, armazenamento de fotografias e funções de servidor.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — apenas se utilizar a análise de fotografias ou o chat com IA, e para moderar automaticamente as fotografias que carrega (ponto 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — cobrança de subscrições.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — quando procura um produto pelo nome ou pelo código de barras, essa pesquisa é enviada para obter os respetivos dados.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — recebe relatórios técnicos de erros da aplicação (servidores na União Europeia).\u003c/p>\n  \u003cp>\u003cstrong>Alojamento web e redes de distribuição de conteúdos\u003c/strong> (Netlify ou GitHub Pages, jsDelivr, cdnjs) — fornecem a aplicação e as suas bibliotecas e, ao fazê-lo, veem o seu endereço IP.\u003c/p>\n  \u003cp>As ligações a vídeos de técnica de exercícios abrem um motor de pesquisa externo (YouTube) apenas quando o utilizador clica.\u003c/p>\n\n  \u003ch2>7. Transferências internacionais\u003c/h2>\n  \u003cp>Os seus dados são armazenados em servidores da Supabase em Londres (Reino Unido), que beneficia de uma decisão de adequação da Comissão Europeia. A Google e a Stripe podem tratar dados fora do Espaço Económico Europeu (por exemplo, nos Estados Unidos), ao abrigo do Quadro de Privacidade de Dados UE-EUA ou de cláusulas contratuais-tipo aprovadas pela Comissão.\u003c/p>\n\n  \u003ch2>8. Moderação de conteúdos e fotografias\u003c/h2>\n  \u003cp>Toda a fotografia que carregar — fotografia de perfil, de progresso, de pratos, de produtos que contribuir, ou enviada por chat — passa por um filtro automático de moderação com inteligência artificial (Google Gemini) antes de ser aceite.\u003c/p>\n  \u003cp>Rejeitamos e não guardamos qualquer imagem que contenha: nudez ou conteúdo sexual explícito ou sugestivo; violência gráfica ou conteúdo perturbador; símbolos ou mensagens de ódio, racistas ou homofóbicos; ou qualquer conteúdo ilegal, incluindo qualquer conteúdo que possa constituir exploração ou abuso sexual de crianças. Se uma fotografia for rejeitada, o ficheiro é descartado e não chega a ser guardado.\u003c/p>\n  \u003cp>O motor de pesquisa de vídeos de técnica apenas permite pesquisar nomes reais de exercícios de uma li
