nżommu biss informazzjoni strettament meħtieġa biex l-app taħdem: is-sessjoni tiegħek, il-lingwa, il-preferenzi u kopja biex tużaha mingħajr konnessjoni. Għalhekk ma nuruk ebda avviż dwar il-cookies. Ir-rapporti ta' żbalji ta' Sentry huma tekniċi u ma jintużawx għar-reklamar.\u003c/p>\n\n  \u003ch2>13 bis. Modulu Bodybuilding: dejta dwar is-saħħa b'protezzjoni msaħħa\u003c/h2>\n  \u003cp>\u003cstrong>Liema dejta.\u003c/strong> Biss jekk tabbona għall-modulu u inti stess tidħolha: isem is-sustanza, ir-rotta, id-doża, id-data, il-frekwenza u l-post tal-injezzjoni, noti, il-half-life indikata, l-inventarju tiegħek (kwantitajiet u skadenzi), il-valuri tal-analiżi tiegħek u l-firxiet ta' referenza tagħhom, il-punteġġi ta' benessri ta' kuljum, id-data tal-abbonament u r-rapporti mediċi li tgħolli. Din hija dejta dwar is-saħħa, kategorija speċjali skont il-GDPR (Art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Bażi legali.\u003c/strong> Il-kunsens espliċitu tiegħek (Art. 9(2)(a) tal-GDPR), li inti tagħti billi timmarka l-kaxxa meta tabbona. Tista' tirtirah fi kwalunkwe ħin billi tħassar id-dejta tal-modulu tiegħek; l-irtirar ma jaffettwax l-ipproċessar preċedenti. Nżommu d-data u l-verżjoni tat-test li kkunsintejt għaliha, bħala prova.\u003c/p>\n  \u003cp>\u003cstrong>Għal xiex u ma' min.\u003c/strong> Biss biex nipprovdulek il-modulu (reġistru, kalendarju, kurvi u rapporti). Ma nużawhiex għar-reklamar jew għall-profilazzjoni, ma nbigħuhiex, u t-trainers marbutin, il-ħbieb u l-Komunità ma jarawhiex. Iċ-chat tal-IA ma jirċevix ir-reġistri tiegħek; jirċievi biss il-messaġġi li inti tikteb fiċ-chat. Jinħażnu minn Supabase bħala proċessur tad-dejta; il-ħlasijiet jiġu pproċessati minn Stripe, li ma tirċevix din id-dejta. Jekk issemmi sustanza fiċ-chat, dak it-test jintbagħat lill-fornitur tal-IA li jipproċessa ċ-chat (Google Gemini); tikteb l-ebda dejta li ma tridx taqsam.\u003c/p>\n  \u003cp>\u003cstrong>Sigurtà u żamma.\u003c/strong> Tabelli b'aċċess ristrett għall-utent tiegħek u ħażna privata għar-rapporti tiegħek, bi kriptaġġ waqt it-trasmissjoni u waqt il-ħażna. Tinżamm sakemm tuża l-modulu u sakemm inti tħassarha, jew sa 18-il xahar ta' nuqqas ta' attività fil-kont. Meta tħassar il-kont tiegħek jitħassru wkoll ir-reġistri u r-rapporti mediċi tiegħek u jiġi kkanċellat kwalunkwe abbonament attiv.\u003c/p>\n  \u003cp>\u003cstrong>Id-drittijiet tiegħek u l-minuri.\u003c/strong> Tista' taċċedi, tirrettifika u tħassar din id-dejta mill-modulu nnifsu u teżerċita d-drittijiet l-oħra tiegħek kif spjegat fit-taqsima 10. Il-modulu huwa pprojbit għal min għandu inqas minn 18-il sena.\u003c/p>\n\n  \u003ch2>14. Avviż dwar is-saħħa\u003c/h2>\n  \u003cp>cesta. mhijiex prodott mediku u ma tissostitwixxix il-parir ta' tabib, dietista-nutrizzjonista jew surġent. Jekk inti tqila, tredda', għandek mard jew qed issegwi trattament, ikkonsulta professjonista qabel ma tbiddel id-dieta jew l-attività fiżika tiegħek. Il-kalkoli u l-istimi tal-IA huma indikattivi.\u003c/p>\n\n  \u003ch2>15. Bidliet f'din il-politika\u003c/h2>\n  \u003cp>Jekk nibdlu xi ħaġa importanti, ngħidulek fl-app bil-quddiem u, meta l-liġi tesiġi, nerġgħu nitolbuk il-kunsens tiegħek.\u003c/p>\n\n  \u003ch2>16. Kuntatt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","ga":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Nuashonraithe go deireanach: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Achoimre:\u003c/strong> próiseálann cesta. sonraí sláinte (meáchan, tomhais choirp, oiliúint, ráta croí), a mheasann an GDPR a bheith ina gcatagóir speisialta sonraí pearsanta. Ní úsáidimid iad ach chun an tseirbhís a sholáthar duit, riamh chun críche fógraíochta agus ní dhíolaimid iad le tríú páirtithe.\u003c/p>\n\n  \u003ch2>1. Cé hé an rialaitheoir\u003c/h2>\n  \u003cp>Is é \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada) an rialaitheoir ar do chuid sonraí. Le haghaidh aon cheist maidir le príobháideacht, scríobh chuig cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Cé na sonraí a bhailímid\u003c/h2>\n  \u003cp>\u003cstrong>Cuntas agus próifíl:\u003c/strong> ríomhphost, pasfhocal (stóráilte criptithe), ainm úsáideora, meáchan, airde, aois, gnéas, leibhéal gníomhaíochta, sprioc agus teanga.\u003c/p>\n  \u003cp>\u003cstrong>Sláinte agus folláine choirp:\u003c/strong> stair meáchain agus tomhais, biachláir agus bianna cláraithe, troscadh, oiliúint (tacair, athrá, meáchain, sosanna), ráta croí má nascann tú monatóir croí, agus céimeanna, meáchan nó calraí má iompórtálann tú sonraí ó d'aip sláinte nó ó Health Connect. Má úsáideann tú na hailt Toircheas nó Leanbh, na sonraí a scríobhann tú iontu (seachtain toirchis, aois an linbh, nótaí).\u003c/p>\n  \u003cp>\u003cstrong>Grianghraif agus ábhar:\u003c/strong> na grianghraif a uaslódálann tú nó a anailísíonn tú le hintleacht shaorga, agus na teachtaireachtaí comhrá.\u003c/p>\n  \u003cp>\u003cstrong>Caidreamh le traenálaithe, cairde agus an pobal:\u003c/strong> iarratais, naisc agus an méid a roinneann tú leo (féach alt 5).\u003c/p>\n  \u003cp>\u003cstrong>Clár cuiridh agus ranníocaíochtaí:\u003c/strong> do chód cuiridh, na húsáideoirí a thug tú cuireadh dóibh agus na bianna a chuireann tú leis an mbunachar sonraí.\u003c/p>\n  \u003cp>\u003cstrong>Sonraí teicniúla agus úsáide:\u003c/strong> cineál feiste agus brabhsálaí, seoladh IP, teanga, taifid ar earráidí an fheidhmchláir agus taifead bunúsach úsáide (na scáileáin a osclaíonn tú agus an chéim sa chlárú ag a gcuireann tú deireadh leis, gan aon inneachar sláinte agus gan scáileán an mhodúil Corpoiliú a áireamh). Má tá tú logáilte isteach, baintear an taifead úsáide sin le do úsáideoir. Baineann siad le hoibriú na haipe, le ceartú lochtanna agus lena feabhsú. Bunús dlí: ár leas dlisteanach.\u003c/p>\n  \u003cp>\u003cstrong>Fógraí:\u003c/strong> má chuireann tú ar siúl iad, stórálaimid aitheantóir teicniúil do fheiste chun iad a sheoladh chugat. Má chuireann tú meabhrúchán na sraithe ar siúl freisin, stórálaimid an t-am a roghnaíonn tú, do chrios ama, do shraith reatha agus dáta do loga is déanaí, chun go bhféadfaimid meabhrúchán a chur chugat in am. Bunús dlí: do thoiliú (an cead a thugann tú i do bhrabhsálaí nó ar do ghuthán agus lascadh an mheabhrúcháin), is féidir leat é a tharraingt siar am ar bith trí iad a dhíchumasú.\u003c/p>\n  \u003cp>\u003cstrong>Íocaíochtaí:\u003c/strong> má chuireann tú síos ar phlean íoctha, láimhseálann Stripe an íocaíocht. Ní fheicimid ná ní stórálaimid sonraí do chárta; ní fhaighimid ach stádas do shuibscríbhinne.\u003c/p>\n\n  \u003ch2>3. Cad chuige a n-úsáidimid iad agus cén bunús dlí atá leo\u003c/h2>\n  \u003cp>\u003cstrong>An tseirbhís a sholáthar duit\u003c/strong> (do chuntas a chruthú, do spriocanna calraí agus macrachothaitheach a ríomh, do liosta siopadóireachta a ghiniúint, do dhul chun cinn a thaispeáint, do shuibscríbhinn a bhainistiú). Bunús dlí: an conradh a chur i gcrích.\u003c/p>\n  \u003cp>\u003cstrong>Do shonraí sláinte a phróiseáil.\u003c/strong> Bunús dlí: do thoiliú sainráite, a thugann tú dúinn agus tú ag cruthú an chuntais agus is féidir leat a tharraingt siar am ar bith trí do chuntas a scriosadh. Mura dtugann tú é, ní féidir linn an tseirbhís a sholáthar duit.\u003c/p>\n  \u003cp>\u003cstrong>Feidhmeanna intleachta saorga\u003c/strong> (bianna a aithint i ngrianghraf, comhrá cothaithe, achoimrí ar dhul chun cinn). Bunús dlí: do thoiliú agus tú ag úsáid na feidhme.\u003c/p>\n  \u003cp>\u003cstrong>Slándáil, modhnóireacht ábhair agus ceartú earráidí.\u003c/strong> Bunús dlí: ár leas dlisteanach an feidhmchlár a choinneáil slán agus ag feidhmiú.\u003c/p>\n  \u003cp>\u003cstrong>Oibleagáidí dlíthiúla\u003c/strong> (sonrasc, ceanglais ó údaráis). Bunús dlí: oibleagáid dhlíthiúil a chomhlíonadh.\u003c/p>\n  \u003cp>Ní úsáidimid do shonraí riamh chun críche fógraíochta agus ní dhíolaimid iad.\u003c/p>\n\n  \u003ch2>4. Cinntí uathoibrithe agus intleacht shaorga\u003c/h2>\n  \u003cp>Is treoirluachálacha iad meastacháin na hintleachta saorga (calraí mias, moltaí comhrá) agus is féidir go mbeadh earráidí iontu. Ní dhéantar cinntí a bhfuil éifeachtaí dlíthiúla acu ort bunaithe ar phróiseáil uathoibrithe amháin. Athbhreithnigh i gcónaí an méid a mholann an intleacht shaorga.\u003c/p>\n\n  \u003ch2>5. Pobal, cairde agus traenálaithe\u003c/h2>\n  \u003cp>Tá do phróifíl \u003cstrong>príobháideach de réir réamhshocraithe\u003c/strong>. Má dhéanann tú poiblí í nó má ghlacann tú le cairdeas, feiceann an duine sin d'ainm úsáideora, do bhiachláir agus do ghrianghraif.\u003c/p>\n  \u003cp>Má \u003cstrong>nascann tú le traenálaí\u003c/strong>, beidh sé in ann an t-eolas a roinneann tú leis a fheiceáil (mar shampla do dhul chun cinn, do bhiachláir agus d'oiliúint, agus teachtaireachtaí an chomhrá) chun comhairle a chur ort. Is tusa a chinneann an nasc a dhéanamh agus is féidir leat é a bhriseadh am ar bith. Déantar na híocaíochtaí idir traenálaí agus lúthchleasaí lasmuigh den aip agus ní ghlacann cesta. páirt iontu.\u003c/p>\n\n  \u003ch2>6. Cé eile a fhaigheann do shonraí\u003c/h2>\n  \u003cp>Ní roinnimid ach na sonraí is gá le soláthraithe a ghníomhaíonn ar ár son:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — bunachar sonraí, fíordheimhniú, stóráil grianghraf agus feidhmeanna freastalaí.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — ach amháin má úsáideann tú anailís ghrianghraf nó comhrá na hintleachta saorga, agus chun na grianghraif a uaslódálann tú a mhodhnú go huathoibríoch (alt 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — íocaíocht suibscríbhinní.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — nuair a chuardaíonn tú táirge de réir ainm nó barrachód, seoltar an cuardach sin chun a shonraí a fháil.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — faigheann sé tuarascálacha teicniúla ar earráidí an fheidhmchláir (freastalaithe san Aontas Eorpach).\u003c/p>\n  \u003cp>\u003cstrong>Óstáil gréasáin agus líonraí seachadta ábhair\u003c/strong> (Netlify nó GitHub Pages, jsDelivr, cdnjs) — freastalaíonn siad an feidhmchlár agus a leabharlanna agus, ag déanamh sin dóibh, feiceann siad do sheoladh IP.\u003c/p>\n  \u003cp>Osclaíonn na naisc chuig físeáin theicnící cleachtaí inneall cuardaigh seachtrach (YouTube) ach amháin nuair a bhrúnn tú féin.\u003c/p>\n\n  \u003ch2>7. Aistrithe idirnáisiúnta\u003c/h2>\n  \u003cp>Stóráiltear do shonraí ar fhreastalaithe Supabase i Londain (an Ríocht Aontaithe), a bhfuil cinneadh leordhúthanachta ón gCoimisiún Eorpach aici. Féadfaidh Google agus Stripe sonraí a phróiseáil lasmuigh den Limistéar Eacnamaíoch Eorpach (mar shampla sna Stáit Aontaithe), ar bhonn Chreat Príobháideachta Sonraí an AE-SAM nó clásail chonarthacha chaighdeánacha arna gceadú ag an gCoimisiún.\u003c/p>\n\n  \u003ch2>8. Modhnóireacht ábhair agus grianghraf\u003c/h2>\n  \u003cp>Téann gach grianghraf a uaslódálann tú — grianghraf próifíle, dul chun cinn, mias, táirgí a chuireann tú leis, nó a sheoltar tríd an gcomhrá — trí scagaire modhnóireachta uathoibríoch le hintleacht shaorga (Google Gemini) sula nglactar leis.\u003c/p>\n  \u003cp>Diúltaímid d'aon íomhá ina bhfuil sé seo a leanas agus ní stórálaimid í: nocht nó ábhar gnéasach follasach nó leathfhollasach; foréigean grafach nó ábhar suaiteach; siombailí nó teachtaireachtaí fuatha, ciníocha nó homafóibeacha; nó aon ábhar mídhleathach, lena n-áirítear aon ábhar a d'fhéadfadh a bheith ina shaothrú gnéasach nó ina mhí-úsáid ghnéasach ar leanaí. Má dhiúltaítear do ghrianghraf, caitear an comhad uaidh agus ní stóráiltear é riamh.\u003c/p>\n  \u003cp>Ní cheadaíonn an cuardach físeán teicnící ach ainmneacha fíor cleachtaí ó liosta dúnta a chuardach; ní sheolann sé téacs saor gan fhíorú riamh.\u003c/p>\n  \u003cp>Má bhraithimid, nó má thuairiscítear dúinn, cuntas a uaslódálann ábhar toirmiscthe arís agus arís eile, féadfaimid é a chur ar fionraí nó a scriosadh, agus na fianaise is gá go docht a choinneáil má cheanglaíonn an dlí orainn í a chur in iúl d'údaráis. Is féidir leat ábhar mí-oiriúnach a thuairisciú ó «Tuairiscigh locht» sna socruithe nó trí scríobh chuig cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Cé chomh fada a choinnímid do shonraí\u003c/h2>\n  \u003cp>Fad a bhíonn do chuntas gníomhach. Má scriosann tú é, scriostar do shonraí go buan agus go do-aisiompaithe as ár mbunachar sonraí; ní fhéadfaidh siad fanacht ach sna cóipeanna cúltaca, a choinnímid ar feadh 8 seachtaine ar a mhéad agus a scríobhtar thairis go tréimhsiúil. Má théann do chuntas thar 18 mí gan gníomhaíocht (ó do chlár deireanach san aip), scriosaimid é mar gheall ar neamhghníomhaíocht. Coinnítear sonraí billeála na suibscríbhinní fad a cheanglaíonn an reachtaíocht cánach agus tráchtála.\u003c/p>\n\n  \u003ch2>10. Do chearta\u003c/h2>\n  \u003cp>Is féidir leat rochtain a fháil ar do shonraí, iad a cheartú (trí do phróifíl a chur in eagar), iad a onnmhairiú (Socruithe → «Easpórtáil mo chuid sonraí» agus, má tá modúl Corpoiliú agat, «Íoslódáil mo shonraí Corpoiliú»), a scriosadh a iarraidh (an cnaipe «Scrios mo chuntas»), agus agóid a dhéanamh in aghaidh a bpróiseála nó í a shrianadh, iniomparthacht a iarraidh agus do thoiliú a tharraingt siar am ar bith. Scríobh chugainn ag cestafitness@gmail.com agus freagróimid laistigh den teorainn dlíthiúil (mí amháin).\u003c/p>\n  \u003cp>Má chreideann tú nár láimhseáil muid do shonraí i gceart, is féidir leat gearán a dhéanamh leis an nGníomhaireacht Spáinneach um Chosaint Sonraí (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Slándáil\u003c/h2>\n  \u003cp>Tá na cumarsáidí criptithe, stóráiltear na pasfhocail criptithe agus ní féidir le gach úsáideoir ach a shonraí féin a rochtain trí rialacha rochtana sa bhunachar sonraí. Dá dtarlódh sárú slándála a bhainfeadh leat, chuirfimis in iúl duit é agus chuirfimis an t-údarás maoirseachta ar an eolas laistigh de na teorainneacha ama dlíthiúla.\u003c/p>\n\n  \u003ch2>12. Mionaoisigh\u003c/h2>\n  \u003cp>Níl cesta. dírithe ar dhaoine faoi 18 bliana d'aois agus níor cheart duit cuntas a chruthú mura bhfuil an aois sin sroichte agat. Má úsáideann tú na hailt Leanbh nó Teaghlach, próiseálaimid na sonraí mionaoiseach a chuireann tú isteach faoi do fhreagracht mar mháthair, athair nó caomhnóir dlíthiúil, agus chun na feidhmeanna sin a sholáthar duit amháin.\u003c/p>\n\n  \u003ch2>13. Stóráil ar do ghléas (fianáin)\u003c/h2>\n  \u003cp>Ní úsáidimid fianáin fógraíochta ná rianaithe. Ní stórálaimid ar do ghléas ach an t-eolas is gá go docht chun an aip a oibriú: do sheisiún, an teanga, do shainroghanna agus cóip le húsáid gan nasc. Dá bhrí sin ní thaispeánaimid fógra fianán duit. Is teicniúil iad tuarascálacha earráidí Sentry agus ní úsáidtear iad le haghaidh fógraíochta.\u003c/p>\n\n  \u003ch2>13 bis. Modúl Corpoiliú: sonraí sláinte faoi chosaint fheabhsaithe\u003c/h2>\n  \u003cp>\u003cstrong>Cé na sonraí.\u003c/strong> Ach amháin má shíníonn tú suas don mhodúl agus má chuireann tú féin isteach iad: ainm na substainte, an bealach, an dáileog, an dáta, an mhinicíocht agus an suíomh instealladh, nótaí, an leathré a léirigh tú, d'fhardal (cainníochtaí agus dátaí éaga), luachanna d'anailísí agus a raonta tagartha, do scóir folláine laethúla, dáta an tsínithe suas agus na tuarascálacha míochaine a uaslódálann tú. Is sonraí sláinte iad, catagóir speisialta faoin GDPR (Airteagal 9).\u003c/p>\n  \u003cp>\u003cstrong>Bunús dlí.\u003c/strong> Do thoiliú sainráite (Airteagal 9(2)(a) den GDPR), a thugann tú trí bhosca a thiceáil nuair a shíníonn tú suas. Is féidir leat é a tharraingt siar am ar bith trí shonraí do mhodúil a scriosadh; ní théann an tarraingt siar i bhfeidhm ar phróiseáil roimhe sin. Coimeádaimid an dáta agus leagan an téacs ar thoiligh tú leis, mar fhianaise.\u003c/p>\n  \u003cp>\u003cstrong>Cén aidhm agus cé leo.\u003c/strong> Chun an modúl a chur ar fáil duit amháin (clár, féilire, cuair agus tuarascálacha). Ní úsáidimid iad le haghaidh fógraíochta ná próifílithe, ní dhíolaimid iad, agus ní fheiceann traenálaithe nasctha, cairde ná an Pobal iad. Ní fhaigheann an comhrá AI do thaifid; ní fhaigheann sé ach na teachtaireachtaí a scríobhann tú sa chomhrá. Stórálann Supabase iad mar phróiseálaí sonraí; próiseálann Stripe na híocaíochtaí, agus ní fhaigheann sé na sonraí seo. Má luann tú substaint sa chomhrá, seoltar an téacs sin chuig an soláthraí AI a phróiseálann an comhrá (Google Gemini); ná clóscríobh sonraí nár mhaith leat a roinnt.\u003c/p>\n  \u003cp>\u003cstrong>Slándáil agus coinneáil.\u003c/strong> Táblaí a bhfuil rochtain orthu teoranta do d'úsáideoir agus stóras príobháideach do do thuarascálacha, le criptiú i dtrasnú agus i bhfos cionn. Coimeádtar iad fad a úsáideann tú an modúl agus go dtí go scriosann tú iad, nó suas le 18 mí de neamhghníomhaíocht sa chuntas. Nuair a scriosann tú do chuntas scriostar freisin do thaifid agus do thuarascálacha míochaine agus cealaítear aon síntiús gníomhach.\u003c/p>\n  \u003cp>\u003cstrong>Do chearta agus mionaoisigh.\u003c/strong> Is féidir leat rochtain a fháil ar na sonraí seo, iad a cheartú agus a scriosadh ón modúl féin agus do chearta eile a fheidhmiú mar a mhínítear i gCuid 10. Tá an modúl toirmiscthe do dhaoine faoi 18 mbliana d'aois.\u003c/p>\n\n  \u003ch2>14. Fógra sláinte\u003c/h2>\n  \u003cp>Ní táirge sláinte é cesta. agus ní thagann sí in ionad comhairle dochtúra, réititheora-chothaitheora nó traenálaí. Má tá tú torrach, ag beathú cíche, tinn nó ag leanúint cóireála, téigh i gcomhairle le gairmí sula n-athraíonn tú do aiste bia nó do ghníomhaíocht choirp. Is treoir amháin iad na ríomhanna agus meastacháin na hintleachta saorga.\u003c/p>\n\n  \u003ch2>15. Athruithe ar an mbeartas seo\u003c/h2>\n  \u003cp>Má athraímid rud tábhachtach, déarfaimid leat san aip roimh ré agus, nuair a cheanglaíonn an dlí, iarrfaimid do thoiliú arís.\u003c/p>\n\n  \u003ch2>16. Teagmháil\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>"};
