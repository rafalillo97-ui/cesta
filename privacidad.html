sta fechada; nunca envia texto livre sem verificação.\u003c/p>\n  \u003cp>Se detetarmos, ou nos for comunicada, uma conta que carregue repetidamente conteúdo proibido, podemos suspendê-la ou eliminá-la e conservar as provas estritamente necessárias se a lei nos obrigar a comunicá-las às autoridades. Pode denunciar conteúdo inadequado a partir de «Reportar uma falha» nas definições ou escrevendo para cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Durante quanto tempo conservamos os seus dados\u003c/h2>\n  \u003cp>Enquanto a sua conta estiver ativa. Se a eliminar, os seus dados são apagados da nossa base de dados de forma permanente e irreversível; só podem permanecer nas cópias de segurança, que conservamos no máximo 8 semanas e que são periodicamente substituídas. Se a sua conta estiver mais de 18 meses sem atividade (contados desde o seu último registo na app), eliminamo-la por inatividade. Os dados de faturação das subscrições são conservados durante o tempo exigido pela legislação fiscal e comercial.\u003c/p>\n\n  \u003ch2>10. Os seus direitos\u003c/h2>\n  \u003cp>Pode aceder aos seus dados, retificá-los (editando o seu perfil), exportá-los (Definições → «Exportar os meus dados» e, se tiver o módulo Musculação, «Descarregar os meus dados de Musculação»), solicitar o seu apagamento (botão «Eliminar a minha conta»), opor-se ao seu tratamento ou limitá-lo, solicitar a sua portabilidade e retirar o seu consentimento a qualquer momento. Escreva-nos para cestafitness@gmail.com e responderemos no prazo legal (um mês).\u003c/p>\n  \u003cp>Se considerar que não tratámos corretamente os seus dados, pode apresentar uma reclamação à Agência Espanhola de Proteção de Dados (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Segurança\u003c/h2>\n  \u003cp>As comunicações são cifradas, as palavras-passe são guardadas de forma cifrada e cada utilizador só pode aceder aos seus próprios dados através de regras de acesso na base de dados. Se ocorresse uma violação de dados pessoais que o afetasse, comunicar-lho-íamos e notificaríamos a autoridade de controlo nos prazos legais.\u003c/p>\n\n  \u003ch2>12. Menores de idade\u003c/h2>\n  \u003cp>A cesta. não se destina a menores de 18 anos e não deve criar uma conta se não tiver essa idade. Se utilizar as secções de Bebé ou de Familiar, tratamos os dados de menores que introduzir sob a sua responsabilidade como mãe, pai ou tutor legal, e apenas para lhe oferecer essas funcionalidades.\u003c/p>\n\n  \u003ch2>13. Armazenamento no seu dispositivo (cookies)\u003c/h2>\n  \u003cp>Não utilizamos cookies de publicidade nem de rastreamento. Guardamos no seu dispositivo apenas informação estritamente necessária para o funcionamento da app: a sua sessão, o idioma, as suas preferências e uma cópia para utilização sem ligação. Por isso, não lhe mostramos um aviso de cookies. Os relatórios de erros da Sentry são técnicos e não são utilizados para publicidade.\u003c/p>\n\n  \u003ch2>13 bis. Módulo Musculação: dados de saúde com proteção reforçada\u003c/h2>\n  \u003cp>\u003cstrong>Que dados.\u003c/strong> Apenas se subscreveres o módulo e os introduzires tu: nome da substância, via de administração, dose, data, frequência e local de injeção, notas, a semivida indicada, o teu inventário (quantidades e validades), os valores das tuas análises e os respetivos intervalos de referência, as tuas pontuações de bem-estar diário, a data de subscrição e os relatórios médicos que carregares. São dados de saúde, uma categoria especial do RGPD (art. 9.º).\u003c/p>\n  \u003cp>\u003cstrong>Base legal.\u003c/strong> O teu consentimento explícito (art. 9.º, n.º 2, alínea a), do RGPD), que dás ao assinalar a caixa ao subscrever. Podes retirá-lo a qualquer momento apagando os teus dados do módulo; a retirada não afeta o tratamento anterior. Guardamos a data e a versão do texto em que consentiste, como prova.\u003c/p>\n  \u003cp>\u003cstrong>Para quê e com quem.\u003c/strong> Apenas para te prestar o módulo (registo, calendário, curvas e relatórios). Não os usamos para publicidade nem para definição de perfis, não os vendemos e os treinadores associados, os amigos e a Comunidade não os veem. O chat com IA não recebe os teus registos; só recebe as mensagens que escreves no chat. São armazenados pela Supabase como subcontratante; os pagamentos são processados pela Stripe, que não recebe estes dados. Se mencionares uma substância no chat, esse texto é enviado ao fornecedor de IA que processa o chat (Google Gemini); evita escrever dados que não queiras partilhar.\u003c/p>\n  \u003cp>\u003cstrong>Segurança e conservação.\u003c/strong> Tabelas com acesso restrito ao teu utilizador e um armazenamento privado para os teus relatórios, com encriptação em trânsito e em repouso. São conservados enquanto usares o módulo e até que os apagues, ou até 18 meses de inatividade da conta. Ao eliminares a tua conta, também são eliminados os teus registos e os teus relatórios médicos e é cancelada qualquer subscrição ativa.\u003c/p>\n  \u003cp>\u003cstrong>Os teus direitos e os menores.\u003c/strong> Podes aceder, retificar e apagar estes dados a partir do próprio módulo e exercer os restantes direitos conforme explicado na secção 10. O módulo é proibido a menores de 18 anos.\u003c/p>\n\n  \u003ch2>14. Aviso de saúde\u003c/h2>\n  \u003cp>A cesta. não é um dispositivo médico nem substitui o aconselhamento de um médico, nutricionista ou treinador. Se estiver grávida, a amamentar, tiver uma doença ou estiver a seguir um tratamento, consulte um profissional antes de alterar a sua alimentação ou a sua atividade física. Os cálculos e as estimativas da IA são meramente indicativos.\u003c/p>\n\n  \u003ch2>15. Alterações a esta política\u003c/h2>\n  \u003cp>Se alterarmos algo de relevante, informá-lo-emos na app com antecedência e, quando a lei o exigir, voltaremos a pedir o seu consentimento.\u003c/p>\n\n  \u003ch2>16. Contacto\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","nl":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Laatst bijgewerkt: 25-09-2026\u003c/p>\n  \u003cp>\u003cstrong>Samenvatting:\u003c/strong> cesta. verwerkt gezondheidsgegevens (gewicht, lichaamsmaten, trainingen, hartslag), die de AVG beschouwt als een bijzondere categorie van persoonsgegevens. Wij gebruiken deze uitsluitend om je de dienst te leveren, nooit voor reclame en nooit om ze aan derden te verkopen.\u003c/p>\n\n  \u003ch2>1. Wie is de verwerkingsverantwoordelijke\u003c/h2>\n  \u003cp>De verwerkingsverantwoordelijke voor jouw gegevens is \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Voor vragen over privacy kun je schrijven naar cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Welke gegevens wij verzamelen\u003c/h2>\n  \u003cp>\u003cstrong>Account en profiel:\u003c/strong> e-mailadres, wachtwoord (versleuteld opgeslagen), gebruikersnaam, gewicht, lengte, leeftijd, geslacht, activiteitsniveau, doel en taal.\u003c/p>\n  \u003cp>\u003cstrong>Gezondheid en conditie:\u003c/strong> geschiedenis van gewicht en maten, geregistreerde menu’s en voedingsmiddelen, vasten, trainingen (sets, herhalingen, gewichten, rustperiodes), hartslag als je een hartslagmeter koppelt, en stappen, gewicht of calorieën als je gegevens importeert uit je gezondheidsapp of uit Health Connect. Als je de onderdelen Zwangerschap of Baby gebruikt, de gegevens die je daarin invoert (zwangerschapsweek, leeftijd van de baby, notities).\u003c/p>\n  \u003cp>\u003cstrong>Foto’s en inhoud:\u003c/strong> de foto’s die je uploadt of laat analyseren met kunstmatige intelligentie, en de chatberichten.\u003c/p>\n  \u003cp>\u003cstrong>Relatie met trainers, vrienden en de community:\u003c/strong> verzoeken, koppelingen en wat je met hen deelt (zie punt 5).\u003c/p>\n  \u003cp>\u003cstrong>Uitnodigings- en bijdrageprogramma:\u003c/strong> je uitnodigingscode, de uitgenodigde gebruikers en de voedingsmiddelen die je aan de database bijdraagt.\u003c/p>\n  \u003cp>\u003cstrong>Technische gegevens en gebruiksgegevens:\u003c/strong> type apparaat en browser, IP-adres, taal, foutmeldingen van de applicatie en een basaal gebruiksregister (welke schermen je opent en bij welke stap van de registratie je afhaakt, zonder enige gezondheidsinhoud en zonder het scherm van de Bodybuilding-module). Als je bent ingelogd, wordt dit gebruiksregister aan je gebruiker gekoppeld. Zij dienen om de app te laten werken, om fouten te herstellen en om de app te verbeteren. Rechtsgrondslag: ons gerechtvaardigd belang.\u003c/p>\n  \u003cp>\u003cstrong>Meldingen:\u003c/strong> als je ze inschakelt, bewaren wij de technische identificatie van je apparaat om ze naar je te sturen. Als je ook de reeksherinnering inschakelt, bewaren wij daarnaast het tijdstip dat je kiest, je tijdzone, je huidige reeks en de datum van je laatste registratie, zodat wij je op tijd kunnen herinneren. Rechtsgrondslag: je toestemming (de machtiging die je geeft in je browser of op je telefoon en de schakelaar van de herinnering), die je op elk moment kunt intrekken door ze uit te schakelen.\u003c/p>\n  \u003cp>\u003cstrong>Betalingen:\u003c/strong> als je een betaald abonnement afsluit, verzorgt Stripe de incasso. Wij zien of bewaren de gegevens van je kaart niet; wij ontvangen alleen de status van je abonnement.\u003c/p>\n\n  \u003ch2>3. Waarvoor wij ze gebruiken en op welke rechtsgrond\u003c/h2>\n  \u003cp>\u003cstrong>Je de dienst leveren\u003c/strong> (je account aanmaken, je calorie- en macronutriëntendoelen berekenen, je boodschappenlijst samenstellen, je voortgang tonen, je abonnement beheren). Rechtsgrond: de uitvoering van de overeenkomst.\u003c/p>\n  \u003cp>\u003cstrong>Je gezondheidsgegevens verwerken.\u003c/strong> Rechtsgrond: je uitdrukkelijke toestemming, die je ons geeft bij het aanmaken van je account en die je op elk moment kunt intrekken door je account te verwijderen. Als je die toestemming niet geeft, kunnen wij je de dienst niet aanbieden.\u003c/p>\n  \u003cp>\u003cstrong>Functies met kunstmatige intelligentie\u003c/strong> (voedingsmiddelen op een foto herkennen, voedingschat, samenvattingen van je voortgang). Rechtsgrond: je toestemming bij het gebruik van de functie.\u003c/p>\n  \u003cp>\u003cstrong>Beveiliging, contentmoderatie en foutherstel.\u003c/strong> Rechtsgrond: ons gerechtvaardigd belang bij het veilig en functioneel houden van de applicatie.\u003c/p>\n  \u003cp>\u003cstrong>Wettelijke verplichtingen\u003c/strong> (facturering, verzoeken van autoriteiten). Rechtsgrond: de naleving van een wettelijke verplichting.\u003c/p>\n  \u003cp>Wij gebruiken je gegevens nooit voor reclamedoeleinden en verkopen ze nooit.\u003c/p>\n\n  \u003ch2>4. Geautomatiseerde besluitvorming en kunstmatige intelligentie\u003c/h2>\n  \u003cp>De schattingen van de AI (calorieën van een gerecht, suggesties van de chat) zijn indicatief en kunnen fouten bevatten. Er worden geen besluiten met rechtsgevolgen voor jou genomen die uitsluitend op geautomatiseerde verwerking zijn gebaseerd. Controleer altijd wat de AI je voorstelt.\u003c/p>\n\n  \u003ch2>5. Community, vrienden en trainers\u003c/h2>\n  \u003cp>Je profiel is \u003cstrong>standaard privé\u003c/strong>. Als je het openbaar maakt of een vriendschap accepteert, ziet die persoon je gebruikersnaam, menu’s en foto’s.\u003c/p>\n  \u003cp>Als je je \u003cstrong>koppelt aan een trainer\u003c/strong>, kan deze de informatie zien die je met hem of haar deelt (bijvoorbeeld je voortgang, je menu’s en trainingen, en de chatberichten) om je te adviseren. Jij beslist zelf of je je koppelt en je kunt de koppeling op elk moment verbreken. Betalingen tussen trainer en atleet vinden buiten de app plaats en cesta. is daar op geen enkele wijze bij betrokken.\u003c/p>\n\n  \u003ch2>6. Wie je gegevens nog meer ontvangt\u003c/h2>\n  \u003cp>Wij delen alleen de noodzakelijke gegevens met dienstverleners die namens ons handelen:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — database, authenticatie, opslag van foto’s en serverfuncties.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — alleen als je de fotoanalyse of de chat met AI gebruikt, en om de foto’s die je uploadt automatisch te modereren (punt 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — incasso van abonnementen.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — wanneer je een product zoekt op naam of streepjescode, wordt die zoekopdracht verzonden om de gegevens ervan op te halen.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — ontvangt technische foutrapporten van de applicatie (servers in de Europese Unie).\u003c/p>\n  \u003cp>\u003cstrong>Webhosting en contentdistributienetwerken\u003c/strong> (Netlify of GitHub Pages, jsDelivr, cdnjs) — leveren de applicatie en de bijbehorende bibliotheken en zien daarbij je IP-adres.\u003c/p>\n  \u003cp>De links naar video’s over oefentechniek openen een externe zoekmachine (YouTube) alleen wanneer jij erop klikt.\u003c/p>\n\n  \u003ch2>7. Internationale doorgiften\u003c/h2>\n  \u003cp>Je gegevens worden opgeslagen op servers van Supabase in Londen (Verenigd Koninkrijk), waarvoor een adequaatheidsbesluit van de Europese Commissie geldt. Google en Stripe kunnen gegevens verwerken buiten de Europese Economische Ruimte (bijvoorbeeld in de Verenigde Staten), op grond van het EU-VS-gegevensprivacykader of van door de Commissie goedgekeurde modelcontractbepalingen.\u003c/p>\n\n  \u003ch2>8. Moderatie van inhoud en foto’s\u003c/h2>\n  \u003cp>Elke foto die je uploadt — profielfoto, voortgangsfoto, foto van gerechten, van producten die je bijdraagt, of via de chat verzonden — doorloopt een automatisch moderatiefilter met kunstmatige intelligentie (Google Gemini) voordat zij wordt geaccepteerd.\u003c/p>\n  \u003cp>Wij weigeren en bewaren elke afbeelding die het volgende bevat: naaktheid of expliciete of suggestieve seksuele inhoud; grafisch geweld of schokkende inhoud; haatdragende, racistische of homofobe symbolen of boodschappen; of enige onwettige inhoud, met inbegrip van inhoud die seksuele uitbuiting of seksueel misbruik van kinderen kan vormen. Als een foto wordt geweigerd, wordt het bestand verwijderd en wordt het nooit opgeslagen.\u003c/p>\n  \u003cp>De zoekmachine voor techniekvideo’s laat alleen toe te zoeken op echte namen van oefeningen uit een gesloten lijst; er wordt nooit vrije tekst zonder controle verzonden.\u003c/p>\n  \u003cp>Als wij een account signaleren, of als een account ons wordt gemeld, dat herhaaldelijk verboden inhoud uploadt, kunnen wij het account opschorten of verwijderen en het strikt noodzakelijke bewijsmateriaal bewaren indien de wet ons verplicht dit aan de autoriteiten door te geven. Je kunt ongepaste inhoud melden via “Een fout melden” in de instellingen of door te schrijven naar cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Hoe lang wij je gegevens bewaren\u003c/h2>\n  \u003cp>Zolang je account actief is. Als je het verwijdert, worden je gegevens permanent en onherroepelijk uit onze database gewist; ze kunnen alleen nog in back-ups blijven staan, die wij maximaal 8 weken bewaren en die periodiek worden overschreven. Als je account meer dan 18 maanden inactief is (gerekend vanaf je laatste registratie in de app), verwijderen wij het wegens inactiviteit. Factureringsgegevens van abonnementen worden bewaard gedurende de periode die fiscale en handelsrechtelijke regelgeving vereist.\u003c/p>\n\n  \u003ch2>10. Jouw rechten\u003c/h2>\n  \u003cp>Je kunt je gegevens inzien, rectificeren (door je profiel te bewerken), exporteren (Instellingen → “Mijn gegevens exporteren” en, als je de Bodybuilding-module hebt, “Mijn Bodybuilding-gegevens downloaden”), wissing ervan vragen (knop “Mijn account verwijderen”), bezwaar maken tegen de verwerking of deze beperken, dataportabiliteit vragen en je toestemming op elk moment intrekken. Schrijf ons via cestafitness@gmail.com en wij antwoorden binnen de wettelijke termijn (een maand).\u003c/p>\n  \u003cp>Als je vindt dat wij je gegevens niet correct hebben verwerkt, kun je een klacht indienen bij de Spaanse gegevensbeschermingsautoriteit (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Beveiliging\u003c/h2>\n  \u003cp>De communicatie is versleuteld, wachtwoorden worden versleuteld opgeslagen en elke gebruiker heeft alleen toegang tot zijn of haar eigen gegevens via toegangsregels in de database. Als er een inbreuk op de beveiliging zou plaatsvinden die jou raakt, zouden wij je daarvan op de hoogte stellen en de toezichthoudende autoriteit informeren binnen de wettelijke termijnen.\u003c/p>\n\n  \u003ch2>12. Minderjarigen\u003c/h2>\n  \u003cp>cesta. is niet bedoeld voor kinderen jonger dan 18 jaar en je mag geen account aanmaken als je die leeftijd niet hebt. Als je de onderdelen Baby of Gezin gebruikt, verwerken wij de gegevens van minderjarigen die je invoert onder jouw verantwoordelijkheid als moeder, vader of wettelijk voogd, en uitsluitend om je die functies te bieden.\u003c/p>\n\n  \u003ch2>13. Opslag op je apparaat (cookies)\u003c/h2>\n  \u003cp>Wij gebruiken geen advertentie- of trackingcookies. Wij slaan op je apparaat uitsluitend informatie op die strikt noodzakelijk is voor de werking van de app: je sessie, de taal, je voorkeuren en een kopie om offline te kunnen werken. Daarom tonen wij geen cookiemelding. De foutrapporten van Sentry zijn technisch van aard en worden niet voor reclame gebruikt.\u003c/p>\n\n  \u003ch2>13 bis. Module Bodybuilding: versterkte bescherming van gezondheidsgegevens\u003c/h2>\n  \u003cp>\u003cstrong>Welke gegevens.\u003c/strong> Alleen als je de module afsluit en ze zelf invoert: naam van de stof, toedieningsweg, dosis, datum, frequentie en injectieplaats, notities, de opgegeven halfwaardetijd, je voorraad (hoeveelheden en houdbaarheidsdata), de waarden van je labuitslagen en hun referentiebereiken, je dagelijkse welzijnsscores, de afsluitdatum en de medische rapporten die je uploadt. Dit zijn gezondheidsgegevens, een bijzondere categorie onder de AVG (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Rechtsgrond.\u003c/strong> Je uitdrukkelijke toestemming (art. 9, lid 2, onder a), AVG), die je geeft door het vakje aan te vinken bij het afsluiten. Je kunt deze op elk moment intrekken door je modulegegevens te verwijderen; de intrekking heeft geen invloed op de eerdere verwerking. Wij bewaren als bewijs de datum en de versie van de tekst waarmee je hebt ingestemd.\u003c/p>\n  \u003cp>\u003cstrong>Doel en ontvangers.\u003c/strong> Uitsluitend om je de module te leveren (registratie, kalender, curven en rapporten). Wij gebruiken ze niet voor reclame of profilering, verkopen ze niet en gekoppelde trainers, vrienden en de Community zien ze niet. De AI-chat ontvangt je registraties niet; hij ontvangt alleen de berichten die je in de chat schrijft. Supabase slaat ze op als verwerker; betalingen worden verwerkt door Stripe, dat deze gegevens niet ontvangt. Als je in de chat een stof noemt, wordt die tekst verstuurd naar de AI-aanbieder die de chat verwerkt (Google Gemini); typ geen gegevens die je niet wilt delen.\u003c/p>\n  \u003cp>\u003cstrong>Beveiliging en bewaring.\u003c/strong> Tabellen met toegang beperkt tot jouw gebruiker en een privéopslag voor je rapporten, met versleuteling tijdens transport en in rust. Ze worden bewaard zolang je de module gebruikt en totdat je ze verwijdert, of tot 18 maanden inactiviteit van het account. Wanneer je je account verwijdert, worden ook je registraties en medische rapporten verwijderd en wordt elk actief abonnement opgezegd.\u003c/p>\n  \u003cp>\u003cstrong>Je rechten en minderjarigen.\u003c/strong> Je kunt deze gegevens inzien, rectificeren en wissen vanuit de module zelf en je overige rechten uitoefenen zoals uitgelegd in punt 10. De module is verboden voor personen onder de 18 jaar.\u003c/p>\n\n  \u003ch2>14. Gezondheidswaarschuwing\u003c/h2>\n  \u003cp>cesta. is geen medisch hulpmiddel en vervangt het advies van een arts, diëtist of trainer niet. Als je zwanger bent, borstvoeding geeft, een ziekte hebt of een behandeling volgt, raadpleeg dan een professional voordat je je voeding of lichamelijke activiteit wijzigt. De berekeningen en schattingen van de AI zijn indicatief.\u003c/p>\n\n  \u003ch2>15. Wijzigingen in dit beleid\u003c/h2>\n  \u003cp>Als wij iets wezenlijks wijzigen, laten wij je dat vooraf in de app weten en, wanneer de wet dat vereist, vragen wij je opnieuw om toestemming.\u003c/p>\n\n  \u003ch2>16. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","pl":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Ostatnia aktualizacja: 25.09.2026\u003c/p>\n  \u003cp>\u003cstrong>Podsumowanie:\u003c/strong> cesta. przetwarza dane dotyczące zdrowia (masa ciała, wymiary ciała, treningi, tętno), które RODO uznaje za szczególną kategorię danych. Wykorzystujemy je wyłącznie w celu świadczenia Ci usługi, nigdy do celów reklamowych ani w celu ich sprzedaży osobom trzecim.\u003c/p>\n\n  \u003ch2>1. Kto jest administratorem\u003c/h2>\n  \u003cp>Administratorem Twoich danych jest \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). W sprawach dotyczących prywatności napisz na adres cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Jakie dane gromadzimy\u003c/h2>\n  \u003cp>\u003cstrong>Konto i profil:\u003c/strong> adres e-mail, hasło (przechowywane w postaci zaszyfrowanej), nazwa użytkownika, masa ciała, wzrost, wiek, płeć, poziom aktywności, cel i język.\u003c/p>\n  \u003cp>\u003cstrong>Zdrowie i sprawność fizyczna:\u003c/strong> historia masy ciała i wymiarów, zarejestrowane jadłospisy i produkty spożywcze, post, treningi (serie, powtórzenia, ciężary, przerwy), tętno, jeśli połączysz pulsometr, oraz kroki, masa ciała lub kalorie, jeśli zaimportujesz dane z aplikacji zdrowotnej lub z Health Connect. Jeśli korzystasz z sekcji Ciąża lub Niemowlę, dane, które w nich wprowadzisz (tydzień ciąży, wiek dziecka, notatki).\u003c/p>\n  \u003cp>\u003cstrong>Zdjęcia i treści:\u003c/strong> zdjęcia, które przesyłasz lub analizujesz za pomocą sztucznej inteligencji, oraz wiadomości na czacie.\u003c/p>\n  \u003cp>\u003cstrong>Relacje z trenerami, znajomymi i społecznością:\u003c/strong> zaproszenia, powiązania oraz to, co z nimi udostępnisz (zob. punkt 5).\u003c/p>\n  \u003cp>\u003cstrong>Program zaproszeń i wkładu użytkowników:\u003c/strong> Twój kod zaproszenia, zaproszeni użytkownicy oraz produkty spożywcze, które dodasz do bazy danych.\u003c/p>\n  \u003cp>\u003cstrong>Dane techniczne i dane o korzystaniu:\u003c/strong> typ urządzenia i przeglądarki, adres IP, język, rejestry błędów aplikacji oraz podstawowy rejestr korzystania (jakie ekrany otwierasz i na którym kroku rejestracji rezygnujesz, bez jakichkolwiek treści dotyczących zdrowia i bez ekranu modułu Kulturystyka). Jeśli jesteś zalogowany, ten rejestr korzystania jest powiązany z Twoim użytkownikiem. Służą one do zapewnienia działania aplikacji, naprawy usterek i jej ulepszania. Podstawa prawna: nasz prawnie uzasadniony interes.\u003c/p>\n  \u003cp>\u003cstrong>Powiadomienia:\u003c/strong> jeśli je włączysz, przechowujemy techniczny identyfikator Twojego urządzenia, aby móc je wysyłać. Jeśli włączysz także przypomnienie o serii, przechowujemy dodatkowo wybraną przez Ciebie godzinę, Twoją strefę czasową, Twoją aktualną serię oraz datę Twojego ostatniego wpisu, aby móc przypomnieć Ci na czas. Podstawa prawna: Twoja zgoda (uprawnienie, które nadajesz w przeglądarce lub na telefonie, oraz przełącznik przypomnienia), którą możesz w dowolnym momencie wycofać, wyłączając je.\u003c/p>\n  \u003cp>\u003cstrong>Płatności:\u003c/strong> jeśli wykupisz płatny plan, pobieranie opłat obsługuje Stripe. Nie widzimy ani nie przechowujemy danych Twojej karty; otrzymujemy wyłącznie informację o statusie Twojej subskrypcji.\u003c/p>\n\n  \u003ch2>3. W jakim celu je wykorzystujemy i na jakiej podstawie prawnej\u003c/h2>\n  \u003cp>\u003cstrong>Świadczenie Ci usługi\u003c/strong> (założenie konta, obliczanie Twoich celów kalorycznych i makroskładników, generowanie listy zakupów, wyświetlanie Twoich postępów, zarządzanie subskrypcją). Podstawa prawna: wykonanie umowy.\u003c/p>\n  \u003cp>\u003cstrong>Przetwarzanie Twoich danych dotyczących zdrowia.\u003c/strong> Podstawa prawna: Twoja wyraźna zgoda, którą wyrażasz przy zakładaniu konta i którą możesz w dowolnym momencie wycofać, usuwając konto. Jeśli jej nie wyrazisz, nie możemy świadczyć Ci usługi.\u003c/p>\n  \u003cp>\u003cstrong>Funkcje sztucznej inteligencji\u003c/strong> (rozpoznawanie produktów spożywczych na zdjęciu, czat żywieniowy, podsumowania postępów). Podstawa prawna: Twoja zgoda wyrażona przez skorzystanie z funkcji.\u003c/p>\n  \u003cp>\u003cstrong>Bezpieczeństwo, moderacja treści i naprawa błędów.\u003c/strong> Podstawa prawna: nasz prawnie uzasadniony interes polegający na utrzymaniu bezpieczeństwa i prawidłowego działania aplikacji.\u003c/p>\n  \u003cp>\u003cstrong>Obowiązki prawne\u003c/strong> (fakturowanie, wnioski organów władzy). Podstawa prawna: wypełnienie obowiązku prawnego.\u003c/p>\n  \u003cp>Nigdy nie wykorzystujemy Twoich danych do celów reklamowych ani ich nie sprzedajemy.\u003c/p>\n\n  \u003ch2>4. Zautomatyzowane podejmowanie decyzji i sztuczna inteligencja\u003c/h2>\n  \u003cp>Szacunki AI (kalorie potrawy, sugestie czatu) mają charakter orientacyjny i mogą zawierać błędy. Nie podejmujemy wobec Ciebie decyzji wywołujących skutki prawne opartych wyłącznie na zautomatyzowanym przetwarzaniu. Zawsze weryfikuj to, co proponuje Ci AI.\u003c/p>\n\n  \u003ch2>5. Społeczność, znajomi i trenerzy\u003c/h2>\n  \u003cp>Twój profil jest \u003cstrong>domyślnie prywatny\u003c/strong>. Jeśli ustawisz go jako publiczny lub zaakceptujesz zaproszenie do grona znajomych, ta osoba zobaczy Twoją nazwę użytkownika, jadłospisy i zdjęcia.\u003c/p>\n  \u003cp>Jeśli \u003cstrong>połączysz się z trenerem\u003c/strong>, będzie on mógł zobaczyć informacje, które mu udostępnisz (na przykład Twoje postępy, jadłospisy i treningi oraz wiadomości na czacie), aby móc Cię doradzać. To Ty decydujesz o połączeniu i możesz je zakończyć w dowolnym momencie. Płatności między trenerem a podopiecznym odbywają się poza aplikacją, a cesta. nie uczestniczy w nich w żaden sposób.\u003c/p>\n\n  \u003ch2>6. Kto jeszcze otrzymuje Twoje dane\u003c/h2>\n  \u003cp>Udostępniamy jedynie niezbędne dane dostawcom działającym w naszym imieniu:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — baza danych, uwierzytelnianie, przechowywanie zdjęć i funkcje serwerowe.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — tylko jeśli korzystasz z analizy zdjęć lub czatu z AI, oraz do automatycznej moderacji przesyłanych zdjęć (punkt 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — pobieranie opłat za subskrypcje.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — gdy wyszukujesz produkt po nazwie lub kodzie kreskowym, zapytanie jest przesyłane w celu pobrania danych o produkcie.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — otrzymuje techniczne raporty o błędach aplikacji (serwery w Unii Europejskiej).\u003c/p>\n  \u003cp>\u003cstrong>Hosting internetowy i sieci dostarczania treści\u003c/strong> (Netlify lub GitHub Pages, jsDelivr, cdnjs) — udostępniają aplikację i jej biblioteki, a przy tym widzą Twój adres IP.\u003c/p>\n  \u003cp>Odnośniki do filmów z techniką ćwiczeń otwierają zewnętrzną wyszukiwarkę (YouTube) wyłącznie po kliknięciu przez Ciebie.\u003c/p>\n\n  \u003ch2>7. Przekazywanie danych za granicę\u003c/h2>\n  \u003cp>Twoje dane są przechowywane na serwerach Supabase w Londynie (Wielka Brytania), w odniesieniu do której obowiązuje decyzja Komisji Europejskiej stwierdzająca odpowiedni stopień ochrony. Google i Stripe mogą przetwarzać dane poza Europejskim Obszarem Gospodarczym (na przykład w Stanach Zjednoczonych) na podstawie Ram Ochrony Danych UE–USA lub standardowych klauzul umownych zatwierdzonych przez Komisję.\u003c/p>\n\n  \u003ch2>8. Moderacja treści i zdjęć\u003c/h2>\n  \u003cp>Każde przesłane przez Ciebie zdjęcie — zdjęcie profilowe, zdjęcie postępów, zdjęcie potraw, produktów, które dodajesz, lub wysłane przez czat — przechodzi przed zaakceptowaniem przez automatyczny filtr moderacji oparty na sztucznej inteligencji (Google Gemini).\u003c/p>\n  \u003cp>Odrzucamy i nie przechowujemy żadnego obrazu, który zawiera: nagość lub treści seksualne jednoznaczne albo sugestywne; drastyczną przemoc lub treści wstrząsające; symbole lub przekazy nienawiści, rasistowskie lub homofobiczne; albo jakiekolwiek treści niezgodne z prawem, w tym wszelkie treści, które mogą stanowić seksualne wykorzystywanie lub wykorzystywanie seksualne dzieci. Jeśli zdjęcie zostanie odrzucone, plik jest usuwany i nie zostaje zapisany.\u003c/p>\n  \u003cp>Wyszukiwarka filmów z techniką ćwiczeń pozwala wyszukiwać wyłącznie rzeczywiste nazwy ćwiczeń z zamkniętej listy; nigdy nie wysyła swobodnego tekstu bez weryfikacji.\u003c/p>\n  \u003cp>Jeśli wykryjemy lub zostanie nam zgłoszone konto, które wielokrotnie przesyła zakazane treści, możemy je zawiesić lub usunąć oraz zachować ściśle niezbędne dowody, jeżeli prawo zobowiązuje nas do przekazania ich organom. Nieodpowiednie treści możesz zgłosić za pomocą opcji „Zgłoś błąd” w ustawieniach lub pisząc na adres cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Jak długo przechowujemy Twoje dane\u003c/h2>\n  \u003cp>Tak długo, jak Twoje konto jest aktywne. Jeśli je usuniesz, Twoje dane zostaną trwale i nieodwracalnie usunięte z naszej bazy danych; mogą pozostać jedynie w kopiach zapasowych, które przechowujemy maksymalnie 8 tygodni i które są okresowo nadpisywane. Jeśli Twoje konto pozostaje nieaktywne przez ponad 18 miesięcy (licząc od Twojego ostatniego wpisu w aplikacji), usuwamy je z powodu braku aktywności. Dane rozliczeniowe subskrypcji są przechowywane przez okres wymagany przepisami podatkowymi i handlowymi.\u003c/p>\n\n  \u003ch2>10. Twoje prawa\u003c/h2>\n  \u003cp>Możesz uzyskać dostęp do swoich danych, sprostować je (edytując profil), wyeksportować (Ustawienia → „Eksportuj moje dane” oraz, jeśli masz moduł Kulturystyka, „Pobierz moje dane z modułu Kulturystyka”), żądać ich usunięcia (przycisk „Usuń moje konto”), wnieść sprzeciw wobec ich przetwarzania lub żądać ograniczenia przetwarzania, żądać ich przeniesienia oraz w dowolnym momencie wycofać zgodę. Napisz do nas na adres cestafitness@gmail.com, a odpowiemy w terminie ustawowym (jeden miesiąc).\u003c/p>\n  \u003cp>Jeśli uważasz, że Twoje dane zostały przetworzone nieprawidłowo, możesz złożyć skargę do hiszpańskiego organu ochrony danych (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Bezpieczeństwo\u003c/h2>\n  \u003cp>Komunikacja jest szyfrowana, hasła są przechowywane w postaci zaszyfrowanej, a każdy użytkownik ma dostęp wyłącznie do własnych danych dzięki regułom dostępu w bazie danych. W razie naruszenia bezpieczeństwa, które Cię dotyczy, powiadomimy Cię o tym i zawiadomimy organ nadzorczy w terminach określonych prawem.\u003c/p>\n\n  \u003ch2>12. Małoletni\u003c/h2>\n  \u003cp>cesta. nie jest skierowana do osób poniżej 18. roku życia i nie powinieneś zakładać konta, jeśli nie ukończyłeś tego wieku. Jeśli korzystasz z sekcji Niemowlę lub Rodzina, dane małoletnich, które wprowadzisz, przetwarzamy na Twoją odpowiedzialność jako matki, ojca lub opiekuna prawnego i wyłącznie w celu zapewnienia Ci tych funkcji.\u003c/p>\n\n  \u003ch2>13. Przechowywanie na Twoim urządzeniu (pliki cookie)\u003c/h2>\n  \u003cp>Nie używamy reklamowych ani śledzących plików cookie. Na Twoim urządzeniu zapisujemy wyłącznie informacje ściśle niezbędne do działania aplikacji: Twoją sesję, język, preferencje oraz kopię umożliwiającą korzystanie bez połączenia z internetem. Dlatego nie wyświetlamy komunikatu o plikach cookie. Raporty o błędach Sentry mają charakter techniczny i nie są wykorzystywane do celów reklamowych.\u003c/p>\n\n  \u003ch2>13 bis. Moduł Kulturystyka: dane dotyczące zdrowia objęte wzmocnioną ochroną\u003c/h2>\n  \u003cp>\u003cstrong>Jakie dane.\u003c/strong> Tylko jeśli zawrzesz umowę na moduł i sam(-a) je wprowadzisz: nazwa substancji, droga podania, dawka, data, częstotliwość i miejsce wstrzyknięcia, notatki, podany okres półtrwania, Twoje zapasy (ilości i terminy ważności), wartości z Twoich wyników badań i ich zakresy referencyjne, Twoje dzienne oceny samopoczucia, data zawarcia umowy oraz raporty medyczne, które prześlesz. Są to dane dotyczące zdrowia, szczególna kategoria danych w rozumieniu RODO (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Podstawa prawna.\u003c/strong> Twoja wyraźna zgoda (art. 9 ust. 2 lit. a) RODO), której udzielasz, zaznaczając pole przy zawieraniu umowy. Możesz ją wycofać w dowolnym momencie, usuwając swoje dane z modułu; wycofanie zgody nie wpływa na zgodność z prawem przetwarzania dokonanego wcześniej. Jako dowód przechowujemy datę i wersję tekstu, na który wyraziłeś(-aś) zgodę.\u003c/p>\n  \u003cp>\u003cstrong>Cel i odbiorcy.\u003c/strong> Wyłącznie w celu świadczenia Ci modułu (zapisy, kalendarz, krzywe i raporty). Nie wykorzystujemy ich do reklamy ani profilowania, nie sprzedajemy ich, a powiązani trenerzy, znajomi i Społeczność ich nie widzą. Czat z AI nie otrzymuje Twoich zapisów; otrzymuje wyłącznie wiadomości, które sam(-a) wpisujesz na czacie. Przechowuje je Supabase jako podmiot przetwarzający; płatności przetwarza Stripe, który tych danych nie otrzymuje. Jeśli wspomnisz o substancji na czacie, ten tekst zostanie wysłany do dostawcy AI przetwarzającego czat (Google Gemini); nie wpisuj danych, którymi nie chcesz się dzielić.\u003c/p>\n  \u003cp>\u003cstrong>Bezpieczeństwo i przechowywanie.\u003c/strong> Tabele z dostępem ograniczonym do Twojego użytkownika oraz prywatny magazyn na Twoje raporty, z szyfrowaniem podczas przesyłania i w spoczynku. Są przechowywane, dopóki korzystasz z modułu i do czasu ich usunięcia przez Ciebie lub do 18 miesięcy braku aktywności na koncie. Po usunięciu konta usuwane są także Twoje zapisy i raporty medyczne, a każda aktywna subskrypcja zostaje anulowana.\u003c/p>\n  \u003cp>\u003cstrong>Twoje prawa i osoby niepełnoletnie.\u003c/strong> Możesz uzyskać dostęp do tych danych, sprostować je i usunąć z poziomu samego modułu oraz wykonywać pozostałe prawa, jak wyjaśniono w punkcie 10. Moduł jest zabroniony dla osób poniżej 18. roku życia.\u003c/p>\n\n  \u003ch2>14. Ostrzeżenie zdrowotne\u003c/h2>\n  \u003cp>cesta. nie jest wyrobem medycznym i nie zastępuje porady lekarza, dietetyka ani trenera. Jeśli jesteś w ciąży, karmisz piersią, chorujesz lub jesteś w trakcie leczenia, skonsultuj się ze specjalistą przed zmianą diety lub aktywności fizycznej. Obliczenia i szacunki AI mają charakter orientacyjny.\u003c/p>\n\n  \u003ch2>15. Zmiany w niniejszej polityce\u003c/h2>\n  \u003cp>Jeśli zmienimy coś istotnego, poinformujemy Cię o tym w aplikacji z wyprzedzeniem, a gdy wymaga tego prawo, ponownie poprosimy o Twoją zgodę.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","ro":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Ultima actualizare: 25.09.2026\u003c/p>\n  \u003cp>\u003cstrong>Rezumat:\u003c/strong> cesta. prelucrează date privind sănătatea (greutate, măsurători corporale, antrenamente, ritm cardiac), pe care RGPD le consideră o categorie specială de date. Le folosim exclusiv pentru a vă furniza serviciul, niciodată în scopuri publicitare și nici pentru a le vinde unor terți.\u003c/p>\n\n  \u003ch2>1. Cine este operatorul\u003c/h2>\n  \u003cp>Operatorul datelor dumneavoastră este \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Pentru orice întrebare privind confidențialitatea, scrieți la cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Ce date colectăm\u003c/h2>\n  \u003cp>\u003cstrong>Cont și profil:\u003c/strong> adresă de e-mail, parolă (stocată criptat), nume de utilizator, greutate, înălțime, vârstă, sex, nivel de activitate, obiectiv și limbă.\u003c/p>\n  \u003cp>\u003cstrong>Sănătate și condiție fizică:\u003c/strong> istoricul greutății și al măsurătorilor, meniurile și alimentele înregistrate, postul, antrenamentele (serii, repetări, greutăți, pauze), ritmul cardiac dacă conectați un pulsometru, precum și pașii, greutatea sau caloriile dacă importați date din aplicația dumneavoastră de sănătate sau din Health Connect. Dacă folosiți secțiunile Sarcină sau Bebeluș, datele pe care le introduceți în acestea (săptămâna de sarcină, vârsta bebelușului, notițe).\u003c/p>\n  \u003cp>\u003cstrong>Fotografii și conținut:\u003c/strong> fotografiile pe care le încărcați sau le analizați cu ajutorul inteligenței artificiale și mesajele din chat.\u003c/p>\n  \u003cp>\u003cstrong>Relația cu antrenorii, prietenii și comunitatea:\u003c/strong> solicitări, legături și ceea ce partajați cu aceștia (a se vedea punctul 5).\u003c/p>\n  \u003cp>\u003cstrong>Programul de invitații și contribuții:\u003c/strong> codul dumneavoastră de invitație, utilizatorii invitați și alimentele pe care le contribuiți la baza de date.\u003c/p>\n  \u003cp>\u003cstrong>Date tehnice și de utilizare:\u003c/strong> tipul dispozitivului și al browserului, adresa IP, limba, jurnalele de erori ale aplicației și un jurnal de bază al utilizării (ce ecrane deschideți și la ce pas al înregistrării renunțați, fără niciun conținut de sănătate și fără a include ecranul modulului Culturism). Dacă v-ați autentificat, acest jurnal de utilizare este asociat utilizatorului dumneavoastră. Acestea servesc pentru ca aplicația să funcționeze, pentru remedierea defecțiunilor și pentru îmbunătățirea ei. Temei juridic: interesul nostru legitim.\u003c/p>\n  \u003cp>\u003cstrong>Notificări:\u003c/strong> dacă le activați, păstrăm identificatorul tehnic al dispozitivului dumneavoastră pentru a vi le trimite. Dacă activați și mementoul pentru serie, păstrăm în plus ora aleasă de dumneavoastră, fusul orar, seria curentă și data ultimei înregistrări, pentru a vă putea anunța la timp. Temei juridic: consimțământul dumneavoastră (permisiunea pe care o acordați în browser sau pe telefon și comutatorul mementoului), pe care îl puteți retrage oricând dezactivându-le.\u003c/p>\n  \u003cp>\u003cstrong>Plăți:\u003c/strong> dacă achiziționați un plan cu plată, încasarea este gestionată de Stripe. Noi nu vedem și nu păstrăm datele cardului dumneavoastră; primim doar starea abonamentului.\u003c/p>\n\n  \u003ch2>3. Pentru ce le folosim și pe ce temei juridic\u003c/h2>\n  \u003cp>\u003cstrong>Furnizarea serviciului către dumneavoastră\u003c/strong> (crearea contului, calcularea obiectivelor dumneavoastră de calorii și macronutrienți, generarea listei de cumpărături, afișarea progresului, gestionarea abonamentului). Temei juridic: executarea contractului.\u003c/p>\n  \u003cp>\u003cstrong>Prelucrarea datelor dumneavoastră privind sănătatea.\u003c/strong> Temei juridic: consimțământul dumneavoastră explicit, pe care ni-l acordați la crearea contului și pe care îl puteți retrage în orice moment ștergându-vă contul. Dacă nu îl acordați, nu vă putem oferi serviciul.\u003c/p>\n  \u003cp>\u003cstrong>Funcții de inteligență artificială\u003c/strong> (identificarea alimentelor dintr-o fotografie, chat de nutriție, rezumate ale progresului). Temei juridic: consimțământul dumneavoastră la utilizarea funcției.\u003c/p>\n  \u003cp>\u003cstrong>Securitate, moderarea conținutului și remedierea erorilor.\u003c/strong> Temei juridic: interesul nostru legitim de a menține aplicația sigură și funcțională.\u003c/p>\n  \u003cp>\u003cstrong>Obligații legale\u003c/strong> (facturare, solicitări ale autorităților). Temei juridic: îndeplinirea unei obligații legale.\u003c/p>\n  \u003cp>Nu folosim niciodată datele dumneavoastră în scopuri publicitare și nu le vindem.\u003c/p>\n\n  \u003ch2>4. Decizii automatizate și inteligență artificială\u003c/h2>\n  \u003cp>Estimările IA (caloriile unui preparat, sugestiile din chat) au caracter orientativ și pot conține erori. Nu se iau decizii cu efecte juridice asupra dumneavoastră bazate exclusiv pe prelucrări automatizate. Verificați întotdeauna ceea ce vă propune IA.\u003c/p>\n\n  \u003ch2>5. Comunitate, prieteni și antrenori\u003c/h2>\n  \u003cp>Profilul dumneavoastră este \u003cstrong>privat în mod implicit\u003c/strong>. Dacă îl faceți public sau acceptați o prietenie, acea persoană vă vede numele de utilizator, meniurile și fotografiile.\u003c/p>\n  \u003cp>Dacă vă \u003cstrong>asociați cu un antrenor\u003c/strong>, acesta va putea vedea informațiile pe care le partajați cu el (de exemplu progresul dumneavoastră, meniurile și antrenamentele, precum și mesajele din chat) pentru a vă consilia. Dumneavoastră decideți dacă vă asociați și vă puteți disocia oricând. Plățile dintre antrenor și sportiv se fac în afara aplicației, iar cesta. nu intervine în ele.\u003c/p>\n\n  \u003ch2>6. Cine mai primește datele dumneavoastră\u003c/h2>\n  \u003cp>Partajăm doar datele necesare cu furnizori care acționează în numele nostru, în calitate de persoane împuternicite:\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — bază de date, autentificare, stocarea fotografiilor și funcții de server.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — doar dacă folosiți analiza fotografiilor sau chatul cu IA și pentru moderarea automată a fotografiilor pe care le încărcați (punctul 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — încasarea abonamentelor.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — atunci când căutați un produs după nume sau cod de bare, această căutare este trimisă pentru a obține datele produsului.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — primește rapoarte tehnice de erori ale aplicației (servere în Uniunea Europeană).\u003c/p>\n  \u003cp>\u003cstrong>Găzduire web și rețele de distribuție a conținutului\u003c/strong> (Netlify sau GitHub Pages, jsDelivr, cdnjs) — furnizează aplicația și bibliotecile acesteia și, în acest fel, vă văd adresa IP.\u003c/p>\n  \u003cp>Linkurile către videoclipuri cu tehnica exercițiilor deschid un motor de căutare extern (YouTube) numai atunci când apăsați dumneavoastră.\u003c/p>\n\n  \u003ch2>7. Transferuri internaționale\u003c/h2>\n  \u003cp>Datele dumneavoastră sunt stocate pe servere Supabase din Londra (Regatul Unit), care beneficiază de o decizie de adecvare a Comisiei Europene. Google și Stripe pot prelucra date în afara Spațiului Economic European (de exemplu în Statele Unite), pe baza Cadrului UE–SUA privind confidențialitatea datelor sau a clauzelor contractuale standard aprobate de Comisie.\u003c/p>\n\n  \u003ch2>8. Moderarea conținutului și a fotografiilor\u003c/h2>\n  \u003cp>Orice fotografie pe care o încărcați — fotografie de profil, de progres, a preparatelor, a produselor pe care le contribuiți sau trimisă prin chat — trece printr-un filtru automat de moderare cu inteligență artificială (Google Gemini) înainte de a fi acceptată.\u003c/p>\n  \u003cp>Respingem și nu păstrăm nicio imagine care conține: nuditate sau conținut sexual explicit ori sugestiv; violență grafică sau conținut șocant; simboluri sau mesaje de ură, rasiste sau homofobe; ori orice conținut ilegal, inclusiv orice conținut care ar putea constitui exploatare sau abuz sexual asupra copiilor. Dacă o fotografie este respinsă, fișierul este eliminat și nu ajunge să fie stocat.\u003c/p>\n  \u003cp>Motorul de căutare a videoclipurilor cu tehnica exercițiilor permite doar căutarea unor denumiri reale de exerciții dintr-o listă închisă; nu trimite niciodată text liber fără verificare.\u003c/p>\n  \u003cp>Dacă detectăm sau ni se raportează un cont care încarcă în mod repetat conținut interzis, îl putem suspenda sau șterge și putem păstra dovezile strict necesare dacă legea ne obligă să le comunicăm autorităților. Puteți raporta conținut necorespunzător din „Raportează o eroare” din setări sau scriind la cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Cât timp păstrăm datele dumneavoastră\u003c/h2>\n  \u003cp>Cât timp contul dumneavoastră este activ. Dacă îl ștergeți, datele dumneavoastră sunt eliminate definitiv și ireversibil din baza noastră de date; pot rămâne doar în copiile de rezervă, pe care le păstrăm cel mult 8 săptămâni și care sunt suprascrise periodic. Dacă contul rămâne fără activitate mai mult de 18 luni (calculate de la ultima dumneavoastră înregistrare în aplicație), îl ștergem pentru inactivitate. Datele de facturare ale abonamentelor se păstrează pe perioada impusă de reglementările fiscale și comerciale.\u003c/p>\n\n  \u003ch2>10. Drepturile dumneavoastră\u003c/h2>\n  \u003cp>Puteți accesa datele dumneavoastră, le puteți rectifica (editându-vă profilul), le puteți exporta (Setări → „Exportă-mi datele” și, dacă aveți modulul Culturism, „Descarcă datele mele de Culturism”), puteți solicita ștergerea lor (butonul „Șterge contul meu”), vă puteți opune prelucrării lor sau o puteți restricționa, puteți solicita portabilitatea lor și puteți retrage oricând consimțământul. Scrieți-ne la cestafitness@gmail.com și vă vom răspunde în termenul legal (o lună).\u003c/p>\n  \u003cp>Dacă considerați că nu v-am prelucrat corect datele, puteți depune o plângere la Agenția Spaniolă pentru Protecția Datelor (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Securitate\u003c/h2>\n  \u003cp>Comunicațiile sunt criptate, parolele sunt stocate criptat, iar fiecare utilizator poate accesa doar propriile date prin reguli de acces din baza de date. Dacă ar exista o încălcare a securității care vă afectează, v-am informa și am notifica autoritatea de supraveghere în termenele legale.\u003c/p>\n\n  \u003ch2>12. Minori\u003c/h2>\n  \u003cp>cesta. nu se adresează minorilor sub 18 ani și nu trebuie să creați un cont dacă nu aveți această vârstă. Dacă folosiți secțiunile Bebeluș sau Familie, datele minorilor pe care le introduceți sunt prelucrate sub responsabilitatea dumneavoastră în calitate de mamă, tată sau tutore legal și doar pentru a vă oferi aceste funcții.\u003c/p>\n\n  \u003ch2>13. Stocarea pe dispozitivul dumneavoastră (cookie-uri)\u003c/h2>\n  \u003cp>Nu folosim cookie-uri publicitare sau de urmărire. Stocăm pe dispozitivul dumneavoastră doar informații strict necesare funcționării aplicației: sesiunea, limba, preferințele și o copie pentru utilizarea fără conexiune. Din acest motiv, nu vă afișăm un aviz privind cookie-urile. Rapoartele de erori Sentry sunt tehnice și nu sunt folosite în scopuri publicitare.\u003c/p>\n\n  \u003ch2>13 bis. Modulul Culturism: date privind sănătatea cu protecție sporită\u003c/h2>\n  \u003cp>\u003cstrong>Ce date.\u003c/strong> Numai dacă te abonezi la modul și le introduci tu: numele substanței, calea de administrare, doza, data, frecvența și locul injectării, notele, timpul de înjumătățire indicat, inventarul tău (cantități și date de expirare), valorile analizelor tale și intervalele lor de referință, scorurile tale zilnice de stare de bine, data contractării și rapoartele medicale pe care le încarci. Sunt date privind sănătatea, o categorie specială în temeiul RGPD (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Temei juridic.\u003c/strong> Consimțământul tău explicit (art. 9 alin. (2) lit. a) RGPD), pe care îl dai bifând căsuța la contractare. Îl poți retrage oricând ștergându-ți datele din modul; retragerea nu afectează prelucrarea anterioară. Păstrăm ca dovadă data și versiunea textului pentru care ți-ai dat consimțământul.\u003c/p>\n  \u003cp>\u003cstrong>Scop și destinatari.\u003c/strong> Exclusiv pentru a-ți presta modulul (înregistrare, calendar, curbe și rapoarte). Nu le folosim pentru publicitate sau pentru crearea de profiluri, nu le vindem, iar antrenorii asociați, prietenii și Comunitatea nu le pot vedea. Chatul cu IA nu primește înregistrările tale; primește doar mesajele pe care le scrii în chat. Sunt stocate de Supabase în calitate de persoană împuternicită de operator; plățile sunt procesate de Stripe, care nu primește aceste date. Dacă menționezi o substanță în chat, textul respectiv este trimis furnizorului de IA care procesează chatul (Google Gemini); evită să scrii date pe care nu vrei să le partajezi.\u003c/p>\n  \u003cp>\u003cstrong>Securitate și păstrare.\u003c/strong> Tabele cu acces restricționat la utilizatorul tău și un spațiu de stocare privat pentru rapoartele tale, cu criptare în tranzit și în repaus. Se păstrează cât timp folosești modulul și până când le ștergi, sau până la 18 luni de inactivitate a contului. La ștergerea contului tău, se șterg și înregistrările și rapoartele tale medicale și se anulează orice abonament activ.\u003c/p>\n  \u003cp>\u003cstrong>Drepturile tale și minorii.\u003c/strong> Poți accesa, rectifica și șterge aceste date chiar din modul și poți exercita celelalte drepturi conform explicațiilor de la secțiunea 10. Modulul este interzis persoanelor sub 18 ani.\u003c/p>\n\n  \u003ch2>14. Avertisment privind sănătatea\u003c/h2>\n  \u003cp>cesta. nu este un dispozitiv medical și nu înlocuiește sfatul unui medic, nutriționist-dietetician sau antrenor. Dacă sunteți însărcinată, alăptați, aveți o boală sau urmați un tratament, consultați un specialist înainte de a vă schimba alimentația sau activitatea fizică. Calculele și estimările IA au caracter orientativ.\u003c/p>\n\n  \u003ch2>15. Modificări ale acestei politici\u003c/h2>\n  \u003cp>Dacă schimbăm ceva important, vă vom informa în aplicație din timp și, atunci când legea o cere, vă vom solicita din nou consimțământul.\u003c/p>\n\n  \u003ch2>16. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","el":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Τελευταία ενημέρωση: 25/09/2026\u003c/p>\n  \u003cp>\u003cstrong>Περίληψη:\u003c/strong> η cesta. επεξεργάζεται δεδομένα υγείας (βάρος, σωματικές μετρήσεις, προπονήσεις, καρδιακός ρυθμός), τα οποία ο ΓΚΠΔ θεωρεί ειδική κατηγορία δεδομένων. Τα χρησιμοποιούμε αποκλειστικά για να σου παρέχουμε την υπηρεσία, ποτέ για διαφήμιση ούτε για πώληση σε τρίτους.\u003c/p>\n\n  \u003ch2>1. Ποιος είναι ο υπεύθυνος επεξεργασίας\u003c/h2>\n  \u003cp>Υπεύθυνος επεξεργασίας των δεδομένων σου είναι ο/η \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Για οποιοδήποτε ζήτημα σχετικά με την ιδιωτικότητα, γράψε στο cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Ποια δεδομένα συλλέγουμε\u003c/h2>\n  \u003cp>\u003cstrong>Λογαριασμός και προφίλ:\u003c/strong> email, κωδικός πρόσβασης (αποθηκεύεται κρυπτογραφημένος), όνομα χρήστη, βάρος, ύψος, ηλικία, φύλο, επίπεδο δραστηριότητας, στόχος και γλώσσα.\u003c/p>\n  \u003cp>\u003cstrong>Υγεία και φυσική κατάσταση:\u003c/strong> ιστορικό βάρους και μετρήσεων, καταγεγραμμένα μενού και τρόφιμα, νηστεία, προπονήσεις (σετ, επαναλήψεις, βάρη, διαλείμματα), καρδιακός ρυθμός εφόσον συνδέσεις παλμογράφο, καθώς και βήματα, βάρος ή θερμίδες εφόσον εισαγάγεις δεδομένα από την εφαρμογή υγείας σου ή από το Health Connect. Εάν χρησιμοποιείς τις ενότητες Εγκυμοσύνη ή Μωρό, τα δεδομένα που καταχωρίζεις σε αυτές (εβδομάδα κύησης, ηλικία του μωρού, σημειώσεις).\u003c/p>\n  \u003cp>\u003cstrong>Φωτογραφίες και περιεχόμενο:\u003c/strong> οι φωτογραφίες που ανεβάζεις ή αναλύεις με τεχνητή νοημοσύνη, καθώς και τα μηνύματα συνομιλίας.\u003c/p>\n  \u003cp>\u003cstrong>Σχέση με προπονητές, φίλους και κοινότητα:\u003c/strong> αιτήματα, συνδέσεις και ό,τι μοιράζεσαι με αυτούς (βλ. ενότητα 5).\u003c/p>\n  \u003cp>\u003cstrong>Πρόγραμμα προσκλήσεων και συνεισφορών:\u003c/strong> ο κωδικός πρόσκλησής σου, οι χρήστες που προσκαλείς και τα τρόφιμα που συνεισφέρεις στη βάση δεδομένων.\u003c/p>\n  \u003cp>\u003cstrong>Τεχνικά δεδομένα και δεδομένα χρήσης:\u003c/strong> τύπος συσκευής και προγράμματος περιήγησης, διεύθυνση IP, γλώσσα, αρχεία καταγραφής σφαλμάτων της εφαρμογής και ένα βασικό αρχείο καταγραφής χρήσης (ποιες οθόνες ανοίγεις και σε ποιο βήμα της εγγραφής εγκαταλείπεις, χωρίς κανένα περιεχόμενο υγείας και χωρίς να περιλαμβάνεται η οθόνη της ενότητας Bodybuilding). Εάν έχεις συνδεθεί, αυτό το αρχείο καταγραφής χρήσης συσχετίζεται με τον χρήστη σου. Χρησιμεύουν ώστε η εφαρμογή να λειτουργεί, να διορθώνονται σφάλματα και να βελτιώνεται. Νομική βάση: το έννομο συμφέρον μας.\u003c/p>\n  \u003cp>\u003cstrong>Ειδοποιήσεις:\u003c/strong> εάν τις ενεργοποιήσεις, αποθηκεύουμε το τεχνικό αναγνωριστικό της συσκευής σου για να στέλνουμε τις ειδοποιήσεις. Εάν ενεργοποιήσεις επιπλέον την υπενθύμιση σερί, αποθηκεύουμε επίσης την ώρα που θα επιλέξεις, τη ζώνη ώρας σου, το τρέχον σερί σου και την ημερομηνία της τελευταίας καταγραφής σου, ώστε να μπορούμε να σε ειδοποιούμε εγκαίρως. Νομική βάση: η συγκατάθεσή σου (η άδεια που δίνεις στο πρόγραμμα περιήγησης ή στο κινητό σου και ο διακόπτης της υπενθύμισης), την οποία μπορείς να ανακαλέσεις ανά πάσα στιγμή απενεργοποιώντας τα.\u003c/p>\n  \u003cp>\u003cstrong>Πληρωμές:\u003c/strong> εάν επιλέξεις συνδρομητικό πρόγραμμα επί πληρωμή, η χρέωση διαχειρίζεται από τη Stripe. Δεν βλέπουμε ούτε αποθηκεύουμε τα στοιχεία της κάρτας σου· λαμβάνουμε μόνο την κατάσταση της συνδρομής σου.\u003c/p>\n\n  \u003ch2>3. Για ποιον σκοπό τα χρησιμοποιούμε και σε ποια νομική βάση\u003c/h2>\n  \u003cp>\u003cstrong>Παροχή της υπηρεσίας σε σένα\u003c/strong> (δημιουργία του λογαριασμού σου, υπολογισμός των στόχων σου σε θερμίδες και μακροθρεπτικά συστατικά, δημιουργία της λίστας αγορών σου, εμφάνιση της προόδου σου, διαχείριση της συνδρομής σου). Νομική βάση: η εκτέλεση της σύμβασης.\u003c/p>\n  \u003cp>\u003cstrong>Επεξεργασία των δεδομένων υγείας σου.\u003c/strong> Νομική βάση: η ρητή συγκατάθεσή σου, την οποία μας παρέχεις κατά τη δημιουργία του λογαριασμού και μπορείς να ανακαλέσεις ανά πάσα στιγμή διαγράφοντας τον λογαριασμό σου. Εάν δεν τη δώσεις, δεν μπορούμε να σου προσφέρουμε την υπηρεσία.\u003c/p>\n  \u003cp>\u003cstrong>Λειτουργίες τεχνητής νοημοσύνης\u003c/strong> (αναγνώριση τροφίμων σε φωτογραφία, συνομιλία διατροφής, περιλήψεις προόδου). Νομική βάση: η συγκατάθεσή σου κατά τη χρήση της λειτουργίας.\u003c/p>\n  \u003cp>\u003cstrong>Ασφάλεια, εποπτεία περιεχομένου και διόρθωση σφαλμάτων.\u003c/strong> Νομική βάση: το έννομο συμφέρον μας να διατηρούμε την εφαρμογή ασφαλή και σε λειτουργία.\u003c/p>\n  \u003cp>\u003cstrong>Νομικές υποχρεώσεις\u003c/strong> (τιμολόγηση, αιτήματα αρχών). Νομική βάση: η συμμόρφωση με νομική υποχρέωση.\u003c/p>\n  \u003cp>Δεν χρησιμοποιούμε ποτέ τα δεδομένα σου για διαφημιστικούς σκοπούς ούτε τα πουλάμε.\u003c/p>\n\n  \u003ch2>4. Αυτοματοποιημένες αποφάσεις και τεχνητή νοημοσύνη\u003c/h2>\n  \u003cp>Οι εκτιμήσεις της τεχνητής νοημοσύνης (θερμίδες ενός πιάτου, προτάσεις συνομιλίας) είναι ενδεικτικές και μπορεί να περιέχουν σφάλματα. Δεν λαμβάνονται αποφάσεις που παράγουν έννομα αποτελέσματα για σένα βασιζόμενες αποκλειστικά σε αυτοματοποιημένη επεξεργασία. Να ελέγχεις πάντα όσα σου προτείνει η τεχνητή νοημοσύνη.\u003c/p>\n\n  \u003ch2>5. Κοινότητα, φίλοι και προπονητές\u003c/h2>\n  \u003cp>Το προφίλ σου είναι \u003cstrong>ιδιωτικό από προεπιλογή\u003c/strong>. Εάν το κάνεις δημόσιο ή αποδεχτείς μια φιλία, το πρόσωπο αυτό βλέπει το όνομα χρήστη, τα μενού και τις φωτογραφίες σου.\u003c/p>\n  \u003cp>Εάν \u003cstrong>συνδεθείς με έναν προπονητή\u003c/strong>, αυτός θα μπορεί να βλέπει τις πληροφορίες που μοιράζεσαι μαζί του (για παράδειγμα την πρόοδό σου, τα μενού και τις προπονήσεις σου και τα μηνύματα συνομιλίας) ώστε να σε συμβουλεύει. Εσύ αποφασίζεις αν θα συνδεθείς και μπορείς να αποσυνδεθείς όποτε θελήσεις. Οι πληρωμές μεταξύ προπονητή και αθλητή γίνονται εκτός εφαρμογής και η cesta. δεν εμπλέκεται σε αυτές.\u003c/p>\n\n  \u003ch2>6. Ποιος άλλος λαμβάνει τα δεδομένα σου\u003c/h2>\n  \u003cp>Κοινοποιούμε μόνο τα αναγκαία δεδομένα σε παρόχους που ενεργούν για λογαριασμό μας (εκτελούντες την επεξεργασία):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — βάση δεδομένων, ταυτοποίηση, αποθήκευση φωτογραφιών και λειτουργίες διακομιστή.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — μόνο εάν χρησιμοποιείς την ανάλυση φωτογραφιών ή τη συνομιλία με τεχνητή νοημοσύνη, καθώς και για την αυτόματη εποπτεία των φωτογραφιών που ανεβάζεις (ενότητα 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — χρέωση συνδρομών.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — όταν αναζητάς ένα προϊόν με το όνομα ή τον γραμμωτό κωδικό του, η αναζήτηση αυτή αποστέλλεται για την άντληση των δεδομένων του.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — λαμβάνει τεχνικές αναφορές σφαλμάτων της εφαρμογής (διακομιστές στην Ευρωπαϊκή Ένωση).\u003c/p>\n  \u003cp>\u003cstrong>Φιλοξενία ιστού και δίκτυα διανομής περιεχομένου\u003c/strong> (Netlify ή GitHub Pages, jsDelivr, cdnjs) — διαθέτουν την εφαρμογή και τις βιβλιοθήκες της και, ως εκ τούτου, βλέπουν τη διεύθυνση IP σου.\u003c/p>\n  \u003cp>Οι σύνδεσμοι προς βίντεο τεχνικής ασκήσεων ανοίγουν μια εξωτερική μηχανή αναζήτησης (YouTube) μόνο όταν πατήσεις εσύ.\u003c/p>\n\n  \u003ch2>7. Διεθνείς διαβιβάσεις\u003c/h2>\n  \u003cp>Τα δεδομένα σου αποθηκεύονται σε διακομιστές της Supabase στο Λονδίνο (Ηνωμένο Βασίλειο), το οποίο διαθέτει απόφαση περί επάρκειας της Ευρωπαϊκής Επιτροπής. Η Google και η Stripe ενδέχεται να επεξεργάζονται δεδομένα εκτός του Ευρωπαϊκού Οικονομικού Χώρου (για παράδειγμα στις Ηνωμένες Πολιτείες), βασιζόμενες στο Πλαίσιο Προστασίας Δεδομένων ΕΕ–ΗΠΑ ή σε τυποποιημένες συμβατικές ρήτρες εγκεκριμένες από την Επιτροπή.\u003c/p>\n\n  \u003ch2>8. Εποπτεία περιεχομένου και φωτογραφιών\u003c/h2>\n  \u003cp>Κάθε φωτογραφία που ανεβάζεις —φωτογραφία προφίλ, προόδου, πιάτων, προϊόντων που συνεισφέρεις ή αποστέλλεται μέσω συνομιλίας— περνά από αυτόματο φίλτρο εποπτείας με τεχνητή νοημοσύνη (Google Gemini) πριν γίνει αποδεκτή.\u003c/p>\n  \u003cp>Απορρίπτουμε και δεν αποθηκεύουμε καμία εικόνα που περιέχει: γυμνό ή ρητό ή υπαινικτικό σεξουαλικό περιεχόμενο· γραφική βία ή ταραχώδες περιεχόμενο· σύμβολα ή μηνύματα μίσους, ρατσιστικά ή ομοφοβικά· ή οποιοδήποτε παράνομο περιεχόμενο, συμπεριλαμβανομένου κάθε περιεχομένου που θα μπορούσε να συνιστά σεξουαλική εκμετάλλευση ή κακοποίηση παιδιών. Εάν μια φωτογραφία απορριφθεί, το αρχείο απορρίπτεται και δεν αποθηκεύεται ποτέ.\u003c/p>\n  \u003cp>Η μηχανή αναζήτησης βίντεο τεχνικής επιτρέπει μόνο την αναζήτηση πραγματικών ονομάτων ασκήσεων από κλειστή λίστα· δεν αποστέλλει ποτέ ελεύθερο κείμενο χωρίς επαλήθευση.\u003c/p>\n  \u003cp>Εάν εντοπίσουμε ή μας αναφερθεί λογαριασμός που ανεβάζει κατ' επανάληψη απαγορευμένο περιεχόμενο, μπορούμε να τον αναστείλουμε ή να τον διαγράψουμε και να διατηρήσουμε τα αυστηρά απαραίτητα αποδεικτικά στοιχεία εφόσον ο νόμος μας υποχρεώνει να τα γνωστοποιήσουμε στις αρχές. Μπορείς να αναφέρεις ακατάλληλο περιεχόμενο από το «Αναφορά σφάλματος» στις ρυθμίσεις ή γράφοντας στο cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Για πόσο χρόνο διατηρούμε τα δεδομένα σου\u003c/h2>\n  \u003cp>Για όσο ο λογαριασμός σου παραμένει ενεργός. Εάν τον διαγράψεις, τα δεδομένα σου διαγράφονται οριστικά και αμετάκλητα από τη βάση δεδομένων μας· μπορούν να παραμείνουν μόνο στα αντίγραφα ασφαλείας, τα οποία διατηρούμε το πολύ 8 εβδομάδες και τα οποία αντικαθίστανται περιοδικά. Εάν ο λογαριασμός σου παραμείνει ανενεργός για περισσότερους από 18 μήνες (από την τελευταία καταχώριση στην εφαρμογή), τον διαγράφουμε λόγω αδράνειας. Τα στοιχεία τιμολόγησης των συνδρομών διατηρούνται για όσο χρόνο απαιτούν οι φορολογικοί και εμπορικοί κανόνες.\u003c/p>\n\n  \u003ch2>10. Τα δικαιώματά σου\u003c/h2>\n  \u003cp>Μπορείς να έχεις πρόσβαση στα δεδομένα σου, να τα διορθώνεις (επεξεργαζόμενος το προφίλ σου), να τα εξάγεις (Ρυθμίσεις → «Εξαγωγή των δεδομένων μου» και, εάν έχεις την ενότητα Bodybuilding, «Λήψη των δεδομένων μου Bodybuilding»), να ζητήσεις τη διαγραφή τους (κουμπί «Διαγραφή λογαριασμού»), να αντιταχθείς στην επεξεργασία ή να ζητήσεις τον περιορισμό της, να ζητήσεις τη φορητότητά τους και να ανακαλέσεις τη συγκατάθεσή σου ανά πάσα στιγμή. Γράψε μας στο cestafitness@gmail.com και θα σου απαντήσουμε εντός της νόμιμης προθεσμίας (ένας μήνας).\u003c/p>\n  \u003cp>Εάν θεωρείς ότι δεν επεξεργαστήκαμε σωστά τα δεδομένα σου, μπορείς να υποβάλεις καταγγελία στην Ισπανική Αρχή Προστασίας Δεδομένων (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Ασφάλεια\u003c/h2>\n  \u003cp>Οι επικοινωνίες είναι κρυπτογραφημένες, οι κωδικοί πρόσβασης αποθηκεύονται κρυπτογραφημένοι και κάθε χρήστης μπορεί να έχει πρόσβαση μόνο στα δικά του δεδομένα μέσω κανόνων πρόσβασης στη βάση δεδομένων. Σε περίπτωση παραβίασης της ασφάλειας που θα σε αφορούσε, θα σε ενημερώναμε και θα ειδοποιούσαμε την εποπτική αρχή εντός των νόμιμων προθεσμιών.\u003c/p>\n\n  \u003ch2>12. Ανήλικοι\u003c/h2>\n  \u003cp>Η cesta. δεν απευθύνεται σε ανηλίκους κάτω των 18 ετών και δεν πρέπει να δημιουργήσεις λογαριασμό εάν δεν έχεις συμπληρώσει αυτή την ηλικία. Εάν χρησιμοποιείς τις ενότητες Μωρό ή Οικογένεια, τα δεδομένα ανηλίκων που εισάγεις τα επεξεργαζόμαστε υπό την ευθύνη σου ως μητέρας, πατέρα ή νόμιμου κηδεμόνα και μόνο για να σου προσφέρουμε τις λειτουργίες αυτές.\u003c/p>\n\n  \u003ch2>13. Αποθήκευση στη συσκευή σου (cookies)\u003c/h2>\n  \u003cp>Δεν χρησιμοποιούμε cookies διαφήμισης ή παρακολούθησης. Αποθηκεύουμε στη συσκευή σου μόνο πληροφορίες που είναι απολύτως απαραίτητες για τη λειτουργία της εφαρμογής: τη συνεδρία σου, τη γλώσσα, τις προτιμήσεις σου και ένα αντίγραφο για χρήση χωρίς σύνδεση. Γι' αυτό δεν σου εμφανίζουμε ειδοποίηση για cookies. Οι αναφορές σφαλμάτων της Sentry είναι τεχνικές και δεν χρησιμοποιούνται για διαφήμιση.\u003c/p>\n\n  \u003ch2>13 bis. Ενότητα Bodybuilding: ενισχυμένα δεδομένα υγείας\u003c/h2>\n  \u003cp>\u003cstrong>Ποια δεδομένα.\u003c/strong> Μόνο εφόσον συνάψεις τη συνδρομή στην ενότητα και τα καταχωρίσεις εσύ: όνομα ουσίας, οδός χορήγησης, δόση, ημερομηνία, συχνότητα και σημείο ένεσης, σημειώσεις, ο αναφερόμενος χρόνος ημιζωής, το απόθεμά σου (ποσότητες και ημερομηνίες λήξης), οι τιμές των εξετάσεών σου και τα εύρη αναφοράς τους, οι βαθμολογίες καθημερινής ευεξίας, η ημερομηνία σύναψης της συνδρομής και οι ιατρικές εκθέσεις που ανεβάζεις. Πρόκειται για δεδομένα υγείας, ειδική κατηγορία του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) (άρθρο 9).\u003c/p>\n  \u003cp>\u003cstrong>Νομική βάση.\u003c/strong> Η ρητή συγκατάθεσή σας (άρθρο 9 παρ. 2 στοιχ. α) ΓΚΠΔ), την οποία παρέχετε επιλέγοντας το πλαίσιο κατά τη σύναψη της συνδρομής. Μπορείτε να την ανακαλέσετε οποιαδήποτε στιγμή διαγράφοντας τα δεδομένα σας από την ενότητα· η ανάκληση δεν επηρεάζει την προηγούμενη επεξεργασία. Φυλάσσουμε την ημερομηνία και την έκδοση του κειμένου για το οποίο συναινέσατε, ως απόδειξη.\u003c/p>\n  \u003cp>\u003cstrong>Σκοπός και αποδέκτες.\u003c/strong> Μόνο για την παροχή της ενότητας προς εσάς (καταγραφή, ημερολόγιο, καμπύλες και εκθέσεις). Δεν τα χρησιμοποιούμε για διαφήμιση ή κατάρτιση προφίλ, δεν τα πουλάμε και δεν τα βλέπουν συνδεδεμένοι προπονητές, φίλοι ή η Κοινότητα. Η συνομιλία με ΤΝ δεν λαμβάνει τις καταγραφές σας· λαμβάνει μόνο τα μηνύματα που πληκτρολογείτε στη συνομιλία. Αποθηκεύονται από την Supabase ως εκτελούσα την επεξεργασία· οι πληρωμές διεκπεραιώνονται από την Stripe, η οποία δεν λαμβάνει αυτά τα δεδομένα. Αν αναφέρεις μια ουσία στη συνομιλία, το κείμενο αυτό αποστέλλεται στον πάροχο ΤΝ που επεξεργάζεται τη συνομιλία (Google Gemini)· απόφυγε να γράφεις δεδομένα που δεν θέλεις να μοιραστείς.\u003c/p>\n  \u003cp>\u003cstrong>Ασφάλεια και διατήρηση.\u003c/strong> Πίνακες με πρόσβαση περιορισμένη στον χρήστη σας και ιδιωτικός χώρος αποθήκευσης για τις εκθέσεις σας, με κρυπτογράφηση κατά τη μετάδοση και κατά την αποθήκευση. Διατηρούνται όσο χρησιμοποιείτε την ενότητα και μέχρι να τα διαγράψετε, ή έως 18 μήνες αδράνειας του λογαριασμού. Όταν διαγράφετε τον λογαριασμό σας, διαγράφονται επίσης οι καταγραφές και οι ιατρικές εκθέσεις σας και ακυρώνεται κάθε ενεργή συνδρομή.\u003c/p>\n  \u003cp>\u003cstrong>Τα δικαιώματά σας και οι ανήλικοι.\u003c/strong> Μπορείτε να έχετε πρόσβαση, να διορθώνετε και να διαγράφετε αυτά τα δεδομένα από την ίδια την ενότητα και να ασκείτε τα υπόλοιπα δικαιώματά σας όπως εξηγείται στην ενότητα 10. Η ενότητα απαγορεύεται σε άτομα κάτω των 18 ετών.\u003c/p>\n\n  \u003ch2>14. Ειδοποίηση για την υγεία\u003c/h2>\n  \u003cp>Η cesta. δεν αποτελεί ιατροτεχνολογικό προϊόν ούτε υποκαθιστά τη συμβουλή γιατρού, διαιτολόγου-διατροφολόγου ή προπονητή. Εάν είσαι έγκυος, θηλάζεις, έχεις κάποια νόσο ή ακολουθείς θεραπεία, συμβουλεύσου έναν επαγγελματία πριν αλλάξεις τη διατροφή ή τη σωματική σου δραστηριότητα. Οι υπολογισμοί και οι εκτιμήσεις της τεχνητής νοημοσύνης είναι ενδεικτικοί.\u003c/p>\n\n  \u003ch2>15. Αλλαγές στην παρούσα πολιτική\u003c/h2>\n  \u003cp>Εάν αλλάξουμε κάτι σημαντικό, θα σε ενημερώσουμε εκ των προτέρων μέσα στην εφαρμογή και, όταν το απαιτεί ο νόμος, θα ζητήσουμε ξανά τη συγκατάθεσή σου.\u003c/p>\n\n  \u003ch2>16. Επικοινωνία\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","sv":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Senast uppdaterad: 2026-09-25\u003c/p>\n  \u003cp>\u003cstrong>Sammanfattning:\u003c/strong> cesta. behandlar hälsouppgifter (vikt, kroppsmått, träningspass, hjärtfrekvens), som GDPR anser vara en särskild kategori av personuppgifter. Vi använder dem endast för att tillhandahålla tjänsten till dig, aldrig för reklam och aldrig för att sälja dem till tredje part.\u003c/p>\n\n  \u003ch2>1. Vem är personuppgiftsansvarig\u003c/h2>\n  \u003cp>Personuppgiftsansvarig för dina uppgifter är \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). För alla frågor om integritet, skriv till cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>2. Vilka uppgifter vi samlar in\u003c/h2>\n  \u003cp>\u003cstrong>Konto och profil:\u003c/strong> e-postadress, lösenord (lagras krypterat), användarnamn, vikt, längd, ålder, kön, aktivitetsnivå, mål och språk.\u003c/p>\n  \u003cp>\u003cstrong>Hälsa och fysisk kondition:\u003c/strong> historik över vikt och mått, registrerade menyer och livsmedel, fasta, träningspass (set, repetitioner, vikter, vila), hjärtfrekvens om du ansluter en pulsmätare, samt steg, vikt eller kalorier om du importerar data från din hälsoapp eller från Health Connect. Om du använder avsnitten Graviditet eller Bebis, de uppgifter du skriver in där (graviditetsvecka, bebisens ålder, anteckningar).\u003c/p>\n  \u003cp>\u003cstrong>Foton och innehåll:\u003c/strong> de foton du laddar upp eller analyserar med artificiell intelligens samt chattmeddelanden.\u003c/p>\n  \u003cp>\u003cstrong>Relationen till tränare, vänner och community:\u003c/strong> förfrågningar, kopplingar och det du delar med dem (se avsnitt 5).\u003c/p>\n  \u003cp>\u003cstrong>Inbjudnings- och bidragsprogram:\u003c/strong> din inbjudningskod, de användare du bjuder in och de livsmedel du bidrar med till databasen.\u003c/p>\n  \u003cp>\u003cstrong>Tekniska uppgifter och användningsdata:\u003c/strong> typ av enhet och webbläsare, IP-adress, språk, felloggar från appen och en grundläggande användningslogg (vilka skärmar du öppnar och vid vilket steg i registreringen du avbryter, utan något hälsoinnehåll och utan skärmen för modulen Bodybuilding). Om du har loggat in kopplas användningsloggen till din användare. De används för att appen ska fungera, för att åtgärda fel och för att förbättra den. Rättslig grund: vårt berättigade intresse.\u003c/p>\n  \u003cp>\u003cstrong>Aviseringar:\u003c/strong> om du aktiverar dem sparar vi enhetens tekniska identifierare för att kunna skicka dem till dig. Om du dessutom aktiverar påminnelsen om streak sparar vi även den tid du väljer, din tidszon, din aktuella streak och datumet för din senaste registrering, så att vi kan påminna dig i tid. Rättslig grund: ditt samtycke (tillståndet du ger i din webbläsare eller mobil samt påminnelsens reglage), som du när som helst kan återkalla genom att stänga av dem.\u003c/p>\n  \u003cp>\u003cstrong>Betalningar:\u003c/strong> om du tecknar en betald plan hanteras betalningen av Stripe. Vi ser eller lagrar inte dina kortuppgifter; vi tar bara emot status för din prenumeration.\u003c/p>\n\n  \u003ch2>3. Vad vi använder dem till och på vilken rättslig grund\u003c/h2>\n  \u003cp>\u003cstrong>Tillhandahålla tjänsten till dig\u003c/strong> (skapa ditt konto, beräkna dina mål för kalorier och makronutrienter, ta fram din inköpslista, visa dina framsteg, hantera din prenumeration). Rättslig grund: fullgörande av avtal.\u003c/p>\n  \u003cp>\u003cstrong>Behandla dina hälsouppgifter.\u003c/strong> Rättslig grund: ditt uttryckliga samtycke, som du lämnar när du skapar kontot och som du när som helst kan återkalla genom att radera ditt konto. Om du inte lämnar det kan vi inte erbjuda dig tjänsten.\u003c/p>\n  \u003cp>\u003cstrong>Funktioner med artificiell intelligens\u003c/strong> (identifiera livsmedel på ett foto, näringschatt, sammanfattningar av framsteg). Rättslig grund: ditt samtycke när du använder funktionen.\u003c/p>\n  \u003cp>\u003cstrong>Säkerhet, innehållsmoderering och felavhjälpning.\u003c/strong> Rättslig grund: vårt berättigade intresse av att hålla appen säker och i drift.\u003c/p>\n  \u003cp>\u003cstrong>Rättsliga skyldigheter\u003c/strong> (fakturering, begäranden från myndigheter). Rättslig grund: fullgörande av en rättslig förpliktelse.\u003c/p>\n  \u003cp>Vi använder aldrig dina uppgifter för reklamändamål och vi säljer dem aldrig.\u003c/p>\n\n  \u003ch2>4. Automatiserade beslut och artificiell intelligens\u003c/h2>\n  \u003cp>AI:ns uppskattningar (kalorier i en maträtt, chattförslag) är vägledande och kan innehålla fel. Inga beslut som har rättsliga följder för dig fattas enbart på grundval av automatiserad behandling. Kontrollera alltid det som AI:n föreslår.\u003c/p>\n\n  \u003ch2>5. Community, vänner och tränare\u003c/h2>\n  \u003cp>Din profil är \u003cstrong>privat som standard\u003c/strong>. Om du gör den offentlig eller accepterar en vänförfrågan ser den personen ditt användarnamn, dina menyer och dina foton.\u003c/p>\n  \u003cp>Om du \u003cstrong>kopplar dig till en tränare\u003c/strong> kan tränaren se den information du delar med denne (till exempel dina framsteg, dina menyer och träningspass samt chattmeddelandena) för att kunna ge dig råd. Det är du som bestämmer om du vill koppla dig, och du kan avsluta kopplingen när du vill. Betalningar mellan tränare och atlet sker utanför appen och cesta. är inte part i dem.\u003c/p>\n\n  \u003ch2>6. Vilka andra som tar emot dina uppgifter\u003c/h2>\n  \u003cp>Vi delar bara nödvändiga uppgifter med leverantörer som agerar på våra vägnar (personuppgiftsbiträden):\u003c/p>\n  \u003cp>\u003cstrong>Supabase\u003c/strong> — databas, autentisering, lagring av foton och serverfunktioner.\u003c/p>\n  \u003cp>\u003cstrong>Google (Gemini)\u003c/strong> — endast om du använder fotoanalysen eller chatten med AI, samt för automatisk moderering av de foton du laddar upp (avsnitt 8).\u003c/p>\n  \u003cp>\u003cstrong>Stripe\u003c/strong> — betalning av prenumerationer.\u003c/p>\n  \u003cp>\u003cstrong>Open Food Facts\u003c/strong> — när du söker efter en produkt på namn eller streckkod skickas sökningen dit för att hämta produktens uppgifter.\u003c/p>\n  \u003cp>\u003cstrong>Sentry\u003c/strong> — tar emot tekniska felrapporter från appen (servrar inom Europeiska unionen).\u003c/p>\n  \u003cp>\u003cstrong>Webbhotell och innehållsleveransnätverk\u003c/strong> (Netlify eller GitHub Pages, jsDelivr, cdnjs) — levererar appen och dess bibliotek och ser därigenom din IP-adress.\u003c/p>\n  \u003cp>Länkarna till tekniska videor för övningar öppnar en extern sökmotor (YouTube) endast när du själv trycker på dem.\u003c/p>\n\n  \u003ch2>7. Internationella överföringar\u003c/h2>\n  \u003cp>Dina uppgifter lagras på Supabase-servrar i London (Storbritannien), som omfattas av ett beslut om adekvat skyddsnivå från Europeiska kommissionen. Google och Stripe kan behandla uppgifter utanför Europeiska ekonomiska samarbetsområdet (till exempel i USA), med stöd av EU–USA-ramverket för dataskydd eller av standardavtalsklausuler som godkänts av kommissionen.\u003c/p>\n\n  \u003ch2>8. Moderering av innehåll och foton\u003c/h2>\n  \u003cp>Varje fotografi du laddar upp — profilfoto, framstegsfoto, foto av maträtter, av produkter du bidrar med eller som skickas via chatten — passerar ett automatiskt modereringsfilter med artificiell intelligens (Google Gemini) innan det godtas.\u003c/p>\n  \u003cp>Vi avvisar och lagrar ingen bild som innehåller: nakenhet eller explicit eller antydande sexuellt innehåll; grovt våld eller störande innehåll; hatsymboler eller hatiska, rasistiska eller homofobiska budskap; eller något olagligt innehåll, inklusive innehåll som kan utgöra sexuell exploatering eller sexuella övergrepp mot barn. Om ett foto avvisas kasseras filen och den lagras aldrig.\u003c/p>\n  \u003cp>Sökmotorn för tekniska videor tillåter endast sökning på verkliga övningsnamn ur en sluten lista; den skickar aldrig fritext utan kontroll.\u003c/p>\n  \u003cp>Om vi upptäcker, eller får rapporterat till oss, att ett konto upprepade gånger laddar upp förbjudet innehåll kan vi stänga av eller radera kontot och bevara den bevisning som är absolut nödvändig om lagen kräver att vi anmäler den till myndigheterna. Du kan rapportera olämpligt innehåll via ”Rapportera ett fel” i inställningarna eller genom att skriva till cestafitness@gmail.com.\u003c/p>\n\n  \u003ch2>9. Hur länge vi behåller dina uppgifter\u003c/h2>\n  \u003cp>Så länge ditt konto är aktivt. Om du raderar det tas dina uppgifter bort permanent och oåterkalleligt från vår databas; de kan endast finnas kvar i säkerhetskopior, som vi sparar i högst 8 veckor och som skrivs över med jämna mellanrum. Om ditt konto är inaktivt i mer än 18 månader (räknat från din senaste registrering i appen) raderar vi det på grund av inaktivitet. Faktureringsuppgifter för prenumerationer sparas så länge skatte- och bokföringslagstiftningen kräver.\u003c/p>\n\n  \u003ch2>10. Dina rättigheter\u003c/h2>\n  \u003cp>Du kan få tillgång till dina uppgifter, få dem rättade (genom att redigera din profil), exportera dem (Inställningar → ”Exportera min data” och, om du har modulen Bodybuilding, ”Ladda ner mina Bodybuilding-uppgifter”), begära radering (knappen ”Ta bort mitt konto”), göra invändningar mot eller begära begränsning av behandlingen, begära dataportabilitet och när som helst återkalla ditt samtycke. Skriv till oss på cestafitness@gmail.com så svarar vi inom den lagstadgade fristen (en månad).\u003c/p>\n  \u003cp>Om du anser att vi har behandlat dina uppgifter felaktigt kan du lämna in ett klagomål till den spanska dataskyddsmyndigheten (Agencia Española de Protección de Datos, www.aepd.es).\u003c/p>\n\n  \u003ch2>11. Säkerhet\u003c/h2>\n  \u003cp>Kommunikationen är krypterad, lösenorden lagras krypterade och varje användare kan endast komma åt sina egna uppgifter genom åtkomstregler i databasen. Om en säkerhetsincident som berör dig skulle inträffa skulle vi underrätta dig och meddela tillsynsmyndigheten inom de lagstadgade fristerna.\u003c/p>\n\n  \u003ch2>12. Minderåriga\u003c/h2>\n  \u003cp>cesta. riktar sig inte till personer under 18 år och du ska inte skapa ett konto om du inte har fyllt 18. Om du använder avsnitten Bebis eller Familj behandlar vi de uppgifter om minderåriga som du anger på ditt ansvar som mamma, pappa eller vårdnadshavare, och endast för att erbjuda dig dessa funktioner.\u003c/p>\n\n  \u003ch2>13. Lagring på din enhet (cookies)\u003c/h2>\n  \u003cp>Vi använder inga reklam- eller spårningscookies. Vi lagrar på din enhet endast information som är absolut nödvändig för att appen ska fungera: din session, språket, dina inställningar och en kopia för användning offline. Därför visar vi ingen cookiebanner. Felrapporterna från Sentry är tekniska och används inte för reklam.\u003c/p>\n\n  \u003ch2>13 bis. Modulen Bodybuilding: förstärkt skydd för hälsouppgifter\u003c/h2>\n  \u003cp>\u003cstrong>Vilka uppgifter.\u003c/strong> Endast om du tecknar modulen och själv för in dem: substansens namn, administreringssätt, dos, datum, frekvens och injektionsställe, anteckningar, den angivna halveringstiden, ditt lager (mängder och utgångsdatum), värdena från dina laboratorieprover och deras referensintervall, dina betyg för dagligt välmående, teckningsdatum och de läkarrapporter du laddar upp. Det är hälsouppgifter, en särskild kategori enligt dataskyddsförordningen (GDPR) (art. 9).\u003c/p>\n  \u003cp>\u003cstrong>Rättslig grund.\u003c/strong> Ditt uttryckliga samtycke (art. 9.2 a GDPR), som du lämnar genom att kryssa i rutan när du tecknar modulen. Du kan när som helst återkalla det genom att radera dina uppgifter i modulen; återkallelsen påverkar inte tidigare behandling. Vi sparar datumet och versionen av den text du samtyckte till som bevis.\u003c/p>\n  \u003cp>\u003cstrong>Ändamål och mottagare.\u003c/strong> Endast för att tillhandahålla modulen (logg, kalender, kurvor och rapporter). Vi använder dem inte för reklam eller profilering, vi säljer dem inte och länkade tränare, vänner och Communityn ser dem inte. AI-chatten får inte dina registreringar; den får bara de meddelanden du skriver i chatten. Supabase lagrar dem som personuppgiftsbiträde; betalningarna hanteras av Stripe, som inte tar emot dessa uppgifter. Om du nämner ett ämne i chatten skickas den texten till den AI-leverantör som behandlar chatten (Google Gemini); skriv inte in uppgifter du inte vill dela.\u003c/p>\n  \u003cp>\u003cstrong>Säkerhet och lagring.\u003c/strong> Tabeller med åtkomst begränsad till din användare och ett privat lager för dina rapporter, med kryptering under överföring och i vila. De sparas så länge du använder modulen och tills du raderar dem, eller upp till 18 månaders inaktivitet på kontot. När du raderar ditt konto raderas även dina registreringar och läkarrapporter och all aktiv prenumeration avslutas.\u003c/p>\n  \u003cp>\u003cstrong>Dina rättigheter och minderåriga.\u003c/strong> Du kan få tillgång till, rätta och radera dessa uppgifter i själva modulen och utöva dina övriga rättigheter enligt avsnitt 10. Modulen är förbjuden för personer under 18 år.\u003c/p>\n\n  \u003ch2>14. Hälsoinformation\u003c/h2>\n  \u003cp>cesta. är inte en medicinteknisk produkt och ersätter inte råd från läkare, dietist eller tränare. Om du är gravid, ammar, har en sjukdom eller genomgår en behandling ska du rådfråga en yrkesperson innan du ändrar din kost eller din fysiska aktivitet. Beräkningarna och AI:ns uppskattningar är vägledande.\u003c/p>\n\n  \u003ch2>15. Ändringar i denna policy\u003c/h2>\n  \u003cp>Om vi ändrar något väsentligt meddelar vi dig i förväg i appen och, när lagen kräver det, ber vi om ditt samtycke på nytt.\u003c/p>\n\n  \u003ch2>16. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","da":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Senest opdateret: 25.09.2026\u003c/p>\n  \u003cp>\u003cstrong>Resumé:\u003c/strong> cesta. behandler helbredsoplysninger (vægt, kropsmål, træning, hjertefrekvens), som GDPR betragter som en særlig kategori af personoplysninger. Vi bruger dem kun til at levere tjenesten til dig, aldrig til reklame og aldrig til at sælge dem til tredjeparter.\u003c/p>\n\n  \u003ch2>1. Hvem er dataansvarlig\u003c/h2>\n  \u003cp>Den dataansvarlige for dine oplysninger er \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Skriv til cestafitness@gmail.com, hvis du har spørgsmål om privatlivets fred.\u003c/p>\n\n  \u003ch2>2. Hvilke oplysninger vi indsamler\u003c/h2>\n  \u003cp>\u003cstrong>Konto og profil:\u003c/strong> e-mail, adgangskode (gemmes krypteret), brugernavn, vægt, højde, alder, køn, aktivitetsniveau, mål og sprog.\u003c/p>\n  \u003cp>\u003cstrong>Helbred og fysisk form:\u003c/strong> historik over vægt og mål, registrerede menuer og fødevarer, faste, træning (sæt, gentagelser, vægte, hvil), hjertefrekvens,
