līgo intelektu, neierobežotu datu eksportu, Cheat meals, Grūtniecību, Mazuli, ieteicamo treniņu, izmēru uzskaiti un prioritāru atbalstu.\u003c/p>\n  \u003cp>\u003cstrong>Ģimenes pamata\u003c/strong> — 4,99 €/mēnesī. Līdz 4 profiliem ar vienu e-pastu un paroli, katram ar savu svaru, ēdienreizēm un treniņiem neatkarīgi no pārējiem, ar Bezmaksas līmeni. \u003cstrong>Ģimenes premium\u003c/strong> — 12,99 €/mēnesī: tas pats, bet visiem 4 profiliem ir pilns Premium.\u003c/p>\n  \u003cp>\u003cstrong>Treneris\u003c/strong> — 9,99 €/mēnesī vai 59,99 €/gadā, ar 7 dienu bezmaksas izmēģinājumu. Tas ir atsevišķs plāns, kas ietver visu no Premium un sadaļu „Mani sportisti” sportistu konsultēšanai: ēdienkaršu un treniņu ieteikšana, viņu progresa apskate un tērzēšana ar viņiem.\u003c/p>\n  \u003cp>Ko ietver katrs plāns, vienmēr ir redzams lietotnē (ekrāns „Uzlabo savu plānu”), un tas var mainīties. Piemērojamie nodokļi tiek parādīti pirms samaksas. „Prioritārs atbalsts” nozīmē, ka tava ziņa tiek izskatīta pirms bezmaksas kontu ziņām, bez garantēta atbildes laika.\u003c/p>\n\n  \u003ch2>7 bis. Muskuļu veidošanas modulis (atsevišķs abonements)\u003c/h2>\n  \u003cp>\u003cstrong>Kas tas ir.\u003c/strong> Muskuļu veidošanas modulis ir personīgās uzskaites un izsekošanas rīks: tu atzīmē to, ko jau esi izlēmis lietot (kopā ar savu ārstu vai pats), un cesta. to sakārto kalendārā un uzzīmē orientējošas līknes. Līknes ir matemātiski aprēķini, kuros izmantots tavs norādītais pussabrukšanas periods vai orientējoša vērtība no publiskiem avotiem; tās nemēra tavu faktisko līmeni asinīs un var būt neprecīzas.\u003c/p>\n  \u003cp>\u003cstrong>Kas tas nav.\u003c/strong> cesta. nesniedz medicīniskus padomus, diagnozi vai ārstēšanu un neiesaka, neizraksta, neaprēķina, nekoriģē un nepiedāvā vielas, devas vai shēmas. Tā nepārdod, nepiegādā un nepalīdz iegūt nekādas vielas, neveicina to lietošanu un neaizstāj veselības aprūpes speciālistu. Daudzas vielas ir recepšu zāles, kuru iegāde un lietošana bez ārsta uzraudzības var būt nelikumīga un bīstama tavai veselībai; tu viens pats esi atbildīgs par piemērojamo tiesību aktu ievērošanu un par saviem lēmumiem. Ja tev rodas trauksmes simptomi, vērsies pie ārsta vai zvani uz 112.\u003c/p>\n  \u003cp>\u003cstrong>Tikai pilngadīgajiem (18+).\u003c/strong> Tev jābūt vismaz 18 gadus vecam, un tu to apstiprini, noformējot abonementu. Mēs varam apturēt moduļa darbību, ja konstatējam, ka to izmanto nepilngadīgais vai ka tas tiek izmantots pretēji šiem noteikumiem.\u003c/p>\n  \u003cp>\u003cstrong>Cena un samaksa.\u003c/strong> 10 €/mēnesī (ieskaitot nodokļus vai norādot tos pirms samaksas); abonements ir neatkarīgs no tava plāna (Bezmaksas, Premium, Ģimenes vai Trenera) un bez bezmaksas izmēģinājuma perioda. Tas tiek atjaunots automātiski katru mēnesi, līdz tu to atcel. Maksājumu apstrādā Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Atteikšanās un atcelšana.\u003c/strong> Noformējot abonementu, tu lūdz, lai pakalpojums sāktos nekavējoties. Kā patērētājam tev ir 14 dienas, lai atteiktos no līguma; ja to izdarīsi pēc moduļa izmantošanas, tev būs jāsamaksā par jau izmantotā pakalpojuma proporcionālo daļu. Abonementu vari atcelt jebkurā laikā pašā modulī („Pārvaldīt vai atcelt abonementu” poga); atcelšana stājas spēkā apmaksātā perioda beigās, un abonements vairs netiek atjaunots. Lai atteiktos no līguma, izmanto moduļa pogu „Izmantot savas atteikuma tiesības” vai raksti mums uz kontaktu e-pastu.\u003c/p>\n  \u003cp>\u003cstrong>Tavi dati.\u003c/strong> Dati, ko reģistrē, pieder tev: tu vari tos visus izdzēst jebkurā laikā ar „Dzēst visus manus Muskuļu veidošanas datus” un lejupielādēt ar „Lejupielādēt manus Muskuļu veidošanas datus”. Atceļot abonementu, tie tiek saglabāti, līdz tu tos izdzēsīsi, ja vien konts nav bijis neaktīvs 18 mēnešus. Neviena cita persona (treneri, draugi, Kopiena) šos datus neredz. Sīkāka informācija ir Privātuma politikā.\u003c/p>\n  \u003cp>\u003cstrong>MI tērzēšana.\u003c/strong> Ja modulis ir aktīvs, tērzēšana var sakārtot kalendārā to, ko tu tai pastāstīsi, taču pēc savas iniciatīvas tā nepiedāvā vielas, devas vai shēmas.\u003c/p>\n  \u003cp>\u003cstrong>Nav ārsta un pacienta attiecību; konsultējies ar speciālistu.\u003c/strong> Moduļa lietošana neizveido ārsta un pacienta attiecības. Pirms sāc, maini vai pārtrauc jebkādu medikamentu, uztura bagātinātāju vai shēmu, konsultējies ar kvalificētu veselības aprūpes speciālistu. Tu esi atbildīgs par saviem lēmumiem un ar tiem saistītajiem riskiem. cesta. neatbalsta nevienas vielas lietošanu ārpus atļautā.\u003c/p>\n  \u003cp>\u003cstrong>Likumība un pieejamība.\u003c/strong> Daudzas no vielām, ko vari reģistrēt, nav atļautas lietošanai cilvēkiem visās valstīs vai tiek likumīgi pārdotas tikai pēc receptes vai pētniecības nolūkiem. Mēs neapgalvojam, ka modulis, tā vielu saraksts vai saturs ir piemērots, likumīgs vai pieejams tavā valstī: tu esi atbildīgs par vietējo tiesību aktu ievērošanu. Vielu saraksts kalpo tikai tam, lai tās izvēlētos pēc nosaukuma, un nenozīmē, ka cesta. tās apstiprina vai iesaka.\u003c/p>\n  \u003cp>\u003cstrong>Precizitāte, MI un ārkārtas situācijas.\u003c/strong> Dati un līknes balstās uz to, ko tu ievadi, un uz aplēsēm, kuras mēs nepārbaudām, un var būt neprecīzi vai nepilnīgi. MI atbildes tiek ģenerētas automātiski un var saturēt kļūdas. Medicīniskas ārkārtas situācijas vai nopietnu simptomu gadījumā nepaļaujies uz lietotni: zvani uz 112 (vai savas valsts neatliekamās palīdzības numuru) vai vērsies pie ārsta.\u003c/p>\n  \u003cp>\u003cstrong>Atbildība.\u003c/strong> Likumā atļautajā apmērā cesta. neatbild par zaudējumiem, kas izriet no taviem lēmumiem par vielām vai ārstēšanu, kuri pieņemti, pamatojoties uz lietotnes informāciju. Tas neierobežo tiesības, ko likums tev piešķir kā patērētājam, kā arī mūsu atbildību par tīšu nodarījumu, rupju neuzmanību, nāvi vai miesas bojājumiem, kas radušies mūsu vainas dēļ.\u003c/p>\n  \u003cp>\u003cstrong>Apturēšana.\u003c/strong> Mēs varam apturēt vai atcelt moduli, ja konstatējam lietošanu, kas ir pretrunā šiem noteikumiem (piemēram, lietošanu nepilngadīgo vidū, vielu pārdošanu vai reklamēšanu vai identitātes uzdošanu par citu personu), atmaksājot samaksātā, bet neizmantotā perioda proporcionālo daļu.\u003c/p>\n\n  \u003ch2>8. Maksājumi, bezmaksas izmēģinājums, atjaunošana un atcelšana\u003c/h2>\n  \u003cp>Maksājumi tiek droši apstrādāti, izmantojot Stripe; mēs nekad neredzam un neglabājam tavas kartes datus. Abonementi tiek automātiski atjaunoti katra perioda (mēneša vai gada) beigās, ja tu tos iepriekš neatcel. Ja atceli bezmaksas izmēģinājuma laikā, tev nekas netiek iekasēts.\u003c/p>\n  \u003cp>Jebkurā laikā vari atcelt, mainīt plānu vai atjaunināt maksājuma veidu, izmantojot pogu „Pārvaldīt” blakus savam plānam, kas aizved uz drošo Stripe portālu. Ja atceli, Premium piekļuve tev saglabājas līdz jau apmaksātā perioda beigām. Ja maksājums neizdodas, Stripe dažas dienas mēģinās iekasēt maksu vēlreiz; ja to joprojām nevar iekasēt, tavs konts pāries uz plānu Bezmaksas, kamēr atjaunosi maksājuma veidu.\u003c/p>\n  \u003cp>\u003cstrong>Atteikuma tiesības.\u003c/strong> Ja esi patērētājs, tev ir tiesības atteikties no līguma 14 kalendāro dienu laikā no tā noslēgšanas (no izmēģinājuma vai maksājuma sākuma), nenorādot iemeslu, rakstot uz cestafitness@gmail.com. Tā kā digitālais pakalpojums pēc tava pieprasījuma sākas nekavējoties, atteikuma gadījumā tev būs jāsamaksā proporcionāla daļa par pakalpojumu, ko līdz tam esi saņēmis. Ārpus šīm likumā noteiktajām tiesībām par jau pagājušo laiku atmaksas nav, ja vien piemērojamie tiesību akti to neprasa.\u003c/p>\n\n  \u003ch2>9. Uzaicinājumu un atlaižu programma\u003c/h2>\n  \u003cp>\u003cstrong>Draugu aicināšana.\u003c/strong> Kad personas, kas reģistrējas ar tavu kodu, noslēdz maksas plānu, tavs maksas abonements saņem atlaidi atkarībā no tā, cik no šīm personām šajā brīdī maksā: 5 personas, 10 %; 10 personas, 20 %; 15 personu, 30 %; 20 personu, 40 %; 30 personu, 50 %. Lai to saņemtu, tev jābūt savam aktīvam maksas abonementam. Atlaide tiek pārrēķināta, ja mainās uzaicināto personu skaits, kas joprojām maksā, tā attiecas tikai uz tavu paša abonementu un nekad netiek pārvērsta naudā.\u003c/p>\n  \u003cp>\u003cstrong>Pārtikas produktu pievienošana.\u003c/strong> Ja mēneša laikā iesūti 10 pārtikas produktus un visi 10 tiek apstiprināti, tu saņem 5 % atlaidi nākamajam maksājumam.\u003c/p>\n  \u003cp>Aizliegts reģistrēt viltotus kontus vai izmantot savu kodu, lai iegūtu atlaides; mēs varam tās atsaukt un apturēt iesaistītos kontus. Programmu mēs varam mainīt vai slēgt, iepriekš paziņojot.\u003c/p>\n\n  \u003ch2>10. Intelektuālais īpašums un licences\u003c/h2>\n  \u003cp>cesta. un tās logotips, dizains, programmatūra, teksti un tulkojumi pieder tās īpašniekam un ir aizsargāti ar likumu. Bez rakstiskas atļaujas tu nedrīksti kopēt, mainīt, izplatīt vai veikt lietotnes apgriezto inženieriju.\u003c/p>\n  \u003cp>\u003cstrong>Trešo pušu atsauces.\u003c/strong> Daļa pārtikas un produktu datu nāk no Open Food Facts (openfoodfacts.org), kas pieejami ar licenci Open Database License (ODbL). Tiek izmantotas atvērtā koda bibliotēkas (Supabase JS, jsPDF, Sentry, Capacitor, ar MIT licenci) un fonti Space Grotesk un Inter (licence SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Pieejamība un atbildības ierobežojums\u003c/h2>\n  \u003cp>Mēs darām visu, lai lietotne vienmēr darbotos, taču apkopes vai mums nepakļautu iemeslu dēļ var būt pārtraukumi. cesta. neuzņemas atbildību par veselības lēmumiem, kas pieņemti tikai, pamatojoties uz lietotnes informāciju; vienmēr konsultējies ar speciālistu. Nekas no iepriekš minētā neierobežo tiesības, ko likums piešķir patērētājiem.\u003c/p>\n\n  \u003ch2>12. Attiecību izbeigšana\u003c/h2>\n  \u003cp>Jebkurā laikā savā profilā vari dzēst savu kontu un visus savus datus. Mēs varam apturēt vai slēgt kontu, kas pārkāpj šos noteikumus.\u003c/p>\n\n  \u003ch2>13. Izmaiņas šajos noteikumos\u003c/h2>\n  \u003cp>Par jebkurām būtiskām izmaiņām paziņosim vismaz 30 dienas iepriekš.\u003c/p>\n\n  \u003ch2>14. Piemērojamie tiesību akti\u003c/h2>\n  \u003cp>Šos noteikumus regulē Spānijas tiesību akti. Ja esi patērētājs, vari vērsties savas dzīvesvietas tiesā un saglabā tiesības, ko tev piešķir tavas dzīvesvietas valsts patērētāju tiesību normas.\u003c/p>\n\n  \u003ch2>15. Kontakti\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","lt":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Paskutinį kartą atnaujinta: 2026-09-24\u003c/p>\n\n  \u003ch2>1. Kas mes esame ir ką siūlome\u003c/h2>\n  \u003cp>cesta. savininkas yra \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Bet kokiais klausimais rašyk adresu cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. yra valgiaraščių planavimo, makroelementų skaičiavimo, svorio ir matmenų sekimo bei treniruočių planavimo ir registravimo priemonė. Ji apima maisto atpažinimą pagal nuotrauką ir brūkšninį kodą, pokalbį su dirbtiniu intelektu, receptus, pratimus su animuotomis demonstracijomis, skyrius „Nėštumas“ ir „Kūdikis“, protarpinį badavimą, ryšį su sveikatos programėlėmis bei pasirenkamą bendruomenę ir trenerių paieškos sistemą. Tai nėra medicinos priemonė ar profesionali mitybos konsultavimo paslauga.\u003c/p>\n\n  \u003ch2>2. Tavo paskyra\u003c/h2>\n  \u003cp>Tu atsakai už savo slaptažodžio saugumą. Norėdamas sukurti paskyrą, turi būti bent 18 metų. Tavo profilio informacija turi būti teisinga.\u003c/p>\n\n  \u003ch2>3. Bendruomenė ir bendrinamas turinys\u003c/h2>\n  \u003cp>Tavo profilis pagal numatytuosius nustatymus yra privatus. Jei padarai jį viešą arba priimi draugystės kvietimą, tas asmuo matys tavo valgiaraščius ir nuotraukas. Neįkelk turinio, pažeidžiančio trečiųjų šalių teises arba atskleidžiančio kitų asmenų tapatybę be jų sutikimo.\u003c/p>\n  \u003cp>\u003cstrong>Draudžiamas turinys.\u003c/strong> Draudžiama įkelti, siųsti pokalbyje ar bandyti pateikti kaip pratimo technikos paiešką bet kokį turinį, kuris yra seksualinio pobūdžio, nuogumo ar užuominų; smurtinis, grafinis ar bauginantis; rasistinis, homofobinis, neapykantą kurstantis ar diskriminacinis dėl bet kokios priežasties (kilmės, religijos, seksualinės orientacijos, lytinės tapatybės, negalios ar kitos); arba neteisėtas pagal bet kokį taikytiną įstatymą, įskaitant bet kokį turinį, susijusį su nepilnamečiais ar juos seksualizuojantį. Tai taikoma profilio, pažangos, maisto ir pateiktų produktų nuotraukoms, pokalbio žinutėms tarp trenerio ir sportininko arba tarp naudotojų bei bet kokiam tekstui, naudojamam technikos vaizdo įrašams ieškoti.\u003c/p>\n  \u003cp>Visos tavo įkeltos nuotraukos prieš jas priimant praeina automatinį moderavimo filtrą, naudojantį dirbtinį intelektą (daugiau informacijos – Privatumo politikoje). Bandymas apeiti filtrą arba pakartotinis draudžiamo turinio įkėlimas yra pagrindas nedelsiant sustabdyti arba uždaryti tavo paskyrą be teisės į aktyvaus mokamo plano lėšų grąžinimą ir nepažeidžiant mūsų teisės informuoti kompetentingas institucijas, kai to reikalauja įstatymas.\u003c/p>\n  \u003cp>Išlaikai visas teises į turinį, kurį įkeli. Suteiki mums leidimą, tik tam, kad galėtume teikti paslaugą, jį saugoti, rodyti asmenims, su kuriais nusprendi juo dalytis, ir tvarkyti taip, kaip paaiškinta Privatumo politikoje.\u003c/p>\n\n  \u003ch2>4. DI sukurtas turinys\u003c/h2>\n  \u003cp>Vertinimai, gauti analizuojant nuotrauką, pokalbyje su DI arba automatinėse santraukose, yra apytiksliai ir gali būti klaidingi. Visada juos peržiūrėk ir nelaikyk medicininiu patarimu.\u003c/p>\n\n  \u003ch2>5. Sveikata, nėštumas, kūdikis ir treniruotės\u003c/h2>\n  \u003cp>Programėlės informacija skirta asmeninei organizacijai ir bendrai informacijai. Ji nepakeičia gydytojo, dietologo, akušerio, pediatro ar trenerio patarimo. Pasitark su specialistu prieš pradėdamas pratimų programą ar keisdamas mitybą, ypač jei esi nėščia ar žindai, sergi liga, laikaisi gydymo arba jei informacija susijusi su kūdikiu.\u003c/p>\n\n  \u003ch2>6. Treneriai ir sportininkai\u003c/h2>\n  \u003cp>Treneriai, naudojantys cesta., yra nepriklausomi specialistai. cesta. palengvina kontaktą ir suteikia priemones, tačiau neprižiūri ir negarantuoja jų paslaugų, o trenerio ir sportininko santykiai yra išimtinai tarp jų. Mokėjimai tarp trenerio ir sportininko vykdomi tiesiogiai tarp jų, ne programėlėje; cesta. neima komisinio mokesčio ir nedalyvauja tuose sandoriuose. Abu įsipareigoja pagarbiai ir konfidencialiai elgtis su kito informacija.\u003c/p>\n\n  \u003ch2>7. Planai ir kainos\u003c/h2>\n  \u003cp>\u003cstrong>Nemokamas\u003c/strong> — be mokesčio, su pagrindinėmis planavimo funkcijomis, makroelementų skaičiuokle, maisto produktų ir receptų baze, pirkinių sąrašu, treniruočių registravimu, paieška pagal brūkšninį kodą, importu iš sveikatos programėlių, pokalbiu su DI ir prieiga prie bendruomenės. DI nuotraukų analizė ribojama iki 5 per mėnesį, o duomenų eksportas – iki 3 kartų per mėnesį.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mėn. arba 49,99 €/metams, pirmą kartą su 7 dienų nemokamu bandomuoju laikotarpiu. Apima Nemokamo plano funkcijas ir, be kita ko, neribotą DI nuotraukų analizę, neribotą duomenų eksportą, Cheat meals, Nėštumą, Kūdikį, rekomenduojamą treniruotę, matmenų sekimą ir prioritetinę pagalbą.\u003c/p>\n  \u003cp>\u003cstrong>Šeimos bazinis\u003c/strong> — 4,99 €/mėn. Iki 4 profilių su tuo pačiu el. paštu ir slaptažodžiu, kiekvienas su nepriklausomu svoriu, valgiais ir treniruotėmis, su Nemokamu lygiu. \u003cstrong>Šeimos premium\u003c/strong> — 12,99 €/mėn.: tas pats, bet visi 4 profiliai turi pilną Premium.\u003c/p>\n  \u003cp>\u003cstrong>Treneris\u003c/strong> — 9,99 €/mėn. arba 59,99 €/metams, su 7 dienų nemokamu bandomuoju laikotarpiu. Tai atskiras planas, apimantis Premium funkcijas ir sritį „Mano sportininkai“ sportininkams konsultuoti: siūlyti jiems valgiaraščius ir treniruotes, matyti jų pažangą ir kalbėtis su jais.\u003c/p>\n  \u003cp>Tai, ką apima kiekvienas planas, visada rodoma programėlėje (ekranas „Pagerink savo planą“) ir gali keistis. Taikytini mokesčiai rodomi prieš mokant. „Prioritetinė pagalba“ reiškia, kad tavo žinutė nagrinėjama anksčiau nei nemokamų paskyrų, be garantuoto atsakymo laiko.\u003c/p>\n\n  \u003ch2>7 bis. Kultūrizmo modulis (atskira prenumerata)\u003c/h2>\n  \u003cp>\u003cstrong>Kas tai yra.\u003c/strong> Kultūrizmo modulis yra asmeninio žymėjimo ir stebėjimo įrankis: tu užrašai tai, ką jau nusprendei vartoti (su gydytoju arba savarankiškai), o cesta. tai sutvarko kalendoriuje ir nubraižo orientacines kreives. Kreivės yra matematiniai įverčiai, kuriuose naudojamas tavo nurodytas pusinės eliminacijos laikas arba orientacinė vertė iš viešų šaltinių; jos nematuoja tikrųjų tavo kraujo lygių ir gali būti netikslios.\u003c/p>\n  \u003cp>\u003cstrong>Kas tai nėra.\u003c/strong> cesta. neteikia medicininių patarimų, diagnozės ar gydymo ir nerekomenduoja, neskiria, neskaičiuoja, nekoreguoja ir nesiūlo medžiagų, dozių ar schemų. Ji neparduoda, netiekia ir nepadeda įsigyti jokių medžiagų, neskatina jų vartojimo ir nepakeičia sveikatos priežiūros specialisto. Daugelis medžiagų yra receptiniai vaistai, kurių įsigijimas ir vartojimas be medicininės priežiūros gali būti neteisėtas ir pavojingas tavo sveikatai; tik tu pats atsakai už taikomų teisės aktų laikymąsi ir savo sprendimus. Jei jauti pavojaus simptomus, kreipkis į gydytoją arba skambink 112.\u003c/p>\n  \u003cp>\u003cstrong>Tik pilnamečiams (18+).\u003c/strong> Tau turi būti 18 metų arba daugiau, ir tai patvirtini užsisakydamas. Galime sustabdyti modulį, jei nustatysime, kad juo naudojasi nepilnametis arba kad jis naudojamas priešingai šioms sąlygoms.\u003c/p>\n  \u003cp>\u003cstrong>Kaina ir mokėjimas.\u003c/strong> 10 €/mėn. (su mokesčiais arba parodant juos prieš mokant), prenumerata nepriklauso nuo tavo plano (Nemokamas, Premium, Šeimos ar Trenerio) ir be nemokamo bandomojo laikotarpio. Ji atnaujinama automatiškai kas mėnesį, kol ją atšauksi. Mokėjimą apdoroja Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Atsisakymas ir atšaukimas.\u003c/strong> Užsisakydamas prašai, kad paslauga prasidėtų nedelsiant. Kaip vartotojas turi 14 dienų atsisakyti sutarties; jei ja pasinaudosi po to, kai naudojaisi moduliu, turėsi sumokėti proporcingą jau suteiktos paslaugos dalį. Prenumeratą gali atšaukti bet kada pačiame modulyje (mygtukas „Tvarkyti arba atšaukti prenumeratą“); atšaukimas įsigalioja pasibaigus jau apmokėtam laikotarpiui ir prenumerata daugiau neatnaujinama. Norėdamas atsisakyti sutarties, naudok modulio mygtuką „Pasinaudoti atsisakymo teise“ arba rašyk mums kontaktiniu el. paštu.\u003c/p>\n  \u003cp>\u003cstrong>Tavo duomenys.\u003c/strong> Duomenys, kuriuos įrašai, yra tavo: gali juos visus ištrinti bet kada paspaudęs „Ištrinti visus mano Kultūrizmo duomenis“ ir atsisiųsti paspaudęs „Atsisiųsti mano Kultūrizmo duomenis“. Atšaukus prenumeratą jie saugomi, kol juos ištrinsi, nebent paskyra būtų neaktyvi 18 mėnesių. Joks kitas asmuo (treneriai, draugai, Bendruomenė) šių duomenų nemato. Daugiau informacijos – Privatumo politikoje.\u003c/p>\n  \u003cp>\u003cstrong>DI pokalbis.\u003c/strong> Kai modulis aktyvus, pokalbis gali sutvarkyti kalendoriuje tai, ką jam papasakosi, tačiau savo iniciatyva nesiūlo medžiagų, dozių ar schemų.\u003c/p>\n  \u003cp>\u003cstrong>Nėra gydytojo ir paciento santykių; pasikonsultuok su specialistu.\u003c/strong> Naudojimasis moduliu nesukuria gydytojo ir paciento santykių. Prieš pradėdamas vartoti, keisdamas ar nutraukdamas bet kokį vaistą, papildą ar schemą, pasikonsultuok su kvalifikuotu sveikatos priežiūros specialistu. Tu atsakai už savo sprendimus ir su jais susijusią riziką. cesta. nepritaria jokios medžiagos vartojimui už leistinų ribų.\u003c/p>\n  \u003cp>\u003cstrong>Teisėtumas ir prieinamumas.\u003c/strong> Daugelis medžiagų, kurias gali įrašyti, nėra leistos vartoti žmonėms visose šalyse arba teisėtai parduodamos tik su receptu ar moksliniams tyrimams. Neteigiame, kad modulis, jo medžiagų sąrašas ar turinys yra tinkamas, teisėtas ar prieinamas tavo šalyje: tu atsakai už vietos teisės aktų laikymąsi. Medžiagų sąrašas skirtas tik joms pasirinkti pagal pavadinimą ir nereiškia, kad cesta. jas patvirtina ar rekomenduoja.\u003c/p>\n  \u003cp>\u003cstrong>Tikslumas, DI ir skubi pagalba.\u003c/strong> Duomenys ir kreivės grindžiami tuo, ką įvedi, ir įverčiais, kurių nepatikriname, todėl gali būti netikslūs ar neišsamūs. DI atsakymai generuojami automatiškai ir gali turėti klaidų. Medicininės skubios pagalbos atveju ar esant sunkiems simptomams nesiremk programėle: skambink 112 (arba savo šalies pagalbos numeriu) arba kreipkis į gydytoją.\u003c/p>\n  \u003cp>\u003cstrong>Atsakomybė.\u003c/strong> Įstatymų leidžiamu mastu cesta. neatsako už žalą, kilusią dėl sprendimų dėl medžiagų ar gydymo, kuriuos priimi remdamasis programėlės informacija. Tai neriboja teisių, kurias įstatymas suteikia tau kaip vartotojui, nei mūsų atsakomybės už tyčią, šiurkštų neatsargumą, mirtį ar kūno sužalojimus, padarytus dėl mūsų kaltės.\u003c/p>\n  \u003cp>\u003cstrong>Sustabdymas.\u003c/strong> Galime sustabdyti ar nutraukti modulį, jei nustatysime naudojimą, priešingą šioms sąlygoms (pavyzdžiui, nepilnamečių naudojimą, medžiagų pardavimą ar reklamavimą arba apsimetimą kitu asmeniu), grąžindami jau apmokėto, bet nepanaudoto laikotarpio proporcingą dalį.\u003c/p>\n\n  \u003ch2>8. Mokėjimai, nemokamas bandomasis laikotarpis, atnaujinimas ir atšaukimas\u003c/h2>\n  \u003cp>Mokėjimai saugiai apdorojami per Stripe; niekada nematome ir nesaugome tavo kortelės duomenų. Prenumeratos automatiškai atnaujinamos kiekvieno laikotarpio (mėnesio ar metų) pabaigoje, nebent atšauktum anksčiau. Jei atšauki per nemokamą bandomąjį laikotarpį, nieko nenuskaitoma.\u003c/p>\n  \u003cp>Gali bet kada atšaukti, pakeisti planą ar atnaujinti mokėjimo būdą mygtuku „Tvarkyti“ šalia savo plano, kuris nukreipia į saugų Stripe portalą. Jei atšauki, Premium prieigą išlaikai iki ja t bażiċi ta' ippjanar, kalkulatur tal-makros, bażi tal-ikel u tar-riċetti, lista tax-xiri, reġistrazzjoni tat-taħriġ, tfittxija bil-barcode, importazzjoni minn apps tas-saħħa, chat bl-IA u aċċess għall-komunità. L-analiżi tar-ritratti bl-IA hija limitata għal 5 fix-xahar u l-esportazzjoni tad-data għal 3 darbiet fix-xahar.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/xahar jew 49,99 €/sena, b'7 ijiem ta' prova b'xejn l-ewwel darba. Jinkludi dak tal-pjan B'xejn u, fost funzjonijiet oħra, analiżi tar-ritratti bl-IA bla limitu, esportazzjoni tad-data mingħajr limiti, Cheat meals, Tqala, Tarbija, taħriġ rakkomandat, segwitu tal-kejl u appoġġ prijoritarju.\u003c/p>\n  \u003cp>\u003cstrong>Familja bażika\u003c/strong> — 4,99 €/xahar. Sa 4 profili taħt l-istess email u password, kull wieħed bil-piż, l-ikliet u t-taħriġ indipendenti tiegħu, bil-livell B'xejn. \u003cstrong>Familja premium\u003c/strong> — 12,99 €/xahar: l-istess, iżda l-4 profili kollha għandhom Premium sħiħ.\u003c/p>\n  \u003cp>\u003cstrong>Surġent\u003c/strong> — 9,99 €/xahar jew 59,99 €/sena, b'7 ijiem ta' prova b'xejn. Huwa pjan separat li jinkludi dak ta' Premium u ż-żona «L-atleti tiegħi» biex tagħti parir lill-atleti: tipproponilhom menus u taħriġ, tara l-progress tagħhom u tiddiskuti magħhom.\u003c/p>\n  \u003cp>Dak li jinkludi kull pjan huwa dejjem murija fl-app (skrin «Ittejjeb il-pjan tiegħek») u jista' jevolvi. It-taxxi applikabbli jintwerew qabel ma tħallas. «Appoġġ prijoritarju» ifisser li l-messaġġ tiegħek jiġi attendut qabel dawk ta' kontijiet b'xejn, mingħajr ħin ta' tweġiba garantit.\u003c/p>\n\n  \u003ch2>7 bis. Modulu Bodybuilding (abbonament separat)\u003c/h2>\n  \u003cp>\u003cstrong>X'inhu.\u003c/strong> Il-modulu Bodybuilding huwa għodda ta' reġistrazzjoni u segwiment personali: inti tinnota dak li diġà ddeċidejt li tieħu (mat-tabib tiegħek jew waħdek) u cesta. torganizzah f'kalendarju u tfassal kurvi indikattivi. Il-kurvi huma stimi matematiċi li jużaw il-half-life li inti tindika jew valur indikattiv minn sorsi pubbliċi; ma jkejlux il-livelli reali tiegħek fid-demm u jistgħu ma jkunux eżatti.\u003c/p>\n  \u003cp>\u003cstrong>X'mhuwiex.\u003c/strong> cesta. ma tagħtix parir mediku, dijanjożi jew trattament, u ma tirrakkomandax, ma tippreskrivix, ma tikkalkulax, ma taġġustax u ma tissuġġerix sustanzi, dożi jew skedi. Ma tbiegħx, ma tfornix u ma tgħinx biex tikseb ebda sustanza, ma tinkoraġġixxi l-użu tagħhom, u ma tissostitwixxix professjonist tas-saħħa. Ħafna sustanzi huma mediċini bir-riċetta li l-akkwist u l-użu tagħhom mingħajr sorveljanza medika jistgħu jkunu illegali u perikolużi għas-saħħa tiegħek; inti biss responsabbli li tikkonforma mal-liġi applikabbli u mid-deċiżjonijiet tiegħek. Jekk ikollok sintomi ta' twissija, mur għand servizz mediku jew ċempel fuq 112.\u003c/p>\n  \u003cp>\u003cstrong>Għal dawk ta' 18-il sena jew aktar biss.\u003c/strong> Trid ikollok 18-il sena jew aktar u tikkonferma dan meta tabbona. Nistgħu nissospendu l-modulu jekk nindunaw li qed jużah minorenni jew li qed jintuża b'mod kuntrarju għal dawn it-termini.\u003c/p>\n  \u003cp>\u003cstrong>Prezz u ħlas.\u003c/strong> €10/xahar (taxxi inklużi jew murija qabel tħallas), abbonament indipendenti mill-pjan tiegħek (B'xejn, Premium, tal-Familja jew tat-Trainer) u mingħajr prova b'xejn. Jiġġedded awtomatikament kull xahar sakemm tikkanċellah. Il-ħlas jiġi pproċessat minn Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Rtirar u kanċellazzjoni.\u003c/strong> Meta tabbona titlob li s-servizz jibda minnufih. Bħala konsumatur għandek 14-il jum biex tirtira mill-kuntratt; jekk teżerċita dan id-dritt wara li tkun użajt il-modulu, ikollok thallas il-parti proporzjonali tas-servizz li diġà tgawda. Tista' tikkanċella meta trid mill-modulu nnifsu (il-buttuna “Immaniġġja jew ikkanċella l-abbonament”); il-kanċellazzjoni jkollha effett fl-aħħar tal-perjodu li diġà tħallas u ma jerġax jiġġedded. Biex tirtira, uża l-buttuna “Eżerċita d-dritt tiegħi ta' rtirar” fil-modulu jew ikteb lilna fuq l-email ta' kuntatt.\u003c/p>\n  \u003cp>\u003cstrong>Id-dejta tiegħek.\u003c/strong> Id-dejta li tirreġistra hija tiegħek: tista' tħassarha kollha meta trid b'“Ħassar id-dejta kollha tiegħi tal-Bodybuilding” u tniżżilha b'“Niżżel id-dejta tiegħi tal-Bodybuilding”. Meta tikkanċella l-abbonament tinżamm sakemm inti tħassarha, ħlief jekk il-kont ikun inattiv għal 18-il xahar. Ħadd ieħor (trainers, ħbieb, Komunità) ma jista' jara din id-dejta. Aktar dettalji fil-Politika tal-Privatezza.\u003c/p>\n  \u003cp>\u003cstrong>Chat tal-IA.\u003c/strong> Bil-modulu attiv, iċ-chat jista' jorganizza f'kalendarju dak li tgħidlu, imma ma jipproponix sustanzi, dożi jew skedi fuq inizjattiva tiegħu.\u003c/p>\n  \u003cp>\u003cstrong>Ebda relazzjoni bejn tabib u pazjent; ikkonsulta professjonist.\u003c/strong> L-użu tal-modulu ma joħloqx relazzjoni bejn tabib u pazjent. Qabel ma tibda, tibdel jew twaqqaf xi mediċina, supplement jew skeda, ikkonsulta professjonist tas-saħħa kwalifikat. Inti responsabbli mid-deċiżjonijiet tiegħek u mir-riskji li jġibu magħhom. cesta. ma tapprovax l-użu ta' ebda sustanza barra minn dak awtorizzat.\u003c/p>\n  \u003cp>\u003cstrong>Legalità u disponibbiltà.\u003c/strong> Ħafna mis-sustanzi li tista' tirreġistra mhumiex awtorizzati għall-użu mill-bniedem fil-pajjiżi kollha, jew jinbiegħu legalment biss bir-riċetta jew għar-riċerka. Ma nsostnux li l-modulu, il-lista tas-sustanzi tiegħu jew il-kontenut tiegħu huma xierqa, legali jew disponibbli f'pajjiżek: inti responsabbli li tikkonforma mal-liġi lokali. Il-lista tas-sustanzi sservi biss biex tagħżilhom bl-isem u ma tfissirx li cesta. tapprovahom jew tirrakkomandahom.\u003c/p>\n  \u003cp>\u003cstrong>Eżattezza, IA u emerġenzi.\u003c/strong> Id-dejta u l-kurvi huma bbażati fuq dak li inti tidħol u fuq stimi li ma nivverifikawx, u jistgħu ma jkunux eżatti jew kompluti. It-tweġibiet tal-IA jiġu ġġenerati awtomatikament u jistgħu jkun fihom żbalji. F'emerġenza medika jew b'sintomi serji tiddependix fuq l-app: ċempel fuq 112 (jew in-numru ta' emerġenza ta' pajjiżek) jew mur għand tabib.\u003c/p>\n  \u003cp>\u003cstrong>Responsabbiltà.\u003c/strong> Sa fejn tippermetti l-liġi, cesta. mhijiex responsabbli għal danni li jirriżultaw minn deċiżjonijiet li tieħu dwar sustanzi jew trattamenti abbażi tal-informazzjoni fl-app. Dan ma jillimitax id-drittijiet li l-liġi tagħtik bħala konsumatur u lanqas ir-responsabbiltà tagħna għal dolo, negliġenza gravi, mewt jew korriment personali kkawżati minn tort tagħna.\u003c/p>\n  \u003cp>\u003cstrong>Sospensjoni.\u003c/strong> Nistgħu nissospendu jew nikkanċellaw il-modulu jekk nindunaw b'użu kuntrarju għal dawn it-termini (pereżempju użu minn minorenni, bejgħ jew promozzjoni ta' sustanzi, jew impersonazzjoni), billi nirrimborżaw il-parti proporzjonali tal-perjodu li diġà tħallas u ma tgawdiex.\u003c/p>\n\n  \u003ch2>8. Ħlasijiet, prova b'xejn, tiġdid u kanċellazzjoni\u003c/h2>\n  \u003cp>Il-ħlasijiet jiġu pproċessati b'mod sikur permezz ta' Stripe; qatt ma narawx u ma naħżnux id-dettalji tal-karta tiegħek. Is-sottoskrizzjonijiet jiġġeddu awtomatikament fi tmiem kull perjodu (xahri jew annwali) sakemm ma tikkanċellax qabel. Jekk tikkanċella matul il-prova b'xejn, ma jittieħdilek xejn.\u003c/p>\n  \u003cp>Tista' tikkanċella, tibdel il-pjan jew taġġorna l-metodu tal-ħlas tiegħek meta trid mill-buttuna «Immaniġġja» ħdejn il-pjan tiegħek, li twassalek għall-portal sikur ta' Stripe. Jekk tikkanċella, żżomm l-aċċess Premium sa tmiem il-perjodu li diġà tħallas. Jekk ħlas jonqos, Stripe terġa' tipprova tiġbor il-ħlas għal xi ġranet; jekk xorta ma jistax jinġabar, il-kont tiegħek jgħaddi għall-pjan B'xejn sakemm taġġorna l-metodu tal-ħlas tiegħek.\u003c/p>\n  \u003cp>\u003cstrong>Dritt ta' rtirar.\u003c/strong> Jekk int konsumatur, għandek id-dritt li tirtira mill-kuntratt fi żmien 14-il jum kalendarju minn meta tissottoskrivi (minn meta tibda l-prova jew il-ħlas), mingħajr ma tagħti spjegazzjonijiet, billi tikteb lil cestafitness@gmail.com. Peress li s-servizz diġitali jibda immedjatament fuq talba tiegħek, jekk tirtira ser ikollok tħallas il-parti proporzjonali tas-servizz li tkun irċevejt sa dak il-ħin. Barra minn dan id-dritt legali, ma hemm l-ebda rimbors għaż-żmien li jkun diġà għadda sakemm il-liġi applikabbli ma tirrikjedix mod ieħor.\u003c/p>\n\n  \u003ch2>9. Programm ta' stediniet u skontijiet\u003c/h2>\n  \u003cp>\u003cstrong>Stedi lill-ħbieb.\u003c/strong> Meta persuni li jirreġistraw bil-kodiċi tiegħek jissottoskrivu għal pjan bi ħlas, is-sottoskrizzjoni bi ħlas tiegħek tirċievi skont skont kemm minn dawk il-persuni qed iħallsu f'dak il-ħin: 5 persuni, 10 %; 10 persuni, 20 %; 15-il persuna, 30 %; 20 persuna, 40 %; 30 persuna, 50 %. Biex tirċevih trid ikollok is-sottoskrizzjoni bi ħlas attiva tiegħek stess. L-iskont jerġa' jiġi kkalkulat jekk jinbidel in-numru ta' mistiedna li jkomplu jħallsu, japplika biss għas-sottoskrizzjoni tiegħek stess u qatt ma jinbidel f'flus.\u003c/p>\n  \u003cp>\u003cstrong>Kontribuzzjoni tal-ikel.\u003c/strong> Jekk tibgħat 10 ikliet fix-xahar u l-10 kollha jiġu vvalidati, ikollok skont ta' 5 % fuq il-ħlas li jmiss.\u003c/p>\n  \u003cp>Huwa pprojbit li tirreġistra kontijiet foloz jew li tuża l-kodiċi tiegħek stess biex tikseb skontijiet; nistgħu nneħħuhom u nissospendu l-kontijiet involuti. Nistgħu nbiddlu jew nagħlqu l-programm billi nagħtu avviż bil-quddiem.\u003c/p>\n\n  \u003ch2>10. Proprjetà intellettwali u liċenzji\u003c/h2>\n  \u003cp>cesta. u l-logo tagħha, id-disinn, is-software, it-testi u t-traduzzjonijiet huma tas-sid tagħhom u huma protetti mil-liġi. Ma tistax tikkopja, tibdel, tqassam jew tagħmel inġinerija inversa tal-applikazzjoni mingħajr awtorizzazzjoni bil-miktub.\u003c/p>\n  \u003cp>\u003cstrong>Krediti ta' terzi.\u003c/strong> Parti mid-data tal-ikel u tal-prodotti tiġi minn Open Food Facts (openfoodfacts.org), disponibbli taħt il-liċenzja Open Database License (ODbL). Jintużaw libreriji open source (Supabase JS, jsPDF, Sentry, Capacitor, b'liċenzja MIT) u t-tipi tal-ittri Space Grotesk u Inter (liċenzja SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Disponibbiltà u limitazzjoni tar-responsabbiltà\u003c/h2>\n  \u003cp>Nagħmlu l-almu tagħna biex l-app taħdem dejjem, iżda jistgħu jkun hemm interruzzjonijiet minħabba manutenzjoni jew raġunijiet li ma jiddependux minna. cesta. mhijiex responsabbli għal deċiżjonijiet dwar is-saħħa meħudin biss fuq il-bażi tal-informazzjoni tal-app; dejjem ikkonsulta professjonista. Xejn minn dak ta' hawn fuq ma jillimita d-drittijiet li l-liġi tirrikonoxxi lill-konsumaturi.\u003c/p>\n\n  \u003ch2>12. Tmiem ir-relazzjoni\u003c/h2>\n  \u003cp>Tista' tħassar il-kont tiegħek u d-data kollha tiegħek f'kull ħin mill-profil tiegħek. Nistgħu nissospendu jew nagħlqu kont li jiksar dawn it-termini.\u003c/p>\n\n  \u003ch2>13. Bidliet f'dawn it-termini\u003c/h2>\n  \u003cp>Ser nagħtu avviż ta' kull bidla rilevanti b'mill-anqas 30 jum bil-quddiem.\u003c/p>\n\n  \u003ch2>14. Liġi applikabbli\u003c/h2>\n  \u003cp>Dawn it-termini huma rregolati mil-liġi Spanjola. Jekk int konsumatur, tista' tmur quddiem il-qrati tad-domiċilju tiegħek, u żżomm id-drittijiet li tirrikonoxxilek il-leġiżlazzjoni dwar il-konsumatur tal-pajjiż ta' residenza tiegħek.\u003c/p>\n\n  \u003ch2>15. Kuntatt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","ga":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Nuashonraithe go deireanach: 24/09/2026\u003c/p>\n\n  \u003ch2>1. Cé muid agus cad a thairgimid\u003c/h2>\n  \u003cp>Is é \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada) úinéir cesta. Le haghaidh aon fhiosrúcháin, scríobh chuig cestafitness@gmail.com.\u003c/p>\n  \u003cp>Is uirlis í cesta. chun béilí a phleanáil, macrachothaitheach a ríomh, meáchan agus tomhais a rianú, agus oiliúint a phleanáil agus a chlárú. Áirítear inti bianna a aithint trí ghrianghraf agus trí bharrachód, comhrá le hintleacht shaorga, oidis, cleachtaí le taispeántais bheoite, ailt Toircheas agus Leanbh, troscadh eatramhach, nasc le haipeanna sláinte, agus pobal agus inneall cuardaigh traenálaithe roghnach. Ní táirge sláinte í ná seirbhís chomhairle chothaithe ghairmiúil.\u003c/p>\n\n  \u003ch2>2. Do chuntas\u003c/h2>\n  \u003cp>Tá tú freagrach as do phasfhocal a choinneáil slán. Ní mór duit 18 bliana d'aois ar a laghad a bheith agat chun cuntas a chruthú. Ní mór d'fhaisnéis próifíle a bheith fíor.\u003c/p>\n\n  \u003ch2>3. Pobal agus ábhar roinnte\u003c/h2>\n  \u003cp>Tá do phróifíl príobháideach de réir réamhshocraithe. Má dhéanann tú poiblí í nó má ghlacann tú le cairdeas, feicfidh an duine sin do bhiachláir agus do ghrianghraif. Ná huaslódáil ábhar a sháraíonn cearta tríú páirtithe ná a aithníonn daoine eile gan a dtoiliú.\u003c/p>\n  \u003cp>\u003cstrong>Ábhar toirmiscthe.\u003c/strong> Ní cheadaítear aon ábhar a uaslódáil, a sheoladh tríd an gcomhrá ná a chur i gcéill mar chuardach teicníce cleachtaidh a bhfuil sé gnéasach, nocht nó leathfhollasach; foréigneach, grafach nó suaiteach; ciníoch, homafóibeach, fuath-inspreagtha nó idirdhealaitheach ar aon chúis (bunús, reiligiún, claonadh gnéasach, féiniúlacht inscne, míchumas nó eile); nó mídhleathach faoi aon dlí is infheidhme, lena n-áirítear aon ábhar a bhaineann le mionaoisigh nó a ghnéasaíonn iad. Baineann sé seo le grianghraif phróifíle, dul chun cinn, bia agus táirgí a cuireadh leis, le teachtaireachtaí comhrá idir traenálaí agus lúthchleasaí nó idir úsáideoirí, agus le haon téacs a úsáidtear chun físeáin teicnící a chuardach.\u003c/p>\n  \u003cp>Téann na grianghraif go léir a uaslódálann tú trí scagaire modhnóireachta uathoibríoch le hintleacht shaorga sula nglactar leo (tuilleadh sonraí sa Bheartas Príobháideachais). Is cúis le do chuntas a chur ar fionraí nó a dhúnadh láithreach, gan ceart ar aisíocaíocht an phlean íoctha ghníomhaigh, iarracht an scagaire a sheachbhóthar nó ábhar toirmiscthe a uaslódáil arís agus arís eile, gan dochar dár gceart na húdaráis inniúla a chur ar an eolas nuair a cheanglaíonn an dlí orainn.\u003c/p>\n  \u003cp>Coinníonn tú na cearta go léir ar an ábhar a uaslódálann tú. Tugann tú cead dúinn, chun an tseirbhís a sholáthar duit amháin, é a stóráil, é a thaispeáint do na daoine a roghnaíonn tú é a roinnt leo agus é a phróiseáil mar a mhínítear sa Bheartas Príobháideachais.\u003c/p>\n\n  \u003ch2>4. Ábhar a ghintear le hintleacht shaorga\u003c/h2>\n  \u003cp>Is neasmheastacháin iad na meastacháin a fhaightear trí anailís grianghraif, trí chomhrá na hintleachta saorga nó trí achoimrí uathoibríocha agus is féidir go mbeadh earráidí iontu. Athbhreithnigh i gcónaí iad agus ná glac leo mar chomhairle leighis.\u003c/p>\n\n  \u003ch2>5. Sláinte, toircheas, leanbh agus oiliúint\u003c/h2>\n  \u003cp>Is le haghaidh eagrúchán pearsanta agus faisnéis ghinearálta an fhaisnéis san aip. Ní thagann sí in ionad comhairle dochtúra, réititheora-chothaitheora, cnáimhseachaí, péidiatraiceora nó traenálaí. Téigh i gcomhairle le gairmí sula dtosaíonn tú clár aclaíochta nó sula n-athraíonn tú do aiste bia, agus go háirithe má tá tú torrach nó ag beathú cíche, tinn, ag leanúint cóireála, nó má bhaineann an fhaisnéis le leanbh.\u003c/p>\n\n  \u003ch2>6. Traenálaithe agus lúthchleasaithe\u003c/h2>\n  \u003cp>Is gairmithe neamhspleácha iad na traenálaithe a úsáideann cesta. Éascaíonn cesta. an teagmháil agus na huirlisí, ach ní dhéanann sí maoirseacht ar a seirbhísí ná ní ráthaíonn sí iad, agus is idir an bheirt acu amháin atá an caidreamh idir traenálaí agus lúthchleasaí. Láimhseáiltear na híocaíochtaí idir traenálaí agus lúthchleasaí go díreach eatarthu, lasmuigh den aip; ní ghearrann cesta. coimisiún ná ní ghlacann sí páirt sna idirbhearta sin. Geallann an bheirt iad féin go láimhseoidh siad faisnéis a chéile le meas agus faoi rún.\u003c/p>\n\n  \u003ch2>7. Pleananna agus praghsanna\u003c/h2>\n  \u003cp>\u003cstrong>Saor in aisce\u003c/strong> — gan chostas, le príomhfheidhmeanna pleanála, áireamhán macraí, bunachar bianna agus oidis, liosta siopadóireachta, clárú oiliúna, cuardach barrachóid, iompórtáil ó aipeanna sláinte, comhrá le hintleacht shaorga agus rochtain ar an bpobal. Tá anailís grianghraf le hintleacht shaorga teoranta do 5 sa mhí agus onnmhairiú sonraí do 3 huaire sa mhí.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — €7.99/mí nó €49.99/bliain, le 7 lá de thriail saor in aisce an chéad uair. Áirítear leis na feidhmeanna go léir sa phlean Saor in aisce agus, i measc feidhmeanna eile, anailís grianghraf le hintleacht shaorga gan teorainn, onnmhairiú sonraí gan teorainn, Cheat meals, Toircheas, Leanbh, oiliúint mholta, rianú tomhais agus tacaíocht tosaíochta.\u003c/p>\n  \u003cp>\u003cstrong>Teaghlach bunúsach\u003c/strong> — €4.99/mí. Suas le 4 phróifíl faoin ríomhphost agus pasfhocal céanna, gach ceann acu lena meáchan, a mbéilí agus a n-oiliúint neamhspleách féin, leis an leibhéal Saor in aisce. \u003cstrong>Teaghlach premium\u003c/strong> — €12.99/mí: mar an gcéanna, ach tá Premium iomlán ag na 4 phróifíl.\u003c/p>\n  \u003cp>\u003cstrong>Traenálaí\u003c/strong> — €9.99/mí nó €59.99/bliain, le 7 lá de thriail saor in aisce. Is plean ar leith é a chuimsíonn Premium agus an limistéar «Mo lúthchleasaithe» chun comhairle a chur ar lúthchleasaithe: biachláir agus oiliúint a mholadh dóibh, a ndul chun cinn a fheiceáil agus comhrá a dhéanamh leo.\u003c/p>\n  \u003cp>Taispeántar san aip i gcónaí cad atá i ngach plean (scáileán «Uasghrádaigh do phlean») agus is féidir leis athrú. Taispeántar na cánacha is infheidhme sula n-íocann tú. Ciallaíonn «tacaíocht tosaíochta» go ndéileáiltear le do theachtaireacht roimh theachtaireachtaí cuntas saor in aisce, gan am freagartha ráthaithe.\u003c/p>\n\n  \u003ch2>7 bis. Modúl Corpoiliú (síntiús ar leith)\u003c/h2>\n  \u003cp>\u003cstrong>Cad é atá ann.\u003c/strong> Is uirlis chlárúcháin agus rianaithe phearsanta é an modúl Corpoiliú: scríobhann tusa síos an rud a bhfuil cinneadh déanta agat cheana é a ghlacadh (le do dhochtúir nó ar do chonlán féin) agus cuireann cesta. in eagar i bhfeilire é agus tarraingíonn sé cuair léiritheacha. Meastacháin mhatamaitice iad na cuair a úsáideann an leathré a léiríonn tú nó luach léiritheach ó fhoinsí poiblí; ní thomhaiseann siad do leibhéil fhíorúla fola agus d'fhéadfadh siad a bheith mícheart.\u003c/p>\n  \u003cp>\u003cstrong>Cad nach é atá ann.\u003c/strong> Ní thugann cesta. comhairle leighis, diagnóis ná cóireáil, agus ní mholann, ní fhorordaíonn, ní ríomhann, ní choigeartaíonn ná ní mholann sí substaintí, dáileoga ná treoirlínte. Ní dhíolann, ní sholáthraíonn ná ní chabhraíonn sí le substaint ar bith a fháil, ní spreagann sí a n-úsáid, agus ní ionadaíonn sí gairmí cúram sláinte. Is drugaí ar oideas iad go leor substaintí a bhféadfadh a bhfáil agus a n-úsáid gan mhaoirseacht leighis a bheith mídhleathach agus contúirteach do do shláinte; is tusa amháin atá freagrach as cloí leis an dlí is infheidhme agus as do chinntí. Má tá comharthaí rabhaidh ort, téigh chuig seirbhís leighis nó cuir fios ar 112.\u003c/p>\n  \u003cp>\u003cstrong>Do dhaoine 18 mbliana d'aois nó os a chionn amháin.\u003c/strong> Caithfidh tú a bheith 18 mbliana d'aois nó os a chionn agus deimhníonn tú é sin nuair a shíníonn tú suas. D'fhéadfaimis an modúl a chur ar fionraí má aimsímid go bhfuil mionaoiseach á úsáid nó go bhfuil sé á úsáid contrártha leis na téarmaí seo.\u003c/p>\n  \u003cp>\u003cstrong>Praghas agus íocaíocht.\u003c/strong> €10/mí (cánacha san áireamh nó léirithe sula n-íocann tú), síntiús neamhspleách ar do phlean (Saor in aisce, Préimh, Teaghlaigh nó Traenálaí) agus gan triail saor in aisce. Athnuaitear go huathoibríoch é gach mí go dtí go gcealaíonn tú é. Próiseálann Stripe an íocaíocht.\u003c/p>\n  \u003cp>\u003cstrong>Tarraingt siar agus cealú.\u003c/strong> Nuair a shíníonn tú suas, iarrann tú go dtosóidh an tseirbhís láithreach. Mar thomhaltóir tá 14 lá agat chun tarraingt siar ón gconradh; má úsáideann tú an ceart sin tar éis an modúl a úsáid, beidh ort an chuid chomhréireach den tseirbhís atá curtha ar fáil cheana a íoc. Is féidir leat cealú am ar bith ón modúl féin (an cnaipe “Bainistigh nó cealaigh an síntiús”); tagann an cealú i bhfeidhm ag deireadh na tréimhse atá íoctha cheana agus ní athnuaitear arís é. Chun tarraingt siar, úsáid an cnaipe “Úsáid mo cheart tarraingthe siar” sa mhodúl nó scríobh chugainn ag an ríomhphost teagmhála.\u003c/p>\n  \u003cp>\u003cstrong>Do shonraí.\u003c/strong> Is leatsa na sonraí a chláraíonn tú: is féidir leat iad ar fad a scriosadh am ar bith le “Scrios mo shonraí Corpoiliú go léir” agus iad a íoslódáil le “Íoslódáil mo shonraí Corpoiliú”. Nuair a chealaíonn tú an síntiús coimeádtar iad go dtí go scriosann tú iad, mura bhfuil an cuntas neamhghníomhach ar feadh 18 mí. Ní fheiceann aon duine eile (traenálaithe, cairde, an Pobal) na sonraí seo. Tuilleadh sonraí sa Bheartas Príobháideachta.\u003c/p>\n  \u003cp>\u003cstrong>Comhrá AI.\u003c/strong> Nuair a bhíonn an modúl gníomhach, is féidir leis an gcomhrá a insíonn tú dó a chur in eagar i bhfeilire, ach ní mholann sé substaintí, dáileoga ná treoirlínte as a stuaim féin.\u003c/p>\n  \u003cp>\u003cstrong>Gan caidreamh dochtúra-othair; téigh i gcomhairle le gairmí.\u003c/strong> Ní chruthaíonn úsáid an mhodúil caidreamh dochtúra-othair. Sula dtosaíonn tú, sula n-athraíonn tú nó sula scoireann tú de leigheas, forlíonadh nó treoirlíne ar bith, téigh i gcomhairle le gairmí cúram sláinte cáilithe. Is tusa atá freagrach as do chinntí agus as na rioscaí a bhaineann leo. Ní thacaíonn cesta. le húsáid substainte ar bith lasmuigh den mhéid atá údaraithe.\u003c/p>\n  \u003cp>\u003cstrong>Dlíthiúlacht agus infhaighteacht.\u003c/strong> Níl go leor de na substaintí a fhéadann tú a chlárú údaraithe le húsáid ag daoine i ngach tír, nó ní dhíoltar go dlíthiúil iad ach ar oideas nó chun críche taighde. Ní dhearbhaímid go bhfuil an modúl, a liosta substaintí ná a ábhar oiriúnach, dlíthiúil ná ar fáil i do thír: is tusa atá freagrach as cloí leis an dlí áitiúil. Ní fhónann an liosta substaintí ach chun iad a roghnú de réir ainm agus ní chiallaíonn sé go gceadaíonn nó go molann cesta. iad.\u003c/p>\n  \u003cp>\u003cstrong>Cruinneas, AI agus éigeandálaí.\u003c/strong> Bunaítear na sonraí agus na cuair ar an méid a chuireann tú isteach agus ar mheastacháin nach ndéanaimid a fhíorú, agus d'fhéadfadh siad a bheith mícheart nó neamhiomlán. Gintear freagraí AI go huathoibríoch agus d'fhéadfadh earráidí a bheith iontu. I gcás éigeandála míochaine nó comharthaí tromchúiseacha ná bí ag brath ar an aip: cuir fios ar 112 (nó ar uimhir éigeandála do thíre) nó téigh chuig dochtúir.\u003c/p>\n  \u003cp>\u003cstrong>Dliteanas.\u003c/strong> Sa mhéid a cheadaíonn an dlí, níl cesta. faoi dhliteanas as damáiste a eascraíonn as cinntí a dhéanann tú faoi shubstaintí nó faoi chóireálacha bunaithe ar an eolas san aip. Ní chuireann sé seo teorainn leis na cearta a thugann an dlí duit mar thomhaltóir ná lenár ndliteanas as mí-iompar toiliúil, faillí throm, bás nó gortú pearsanta arna gcúiseamh ag ár locht.\u003c/p>\n  \u003cp>\u003cstrong>Fionraí.\u003c/strong> D'fhéadfaimis an modúl a chur ar fionraí nó a chealú má aimsímid úsáid atá contrártha leis na téarmaí seo (mar shampla úsáid ag mionaoisigh, díol nó cur chun cinn substaintí, nó pearsanú), agus an chuid chomhréireach den tréimhse atá íoctha cheana agus nár baineadh sult aisti á aisíoc.\u003c/p>\n\n  \u003ch2>8. Íocaíochtaí, triail saor in aisce, athnuachan agus cealú\u003c/h2>\n  \u003cp>Próiseáiltear na híocaíochtaí go slán trí Stripe; ní fheicimid ná ní stórálaimid sonraí do chárta riamh. Athnuaitear na suibscríbhinní go huathoibríoch ag deireadh gach tréimhse (míosúil nó bliantúil) mura gcealaíonn tú roimhe sin. Má chealaíonn tú le linn na trialach saor in aisce, ní ghearrtar aon rud ort.\u003c/p>\n  \u003cp>Is féidir leat cealú, plean a athrú nó do mhodh íocaíochta a nuashonrú am ar bith ón gcnaipe «Bainistigh» in aice le do phlean, a thugann chuig tairseach shlán Stripe thú. Má chealaíonn tú, coinníonn tú rochtain Premium go dtí deireadh na tréimhse a íocadh cheana. Má theipeann ar íocaíocht, déanfaidh Stripe iarracht arís an t-airgead a bhailiú ar feadh roinnt laethanta; mura féidir é a bhailiú fós, aistreofar do chuntas go dtí an plean Saor in aisce go dtí go nuashonróidh tú do mhodh íocaíochta.\u003c/p>\n  \u003cp>\u003cstrong>An ceart aistarraingthe.\u003c/strong> Má tá tú i do thomhaltóir, tá sé de cheart agat tarraingt siar ón gconradh laistigh de 14 lá féilire ón uair a chuireann tú síos air (ón uair a thosaíonn tú an triail nó an íocaíocht), gan údar a thabhairt, trí scríobh chuig cestafitness@gmail.com. Ós rud é go dtosaíonn an tseirbhís dhigiteach láithreach arna iarraidh sin duit, má tharraingíonn tú siar beidh ort an chuid chomhréireach den tseirbhís a fuair tú go dtí sin a íoc. Lasmuigh den cheart dlíthiúil sin, níl aon aisíocaíocht ar an am atá caite cheana mura gceanglaíonn an dlí is infheidhme a mhalairt.\u003c/p>\n\n  \u003ch2>9. Clár cuiridh agus lascainí\u003c/h2>\n  \u003cp>\u003cstrong>Cuireadh a thabhairt do chairde.\u003c/strong> Nuair a chuireann daoine a chláraíonn le do chód síos ar phlean íoctha, faigheann do shuibscríbhinn íoctha lascaine de réir cé mhéad de na daoine sin atá ag íoc ag an am sin: 5 dhuine, 10 %; 10 nduine, 20 %; 15 dhuine, 30 %; 20 duine, 40 %; 30 duine, 50 %. Chun í a fháil, ní mór duit do shuibscríbhinn íoctha ghníomhach féin a bheith agat. Athríomhtar an lascaine má athraíonn líon na n-úsáideoirí ar tugadh cuireadh dóibh a leanann de bheith ag íoc, ní bhaineann sí ach le do shuibscríbhinn féin agus ní iompaítear go hairgead riamh í.\u003c/p>\n  \u003cp>\u003cstrong>Bianna a chur leis.\u003c/strong> Má sheolann tú 10 mbia i mí agus go bhfíoraítear na 10 go léir, tá lascaine 5 % agat ar do chéad tháille eile.\u003c/p>\n  \u003cp>Toirmisctear cuntais bhréige a chlárú nó do chód féin a úsáid chun lascainí a fháil; féadfaimid iad a bhaint agus na cuntais lena mbaineann a chur ar fionraí. Féadfaimid an clár a athrú nó a dhúnadh trí fhógra a thabhairt roimh ré.\u003c/p>\n\n  \u003ch2>10. Maoin intleachtúil agus ceadúnais\u003c/h2>\n  \u003cp>Tá cesta. agus a lógó, an dearadh, an bogearra, na téacsanna agus na haistriúcháin faoi úinéireacht a húinéara agus cosanta ag an dlí. Ní féidir leat an feidhmchlár a chóipeáil, a mhionathrú, a dháileadh ná innealtóireacht droim ar ais a dhéanamh air gan údarú i scríbhinn.\u003c/p>\n  \u003cp>\u003cstrong>Creidmheasanna tríú páirtithe.\u003c/strong> Is ó Open Food Facts (openfoodfacts.org) a thagann cuid de na sonraí bianna agus táirgí, atá ar fáil faoin gceadúnas Open Database License (ODbL). Úsáidtear leabharlanna foinse oscailte (Supabase JS, jsPDF, Sentry, Capacitor, faoi cheadúnas MIT) agus na clófhoirmeacha Space Grotesk agus Inter (ceadúnas SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Infhaighteacht agus teorannú freagrachta\u003c/h2>\n  \u003cp>Déanaimid ár ndícheall an aip a choinneáil ag obair i gcónaí, ach d'fhéadfadh cur isteach a bheith ann de bharr cothabhála nó cúiseanna lasmuigh dár smacht. Ní hé cesta. atá freagrach as cinntí sláinte a dhéantar bunaithe ar fhaisnéis na haipe amháin; téigh i gcomhairle le gairmí i gcónaí. Ní theorannaíonn aon rud thuas na cearta a aithníonn an dlí do thomhaltóirí.\u003c/p>\n\n  \u003ch2>12. An caidreamh a chur i gcrích\u003c/h2>\n  \u003cp>Is féidir leat do chuntas agus do shonraí go léir a scriosadh am ar bith ó do phróifíl. Féadfaimid cuntas a sháraíonn na téarmaí seo a chur ar fionraí nó a dhúnadh.\u003c/p>\n\n  \u003ch2>13. Athruithe ar na téarmaí seo\u003c/h2>\n  \u003cp>Cuirfimid aon athrú ábhartha in iúl 30 lá ar a laghad roimh ré.\u003c/p>\n\n  \u003ch2>14. Dlí is infheidhme\u003c/h2>\n  \u003cp>Rialaítear na téarmaí seo leis an dlí Spáinneach. Má tá tú i do thomhaltóir, is féidir leat dul os comhair chúirteanna do chónaithe, agus coinníonn tú na cearta a aithníonn reachtaíocht tomhaltóirí do thíre cónaithe duit.\u003c/p>\n\n  \u003ch2>15. Teagmháil\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>"};
