umatori del tuo paese di residenza.\u003c/p>\n\n  \u003ch2>15. Contatti\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","pt":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Última atualização: 24/09/2026\u003c/p>\n\n  \u003ch2>1. Quem somos e o que oferecemos\u003c/h2>\n  \u003cp>O titular da cesta. é \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Para qualquer questão, escreva para cestafitness@gmail.com.\u003c/p>\n  \u003cp>A cesta. é uma ferramenta de planeamento de refeições, cálculo de macronutrientes, acompanhamento de peso e medidas, e planeamento e registo de treinos. Inclui identificação de alimentos por fotografia e por código de barras, um chat com inteligência artificial, receitas, exercícios com demonstrações animadas, secções de Gravidez e Bebé, jejum intermitente, ligação a aplicações de saúde, e uma comunidade e um motor de pesquisa de treinadores opcionais. Não é um dispositivo médico nem um serviço de aconselhamento nutricional profissional.\u003c/p>\n\n  \u003ch2>2. A sua conta\u003c/h2>\n  \u003cp>É responsável por manter a sua palavra-passe segura. Deve ter pelo menos 18 anos para criar uma conta. A informação do seu perfil deve ser verdadeira.\u003c/p>\n\n  \u003ch2>3. Comunidade e conteúdo partilhado\u003c/h2>\n  \u003cp>O seu perfil é privado por defeito. Se o tornar público ou aceitar uma amizade, essa pessoa verá as suas ementas e fotografias. Não carregue conteúdo que viole direitos de terceiros nem que identifique outras pessoas sem o seu consentimento.\u003c/p>\n  \u003cp>\u003cstrong>Conteúdo proibido.\u003c/strong> Não é permitido carregar, enviar por chat nem tentar fazer passar por uma pesquisa de técnica de exercício qualquer conteúdo sexual, de nudez ou sugestivo; violento, gráfico ou perturbador; racista, homofóbico, de ódio ou discriminatório por qualquer motivo (origem, religião, orientação sexual, identidade de género, deficiência ou outro); ou ilegal nos termos de qualquer lei aplicável, incluindo qualquer conteúdo que envolva ou sexualize menores. Isto aplica-se a fotografias de perfil, de progresso, de comida e de produtos contribuídos, às mensagens de chat entre treinador e atleta ou entre utilizadores, e a qualquer texto utilizado para pesquisar vídeos de técnica.\u003c/p>\n  \u003cp>Todas as fotografias que carregar passam por um filtro automático de moderação com inteligência artificial antes de serem aceites (mais detalhes na Política de Privacidade). Tentar contornar o filtro ou carregar repetidamente conteúdo proibido é motivo de suspensão ou encerramento imediato da sua conta, sem direito a reembolso do plano pago ativo, e sem prejuízo de informarmos as autoridades competentes quando a lei nos obrigue.\u003c/p>\n  \u003cp>Mantém todos os direitos sobre o conteúdo que carrega. Concede-nos autorização, apenas para lhe prestar o serviço, para o armazenar, mostrá-lo às pessoas com quem decidir partilhá-lo e tratá-lo conforme explicado na Política de Privacidade.\u003c/p>\n\n  \u003ch2>4. Conteúdo gerado por IA\u003c/h2>\n  \u003cp>As estimativas obtidas através da análise de fotografias, do chat com IA ou dos resumos automáticos são aproximadas e podem conter erros. Verifique-as sempre e não as considere aconselhamento médico.\u003c/p>\n\n  \u003ch2>5. Saúde, gravidez, bebé e treino\u003c/h2>\n  \u003cp>A informação da app destina-se à organização pessoal e constitui informação geral. Não substitui o aconselhamento de um médico, nutricionista, enfermeiro obstetra, pediatra ou treinador. Consulte um profissional antes de iniciar um programa de exercício ou alterar a sua alimentação, e especialmente se estiver grávida ou a amamentar, tiver uma doença, estiver a seguir um tratamento, ou se a informação se referir a um bebé.\u003c/p>\n\n  \u003ch2>6. Treinadores e atletas\u003c/h2>\n  \u003cp>Os treinadores que utilizam a cesta. são profissionais independentes. A cesta. facilita o contacto e as ferramentas, mas não supervisiona nem garante os seus serviços, e a relação entre treinador e atleta é exclusivamente entre eles. Os pagamentos entre treinador e atleta são geridos diretamente entre ambos, fora da app; a cesta. não cobra comissão nem intervém nessas transações. Ambos comprometem-se a tratar com respeito e confidencialidade a informação do outro.\u003c/p>\n\n  \u003ch2>7. Planos e preços\u003c/h2>\n  \u003cp>\u003cstrong>Gratuito\u003c/strong> — sem custo, com as funcionalidades básicas de planeamento, calculadora de macros, base de alimentos e receitas, lista de compras, registo de treinos, pesquisa por código de barras, importação a partir de aplicações de saúde, chat com IA e acesso à comunidade. A análise de fotografias por IA está limitada a 5 por mês e a exportação de dados a 3 vezes por mês.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mês ou 49,99 €/ano, com 7 dias de teste gratuito na primeira vez. Inclui o do plano Gratuito e, entre outras funcionalidades, análise de fotografias por IA ilimitada, exportação de dados sem limites, Cheat meals, Gravidez, Bebé, treino recomendado, acompanhamento de medidas e suporte prioritário.\u003c/p>\n  \u003cp>\u003cstrong>Familiar básico\u003c/strong> — 4,99 €/mês. Até 4 perfis sob o mesmo email e palavra-passe, cada um com o seu peso, refeições e treinos independentes, com o nível Gratuito. \u003cstrong>Familiar premium\u003c/strong> — 12,99 €/mês: igual, mas os 4 perfis têm Premium completo.\u003c/p>\n  \u003cp>\u003cstrong>Treinador\u003c/strong> — 9,99 €/mês ou 59,99 €/ano, com 7 dias de teste gratuito. É um plano autónomo que inclui o do Premium e a área «Os meus atletas» para aconselhar atletas: propor-lhes ementas e treinos, ver o seu progresso e conversar com eles por chat.\u003c/p>\n  \u003cp>O que cada plano inclui é sempre apresentado na app (ecrã «Melhorar o seu plano») e pode evoluir. Os impostos aplicáveis são apresentados antes de pagar. «Suporte prioritário» significa que a sua mensagem é atendida antes das de contas gratuitas, sem um prazo de resposta garantido.\u003c/p>\n\n  \u003ch2>7 bis. Módulo Musculação (subscrição separada)\u003c/h2>\n  \u003cp>\u003cstrong>O que é.\u003c/strong> O módulo Musculação é uma ferramenta de registo e acompanhamento pessoal: tu anotas o que já decidiste tomar (com o teu médico ou por conta própria) e a cesta. organiza-o num calendário e desenha curvas indicativas. As curvas são estimativas matemáticas que usam a semivida que indicas ou um valor indicativo de fontes públicas; não medem os teus níveis reais no sangue e podem ser inexatas.\u003c/p>\n  \u003cp>\u003cstrong>O que não é.\u003c/strong> A cesta. não dá aconselhamento médico, diagnóstico nem tratamento, e não recomenda, prescreve, calcula, ajusta nem sugere substâncias, doses ou protocolos. Não vende, fornece nem facilita a obtenção de qualquer substância, nem incentiva o seu uso, e não substitui um profissional de saúde. Muitas substâncias são medicamentos sujeitos a receita médica cuja obtenção e utilização sem controlo médico podem ser ilegais e perigosas para a tua saúde; és o único responsável pelo cumprimento da lei aplicável e pelas tuas decisões. Se tiveres sintomas de alarme, recorre a um serviço médico ou liga para o 112.\u003c/p>\n  \u003cp>\u003cstrong>Apenas maiores de 18 anos.\u003c/strong> Deves ter 18 anos ou mais e confirmas isso ao subscrever. Podemos suspender o módulo se detetarmos que é usado por um menor ou de forma contrária a estes termos.\u003c/p>\n  \u003cp>\u003cstrong>Preço e pagamento.\u003c/strong> 10 €/mês (impostos incluídos ou indicados antes de pagar), subscrição independente do teu plano (Grátis, Premium, Familiar ou Treinador) e sem período de teste gratuito. Renova-se automaticamente todos os meses até que a cances. O pagamento é processado pela Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Livre resolução e cancelamento.\u003c/strong> Ao subscrever, pedes que o serviço comece imediatamente. Como consumidor, tens 14 dias para resolver o contrato; se exerceres esse direito depois de teres usado o módulo, deverás pagar a parte proporcional do serviço já usufruído. Podes cancelar a qualquer momento a partir do próprio módulo (botão «Gerir ou cancelar a subscrição»); o cancelamento produz efeitos no final do período já pago e a subscrição deixa de se renovar. Para exercer a livre resolução, usa o botão «Exercer o meu direito de livre resolução» do módulo ou escreve-nos para o email de contacto.\u003c/p>\n  \u003cp>\u003cstrong>Os teus dados.\u003c/strong> Os dados que registas são teus: podes apagá-los todos a qualquer momento com «Eliminar todos os meus dados de Musculação» e descarregá-los com «Descarregar os meus dados de Musculação». Ao cancelares a subscrição, são conservados até que os apagues, salvo se a conta estiver inativa há 18 meses. Nenhuma outra pessoa (treinadores, amigos, Comunidade) vê estes dados. Mais detalhes na Política de privacidade.\u003c/p>\n  \u003cp>\u003cstrong>Chat com IA.\u003c/strong> Com o módulo ativo, o chat pode organizar num calendário o que lhe contares, mas não propõe substâncias, doses nem protocolos por iniciativa própria.\u003c/p>\n  \u003cp>\u003cstrong>Sem relação médico-doente e consulta médica.\u003c/strong> Usar o módulo não cria uma relação médico-doente. Antes de começar, alterar ou deixar qualquer medicamento, suplemento ou protocolo, consulta um profissional de saúde qualificado. És responsável pelas tuas decisões e pelos riscos que delas resultem. A cesta. não apoia o uso de nenhuma substância fora do que é autorizado.\u003c/p>\n  \u003cp>\u003cstrong>Legalidade e disponibilidade.\u003c/strong> Muitas das substâncias que podes registar não estão autorizadas para uso humano em todos os países, ou só são vendidas legalmente com receita médica ou para investigação. Não afirmamos que o módulo, a sua lista de substâncias ou o seu conteúdo sejam adequados, legais ou estejam disponíveis no teu país: és responsável por cumprir a legislação local. A lista de substâncias serve apenas para as selecionares pelo nome e não significa que a cesta. as aprove nem as recomende.\u003c/p>\n  \u003cp>\u003cstrong>Exatidão, IA e emergências.\u003c/strong> Os dados e as curvas baseiam-se no que introduzes e em estimativas que não verificamos, e podem ser inexatos ou incompletos. As respostas da IA são geradas automaticamente e podem conter erros. Perante uma emergência médica ou sintomas graves não dependas da app: liga para o 112 (ou para o número de emergência do teu país) ou recorre a um médico.\u003c/p>\n  \u003cp>\u003cstrong>Responsabilidade.\u003c/strong> Na medida permitida por lei, a cesta. não responde pelos danos decorrentes de decisões que tomes sobre substâncias ou tratamentos com base na informação da app. Isto não limita os direitos que a lei te reconhece como consumidor nem a nossa responsabilidade por dolo, negligência grave, morte ou danos pessoais causados por culpa nossa.\u003c/p>\n  \u003cp>\u003cstrong>Suspensão.\u003c/strong> Podemos suspender ou cancelar o módulo se detetarmos uma utilização contrária a estes termos (por exemplo, utilização por menores, venda ou promoção de substâncias ou usurpação de identidade), reembolsando a parte proporcional do período já pago e não usufruído.\u003c/p>\n\n  \u003ch2>8. Pagamentos, teste gratuito, renovação e cancelamento\u003c/h2>\n  \u003cp>Os pagamentos são processados de forma segura através da Stripe; nunca vemos nem guardamos os dados do seu cartão. As subscrições renovam-se automaticamente no final de cada período (mensal ou anual), salvo se cancelar antes. Se cancelar durante o teste gratuito, não lhe é cobrado nada.\u003c/p>\n  \u003cp>Pode cancelar, mudar de plano ou atualizar o seu método de pagamento quando quiser através do botão «Gerir» junto ao seu plano, que o leva ao portal seguro da Stripe. Se cancelar, mantém o acesso Premium até ao final do período já pago. Se um pagamento falhar, a Stripe tentará novamente a cobrança durante alguns dias; se continuar a não ser possível cobrar, a sua conta passará para o plano Gratuito até atualizar o seu método de pagamento.\u003c/p>\n  \u003cp>\u003cstrong>Direito de livre resolução.\u003c/strong> Se for consumidor, tem direito a resolver o contrato no prazo de 14 dias de calendário a contar da sua celebração (desde que inicia o teste ou o pagamento), sem necessidade de indicar qualquer motivo, escrevendo para cestafitness@gmail.com. Uma vez que o serviço digital começa imediatamente a seu pedido, se exercer esse direito terá de pagar a parte proporcional do serviço que tenha recebido até esse momento. Fora desse direito legal, não há reembolsos pelo tempo já decorrido, salvo se a lei aplicável o exigir.\u003c/p>\n\n  \u003ch2>9. Programa de convites e descontos\u003c/h2>\n  \u003cp>\u003cstrong>Convidar amigos.\u003c/strong> Quando pessoas que se registam com o seu código subscrevem um plano pago, a sua subscrição paga recebe um desconto consoante quantas dessas pessoas estejam a pagar nesse momento: 5 pessoas, 10 %; 10 pessoas, 20 %; 15 pessoas, 30 %; 20 pessoas, 40 %; 30 pessoas, 50 %. Para o receber, precisa de ter a sua própria subscrição paga ativa. O desconto é recalculado se o número de convidados que continuam a pagar se alterar, aplica-se apenas à sua própria subscrição e nunca é convertido em dinheiro.\u003c/p>\n  \u003cp>\u003cstrong>Contribuir com alimentos.\u003c/strong> Se enviar 10 alimentos num mês e os 10 forem validados, tem 5 % de desconto na sua próxima mensalidade.\u003c/p>\n  \u003cp>É proibido registar contas falsas ou utilizar o seu próprio código para obter descontos; poderemos retirá-los e suspender as contas envolvidas. Podemos modificar ou encerrar o programa mediante aviso prévio.\u003c/p>\n\n  \u003ch2>10. Propriedade intelectual e licenças\u003c/h2>\n  \u003cp>A cesta. e o seu logótipo, o design, o software, os textos e as traduções pertencem ao seu titular e estão protegidos por lei. Não pode copiar, modificar, distribuir nem efetuar engenharia inversa da aplicação sem autorização escrita.\u003c/p>\n  \u003cp>\u003cstrong>Créditos de terceiros.\u003c/strong> Parte dos dados de alimentos e produtos provém do Open Food Facts (openfoodfacts.org), disponível sob a licença Open Database License (ODbL). São utilizadas bibliotecas de código aberto (Supabase JS, jsPDF, Sentry, Capacitor, com licença MIT) e os tipos de letra Space Grotesk e Inter (licença SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Disponibilidade e limitação de responsabilidade\u003c/h2>\n  \u003cp>Fazemos o possível para que a app funcione sempre, mas pode haver interrupções por manutenção ou por causas alheias. A cesta. não se responsabiliza por decisões de saúde tomadas exclusivamente com base na informação da app; consulte sempre um profissional. Nada do que precede limita os direitos que a lei reconhece aos consumidores.\u003c/p>\n\n  \u003ch2>12. Cessação da relação\u003c/h2>\n  \u003cp>Pode eliminar a sua conta e todos os seus dados a qualquer momento a partir do seu perfil. Podemos suspender ou encerrar uma conta que incumpra estes termos.\u003c/p>\n\n  \u003ch2>13. Alterações a estes termos\u003c/h2>\n  \u003cp>Notificaremos qualquer alteração relevante com pelo menos 30 dias de antecedência.\u003c/p>\n\n  \u003ch2>14. Lei aplicável\u003c/h2>\n  \u003cp>Estes termos regem-se pela lei espanhola. Se for consumidor, pode recorrer aos tribunais do seu domicílio e mantém os direitos que lhe são reconhecidos pela legislação de consumo do seu país de residência.\u003c/p>\n\n  \u003ch2>15. Contacto\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","nl":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Laatst bijgewerkt: 24-09-2026\u003c/p>\n\n  \u003ch2>1. Wie wij zijn en wat wij aanbieden\u003c/h2>\n  \u003cp>De eigenaar van cesta. is \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Voor vragen kun je schrijven naar cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. is een hulpmiddel voor maaltijdplanning, berekening van macronutriënten, bijhouden van gewicht en maten, en planning en registratie van trainingen. Het omvat herkenning van voedingsmiddelen via foto en streepjescode, een chat met kunstmatige intelligentie, recepten, oefeningen met geanimeerde demonstraties, onderdelen voor Zwangerschap en Baby, intermittent fasting, koppeling met gezondheidsapps, en een optionele community en zoekmachine voor trainers. Het is geen medisch hulpmiddel en geen dienst voor professioneel voedingsadvies.\u003c/p>\n\n  \u003ch2>2. Jouw account\u003c/h2>\n  \u003cp>Je bent verantwoordelijk voor het veilig houden van je wachtwoord. Je moet minimaal 18 jaar oud zijn om een account aan te maken. De informatie in je profiel moet naar waarheid zijn.\u003c/p>\n\n  \u003ch2>3. Community en gedeelde inhoud\u003c/h2>\n  \u003cp>Je profiel is standaard privé. Als je het openbaar maakt of een vriendschap accepteert, ziet die persoon je menu’s en foto’s. Upload geen inhoud die inbreuk maakt op rechten van derden of die andere personen zonder hun toestemming identificeert.\u003c/p>\n  \u003cp>\u003cstrong>Verboden inhoud.\u003c/strong> Het is niet toegestaan om inhoud te uploaden, via de chat te verzenden of te laten doorgaan voor een zoekopdracht naar oefentechniek die seksueel, naakt of suggestief is; gewelddadig, grafisch of schokkend; racistisch, homofoob, haatdragend of om welke reden dan ook discriminerend (afkomst, religie, seksuele geaardheid, genderidentiteit, handicap of anders); of onwettig is volgens enig toepasselijk recht, met inbegrip van inhoud waarbij minderjarigen betrokken zijn of geseksualiseerd worden. Dit geldt voor profielfoto’s, voortgangsfoto’s, voedingsfoto’s en foto’s van bijgedragen producten, voor chatberichten tussen trainer en atleet of tussen gebruikers, en voor elke tekst die wordt gebruikt om techniekvideo’s te zoeken.\u003c/p>\n  \u003cp>Alle foto’s die je uploadt doorlopen een automatisch moderatiefilter met kunstmatige intelligentie voordat zij worden geaccepteerd (meer details in het Privacybeleid). Het proberen te omzeilen van het filter of het herhaaldelijk uploaden van verboden inhoud is reden voor onmiddellijke opschorting of beëindiging van je account, zonder recht op terugbetaling van het actieve betaalde abonnement, onverminderd ons recht om de bevoegde autoriteiten te informeren wanneer de wet ons daartoe verplicht.\u003c/p>\n  \u003cp>Je behoudt alle rechten op de inhoud die je uploadt. Je geeft ons toestemming, uitsluitend om je de dienst te leveren, om deze op te slaan, te tonen aan de personen met wie je besluit die te delen en te verwerken zoals uitgelegd in het Privacybeleid.\u003c/p>\n\n  \u003ch2>4. Door AI gegenereerde inhoud\u003c/h2>\n  \u003cp>De schattingen die voortkomen uit fotoanalyse, de chat met AI of de automatische samenvattingen zijn bij benadering en kunnen fouten bevatten. Controleer ze altijd en beschouw ze niet als medisch advies.\u003c/p>\n\n  \u003ch2>5. Gezondheid, zwangerschap, baby en training\u003c/h2>\n  \u003cp>De informatie in de app dient voor persoonlijke organisatie en algemene informatie. Zij vervangt het advies van een arts, diëtist, verloskundige, kinderarts of trainer niet. Raadpleeg een professional voordat je een trainingsprogramma begint of je voeding wijzigt, en met name als je zwanger bent of borstvoeding geeft, een ziekte hebt, een behandeling volgt, of als de informatie betrekking heeft op een baby.\u003c/p>\n\n  \u003ch2>6. Trainers en atleten\u003c/h2>\n  \u003cp>De trainers die cesta. gebruiken zijn zelfstandige professionals. cesta. faciliteert het contact en de hulpmiddelen, maar houdt geen toezicht op hun diensten en geeft daarvoor geen garantie, en de relatie tussen trainer en atleet bestaat uitsluitend tussen hen. Betalingen tussen trainer en atleet worden rechtstreeks tussen beiden afgehandeld, buiten de app; cesta. rekent geen commissie en is niet betrokken bij die transacties. Beiden verbinden zich ertoe de informatie van de ander met respect en vertrouwelijk te behandelen.\u003c/p>\n\n  \u003ch2>7. Abonnementen en prijzen\u003c/h2>\n  \u003cp>\u003cstrong>Gratis\u003c/strong> — kosteloos, met de basisfuncties voor planning, macrocalculator, voedingsmiddelen- en receptendatabase, boodschappenlijst, trainingsregistratie, zoeken op streepjescode, importeren uit gezondheidsapps, chat met AI en toegang tot de community. De fotoanalyse met AI is beperkt tot 5 per maand en de gegevensexport tot 3 keer per maand.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — € 7,99/maand of € 49,99/jaar, met 7 dagen gratis proefperiode de eerste keer. Omvat alles van het abonnement Gratis en, onder meer, onbeperkte fotoanalyse met AI, onbeperkte gegevensexport, Cheat meals, Zwangerschap, Baby, aanbevolen training, het bijhouden van maten en prioritaire ondersteuning.\u003c/p>\n  \u003cp>\u003cstrong>Gezin basis\u003c/strong> — € 4,99/maand. Maximaal 4 profielen onder hetzelfde e-mailadres en wachtwoord, elk met een eigen, onafhankelijk gewicht, eigen maaltijden en trainingen, met het niveau Gratis. \u003cstrong>Gezin premium\u003c/strong> — € 12,99/maand: hetzelfde, maar alle 4 de profielen hebben volledig Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trainer\u003c/strong> — € 9,99/maand of € 59,99/jaar, met 7 dagen gratis proefperiode. Dit is een apart abonnement dat alles van Premium omvat en het gedeelte “Mijn atleten” om atleten te begeleiden: hun menu’s en trainingen voorstellen, hun voortgang bekijken en met hen chatten.\u003c/p>\n  \u003cp>Wat elk abonnement omvat, wordt altijd in de app getoond (scherm “Je abonnement verbeteren”) en kan zich ontwikkelen. De toepasselijke belastingen worden getoond voordat je betaalt. “Prioritaire ondersteuning” betekent dat je bericht eerder wordt behandeld dan die van gratis accounts, zonder gegarandeerde reactietijd.\u003c/p>\n\n  \u003ch2>7 bis. Module Bodybuilding (apart abonnement)\u003c/h2>\n  \u003cp>\u003cstrong>Wat het is.\u003c/strong> De module Bodybuilding is een hulpmiddel voor persoonlijke registratie en opvolging: jij noteert wat je al hebt besloten in te nemen (met je arts of op eigen initiatief) en cesta. ordent dit in een kalender en tekent indicatieve curven. De curven zijn wiskundige schattingen op basis van de halfwaardetijd die jij opgeeft of een indicatieve waarde uit openbare bronnen; ze meten je werkelijke bloedspiegels niet en kunnen onnauwkeurig zijn.\u003c/p>\n  \u003cp>\u003cstrong>Wat het niet is.\u003c/strong> cesta. geeft geen medisch advies, diagnose of behandeling en beveelt geen stoffen, doses of schema's aan, schrijft ze niet voor, berekent, past of stelt ze niet voor. cesta. verkoopt of levert geen enkele stof, helpt niet bij het verkrijgen ervan, moedigt het gebruik ervan niet aan en vervangt geen zorgprofessional. Veel stoffen zijn receptplichtige geneesmiddelen waarvan het verkrijgen en gebruiken zonder medisch toezicht illegaal en gevaarlijk voor je gezondheid kan zijn; jij bent als enige verantwoordelijk voor de naleving van de toepasselijke wetgeving en voor je beslissingen. Heb je alarmerende symptomen, ga dan naar een medische dienst of bel 112.\u003c/p>\n  \u003cp>\u003cstrong>Alleen vanaf 18 jaar.\u003c/strong> Je moet 18 jaar of ouder zijn en dit bevestig je bij het afsluiten. Wij kunnen de module opschorten als we vaststellen dat een minderjarige de module gebruikt of dat deze in strijd met deze voorwaarden wordt gebruikt.\u003c/p>\n  \u003cp>\u003cstrong>Prijs en betaling.\u003c/strong> 10 €/maand (inclusief belastingen of getoond vóór betaling), een abonnement dat los staat van je plan (Gratis, Premium, Gezin of Trainer) en zonder gratis proefperiode. Het wordt elke maand automatisch verlengd totdat je opzegt. De betaling wordt verwerkt door Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Herroeping en opzegging.\u003c/strong> Door af te sluiten verzoek je dat de dienst onmiddellijk begint. Als consument heb je 14 dagen om de overeenkomst te herroepen; als je dit recht uitoefent nadat je de module hebt gebruikt, moet je het evenredige deel van de reeds genoten dienst betalen. Je kunt op elk moment opzeggen vanuit de module zelf (knop «Abonnement beheren of opzeggen»); de opzegging gaat in aan het einde van de reeds betaalde periode en het abonnement wordt niet meer verlengd. Om te herroepen gebruik je de knop «Mijn herroepingsrecht uitoefenen» in de module of schrijf je ons op het contact-e-mailadres.\u003c/p>\n  \u003cp>\u003cstrong>Je gegevens.\u003c/strong> De gegevens die je registreert zijn van jou: je kunt ze op elk moment allemaal verwijderen met «Al mijn Bodybuilding-gegevens verwijderen» en downloaden met «Mijn Bodybuilding-gegevens downloaden». Wanneer je het abonnement opzegt, worden ze bewaard totdat je ze verwijdert, tenzij het account 18 maanden inactief is. Niemand anders (trainers, vrienden, Community) ziet deze gegevens. Meer details in het Privacybeleid.\u003c/p>\n  \u003cp>\u003cstrong>AI-chat.\u003c/strong> Met de module actief kan de chat in een kalender ordenen wat jij vertelt, maar stelt hij uit eigen beweging geen stoffen, doses of schema's voor.\u003c/p>\n  \u003cp>\u003cstrong>Geen arts-patiëntrelatie en medisch overleg.\u003c/strong> Het gebruik van de module creëert geen arts-patiëntrelatie. Raadpleeg een gekwalificeerde zorgprofessional voordat je een geneesmiddel, supplement of schema begint, wijzigt of stopt. Je bent verantwoordelijk voor je beslissingen en de risico's die deze met zich meebrengen. cesta. keurt het gebruik van geen enkele stof buiten het toegestane goed.\u003c/p>\n  \u003cp>\u003cstrong>Wettigheid en beschikbaarheid.\u003c/strong> Veel van de stoffen die je kunt registreren zijn niet in alle landen toegelaten voor menselijk gebruik of worden alleen op recept of voor onderzoek legaal verkocht. Wij beweren niet dat de module, de lijst met stoffen of de inhoud geschikt, legaal of beschikbaar zijn in jouw land: je bent zelf verantwoordelijk voor de naleving van de lokale regelgeving. De lijst met stoffen dient uitsluitend om ze op naam te selecteren en betekent niet dat cesta. ze goedkeurt of aanbeveelt.\u003c/p>\n  \u003cp>\u003cstrong>Nauwkeurigheid, AI en noodgevallen.\u003c/strong> De gegevens en curven zijn gebaseerd op wat jij invoert en op schattingen die wij niet verifiëren, en kunnen onnauwkeurig of onvolledig zijn. AI-antwoorden worden automatisch gegenereerd en kunnen fouten bevatten. Vertrouw bij een medisch noodgeval of ernstige symptomen niet op de app: bel 112 (of het alarmnummer van jouw land) of ga naar een arts.\u003c/p>\n  \u003cp>\u003cstrong>Aansprakelijkheid.\u003c/strong> Voor zover de wet dit toestaat, is cesta. niet aansprakelijk voor schade die voortvloeit uit beslissingen die jij neemt over stoffen of behandelingen op basis van de informatie in de app. Dit beperkt niet de rechten die de wet je als consument toekent, noch onze aansprakelijkheid voor opzet, grove nalatigheid, overlijden of persoonlijk letsel veroorzaakt door onze schuld.\u003c/p>\n  \u003cp>\u003cstrong>Opschorting.\u003c/strong> Wij kunnen de module opschorten of beëindigen als we gebruik in strijd met deze voorwaarden vaststellen (bijvoorbeeld gebruik door minderjarigen, verkoop of promotie van stoffen of identiteitsfraude), waarbij wij het evenredige deel van de reeds betaalde en niet genoten periode terugbetalen.\u003c/p>\n\n  \u003ch2>8. Betalingen, gratis proefperiode, verlenging en opzegging\u003c/h2>\n  \u003cp>Betalingen worden veilig verwerkt via Stripe; wij zien of bewaren de gegevens van je kaart nooit. Abonnementen worden automatisch verlengd aan het einde van elke periode (maandelijks of jaarlijks), tenzij je eerder opzegt. Als je opzegt tijdens de gratis proefperiode, wordt er niets in rekening gebracht.\u003c/p>\n  \u003cp>Je kunt op elk moment opzeggen, van abonnement wisselen of je betaalmethode bijwerken via de knop “Beheren” naast je abonnement, die je naar het beveiligde portaal van Stripe leidt. Als je opzegt, behoud je de Premium-toegang tot het einde van de reeds betaalde periode. Als een betaling mislukt, probeert Stripe de incasso gedurende enkele dagen opnieuw; als incasso nog steeds niet lukt, gaat je account over naar het abonnement Gratis totdat je je betaalmethode bijwerkt.\u003c/p>\n  \u003cp>\u003cstrong>Herroepingsrecht.\u003c/strong> Als je consument bent, heb je het recht om binnen 14 kalenderdagen na het sluiten van de overeenkomst (vanaf het moment dat je de proefperiode of de betaling start) zonder opgave van redenen van de overeenkomst af te zien door te schrijven naar cestafitness@gmail.com. Aangezien de digitale dienst op jouw verzoek onmiddellijk begint, moet je bij herroeping het evenredige deel betalen van de dienst die je tot dat moment hebt ontvangen. Buiten dit wettelijke recht is er geen terugbetaling voor de reeds verstreken tijd, tenzij het toepasselijke recht dit vereist.\u003c/p>\n\n  \u003ch2>9. Uitnodigingsprogramma en kortingen\u003c/h2>\n  \u003cp>\u003cstrong>Vrienden uitnodigen.\u003c/strong> Wanneer personen die zich met jouw code registreren een betaald abonnement afsluiten, ontvangt jouw betaalde abonnement een korting afhankelijk van hoeveel van die personen op dat moment betalen: 5 personen, 10%; 10 personen, 20%; 15 personen, 30%; 20 personen, 40%; 30 personen, 50%. Om de korting te ontvangen, moet je zelf een actief betaald abonnement hebben. De korting wordt opnieuw berekend als het aantal uitgenodigden dat blijft betalen verandert, geldt alleen voor je eigen abonnement en wordt nooit in geld omgezet.\u003c/p>\n  \u003cp>\u003cstrong>Voedingsmiddelen bijdragen.\u003c/strong> Als je in één maand 10 voedingsmiddelen indient en alle 10 worden gevalideerd, krijg je 5% korting op je volgende termijn.\u003c/p>\n  \u003cp>Het is verboden nepaccounts te registreren of je eigen code te gebruiken om kortingen te verkrijgen; wij kunnen deze intrekken en de betrokken accounts opschorten. Wij kunnen het programma wijzigen of beëindigen met voorafgaande kennisgeving.\u003c/p>\n\n  \u003ch2>10. Intellectueel eigendom en licenties\u003c/h2>\n  \u003cp>cesta. en het logo, het ontwerp, de software, de teksten en de vertalingen zijn eigendom van de titularis en zijn wettelijk beschermd. Je mag de applicatie niet kopiëren, wijzigen, verspreiden of reverse-engineeren zonder schriftelijke toestemming.\u003c/p>\n  \u003cp>\u003cstrong>Erkenning van derden.\u003c/strong> Een deel van de gegevens over voedingsmiddelen en producten is afkomstig van Open Food Facts (openfoodfacts.org), beschikbaar onder de Open Database License (ODbL). Er worden opensourcebibliotheken gebruikt (Supabase JS, jsPDF, Sentry, Capacitor, met MIT-licentie) en de lettertypen Space Grotesk en Inter (SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Beschikbaarheid en beperking van aansprakelijkheid\u003c/h2>\n  \u003cp>Wij doen ons best om de app altijd te laten werken, maar er kunnen onderbrekingen zijn wegens onderhoud of door oorzaken buiten onze controle. cesta. is niet aansprakelijk voor gezondheidsbeslissingen die uitsluitend op basis van de informatie in de app worden genomen; raadpleeg altijd een professional. Niets van het voorgaande beperkt de rechten die de wet aan consumenten toekent.\u003c/p>\n\n  \u003ch2>12. Beëindiging van de relatie\u003c/h2>\n  \u003cp>Je kunt je account en al je gegevens op elk moment verwijderen via je profiel. Wij kunnen een account opschorten of beëindigen dat deze voorwaarden schendt.\u003c/p>\n\n  \u003ch2>13. Wijzigingen in deze voorwaarden\u003c/h2>\n  \u003cp>Wij melden elke relevante wijziging ten minste 30 dagen van tevoren.\u003c/p>\n\n  \u003ch2>14. Toepasselijk recht\u003c/h2>\n  \u003cp>Op deze voorwaarden is Spaans recht van toepassing. Als je consument bent, kun je je wenden tot de rechtbanken van je woonplaats en behoud je de rechten die de consumentenwetgeving van je land van verblijf je toekent.\u003c/p>\n\n  \u003ch2>15. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","pl":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Ostatnia aktualizacja: 24.09.2026\u003c/p>\n\n  \u003ch2>1. Kim jesteśmy i co oferujemy\u003c/h2>\n  \u003cp>Właścicielem cesta. jest \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). W przypadku jakichkolwiek pytań napisz na adres cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. to narzędzie do planowania posiłków, obliczania makroskładników, śledzenia masy ciała i wymiarów oraz planowania i rejestrowania treningów. Obejmuje rozpoznawanie produktów spożywczych na podstawie zdjęcia i kodu kreskowego, czat ze sztuczną inteligencją, przepisy, ćwiczenia z animowanymi demonstracjami, sekcje Ciąża i Niemowlę, post przerywany, połączenie z aplikacjami zdrowotnymi oraz opcjonalną społeczność i wyszukiwarkę trenerów. Nie jest wyrobem medycznym ani usługą profesjonalnego doradztwa żywieniowego.\u003c/p>\n\n  \u003ch2>2. Twoje konto\u003c/h2>\n  \u003cp>Odpowiadasz za zachowanie hasła w bezpiecznym miejscu. Aby założyć konto, musisz mieć ukończone co najmniej 18 lat. Informacje w Twoim profilu muszą być prawdziwe.\u003c/p>\n\n  \u003ch2>3. Społeczność i udostępniane treści\u003c/h2>\n  \u003cp>Twój profil jest domyślnie prywatny. Jeśli ustawisz go jako publiczny lub zaakceptujesz zaproszenie do grona znajomych, ta osoba zobaczy Twoje jadłospisy i zdjęcia. Nie przesyłaj treści naruszających prawa osób trzecich ani identyfikujących inne osoby bez ich zgody.\u003c/p>\n  \u003cp>\u003cstrong>Treści zakazane.\u003c/strong> Zabronione jest przesyłanie, wysyłanie przez czat ani podszywanie się pod wyszukiwanie techniki ćwiczeń jakichkolwiek treści seksualnych, przedstawiających nagość lub sugestywnych; brutalnych, drastycznych lub wstrząsających; rasistowskich, homofobicznych, szerzących nienawiść lub dyskryminujących z jakiegokolwiek powodu (pochodzenie, religia, orientacja seksualna, tożsamość płciowa, niepełnosprawność lub inny); ani niezgodnych z prawem na podstawie jakichkolwiek obowiązujących przepisów, w tym wszelkich treści, które angażują lub seksualizują małoletnich. Dotyczy to zdjęć profilowych, zdjęć postępów, zdjęć jedzenia i dodawanych produktów, wiadomości na czacie między trenerem a podopiecznym lub między użytkownikami oraz każdego tekstu używanego do wyszukiwania filmów z techniką.\u003c/p>\n  \u003cp>Wszystkie przesyłane przez Ciebie zdjęcia przechodzą przed zaakceptowaniem przez automatyczny filtr moderacji oparty na sztucznej inteligencji (więcej szczegółów w Polityce prywatności). Próba obejścia filtra lub wielokrotne przesyłanie zakazanych treści stanowi podstawę do natychmiastowego zawieszenia lub zamknięcia Twojego konta, bez prawa do zwrotu opłaty za aktywny płatny plan, oraz bez uszczerbku dla naszego prawa do poinformowania właściwych organów, gdy zobowiązuje nas do tego prawo.\u003c/p>\n  \u003cp>Zachowujesz wszelkie prawa do przesyłanych przez siebie treści. Udzielasz nam zezwolenia, wyłącznie w celu świadczenia Ci usługi, na ich przechowywanie, wyświetlanie osobom, którym zdecydujesz się je udostępnić, oraz przetwarzanie zgodnie z opisem w Polityce prywatności.\u003c/p>\n\n  \u003ch2>4. Treści generowane przez AI\u003c/h2>\n  \u003cp>Szacunki uzyskane w wyniku analizy zdjęć, czatu z AI lub automatycznych podsumowań są przybliżone i mogą zawierać błędy. Zawsze je weryfikuj i nie traktuj ich jako porady medycznej.\u003c/p>\n\n  \u003ch2>5. Zdrowie, ciąża, niemowlę i trening\u003c/h2>\n  \u003cp>Informacje w aplikacji służą osobistej organizacji i mają charakter ogólny. Nie zastępują porady lekarza, dietetyka, położnej, pediatry ani trenera. Skonsultuj się ze specjalistą przed rozpoczęciem programu ćwiczeń lub zmianą diety, a zwłaszcza jeśli jesteś w ciąży lub karmisz piersią, chorujesz, jesteś w trakcie leczenia albo jeśli informacje dotyczą niemowlęcia.\u003c/p>\n\n  \u003ch2>6. Trenerzy i podopieczni\u003c/h2>\n  \u003cp>Trenerzy korzystający z cesta. są niezależnymi specjalistami. cesta. ułatwia kontakt i udostępnia narzędzia, ale nie nadzoruje ich usług ani nie gwarantuje ich jakości, a relacja między trenerem a podopiecznym dotyczy wyłącznie ich obojga. Płatności między trenerem a podopiecznym są rozliczane bezpośrednio między nimi, poza aplikacją; cesta. nie pobiera prowizji ani nie uczestniczy w tych transakcjach. Obie strony zobowiązują się traktować informacje drugiej strony z szacunkiem i zachować je w poufności.\u003c/p>\n\n  \u003ch2>7. Plany i ceny\u003c/h2>\n  \u003cp>\u003cstrong>Bezpłatny\u003c/strong> — bez opłat, z podstawowymi funkcjami planowania, kalkulatorem makroskładników, bazą produktów i przepisów, listą zakupów, rejestrem treningów, wyszukiwaniem po kodzie kreskowym, importem z aplikacji zdrowotnych, czatem z AI i dostępem do społeczności. Analiza zdjęć przez AI jest ograniczona do 5 miesięcznie, a eksport danych do 3 razy w miesiącu.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/miesiąc lub 49,99 €/rok, z 7-dniowym bezpłatnym okresem próbnym przy pierwszym zakupie. Obejmuje wszystko, co plan Bezpłatny, oraz między innymi nieograniczoną analizę zdjęć przez AI, nieograniczony eksport danych, Cheat meals, Ciążę, Niemowlę, zalecany trening, śledzenie wymiarów i priorytetowe wsparcie.\u003c/p>\n  \u003cp>\u003cstrong>Rodzinny podstawowy\u003c/strong> — 4,99 €/miesiąc. Do 4 profili pod tym samym adresem e-mail i hasłem, każdy z własną, niezależną masą ciała, posiłkami i treningami, na poziomie Bezpłatnym. \u003cstrong>Rodzinny premium\u003c/strong> — 12,99 €/miesiąc: tak samo, ale wszystkie 4 profile mają pełny Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trener\u003c/strong> — 9,99 €/miesiąc lub 59,99 €/rok, z 7-dniowym bezpłatnym okresem próbnym. Jest to odrębny plan, który obejmuje wszystko, co Premium, oraz obszar „Moi podopieczni” służący do doradzania podopiecznym: proponowania im jadłospisów i treningów, przeglądania ich postępów i czatowania z nimi.\u003c/p>\n  \u003cp>To, co obejmuje każdy plan, jest zawsze wyświetlane w aplikacji (ekran „Ulepsz swój plan”) i może ulegać zmianom. Należne podatki są wyświetlane przed dokonaniem płatności. „Priorytetowe wsparcie” oznacza, że Twoja wiadomość jest obsługiwana przed wiadomościami z kont bezpłatnych, bez gwarantowanego czasu odpowiedzi.\u003c/p>\n\n  \u003ch2>7 bis. Moduł Kulturystyka (odrębna subskrypcja)\u003c/h2>\n  \u003cp>\u003cstrong>Czym jest.\u003c/strong> Moduł Kulturystyka to narzędzie do osobistego prowadzenia zapisów i monitorowania: Ty notujesz to, co już postanowiłeś(-aś) przyjmować (z lekarzem lub na własną rękę), a cesta. porządkuje to w kalendarzu i rysuje orientacyjne krzywe. Krzywe są matematycznymi szacunkami, które wykorzystują podany przez Ciebie okres półtrwania lub orientacyjną wartość z publicznych źródeł; nie mierzą Twoich rzeczywistych poziomów we krwi i mogą być niedokładne.\u003c/p>\n  \u003cp>\u003cstrong>Czym nie jest.\u003c/strong> cesta. nie udziela porad medycznych, nie stawia diagnoz ani nie zapewnia leczenia oraz nie zaleca, nie przepisuje, nie oblicza, nie modyfikuje ani nie sugeruje substancji, dawek ani schematów. Nie sprzedaje ani nie dostarcza żadnej substancji, nie pomaga w jej zdobyciu, nie zachęca do jej stosowania i nie zastępuje pracownika ochrony zdrowia. Wiele substancji to leki na receptę, których zdobywanie i stosowanie bez nadzoru lekarskiego może być nielegalne i niebezpieczne dla Twojego zdrowia; wyłącznie Ty odpowiadasz za przestrzeganie obowiązującego prawa i za swoje decyzje. Jeśli masz niepokojące objawy, zwróć się do placówki medycznej lub zadzwoń pod numer 112.\u003c/p>\n  \u003cp>\u003cstrong>Tylko dla osób pełnoletnich (18+).\u003c/strong> Musisz mieć ukończone 18 lat i potwierdzasz to przy zawieraniu umowy. Możemy zawiesić moduł, jeśli stwierdzimy, że korzysta z niego osoba niepełnoletnia lub że jest używany w sposób sprzeczny z niniejszymi warunkami.\u003c/p>\n  \u003cp>\u003cstrong>Cena i płatność.\u003c/strong> 10 €/mies. (z podatkami lub z podatkami wyświetlonymi przed zapłatą), subskrypcja niezależna od Twojego planu (Bezpłatny, Premium, Rodzinny lub Trener), bez bezpłatnego okresu próbnego. Odnawia się automatycznie co miesiąc, dopóki jej nie anulujesz. Płatność przetwarza Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Odstąpienie od umowy i anulowanie.\u003c/strong> Zawierając umowę, wnosisz o natychmiastowe rozpoczęcie świadczenia usługi. Jako konsument masz 14 dni na odstąpienie od umowy; jeśli skorzystasz z tego prawa po tym, jak zaczniesz korzystać z modułu, będziesz musiał(-a) zapłacić proporcjonalną część usługi, z której już skorzystałeś(-aś). Możesz anulować w dowolnym momencie z poziomu samego modułu (przycisk „Zarządzaj subskrypcją lub ją anuluj”); anulowanie zaczyna obowiązywać z końcem opłaconego już okresu i subskrypcja nie odnawia się ponownie. Aby odstąpić od umowy, użyj przycisku „Skorzystaj z prawa odstąpienia od umowy” w module lub napisz do nas na adres e-mail kontaktowy.\u003c/p>\n  \u003cp>\u003cstrong>Twoje dane.\u003c/strong> Dane, które zapisujesz, należą do Ciebie: możesz usunąć je wszystkie w dowolnym momencie za pomocą „Usuń wszystkie moje dane z modułu Kulturystyka” oraz pobrać za pomocą „Pobierz moje dane z modułu Kulturystyka”. Po anulowaniu subskrypcji są przechowywane do czasu ich usunięcia przez Ciebie, chyba że konto jest nieaktywne od 18 miesięcy. Żadna inna osoba (trenerzy, znajomi, Społeczność) nie widzi tych danych. Więcej szczegółów w Polityce prywatności.\u003c/p>\n  \u003cp>\u003cstrong>Czat z AI.\u003c/strong> Przy aktywnym module czat może uporządkować w kalendarzu to, co mu powiesz, ale z własnej inicjatywy nie proponuje substancji, dawek ani schematów.\u003c/p>\n  \u003cp>\u003cstrong>Brak relacji lekarz-pacjent i konsultacja lekarska.\u003c/strong> Korzystanie z modułu nie tworzy relacji lekarz-pacjent. Przed rozpoczęciem, zmianą lub zaprzestaniem przyjmowania jakiegokolwiek leku, suplementu lub schematu skonsultuj się z wykwalifikowanym pracownikiem ochrony zdrowia. Ponosisz odpowiedzialność za swoje decyzje i związane z nimi ryzyko. cesta. nie popiera stosowania żadnej substancji poza tym, co jest dozwolone.\u003c/p>\n  \u003cp>\u003cstrong>Legalność i dostępność.\u003c/strong> Wiele substancji, które możesz zapisywać, nie jest dopuszczonych do stosowania u ludzi we wszystkich krajach lub jest legalnie sprzedawanych wyłącznie na receptę albo do celów badawczych. Nie twierdzimy, że moduł, jego lista substancji ani jego treść są odpowiednie, legalne lub dostępne w Twoim kraju: odpowiadasz za przestrzeganie lokalnych przepisów. Lista substancji służy wyłącznie do ich wyboru po nazwie i nie oznacza, że cesta. je zatwierdza ani zaleca.\u003c/p>\n  \u003cp>\u003cstrong>Dokładność, AI i nagłe przypadki.\u003c/strong> Dane i krzywe opierają się na tym, co wprowadzasz, oraz na szacunkach, których nie weryfikujemy, i mogą być niedokładne lub niekompletne. Odpowiedzi AI są generowane automatycznie i mogą zawierać błędy. W nagłym przypadku medycznym lub przy poważnych objawach nie polegaj na aplikacji: zadzwoń pod numer 112 (lub numer alarmowy swojego kraju) albo zgłoś się do lekarza.\u003c/p>\n  \u003cp>\u003cstrong>Odpowiedzialność.\u003c/strong> W zakresie dozwolonym przez prawo cesta. nie ponosi odpowiedzialności za szkody wynikające z decyzji, które podejmujesz w sprawie substancji lub terapii na podstawie informacji zawartych w aplikacji. Nie ogranicza to praw przysługujących Ci z mocy prawa jako konsumentowi ani naszej odpowiedzialności za winę umyślną, rażące niedbalstwo, śmierć lub uszkodzenie ciała spowodowane z naszej winy.\u003c/p>\n  \u003cp>\u003cstrong>Zawieszenie.\u003c/strong> Możemy zawiesić lub anulować moduł, jeśli stwierdzimy korzystanie sprzeczne z niniejszymi warunkami (na przykład korzystanie przez osoby niepełnoletnie, sprzedaż lub promowanie substancji albo podszywanie się pod inną osobę), zwracając proporcjonalną część okresu już opłaconego, a niewykorzystanego.\u003c/p>\n\n  \u003ch2>8. Płatności, bezpłatny okres próbny, odnowienie i rezygnacja\u003c/h2>\n  \u003cp>Płatności są bezpiecznie przetwarzane za pośrednictwem Stripe; nigdy nie widzimy ani nie przechowujemy danych Twojej karty. Subskrypcje odnawiają się automatycznie na koniec każdego okresu (miesięcznego lub rocznego), chyba że wcześniej zrezygnujesz. Jeśli zrezygnujesz w trakcie bezpłatnego okresu próbnego, nie zostanie pobrana żadna opłata.\u003c/p>\n  \u003cp>Możesz w dowolnym momencie zrezygnować, zmienić plan lub zaktualizować metodę płatności za pomocą przycisku „Zarządzaj” obok swojego planu, który przenosi do bezpiecznego portalu Stripe. Jeśli zrezygnujesz, zachowasz dostęp do Premium do końca już opłaconego okresu. Jeśli płatność się nie powiedzie, Stripe będzie ponawiać próbę pobrania opłaty przez kilka dni; jeśli nadal nie będzie można jej pobrać, Twoje konto zostanie przeniesione na plan Bezpłatny do czasu aktualizacji metody płatności.\u003c/p>\n  \u003cp>\u003cstrong>Prawo odstąpienia od umowy.\u003c/strong> Jeśli jesteś konsumentem, przysługuje Ci prawo do odstąpienia od umowy w terminie 14 dni kalendarzowych od jej zawarcia (od rozpoczęcia okresu próbnego lub płatności), bez podawania przyczyny, poprzez wiadomość na adres cestafitness@gmail.com. Ponieważ usługa cyfrowa rozpoczyna się natychmiast na Twoje żądanie, w razie odstąpienia będziesz zobowiązany zapłacić proporcjonalną część usługi, z której skorzystałeś do tego momentu. Poza tym ustawowym prawem nie przysługuje zwrot za czas, który już upłynął, chyba że wymagają tego obowiązujące przepisy.\u003c/p>\n\n  \u003ch2>9. Program zaproszeń i rabaty\u003c/h2>\n  \u003cp>\u003cstrong>Zapraszanie znajomych.\u003c/strong> Gdy osoby rejestrujące się z Twoim kodem wykupią płatny plan, Twoja płatna subskrypcja otrzymuje rabat zależny od tego, ile z tych osób płaci w danym momencie: 5 osób, 10%; 10 osób, 20%; 15 osób, 30%; 20 osób, 40%; 30 osób, 50%. Aby go otrzymać, musisz mieć własną aktywną płatną subskrypcję. Rabat jest przeliczany na nowo, jeśli zmieni się liczba zaproszonych osób, które nadal płacą, dotyczy wyłącznie Twojej własnej subskrypcji i nigdy nie jest zamieniany na pieniądze.\u003c/p>\n  \u003cp>\u003cstrong>Dodawanie produktów spożywczych.\u003c/strong> Jeśli w ciągu miesiąca zgłosisz 10 produktów spożywczych i wszystkie 10 zostanie zatwierdzonych, otrzymasz 5% rabatu na kolejną opłatę.\u003c/p>\n  \u003cp>Zabronione jest zakładanie fałszywych kont lub używanie własnego kodu w celu uzyskania rabatów; możemy je cofnąć i zawiesić zaangażowane konta. Możemy zmodyfikować lub zakończyć program po uprzednim powiadomieniu.\u003c/p>\n\n  \u003ch2>10. Własność intelektualna i licencje\u003c/h2>\n  \u003cp>cesta. oraz jej logo, projekt, oprogramowanie, teksty i tłumaczenia należą do jej właściciela i są chronione prawem. Bez pisemnej zgody nie możesz kopiować, modyfikować, rozpowszechniać ani poddawać inżynierii wstecznej aplikacji.\u003c/p>\n  \u003cp>\u003cstrong>Podziękowania dla podmiotów trzecich.\u003c/strong> Część danych o produktach spożywczych i produktach pochodzi z Open Food Facts (openfoodfacts.org), dostępnego na licencji Open Database License (ODbL). Wykorzystywane są biblioteki open source (Supabase JS, jsPDF, Sentry, Capacitor, na licencji MIT) oraz czcionki Space Grotesk i Inter (licencja SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Dostępność i ograniczenie odpowiedzialności\u003c/h2>\n  \u003cp>Dokładamy starań, aby aplikacja działała bez przerwy, ale mogą wystąpić przerwy z powodu konserwacji lub przyczyn od nas niezależnych. cesta. nie ponosi odpowiedzialności za decyzje zdrowotne podjęte wyłącznie na podstawie informacji z aplikacji; zawsze skonsultuj się ze specjalistą. Nic z powyższego nie ogranicza praw przysługujących konsumentom na mocy prawa.\u003c/p>\n\n  \u003ch2>12. Zakończenie relacji\u003c/h2>\n  \u003cp>W dowolnym momencie możesz usunąć swoje konto i wszystkie dane z poziomu profilu. Możemy zawiesić lub zamknąć konto naruszające niniejszy regulamin.\u003c/p>\n\n  \u003ch2>13. Zmiany w niniejszym regulaminie\u003c/h2>\n  \u003cp>O wszelkich istotnych zmianach powiadomimy z co najmniej 30-dniowym wyprzedzeniem.\u003c/p>\n\n  \u003ch2>14. Prawo właściwe\u003c/h2>\n  \u003cp>Niniejszy regulamin podlega prawu hiszpańskiemu. Jeśli jesteś konsumentem, możesz wnieść sprawę do sądów właściwych dla Twojego miejsca zamieszkania i zachowujesz prawa przysługujące Ci na mocy przepisów o ochronie konsumentów obowiązujących w kraju Twojego zamieszkania.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","ro":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Ultima actualizare: 24.09.2026\u003c/p>\n\n  \u003ch2>1. Cine suntem și ce oferim\u003c/h2>\n  \u003cp>Titularul cesta. este \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Pentru orice întrebare, scrieți la cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. este un instrument de planificare a meselor, calculare a macronutrienților, monitorizare a greutății și a măsurătorilor, precum și de planificare și înregistrare a antrenamentelor. Include identificarea alimentelor prin fotografie și prin cod de bare, un chat cu inteligență artificială, rețete, exerciții cu demonstrații animate, secțiuni Sarcină și Bebeluș, post intermitent, conectare cu aplicații de sănătate, precum și o comunitate și un motor de căutare de antrenori, opționale. Nu este un dispozitiv medical și nici un serviciu de consultanță nutrițională profesională.\u003c/p>\n\n  \u003ch2>2. Contul dumneavoastră\u003c/h2>\n  \u003cp>Sunteți responsabil de păstrarea în siguranță a parolei. Trebuie să aveți cel puțin 18 ani pentru a crea un cont. Informațiile din profilul dumneavoastră trebuie să fie reale.\u003c/p>\n\n  \u003ch2>3. Comunitate și conținut partajat\u003c/h2>\n  \u003cp>Profilul dumneavoastră este privat în mod implicit. Dacă îl faceți public sau acceptați o prietenie, acea persoană va vedea meniurile și fotografiile dumneavoastră. Nu încărcați conținut care încalcă drepturile unor terți sau care identifică alte persoane fără consimțământul lor.\u003c/p>\n  \u003cp>\u003cstrong>Conținut interzis.\u003c/strong> Nu este permis să încărcați, să trimiteți prin chat sau să încercați să faceți să treacă drept căutare a tehnicii unui exercițiu niciun conținut sexual, de nuditate sau sugestiv; violent, grafic sau șocant; rasist, homofob, de ură sau discriminatoriu din orice motiv (origine, religie, orientare sexuală, identitate de gen, dizabilitate sau altul); ori ilegal potrivit oricărei legi aplicabile, inclusiv orice conținut care implică sau sexualizează minori. Aceasta se aplică fotografiilor de profil, de progres, de mâncare și ale produselor contribuite, mesajelor de chat dintre antrenor și sportiv sau dintre utilizatori și oricărui text folosit pentru a căuta videoclipuri cu tehnica exercițiilor.\u003c/p>\n  \u003cp>Toate fotografiile pe care le încărcați trec printr-un filtru automat de moderare cu inteligență artificială înainte de a fi acceptate (mai multe detalii în Politica de confidențialitate). Încercarea de a ocoli filtrul sau încărcarea repetată de conținut interzis constituie motiv de suspendare sau închidere imediată a contului dumneavoastră, fără dreptul la rambursarea planului cu plată activ și fără a aduce atingere posibilității noastre de a informa autoritățile competente atunci când legea ne obligă.\u003c/p>\n  \u003cp>Păstrați toate drepturile asupra conținutului pe care îl încărcați. Ne acordați permisiunea, exclusiv pentru a vă furniza serviciul, de a-l stoca, de a-l afișa persoanelor cu care decideți să îl partajați și de a-l prelucra așa cum se explică în Politica de confidențialitate.\u003c/p>\n\n  \u003ch2>4. Conținut generat de IA\u003c/h2>\n  \u003cp>Estimările obținute prin analiza fotografiilor, prin chatul cu IA sau prin rezumatele automate sunt aproximative și pot conține erori. Verificați-le întotdeauna și nu le considerați sfat medical.\u003c/p>\n\n  \u003ch2>5. Sănătate, sarcină, bebeluș și antrenament\u003c/h2>\n  \u003cp>Informațiile din aplicație au rol de organizare personală și de informare generală. Nu înlocuiesc sfatul unui medic, nutriționist-dietetician, moașe, pediatru sau antrenor. Consultați un specialist înainte de a începe un program de exerciții sau de a vă schimba alimentația și, în special, dacă sunteți însărcinată sau alăptați, aveți o boală, urmați un tratament sau dacă informațiile se referă la un bebeluș.\u003c/p>\n\n  \u003ch2>6. Antrenori și sportivi\u003c/h2>\n  \u003cp>Antrenorii care folosesc cesta. sunt profesioniști independenți. cesta. facilitează contactul și instrumentele, dar nu supraveghează și nu garantează serviciile acestora, iar relația dintre antrenor și sportiv este exclusiv între ei. Plățile dintre antrenor și sportiv se gestionează direct între cei doi, în afara aplicației; cesta. nu percepe comision și nu intervine în aceste tranzacții. Ambii se angajează să trateze cu respect și confidențialitate informațiile celuilalt.\u003c/p>\n\n  \u003ch2>7. Planuri și prețuri\u003c/h2>\n  \u003cp>\u003cstrong>Gratuit\u003c/strong> — fără cost, cu funcțiile de bază de planificare, calculator de macronutrienți, bază de alimente și rețete, listă de cumpărături, înregistrare a antrenamentelor, căutare după cod de bare, import din aplicații de sănătate, chat cu IA și acces la comunitate. Analiza fotografiilor cu IA este limitată la 5 pe lună, iar exportul de date la 3 ori pe lună.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/lună sau 49,99 €/an, cu 7 zile de probă gratuită prima dată. Include tot ce oferă planul Gratuit și, printre altele, analiză nelimitată a fotografiilor cu IA, export de date fără limite, Cheat meals, Sarcină, Bebeluș, antrenament recomandat, monitorizarea măsurătorilor și suport prioritar.\u003c/p>\n  \u003cp>\u003cstrong>Familie de bază\u003c/strong> — 4,99 €/lună. Până la 4 profiluri sub aceeași adresă de e-mail și parolă, fiecare cu greutatea, mesele și antrenamentele proprii, independente, cu nivelul Gratuit. \u003cstrong>Familie premium\u003c/strong> — 12,99 €/lună: la fel, dar toate cele 4 profiluri au Premium complet.\u003c/p>\n  \u003cp>\u003cstrong>Antrenor\u003c/strong> — 9,99 €/lună sau 59,99 €/an, cu 7 zile de probă gratuită. Este un plan separat care include tot ce oferă Premium și zona „Sportivii mei” pentru a consilia sportivi: a le propune meniuri și antrenamente, a le vedea progresul și a discuta cu ei în chat.\u003c/p>\n  \u003cp>Ceea ce include fiecare plan este afișat întotdeauna în aplicație (ecranul „Îmbunătățește-ți planul”) și poate evolua. Taxele și impozitele aplicabile sunt afișate înainte de plată. „Suport prioritar” înseamnă că mesajul dumneavoastră este tratat înaintea celor ale conturilor gratuite, fără un termen de răspuns garantat.\u003c/p>\n\n  \u003ch2>7 bis. Modulul Culturism (abonament separat)\u003c/h2>\n  \u003cp>\u003cstrong>Ce este.\u003c/strong> Modulul Culturism este un instrument de înregistrare și urmărire personală: tu notezi ceea ce ai decis deja să iei (împreună cu medicul tău sau pe cont propriu), iar cesta. le organizează într-un calendar și trasează curbe orientative. Curbele sunt estimări matematice care folosesc timpul de înjumătățire indicat de tine sau o valoare orientativă din surse publice; ele nu măsoară nivelurile tale reale din sânge și pot fi inexacte.\u003c/p>\n  \u003cp>\u003cstrong>Ce nu este.\u003c/strong> cesta. nu oferă sfaturi medicale, diagnostic sau tratament și nu recomandă, nu prescrie, nu calculează, nu ajustează și nu sugerează substanțe, doze sau scheme. Nu vinde, nu furnizează și nu facilitează obținerea niciunei substanțe, nu încurajează utilizarea lor și nu înlocuiește un profesionist din domeniul sănătății. Multe substanțe sunt medicamente pe bază de prescripție, a căror obținere și utilizare fără supraveghere medicală pot fi ilegale și periculoase pentru sănătatea ta; ești singurul responsabil pentru respectarea legislației aplicabile și pentru deciziile tale. Dacă ai simptome de alarmă, adresează-te unui serviciu medical sau sună la 112.\u003c/p>\n  \u003cp>\u003cstrong>Doar pentru persoane cu vârsta de 18 ani sau mai mult.\u003c/strong> Trebuie să ai 18 ani sau mai mult și confirmi acest lucru la contractare. Putem suspenda modulul dacă detectăm că este folosit de un minor sau că este folosit contrar acestor termeni.\u003c/p>\n  \u003cp>\u003cstrong>Preț și plată.\u003c/strong> 10 €/lună (taxe incluse sau afișate înainte de plată), un abonament independent de planul tău (Gratuit, Premium, Familie sau Antrenor) și fără perioadă de probă gratuită. Se reînnoiește automat în fiecare lună până când îl anulezi. Plata este procesată de Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Retragere și anulare.\u003c/strong> La contractare soliciți ca serviciul să înceapă imediat. Ca consumator ai 14 zile pentru a te retrage din contract; dacă exerciți acest drept după ce ai folosit modulul, va trebui să plătești partea proporțională din serviciul deja utilizat. Poți anula oricând din modulul însuși (butonul «Gestionează sau anulează abonamentul»); anularea produce efecte la sfârșitul perioadei deja plătite și abonamentul nu se mai reînnoiește. Pentru a te retrage, folosește butonul «Îmi exercit dreptul de retragere» din modul sau scrie-ne la adresa de e-mail de contact.\u003c/p>\n  \u003cp>\u003cstrong>Datele tale.\u003c/strong> Datele pe care le înregistrezi sunt ale tale: le poți șterge pe toate oricând cu «Șterge toate datele mele de Culturism» și le poți descărca cu «Descarcă datele mele de Culturism». La anularea abonamentului, ele se păstrează până când le ștergi, cu excepția cazului în care contul este inactiv de 18 luni. Nicio altă persoană (antrenori, prieteni, Comunitate) nu vede aceste date. Mai multe detalii în Politica de confidențialitate.\u003c/p>\n  \u003cp>\u003cstrong>Chat cu IA.\u003c/strong> Cu modulul activ, chatul poate organiza într-un calendar ceea ce îi spui tu, dar nu propune substanțe, doze sau scheme din proprie inițiativă.\u003c/p>\n  \u003cp>\u003cstrong>Fără relație medic-pacient și consultație medicală.\u003c/strong> Utilizarea modulului nu creează o relație medic-pacient. Înainte de a începe, de a schimba sau de a renunța la orice medicament, supliment sau schemă, consultă un profesionist calificat din domeniul sănătății. Ești responsabil pentru deciziile tale și pentru riscurile pe care acestea le implică. cesta. nu susține utilizarea niciunei substanțe în afara a ceea ce este autorizat.\u003c/p>\n  \u003cp>\u003cstrong>Legalitate și disponibilitate.\u003c/strong> Multe dintre substanțele pe care le poți înregistra nu sunt autorizate pentru uz uman în toate țările sau sunt vândute legal doar pe bază de prescripție medicală sau pentru cercetare. Nu afirmăm că modulul, lista sa de substanțe sau conținutul său sunt adecvate, legale sau disponibile în țara ta: ești responsabil pentru respectarea legislației locale. Lista de substanțe servește doar pentru a le selecta după nume și nu înseamnă că cesta. le aprobă sau le recomandă.\u003c/p>\n  \u003cp>\u003cstrong>Exactitate, IA și urgențe.\u003c/strong> Datele și curbele se bazează pe ceea ce introduci tu și pe estimări pe care nu le verificăm și pot fi inexacte sau incomplete. Răspunsurile IA sunt generate automat și pot conține erori. Într-o urgență medicală sau în cazul unor simptome grave nu te baza pe aplicație: sună la 112 (sau la numărul de urgență din țara ta) sau adresează-te unui medic.\u003c/p>\n  \u003cp>\u003cstrong>Răspundere.\u003c/strong> În măsura permisă de lege, cesta. nu răspunde pentru prejudiciile rezultate din deciziile pe care le iei cu privire la substanțe sau tratamente pe baza informațiilor din aplicație. Aceasta nu limitează drepturile pe care legea ți le recunoaște ca consumator și nici răspunderea noastră pentru dol, culpă gravă, deces sau vătămări corporale cauzate din culpa noastră.\u003c/p>\n  \u003cp>\u003cstrong>Suspendare.\u003c/strong> Putem suspenda sau anula modulul dacă detectăm o utilizare contrară acestor termeni (de exemplu, utilizare de către minori, vânzarea sau promovarea de substanțe ori uzurparea identității), rambursând partea proporțională din perioada deja plătită și neutilizată.\u003c/p>\n\n  \u003ch2>8. Plăți, probă gratuită, reînnoire și anulare\u003c/h2>\n  \u003cp>Plățile sunt procesate în siguranță prin Stripe; nu vedem și nu păstrăm niciodată datele cardului dumneavoastră. Abonamentele se reînnoiesc automat la sfârșitul fiecărei perioade (lunară sau anuală), cu excepția cazului în care anulați înainte. Dacă anulați în timpul perioadei de probă gratuite, nu se percepe nimic.\u003c/p>\n  \u003cp>Puteți anula, schimba planul sau actualiza metoda de plată oricând prin butonul „Gestionează” de lângă planul dumneavoastră, care vă duce la portalul securizat Stripe. Dacă anulați, păstrați accesul Premium până la sfârșitul perioadei deja plătite. Dacă o plată eșuează, Stripe va reîncerca încasarea timp de câteva zile; dacă încasarea tot nu este posibilă, contul dumneavoastră va trece la planul Gratuit până când actualizați metoda de plată.\u003c/p>\n  \u003cp>\u003cstrong>Dreptul de retragere.\u003c/strong> Dacă sunteți consumator, aveți dreptul de a vă retrage din contract în termen de 14 zile calendaristice de la încheierea acestuia (de la începerea probei sau a plății), fără a fi necesar să invocați un motiv, scriind la cestafitness@gmail.com. Întrucât serviciul digital începe imediat, la cererea dumneavoastră, dacă vă retrageți va trebui să plătiți partea proporțională din serviciul primit până în acel moment. În afara acestui drept legal, nu se acordă rambursări pentru timpul deja scurs, cu excepția cazului în care legea aplicabilă o impune.\u003c/p>\n\n  \u003ch2>9. Programul de invitații și reduceri\u003c/h2>\n  \u003cp>\u003cstrong>Invitarea prietenilor.\u003c/strong> Când persoane care se înregistrează cu codul dumneavoastră contractează un plan cu plată, abonamentul dumneavoastră cu plată primește o reducere în funcție de câte dintre aceste persoane plătesc în acel moment: 5 persoane, 10%; 10 persoane, 20%; 15 persoane, 30%; 20 de persoane, 40%; 30 de persoane, 50%. Pentru a o primi, trebuie să aveți propriul abonament cu plată activ. Reducerea se recalculează dacă se schimbă numărul invitaților care continuă să plătească, se aplică doar propriului dumneavoastră abonament și nu se transformă niciodată în bani.\u003c/p>\n  \u003cp>\u003cstrong>Contribuția cu alimente.\u003c/strong> Dacă trimiteți 10 alimente într-o lună și toate cele 10 sunt validate, beneficiați de o reducere de 5% la următoarea rată.\u003c/p>\n  \u003cp>Este interzis să înregistrați conturi false sau să folosiți propriul cod pentru a obține reduceri; le putem retrage și putem suspenda conturile implicate. Putem modifica sau închide programul cu preaviz.\u003c/p>\n\n  \u003ch2>10. Proprietate intelectuală și licențe\u003c/h2>\n  \u003cp>cesta. și sigla sa, designul, software-ul, textele și traducerile aparțin titularului și sunt protejate prin lege. Nu aveți voie să copiați, să modificați, să distribuiți sau să efectuați inginerie inversă asupra aplicației fără autorizare scrisă.\u003c/p>\n  \u003cp>\u003cstrong>Mențiuni privind terții.\u003c/strong> O parte din datele despre alimente și produse provine de la Open Food Facts (openfoodfacts.org), disponibilă sub licența Open Database License (ODbL). Se folosesc biblioteci open source (Supabase JS, jsPDF, Sentry, Capacitor, cu licență MIT) și fonturile Space Grotesk și Inter (licența SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Disponibilitate și limitarea răspunderii\u003c/h2>\n  \u003cp>Facem tot posibilul ca aplicația să funcționeze permanent, dar pot exista întreruperi pentru mentenanță sau din cauze independente de voința noastră. cesta. nu răspunde pentru deciziile privind sănătatea luate exclusiv pe baza informațiilor din aplicație; consultați întotdeauna un specialist. Nimic din cele de mai sus nu limitează drepturile pe care legea le recunoaște consumatorilor.\u003c/p>\n\n  \u003ch2>12. Încetarea relației\u003c/h2>\n  \u003cp>Vă puteți șterge contul și toate datele oricând din profilul dumneavoastră. Putem suspenda sau închide un cont care încalcă acești termeni.\u003c/p>\n\n  \u003ch2>13. Modificări ale acestor termeni\u003c/h2>\n  \u003cp>Vom notifica orice modificare relevantă cu cel puțin 30 de zile în avans.\u003c/p>\n\n  \u003ch2>14. Legea aplicabilă\u003c/h2>\n  \u003cp>Acești termeni sunt guvernați de legea spaniolă. Dacă sunteți consumator, vă puteți adresa instanțelor de la domiciliul dumneavoastră și păstrați drepturile pe care vi le recunoaște legislația privind protecția consumatorilor din țara dumneavoastră de reședință.\u003c/p>\n\n  \u003ch2>15. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","el":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Τελευταία ενημέρωση: 24/09/2026\u003c/p>\n\n  \u003ch2>1. Ποιοι είμαστε και τι προσφέρουμε\u003c/h2>\n  \u003cp>Ο κάτοχος της cesta. είναι ο/η \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Για οποιοδήποτε ερώτημα, γράψε στο cestafitness@gmail.com.\u003c/p>\n  \u003cp>Η cesta. είναι εργαλείο σχεδιασμού γευμάτων, υπολογισμού μακροθρεπτικών συστατικών, παρακολούθησης βάρους και μετρήσεων, καθώς και σχεδιασμού και καταγραφής προπονήσεων. Περιλαμβάνει αναγνώριση τροφίμων με φωτογραφία και με γραμμωτό κωδικό, συνομιλία με τεχνητή νοημοσύνη, συνταγές, ασκήσεις με κινούμενες επιδείξεις, ενότητες Εγκυμοσύνη και Μωρό, διαλείπουσα νηστεία, σύνδεση με εφαρμογές υγείας, καθώς και προαιρετική κοινότητα και μηχανή αναζήτησης προπονητών. Δεν αποτελεί ιατροτεχνολογικό προϊόν ούτε υπηρεσία επαγγελματικής διατροφικής συμβουλευτικής.\u003c/p>\n\n  \u003ch2>2. Ο λογαριασμός σου\u003c/h2>\n  \u003cp>Είσαι υπεύθυνος/η για την ασφαλή φύλαξη του κωδικού πρόσβασής σου. Πρέπει να είσαι τουλάχιστον 18 ετών για να δημιουργήσεις λογαριασμό. Οι πληροφορίες του προφίλ σου πρέπει να είναι αληθείς.\u003c/p>\n\n  \u003ch2>3. Κοινότητα και κοινόχρηστο περιεχόμενο\u003c/h2>\n  \u003cp>Το προφίλ σου είναι ιδιωτικό από προεπιλογή. Εάν το κάνεις δημόσιο ή αποδεχτείς μια φιλία, το πρόσωπο αυτό θα βλέπει τα μενού και τις φωτογραφίες σου. Μην ανεβάζεις περιεχόμενο που παραβιάζει δικαιώματα τρίτων ή που ταυτοποιεί άλλα πρόσωπα χωρίς τη συγκατάθεσή τους.\u003c/p>\n  \u003cp>\u003cstrong>Απαγορευμένο περιεχόμενο.\u003c/strong> Απαγορεύεται η μεταφόρτωση, η αποστολή μέσω συνομιλίας ή η προσπάθεια να παρουσιαστεί ως αναζήτηση τεχνικής άσκησης οποιουδήποτε περιεχομένου: σεξουαλικού, γυμνού ή υπαινικτικού· βίαιου, γραφικού ή ταραχώδους· ρατσιστικού, ομοφοβικού, μίσους ή διακριτικού για οποιονδήποτε λόγο (καταγωγή, θρησκεία, σεξουαλικός προσανατολισμός, ταυτότητα φύλου, αναπηρία ή άλλο)· ή παράνομου βάσει οποιουδήποτε εφαρμοστέου νόμου, συμπεριλαμβανομένου κάθε περιεχομένου που αφορά ή σεξουαλικοποιεί ανηλίκους. Αυτό ισχύει για φωτογραφίες προφίλ, προόδου, φαγητού και προϊόντων που συνεισφέρονται, για τα μηνύματα συνομιλίας μεταξύ προπονητή και αθλητή ή μεταξύ χρηστών, και για οποιοδήποτε κείμενο χρησιμοποιείται για την αναζήτηση βίντεο τεχνικής.\u003c/p>\n  \u003cp>Όλες οι φωτογραφίες που ανεβάζεις περνούν από αυτόματο φίλτρο εποπτείας με τεχνητή νοημοσύνη πριν γίνουν αποδεκτές (περισσότερες λεπτομέρειες στην Πολιτική Απορρήτου). Η απόπειρα παράκαμψης του φίλτρου ή η κατ' επανάληψη μεταφόρτωση απαγορευμένου περιεχομένου αποτελεί λόγο άμεσης αναστολής ή κλεισίματος του λογαριασμού σου, χωρίς δικαίωμα επιστροφής χρημάτων για το ενεργό συνδρομητικό πρόγραμμα επί πληρωμή, και υπό την επιφύλαξη του δικαιώματός μας να ενημερώσουμε τις αρμόδιες αρχές όταν ο νόμος μας το επιβάλλει.\u003c/p>\n  \u003cp>Διατηρείς όλα τα δικαιώματα στο περιεχόμενο που ανεβάζεις. Μας παρέχεις άδεια, αποκλειστικά για την παροχή της υπηρεσίας, να το αποθηκεύουμε, να το εμφανίζουμε στα πρόσωπα με τα οποία αποφασίζεις να το μοιραστείς και να το επεξεργαζόμαστε όπως εξηγείται στην Πολιτική Απορρήτου.\u003c/p>\n\n  \u003ch2>4. Περιεχόμενο που δημιουργείται από τεχνητή νοημοσύνη\u003c/h2>\n  \u003cp>Οι εκτιμήσεις που προκύπτουν από ανάλυση φωτογραφίας, από τη συνομιλία με τεχνητή νοημοσύνη ή από τις αυτόματες περιλήψεις είναι προσεγγιστικές και μπορεί να περιέχουν σφάλματα. Να τις ελέγχεις πάντα και να μην τις θεωρείς ιατρική συμβουλή.\u003c/p>\n\n  \u003ch2>5. Υγεία, εγκυμοσύνη, μωρό και προπόνηση\u003c/h2>\n  \u003cp>Οι πληροφορίες της εφαρμογής προορίζονται για προσωπική οργάνωση και γενική ενημέρωση. Δεν υποκαθιστούν τη συμβουλή γιατρού, διαιτολόγου-διατροφολόγου, μαίας, παιδιάτρου ή προπονητή. Συμβουλεύσου έναν επαγγελματία πριν ξεκινήσεις πρόγραμμα άσκησης ή αλλάξεις τη διατροφή σου, και ιδιαίτερα εάν είσαι έγκυος ή θηλάζεις, έχεις κάποια νόσο, ακολουθείς θεραπεία ή εάν οι πληροφορίες αφορούν μωρό.\u003c/p>\n\n  \u003ch2>6. Προπονητές και αθλητές\u003c/h2>\n  \u003cp>Οι προπονητές που χρησιμοποιούν την cesta. είναι ανεξάρτητοι επαγγελματίες. Η cesta. διευκολύνει την επαφή και παρέχει τα εργαλεία, αλλά δεν εποπτεύει ούτε εγγυάται τις υπηρεσίες τους, και η σχέση μεταξύ προπονητή και αθλητή αφορά αποκλειστικά τους ίδιους. Οι πληρωμές μεταξύ προπονητή και αθλητή διεκπεραιώνονται απευθείας μεταξύ τους, εκτός εφαρμογής· η cesta. δεν εισπράττει προμήθεια ούτε εμπλέκεται στις συναλλαγές αυτές. Και οι δύο δεσμεύονται να αντιμετωπίζουν με σεβασμό και εμπιστευτικότητα τις πληροφορίες του άλλου.\u003c/p>\n\n  \u003ch2>7. Προγράμματα και τιμές\u003c/h2>\n  \u003cp>\u003cstrong>Δωρεάν\u003c/strong> — χωρίς κόστος, με τις βασικές λειτουργίες σχεδιασμού, υπολογιστή μακροθρεπτικών συστατικών, βάση τροφίμων και συνταγών, λίστα αγορών, καταγραφή προπονήσεων, αναζήτηση με γραμμωτό κωδικό, εισαγωγή από εφαρμογές υγείας, συνομιλία με τεχνητή νοημοσύνη και πρόσβαση στην κοινότητα. Η ανάλυση φωτογραφιών με τεχνητή νοημοσύνη περιορίζεται σε 5 τον μήνα και η εξαγωγή δεδομένων σε 3 φορές τον μήνα.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/μήνα ή 49,99 €/έτος, με 7 ημέρες δωρεάν δοκιμής την πρώτη φορά. Περιλαμβάνει όσα το πρόγραμμα Δωρεάν και, μεταξύ άλλων λειτουργιών, απεριόριστη ανάλυση φωτογραφιών με τεχνητή νοημοσύνη, απεριόριστη εξαγωγή δεδομένων, Cheat meals, Εγκυμοσύνη, Μωρό, προτεινόμενη προπόνηση, παρακολούθηση μετρήσεων και προτεραιότητα στην υποστήριξη.\u003c/p>\n  \u003cp>\u003cstrong>Οικογενειακό βασικό\u003c/strong> — 4,99 €/μήνα. Έως 4 προφίλ με το ίδιο email και τον ίδιο κωδικό πρόσβασης, το καθένα με ανεξάρτητο βάρος, γεύματα και προπονήσεις, με το επίπεδο Δωρεάν. \u003cstrong>Οικογενειακό premium\u003c/strong> — 12,99 €/μήνα: το ίδιο, αλλά και τα 4 προφίλ διαθέτουν πλήρες Premium.\u003c/p>\n  \u003cp>\u003cstrong>Προπονητής\u003c/strong> — 9,99 €/μήνα ή 59,99 €/έτος, με 7 ημέρες δωρεάν δοκιμής. Είναι ξεχωριστό πρόγραμμα που περιλαμβάνει όσα το Premium και την ενότητα «Οι αθλητές μου» για τη συμβουλευτική αθλητών: πρόταση μενού και προπονήσεων, προβολή της προόδου τους και συνομιλία μαζί τους.\u003c/p>\n  \u003cp>Όσα περιλαμβάνει κάθε πρόγραμμα εμφανίζονται πάντα στην εφαρμογή (οθόνη «Αναβάθμιση του προγράμματός σου») και μπορεί να εξελίσσονται. Οι φόροι που αναλογούν εμφανίζονται πριν από την πληρωμή. «Προτεραιότητα στην υποστήριξη» σημαίνει ότι το μήνυμά σου εξυπηρετείται πριν από εκείνα των δωρεάν λογαριασμών, χωρίς εγγυημένο χρόνο απόκρισης.\u003c/p>\n\n  \u003ch2>7 bis. Ενότητα Bodybuilding (ξεχωριστή συνδρομή)\u003c/h2>\n  \u003cp>\u003cstrong>Τι είναι.\u003c/strong> Η ενότητα Bodybuilding είναι ένα εργαλείο προσωπικής καταγραφής και παρακολούθησης: εσείς σημειώνετε ό,τι έχετε ήδη αποφασίσει να λαμβάνετε (με τον γιατρό σας ή με δική σας πρωτοβουλία) και η cesta. το οργανώνει σε ημερολόγιο και σχεδιάζει ενδεικτικές καμπύλες. Οι καμπύλες είναι μαθηματικές εκτιμήσεις που χρησιμοποιούν τον χρόνο ημιζωής που δηλώνετε εσείς ή μια ενδεικτική τιμή από δημόσιες πηγές· δεν μετρούν τα πραγματικά επίπεδα στο αίμα σας και μπορεί να είναι ανακριβείς.\u003c/p>\n  \u003cp>\u003cstrong>Τι δεν είναι.\u003c/strong> Η cesta. δεν παρέχει ιατρικές συμβουλές, διάγνωση ή θεραπεία και δεν συνιστά, δεν συνταγογραφεί, δεν υπολογίζει, δεν προσαρμόζει ούτε προτείνει ουσίες, δόσεις ή σχήματα. Δεν πουλά, δεν προμηθεύει και δεν διευκολύνει την απόκτηση καμίας ουσίας, δεν ενθαρρύνει τη χρήση τους και δεν αντικαθιστά επαγγελματία υγείας. Πολλές ουσίες είναι φάρμακα που χορηγούνται με ιατρική συνταγή και η απόκτηση και χρήση τους χωρίς ιατρική παρακολούθηση μπορεί να είναι παράνομη και επικίνδυνη για την υγεία σας· είστε ο μόνος υπεύθυνος για την τήρηση της εφαρμοστέας νομοθεσίας και για τις αποφάσεις σας. Αν έχετε ανησυχητικά συμπτώματα, απευθυνθείτε σε ιατρική υπηρεσία ή καλέστε το 112.\u003c/p>\n  \u003cp>\u003cstrong>Μόνο για άτομα άνω των 18 ετών.\u003c/strong> Πρέπει να είστε 18 ετών ή μεγαλύτερος/η και το επιβεβαιώνετε κατά τη σύναψη της συνδρομής. Μπορούμε να αναστείλουμε την ενότητα αν διαπιστώσουμε ότι τη χρησιμοποιεί ανήλικος ή ότι χρησιμοποιείται κατά παράβαση των παρόντων όρων.\u003c/p>\n  \u003cp>\u003cstrong>Τιμή και πληρωμή.\u003c/strong> 10 €/μήνα (με τους φόρους συμπεριλαμβανομένους ή εμφανιζόμενους πριν από την πληρωμή), συνδρομή ανεξάρτητη από το πρόγραμμά σας (Δωρεάν, Premium, Οικογενειακό ή Προπονητή) και χωρίς δωρεάν δοκιμή. Ανανεώνεται αυτόματα κάθε μήνα μέχρι να την ακυρώσετε. Η πληρωμή διεκπεραιώνεται από την Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Υπαναχώρηση και ακύρωση.\u003c/strong> Με τη σύναψη της συνδρομής ζητάτε να ξεκινήσει η υπηρεσία αμέσως. Ως καταναλωτής έχετε 14 ημέρες για να υπαναχωρήσετε από τη σύμβαση· αν ασκήσετε το δικαίωμα αυτό αφού έχετε χρησιμοποιήσει την ενότητα, θα πρέπει να καταβάλετε το αναλογικό μέρος της υπηρεσίας που έχει ήδη παρασχεθεί. Μπορείτε να ακυρώσετε οποιαδήποτε στιγμή από την ίδια την ενότητα (κουμπί «Διαχείριση ή ακύρωση της συνδρομής»)· η ακύρωση ισχύει στο τέλος της ήδη πληρωμένης περιόδου και η συνδρομή δεν ανανεώνεται ξανά. Για να υπαναχωρήσετε, χρησιμοποιήστε το κουμπί «Άσκηση του δικαιώματος υπαναχώρησής μου» της ενότητας ή γράψτε μας στο email επικοινωνίας.\u003c/p>\n  \u003cp>\u003cstrong>Τα δεδομένα σου.\u003c/strong> Τα δεδομένα που καταγράφεις είναι δικά σου: μπορείς να τα διαγράψεις όλα ανά πάσα στιγμή με το «Διαγραφή όλων των δεδομένων μου Bodybuilding» και να τα κατεβάσεις με το «Λήψη των δεδομένων μου Bodybuilding». Όταν ακυρώσεις τη συνδρομή, διατηρούνται μέχρι να τα διαγράψεις, εκτός εάν ο λογαριασμός παραμείνει ανενεργός για 18 μήνες. Κανένα άλλο πρόσωπο (προπονητές, φίλοι, Κοινότητα) δεν βλέπει αυτά τα δεδομένα. Περισσότερες λεπτομέρειες στην Πολιτική απορρήτου.\u003c/p>\n  \u003cp>\u003cstrong>Συνομιλία με ΤΝ.\u003c/strong> Με ενεργή την ενότητα, η συνομιλία μπορεί να οργανώνει σε ημερολόγιο όσα της αναφέρετε, αλλά δεν προτείνει ουσίες, δόσεις ή σχήματα με δική της πρωτοβουλία.\u003c/p>\n  \u003cp>\u003cstrong>Καμία σχέση ιατρού-ασθενούς και ιατρική συμβουλή.\u003c/strong> Η χρήση της ενότητας δεν δημιουργεί σχέση ιατρού-ασθενούς. Πριν ξεκινήσετε, αλλάξετε ή διακόψετε οποιοδήποτε φάρμακο, συμπλήρωμα ή σχήμα, συμβουλευτείτε κατάλληλα καταρτισμένο επαγγελματία υγείας. Είστε υπεύθυνοι για τις αποφάσεις σας και για τους κινδύνους που αυτές συνεπάγονται. Η cesta. δεν εγκρίνει τη χρήση καμίας ουσίας πέραν όσων επιτρέπονται.\u003c/p>\n  \u003cp>\u003cstrong>Νομιμότητα και διαθεσιμότητα.\u003c/strong> Πολλές από τις ουσίες που μπορείτε να καταγράψετε δεν είναι εγκεκριμένες για ανθρώπινη χρήση σε όλες τις χώρες ή πωλούνται νόμιμα μόνο με ιατρική συνταγή ή για ερευνητικούς σκοπούς. Δεν δηλώνουμε ότι η ενότητα, ο κατάλογος ουσιών ή το περιεχόμενό της είναι κατάλληλα, νόμιμα ή διαθέσιμα στη χώρα σας: είστε υπεύθυνοι για την τήρηση της τοπικής νομοθεσίας. Ο κατάλογος ουσιών χρησιμεύει μόνο για την επιλογή τους με βάση το όνομα και δεν σημαίνει ότι η cesta. τις εγκρίνει ή τις συνιστά.\u003c/p>\n  \u003cp>\u003cstrong>Ακρίβεια, ΤΝ και έκτακτες ανάγκες.\u003c/strong> Τα δεδομένα και οι καμπύλες βασίζονται σε όσα εισάγετε εσείς και σε εκτιμήσεις που δεν επαληθεύουμε και μπορεί να είναι ανακριβή ή ελλιπή. Οι απαντήσεις της ΤΝ παράγονται αυτόματα και μπορεί να περιέχουν σφάλματα. Σε περίπτωση ιατρικής έκτακτης ανάγκης ή σοβαρών συμπτωμάτων μην βασίζεστε στην εφαρμογή: καλέστε το 112 (ή τον αριθμό έκτακτης ανάγκης της χώρας σας) ή απευθυνθείτε σε γιατρό.\u003c/p>\n  \u003cp>\u003cstrong>Ευθύνη.\u003c/strong> Στον βαθμό που επιτρέπεται από τον νόμο, η cesta. δεν ευθύνεται για ζημίες που προκύπτουν από αποφάσεις που λαμβάνετε σχετικά με ουσίες ή θεραπείες βάσει των πληροφοριών της εφαρμογής. Αυτό δεν περιορίζει τα δικαιώματα που σας αναγνωρίζει ο νόμος ως καταναλωτή ούτε την ευθύνη μας για δόλο, βαριά αμέλεια, θάνατο ή σωματικές βλάβες που προκλήθηκαν με υπαιτιότητά μας.\u003c/p>\n  \u003cp>\u003cstrong>Αναστολή.\u003c/strong> Μπορούμε να αναστείλουμε ή να ακυρώσουμε την ενότητα αν διαπιστώσουμε χρήση αντίθετη προς τους παρόντες όρους (για παράδειγμα, χρήση από ανηλίκους, πώληση ή προώθηση ουσιών ή πλαστοπροσωπία), επιστρέφοντας το αναλογικό μέρος της περιόδου που έχει ήδη πληρωθεί και δεν έχει χρησιμοποιηθεί.\u003c/p>\n\n  \u003ch2>8. Πληρωμές, δωρεάν δοκιμή, ανανέωση και ακύρωση\u003c/h2>\n  \u003cp>Οι πληρωμές επεξεργάζονται με ασφάλεια μέσω της Stripe· δεν βλέπουμε ούτε αποθηκεύουμε ποτέ τα στοιχεία της κάρτας σου. Οι συνδρομές ανανεώνονται αυτόματα στο τέλος κάθε περιόδου (μηνιαίας ή ετήσιας), εκτός εάν ακυρώσεις νωρίτερα. Εάν ακυρώσεις κατά τη διάρκεια της δωρεάν δοκιμής, δεν σου χρεώνεται τίποτα.\u003c/p>\n  \u003cp>Μπορείς να ακυρώσεις, να αλλάξεις πρόγραμμα ή να ενημερώσεις τον τρόπο πληρωμής σου όποτε θελήσεις από το κουμπί «Διαχείριση» δίπλα στο πρόγραμμά σου, το οποίο σε οδηγεί στην ασφαλή πύλη της Stripe. Εάν ακυρώσεις, διατηρείς την πρόσβαση Premium έως το τέλος της ήδη πληρωμένης περιόδου. Εάν μια πληρωμή αποτύχει, η Stripe θα επαναλάβει την προσπάθεια είσπραξης επί μερικές ημέρες· εάν εξακολουθεί να μην είναι δυνατή η είσπραξη, ο λογαριασμός σου θα περάσει στο πρόγραμμα Δωρεάν μέχρι να ενημερώσεις τον τρόπο πληρωμής σου.\u003c/p>\n  \u003cp>\u003cstrong>Δικαίωμα υπαναχώρησης.\u003c/strong> Εάν είσαι καταναλωτής, έχεις δικαίωμα να υπαναχωρήσεις από τη σύμβαση εντός 14 ημερολογιακών ημερών από τη σύναψή της (από την έναρξη της δοκιμής ή της πληρωμής), χωρίς αιτιολόγηση, γράφοντας στο cestafitness@gmail.com. Επειδή η ψηφιακή υπηρεσία ξεκινά αμέσως κατόπιν αιτήματός σου, εάν υπαναχωρήσεις θα πρέπει να καταβάλεις το ανάλογο μέρος της υπηρεσίας που έχεις λάβει μέχρι εκείνη τη στιγμή. Πέραν του νόμιμου αυτού δικαιώματος, δεν προβλέπονται επιστροφές χρημάτων για τον χρόνο που έχει ήδη παρέλθει, εκτός εάν το επιβάλλει το εφαρμοστέο δίκαιο.\u003c/p>\n\n  \u003ch2>9. Πρόγραμμα προσκλήσεων και εκπτώσεων\u003c/h2>\n  \u003cp>\u003cstrong>Πρόσκληση φίλων.\u003c/strong> Όταν πρόσωπα που εγγράφονται με τον κωδικό σου συνάπτουν πρόγραμμα επί πληρωμή, η συνδρομή σου επί πληρωμή λαμβάνει έκπτωση ανάλογα με το πόσα από αυτά τα πρόσωπα πληρώνουν εκείνη τη στιγμή: 5 πρόσωπα, 10 %· 10 πρόσωπα, 20 %· 15 πρόσωπα, 30 %· 20 πρόσωπα, 40 %· 30 πρόσωπα, 50 %. Για να τη λάβεις πρέπει να έχεις τη δική σου ενεργή συνδρομή επί πληρωμή. Η έκπτωση υπολογίζεται εκ νέου εάν αλλάξει ο αριθμός των προσκεκλημένων που εξακολουθούν να πληρώνουν, ισχύει μόνο για τη δική σου συνδρομή και δεν μετατρέπεται ποτέ σε χρήματα.\u003c/p>\n  \u003cp>\u003cstrong>Συνεισφορά τροφίμων.\u003c/strong> Εάν υποβάλεις 10 τρόφιμα μέσα σε έναν μήνα και τα 10 επικυρωθούν, έχεις έκπτωση 5 % στην επόμενη δόση σου.\u003c/p>\n  \u003cp>Απαγορεύεται η εγγραφή ψεύτικων λογαριασμών ή η χρήση του δικού σου κωδικού για την απόκτηση εκπτώσεων· μπορούμε να τις ανακαλέσουμε και να αναστείλουμε τους εμπλεκόμενους λογαριασμούς. Μπορούμε να τροποποιήσουμε ή να τερματίσουμε το πρόγραμμα με προηγούμενη ειδοποίηση.\u003c/p>\n\n  \u003ch2>10. Πνευματική ιδιοκτησία και άδειες\u003c/h2>\n  \u003cp>Η cesta. και το λογότυπό της, ο σχεδιασμός, το λογισμικό, τα κείμενα και οι μεταφράσεις ανήκουν στον κάτοχό τους και προστατεύονται από τον νόμο. Δεν επιτρέπεται να αντιγράψει
