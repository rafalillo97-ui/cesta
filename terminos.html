akorlattechnikai keresésnek álcázni bármilyen szexuális, meztelenséget tartalmazó vagy sejtető; erőszakos, kegyetlen vagy felkavaró; rasszista, homofób, gyűlöletkeltő vagy bármely okból (származás, vallás, szexuális irányultság, nemi identitás, fogyatékosság vagy egyéb) diszkriminatív; vagy bármely alkalmazandó jog szerint jogellenes tartalmat, ideértve minden olyan tartalmat, amely kiskorúakat érint vagy szexualizál. Ez vonatkozik a profilképekre, a haladást bemutató, az ételekről és a beküldött termékekről készült fényképekre, az edző és a sportoló, illetve a felhasználók közötti csevegőüzenetekre, valamint a technikai videók kereséséhez használt bármely szövegre.\u003c/p>\n  \u003cp>Minden Ön által feltöltött fénykép elfogadás előtt átmegy egy automatikus, mesterséges intelligenciát használó moderálási szűrőn (további részletek az Adatvédelmi szabályzatban). A szűrő megkerülésének kísérlete vagy tiltott tartalom ismételt feltöltése a fiókja azonnali felfüggesztésének vagy megszüntetésének oka, az aktív fizetős csomag díjának visszatérítése nélkül, és nem érinti azt a jogunkat, hogy a jog kötelező rendelkezése esetén tájékoztassuk az illetékes hatóságokat.\u003c/p>\n  \u003cp>Az Ön által feltöltött tartalommal kapcsolatos valamennyi jog Önt illeti meg. Ön engedélyt ad nekünk — kizárólag a szolgáltatás nyújtása céljából — a tartalom tárolására, azon személyeknek való megjelenítésére, akikkel Ön úgy dönt, hogy megosztja, valamint feldolgozására az Adatvédelmi szabályzatban foglaltak szerint.\u003c/p>\n\n  \u003ch2>4. Mesterséges intelligencia által generált tartalom\u003c/h2>\n  \u003cp>A fényképelemzéssel, a mesterséges intelligenciás csevegéssel vagy az automatikus összefoglalókkal kapott becslések hozzávetőlegesek, és hibákat tartalmazhatnak. Mindig ellenőrizze őket, és ne tekintse azokat orvosi tanácsnak.\u003c/p>\n\n  \u003ch2>5. Egészség, terhesség, baba és edzés\u003c/h2>\n  \u003cp>Az alkalmazásban szereplő információk személyes szervezést szolgálnak, és általános tájékoztatásnak minősülnek. Nem helyettesítik orvos, dietetikus-táplálkozási szakember, szülésznő, gyermekorvos vagy edző tanácsát. Edzésprogram megkezdése vagy étrendje megváltoztatása előtt kérjen szakmai tanácsot, különösen, ha várandós vagy szoptat, betegsége van, kezelés alatt áll, vagy ha az információ egy babára vonatkozik.\u003c/p>\n\n  \u003ch2>6. Edzők és sportolók\u003c/h2>\n  \u003cp>A cesta.-t használó edzők független szakemberek. A cesta. megkönnyíti a kapcsolatfelvételt és biztosítja az eszközöket, de szolgáltatásaikat nem felügyeli és nem szavatolja, és az edző és a sportoló közötti jogviszony kizárólag közöttük áll fenn. Az edző és a sportoló közötti kifizetések közvetlenül közöttük, az alkalmazáson kívül történnek; a cesta. nem számít fel jutalékot, és nem vesz részt ezekben a tranzakciókban. Mindketten vállalják, hogy a másik információit tisztelettel és bizalmasan kezelik.\u003c/p>\n\n  \u003ch2>7. Csomagok és árak\u003c/h2>\n  \u003cp>\u003cstrong>Ingyenes\u003c/strong> — költségmentes, az alapvető tervezési funkciókkal, makrókalkulátorral, élelmiszer- és receptadatbázissal, bevásárlólistával, edzésnaplózással, vonalkódos kereséssel, egészségügyi alkalmazásokból történő importtal, mesterséges intelligenciás csevegéssel és közösségi hozzáféréssel. A mesterséges intelligenciás fényképelemzés havi 5 alkalomra, az adatexport havi 3 alkalomra korlátozott.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/hó vagy 49,99 €/év, első alkalommal 7 nap ingyenes próbaidővel. Tartalmazza az Ingyenes csomag szolgáltatásait, és többek között korlátlan mesterséges intelligenciás fényképelemzést, korlátlan adatexportot, Cheat meals funkciót, Terhesség és Baba szekciót, ajánlott edzést, testméretkövetést és elsőbbségi támogatást.\u003c/p>\n  \u003cp>\u003cstrong>Család alap\u003c/strong> — 4,99 €/hó. Legfeljebb 4 profil egyetlen e-mail-cím és jelszó alatt, mindegyik saját, független testsúllyal, étkezésekkel és edzésekkel, az Ingyenes szinttel. \u003cstrong>Család prémium\u003c/strong> — 12,99 €/hó: ugyanez, de mind a 4 profil teljes Premium hozzáféréssel rendelkezik.\u003c/p>\n  \u003cp>\u003cstrong>Edző\u003c/strong> — 9,99 €/hó vagy 59,99 €/év, 7 nap ingyenes próbaidővel. Ez egy különálló csomag, amely tartalmazza a Premium szolgáltatásait és a „Sportolóim” területet a sportolók tanácsadásához: étrendek és edzések javaslása, haladásuk megtekintése és csevegés velük.\u003c/p>\n  \u003cp>Az egyes csomagok tartalma mindig látható az alkalmazásban („Csomag frissítése” képernyő), és változhat. A vonatkozó adók a fizetés előtt megjelennek. Az „elsőbbségi támogatás” azt jelenti, hogy az Ön üzenetét az ingyenes fiókok üzenetei előtt kezeljük, garantált válaszidő nélkül.\u003c/p>\n\n  \u003ch2>7 bis. Testépítés modul (külön előfizetés)\u003c/h2>\n  \u003cp>\u003cstrong>Mi ez.\u003c/strong> A Testépítés modul személyes nyilvántartó és nyomon követő eszköz: te jegyzed fel, amit már eldöntöttél, hogy szedni fogsz (az orvosoddal egyeztetve vagy saját döntésedből), a cesta. pedig naptárba rendezi, és tájékoztató jellegű görbéket rajzol. A görbék matematikai becslések, amelyek az általad megadott felezési időt vagy nyilvános forrásokból származó tájékoztató értéket használják; nem mérik a valós vérszintedet, és pontatlanok lehetnek.\u003c/p>\n  \u003cp>\u003cstrong>Mi nem ez.\u003c/strong> A cesta. nem ad orvosi tanácsot, diagnózist vagy kezelést, és nem javasol, nem ír fel, nem számol ki, nem módosít, nem ajánl anyagokat, adagokat vagy protokollokat. Nem árul, nem szállít és nem segíti elő semmilyen anyag beszerzését, nem ösztönzi azok használatát, és nem helyettesíti az egészségügyi szakembert. Sok anyag vényköteles gyógyszer, amelynek orvosi felügyelet nélküli beszerzése és használata jogellenes és egészségedre veszélyes lehet; a vonatkozó jogszabályok betartásáért és a döntéseidért kizárólag te vagy felelős. Ha riasztó tüneteket tapasztalsz, fordulj orvosi ellátáshoz, vagy hívd a 112-t.\u003c/p>\n  \u003cp>\u003cstrong>Csak 18 éves kortól.\u003c/strong> Legalább 18 évesnek kell lenned, és ezt az előfizetéskor megerősíted. Felfüggeszthetjük a modult, ha azt észleljük, hogy kiskorú használja, vagy e feltételekkel ellentétes módon használják.\u003c/p>\n  \u003cp>\u003cstrong>Ár és fizetés.\u003c/strong> 10 €/hó (az adókkal együtt, vagy a fizetés előtt megjelenítve), a csomagodtól (Ingyenes, Premium, Családi vagy Edzői) független előfizetés, ingyenes próbaidőszak nélkül. Minden hónapban automatikusan megújul, amíg le nem mondod. A fizetést a Stripe dolgozza fel.\u003c/p>\n  \u003cp>\u003cstrong>Elállás és lemondás.\u003c/strong> Az előfizetéssel kéred, hogy a szolgáltatás azonnal megkezdődjön. Fogyasztóként 14 napod van a szerződéstől való elállásra; ha azt a modul használata után gyakorolod, meg kell fizetned a már teljesített szolgáltatás arányos részét. Bármikor lemondhatod magából a modulból («Előfizetés kezelése vagy lemondása» gomb); a lemondás a már kifizetett időszak végén lép hatályba, és az előfizetés nem újul meg. Az elálláshoz használd a modul «Elállási jogom gyakorlása» gombját, vagy írj nekünk a kapcsolattartási e-mail-címre.\u003c/p>\n  \u003cp>\u003cstrong>Az adataid.\u003c/strong> A rögzített adatok a tieid: bármikor mindet törölheted az „Összes Testépítés adatom törlése” gombbal, és letöltheted a „Testépítés adataim letöltése” gombbal. Az előfizetés lemondásakor addig megőrződnek, amíg nem törlöd őket, kivéve, ha a fiók 18 hónapig inaktív. Senki más (edzők, ismerősök, Közösség) nem látja ezeket az adatokat. További részletek az Adatvédelmi irányelvekben.\u003c/p>\n  \u003cp>\u003cstrong>MI-csevegés.\u003c/strong> Aktív modul esetén a csevegés naptárba rendezheti, amit elmondasz neki, de saját kezdeményezésre nem javasol anyagokat, adagokat vagy protokollokat.\u003c/p>\n  \u003cp>\u003cstrong>Nincs orvos-beteg jogviszony; orvosi konzultáció.\u003c/strong> A modul használata nem hoz létre orvos-beteg jogviszonyt. Mielőtt bármilyen gyógyszert, kiegészítőt vagy protokollt elkezdenél, megváltoztatnál vagy abbahagynál, kérj tanácsot képzett egészségügyi szakembertől. Te felelsz a döntéseidért és az azokkal járó kockázatokért. A cesta. nem támogatja egyetlen anyag használatát sem a megengedett kereteken túl.\u003c/p>\n  \u003cp>\u003cstrong>Jogszerűség és elérhetőség.\u003c/strong> A rögzíthető anyagok közül sok nincs minden országban engedélyezve emberi felhasználásra, vagy csak vényre, illetve kutatási célra árusítható legálisan. Nem állítjuk, hogy a modul, az anyagok listája vagy a tartalma megfelelő, jogszerű vagy elérhető az országodban: a helyi jogszabályok betartásáért te felelsz. Az anyaglista kizárólag arra szolgál, hogy név szerint kiválaszthasd az anyagokat, és nem jelenti azt, hogy a cesta. jóváhagyja vagy ajánlja őket.\u003c/p>\n  \u003cp>\u003cstrong>Pontosság, MI és vészhelyzetek.\u003c/strong> Az adatok és a görbék az általad megadottakon és általunk nem ellenőrzött becsléseken alapulnak, ezért pontatlanok vagy hiányosak lehetnek. Az MI válaszai automatikusan készülnek, és hibákat tartalmazhatnak. Orvosi vészhelyzetben vagy súlyos tünetek esetén ne az alkalmazásra hagyatkozz: hívd a 112-t (vagy országod segélyhívó számát), vagy fordulj orvoshoz.\u003c/p>\n  \u003cp>\u003cstrong>Felelősség.\u003c/strong> A jogszabályok által megengedett mértékben a cesta. nem felel az olyan károkért, amelyek az alkalmazás információi alapján az anyagokkal vagy kezelésekkel kapcsolatban hozott döntéseidből erednek. Ez nem korlátozza a jogszabály által fogyasztóként megillető jogaidat, sem a szándékos joghátrányért, súlyos gondatlanságért, halálért vagy a mi hibánkból okozott személyi sérülésért fennálló felelősségünket.\u003c/p>\n  \u003cp>\u003cstrong>Felfüggesztés.\u003c/strong> Felfüggeszthetjük vagy megszüntethetjük a modult, ha e feltételekkel ellentétes használatot észlelünk (például kiskorúak általi használat, anyagok árusítása vagy népszerűsítése, illetve mások személyazonosságával való visszaélés), és visszatérítjük a már kifizetett, de igénybe nem vett időszak arányos részét.\u003c/p>\n\n  \u003ch2>8. Fizetések, ingyenes próbaidő, megújítás és lemondás\u003c/h2>\n  \u003cp>A fizetéseket a Stripe biztonságosan dolgozza fel; bankkártyaadatait soha nem látjuk és nem tároljuk. Az előfizetések minden időszak (havi vagy éves) végén automatikusan megújulnak, hacsak korábban nem mondja le. Ha az ingyenes próbaidő alatt mond le, semmit nem számítunk fel.\u003c/p>\n  \u003cp>Bármikor lemondhatja az előfizetést, csomagot válthat vagy frissítheti fizetési módját a csomagja melletti „Kezelés” gombbal, amely a Stripe biztonságos portáljára visz. Ha lemond, a már kifizetett időszak végéig megtartja a Premium hozzáférést. Ha egy fizetés sikertelen, a Stripe néhány napon át újra megkísérli a terhelést; ha továbbra sem sikerül, fiókja az Ingyenes csomagra vált, amíg frissíti fizetési módját.\u003c/p>\n  \u003cp>\u003cstrong>Elállási jog.\u003c/strong> Ha fogyasztó, jogosult 14 naptári napon belül elállni a szerződéstől annak megkötésétől számítva (a próbaidő vagy a fizetés kezdetétől), indokolás nélkül, a cestafitness@gmail.com címre írva. Mivel a digitális szolgáltatás az Ön kérésére azonnal megkezdődik, elállás esetén az addig igénybe vett szolgáltatás arányos részét meg kell fizetnie. Ezen törvényes jogon kívül az már eltelt időszakra nem téríthető vissza díj, kivéve, ha az alkalmazandó jog ezt előírja.\u003c/p>\n\n  \u003ch2>9. Meghívási program és kedvezmények\u003c/h2>\n  \u003cp>\u003cstrong>Barátok meghívása.\u003c/strong> Amikor az Ön kódjával regisztráló személyek fizetős csomagot vásárolnak, az Ön fizetős előfizetése kedvezményt kap aszerint, hogy ezek közül hányan fizetnek az adott pillanatban: 5 személy, 10%; 10 személy, 20%; 15 személy, 30%; 20 személy, 40%; 30 személy, 50%. A kedvezményhez saját aktív fizetős előfizetéssel kell rendelkeznie. A kedvezményt újraszámoljuk, ha változik a továbbra is fizető meghívottak száma; kizárólag az Ön saját előfizetésére vonatkozik, és soha nem váltható pénzre.\u003c/p>\n  \u003cp>\u003cstrong>Élelmiszerek beküldése.\u003c/strong> Ha egy hónapban 10 élelmiszert küld be, és mind a 10 jóváhagyásra kerül, 5% kedvezményt kap a következő díjából.\u003c/p>\n  \u003cp>Tilos hamis fiókokat regisztrálni vagy a saját kódot használni kedvezmények megszerzésére; ezeket visszavonhatjuk, és az érintett fiókokat felfüggeszthetjük. A programot előzetes értesítéssel módosíthatjuk vagy megszüntethetjük.\u003c/p>\n\n  \u003ch2>10. Szellemi tulajdon és licencek\u003c/h2>\n  \u003cp>A cesta. és logója, a dizájn, a szoftver, a szövegek és a fordítások jogosultjukat illetik, és jogszabály védi őket. Írásbeli engedély nélkül nem másolhatja, nem módosíthatja, nem terjesztheti és nem fejtheti vissza az alkalmazást.\u003c/p>\n  \u003cp>\u003cstrong>Harmadik felek forrásai.\u003c/strong> Az élelmiszer- és termékadatok egy része az Open Food Factsből (openfoodfacts.org) származik, amely az Open Database License (ODbL) licenc alatt érhető el. Nyílt forráskódú könyvtárakat (Supabase JS, jsPDF, Sentry, Capacitor, MIT licenc alatt), valamint a Space Grotesk és Inter betűtípusokat (SIL Open Font License) használunk.\u003c/p>\n\n  \u003ch2>11. Elérhetőség és felelősségkorlátozás\u003c/h2>\n  \u003cp>Mindent megteszünk azért, hogy az alkalmazás mindig működjön, de karbantartás vagy rajtunk kívül álló okok miatt kimaradások előfordulhatnak. A cesta. nem felel a kizárólag az alkalmazás információi alapján hozott egészségügyi döntésekért; mindig kérjen szakmai tanácsot. A fentiek egyike sem korlátozza a jog által a fogyasztóknak biztosított jogokat.\u003c/p>\n\n  \u003ch2>12. A jogviszony megszüntetése\u003c/h2>\n  \u003cp>Fiókját és valamennyi adatát bármikor törölheti a profiljából. Felfüggeszthetjük vagy megszüntethetjük azt a fiókot, amely megszegi e feltételeket.\u003c/p>\n\n  \u003ch2>13. E feltételek módosításai\u003c/h2>\n  \u003cp>Bármely lényeges módosításról legalább 30 nappal előre értesítjük.\u003c/p>\n\n  \u003ch2>14. Irányadó jog\u003c/h2>\n  \u003cp>E feltételekre a spanyol jog az irányadó. Ha fogyasztó, fordulhat lakóhelye szerinti bírósághoz, és megilletik Önt a lakóhelye szerinti ország fogyasztóvédelmi jogszabályai által biztosított jogok.\u003c/p>\n\n  \u003ch2>15. Kapcsolat\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","bg":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Последна актуализация: 24.09.2026 г.\u003c/p>\n\n  \u003ch2>1. Кои сме и какво предлагаме\u003c/h2>\n  \u003cp>Титуляр на cesta. е \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). За всякакви въпроси пишете на cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. е инструмент за планиране на храненето, изчисляване на макронутриенти, проследяване на тегло и телесни мерки, както и планиране и записване на тренировки. Включва разпознаване на храни по снимка и по баркод, чат с изкуствен интелект, рецепти, упражнения с анимирани демонстрации, раздели „Бременност“ и „Бебе“, интервално гладуване, връзка със здравни приложения, както и незадължителна общност и търсачка за треньори. Не е медицинско изделие, нито услуга за професионални консултации по хранене.\u003c/p>\n\n  \u003ch2>2. Вашият акаунт\u003c/h2>\n  \u003cp>Вие отговаряте за сигурността на паролата си. За да създадете акаунт, трябва да сте навършили поне 18 години. Информацията във вашия профил трябва да е вярна.\u003c/p>\n\n  \u003ch2>3. Общност и споделено съдържание\u003c/h2>\n  \u003cp>Вашият профил е частен по подразбиране. Ако го направите публичен или приемете приятелство, този човек ще вижда вашите менюта и снимки. Не качвайте съдържание, което нарушава права на трети лица или което идентифицира други хора без тяхно съгласие.\u003c/p>\n  \u003cp>\u003cstrong>Забранено съдържание.\u003c/strong> Не е позволено да качвате, изпращате в чата или да се опитвате да представите като търсене на техника на упражнение никакво съдържание със сексуален характер, с голота или внушаващо; насилствено, графично или смущаващо; расистко, хомофобско, изразяващо омраза или дискриминационно на каквото и да е основание (произход, религия, сексуална ориентация, полова идентичност, увреждане или друго); или незаконно съгласно приложимото право, включително всяко съдържание, което включва или сексуализира непълнолетни. Това се отнася до профилни снимки, снимки на напредъка, на храна и на добавени продукти, до съобщенията в чата между треньор и състезател или между потребители и до всеки текст, използван за търсене на видеа с техника.\u003c/p>\n  \u003cp>Всички снимки, които качвате, преминават през автоматичен филтър за модериране с изкуствен интелект, преди да бъдат приети (повече подробности в Политиката за поверителност). Опитът за заобикаляне на филтъра или многократното качване на забранено съдържание е основание за незабавно спиране или закриване на акаунта ви, без право на възстановяване на сумата за активния платен план, и без да се засяга правото ни да уведомим компетентните органи, когато законът ни задължава.\u003c/p>\n  \u003cp>Запазвате всички права върху съдържанието, което качвате. Давате ни разрешение, единствено за предоставяне на услугата, да го съхраняваме, да го показваме на лицата, с които решите да го споделите, и да го обработваме, както е обяснено в Политиката за поверителност.\u003c/p>\n\n  \u003ch2>4. Съдържание, генерирано от изкуствен интелект\u003c/h2>\n  \u003cp>Оценките, получени чрез анализ на снимка, чрез чата с изкуствен интелект или чрез автоматичните обобщения, са приблизителни и могат да съдържат грешки. Винаги ги проверявайте и не ги приемайте за медицински съвет.\u003c/p>\n\n  \u003ch2>5. Здраве, бременност, бебе и тренировки\u003c/h2>\n  \u003cp>Информацията в приложението служи за лична организация и е с общ характер. Не замества съвета на лекар, диетолог-нутриционист, акушерка, педиатър или треньор. Консултирайте се със специалист, преди да започнете програма за упражнения или да промените храненето си, и особено ако сте бременна или кърмите, имате заболяване, следвате лечение или ако информацията се отнася до бебе.\u003c/p>\n\n  \u003ch2>6. Треньори и състезатели\u003c/h2>\n  \u003cp>Треньорите, които използват cesta., са независими професионалисти. cesta. улеснява контакта и предоставя инструментите, но не контролира и не гарантира техните услуги, а отношението между треньор и състезател е изключително между тях. Плащанията между треньор и състезател се уреждат директно между тях, извън приложението; cesta. не взема комисиона и не участва в тези сделки. И двамата се задължават да третират информацията на другия с уважение и поверителност.\u003c/p>\n\n  \u003ch2>7. Планове и цени\u003c/h2>\n  \u003cp>\u003cstrong>Безплатен\u003c/strong> — без такса, с основните функции за планиране, калкулатор на макроси, база данни с храни и рецепти, списък за пазаруване, записване на тренировки, търсене по баркод, импортиране от здравни приложения, чат с изкуствен интелект и достъп до общността. Анализът на снимки с изкуствен интелект е ограничен до 5 на месец, а експортът на данни до 3 пъти месечно.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/месец или 49,99 €/година, със 7 дни безплатен пробен период за първи път. Включва всичко от плана Безплатен и, наред с други функции, неограничен анализ на снимки с изкуствен интелект, неограничен експорт на данни, Cheat meals, Бременност, Бебе, препоръчителни тренировки, проследяване на телесни мерки и приоритетна поддръжка.\u003c/p>\n  \u003cp>\u003cstrong>Семеен базов\u003c/strong> — 4,99 €/месец. До 4 профила с един и същ имейл и парола, всеки със свое независимо тегло, хранения и тренировки, с ниво Безплатен. \u003cstrong>Семеен premium\u003c/strong> — 12,99 €/месец: същото, но и 4-те профила имат пълен Premium.\u003c/p>\n  \u003cp>\u003cstrong>Треньор\u003c/strong> — 9,99 €/месец или 59,99 €/година, със 7 дни безплатен пробен период. Това е отделен план, който включва всичко от Premium и зоната „Моите състезатели“ за консултиране на състезатели: предлагане на менюта и тренировки, преглед на напредъка им и чат с тях.\u003c/p>\n  \u003cp>Какво включва всеки план винаги се показва в приложението (екран „Подобри плана си“) и може да се променя. Съответните данъци се показват преди плащането. „Приоритетна поддръжка“ означава, че вашето съобщение се обработва преди съобщенията от безплатни акаунти, без гарантиран срок за отговор.\u003c/p>\n\n  \u003ch2>7 bis. Модул Културизъм (отделен абонамент)\u003c/h2>\n  \u003cp>\u003cstrong>Какво представлява.\u003c/strong> Модулът Културизъм е инструмент за лично водене на записи и проследяване: вие записвате това, което вече сте решили да приемате (с вашия лекар или по собствена преценка), а cesta. го организира в календар и чертае ориентировъчни криви. Кривите са математически оценки, които използват посочения от вас период на полуразпад или ориентировъчна стойност от публични източници; те не измерват реалните ви нива в кръвта и може да са неточни.\u003c/p>\n  \u003cp>\u003cstrong>Какво не представлява.\u003c/strong> cesta. не дава медицински съвети, диагноза или лечение и не препоръчва, не предписва, не изчислява, не коригира и не предлага вещества, дози или схеми. Не продава, не доставя и не съдейства за придобиването на каквото и да е вещество, не насърчава употребата им и не замества медицински специалист. Много вещества са лекарства по лекарско предписание, чието придобиване и употреба без медицински контрол могат да бъдат незаконни и опасни за здравето ви; вие сте единствено отговорни за спазването на приложимото право и за решенията си. Ако имате тревожни симптоми, потърсете медицинска помощ или се обадете на 112.\u003c/p>\n  \u003cp>\u003cstrong>Само за лица над 18 години.\u003c/strong> Трябва да сте навършили 18 години и го потвърждавате при сключването на абонамента. Можем да преустановим модула, ако установим, че се използва от непълнолетен или в противоречие с настоящите условия.\u003c/p>\n  \u003cp>\u003cstrong>Цена и плащане.\u003c/strong> 10 €/месец (с включени данъци или показани преди плащането), абонамент, независим от плана ви (Безплатен, Premium, Семеен или Треньор) и без безплатен пробен период. Подновява се автоматично всеки месец, докато не го отмените. Плащането се обработва от Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Отказ и отмяна.\u003c/strong> При сключване на абонамента вие искате услугата да започне незабавно. Като потребител имате 14 дни да се откажете от договора; ако упражните това право, след като сте използвали модула, ще трябва да заплатите пропорционалната част от вече ползваната услуга. Можете да отмените по всяко време от самия модул (бутон «Управление или отмяна на абонамента»); отмяната влиза в сила в края на вече платения период и абонаментът не се подновява повече. За да се откажете, използвайте бутона «Упражняване на правото ми на отказ» в модула или ни пишете на имейла за контакт.\u003c/p>\n  \u003cp>\u003cstrong>Вашите данни.\u003c/strong> Данните, които записвате, са ваши: можете да ги изтриете всички по всяко време с «Изтриване на всичките ми данни от Културизъм» и да ги изтеглите с «Изтегли моите данни от Културизъм». При отмяна на абонамента те се запазват, докато не ги изтриете, освен ако профилът е неактивен от 18 месеца. Никой друг (треньори, приятели, Общност) не вижда тези данни. Повече подробности в Политиката за поверителност.\u003c/p>\n  \u003cp>\u003cstrong>Чат с ИИ.\u003c/strong> При активен модул чатът може да организира в календар това, което му кажете, но не предлага вещества, дози или схеми по собствена инициатива.\u003c/p>\n  \u003cp>\u003cstrong>Без отношения лекар–пациент и медицинска консултация.\u003c/strong> Използването на модула не създава отношения лекар–пациент. Преди да започнете, промените или спрете какъвто и да е медикамент, добавка или схема, консултирайте се с квалифициран медицински специалист. Вие носите отговорност за решенията си и за рисковете, които те крият. cesta. не одобрява употребата на каквото и да е вещество извън разрешеното.\u003c/p>\n  \u003cp>\u003cstrong>Законност и наличност.\u003c/strong> Много от веществата, които можете да записвате, не са разрешени за употреба при хора във всички държави или се продават законно само по лекарско предписание или за научни изследвания. Не твърдим, че модулът, списъкът му с вещества или съдържанието му са подходящи, законни или достъпни във вашата държава: вие носите отговорност за спазването на местното законодателство. Списъкът с вещества служи единствено за избирането им по наименование и не означава, че cesta. ги одобрява или препоръчва.\u003c/p>\n  \u003cp>\u003cstrong>Точност, ИИ и спешни случаи.\u003c/strong> Данните и кривите се основават на това, което въвеждате вие, и на оценки, които не проверяваме, и може да са неточни или непълни. Отговорите на ИИ се генерират автоматично и може да съдържат грешки. При спешен медицински случай или тежки симптоми не разчитайте на приложението: обадете се на 112 (или на номера за спешни случаи във вашата държава) или потърсете лекар.\u003c/p>\n  \u003cp>\u003cstrong>Отговорност.\u003c/strong> В степента, позволена от закона, cesta. не носи отговорност за вреди, произтичащи от решения, които вземате относно вещества или лечение въз основа на информацията в приложението. Това не ограничава правата, които законът ви признава като потребител, нито нашата отговорност за умисъл, груба небрежност, смърт или телесни увреждания, причинени по наша вина.\u003c/p>\n  \u003cp>\u003cstrong>Преустановяване.\u003c/strong> Можем да преустановим или отменим модула, ако установим употреба в противоречие с настоящите условия (например употреба от непълнолетни, продажба или популяризиране на вещества или представяне за друго лице), като възстановим пропорционалната част от вече платения и неизползван период.\u003c/p>\n\n  \u003ch2>8. Плащания, безплатен пробен период, подновяване и отказ\u003c/h2>\n  \u003cp>Плащанията се обработват сигурно чрез Stripe; никога не виждаме и не съхраняваме данните на вашата карта. Абонаментите се подновяват автоматично в края на всеки период (месечен или годишен), освен ако не откажете преди това. Ако откажете по време на безплатния пробен период, не се начислява нищо.\u003c/p>\n  \u003cp>Можете да откажете абонамента, да смените плана или да актуализирате начина си на плащане по всяко време чрез бутона „Управление“ до вашия план, който ви отвежда в защитения портал на Stripe. Ако откажете, запазвате достъпа до Premium до края на вече платения период. Ако плащане неуспее, Stripe ще опита да го събере отново в продължение на няколко дни; ако все още не може да бъде събрано, акаунтът ви преминава към плана Безплатен, докато не актуализирате начина си на плащане.\u003c/p>\n  \u003cp>\u003cstrong>Право на отказ.\u003c/strong> Ако сте потребител, имате право да се откажете от договора в срок от 14 календарни дни от сключването му (от началото на пробния период или плащането), без да посочвате причина, като пишете на cestafitness@gmail.com. Тъй като цифровата услуга започва незабавно по ваше искане, ако се откажете, ще трябва да заплатите пропорционалната част от услугата, която сте получили до този момент. Извън това законово право не се възстановяват суми за вече изтеклото време, освен ако приложимото право не го изисква.\u003c/p>\n\n  \u003ch2>9. Програма за покани и отстъпки\u003c/h2>\n  \u003cp>\u003cstrong>Покана на приятели.\u003c/strong> Когато лица, които се регистрират с вашия код, сключат платен план, вашият платен абонамент получава отстъпка според това колко от тези лица плащат в момента: 5 лица, 10 %; 10 лица, 20 %; 15 лица, 30 %; 20 лица, 40 %; 30 лица, 50 %. За да я получите, трябва да имате собствен активен платен абонамент. Отстъпката се преизчислява, ако се промени броят на поканените, които продължават да плащат, прилага се само към вашия собствен абонамент и никога не се превръща в пари.\u003c/p>\n  \u003cp>\u003cstrong>Добавяне на храни.\u003c/strong> Ако изпратите 10 храни за един месец и всичките 10 бъдат одобрени, получавате 5 % отстъпка от следващата си вноска.\u003c/p>\n  \u003cp>Забранено е регистрирането на фалшиви акаунти или използването на собствения ви код за получаване на отстъпки; можем да ги отнемем и да спрем засегнатите акаунти. Можем да променим или прекратим програмата с предварително уведомление.\u003c/p>\n\n  \u003ch2>10. Интелектуална собственост и лицензи\u003c/h2>\n  \u003cp>cesta. и нейното лого, дизайнът, софтуерът, текстовете и преводите принадлежат на нейния титуляр и са защитени със закон. Не можете да копирате, променяте, разпространявате или декомпилирате приложението без писмено разрешение.\u003c/p>\n  \u003cp>\u003cstrong>Източници на трети страни.\u003c/strong> Част от данните за храни и продукти идва от Open Food Facts (openfoodfacts.org) и е достъпна под лиценза Open Database License (ODbL). Използват се библиотеки с отворен код (Supabase JS, jsPDF, Sentry, Capacitor, с лиценз MIT) и шрифтовете Space Grotesk и Inter (лиценз SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Достъпност и ограничаване на отговорността\u003c/h2>\n  \u003cp>Правим всичко възможно приложението да работи непрекъснато, но може да има прекъсвания поради поддръжка или по причини извън нашия контрол. cesta. не носи отговорност за здравни решения, взети единствено въз основа на информацията в приложението; винаги се консултирайте със специалист. Нищо от изложеното не ограничава правата, които законът признава на потребителите.\u003c/p>\n\n  \u003ch2>12. Прекратяване на отношенията\u003c/h2>\n  \u003cp>Можете да изтриете акаунта си и всички свои данни по всяко време от профила си. Можем да спрем или закрием акаунт, който нарушава тези условия.\u003c/p>\n\n  \u003ch2>13. Промени в тези условия\u003c/h2>\n  \u003cp>Ще уведомяваме за всяка съществена промяна най-малко 30 дни предварително.\u003c/p>\n\n  \u003ch2>14. Приложимо право\u003c/h2>\n  \u003cp>Тези условия се уреждат от испанското право. Ако сте потребител, можете да се обърнете към съдилищата по вашето местожителство и запазвате правата, които ви признава потребителското законодателство на държавата, в която пребивавате.\u003c/p>\n\n  \u003ch2>15. Контакт\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","hr":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Posljednje ažuriranje: 24. 9. 2026.\u003c/p>\n\n  \u003ch2>1. Tko smo i što nudimo\u003c/h2>\n  \u003cp>Nositelj aplikacije cesta. je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Za sve upite piši na cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. je alat za planiranje obroka, izračun makronutrijenata, praćenje težine i mjera te planiranje i evidentiranje treninga. Uključuje prepoznavanje namirnica putem fotografije i barkoda, chat s umjetnom inteligencijom, recepte, vježbe s animiranim prikazima, odjeljke Trudnoća i Beba, povremeni post, povezivanje sa zdravstvenim aplikacijama te izbornu zajednicu i tražilicu trenera. Nije medicinski proizvod niti usluga stručnog savjetovanja o prehrani.\u003c/p>\n\n  \u003ch2>2. Tvoj račun\u003c/h2>\n  \u003cp>Odgovoran/odgovorna si za čuvanje svoje lozinke. Za otvaranje računa moraš imati najmanje 18 godina. Podaci u tvom profilu moraju biti istiniti.\u003c/p>\n\n  \u003ch2>3. Zajednica i podijeljeni sadržaj\u003c/h2>\n  \u003cp>Tvoj je profil prema zadanim postavkama privatan. Ako ga učiniš javnim ili prihvatiš prijateljstvo, ta će osoba vidjeti tvoje jelovnike i fotografije. Ne učitavaj sadržaj koji krši prava trećih osoba niti koji identificira druge osobe bez njihove privole.\u003c/p>\n  \u003cp>\u003cstrong>Zabranjeni sadržaj.\u003c/strong> Nije dopušteno učitavati, slati putem chata niti pokušavati provući kao pretragu tehnike vježbe nikakav sadržaj koji je seksualan, prikazuje golotinju ili je sugestivan; nasilan, grafički ili uznemirujući; rasistički, homofobni, mrzilački ili diskriminirajući po bilo kojoj osnovi (podrijetlo, vjera, seksualna orijentacija, rodni identitet, invaliditet ili drugo); ili nezakonit prema bilo kojem primjenjivom zakonu, uključujući svaki sadržaj koji uključuje ili seksualizira maloljetnike. To se odnosi na profilne fotografije, fotografije napretka, hrane i doprinesenih proizvoda, na poruke u chatu između trenera i sportaša ili među korisnicima te na svaki tekst koji se koristi za traženje videozapisa tehnike.\u003c/p>\n  \u003cp>Sve fotografije koje učitaš prije prihvaćanja prolaze kroz automatski filtar za moderiranje umjetnom inteligencijom (više pojedinosti u Politici privatnosti). Pokušaj zaobilaženja filtra ili opetovano učitavanje zabranjenog sadržaja razlog je za trenutačnu suspenziju ili zatvaranje tvog računa, bez prava na povrat sredstava za aktivni plaćeni plan, i ne dovodeći u pitanje našu obvezu obavještavanja nadležnih tijela kada nas na to obvezuje zakon.\u003c/p>\n  \u003cp>Zadržavaš sva prava na sadržaj koji učitaš. Daješ nam dopuštenje, isključivo radi pružanja usluge, da ga pohranjujemo, prikazujemo osobama s kojima ga odlučiš podijeliti i obrađujemo kako je objašnjeno u Politici privatnosti.\u003c/p>\n\n  \u003ch2>4. Sadržaj generiran umjetnom inteligencijom\u003c/h2>\n  \u003cp>Procjene dobivene analizom fotografija, chatom s umjetnom inteligencijom ili automatskim sažecima približne su i mogu sadržavati pogreške. Uvijek ih provjeri i nemoj ih smatrati liječničkim savjetom.\u003c/p>\n\n  \u003ch2>5. Zdravlje, trudnoća, beba i trening\u003c/h2>\n  \u003cp>Informacije u aplikaciji služe za osobnu organizaciju i opće informiranje. Ne zamjenjuju savjet liječnika, dijetetičara-nutricionista, primalje, pedijatra ili trenera. Posavjetuj se sa stručnom osobom prije početka programa vježbanja ili promjene prehrane, a osobito ako si trudna ili dojiš, imaš bolest, slijediš liječenje ili se informacija odnosi na bebu.\u003c/p>\n\n  \u003ch2>6. Treneri i sportaši\u003c/h2>\n  \u003cp>Treneri koji koriste cesta. neovisni su stručnjaci. cesta. omogućuje kontakt i alate, ali ne nadzire niti jamči njihove usluge, a odnos između trenera i sportaša isključivo je njihov međusobni odnos. Plaćanja između trenera i sportaša uređuju se izravno među njima, izvan aplikacije; cesta. ne naplaćuje proviziju niti sudjeluje u tim transakcijama. Obje se strane obvezuju s poštovanjem i povjerljivošću postupati s informacijama one druge.\u003c/p>\n\n  \u003ch2>7. Planovi i cijene\u003c/h2>\n  \u003cp>\u003cstrong>Besplatno\u003c/strong> — bez naknade, s osnovnim funkcijama planiranja, kalkulatorom makronutrijenata, bazom namirnica i recepata, popisom za kupnju, evidentiranjem treninga, pretraživanjem po barkodu, uvozom iz zdravstvenih aplikacija, chatom s umjetnom inteligencijom i pristupom zajednici. Analiza fotografija umjetnom inteligencijom ograničena je na 5 mjesečno, a izvoz podataka na 3 puta mjesečno.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mjesec ili 49,99 €/godinu, sa 7 dana besplatnog probnog razdoblja prvi put. Uključuje sve iz plana Besplatno i, među ostalim funkcijama, neograničenu analizu fotografija umjetnom inteligencijom, neograničen izvoz podataka, Cheat meals, Trudnoću, Bebu, preporučeni trening, praćenje mjera i prioritetnu podršku.\u003c/p>\n  \u003cp>\u003cstrong>Obiteljski osnovni\u003c/strong> — 4,99 €/mjesec. Do 4 profila pod istom e-adresom i lozinkom, svaki s vlastitom težinom, obrocima i treninzima, neovisno o drugima, s razinom Besplatno. \u003cstrong>Obiteljski premium\u003c/strong> — 12,99 €/mjesec: isto, ali sva 4 profila imaju potpuni Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trener\u003c/strong> — 9,99 €/mjesec ili 59,99 €/godinu, sa 7 dana besplatnog probnog razdoblja. To je zaseban plan koji uključuje sve iz plana Premium i područje „Moji sportaši” za savjetovanje sportaša: predlaganje jelovnika i treninga, uvid u njihov napredak i chat s njima.\u003c/p>\n  \u003cp>Sadržaj svakog plana uvijek je prikazan u aplikaciji (zaslon „Nadogradi svoj plan”) i može se mijenjati. Primjenjivi porezi prikazuju se prije plaćanja. „Prioritetna podrška” znači da se tvoja poruka rješava prije poruka besplatnih računa, bez zajamčenog vremena odgovora.\u003c/p>\n\n  \u003ch2>7 bis. Modul Bodybuilding (zasebna pretplata)\u003c/h2>\n  \u003cp>\u003cstrong>Što je to.\u003c/strong> Modul Bodybuilding je alat za osobno bilježenje i praćenje: ti unosiš što si već odlučio/odlučila uzimati (uz svog liječnika ili samostalno), a cesta. to organizira u kalendar i crta orijentacijske krivulje. Krivulje su matematičke procjene koje koriste poluvrijeme koje ti navedeš ili orijentacijsku vrijednost iz javnih izvora; ne mjere tvoje stvarne razine u krvi i mogu biti netočne.\u003c/p>\n  \u003cp>\u003cstrong>Što nije.\u003c/strong> cesta. ne daje medicinske savjete, dijagnozu ni liječenje te ne preporučuje, ne propisuje, ne izračunava, ne prilagođava niti predlaže tvari, doze ili sheme. Ne prodaje, ne isporučuje niti olakšava nabavu bilo koje tvari, ne potiče njihovu uporabu i ne zamjenjuje zdravstvenog djelatnika. Mnoge tvari su lijekovi na recept čija nabava i uporaba bez liječničkog nadzora mogu biti nezakonite i opasne za tvoje zdravlje; ti si jedini odgovoran/odgovorna za poštivanje primjenjivog prava i za svoje odluke. Ako imaš znakove upozorenja, obrati se liječničkoj službi ili nazovi 112.\u003c/p>\n  \u003cp>\u003cstrong>Samo za osobe starije od 18 godina.\u003c/strong> Moraš imati 18 ili više godina, što potvrđuješ prilikom ugovaranja. Možemo obustaviti modul ako utvrdimo da ga koristi maloljetnik ili da se koristi protivno ovim uvjetima.\u003c/p>\n  \u003cp>\u003cstrong>Cijena i plaćanje.\u003c/strong> 10 €/mj. (porezi uključeni ili prikazani prije plaćanja), pretplata neovisna o tvom paketu (Besplatni, Premium, Obiteljski ili Trener) i bez besplatnog probnog razdoblja. Automatski se obnavlja svaki mjesec dok je ne otkažeš. Plaćanje obrađuje Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Jednostrani raskid i otkaz.\u003c/strong> Ugovaranjem zahtijevaš da usluga započne odmah. Kao potrošač imaš 14 dana za jednostrani raskid ugovora; ako to pravo ostvariš nakon što si koristio/koristila modul, morat ćeš platiti razmjerni dio već iskorištene usluge. Pretplatu možeš otkazati kad god želiš izravno iz modula (gumb „Upravljaj pretplatom ili je otkaži“); otkaz stupa na snagu na kraju već plaćenog razdoblja i pretplata se više neće obnavljati. Za jednostrani raskid koristi gumb „Ostvari moje pravo na jednostrani raskid ugovora“ u modulu ili nam piši na kontaktnu e-adresu.\u003c/p>\n  \u003cp>\u003cstrong>Tvoji podaci.\u003c/strong> Podaci koje uneseš pripadaju tebi: možeš ih sve izbrisati u bilo kojem trenutku putem „Izbriši sve moje podatke iz modula Bodybuilding“ i preuzeti putem „Preuzmi moje podatke iz modula Bodybuilding“. Nakon otkazivanja pretplate čuvaju se dok ih ne izbrišeš, osim ako je račun neaktivan 18 mjeseci. Nitko drugi (treneri, prijatelji, Zajednica) ne vidi te podatke. Više pojedinosti u Politici privatnosti.\u003c/p>\n  \u003cp>\u003cstrong>Chat s umjetnom inteligencijom.\u003c/strong> Kada je modul aktivan, chat može u kalendar organizirati ono što mu ti kažeš, ali ne predlaže tvari, doze ni sheme na vlastitu inicijativu.\u003c/p>\n  \u003cp>\u003cstrong>Nema odnosa liječnik-pacijent i savjetovanje s liječnikom.\u003c/strong> Korištenje modula ne stvara odnos liječnik-pacijent. Prije nego što počneš, promijeniš ili prestaneš uzimati bilo koji lijek, dodatak prehrani ili shemu, posavjetuj se s kvalificiranim zdravstvenim djelatnikom. Ti si odgovoran/odgovorna za svoje odluke i rizike koje one nose. cesta. ne podržava uporabu nijedne tvari izvan onoga što je odobreno.\u003c/p>\n  \u003cp>\u003cstrong>Zakonitost i dostupnost.\u003c/strong> Mnoge tvari koje možeš evidentirati nisu odobrene za uporabu kod ljudi u svim zemljama ili se zakonito prodaju samo na recept ili za istraživanje. Ne tvrdimo da su modul, njegov popis tvari ni njegov sadržaj primjereni, zakoniti ili dostupni u tvojoj zemlji: ti si odgovoran/odgovorna za poštivanje lokalnih propisa. Popis tvari služi samo za njihov odabir po nazivu i ne znači da ih cesta. odobrava niti preporučuje.\u003c/p>\n  \u003cp>\u003cstrong>Točnost, umjetna inteligencija i hitni slučajevi.\u003c/strong> Podaci i krivulje temelje se na onome što ti uneseš i na procjenama koje ne provjeravamo te mogu biti netočni ili nepotpuni. Odgovori umjetne inteligencije generiraju se automatski i mogu sadržavati pogreške. U hitnom medicinskom slučaju ili kod teških simptoma ne oslanjaj se na aplikaciju: nazovi 112 (ili broj hitne pomoći svoje zemlje) ili se obrati liječniku.\u003c/p>\n  \u003cp>\u003cstrong>Odgovornost.\u003c/strong> U mjeri dopuštenoj zakonom, cesta. ne odgovara za štetu nastalu zbog odluka koje doneseš o tvarima ili liječenju na temelju informacija u aplikaciji. To ne ograničava prava koja ti zakon priznaje kao potrošaču niti našu odgovornost za namjeru, grubu nepažnju, smrt ili tjelesne ozljede uzrokovane našom krivnjom.\u003c/p>\n  \u003cp>\u003cstrong>Obustava.\u003c/strong> Možemo obustaviti ili otkazati modul ako utvrdimo uporabu protivnu ovim uvjetima (na primjer uporabu od strane maloljetnika, prodaju ili promicanje tvari ili lažno predstavljanje), uz povrat razmjernog dijela već plaćenog, a neiskorištenog razdoblja.\u003c/p>\n\n  \u003ch2>8. Plaćanja, besplatno probno razdoblje, obnova i otkazivanje\u003c/h2>\n  \u003cp>Plaćanja se sigurno obrađuju putem Stripea; nikada ne vidimo niti pohranjujemo podatke tvoje kartice. Pretplate se automatski obnavljaju na kraju svakog razdoblja (mjesečnog ili godišnjeg), osim ako ih prije toga ne otkažeš. Ako otkažeš tijekom besplatnog probnog razdoblja, ništa ti se ne naplaćuje.\u003c/p>\n  \u003cp>U svakom trenutku možeš otkazati, promijeniti plan ili ažurirati način plaćanja putem gumba „Upravljaj” pored svog plana, koji te vodi na sigurni Stripeov portal. Ako otkažeš, zadržavaš Premium pristup do kraja već plaćenog razdoblja. Ako plaćanje ne uspije, Stripe će nekoliko dana ponovno pokušavati naplatu; ako se i dalje ne može naplatiti, tvoj će račun prijeći na plan Besplatno dok ne ažuriraš način plaćanja.\u003c/p>\n  \u003cp>\u003cstrong>Pravo na odustanak.\u003c/strong> Ako si potrošač, imaš pravo odustati od ugovora u roku od 14 kalendarskih dana od njegova sklapanja (od početka probnog razdoblja ili plaćanja), bez navođenja razloga, pisanjem na cestafitness@gmail.com. Budući da digitalna usluga počinje odmah na tvoj zahtjev, ako odustaneš morat ćeš platiti razmjerni dio usluge koju si do tada primio/primila. Izvan tog zakonskog prava nema povrata za već proteklo vrijeme, osim ako to zahtijeva mjerodavno pravo.\u003c/p>\n\n  \u003ch2>9. Program pozivnica i popusta\u003c/h2>\n  \u003cp>\u003cstrong>Pozivanje prijatelja.\u003c/strong> Kada osobe koje se registriraju s tvojim kodom ugovore plaćeni plan, tvoja plaćena pretplata dobiva popust ovisno o tome koliko od tih osoba u tom trenutku plaća: 5 osoba, 10 %; 10 osoba, 20 %; 15 osoba, 30 %; 20 osoba, 40 %; 30 osoba, 50 %. Da bi ga ostvario/ostvarila, moraš imati vlastitu aktivnu plaćenu pretplatu. Popust se preračunava ako se promijeni broj pozvanih osoba koje i dalje plaćaju, primjenjuje se samo na tvoju vlastitu pretplatu i nikada se ne pretvara u novac.\u003c/p>\n  \u003cp>\u003cstrong>Doprinos namirnicama.\u003c/strong> Ako u jednom mjesecu pošalješ 10 namirnica i svih 10 bude potvrđeno, ostvaruješ popust od 5 % na sljedeću mjesečnu naknadu.\u003c/p>\n  \u003cp>Zabranjeno je otvarati lažne račune ili koristiti vlastiti kod radi ostvarivanja popusta; možemo ih ukinuti i suspendirati uključene račune. Program možemo izmijeniti ili ukinuti uz prethodnu obavijest.\u003c/p>\n\n  \u003ch2>10. Intelektualno vlasništvo i licencije\u003c/h2>\n  \u003cp>cesta. i njezin logotip, dizajn, softver, tekstovi i prijevodi pripadaju svom nositelju i zaštićeni su zakonom. Bez pisanog odobrenja ne smiješ kopirati, mijenjati, distribuirati niti provoditi obrnuti inženjering aplikacije.\u003c/p>\n  \u003cp>\u003cstrong>Zasluge trećih strana.\u003c/strong> Dio podataka o namirnicama i proizvodima potječe iz Open Food Facts (openfoodfacts.org), dostupnih pod licencijom Open Database License (ODbL). Koriste se biblioteke otvorenog koda (Supabase JS, jsPDF, Sentry, Capacitor, s licencijom MIT) te fontovi Space Grotesk i Inter (licencija SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Dostupnost i ograničenje odgovornosti\u003c/h2>\n  \u003cp>Činimo sve da aplikacija uvijek radi, ali mogu nastati prekidi zbog održavanja ili uzroka izvan naše kontrole. cesta. ne odgovara za zdravstvene odluke donesene isključivo na temelju informacija iz aplikacije; uvijek se posavjetuj sa stručnom osobom. Ništa od navedenog ne ograničava prava koja zakon priznaje potrošačima.\u003c/p>\n\n  \u003ch2>12. Prestanak odnosa\u003c/h2>\n  \u003cp>U svakom trenutku možeš izbrisati svoj račun i sve svoje podatke putem svog profila. Možemo suspendirati ili zatvoriti račun koji krši ove uvjete.\u003c/p>\n\n  \u003ch2>13. Izmjene ovih uvjeta\u003c/h2>\n  \u003cp>O svakoj bitnoj izmjeni obavijestit ćemo te najmanje 30 dana unaprijed.\u003c/p>\n\n  \u003ch2>14. Mjerodavno pravo\u003c/h2>\n  \u003cp>Ovi se uvjeti uređuju španjolskim pravom. Ako si potrošač, možeš se obratiti sudovima svog prebivališta i zadržavaš prava koja ti priznaju propisi o zaštiti potrošača tvoje zemlje boravišta.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","sl":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Zadnja posodobitev: 24. 9. 2026\u003c/p>\n\n  \u003ch2>1. Kdo smo in kaj ponujamo\u003c/h2>\n  \u003cp>Imetnik aplikacije cesta. je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Za vsa vprašanja piši na cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. je orodje za načrtovanje obrokov, izračun makrohranil, spremljanje teže in mer ter načrtovanje in beleženje treningov. Vključuje prepoznavanje živil s fotografijo in črtno kodo, klepet z umetno inteligenco, recepte, vaje z animiranimi prikazi, razdelka Nosečnost in Dojenček, intermitentni post, povezavo z zdravstvenimi aplikacijami ter neobvezno skupnost in iskalnik trenerjev. Ni medicinski pripomoček niti storitev strokovnega prehranskega svetovanja.\u003c/p>\n\n  \u003ch2>2. Tvoj račun\u003c/h2>\n  \u003cp>Odgovoren/odgovorna si za varno hrambo svojega gesla. Za ustvarjanje računa moraš biti star/stara vsaj 18 let. Podatki v tvojem profilu morajo biti resnični.\u003c/p>\n\n  \u003ch2>3. Skupnost in deljena vsebina\u003c/h2>\n  \u003cp>Tvoj profil je privzeto zaseben. Če ga narediš javnega ali sprejmeš prijateljstvo, ta oseba vidi tvoje jedilnike in fotografije. Ne nalagaj vsebine, ki krši pravice tretjih oseb ali ki brez njihove privolitve razkriva identiteto drugih oseb.\u003c/p>\n  \u003cp>\u003cstrong>Prepovedana vsebina.\u003c/strong> Prepovedano je nalagati, pošiljati po klepetu ali poskušati izdajati za iskanje tehnike vaje kakršno koli vsebino, ki je spolna, prikazuje golotico ali je vzpodbudna; nasilna, grafična ali vznemirljiva; rasistična, homofobna, sovražna ali diskriminatorna iz kakršnega koli razloga (izvor, vera, spolna usmerjenost, spolna identiteta, invalidnost ali drugo); ali nezakonita po kateri koli veljavni zakonodaji, vključno z vsako vsebino, ki vključuje mladoletnike ali jih seksualizira. To velja za profilne fotografije, fotografije napredka, hrane in prispevanih izdelkov, za sporočila v klepetu med trenerjem in športnikom ali med uporabniki ter za vsako besedilo, uporabljeno za iskanje videoposnetkov tehnike.\u003c/p>\n  \u003cp>Vse fotografije, ki jih naložiš, pred sprejetjem preidejo skozi samodejni filter za moderiranje z umetno inteligenco (več podrobnosti v politiki zasebnosti). Poskus izogibanja filtru ali ponavljajoče nalaganje prepovedane vsebine je razlog za takojšnjo začasno onemogočitev ali zaprtje tvojega računa, brez pravice do povračila aktivnega plačljivega paketa, in ne posega v našo obveznost obveščanja pristojnih organov, kadar nas k temu zavezuje zakon.\u003c/p>\n  \u003cp>Ohraniš vse pravice do vsebine, ki jo naložiš. Dovoljenje nam daš izključno za zagotavljanje storitve, da jo shranjujemo, prikazujemo osebam, s katerimi se odločiš deliti, in obdelujemo, kot je pojasnjeno v politiki zasebnosti.\u003c/p>\n\n  \u003ch2>4. Vsebina, ustvarjena z umetno inteligenco\u003c/h2>\n  \u003cp>Ocene, pridobljene z analizo fotografije, s klepetom z umetno inteligenco ali s samodejnimi povzetki, so približne in lahko vsebujejo napake. Vedno jih preveri in jih ne obravnavaj kot zdravniškega nasveta.\u003c/p>\n\n  \u003ch2>5. Zdravje, nosečnost, dojenček in trening\u003c/h2>\n  \u003cp>Informacije v aplikaciji so namenjene osebni organizaciji in splošnemu obveščanju. Ne nadomeščajo nasveta zdravnika, dietetika-nutricionista, babice, pediatra ali trenerja. Pred začetkom programa vadbe ali spremembo prehrane se posvetuj s strokovnjakom, zlasti če si noseča ali doješ, imaš bolezen, se zdraviš ali se informacija nanaša na dojenčka.\u003c/p>\n\n  \u003ch2>6. Trenerji in športniki\u003c/h2>\n  \u003cp>Trenerji, ki uporabljajo cesta., so samostojni strokovnjaki. cesta. omogoča stik in orodja, vendar njihovih storitev ne nadzoruje in zanje ne jamči, odnos med trenerjem in športnikom pa je izključno stvar med njima. Plačila med trenerjem in športnikom se urejajo neposredno med njima, zunaj aplikacije; cesta. ne zaračunava provizije in v te transakcije ne posega. Oba se zavezujeta, da bosta z informacijami drug drugega ravnala spoštljivo in zaupno.\u003c/p>\n\n  \u003ch2>7. Paketi in cene\u003c/h2>\n  \u003cp>\u003cstrong>Brezplačno\u003c/strong> — brez stroškov, z osnovnimi funkcijami načrtovanja, kalkulatorjem makrohranil, zbirko živil in receptov, nakupovalnim seznamom, beleženjem treningov, iskanjem po črtni kodi, uvozom iz zdravstvenih aplikacij, klepetom z umetno inteligenco in dostopom do skupnosti. Analiza fotografij z umetno inteligenco je omejena na 5 na mesec, izvoz podatkov pa na 3-krat na mesec.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mesec ali 49,99 €/leto, s 7 dnevi brezplačnega preizkusa ob prvem naročilu. Vključuje vse iz paketa Brezplačno in med drugim neomejeno analizo fotografij z umetno inteligenco, neomejen izvoz podatkov, Cheat meals, Nosečnost, Dojenčka, priporočeni trening, spremljanje mer in prednostno podporo.\u003c/p>\n  \u003cp>\u003cstrong>Družinski osnovni\u003c/strong> — 4,99 €/mesec. Do 4 profili pod istim e-poštnim naslovom in geslom, vsak z lastno težo, obroki in treningi, neodvisno od drugih, z ravnjo Brezplačno. \u003cstrong>Družinski premium\u003c/strong> — 12,99 €/mesec: enako, vendar imajo vsi 4 profili polni Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trener\u003c/strong> — 9,99 €/mesec ali 59,99 €/leto, s 7 dnevi brezplačnega preizkusa. Je poseben paket, ki vključuje vse iz paketa Premium in področje „Moji športniki“ za svetovanje športnikom: predlaganje jedilnikov in treningov, vpogled v njihov napredek in klepet z njimi.\u003c/p>\n  \u003cp>Kaj vsebuje posamezen paket, je vedno prikazano v aplikaciji (zaslon „Nadgradi svoj paket“) in se lahko spreminja. Ustrezni davki so prikazani pred plačilom. „Prednostna podpora“ pomeni, da se tvoje sporočilo obravnava pred sporočili brezplačnih računov, brez zajamčenega odzivnega časa.\u003c/p>\n\n  \u003ch2>7 bis. Modul Bodybuilding (ločena naročnina)\u003c/h2>\n  \u003cp>\u003cstrong>Kaj je.\u003c/strong> Modul Bodybuilding je orodje za osebno beleženje in spremljanje: ti vneseš, kar si se že odločil/a jemati (z zdravnikom ali sam/a), cesta. pa to uredi v koledar in nariše okvirne krivulje. Krivulje so matematične ocene, ki uporabljajo razpolovni čas, ki ga navedeš, ali okvirno vrednost iz javnih virov; ne merijo tvojih dejanskih ravni v krvi in so lahko netočne.\u003c/p>\n  \u003cp>\u003cstrong>Kaj ni.\u003c/strong> cesta. ne daje zdravniških nasvetov, diagnoze ali zdravljenja ter ne priporoča, ne predpisuje, ne izračunava, ne prilagaja in ne predlaga snovi, odmerkov ali shem. Ne prodaja, ne dobavlja in ne olajšuje pridobitve nobene snovi, ne spodbuja njihove uporabe in ne nadomešča zdravstvenega delavca. Številne snovi so zdravila na recept, katerih pridobivanje in uporaba brez zdravniškega nadzora sta lahko nezakonita in nevarna za tvoje zdravje; za spoštovanje veljavne zakonodaje in za svoje odločitve si odgovoren/odgovorna samo ti. Če imaš opozorilne simptome, se obrni na zdravniško službo ali pokliči 112.\u003c/p>\n  \u003cp>\u003cstrong>Samo za osebe, starejše od 18 let.\u003c/strong> Star/a moraš biti 18 let ali več, kar potrdiš ob sklenitvi naročnine. Modul lahko onemogočimo, če ugotovimo, da ga uporablja mladoletnik ali da se uporablja v nasprotju s temi pogoji.\u003c/p>\n  \u003cp>\u003cstrong>Cena in plačilo.\u003c/strong> 10 €/mesec (davki vključeni ali prikazani pred plačilom), naročnina, neodvisna od tvojega paketa (Brezplačni, Premium, Družinski ali Trener) in brez brezplačnega preizkusa. Samodejno se obnavlja vsak mesec, dokler je ne prekličeš. Plačilo obdeluje Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Odstop od pogodbe in preklic.\u003c/strong> Ob sklenitvi zahtevaš, da se storitev začne izvajati takoj. Kot potrošnik imaš 14 dni za odstop od pogodbe; če to pravico uveljaviš, potem ko si modul že uporabljal/a, boš moral/a plačati sorazmerni del že izkoriščene storitve. Naročnino lahko kadar koli prekličeš v samem modulu (gumb „Upravljaj ali prekliči naročnino“); preklic začne veljati ob koncu že plačanega obdobja in se naročnina ne obnovi več. Za odstop uporabi gumb „Uveljavljaj pravico do odstopa od pogodbe“ v modulu ali nam piši na kontaktni e-naslov.\u003c/p>\n  \u003cp>\u003cstrong>Tvoji podatki.\u003c/strong> Podatki, ki jih vneseš, so tvoji: kadar koli jih lahko vse izbrišeš z „Izbriši vse moje podatke modula Bodybuilding“ in preneseš z „Prenesi moje podatke modula Bodybuilding“. Ob preklicu naročnine se hranijo, dokler jih ne izbrišeš, razen če je račun neaktiven 18 mesecev. Nihče drug (trenerji, prijatelji, Skupnost) teh podatkov ne vidi. Več podrobnosti v Politiki zasebnosti.\u003c/p>\n  \u003cp>\u003cstrong>Klepet z umetno inteligenco.\u003c/strong> Ko je modul aktiven, lahko klepet v koledar uredi to, kar mu poveš, vendar samoiniciativno ne predlaga snovi, odmerkov ali shem.\u003c/p>\n  \u003cp>\u003cstrong>Brez razmerja zdravnik-pacient in posvet z zdravnikom.\u003c/strong> Uporaba modula ne vzpostavlja razmerja zdravnik-pacient. Preden začneš, spremeniš ali prenehaš jemati kakršno koli zdravilo, prehransko dopolnilo ali shemo, se posvetuj s kvalificiranim zdravstvenim delavcem. Za svoje odločitve in tveganja, ki jih prinašajo, si odgovoren/odgovorna ti. cesta. ne podpira uporabe nobene snovi zunaj dovoljenega.\u003c/p>\n  \u003cp>\u003cstrong>Zakonitost in razpoložljivost.\u003c/strong> Številne snovi, ki jih lahko beležiš, niso dovoljene za uporabo pri ljudeh v vseh državah ali se zakonito prodajajo samo na recept ali za raziskave. Ne trdimo, da so modul, njegov seznam snovi ali njegova vsebina primerni, zakoniti ali na voljo v tvoji državi: za spoštovanje lokalne zakonodaje si odgovoren/odgovorna ti. Seznam snovi služi samo za njihovo izbiro po imenu in ne pomeni, da jih cesta. odobrava ali priporoča.\u003c/p>\n  \u003cp>\u003cstrong>Točnost, umetna inteligenca in nujni primeri.\u003c/strong> Podatki in krivulje temeljijo na tem, kar vneseš, in na ocenah, ki jih ne preverjamo, ter so lahko netočni ali nepopolni. Odgovori umetne inteligence se ustvarjajo samodejno in lahko vsebujejo napake. V nujnem zdravstvenem primeru ali pri hudih simptomih se ne zanašaj na aplikacijo: pokliči 112 (ali številko za nujne primere v svoji državi) ali obišči zdravnika.\u003c/p>\n  \u003cp>\u003cstrong>Odgovornost.\u003c/strong> V obsegu, ki ga dovoljuje zakon, cesta. ne odgovarja za škodo, ki izhaja iz odločitev o snoveh ali zdravljenju, ki jih sprejmeš na podlagi informacij v aplikaciji. To ne omejuje pravic, ki ti jih zakon priznava kot potrošniku, niti naše odgovornosti za naklep, hudo malomarnost, smrt ali telesne poškodbe, ki jih povzročimo po svoji krivdi.\u003c/p>\n  \u003cp>\u003cstrong>Začasna ustavitev.\u003c/strong> Modul lahko začasno ustavimo ali prekličemo, če ugotovimo uporabo, ki je v nasprotju s temi pogoji (na primer uporabo s strani mladoletnikov, prodajo ali promocijo snovi ali lažno predstavljanje), pri čemer povrnemo sorazmerni del že plačanega in neizkoriščenega obdobja.\u003c/p>\n\n  \u003ch2>8. Plačila, brezplačen preizkus, podaljšanje in odpoved\u003c/h2>\n  \u003cp>Plačila se varno obdelujejo prek storitve Stripe; podatkov tvoje kartice nikoli ne vidimo in jih ne hranimo. Naročnine se samodejno podaljšajo ob koncu vsakega obdobja (mesečnega ali letnega), razen če jih prej odpoveš. Če odpoveš med brezplačnim preizkusom, ti ni zaračunano nič.\u003c/p>\n  \u003cp>Kadar koli lahko odpoveš, zamenjaš paket ali posodobiš način plačila z gumbom „Upravljaj“ ob svojem paketu, ki te pripelje na varni portal storitve Stripe. Če odpoveš, obdržiš dostop do paketa Premium do konca že plačanega obdobja. Če plačilo ne uspe, bo Stripe nekaj dni ponavljal poskuse obračuna; če se še vedno ne da zaračunati, bo tvoj račun prešel na paket Brezplačno, dokler ne posodobiš načina plačila.\u003c/p>\n  \u003cp>\u003cstrong>Pravica do odstopa.\u003c/strong> Če si potrošnik, imaš pravico od pogodbe odstopiti v 14 koledarskih dneh od sklenitve (od začetka preizkusa ali plačila), brez navedbe razloga, s pisanjem na cestafitness@gmail.com. Ker se digitalna storitev na tvojo zahtevo začne takoj, boš moral/morala v primeru odstopa plačati sorazmerni del storitve, ki si jo do tedaj prejel/prejela. Zunaj te zakonske pravice povračil za že pretekli čas ni, razen če to zahteva veljavno pravo.\u003c/p>\n\n  \u003ch2>9. Program povabil in popustov\u003c/h2>\n  \u003cp>\u003cstrong>Vabljenje prijateljev.\u003c/strong> Ko osebe, ki se registrirajo z tvojo kodo, sklenejo plačljivi paket, tvoja plačljiva naročnina prejme popust glede na to, koliko teh oseb v tistem trenutku plačuje: 5 oseb, 10 %; 10 oseb, 20 %; 15 oseb, 30 %; 20 oseb, 40 %; 30 oseb, 50 %. Da ga prejmeš, moraš imeti lastno aktivno plačljivo naročnino. Popust se preračuna, če se spremeni število povabljenih oseb, ki še vedno plačujejo, velja samo za tvojo lastno naročnino in se nikoli ne pretvori v denar.\u003c/p>\n  \u003cp>\u003cstrong>Prispevanje živil.\u003c/strong> Če v enem mesecu pošlješ 10 živil in je vseh 10 potrjenih, imaš 5 % popust pri naslednji mesečni članarini.\u003c/p>\n  \u003cp>Prepovedano je registrirati lažne račune ali uporabljati lastno kodo za pridobitev popustov; lahko jih umaknemo in vpletene račune začasno onemogočimo. Program lahko spremenimo ali ukinemo z vnaprejšnjim obvestilom.\u003c/p>\n\n  \u003ch2>10. Intelektualna lastnina in licence\u003c/h2>\n  \u003cp>cesta. in njen logotip, zasnova, programska oprema, besedila in prevodi pripadajo njenemu imetniku in so zaščiteni z zakonom. Brez pisnega dovoljenja aplikacije ne smeš kopirati, spreminjati, distribuirati ali razstavljati (povratni inženiring).\u003c/p>\n  \u003cp>\u003cstrong>Zasluge tretjih oseb.\u003c/strong> Del podatkov o živilih in izdelkih izvira iz Open Food Facts (openfoodfacts.org), ki so na voljo pod licenco Open Database License (ODbL). Uporabljajo se odprtokodne knjižnice (Supabase JS, jsPDF, Sentry, Capacitor, z licenco MIT) ter pisavi Space Grotesk in Inter (licenca SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Razpoložljivost in omejitev odgovornosti\u003c/h2>\n  \u003cp>Trudimo se, da bi aplikacija vedno delovala, vendar lahko pride do prekinitev zaradi vzdrževanja ali vzrokov zunaj našega nadzora. cesta. ne odgovarja za zdravstvene odločitve, sprejete izključno na podlagi informacij v aplikaciji; vedno se posvetuj s strokovnjakom. Nič od navedenega ne omejuje pravic, ki jih zakon priznava potrošnikom.\u003c/p>\n\n  \u003ch2>12. Prenehanje razmerja\u003c/h2>\n  \u003cp>Kadar koli lahko v svojem profilu izbrišeš svoj račun in vse svoje podatke. Račun, ki krši te pogoje, lahko začasno onemogočimo ali zapremo.\u003c/p>\n\n  \u003ch2>13. Spremembe teh pogojev\u003c/h2>\n  \u003cp>O vsaki pomembni spremembi te bomo obvestili vsaj 30 dni vnaprej.\u003c/p>\n\n  \u003ch2>14. Pravo, ki se uporablja\u003c/h2>\n  \u003cp>Ti pogoji se ravnajo po španskem pravu. Če si potrošnik, se lahko obrneš na sodišča v kraju svojega prebivališča in ohraniš pravice, ki ti jih priznavajo potrošniški predpisi tvoje države prebivališča.\u003c/p>\n\n  \u003ch2>15. Stik\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","et":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Viimati uuendatud: 24.09.2026\u003c/p>\n\n  \u003ch2>1. Kes me oleme ja mida pakume\u003c/h2>\n  \u003cp>cesta. omanik on \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Kõigi päringutega pöördu aadressil cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. on söögikordade planeerimise, makrotoitainete arvutamise, kaalu ja mõõtude jälgimise ning treeningute planeerimise ja registreerimise tööriist. See sisaldab toidu tuvastamist foto ja vöötkoodi abil, tehisintellekti vestlust, retsepte, animeeritud demonstratsioonidega harjutusi, jaotisi Rasedus ja Beebi, intervallpaastu, ühendust terviserakendustega ning valikulist kogukonda ja treenerite otsingut. See ei ole meditsiiniseade ega professionaalne toitumisnõustamisteenus.\u003c/p>\n\n  \u003ch2>2. Sinu konto\u003c/h2>\n  \u003cp>Sina vastutad oma parooli turvalise hoidmise eest. Konto loomiseks pead olema vähemalt 18-aastane. Sinu profiili teave peab olema tõene.\u003c/p>\n\n  \u003ch2>3. Kogukond ja jagatud sisu\u003c/h2>\n  \u003cp>Sinu profiil on vaikimisi privaatne. Kui teed selle avalikuks või nõustud sõprussuhtega, näeb see isik sinu menüüsid ja fotosid. Ära lae üles sisu, mis rikub kolmandate isikute õigusi või mis tuvastab teisi isikuid ilma nende nõusolekuta.\u003c/p>\n  \u003cp>\u003cstrong>Keelatud sisu.\u003c/strong> Keelatud on üles laadida, vestluses saata või harjutuse tehnika otsinguna esitada mis tahes seksuaalset, alastust kujutavat või vihjavat sisu; vägivaldset, graafilist või häirivat sisu; rassistlikku, homofoobset, vihkamist õhutavat või mis tahes alusel diskrimineerivat sisu (päritolu, religioon, seksuaalne sättumus, sooidentiteet, puue või muu); või mis tahes kohaldatava õiguse kohaselt ebaseaduslikku sisu, sealhulgas sisu, mis hõlmab alaealisi või seksualiseerib neid. See kehtib profiili-, edenemis-, toidu- ja panustatud toodete fotode kohta, treeneri ja sportlase või kasutajate vaheliste vestlussõnumite kohta ning mis tahes teksti kohta, mida kasutatakse tehnikavideote otsimiseks.\u003c/p>\n  \u003cp>Kõik sinu üleslaaditud fotod läbivad enne vastuvõtmist tehisintellektil põhineva automaatse modereerimisfiltri (täpsemalt privaatsuspoliitikas). Filtri kõrvalehiskamise katse või keelatud sisu korduv üleslaadimine on põhjus sinu konto viivitamatuks peatamiseks või sulgemiseks, ilma aktiivse tasulise paketi tagasimakse õiguseta ning ilma et see piiraks meie kohustust teavitada pädevaid ametiasutusi, kui seadus seda nõuab.\u003c/p>\n  \u003cp>Sulle jäävad kõik õigused sisule, mille üles laadid. Annad meile loa, ainult teenuse osutamiseks, seda salvestada, näidata isikutele, kellega otsustad seda jagada, ning töödelda nii, nagu on selgitatud privaatsuspoliitikas.\u003c/p>\n\n  \u003ch2>4. Tehisintellekti loodud sisu\u003c/h2>\n  \u003cp>Fotoanalüüsi, tehisintellekti vestluse või automaatsete kokkuvõtete abil saadud hinnangud on ligikaudsed ja võivad sisaldada vigu. Kontrolli neid alati üle ja ära käsitle neid meditsiinilise nõuandena.\u003c/p>\n\n  \u003ch2>5. Tervis, rasedus, beebi ja treening\u003c/h2>\n  \u003cp>Rakenduse teave on mõeldud isiklikuks korralduseks ja üldiseks teavituseks. See ei asenda arsti, dietoloogi-toitumisnõustaja, ämmaemanda, lastearsti ega treeneri nõuannet. Konsulteeri enne treeningprogrammi alustamist või toitumise muutmist spetsialistiga, eriti kui oled rase või toidad last rinnaga, põed haigust, oled ravil või teave puudutab beebit.\u003c/p>\n\n  \u003ch2>6. Treenerid ja sportlased\u003c/h2>\n  \u003cp>cesta. kasutavad treenerid on sõltumatud spetsialistid. cesta. pakub kontakti ja tööriistu, kuid ei jälgi ega garanteeri nende teenuseid ning treeneri ja sportlase suhe on ainult nende omavaheline. Treeneri ja sportlase vahelisi makseid korraldavad nad otse omavahel, väljaspool rakendust; cesta. ei võta vahendustasu ega osale nendes tehingutes. Mõlemad kohustuvad kohtlema teineteise teavet lugupidavalt ja konfidentsiaalselt.\u003c/p>\n\n  \u003ch2>7. Paketid ja hinnad\u003c/h2>\n  \u003cp>\u003cstrong>Tasuta\u003c/strong> — tasuta, põhiliste planeerimisfunktsioonidega, makrokalkulaatoriga, toitude ja retseptide andmebaasiga, ostunimekirjaga, treeningute registreerimisega, vöötkoodiotsinguga, importimisega terviserakendustest, tehisintellekti vestluse ja kogukonnale juurdepääsuga. Tehisintellektiga fotoanalüüs on piiratud 5 korraga kuus ja andmete eksport 3 korraga kuus.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/kuu või 49,99 €/aasta, esimesel korral 7-päevase tasuta prooviajaga. Sisaldab kõike, mis on paketis Tasuta, ning muu hulgas piiramatut tehisintellektiga fotoanalüüsi, piiramatut andmeeksporti, Cheat meals, Rasedust, Beebit, soovitatud treeningut, mõõtude jälgimist ja prioriteetset tuge.\u003c/p>\n  \u003cp>\u003cstrong>Pere põhipakett\u003c/strong> — 4,99 €/kuu. Kuni 4 profiili sama e-posti aadressi ja parooli all, igaühel oma kaal, toidukorrad ja treeningud teistest sõltumatult, Tasuta taseme funktsioonidega. \u003cstrong>Pere premium\u003c/strong> — 12,99 €/kuu: sama, kuid kõigil 4 profiilil on täielik Premium.\u003c/p>\n  \u003cp>\u003cstrong>Treener\u003c/strong> — 9,99 €/kuu või 59,99 €/aasta, 7-päevase tasuta prooviajaga. See on eraldi pakett, mis sisaldab kõike, mis on paketis Premium, ning ala „Minu sportlased“ sportlaste nõustamiseks: menüüde ja treeningute pakkumine, nende edenemise vaatamine ja nendega vestlemine.\u003c/p>\n  \u003cp>Iga paketi sisu on rakenduses alati nähtav (ekraan „Täienda oma paketti“) ja võib muutuda. Kohaldatavad maksud kuvatakse enne tasumist. „Prioriteetne tugi“ tähendab, et sinu sõnumit menetletakse enne tasuta kontode sõnumeid, ilma tagatud vastamisajata.\u003c/p>\n\n  \u003ch2>7 bis. Moodul Kulturism (eraldi tellimus)\u003c/h2>\n  \u003cp>\u003cstrong>Mis see on.\u003c/strong> Moodul Kulturism on isikliku märkimise ja jälgimise tööriist: sina märgid üles, mida oled juba otsustanud võtta (koos oma arstiga või omal käel), ja cesta. korraldab selle kalendrisse ning joonistab orienteeruvad kõverad. Kõverad on matemaatilised hinnangud, mis kasutavad sinu märgitud poolestusaega või avalikest allikatest pärit orienteeruvat väärtust; need ei mõõda sinu tegelikku veretaset ja võivad olla ebatäpsed.\u003c/p>\n  \u003cp>\u003cstrong>Mis see ei ole.\u003c/strong> cesta. ei anna meditsiinilist nõu, diagnoosi ega ravi ning ei soovita, ei määra, ei arvuta, ei kohanda ega paku aineid, annuseid ega skeeme. Ta ei müü, ei tarni ega hõlbusta ühegi aine hankimist, ei soodusta nende kasutamist ega asenda tervishoiutöötajat. Paljud ained on retseptiravimid, mille hankimine ja kasutamine ilma arstliku järelevalveta võib olla ebaseaduslik ja sinu tervisele ohtlik; ainult sina vastutad kohaldatava õiguse järgimise ja oma otsuste eest. Kui sul on hoiatavaid sümptomeid, pöördu arsti poole või helista numbril 112.\u003c/p>\n  \u003cp>\u003cstrong>Ainult üle 18-aastastele.\u003c/strong> Sa pead olema 18-aastane või vanem, mida kinnitad tellimisel. Võime mooduli peatada, kui avastame, et seda kasutab alaealine või et seda kasutatakse nende tingimuste vastaselt.\u003c/p>\n  \u003cp>\u003cstrong>Hind ja tasumine.\u003c/strong> 10 €/kuus (maksud sisalduvad hinnas või kuvatakse enne maksmist), tellimus on sinu paketist sõltumatu (Tasuta, Premium, Pere või Treener) ja tasuta prooviperioodita. See uueneb automaatselt iga kuu, kuni selle tühistad. Makse töötleb Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Taganemine ja tühistamine.\u003c/strong> Tellimisel palud, et teenus algaks kohe. Tarbijana on sul 14 päeva lepingust taganemiseks; kui kasutad seda õigust pärast mooduli kasutamist, pead tasuma juba kasutatud teenuse proportsionaalse osa. Tellimuse võid igal ajal tühistada moodulis endas (nupp „Halda või tühista tellimus“); tühistamine jõustub juba makstud perioodi lõpus ja tellimus enam ei uuene. Taganemiseks kasuta mooduli nuppu „Kasuta oma taganemisõigust“ või kirjuta meile kontaktmeilil.\u003c/p>\n  \u003cp>\u003cstrong>Sinu andmed.\u003c/strong> Sinu registreeritud andmed kuuluvad sulle: võid need kõik igal ajal kustutada valikuga „Kustuta kõik minu Kulturismi andmed“ ja alla laadida valikuga „Laadi alla minu Kulturismi andmed“. Tellimuse tühistamisel säilitatakse need seni, kuni need kustutad, välja arvatud juhul, kui konto on olnud 18 kuud passiivne. Keegi teine (treenerid, sõbrad, Kogukond) neid andmeid ei näe. Täpsemalt Privaatsuspoliitikas.\u003c/p>\n  \u003cp>\u003cstrong>Tehisintellekti vestlus.\u003c/strong> Kui moodul on aktiivne, võib vestlus korraldada kalendrisse selle, mida sa talle räägid, kuid ta ei paku omal algatusel aineid, annuseid ega skeeme.\u003c/p>\n  \u003cp>\u003cstrong>Arsti ja patsiendi suhet ei teki ning konsulteerimine arstiga.\u003c/strong> Mooduli kasutamine ei loo arsti ja patsiendi suhet. Enne mis tahes ravimi, toidulisandi või skeemi võtmist, muutmist või lõpetamist konsulteeri kvalifitseeritud tervishoiutöötajaga. Sina vastutad oma otsuste ja nendega kaasnevate riskide eest. cesta. ei toeta ühegi aine kasutamist lubatust väljaspool.\u003c/p>\n  \u003cp>\u003cstrong>Seaduslikkus ja kättesaadavus.\u003c/strong> Paljud ained, mida saad registreerida, ei ole kõigis riikides inimesele kasutamiseks lubatud või neid müüakse seaduslikult ainult retsepti alusel või teadusuuringuteks. Me ei väida, et moodul, selle ainete loend või sisu on sinu riigis sobiv, seaduslik või kättesaadav: sina vastutad kohaliku õiguse järgimise eest. Ainete loend võimaldab neid ainult nime järgi valida ega tähenda, et cesta. neid heaks kiidab või soovitab.\u003c/p>\n  \u003cp>\u003cstrong>Täpsus, tehisintellekt ja hädaolukorrad.\u003c/strong> Andmed ja kõverad põhinevad sellel, mida sisestad, ning hinnangutel, mida me ei kontrolli, ja need võivad olla ebatäpsed või puudulikud. Tehisintellekti vastused luuakse automaatselt ja need võivad sisaldada vigu. Meditsiinilise hädaolukorra või tõsiste sümptomite korral ära looda rakendusele: helista numbril 112 (või oma riigi hädaabinumbril) või pöördu arsti poole.\u003c/p>\n  \u003cp>\u003cstrong>Vastutus.\u003c/strong> Seadusega lubatud ulatuses cesta. ei vastuta kahju eest, mis tuleneb otsustest, mida teed ainete või ravi kohta rakenduse teabe põhjal. See ei piira õigusi, mida seadus sulle tarbijana annab, ega meie vastutust tahtluse, raske hooletuse, surma või meie süül põhjustatud kehavigastuste eest.\u003c/p>\n  \u003cp>\u003cstrong>Peatamine.\u003c/strong> Võime mooduli peatada või tühistada, kui avastame nende tingimuste vastast kasutust (näiteks alaealiste poolt kasutamine, ainete müük või reklaamimine või teise isiku kuritahtlik esindamine), hüvitades juba makstud ja kasutamata perioodi proportsionaalse osa.\u003c/p>\n\n  \u003ch2>8. Maksed, tasuta prooviaeg, pikendamine ja tühistamine\u003c/h2>\n  \u003cp>Makseid töödeldakse turvaliselt Stripe'i kaudu; me ei näe ega salvesta sinu kaardi andmeid. Tellimused pikenevad automaatselt iga perioodi (kuu või aasta) lõpus, kui sa neid enne ei tühista. Kui tühistad tasuta prooviaja jooksul, ei võeta sinult midagi.\u003c/p>\n  \u003cp>Saad igal ajal tühistada, paketti vahetada või makseviisi uuendada oma paketi kõrval oleva nupu „Halda“ kaudu, mis viib sind Stripe'i turvalisse portaali. Kui tühistad, säilib sul Premium-juurdepääs kuni juba makstud perioodi lõpuni. Kui makse ebaõnnestub, proovib Stripe mõne päeva jooksul tasu uuesti võtta; kui seda endiselt ei õnnestu võtta, läheb sinu konto paketile Tasuta, kuni uuendad oma makseviisi.\u003c/p>\n  \u003cp>\u003cstrong>Taganemisõigus.\u003c/strong> Kui oled tarbija, on sul õigus lepingust taganeda 14 kalendripäeva jooksul selle sõlmimisest (prooviaja alustamisest või maksmisest), põhjust esitamata, kirjutades aadressile cestafitness@gmail.com. Kuna digiteenus algab sinu taotlusel kohe, pead taganemise korral tasuma osutatud teenuse proportsionaalse osa, mille oled seni saanud. Peale selle seadusliku õiguse ei tagastata juba möödunud aja eest, kui kohaldatav õigus seda ei nõua.\u003c/p>\n\n  \u003ch2>9. Kutsete ja allahindluste programm\u003c/h2>\n  \u003cp>\u003cstrong>Sõprade kutsumine.\u003c/strong> Kui sinu koodiga registreeruvad isikud sõlmivad tasulise paketi, saab sinu tasuline tellimus allahindlust vastavalt sellele, kui palju neist isikutest sel hetkel maksab: 5 isikut, 10%; 10 isikut, 20%; 15 isikut, 30%; 20 isikut, 40%; 30 isikut, 50%. Selle saamiseks peab sul olema oma aktiivne tasuline tellimus. Allahindlus arvutatakse ümber, kui muutub veel maksvate kutsutud isikute arv, see kehtib ainult sinu enda tellimusele ja seda ei vahetata kunagi rahaks.\u003c/p>\n  \u003cp>\u003cstrong>Toitude panustamine.\u003c/strong> Kui saadad ühe kuu jooksul 10 toitu ja kõik 10 kinnitatakse, saad oma järgmiselt kuumaksult 5% allahindlust.\u003c/p>\n  \u003cp>Keelatud on registreerida võltskontosid või kasutada oma koodi allahindluste saamiseks; võime need tühistada ja asjaosalised kontod peatada. Programmi võime muuta või lõpetada ette teatades.\u003c/p>\n\n  \u003ch2>10. Intellektuaalomand ja litsentsid\u003c/h2>\n  \u003cp>cesta. ja selle logo, kujundus, tarkvara, tekstid ja tõlked kuuluvad selle omanikule ja on seadusega kaitstud. Sa ei tohi ilma kirjaliku loata rakendust kopeerida, muuta, levitada ega pöördprojekteerida.\u003c/p>\n  \u003cp>\u003cstrong>Kolmandate isikute viited.\u003c/strong> Osa toitude ja toodete andmetest pärineb Open Food Factsist (openfoodfacts.org), mis on kättesaadav Open Database License (ODbL) litsentsi alusel. Kasutatakse avatud lähtekoodiga teeke (Supabase JS, jsPDF, Sentry, Capacitor, MIT litsentsiga) ning fonte Space Grotesk ja Inter (litsents SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Kättesaadavus ja vastutuse piirang\u003c/h2>\n  \u003cp>Teeme kõik, et rakendus alati töötaks, kuid hoolduse või meist mittesõltuvate põhjuste tõttu võib esineda katkestusi. cesta. ei vastuta terviseotsuste eest, mis on tehtud ainult rakenduse teabe põhjal; konsulteeri alati spetsialistiga. Miski eelnevast ei piira õigusi, mida seadus tarbijatele tunnustab.\u003c/p>\n\n  \u003ch2>12. Suhte lõpetamine\u003c/h2>\n  \u003cp>Saad oma profiilis igal ajal kustutada oma konto ja kõik oma andmed. Võime peatada või sulgeda konto, mis neid tingimusi rikub.\u003c/p>\n\n  \u003ch2>13. Nende tingimuste muudatused\u003c/h2>\n  \u003cp>Teavitame igast olulisest muudatusest vähemalt 30 päeva ette.\u003c/p>\n\n  \u003ch2>14. Kohaldatav õigus\u003c/h2>\n  \u003cp>Neile tingimustele kohaldatakse Hispaania õigust. Kui oled tarbija, võid pöörduda oma elukoha kohtusse ja säilitad õigused, mida sulle tunnustavad sinu elukohariigi tarbijakaitse õigusaktid.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","lv":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Pēdējo reizi atjaunināts: 24.09.2026.\u003c/p>\n\n  \u003ch2>1. Kas mēs esam un ko piedāvājam\u003c/h2>\n  \u003cp>cesta. īpašnieks ir \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Ar jebkuriem jautājumiem raksti uz cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. ir ēdienreižu plānošanas, makroelementu aprēķina, svara un izmēru uzskaites, kā arī treniņu plānošanas un reģistrēšanas rīks. Tas ietver pārtikas atpazīšanu pēc fotoattēla un svītrkoda, tērzēšanu ar mākslīgo intelektu, receptes, vingrinājumus ar animētām demonstrācijām, sadaļas Grūtniecība un Mazulis, periodisko badošanos, savienojumu ar veselības lietotnēm, kā arī izvēles kopienu un treneru meklētāju. Tā nav medicīnas ierīce un nav profesionāls uztura konsultāciju pakalpojums.\u003c/p>\n\n  \u003ch2>2. Tavs konts\u003c/h2>\n  \u003cp>Tu esi atbildīgs par savas paroles drošu glabāšanu. Lai izveidotu kontu, tev jābūt vismaz 18 gadu vecam. Tava profila informācijai jābūt patiesai.\u003c/p>\n\n  \u003ch2>3. Kopiena un kopīgotais saturs\u003c/h2>\n  \u003cp>Tavs profils pēc noklusējuma ir privāts. Ja to padari publisku vai pieņem draudzību, šī persona redzēs tavas ēdienkartes un fotoattēlus. Neaugšupielādē saturu, kas pārkāpj trešo personu tiesības vai kas identificē citas personas bez viņu piekrišanas.\u003c/p>\n  \u003cp>\u003cstrong>Aizliegts saturs.\u003c/strong> Nav atļauts augšupielādēt, nosūtīt tērzēšanā vai mēģināt izdot par vingrinājuma tehnikas meklējumu jebkādu saturu, kas ir seksuāls, attēlo kailumu vai ir mājienveida; vardarbīgu, grafisku vai satraucošu; rasistisku, homofobisku, naida vai diskriminējošu jebkāda iemesla dēļ (izcelsme, reliģija, seksuālā orientācija, dzimtes identitāte, invaliditāte vai cits); vai nelikumīgu saskaņā ar jebkuru piemērojamo tiesību aktu, tostarp jebkuru saturu, kas attiecas uz nepilngadīgajiem vai tos seksualizē. Tas attiecas uz profila, progresa, ēdienu un pievienoto produktu fotoattēliem, uz tērzēšanas ziņojumiem starp treneri un sportistu vai starp lietotājiem, kā arī uz jebkuru tekstu, ko izmanto tehnikas video meklēšanai.\u003c/p>\n  \u003cp>Visi fotoattēli, ko augšupielādē, pirms pieņemšanas tiek apstrādāti ar automātisku moderēšanas filtru, kas izmanto mākslīgo intelektu (sīkāk privātuma politikā). Mēģinājums apiet filtru vai atkārtota aizliegta satura augšupielāde ir pamats tūlītējai tava konta apturēšanai vai slēgšanai, bez tiesībām uz aktīvā maksas plāna atmaksu un neskarot mūsu pienākumu informēt kompetentās iestādes, ja likums to prasa.\u003c/p>\n  \u003cp>Tev saglabājas visas tiesības uz saturu, ko augšupielādē. Tu dod mums atļauju, tikai pakalpojuma sniegšanai, to glabāt, rādīt personām, ar kurām izlemj to kopīgot, un apstrādāt, kā paskaidrots privātuma politikā.\u003c/p>\n\n  \u003ch2>4. Mākslīgā intelekta radīts saturs\u003c/h2>\n  \u003cp>Aplēses, kas iegūtas ar fotoattēla analīzi, tērzēšanu ar mākslīgo intelektu vai automātiskiem kopsavilkumiem, ir aptuvenas un var saturēt kļūdas. Vienmēr tās pārbaudi un neuzskati tās par medicīnisku padomu.\u003c/p>\n\n  \u003ch2>5. Veselība, grūtniecība, mazulis un treniņš\u003c/h2>\n  \u003cp>Informācija lietotnē paredzēta personiskai organizēšanai un vispārējai informēšanai. Tā neaizstāj ārsta, dietologa-uztura speciālista, vecmātes, pediatra vai trenera padomu. Pirms vingrošanas programmas sākšanas vai uztura maiņas konsultējies ar speciālistu, it īpaši, ja esi stāvoklī vai baro ar krūti, tev ir slimība, ārstējies vai informācija attiecas uz mazuli.\u003c/p>\n\n  \u003ch2>6. Treneri un sportisti\u003c/h2>\n  \u003cp>Treneri, kas izmanto cesta., ir neatkarīgi speciālisti. cesta. nodrošina kontaktu un rīkus, bet neuzrauga un negarantē viņu pakalpojumus, un attiecības starp treneri un sportistu ir tikai viņu savstarpējās attiecības. Maksājumus starp treneri un sportistu kārto tieši viņi paši, ārpus lietotnes; cesta. neiekasē komisijas maksu un nepiedalās šajos darījumos. Abi apņemas cieņpilni un konfidenciāli izturēties pret otra informāciju.\u003c/p>\n\n  \u003ch2>7. Plāni un cenas\u003c/h2>\n  \u003cp>\u003cstrong>Bezmaksas\u003c/strong> — bez maksas, ar plānošanas pamatfunkcijām, makro kalkulatoru, pārtikas un recepšu datubāzi, iepirkumu sarakstu, treniņu reģistrēšanu, meklēšanu pēc svītrkoda, importu no veselības lietotnēm, tērzēšanu ar mākslīgo intelektu un piekļuvi kopienai. Fotoattēlu analīze ar mākslīgo intelektu ir ierobežota līdz 5 mēnesī, un datu eksports — līdz 3 reizēm mēnesī.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mēnesī vai 49,99 €/gadā, ar 7 dienu bezmaksas izmēģinājumu pirmajā reizē. Ietver visu no plāna Bezmaksas un, cita starpā, neierobežotu fotoattēlu analīzi ar māks
