ς, να τροποποιήσεις, να διανείμεις ή να αποσυναρμολογήσεις την εφαρμογή (αντίστροφη μηχανική) χωρίς έγγραφη άδεια.\u003c/p>\n  \u003cp>\u003cstrong>Πιστώσεις τρίτων.\u003c/strong> Μέρος των δεδομένων τροφίμων και προϊόντων προέρχεται από το Open Food Facts (openfoodfacts.org), διαθέσιμο υπό την άδεια Open Database License (ODbL). Χρησιμοποιούνται βιβλιοθήκες ανοικτού κώδικα (Supabase JS, jsPDF, Sentry, Capacitor, με άδεια MIT) και οι γραμματοσειρές Space Grotesk και Inter (άδεια SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Διαθεσιμότητα και περιορισμός ευθύνης\u003c/h2>\n  \u003cp>Καταβάλλουμε κάθε προσπάθεια ώστε η εφαρμογή να λειτουργεί πάντα, αλλά ενδέχεται να υπάρξουν διακοπές λόγω συντήρησης ή αιτιών ανεξάρτητων από εμάς. Η cesta. δεν φέρει ευθύνη για αποφάσεις υγείας που λαμβάνονται αποκλειστικά με βάση τις πληροφορίες της εφαρμογής· συμβουλεύσου πάντα έναν επαγγελματία. Τίποτα από τα ανωτέρω δεν περιορίζει τα δικαιώματα που αναγνωρίζει ο νόμος στους καταναλωτές.\u003c/p>\n\n  \u003ch2>12. Λήξη της σχέσης\u003c/h2>\n  \u003cp>Μπορείς να διαγράψεις τον λογαριασμό σου και όλα τα δεδομένα σου ανά πάσα στιγμή από το προφίλ σου. Μπορούμε να αναστείλουμε ή να κλείσουμε έναν λογαριασμό που παραβιάζει τους παρόντες όρους.\u003c/p>\n\n  \u003ch2>13. Αλλαγές στους παρόντες όρους\u003c/h2>\n  \u003cp>Θα γνωστοποιούμε κάθε σημαντική αλλαγή τουλάχιστον 30 ημέρες νωρίτερα.\u003c/p>\n\n  \u003ch2>14. Εφαρμοστέο δίκαιο\u003c/h2>\n  \u003cp>Οι παρόντες όροι διέπονται από το ισπανικό δίκαιο. Εάν είσαι καταναλωτής, μπορείς να προσφύγεις στα δικαστήρια του τόπου κατοικίας σου και διατηρείς τα δικαιώματα που σου αναγνωρίζει η νομοθεσία περί προστασίας των καταναλωτών της χώρας διαμονής σου.\u003c/p>\n\n  \u003ch2>15. Επικοινωνία\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","sv":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Senast uppdaterad: 2026-09-24\u003c/p>\n\n  \u003ch2>1. Vilka vi är och vad vi erbjuder\u003c/h2>\n  \u003cp>Innehavare av cesta. är \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). För alla frågor, skriv till cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. är ett verktyg för måltidsplanering, beräkning av makronutrienter, uppföljning av vikt och kroppsmått samt planering och registrering av träning. Det omfattar identifiering av livsmedel via foto och streckkod, en chatt med artificiell intelligens, recept, övningar med animerade demonstrationer, avsnitten Graviditet och Bebis, intermittent fasta, koppling till hälsoappar samt en valfri community och en sökfunktion för tränare. Det är inte en medicinteknisk produkt och inte en professionell kostrådgivningstjänst.\u003c/p>\n\n  \u003ch2>2. Ditt konto\u003c/h2>\n  \u003cp>Du ansvarar för att hålla ditt lösenord säkert. Du måste vara minst 18 år för att skapa ett konto. Uppgifterna i din profil ska vara sanningsenliga.\u003c/p>\n\n  \u003ch2>3. Community och delat innehåll\u003c/h2>\n  \u003cp>Din profil är privat som standard. Om du gör den offentlig eller accepterar en vänförfrågan ser den personen dina menyer och foton. Ladda inte upp innehåll som gör intrång i tredje parts rättigheter eller som identifierar andra personer utan deras samtycke.\u003c/p>\n  \u003cp>\u003cstrong>Förbjudet innehåll.\u003c/strong> Det är inte tillåtet att ladda upp, skicka via chatt eller försöka utge som en sökning efter övningsteknik något innehåll som är sexuellt, nakenhet eller antydande; våldsamt, grafiskt eller störande; rasistiskt, homofobiskt, hatiskt eller diskriminerande på någon grund (ursprung, religion, sexuell läggning, könsidentitet, funktionsnedsättning eller annat); eller olagligt enligt tillämplig lag, inklusive allt innehåll som involverar eller sexualiserar minderåriga. Detta gäller profilfoton, framstegsfoton, matfoton och foton av bidragna produkter, chattmeddelanden mellan tränare och atlet eller mellan användare samt all text som används för att söka efter tekniska videor.\u003c/p>\n  \u003cp>Alla foton du laddar upp passerar ett automatiskt modereringsfilter med artificiell intelligens innan de godtas (mer information finns i Integritetspolicyn). Att försöka kringgå filtret eller upprepade gånger ladda upp förbjudet innehåll är skäl för omedelbar avstängning eller nedläggning av ditt konto, utan rätt till återbetalning av den aktiva betalda planen, och utan att det påverkar vår möjlighet att underrätta behöriga myndigheter när lagen kräver det.\u003c/p>\n  \u003cp>Du behåller alla rättigheter till det innehåll du laddar upp. Du ger oss tillstånd, enbart för att tillhandahålla tjänsten, att lagra det, visa det för de personer du väljer att dela det med och behandla det så som förklaras i Integritetspolicyn.\u003c/p>\n\n  \u003ch2>4. AI-genererat innehåll\u003c/h2>\n  \u003cp>Uppskattningar som tas fram genom fotoanalys, chatten med AI eller de automatiska sammanfattningarna är ungefärliga och kan innehålla fel. Kontrollera dem alltid och uppfatta dem inte som medicinska råd.\u003c/p>\n\n  \u003ch2>5. Hälsa, graviditet, bebis och träning\u003c/h2>\n  \u003cp>Informationen i appen är avsedd för personlig organisering och allmän information. Den ersätter inte råd från läkare, dietist, barnmorska, barnläkare eller tränare. Rådfråga en yrkesperson innan du påbörjar ett träningsprogram eller ändrar din kost, och särskilt om du är gravid eller ammar, har en sjukdom, genomgår en behandling eller om informationen rör en bebis.\u003c/p>\n\n  \u003ch2>6. Tränare och atleter\u003c/h2>\n  \u003cp>De tränare som använder cesta. är oberoende yrkesutövare. cesta. underlättar kontakten och tillhandahåller verktygen men övervakar eller garanterar inte deras tjänster, och relationen mellan tränare och atlet är uteslutande deras egen. Betalningar mellan tränare och atlet hanteras direkt dem emellan, utanför appen; cesta. tar ingen provision och är inte part i dessa transaktioner. Båda förbinder sig att behandla den andres information med respekt och konfidentialitet.\u003c/p>\n\n  \u003ch2>7. Planer och priser\u003c/h2>\n  \u003cp>\u003cstrong>Gratis\u003c/strong> — kostnadsfritt, med de grundläggande funktionerna för planering, makrokalkylator, livsmedels- och receptdatabas, inköpslista, träningsregistrering, sökning via streckkod, import från hälsoappar, chatt med AI och tillgång till community. AI-fotoanalysen är begränsad till 5 per månad och dataexporten till 3 gånger per månad.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/månad eller 49,99 €/år, med 7 dagars kostnadsfri provperiod första gången. Innehåller allt i planen Gratis och, bland andra funktioner, obegränsad AI-fotoanalys, obegränsad dataexport, Cheat meals, Graviditet, Bebis, rekommenderad träning, uppföljning av kroppsmått och prioriterad support.\u003c/p>\n  \u003cp>\u003cstrong>Familj bas\u003c/strong> — 4,99 €/månad. Upp till 4 profiler under samma e-postadress och lösenord, var och en med egen vikt, egna måltider och träningspass, med nivån Gratis. \u003cstrong>Familj premium\u003c/strong> — 12,99 €/månad: samma sak, men alla 4 profiler har fullständig Premium.\u003c/p>\n  \u003cp>\u003cstrong>Tränare\u003c/strong> — 9,99 €/månad eller 59,99 €/år, med 7 dagars kostnadsfri provperiod. Det är en separat plan som innehåller allt i Premium samt området ”Mina atleter” för att coacha atleter: föreslå menyer och träningspass, följa deras framsteg och chatta med dem.\u003c/p>\n  \u003cp>Vad varje plan innehåller visas alltid i appen (skärmen ”Uppgradera din plan”) och kan utvecklas över tid. Tillämpliga skatter visas före betalning. ”Prioriterad support” innebär att ditt meddelande hanteras före meddelanden från gratiskonton, utan garanterad svarstid.\u003c/p>\n\n  \u003ch2>7 bis. Modulen Bodybuilding (separat prenumeration)\u003c/h2>\n  \u003cp>\u003cstrong>Vad det är.\u003c/strong> Modulen Bodybuilding är ett verktyg för personlig loggning och uppföljning: du antecknar vad du redan har bestämt dig för att ta (tillsammans med din läkare eller på egen hand) och cesta. organiserar det i en kalender och ritar vägledande kurvor. Kurvorna är matematiska uppskattningar som använder den halveringstid du anger eller ett vägledande värde från offentliga källor; de mäter inte dina verkliga blodnivåer och kan vara felaktiga.\u003c/p>\n  \u003cp>\u003cstrong>Vad det inte är.\u003c/strong> cesta. ger inga medicinska råd, diagnoser eller behandlingar och rekommenderar, ordinerar, beräknar, justerar eller föreslår inte substanser, doser eller scheman. Vi säljer, tillhandahåller eller underlättar inte anskaffning av någon substans, uppmuntrar inte deras användning och ersätter inte sjukvårdspersonal. Många substanser är receptbelagda läkemedel vars anskaffning och användning utan medicinsk kontroll kan vara olagliga och farliga för din hälsa; du ensam ansvarar för att följa gällande lagstiftning och för dina beslut. Om du har varningssymtom, sök vård eller ring 112.\u003c/p>\n  \u003cp>\u003cstrong>Endast för personer över 18 år.\u003c/strong> Du måste vara 18 år eller äldre, vilket du bekräftar när du tecknar prenumerationen. Vi kan stänga av modulen om vi upptäcker att en minderårig använder den eller att den används i strid med dessa villkor.\u003c/p>\n  \u003cp>\u003cstrong>Pris och betalning.\u003c/strong> 10 €/månad (skatter inkluderade eller visade före betalning), en prenumeration oberoende av din plan (Gratis, Premium, Familj eller Tränare) och utan gratis provperiod. Den förnyas automatiskt varje månad tills du avslutar den. Betalningen hanteras av Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Ångerrätt och uppsägning.\u003c/strong> När du tecknar prenumerationen begär du att tjänsten påbörjas omedelbart. Som konsument har du 14 dagar på dig att frånträda avtalet; om du utövar rätten efter att ha använt modulen måste du betala den proportionella delen av den tjänst som redan har utnyttjats. Du kan när som helst avsluta prenumerationen i själva modulen (knappen ”Hantera eller avsluta prenumerationen”); uppsägningen träder i kraft vid slutet av den redan betalda perioden och förnyas inte igen. För att utöva ångerrätten använder du knappen ”Utöva min ångerrätt” i modulen eller skriver till oss på kontaktadressen.\u003c/p>\n  \u003cp>\u003cstrong>Dina uppgifter.\u003c/strong> De uppgifter du registrerar är dina: du kan radera alla när som helst med ”Radera alla mina Bodybuilding-uppgifter” och ladda ner dem med ”Ladda ner mina Bodybuilding-uppgifter”. När du avslutar prenumerationen sparas de tills du raderar dem, såvida inte kontot har varit inaktivt i 18 månader. Ingen annan (tränare, vänner, Communityn) ser dessa uppgifter. Mer information finns i Integritetspolicyn.\u003c/p>\n  \u003cp>\u003cstrong>AI-chatt.\u003c/strong> När modulen är aktiv kan chatten organisera det du berättar för den i en kalender, men den föreslår inte substanser, doser eller scheman på eget initiativ.\u003c/p>\n  \u003cp>\u003cstrong>Ingen läkare-patientrelation och läkarkontakt.\u003c/strong> Att använda modulen skapar ingen läkare-patientrelation. Innan du börjar, ändrar eller slutar med något läkemedel, tillskott eller schema ska du rådfråga kvalificerad sjukvårdspersonal. Du ansvarar för dina beslut och de risker de medför. cesta. ger inte sitt stöd till användning av någon substans utöver det som är tillåtet.\u003c/p>\n  \u003cp>\u003cstrong>Laglighet och tillgänglighet.\u003c/strong> Många av de substanser du kan registrera är inte godkända för användning på människor i alla länder, eller säljs lagligt endast på recept eller för forskning. Vi påstår inte att modulen, dess lista över substanser eller dess innehåll är lämpligt, lagligt eller tillgängligt i ditt land: du ansvarar för att följa lokal lagstiftning. Listan över substanser gör det endast möjligt att välja dem efter namn och innebär inte att cesta. godkänner eller rekommenderar dem.\u003c/p>\n  \u003cp>\u003cstrong>Noggrannhet, AI och nödlägen.\u003c/strong> Uppgifterna och kurvorna bygger på det du anger och på uppskattningar som vi inte verifierar, och kan vara felaktiga eller ofullständiga. AI-svar genereras automatiskt och kan innehålla fel. Vid ett medicinskt nödläge eller allvarliga symptom ska du inte förlita dig på appen: ring 112 (eller ditt lands larmnummer) eller sök läkare.\u003c/p>\n  \u003cp>\u003cstrong>Ansvar.\u003c/strong> I den utsträckning lagen tillåter ansvarar cesta. inte för skador som uppstår till följd av beslut du fattar om substanser eller behandlingar baserat på informationen i appen. Detta begränsar inte de rättigheter som lagen ger dig som konsument eller vårt ansvar för uppsåt, grov vårdslöshet, dödsfall eller personskador som orsakats av vår vållande.\u003c/p>\n  \u003cp>\u003cstrong>Avstängning.\u003c/strong> Vi kan stänga av eller avsluta modulen om vi upptäcker användning i strid med dessa villkor (till exempel användning av minderåriga, försäljning eller marknadsföring av substanser eller identitetsstöld), varvid vi återbetalar den proportionella delen av den redan betalda men inte utnyttjade perioden.\u003c/p>\n\n  \u003ch2>8. Betalningar, kostnadsfri provperiod, förnyelse och uppsägning\u003c/h2>\n  \u003cp>Betalningar behandlas säkert via Stripe; vi ser eller lagrar aldrig dina kortuppgifter. Prenumerationer förnyas automatiskt i slutet av varje period (månads- eller årsvis) om du inte säger upp dem i förväg. Om du säger upp under den kostnadsfria provperioden debiteras du ingenting.\u003c/p>\n  \u003cp>Du kan när som helst säga upp, byta plan eller uppdatera ditt betalningssätt via knappen ”Hantera” bredvid din plan, som tar dig till Stripes säkra portal. Om du säger upp behåller du Premium-åtkomsten till slutet av den redan betalda perioden. Om en betalning misslyckas gör Stripe nya försök att dra betalningen under några dagar; om den fortfarande inte kan dras övergår ditt konto till planen Gratis tills du uppdaterar ditt betalningssätt.\u003c/p>\n  \u003cp>\u003cstrong>Ångerrätt.\u003c/strong> Om du är konsument har du rätt att frånträda avtalet inom 14 kalenderdagar från det att du ingick det (från det att du påbörjar provperioden eller betalningen), utan att ange något skäl, genom att skriva till cestafitness@gmail.com. Eftersom den digitala tjänsten påbörjas omedelbart på din begäran måste du, om du frånträder avtalet, betala den proportionella delen av den tjänst du har fått fram till dess. Utöver denna lagstadgade rätt sker ingen återbetalning för redan förfluten tid, om inte tillämplig lag kräver det.\u003c/p>\n\n  \u003ch2>9. Inbjudningsprogram och rabatter\u003c/h2>\n  \u003cp>\u003cstrong>Bjud in vänner.\u003c/strong> När personer som registrerar sig med din kod tecknar en betald plan får din betalda prenumeration en rabatt beroende på hur många av dessa personer som betalar vid den tidpunkten: 5 personer, 10 %; 10 personer, 20 %; 15 personer, 30 %; 20 personer, 40 %; 30 personer, 50 %. För att få rabatten måste du ha en egen aktiv betald prenumeration. Rabatten räknas om om antalet inbjudna som fortsätter betala ändras, gäller endast din egen prenumeration och omvandlas aldrig till pengar.\u003c/p>\n  \u003cp>\u003cstrong>Bidra med livsmedel.\u003c/strong> Om du skickar in 10 livsmedel under en månad och alla 10 godkänns får du 5 % rabatt på din nästa avgift.\u003c/p>\n  \u003cp>Det är förbjudet att registrera falska konton eller använda din egen kod för att få rabatter; vi kan dra tillbaka dem och stänga av de inblandade kontona. Vi kan ändra eller avsluta programmet med förvarning.\u003c/p>\n\n  \u003ch2>10. Immateriella rättigheter och licenser\u003c/h2>\n  \u003cp>cesta. och dess logotyp, designen, programvaran, texterna och översättningarna tillhör innehavaren och skyddas av lag. Du får inte kopiera, ändra, distribuera eller dekompilera appen (reverse engineering) utan skriftligt tillstånd.\u003c/p>\n  \u003cp>\u003cstrong>Erkännanden till tredje part.\u003c/strong> En del av uppgifterna om livsmedel och produkter kommer från Open Food Facts (openfoodfacts.org), tillgängliga under licensen Open Database License (ODbL). Bibliotek med öppen källkod (Supabase JS, jsPDF, Sentry, Capacitor, med MIT-licens) och typsnitten Space Grotesk och Inter (licens SIL Open Font License) används.\u003c/p>\n\n  \u003ch2>11. Tillgänglighet och ansvarsbegränsning\u003c/h2>\n  \u003cp>Vi gör vårt bästa för att appen alltid ska fungera, men avbrott kan förekomma på grund av underhåll eller omständigheter utanför vår kontroll. cesta. ansvarar inte för hälsobeslut som fattas enbart utifrån informationen i appen; rådfråga alltid en yrkesperson. Inget av det ovanstående begränsar de rättigheter som lagen ger konsumenter.\u003c/p>\n\n  \u003ch2>12. Avslut av förhållandet\u003c/h2>\n  \u003cp>Du kan när som helst radera ditt konto och alla dina uppgifter via din profil. Vi kan stänga av eller avsluta ett konto som bryter mot dessa villkor.\u003c/p>\n\n  \u003ch2>13. Ändringar i dessa villkor\u003c/h2>\n  \u003cp>Vi meddelar alla väsentliga ändringar med minst 30 dagars varsel.\u003c/p>\n\n  \u003ch2>14. Tillämplig lag\u003c/h2>\n  \u003cp>Dessa villkor regleras av spansk lag. Om du är konsument kan du vända dig till domstolarna på din hemort och behåller de rättigheter som konsumentlagstiftningen i ditt bosättningsland ger dig.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","da":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Senest opdateret: 24.09.2026\u003c/p>\n\n  \u003ch2>1. Hvem vi er, og hvad vi tilbyder\u003c/h2>\n  \u003cp>Indehaveren af cesta. er \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Skriv til cestafitness@gmail.com, hvis du har spørgsmål.\u003c/p>\n  \u003cp>cesta. er et værktøj til måltidsplanlægning, beregning af makronæringsstoffer, opfølgning på vægt og kropsmål samt planlægning og registrering af træning. Det omfatter genkendelse af fødevarer via foto og stregkode, en chat med kunstig intelligens, opskrifter, øvelser med animerede demonstrationer, afsnittene Graviditet og Baby, intermitterende faste, forbindelse til sundhedsapps samt et valgfrit fællesskab og en søgefunktion til trænere. Det er ikke et medicinsk udstyr og ikke en professionel kostrådgivningstjeneste.\u003c/p>\n\n  \u003ch2>2. Din konto\u003c/h2>\n  \u003cp>Du er ansvarlig for at holde din adgangskode sikker. Du skal være mindst 18 år for at oprette en konto. Oplysningerne i din profil skal være sande.\u003c/p>\n\n  \u003ch2>3. Fællesskab og delt indhold\u003c/h2>\n  \u003cp>Din profil er privat som standard. Hvis du gør den offentlig eller accepterer et venskab, kan den pågældende se dine menuer og fotos. Upload ikke indhold, der krænker tredjeparts rettigheder, eller som identificerer andre personer uden deres samtykke.\u003c/p>\n  \u003cp>\u003cstrong>Forbudt indhold.\u003c/strong> Det er ikke tilladt at uploade, sende via chat eller forsøge at udgive som en søgning efter øvelsesteknik noget indhold, der er seksuelt, nøgent eller antydende; voldeligt, grafisk eller foruroligende; racistisk, homofobisk, hadefuldt eller diskriminerende uanset grund (oprindelse, religion, seksuel orientering, kønsidentitet, handicap eller andet); eller ulovligt efter enhver gældende lov, herunder alt indhold, der involverer eller seksualiserer mindreårige. Dette gælder profilfotos, fremskridtsfotos, madfotos og fotos af bidragede produkter, chatbeskeder mellem træner og atlet eller mellem brugere samt enhver tekst, der bruges til at søge efter tekniske videoer.\u003c/p>\n  \u003cp>Alle fotos, du uploader, gennemgår et automatisk modereringsfilter med kunstig intelligens, før de accepteres (flere oplysninger i Privatlivspolitikken). Forsøg på at omgå filteret eller gentagen upload af forbudt indhold er grund til øjeblikkelig suspendering eller lukning af din konto uden ret til refusion af det aktive betalte abonnement og uden at det berører vores adgang til at underrette de kompetente myndigheder, når loven forpligter os til det.\u003c/p>\n  \u003cp>Du bevarer alle rettigheder til det indhold, du uploader. Du giver os tilladelse, udelukkende til at levere tjenesten, til at gemme det, vise det til de personer, du vælger at dele det med, og behandle det som forklaret i Privatlivspolitikken.\u003c/p>\n\n  \u003ch2>4. AI-genereret indhold\u003c/h2>\n  \u003cp>Skøn, der fremkommer ved fotoanalyse, chatten med AI eller de automatiske opsummeringer, er omtrentlige og kan indeholde fejl. Kontrollér dem altid, og betragt dem ikke som lægelig rådgivning.\u003c/p>\n\n  \u003ch2>5. Helbred, graviditet, baby og træning\u003c/h2>\n  \u003cp>Oplysningerne i appen er beregnet til personlig organisering og generel information. De erstatter ikke rådgivning fra en læge, klinisk diætist, jordemoder, børnelæge eller træner. Rådfør dig med en fagperson, før du begynder på et træningsprogram eller ændrer din kost, og særligt hvis du er gravid eller ammer, har en sygdom, er i behandling, eller hvis oplysningerne vedrører en baby.\u003c/p>\n\n  \u003ch2>6. Trænere og atleter\u003c/h2>\n  \u003cp>De trænere, der bruger cesta., er uafhængige fagpersoner. cesta. formidler kontakten og stiller værktøjerne til rådighed, men fører ikke tilsyn med og garanterer ikke deres ydelser, og forholdet mellem træner og atlet er udelukkende deres eget. Betalinger mellem træner og atlet afvikles direkte mellem dem uden for appen; cesta. opkræver ingen provision og er ikke part i disse transaktioner. Begge forpligter sig til at behandle den andens oplysninger med respekt og fortrolighed.\u003c/p>\n\n  \u003ch2>7. Abonnementer og priser\u003c/h2>\n  \u003cp>\u003cstrong>Gratis\u003c/strong> — uden omkostninger, med de grundlæggende funktioner til planlægning, makroberegner, database med fødevarer og opskrifter, indkøbsliste, træningsregistrering, søgning via stregkode, import fra sundhedsapps, chat med AI og adgang til fællesskabet. AI-fotoanalysen er begrænset til 5 om måneden og dataeksporten til 3 gange om måneden.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/måned eller 49,99 €/år, med 7 dages gratis prøveperiode første gang. Omfatter alt i abonnementet Gratis og blandt andre funktioner ubegrænset AI-fotoanalyse, ubegrænset dataeksport, Cheat meals, Graviditet, Baby, anbefalet træning, opfølgning på kropsmål og prioriteret support.\u003c/p>\n  \u003cp>\u003cstrong>Familie basis\u003c/strong> — 4,99 €/måned. Op til 4 profiler under samme e-mail og adgangskode, hver med sin egen vægt, egne måltider og egen træning, med niveauet Gratis. \u003cstrong>Familie premium\u003c/strong> — 12,99 €/måned: det samme, men alle 4 profiler har fuld Premium.\u003c/p>\n  \u003cp>\u003cstrong>Træner\u003c/strong> — 9,99 €/måned eller 59,99 €/år, med 7 dages gratis prøveperiode. Det er et særskilt abonnement, som omfatter alt i Premium samt området »Mine atleter« til rådgivning af atleter: foreslå dem menuer og træning, se deres fremskridt og chatte med dem.\u003c/p>\n  \u003cp>Hvad hvert abonnement omfatter, vises altid i appen (skærmbilledet »Opgrader dit abonnement«) og kan udvikle sig. Gældende afgifter vises før betaling. »Prioriteret support« betyder, at din besked behandles før beskeder fra gratis konti, uden garanteret svartid.\u003c/p>\n\n  \u003ch2>7 bis. Modulet Bodybuilding (særskilt abonnement)\u003c/h2>\n  \u003cp>\u003cstrong>Hvad det er.\u003c/strong> Modulet Bodybuilding er et værktøj til personlig registrering og opfølgning: du noterer, hvad du allerede har besluttet at tage (sammen med din læge eller på egen hånd), og cesta. organiserer det i en kalender og tegner vejledende kurver. Kurverne er matematiske skøn, der bruger den halveringstid, du angiver, eller en vejledende værdi fra offentlige kilder; de måler ikke dine faktiske blodniveauer og kan være unøjagtige.\u003c/p>\n  \u003cp>\u003cstrong>Hvad det ikke er.\u003c/strong> cesta. giver ikke lægelig rådgivning, diagnose eller behandling og anbefaler, ordinerer, beregner, justerer eller foreslår ikke stoffer, doser eller kure. Vi sælger, leverer eller letter ikke anskaffelsen af noget stof, tilskynder ikke til brug af dem og erstatter ikke sundhedspersonale. Mange stoffer er receptpligtig medicin, hvis anskaffelse og brug uden lægeligt tilsyn kan være ulovlig og farlig for dit helbred; du er alene ansvarlig for at overholde gældende lovgivning og for dine beslutninger. Hvis du har alarmsymptomer, skal du søge læge eller ringe til 112.\u003c/p>\n  \u003cp>\u003cstrong>Kun for personer over 18 år.\u003c/strong> Du skal være 18 år eller ældre, hvilket du bekræfter ved tegning af abonnementet. Vi kan suspendere modulet, hvis vi opdager, at en mindreårig bruger det, eller at det bruges i strid med disse vilkår.\u003c/p>\n  \u003cp>\u003cstrong>Pris og betaling.\u003c/strong> 10 €/md. (skatter inkluderet eller vist før betaling), et abonnement uafhængigt af din plan (Gratis, Premium, Familie eller Træner) og uden gratis prøveperiode. Det fornyes automatisk hver måned, indtil du opsiger det. Betalingen behandles af Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Fortrydelse og opsigelse.\u003c/strong> Ved tegning af abonnementet anmoder du om, at tjenesten påbegyndes straks. Som forbruger har du 14 dage til at fortryde aftalen; hvis du gør brug af retten, efter at du har brugt modulet, skal du betale den forholdsmæssige del af den tjeneste, der allerede er benyttet. Du kan når som helst opsige abonnementet i selve modulet (knappen »Administrer eller opsig abonnementet«); opsigelsen træder i kraft ved udgangen af den allerede betalte periode, og abonnementet fornyes ikke igen. For at gøre fortrydelsesretten gældende skal du bruge knappen »Udøv min fortrydelsesret« i modulet eller skrive til os på kontakt-e-mailen.\u003c/p>\n  \u003cp>\u003cstrong>Dine data.\u003c/strong> De data, du registrerer, er dine: du kan til enhver tid slette dem alle med »Slet alle mine Bodybuilding-data« og downloade dem med »Download mine Bodybuilding-data«. Når du opsiger abonnementet, opbevares de, indtil du sletter dem, medmindre kontoen har været inaktiv i 18 måneder. Ingen andre (trænere, venner, Fællesskabet) kan se disse data. Flere oplysninger i Privatlivspolitikken.\u003c/p>\n  \u003cp>\u003cstrong>AI-chat.\u003c/strong> Når modulet er aktivt, kan chatten organisere det, du fortæller den, i en kalender, men den foreslår ikke stoffer, doser eller kure på eget initiativ.\u003c/p>\n  \u003cp>\u003cstrong>Intet læge-patient-forhold og lægekonsultation.\u003c/strong> Brug af modulet skaber ikke et læge-patient-forhold. Før du begynder, ændrer eller stopper med medicin, kosttilskud eller kur, skal du konsultere kvalificeret sundhedspersonale. Du er ansvarlig for dine beslutninger og de risici, de indebærer. cesta. støtter ikke brugen af noget stof ud over det, der er tilladt.\u003c/p>\n  \u003cp>\u003cstrong>Lovlighed og tilgængelighed.\u003c/strong> Mange af de stoffer, du kan registrere, er ikke godkendt til brug på mennesker i alle lande eller sælges kun lovligt på recept eller til forskning. Vi påstår ikke, at modulet, dets liste over stoffer eller dets indhold er passende, lovligt eller tilgængeligt i dit land: du er ansvarlig for at overholde lokal lovgivning. Listen over stoffer gør det kun muligt at vælge dem ud fra navn og betyder ikke, at cesta. godkender eller anbefaler dem.\u003c/p>\n  \u003cp>\u003cstrong>Nøjagtighed, AI og nødsituationer.\u003c/strong> Data og kurver bygger på det, du indtaster, og på skøn, som vi ikke verificerer, og kan være unøjagtige eller ufuldstændige. AI-svar genereres automatisk og kan indeholde fejl. I en medicinsk nødsituation eller ved alvorlige symptomer skal du ikke stole på appen: ring 112 (eller dit lands alarmnummer) eller søg læge.\u003c/p>\n  \u003cp>\u003cstrong>Ansvar.\u003c/strong> I det omfang loven tillader det, er cesta. ikke ansvarlig for skader, der skyldes beslutninger, du træffer om stoffer eller behandlinger på grundlag af oplysningerne i appen. Dette begrænser ikke de rettigheder, som loven giver dig som forbruger, eller vores ansvar for forsæt, grov uagtsomhed, dødsfald eller personskade forårsaget ved vores skyld.\u003c/p>\n  \u003cp>\u003cstrong>Suspension.\u003c/strong> Vi kan suspendere eller opsige modulet, hvis vi opdager brug i strid med disse vilkår (for eksempel brug af mindreårige, salg eller markedsføring af stoffer eller identitetstyveri), hvorved vi refunderer den forholdsmæssige del af den allerede betalte og ikke benyttede periode.\u003c/p>\n\n  \u003ch2>8. Betalinger, gratis prøveperiode, fornyelse og opsigelse\u003c/h2>\n  \u003cp>Betalinger behandles sikkert via Stripe; vi ser eller gemmer aldrig dine kortoplysninger. Abonnementer fornyes automatisk ved udgangen af hver periode (månedlig eller årlig), medmindre du opsiger dem inden. Hvis du opsiger under den gratis prøveperiode, bliver du ikke opkrævet noget.\u003c/p>\n  \u003cp>Du kan til enhver tid opsige, skifte abonnement eller opdatere din betalingsmetode via knappen »Administrer« ved siden af dit abonnement, som fører dig til Stripes sikre portal. Hvis du opsiger, beholder du Premium-adgangen til udgangen af den allerede betalte periode. Hvis en betaling mislykkes, forsøger Stripe at trække beløbet igen i nogle dage; hvis det stadig ikke kan trækkes, overgår din konto til abonnementet Gratis, indtil du opdaterer din betalingsmetode.\u003c/p>\n  \u003cp>\u003cstrong>Fortrydelsesret.\u003c/strong> Hvis du er forbruger, har du ret til at fortryde aftalen inden for 14 kalenderdage fra indgåelsen (fra du påbegynder prøveperioden eller betalingen) uden at opgive nogen grund ved at skrive til cestafitness@gmail.com. Da den digitale tjeneste påbegyndes straks efter din anmodning, skal du, hvis du fortryder, betale for den forholdsmæssige del af den tjeneste, du har modtaget indtil da. Uden for denne lovbestemte ret sker der ingen refusion for den tid, der allerede er gået, medmindre gældende lov kræver det.\u003c/p>\n\n  \u003ch2>9. Invitationsprogram og rabatter\u003c/h2>\n  \u003cp>\u003cstrong>Inviter venner.\u003c/strong> Når personer, der tilmelder sig med din kode, tegner et betalt abonnement, får dit betalte abonnement en rabat afhængigt af, hvor mange af disse personer der betaler på det pågældende tidspunkt: 5 personer, 10 %; 10 personer, 20 %; 15 personer, 30 %; 20 personer, 40 %; 30 personer, 50 %. For at modtage den skal du have dit eget aktive betalte abonnement. Rabatten genberegnes, hvis antallet af inviterede, der fortsat betaler, ændres, gælder kun for dit eget abonnement og omdannes aldrig til penge.\u003c/p>\n  \u003cp>\u003cstrong>Bidrag med fødevarer.\u003c/strong> Hvis du indsender 10 fødevarer i løbet af en måned, og alle 10 godkendes, får du 5 % rabat på din næste betaling.\u003c/p>\n  \u003cp>Det er forbudt at registrere falske konti eller bruge din egen kode for at opnå rabatter; vi kan trække dem tilbage og suspendere de involverede konti. Vi kan ændre eller lukke programmet med forudgående varsel.\u003c/p>\n\n  \u003ch2>10. Immaterielle rettigheder og licenser\u003c/h2>\n  \u003cp>cesta. og dets logo, designet, softwaren, teksterne og oversættelserne tilhører indehaveren og er beskyttet af lov. Du må ikke kopiere, ændre, distribuere eller foretage reverse engineering af appen uden skriftlig tilladelse.\u003c/p>\n  \u003cp>\u003cstrong>Tredjepartskreditering.\u003c/strong> En del af data om fødevarer og produkter stammer fra Open Food Facts (openfoodfacts.org), tilgængelig under licensen Open Database License (ODbL). Der anvendes open source-biblioteker (Supabase JS, jsPDF, Sentry, Capacitor, med MIT-licens) og skrifttyperne Space Grotesk og Inter (licens SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Tilgængelighed og ansvarsbegrænsning\u003c/h2>\n  \u003cp>Vi gør vores bedste for, at appen altid fungerer, men der kan forekomme afbrydelser på grund af vedligeholdelse eller forhold uden for vores kontrol. cesta. er ikke ansvarlig for sundhedsmæssige beslutninger, der udelukkende træffes på grundlag af oplysningerne i appen; rådfør dig altid med en fagperson. Intet af ovenstående begrænser de rettigheder, som loven giver forbrugere.\u003c/p>\n\n  \u003ch2>12. Ophør af forholdet\u003c/h2>\n  \u003cp>Du kan til enhver tid slette din konto og alle dine oplysninger fra din profil. Vi kan suspendere eller lukke en konto, der overtræder disse vilkår.\u003c/p>\n\n  \u003ch2>13. Ændringer af disse vilkår\u003c/h2>\n  \u003cp>Vi giver besked om alle væsentlige ændringer med mindst 30 dages varsel.\u003c/p>\n\n  \u003ch2>14. Gældende ret\u003c/h2>\n  \u003cp>Disse vilkår er underlagt spansk ret. Hvis du er forbruger, kan du indbringe sager for domstolene på dit bopælssted og bevarer de rettigheder, som forbrugerlovgivningen i dit bopælsland giver dig.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","fi":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Päivitetty viimeksi: 24.9.2026\u003c/p>\n\n  \u003ch2>1. Keitä olemme ja mitä tarjoamme\u003c/h2>\n  \u003cp>cesta.:n haltija on \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Jos sinulla on kysyttävää, kirjoita osoitteeseen cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. on työkalu aterioiden suunnitteluun, makroravinteiden laskentaan, painon ja kehon mittojen seurantaan sekä harjoitusten suunnitteluun ja kirjaamiseen. Se sisältää elintarvikkeiden tunnistuksen valokuvan ja viivakoodin avulla, tekoälykeskustelun, reseptejä, liikkeitä animoituine esityksineen, Raskaus- ja Vauva-osiot, jaksottaisen paaston, yhteyden terveyssovelluksiin sekä valinnaisen yhteisön ja valmentajahaun. Se ei ole lääkinnällinen laite eikä ammattimainen ravitsemusneuvontapalvelu.\u003c/p>\n\n  \u003ch2>2. Tilisi\u003c/h2>\n  \u003cp>Olet vastuussa salasanasi turvallisesta säilyttämisestä. Tilin luomiseen vaaditaan vähintään 18 vuoden ikä. Profiilisi tietojen on oltava tosia.\u003c/p>\n\n  \u003ch2>3. Yhteisö ja jaettu sisältö\u003c/h2>\n  \u003cp>Profiilisi on oletuksena yksityinen. Jos teet siitä julkisen tai hyväksyt ystävyyden, kyseinen henkilö näkee ruokalistasi ja valokuvasi. Älä lataa sisältöä, joka loukkaa kolmansien oikeuksia tai joka tunnistaa muita henkilöitä heidän suostumuksettaan.\u003c/p>\n  \u003cp>\u003cstrong>Kielletty sisältö.\u003c/strong> Ei ole sallittua ladata, lähettää keskustelussa tai yrittää esittää liikkeen tekniikkahakuna mitään sisältöä, joka on seksuaalista, alastomuutta tai vihjailevaa; väkivaltaista, graafista tai häiritsevää; rasistista, homofobista, vihamielistä tai syrjivää minkä tahansa perusteen vuoksi (alkuperä, uskonto, seksuaalinen suuntautuminen, sukupuoli-identiteetti, vamma tai muu); tai laitonta sovellettavan lain mukaan, mukaan lukien kaikki sisältö, joka koskee alaikäisiä tai seksualisoi heitä. Tämä koskee profiili-, edistymis-, ruoka- ja lisättyjen tuotteiden valokuvia, valmentajan ja urheilijan välisiä tai käyttäjien välisiä keskusteluviestejä sekä kaikkea tekniikkavideoiden hakuun käytettyä tekstiä.\u003c/p>\n  \u003cp>Kaikki lataamasi valokuvat käyvät läpi tekoälyyn perustuvan automaattisen moderointisuodattimen ennen hyväksymistä (lisätietoja tietosuojakäytännössä). Suodattimen kiertäminen tai kielletyn sisällön toistuva lataaminen on peruste tilisi välittömälle jäädyttämiselle tai sulkemiselle ilman oikeutta voimassa olevan maksullisen tilauksen hyvitykseen ja rajoittamatta oikeuttamme ilmoittaa toimivaltaisille viranomaisille, kun laki meitä siihen velvoittaa.\u003c/p>\n  \u003cp>Säilytät kaikki oikeudet lataamaasi sisältöön. Annat meille luvan, yksinomaan palvelun tarjoamiseksi, tallentaa sen, näyttää sen niille henkilöille, joiden kanssa päätät sen jakaa, ja käsitellä sitä tietosuojakäytännössä kuvatulla tavalla.\u003c/p>\n\n  \u003ch2>4. Tekoälyn tuottama sisältö\u003c/h2>\n  \u003cp>Valokuva-analyysin, tekoälykeskustelun tai automaattisten yhteenvetojen tuottamat arviot ovat likimääräisiä ja voivat sisältää virheitä. Tarkista ne aina äläkä pidä niitä lääketieteellisenä neuvona.\u003c/p>\n\n  \u003ch2>5. Terveys, raskaus, vauva ja harjoittelu\u003c/h2>\n  \u003cp>Sovelluksen tiedot on tarkoitettu henkilökohtaiseen järjestäytymiseen ja yleiseksi tiedoksi. Ne eivät korvaa lääkärin, ravitsemusterapeutin, kätilön, lastenlääkärin tai valmentajan neuvoja. Käänny ammattilaisen puoleen ennen liikuntaohjelman aloittamista tai ruokavaliosi muuttamista, erityisesti jos olet raskaana tai imetät, sairastat jotakin, saat hoitoa tai jos tiedot koskevat vauvaa.\u003c/p>\n\n  \u003ch2>6. Valmentajat ja urheilijat\u003c/h2>\n  \u003cp>cesta.:a käyttävät valmentajat ovat itsenäisiä ammatinharjoittajia. cesta. helpottaa yhteydenpitoa ja tarjoaa työkalut, mutta ei valvo eikä takaa heidän palvelujaan, ja valmentajan ja urheilijan välinen suhde koskee yksinomaan heitä. Valmentajan ja urheilijan väliset maksut hoidetaan suoraan heidän kesken sovelluksen ulkopuolella; cesta. ei peri palkkiota eikä ole osapuolena näissä liiketoimissa. Molemmat sitoutuvat käsittelemään toisen tietoja kunnioittavasti ja luottamuksellisesti.\u003c/p>\n\n  \u003ch2>7. Tilaukset ja hinnat\u003c/h2>\n  \u003cp>\u003cstrong>Ilmainen\u003c/strong> — maksuton, sisältää suunnittelun perustoiminnot, makrolaskurin, elintarvike- ja reseptitietokannan, ostoslistan, harjoitusten kirjaamisen, haun viivakoodilla, tuonnin terveyssovelluksista, tekoälykeskustelun ja pääsyn yhteisöön. Tekoälyvalokuva-analyysi on rajattu 5 analyysiin kuukaudessa ja tietojen vienti 3 kertaan kuukaudessa.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/kk tai 49,99 €/vuosi, ensimmäisellä kerralla 7 päivän ilmainen kokeilu. Sisältää Ilmainen-tilauksen ominaisuudet ja muun muassa rajoittamattoman tekoälyvalokuva-analyysin, rajoittamattoman tietojen viennin, Cheat meals -toiminnon, Raskaus-, Vauva-osiot, suositellun harjoittelun, kehon mittojen seurannan ja ensisijaisen tuen.\u003c/p>\n  \u003cp>\u003cstrong>Perhe perus\u003c/strong> — 4,99 €/kk. Enintään 4 profiilia samalla sähköpostiosoitteella ja salasanalla, joilla kullakin on oma painonsa, ateriansa ja harjoituksensa, Ilmainen-tasolla. \u003cstrong>Perhe premium\u003c/strong> — 12,99 €/kk: sama, mutta kaikilla 4 profiililla on täysi Premium.\u003c/p>\n  \u003cp>\u003cstrong>Valmentaja\u003c/strong> — 9,99 €/kk tai 59,99 €/vuosi, 7 päivän ilmainen kokeilu. Se on erillinen tilaus, joka sisältää Premiumin ominaisuudet ja ”Urheilijani”-alueen urheilijoiden valmentamiseen: ruokalistojen ja harjoitusten ehdottaminen heille, heidän edistymisensä seuraaminen ja keskusteleminen heidän kanssaan.\u003c/p>\n  \u003cp>Se, mitä kukin tilaus sisältää, näytetään aina sovelluksessa (näkymä ”Päivitä tilauksesi”), ja se voi muuttua. Sovellettavat verot näytetään ennen maksua. ”Ensisijainen tuki” tarkoittaa, että viestisi käsitellään ennen ilmaisten tilien viestejä ilman taattua vastausaikaa.\u003c/p>\n\n  \u003ch2>7 bis. Kehonrakennus-moduuli (erillinen tilaus)\u003c/h2>\n  \u003cp>\u003cstrong>Mikä se on.\u003c/strong> Kehonrakennus-moduuli on henkilökohtainen kirjaamis- ja seurantatyökalu: merkitset ylös sen, minkä olet jo päättänyt ottaa (lääkärisi kanssa tai omin päin), ja cesta. järjestää sen kalenteriin ja piirtää suuntaa-antavia käyriä. Käyrät ovat matemaattisia arvioita, joissa käytetään ilmoittamaasi puoliintumisaikaa tai julkisista lähteistä saatua suuntaa-antavaa arvoa; ne eivät mittaa todellisia veriarvojasi ja voivat olla epätarkkoja.\u003c/p>\n  \u003cp>\u003cstrong>Mitä se ei ole.\u003c/strong> cesta. ei anna lääketieteellisiä neuvoja, diagnoosia tai hoitoa eikä suosittele, määrää, laske, säädä tai ehdota aineita, annoksia tai kuureja. Se ei myy, toimita eikä edistä minkään aineen hankkimista, ei kannusta niiden käyttöön eikä korvaa terveydenhuollon ammattilaista. Monet aineet ovat reseptilääkkeitä, joiden hankkiminen ja käyttö ilman lääketieteellistä valvontaa voi olla laitonta ja vaarallista terveydellesi; vastaat yksin sovellettavan lain noudattamisesta ja päätöksistäsi. Jos sinulla on hälyttäviä oireita, hakeudu lääkäriin tai soita numeroon 112.\u003c/p>\n  \u003cp>\u003cstrong>Vain 18 vuotta täyttäneille.\u003c/strong> Sinun on oltava 18-vuotias tai vanhempi, minkä vahvistat tilausta tehdessäsi. Voimme keskeyttää moduulin, jos havaitsemme, että sitä käyttää alaikäinen tai että sitä käytetään näiden ehtojen vastaisesti.\u003c/p>\n  \u003cp>\u003cstrong>Hinta ja maksu.\u003c/strong> 10 €/kk (verot sisältyvät hintaan tai ne näytetään ennen maksua), tilaus on riippumaton paketistasi (Ilmainen, Premium, Perhe tai Valmentaja) eikä siihen kuulu ilmaista kokeilujaksoa. Se uusiutuu automaattisesti joka kuukausi, kunnes peruutat sen. Maksun käsittelee Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Peruuttaminen ja irtisanominen.\u003c/strong> Tilauksen tehdessäsi pyydät, että palvelu alkaa välittömästi. Kuluttajana sinulla on 14 päivää aikaa peruuttaa sopimus; jos käytät oikeutta sen jälkeen, kun olet käyttänyt moduulia, sinun on maksettava jo hyödynnetyn palvelun suhteellinen osuus. Voit irtisanoa tilauksen milloin tahansa itse moduulissa (painike ”Hallitse tai peruuta tilaus”); irtisanominen tulee voimaan jo maksetun jakson päättyessä, eikä tilaus uusiudu enää. Peruuttaaksesi käytä moduulin painiketta ”Käytä peruuttamisoikeuttani” tai kirjoita meille yhteyssähköpostiosoitteeseen.\u003c/p>\n  \u003cp>\u003cstrong>Tietosi.\u003c/strong> Tallentamasi tiedot ovat sinun: voit poistaa ne kaikki milloin tahansa toiminnolla ”Poista kaikki Kehonrakennus-tietoni” ja ladata ne toiminnolla ”Lataa Kehonrakennus-tietoni”. Kun peruutat tilauksen, tiedot säilytetään, kunnes poistat ne, ellei tili ole ollut passiivinen 18 kuukautta. Kukaan muu (valmentajat, ystävät, Yhteisö) ei näe näitä tietoja. Lisätietoja Tietosuojaselosteessa.\u003c/p>\n  \u003cp>\u003cstrong>Tekoälychatti.\u003c/strong> Kun moduuli on aktiivinen, chatti voi järjestää kalenteriin sen, mitä sille kerrot, mutta se ei ehdota aineita, annoksia tai kuureja omasta aloitteestaan.\u003c/p>\n  \u003cp>\u003cstrong>Ei lääkäri-potilassuhdetta, ja lääkärin konsultointi.\u003c/strong> Moduulin käyttö ei luo lääkäri-potilassuhdetta. Ennen kuin aloitat, vaihdat tai lopetat minkä tahansa lääkkeen, ravintolisän tai kuurin, keskustele pätevän terveydenhuollon ammattilaisen kanssa. Vastaat itse päätöksistäsi ja niihin liittyvistä riskeistä. cesta. ei tue minkään aineen käyttöä sallitun ulkopuolella.\u003c/p>\n  \u003cp>\u003cstrong>Laillisuus ja saatavuus.\u003c/strong> Monet aineet, joita voit kirjata, eivät ole hyväksyttyjä ihmiskäyttöön kaikissa maissa, tai niitä myydään laillisesti vain reseptillä tai tutkimuskäyttöön. Emme väitä, että moduuli, sen ainelista tai sisältö olisi asianmukainen, laillinen tai saatavilla maassasi: vastaat itse paikallisen lainsäädännön noudattamisesta. Ainelistan avulla aineet voi vain valita nimen perusteella, eikä se tarkoita, että cesta. hyväksyisi tai suosittelisi niitä.\u003c/p>\n  \u003cp>\u003cstrong>Tarkkuus, tekoäly ja hätätilanteet.\u003c/strong> Tiedot ja käyrät perustuvat siihen, mitä syötät, ja arvioihin, joita emme tarkista, ja ne voivat olla epätarkkoja tai puutteellisia. Tekoälyn vastaukset luodaan automaattisesti, ja ne voivat sisältää virheitä. Lääketieteellisessä hätätilanteessa tai vakavien oireiden ilmetessä älä luota sovellukseen: soita numeroon 112 (tai maasi hätänumeroon) tai hakeudu lääkäriin.\u003c/p>\n  \u003cp>\u003cstrong>Vastuu.\u003c/strong> Lain sallimissa rajoissa cesta. ei vastaa vahingoista, jotka johtuvat päätöksistäsi aineista tai hoidoista sovelluksen tietojen perusteella. Tämä ei rajoita oikeuksia, jotka laki sinulle kuluttajana myöntää, eikä vastuutamme tahallisuudesta, törkeästä huolimattomuudesta, kuolemasta tai henkilövahingoista, jotka johtuvat meidän syystämme.\u003c/p>\n  \u003cp>\u003cstrong>Keskeyttäminen.\u003c/strong> Voimme keskeyttää tai peruuttaa moduulin, jos havaitsemme näiden ehtojen vastaista käyttöä (esimerkiksi alaikäisten käyttö, aineiden myynti tai markkinointi tai henkilöllisyyden esiintyminen väärin), jolloin palautamme jo maksetun, mutta käyttämättä jääneen jakson suhteellisen osuuden.\u003c/p>\n\n  \u003ch2>8. Maksut, ilmainen kokeilu, uusiutuminen ja peruutus\u003c/h2>\n  \u003cp>Maksut käsitellään turvallisesti Stripen kautta; emme koskaan näe emmekä tallenna korttitietojasi. Tilaukset uusiutuvat automaattisesti kunkin jakson (kuukausi tai vuosi) lopussa, ellet peruuta niitä etukäteen. Jos peruutat ilmaisen kokeilun aikana, sinulta ei veloiteta mitään.\u003c/p>\n  \u003cp>Voit milloin tahansa peruuttaa tilauksen, vaihtaa tilausta tai päivittää maksutapasi tilauksesi vieressä olevalla ”Hallitse”-painikkeella, joka vie sinut Stripen turvalliseen portaaliin. Jos peruutat, säilytät Premium-käyttöoikeuden jo maksetun jakson loppuun. Jos maksu epäonnistuu, Stripe yrittää veloitusta uudelleen muutaman päivän ajan; jos veloitus ei edelleenkään onnistu, tilisi siirtyy Ilmainen-tilaukseen, kunnes päivität maksutapasi.\u003c/p>\n  \u003cp>\u003cstrong>Peruuttamisoikeus.\u003c/strong> Jos olet kuluttaja, sinulla on oikeus peruuttaa sopimus 14 kalenteripäivän kuluessa sen tekemisestä (kokeilun tai maksun alkamisesta) ilman perustelua kirjoittamalla osoitteeseen cestafitness@gmail.com. Koska digitaalinen palvelu alkaa välittömästi pyynnöstäsi, sinun on peruuttaessasi maksettava siihen mennessä saamasi palvelun suhteellinen osuus. Tämän lakisääteisen oikeuden ulkopuolella jo kuluneesta ajasta ei makseta hyvitystä, ellei sovellettava laki toisin edellytä.\u003c/p>\n\n  \u003ch2>9. Kutsuohjelma ja alennukset\u003c/h2>\n  \u003cp>\u003cstrong>Kutsu ystäviä.\u003c/strong> Kun koodillasi rekisteröityvät henkilöt tilaavat maksullisen tilauksen, maksullinen tilauksesi saa alennuksen sen mukaan, kuinka moni heistä maksaa kyseisellä hetkellä: 5 henkilöä, 10 %; 10 henkilöä, 20 %; 15 henkilöä, 30 %; 20 henkilöä, 40 %; 30 henkilöä, 50 %. Alennuksen saamiseksi sinulla on oltava oma aktiivinen maksullinen tilaus. Alennus lasketaan uudelleen, jos edelleen maksavien kutsuttujen määrä muuttuu, se koskee vain omaa tilaustasi eikä sitä koskaan muuteta rahaksi.\u003c/p>\n  \u003cp>\u003cstrong>Elintarvikkeiden lisääminen.\u003c/strong> Jos lähetät 10 elintarviketta kuukauden aikana ja kaikki 10 hyväksytään, saat 5 %:n alennuksen seuraavasta maksuerästäsi.\u003c/p>\n  \u003cp>Väärien tilien rekisteröiminen tai oman koodisi käyttäminen alennusten saamiseksi on kielletty; voimme peruuttaa alennukset ja jäädyttää asianomaiset tilit. Voimme muuttaa tai lopettaa ohjelman ennakkoilmoituksella.\u003c/p>\n\n  \u003ch2>10. Immateriaalioikeudet ja lisenssit\u003c/h2>\n  \u003cp>cesta. ja sen logo, ulkoasu, ohjelmisto, tekstit ja käännökset kuuluvat haltijalleen ja ovat lain suojaamia. Et saa kopioida, muokata, levittää tai purkaa sovellusta (takaisinmallinnus) ilman kirjallista lupaa.\u003c/p>\n  \u003cp>\u003cstrong>Kolmansien osapuolten tunnustukset.\u003c/strong> Osa elintarvike- ja tuotetiedoista on peräisin Open Food Factsista (openfoodfacts.org), joka on saatavilla Open Database License (ODbL) -lisenssillä. Käytössä ovat avoimen lähdekoodin kirjastot (Supabase JS, jsPDF, Sentry, Capacitor, MIT-lisenssillä) sekä Space Grotesk- ja Inter-kirjasintyypit (SIL Open Font License -lisenssi).\u003c/p>\n\n  \u003ch2>11. Saatavuus ja vastuunrajoitus\u003c/h2>\n  \u003cp>Teemme parhaamme, jotta sovellus toimisi aina, mutta huollosta tai omasta vaikutuspiiristämme riippumattomista syistä voi aiheutua keskeytyksiä. cesta. ei vastaa terveyttä koskevista päätöksistä, jotka on tehty yksinomaan sovelluksen tietojen perusteella; käänny aina ammattilaisen puoleen. Mikään edellä mainitusta ei rajoita lain kuluttajille myöntämiä oikeuksia.\u003c/p>\n\n  \u003ch2>12. Suhteen päättäminen\u003c/h2>\n  \u003cp>Voit milloin tahansa poistaa tilisi ja kaikki tietosi profiilistasi. Voimme jäädyttää tai sulkea tilin, joka rikkoo näitä ehtoja.\u003c/p>\n\n  \u003ch2>13. Muutokset näihin ehtoihin\u003c/h2>\n  \u003cp>Ilmoitamme kaikista olennaisista muutoksista vähintään 30 päivää etukäteen.\u003c/p>\n\n  \u003ch2>14. Sovellettava laki\u003c/h2>\n  \u003cp>Näihin ehtoihin sovelletaan Espanjan lakia. Jos olet kuluttaja, voit viedä asian asuinpaikkasi tuomioistuimeen, ja säilytät ne oikeudet, jotka asuinmaasi kuluttajansuojalainsäädäntö sinulle takaa.\u003c/p>\n\n  \u003ch2>15. Yhteystiedot\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","cs":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Poslední aktualizace: 24. 9. 2026\u003c/p>\n\n  \u003ch2>1. Kdo jsme a co nabízíme\u003c/h2>\n  \u003cp>Provozovatelem cesta. je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). S jakýmkoli dotazem pište na cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. je nástroj pro plánování jídel, výpočet makroživin, sledování hmotnosti a tělesných měr a plánování a evidenci tréninků. Zahrnuje rozpoznávání potravin podle fotografie a čárového kódu, chat s umělou inteligencí, recepty, cviky s animovanými ukázkami, sekce Těhotenství a Miminko, intermitentní půst, propojení se zdravotními aplikacemi a volitelnou komunitu a vyhledávač trenérů. Není zdravotnickým prostředkem ani službou profesionálního výživového poradenství.\u003c/p>\n\n  \u003ch2>2. Váš účet\u003c/h2>\n  \u003cp>Odpovídáte za bezpečné uchování svého hesla. K vytvoření účtu musíte být starší 18 let. Údaje ve vašem profilu musí být pravdivé.\u003c/p>\n\n  \u003ch2>3. Komunita a sdílený obsah\u003c/h2>\n  \u003cp>Váš profil je ve výchozím nastavení soukromý. Pokud jej zveřejníte nebo přijmete přátelství, tato osoba uvidí vaše jídelníčky a fotografie. Nenahrávejte obsah, který porušuje práva třetích osob nebo který identifikuje jiné osoby bez jejich souhlasu.\u003c/p>\n  \u003cp>\u003cstrong>Zakázaný obsah.\u003c/strong> Je zakázáno nahrávat, odesílat v chatu nebo se pokoušet vydávat za vyhledávání techniky cviku jakýkoli obsah sexuální povahy, obsahující nahotu nebo sugestivní; násilný, grafický nebo znepokojivý; rasistický, homofobní, nenávistný nebo diskriminační z jakéhokoli důvodu (původ, náboženství, sexuální orientace, genderová identita, zdravotní postižení či jiný); nebo protiprávní podle jakéhokoli použitelného práva, včetně jakéhokoli obsahu, který zahrnuje nebo sexualizuje nezletilé osoby. Toto se vztahuje na profilové fotografie, fotografie pokroku, jídel a produktů, k nimž přispíváte, na zprávy v chatu mezi trenérem a svěřencem nebo mezi uživateli a na jakýkoli text použitý k vyhledávání videí s technikou.\u003c/p>\n  \u003cp>Všechny fotografie, které nahrajete, projdou před přijetím automatickým moderačním filtrem využívajícím umělou inteligenci (bližší informace v Zásadách ochrany osobních údajů). Pokus o obcházení filtru nebo opakované nahrávání zakázaného obsahu je důvodem k okamžitému pozastavení nebo zrušení vašeho účtu bez nároku na vrácení ceny aktivního placeného tarifu, a to bez újmy na našem právu informovat příslušné orgány, pokud nám to zákon ukládá.\u003c/p>\n  \u003cp>Zachováváte si veškerá práva k obsahu, který nahrajete. Udělujete nám oprávnění, a to výhradně za účelem poskytování služby, obsah ukládat, zobrazovat jej osobám, s nimiž se rozhodnete jej sdílet, a zpracovávat jej způsobem uvedeným v Zásadách ochrany osobních údajů.\u003c/p>\n\n  \u003ch2>4. Obsah vytvořený umělou inteligencí\u003c/h2>\n  \u003cp>Odhady získané analýzou fotografie, chatem s umělou inteligencí nebo automatickými shrnutími jsou přibližné a mohou obsahovat chyby. Vždy si je zkontrolujte a nepovažujte je za lékařskou radu.\u003c/p>\n\n  \u003ch2>5. Zdraví, těhotenství, miminko a trénink\u003c/h2>\n  \u003cp>Informace v aplikaci slouží k osobní organizaci a jako obecná informace. Nenahrazují radu lékaře, nutričního terapeuta, porodní asistentky, pediatra či trenéra. Před zahájením cvičebního programu nebo změnou stravy se poraďte s odborníkem, a to zejména pokud jste těhotná nebo kojíte, trpíte nemocí, podstupujete léčbu nebo se informace týkají miminka.\u003c/p>\n\n  \u003ch2>6. Trenéři a svěřenci\u003c/h2>\n  \u003cp>Trenéři, kteří používají cesta., jsou nezávislí odborníci. cesta. zprostředkovává kontakt a poskytuje nástroje, ale jejich služby nekontroluje ani neruční za jejich kvalitu a vztah mezi trenérem a svěřencem existuje výhradně mezi nimi. Platby mezi trenérem a svěřencem se vypořádávají přímo mezi nimi, mimo aplikaci; cesta. si neúčtuje žádnou provizi a do těchto transakcí nezasahuje. Oba se zavazují nakládat s informacemi druhé strany s respektem a důvěrně.\u003c/p>\n\n  \u003ch2>7. Tarify a ceny\u003c/h2>\n  \u003cp>\u003cstrong>Zdarma\u003c/strong> — bez poplatku, se základními funkcemi plánování, kalkulačkou maker, databází potravin a receptů, nákupním seznamem, evidencí tréninků, vyhledáváním podle čárového kódu, importem ze zdravotních aplikací, chatem s umělou inteligencí a přístupem do komunity. Analýza fotografií umělou inteligencí je omezena na 5 měsíčně a export údajů na 3krát měsíčně.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/měsíc nebo 49,99 €/rok, s 7 dny zdarma na vyzkoušení při prvním využití. Zahrnuje vše z tarifu Zdarma a mimo jiné neomezenou analýzu fotografií umělou inteligencí, neomezený export údajů, Cheat meals, Těhotenství, Miminko, doporučený trénink, sledování tělesných měr a prioritní podporu.\u003c/p>\n  \u003cp>\u003cstrong>Rodina základní\u003c/strong> — 4,99 €/měsíc. Až 4 profily pod jedním e-mailem a heslem, každý s vlastní nezávislou hmotností, jídly a tréninky, s úrovní Zdarma. \u003cstrong>Rodina premium\u003c/strong> — 12,99 €/měsíc: totéž, ale všechny 4 profily mají plné Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trenér\u003c/strong> — 9,99 €/měsíc nebo 59,99 €/rok, se 7 dny zdarma na vyzkoušení. Je to samostatný tarif, který zahrnuje vše z Premium a oblast „Moji svěřenci“ pro poradenství svěřencům: navrhování jídelníčků a tréninků, sledování jejich pokroku a chatování s nimi.\u003c/p>\n  \u003cp>Obsah jednotlivých tarifů je vždy zobrazen v aplikaci (obrazovka „Vylepšit tarif“) a může se vyvíjet. Příslušné daně se zobrazí před platbou. „Prioritní podpora“ znamená, že vaše zpráva je vyřizována přednostně před zprávami bezplatných účtů, aniž by byla zaručena doba odpovědi.\u003c/p>\n\n  \u003ch2>7 bis. Modul Kulturistika (samostatné předplatné)\u003c/h2>\n  \u003cp>\u003cstrong>Co to je.\u003c/strong> Modul Kulturistika je nástroj pro osobní evidenci a sledování: vy zaznamenáváte, co jste se již rozhodli užívat (s lékařem nebo na vlastní pěst), a cesta. to uspořádá do kalendáře a vykreslí orientační křivky. Křivky jsou matematické odhady, které využívají vámi uvedený biologický poločas nebo orientační hodnotu z veřejných zdrojů; neměří vaše skutečné hladiny v krvi a mohou být nepřesné.\u003c/p>\n  \u003cp>\u003cstrong>Co to není.\u003c/strong> cesta. neposkytuje lékařské rady, diagnózu ani léčbu a nedoporučuje, nepředepisuje, nepočítá, neupravuje ani nenavrhuje látky, dávky či režimy. Neprodává, nedodává ani nezprostředkovává získání žádné látky, nepodporuje jejich užívání a nenahrazuje zdravotnického pracovníka. Mnoho látek jsou léky na předpis, jejichž získávání a užívání bez lékařského dohledu může být nezákonné a nebezpečné pro vaše zdraví; za dodržování platných právních předpisů a za svá rozhodnutí odpovídáte výhradně vy. Pokud máte varovné příznaky, vyhledejte lékařskou pomoc nebo volejte 112.\u003c/p>\n  \u003cp>\u003cstrong>Pouze od 18 let.\u003c/strong> Musíte mít alespoň 18 let a při uzavření předplatného to potvrzujete. Modul můžeme pozastavit, pokud zjistíme, že jej používá nezletilá osoba nebo že je používán v rozporu s těmito podmínkami.\u003c/p>\n  \u003cp>\u003cstrong>Cena a platba.\u003c/strong> 10 €/měsíc (včetně daní nebo s daněmi zobrazenými před platbou), předplatné nezávislé na vašem tarifu (Zdarma, Premium, Rodinný nebo Trenér) a bez bezplatné zkušební doby. Automaticky se obnovuje každý měsíc, dokud jej nezrušíte. Platbu zpracovává Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Odstoupení od smlouvy a zrušení.\u003c/strong> Uzavřením předplatného žádáte, aby služba začala okamžitě. Jako spotřebitel máte 14 dnů na odstoupení od smlouvy; pokud odstoupení uplatníte po využití modulu, budete muset uhradit poměrnou část již poskytnuté služby. Předplatné můžete kdykoli zrušit přímo v modulu (tlačítko «Spravovat nebo zrušit předplatné»); zrušení nabývá účinnosti na konci již zaplaceného období a předplatné se dále neobnovuje. K odstoupení od smlouvy použijte tlačítko «Uplatnit své právo na odstoupení od smlouvy» v modulu nebo nám napište na kontaktní e-mail.\u003c/p>\n  \u003cp>\u003cstrong>Tvoje data.\u003c/strong> Data, která zaznamenáváš, jsou tvoje: můžeš je kdykoli všechna smazat pomocí „Smazat všechna má data z Kulturistiky“ a stáhnout pomocí „Stáhnout má data z Kulturistiky“. Po zrušení předplatného se uchovávají, dokud je nesmažeš, pokud účet není neaktivní 18 měsíců. Žádná jiná osoba (trenéři, přátelé, Komunita) tato data nevidí. Více podrobností v Zásadách ochrany osobních údajů.\u003c/p>\n  \u003cp>\u003cstrong>Chat s AI.\u003c/strong> Při aktivním modulu může chat uspořádat do kalendáře to, co mu sdělíte, ale nenavrhuje látky, dávky ani režimy z vlastní iniciativy.\u003c/p>\n  \u003cp>\u003cstrong>Žádný vztah lékař–pacient a konzultace s lékařem.\u003c/strong> Používání modulu nevytváří vztah lékař–pacient. Před zahájením, změnou nebo ukončením jakéhokoli léku, doplňku či režimu se poraďte s kvalifikovaným zdravotnickým pracovníkem. Za svá rozhodnutí a rizika, která z nich plynou, odpovídáte vy. cesta. nepodporuje užívání žádné látky mimo rámec povoleného.\u003c/p>\n  \u003cp>\u003cstrong>Zákonnost a dostupnost.\u003c/strong> Mnohé z látek, které můžete zaznamenávat, nejsou ve všech zemích povoleny pro použití u lidí, nebo se legálně prodávají pouze na lékařský předpis či pro výzkum. Neprohlašujeme, že modul, jeho seznam látek ani jeho obsah jsou vhodné, zákonné nebo dostupné ve vaší zemi: za dodržování místních právních předpisů odpovídáte vy. Seznam látek slouží pouze k jejich výběru podle názvu a neznamená, že je cesta. schvaluje nebo doporučuje.\u003c/p>\n  \u003cp>\u003cstrong>Přesnost, AI a nouzové situace.\u003c/strong> Údaje a křivky vycházejí z toho, co zadáte, a z odhadů, které neověřujeme, a mohou být nepřesné nebo neúplné. Odpovědi AI jsou generovány automaticky a mohou obsahovat chyby. V případě lékařské nouze nebo závažných příznaků se na aplikaci nespoléhejte: volejte 112 (nebo tísňové číslo ve své zemi) nebo vyhledejte lékaře.\u003c/p>\n  \u003cp>\u003cstrong>Odpovědnost.\u003c/strong> V rozsahu povoleném zákonem cesta. neodpovídá za škody vzniklé v důsledku rozhodnutí o látkách nebo léčbě, která učiníte na základě informací v aplikaci. Tím nejsou dotčena práva, která vám zákon přiznává jako spotřebiteli, ani naše odpovědnost za úmysl, hrubou nedbalost, smrt nebo újmu na zdraví způsobenou naším zaviněním.\u003c/p>\n  \u003cp>\u003cstrong>Pozastavení.\u003c/strong> Modul můžeme pozastavit nebo zrušit, pokud zjistíme použití v rozporu s těmito podmínkami (například používání nezletilými, prodej nebo propagace látek či zosobňování jiné osoby), přičemž vrátíme poměrnou část již zaplaceného a nevyužitého období.\u003c/p>\n\n  \u003ch2>8. Platby, zkušební doba zdarma, obnovení a zrušení\u003c/h2>\n  \u003cp>Platby jsou bezpečně zpracovávány prostřednictvím Stripe; údaje o vaší platební kartě nikdy nevidíme ani neukládáme. Předplatné se na konci každého období (měsíčního či ročního) automaticky obnovuje, pokud jej dříve nezrušíte. Pokud zrušíte během zkušební doby zdarma, nebude vám nic účtováno.\u003c/p>\n  \u003cp>Můžete kdykoli zrušit předplatné, změnit tarif nebo aktualizovat způsob platby pomocí tlačítka „Spravovat“ vedle svého tarifu, které vás přesměruje do zabezpečeného portálu Stripe. Pokud zrušíte, zachováte si přístup k Premium do konce již zaplaceného období. Pokud platba selže, Stripe se ji pokusí několik dní znovu strhnout; pokud ji stále nelze strhnout, váš účet přejde na tarif Zdarma, dokud neaktualizujete způsob platby.\u003c/p>\n  \u003cp>\u003cstrong>Právo na odstoupení od smlouvy.\u003c/strong> Pokud jste spotřebitel, máte právo odstoupit od smlouvy do 14 kalendářních dnů ode dne jejího uzavření (od zahájení zkušební doby nebo platby), bez udání důvodu, a to napsáním na cestafitness@gmail.com. Jelikož digitální služba začíná na vaši žádost ihned, budete v případě odstoupení povinni zaplatit poměrnou část služby, kterou jste do té doby čerpali. Mimo toto zákonné právo se za již uplynulou dobu nevracejí žádné platby, pokud to nevyžaduje použitelné právo.\u003c/p>\n\n  \u003ch2>9. Program pozvánek a slev\u003c/h2>\n  \u003cp>\u003cstrong>Zvaní přátel.\u003c/strong> Když osoby, které se zaregistrují pomocí vašeho kódu, sjednají placený tarif, obdrží vaše placené předplatné slevu podle toho, kolik z těchto osob v dané chvíli platí: 5 osob, 10 %; 10 osob, 20 %; 15 osob, 30 %; 20 osob, 40 %; 30 osob, 50 %. Abyste ji obdrželi, musíte mít vlastní aktivní placené předplatné. Sleva se přepočítává, pokud se změní počet pozvaných, kteří stále platí, vztahuje se pouze na vaše vlastní předplatné a nikdy se nepřevádí na peníze.\u003c/p>\n  \u003cp>\u003cstrong>Přispívání potravin.\u003c/strong> Pokud během jednoho měsíce odešlete 10 potravin a všech 10 bude schváleno, získáte 5% slevu na svou příští platbu.\u003c/p>\n  \u003cp>Je zakázáno registrovat falešné účty nebo používat vlastní kód za účelem získání slev; můžeme je odebrat a pozastavit dotčené účty. Program můžeme upravit nebo ukončit s předchozím oznámením.\u003c/p>\n\n  \u003ch2>10. Duševní vlastnictví a licence\u003c/h2>\n  \u003cp>cesta. a její logo, design, software, texty a překlady náležejí jejímu provozovateli a jsou chráněny zákonem. Aplikaci nesmíte bez písemného souhlasu kopírovat, upravovat, šířit ani zpětně analyzovat.\u003c/p>\n  \u003cp>\u003cstrong>Zdroje třetích stran.\u003c/strong> Část údajů o potravinách a produktech pochází z Open Food Facts (openfoodfacts.org) a je dostupná pod licencí Open Database License (ODbL). Používají se open-source knihovny (Supabase JS, jsPDF, Sentry, Capacitor, s licencí MIT) a písma Space Grotesk a Inter (licence SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Dostupnost a omezení odpovědnosti\u003c/h2>\n  \u003cp>Děláme vše pro to, aby aplikace fungovala nepřetržitě, ale mohou nastat výpadky z důvodu údržby nebo z příčin mimo naši kontrolu. cesta. nenese odpovědnost za rozhodnutí týkající se zdraví učiněná výhradně na základě informací z aplikace; vždy se poraďte s odborníkem. Nic z výše uvedeného neomezuje práva, která zákon přiznává spotřebitelům.\u003c/p>\n\n  \u003ch2>12. Ukončení vztahu\u003c/h2>\n  \u003cp>Svůj účet a všechny své údaje můžete kdykoli smazat ve svém profilu. Účet, který poruší tyto podmínky, můžeme pozastavit nebo zrušit.\u003c/p>\n\n  \u003ch2>13. Změny těchto podmínek\u003c/h2>\n  \u003cp>O jakékoli významné změně vás budeme informovat nejméně 30 dní předem.\u003c/p>\n\n  \u003ch2>14. Rozhodné právo\u003c/h2>\n  \u003cp>Tyto podmínky se řídí španělským právem. Pokud jste spotřebitel, můžete se obrátit na soudy v místě svého bydliště a zůstávají vám zachována práva, která vám přiznávají předpisy o ochraně spotřebitele země vašeho pobytu.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","sk":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Posledná aktualizácia: 24. 9. 2026\u003c/p>\n\n  \u003ch2>1. Kto sme a čo ponúkame\u003c/h2>\n  \u003cp>Prevádzkovateľom cesta. je \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). S akoukoľvek otázkou píšte na cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. je nástroj na plánovanie jedál, výpočet makroživín, sledovanie hmotnosti a telesných mier a plánovanie a evidenciu tréningov. Zahŕňa rozpoznávanie potravín podľa fotografie a čiarového kódu, chat s umelou inteligenciou, recepty, cviky s animovanými ukážkami, sekcie Tehotenstvo a Bábätko, intermitentný pôst, prepojenie so zdravotnými aplikáciami a voliteľnú komunitu a vyhľadávač trénerov. Nie je zdravotníckou pomôckou ani službou profesionálneho výživového poradenstva.\u003c/p>\n\n  \u003ch2>2. Váš účet\u003c/h2>\n  \u003cp>Zodpovedáte za bezpečné uchovanie svojho hesla. Na vytvorenie účtu musíte mať aspoň 18 rokov. Údaje vo vašom profile musia byť pravdivé.\u003c/p>\n\n  \u003ch2>3. Komunita a zdieľaný obsah\u003c/h2>\n  \u003cp>Váš profil je predvolene súkromný. Ak ho zverejníte alebo prijmete priateľstvo, táto osoba uvidí vaše jedálničky a fotografie. Nenahrávajte obsah, ktorý porušuje práva tretích osôb alebo ktorý identifikuje iné osoby bez ich súhlasu.\u003c/p>\n  \u003cp>\u003cstrong>Zakázaný obsah.\u003c/strong> Je zakázané nahrávať, odosielať v chate alebo sa pokúšať vydávať za vyhľadávanie techniky cviku akýkoľvek obsah sexuálnej povahy, obsahujúci nahotu alebo sugestívny; násilný, grafický alebo znepokojujúci; rasistický, homofóbny, nenávistný alebo diskriminačný z akéhokoľvek dôvodu (pôvod, náboženstvo, sexuálna orientácia, rodová identita, zdravotné postihnutie alebo iný); alebo protiprávny podľa akéhokoľvek uplatniteľného práva, vrátane akéhokoľvek obsahu, ktorý zahŕňa alebo sexualizuje maloleté osoby. Toto sa vzťahuje na profilové fotografie, fotografie pokroku, jedál a produktov, ktoré prispievate, na správy v chate medzi trénerom a zverencom alebo medzi používateľmi a na akýkoľvek text použitý na vyhľadávanie videí s technikou.\u003c/p>\n  \u003cp>Všetky fotografie, ktoré nahráte, prejdú pred prijatím automatickým moderačným filtrom využívajúcim umelú inteligenciu (bližšie informácie v Zásadách ochrany osobných údajov). Pokus o obchádzanie filtra alebo opakované nahrávanie zakázaného obsahu je dôvodom na okamžité pozastavenie alebo zrušenie vášho účtu bez nároku na vrátenie ceny aktívneho plateného plánu, a to bez ujmy na našom práve informovať príslušné orgány, ak nám to zákon ukladá.\u003c/p>\n  \u003cp>Zachovávate si všetky práva k obsahu, ktorý nahráte. Udeľujete nám povolenie, a to výlučne na poskytovanie služby, obsah ukladať, zobrazovať ho osobám, s ktorými sa rozhodnete ho zdieľať, a spracúvať ho spôsobom uvedeným v Zásadách ochrany osobných údajov.\u003c/p>\n\n  \u003ch2>4. Obsah vytvorený umelou inteligenciou\u003c/h2>\n  \u003cp>Odhady získané analýzou fotografie, chatom s umelou inteligenciou alebo automatickými zhrnutiami sú približné a môžu obsahovať chyby. Vždy si ich skontrolujte a nepovažujte ich za lekársku radu.\u003c/p>\n\n  \u003ch2>5. Zdravie, tehotenstvo, bábätko a tréning\u003c/h2>\n  \u003cp>Informácie v aplikácii slúžia na osobnú organizáciu a ako všeobecná informácia. Nenahrádzajú radu lekára, nutričného terapeuta, pôrodnej asistentky, pediatra alebo trénera. Pred začatím cvičebného programu alebo zmenou stravy sa poraďte s odborníkom, a to najmä ak ste tehotná alebo dojčíte, trpíte chorobou, podstupujete liečbu alebo sa informácie týkajú bábätka.\u003c/p>\n\n  \u003ch2>6. Tréneri a zverenci\u003c/h2>\n  \u003cp>Tréneri, ktorí používajú cesta., sú nezávislí odborníci. cesta. sprostredkúva kontakt a poskytuje nástroje, ale ich služby nekontroluje ani neručí za ich kvalitu a vzťah medzi trénerom a zverencom existuje výlučne medzi nimi. Platby medzi trénerom a zverencom sa vysporiadavajú priamo medzi nimi, mimo aplikácie; cesta. si neúčtuje žiadnu províziu a do týchto transakcií nezasahuje. Obaja sa zaväzujú narábať s informáciami druhej strany s rešpektom a dôverne.\u003c/p>\n\n  \u003ch2>7. Plány a ceny\u003c/h2>\n  \u003cp>\u003cstrong>Zadarmo\u003c/strong> — bez poplatku, so základnými funkciami plánovania, kalkulačkou makier, databázou potravín a receptov, nákupným zoznamom, evidenciou tréningov, vyhľadávaním podľa čiarového kódu, importom zo zdravotných aplikácií, chatom s umelou inteligenciou a prístupom do komunity. Analýza fotografií umelou inteligenciou je obmedzená na 5 mesačne a export údajov na 3-krát mesačne.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mesiac alebo 49,99 €/rok, so 7 dňami zadarmo na vyskúšanie pri prvom využití. Zahŕňa všetko z plánu Zadarmo a okrem iného neobmedzenú analýzu fotografií umelou inteligenciou, neobmedzený export údajov, Cheat meals, Tehotenstvo, Bábätko, odporúčaný tréning, sledovanie telesných mier a prioritnú podporu.\u003c/p>\n  \u003cp>\u003cstrong>Rodina základná\u003c/strong> — 4,99 €/mesiac. Až 4 profily pod jedným e-mailom a heslom, každý s vlastnou nezávislou hmotnosťou, jedlami a tréningami, s úrovňou Zadarmo. \u003cstrong>Rodina premium\u003c/strong> — 12,99 €/mesiac: to isté, ale všetky 4 profily majú plné Premium.\u003c/p>\n  \u003cp>\u003cstrong>Tréner\u003c/strong> — 9,99 €/mesiac alebo 59,99 €/rok, so 7 dňami zadarmo na vyskúšanie. Je to samostatný plán, ktorý zahŕňa všetko z Premium a oblasť „Moji zverenci“ na poradenstvo zverencom: navrhovanie jedálničkov a tréningov, sledovanie ich pokroku a chatovanie s nimi.\u003c/p>\n  \u003cp>Obsah jednotlivých plánov je vždy zobrazený v aplikácii (obrazovka „Vylepšiť plán“) a môže sa vyvíjať. Príslušné dane sa zobrazia pred platbou. „Prioritná podpora“ znamená, že vaša správa je vybavovaná prednostne pred správami bezplatných účtov, bez zaručenej doby odpovede.\u003c/p>\n\n  \u003ch2>7 bis. Modul Kulturistika (samostatné predplatné)\u003c/h2>\n  \u003cp>\u003cstrong>Čo to je.\u003c/strong> Modul Kulturistika je nástroj na osobnú evidenciu a sledovanie: vy zaznamenávate, čo ste sa už rozhodli užívať (s lekárom alebo na vlastnú päsť), a cesta. to usporiada do kalendára a vykreslí orientačné krivky. Krivky sú matematické odhady, ktoré využívajú vami uvedený biologický polčas alebo orientačnú hodnotu z verejných zdrojov; nemerajú vaše skutočné hladiny v krvi a môžu byť nepresné.\u003c/p>\n  \u003cp>\u003cstrong>Čo to nie je.\u003c/strong> cesta. neposkytuje lekárske rady, diagnózu ani liečbu a neodporúča, nepredpisuje, nevypočítava, neupravuje ani nenavrhuje látky, dávky či režimy. Nepredáva, nedodáva ani nesprostredkúva získanie žiadnej látky, nepodporuje ich užívanie a nenahrádza zdravotníckeho pracovníka. Mnohé látky sú lieky na predpis, ktorých získavanie a užívanie bez lekárskeho dohľadu môže byť nezákonné a nebezpečné pre vaše zdravie; za dodržiavanie platných právnych predpisov a za svoje rozhodnutia zodpovedáte výlučne vy. Ak máte varovné príznaky, vyhľadajte lekársku pomoc alebo volajte 112.\u003c/p>\n  \u003cp>\u003cstrong>Iba od 18 rokov.\u003c/strong> Musíte mať aspoň 18 rokov a pri uzatvorení predplatného to potvrdzujete. Modul môžeme pozastaviť, ak zistíme, že ho používa maloletá osoba alebo že sa používa v rozpore s týmito podmienkami.\u003c/p>\n  \u003cp>\u003cstrong>Cena a platba.\u003c/strong> 10 €/mesiac (vrátane daní alebo s daňami zobrazenými pred platbou), predplatné nezávislé od vášho plánu (Zadarmo, Premium, Rodinný alebo Tréner) a bez bezplatnej skúšobnej doby. Automaticky sa obnovuje každý mesiac, kým ho nezrušíte. Platbu spracúva Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Odstúpenie od zmluvy a zrušenie.\u003c/strong> Uzatvorením predplatného žiadate, aby služba začala okamžite. Ako spotrebiteľ máte 14 dní na odstúpenie od zmluvy; ak odstúpenie uplatníte po využití modulu, budete musieť uhradiť pomernú časť už poskytnutej služby. Predplatné môžete kedykoľvek zrušiť priamo v module (tlačidlo «Spravovať alebo zrušiť predplatné»); zrušenie nadobúda účinnosť na konci už zaplateného obdobia a predplatné sa už neobnovuje. Na odstúpenie od zmluvy použite tlačidlo «Uplatniť svoje právo na odstúpenie od zmluvy» v module alebo nám napíšte na kontaktný e-mail.\u003c/p>\n  \u003cp>\u003cstrong>Tvoje údaje.\u003c/strong> Údaje, ktoré zaznamenávaš, sú tvoje: môžeš ich kedykoľvek všetky vymazať pomocou „Vymazať všetky moje údaje z Kulturistiky“ a stiahnuť pomocou „Stiahnuť moje údaje z Kulturistiky“. Po zrušení predplatného sa uchovávajú, kým ich nevymažeš, pokiaľ účet nie je neaktívny 18 mesiacov. Žiadna iná osoba (tréneri, priatelia, Komunita) tieto údaje nevidí. Viac podrobností v Zásadách ochrany osobných údajov.\u003c/p>\n  \u003cp>\u003cstrong>Chat s AI.\u003c/strong> Pri aktívnom module môže chat usporiadať do kalendára to, čo mu poviete, ale nenavrhuje látky, dávky ani režimy z vlastnej iniciatívy.\u003c/p>\n  \u003cp>\u003cstrong>Žiadny vzťah lekár–pacient a konzultácia s lekárom.\u003c/strong> Používanie modulu nevytvára vzťah lekár–pacient. Pred začatím, zmenou alebo ukončením akéhokoľvek lieku, doplnku či režimu sa poraďte s kvalifikovaným zdravotníckym pracovníkom. Za svoje rozhodnutia a riziká, ktoré z nich vyplývajú, zodpovedáte vy. cesta. nepodporuje užívanie žiadnej látky mimo rámca povoleného.\u003c/p>\n  \u003cp>\u003cstrong>Zákonnosť a dostupnosť.\u003c/strong> Mnohé z látok, ktoré môžete zaznamenávať, nie sú vo všetkých krajinách povolené na použitie u ľudí, alebo sa legálne predávajú iba na lekársky predpis či na výskum. Nehlásime sa k tomu, že modul, jeho zoznam látok ani jeho obsah sú vhodné, zákonné alebo dostupné vo vašej krajine: za dodržiavanie miestnych právnych predpisov zodpovedáte vy. Zoznam látok slúži iba na ich výber podľa názvu a neznamená, že ich cesta. schvaľuje alebo odporúča.\u003c/p>\n  \u003cp>\u003cstrong>Presnosť, AI a núdzové situácie.\u003c/strong> Údaje a krivky vychádzajú z toho, čo zadáte, a z odhadov, ktoré neoverujeme, a môžu byť nepresné alebo neúplné. Odpovede AI sa generujú automaticky a môžu obsahovať chyby. V prípade lekárskej pohotovosti alebo závažných príznakov sa na aplikáciu nespoliehajte: volajte 112 (alebo tiesňové číslo vo svojej krajine) alebo vyhľadajte lekára.\u003c/p>\n  \u003cp>\u003cstrong>Zodpovednosť.\u003c/strong> V rozsahu povolenom zákonom cesta. nezodpovedá za škody vzniknuté v dôsledku rozhodnutí o látkach alebo liečbe, ktoré urobíte na základe informácií v aplikácii. Tým nie sú dotknuté práva, ktoré vám zákon priznáva ako spotrebiteľovi, ani naša zodpovednosť za úmysel, hrubú nedbanlivosť, smrť alebo ujmu na zdraví spôsobenú naším zavinením.\u003c/p>\n  \u003cp>\u003cstrong>Pozastavenie.\u003c/strong> Modul môžeme pozastaviť alebo zrušiť, ak zistíme použitie v rozpore s týmito podmienkami (napríklad používanie maloletými, predaj alebo propagácia látok či zosobňovanie inej osoby), pričom vrátime pomernú časť už zaplateného a nevyužitého obdobia.\u003c/p>\n\n  \u003ch2>8. Platby, skúšobné obdobie zadarmo, obnovenie a zrušenie\u003c/h2>\n  \u003cp>Platby sú bezpečne spracúvané prostredníctvom Stripe; údaje o vašej platobnej karte nikdy nevidíme ani neukladáme. Predplatné sa na konci každého obdobia (mesačného alebo ročného) automaticky obnovuje, ak ho skôr nezrušíte. Ak zrušíte počas skúšobného obdobia zadarmo, nebude vám nič účtované.\u003c/p>\n  \u003cp>Môžete kedykoľvek zrušiť predplatné, zmeniť plán alebo aktualizovať spôsob platby pomocou tlačidla „Spravovať“ vedľa svojho plánu, ktoré vás presmeruje do zabezpečeného portálu Stripe. Ak zrušíte, zachováte si prístup k Premium do konca už zaplateného obdobia. Ak platba zlyhá, Stripe sa ju pokúsi niekoľko dní znova stiahnuť; ak ju stále nemožno stiahnuť, váš účet prejde na plán Zadarmo, kým neaktualizujete spôsob platby.\u003c/p>\n  \u003cp>\u003cstrong>Právo na odstúpenie od zmluvy.\u003c/strong> Ak ste spotrebiteľ, máte právo odstúpiť od zmluvy do 14 kalendárnych dní odo dňa jej uzatvorenia (od začatia skúšobného obdobia alebo platby), bez udania dôvodu, a to napísaním na cestafitness@gmail.com. Keďže digitálna služba sa začína na vašu žiadosť ihneď, v prípade odstúpenia budete povinní zaplatiť pomernú časť služby, ktorú ste dovtedy čerpali. Mimo tohto zákonného práva sa za už uplynulé obdobie nevracajú žiadne platby, ak to nevyžaduje uplatniteľné právo.\u003c/p>\n\n  \u003ch2>9. Program pozvánok a zliav\u003c/h2>\n  \u003cp>\u003cstrong>Pozývanie priateľov.\u003c/strong> Keď osoby, ktoré sa zaregistrujú pomocou vášho kódu, uzatvoria platený plán, vaše platené predplatné získa zľavu podľa toho, koľko z týchto osôb v danej chvíli platí: 5 osôb, 10 %; 10 osôb, 20 %; 15 osôb, 30 %; 20 osôb, 40 %; 30 osôb, 50 %. Aby ste ju získali, musíte mať vlastné aktívne platené predplatné. Zľava sa prepočítava, ak sa zmení počet pozvaných, ktorí stále platia, vzťahuje sa iba na vaše vlastné predplatné a nikdy sa nepremieňa na peniaze.\u003c/p>\n  \u003cp>\u003cstrong>Prispievanie potravín.\u003c/strong> Ak počas jedného mesiaca odošlete 10 potravín a všetkých 10 bude schválených, získate 5 % zľavu na svoju ďalšiu platbu.\u003c/p>\n  \u003cp>Je zakázané registrovať falošné účty alebo používať vlastný kód s cieľom získať zľavy; môžeme ich odobrať a pozastaviť dotknuté účty. Program môžeme upraviť alebo ukončiť s predchádzajúcim oznámením.\u003c/p>\n\n  \u003ch2>10. Duševné vlastníctvo a licencie\u003c/h2>\n  \u003cp>cesta. a jej logo, dizajn, softvér, texty a preklady patria jej prevádzkovateľovi a sú chránené zákonom. Aplikáciu nesmiete bez písomného súhlasu kopírovať, upravovať, šíriť ani spätne analyzovať.\u003c/p>\n  \u003cp>\u003cstrong>Zdroje tretích strán.\u003c/strong> Časť údajov o potravinách a produktoch pochádza z Open Food Facts (openfoodfacts.org) a je dostupná pod licenciou Open Database License (ODbL). Používajú sa open-source knižnice (Supabase JS, jsPDF, Sentry, Capacitor, s licenciou MIT) a písma Space Grotesk a Inter (licencia SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Dostupnosť a obmedzenie zodpovednosti\u003c/h2>\n  \u003cp>Robíme všetko pre to, aby aplikácia fungovala nepretržite, ale môžu nastať výpadky z dôvodu údržby alebo z príčin mimo našej kontroly. cesta. nenesie zodpovednosť za rozhodnutia týkajúce sa zdravia urobené výlučne na základe informácií z aplikácie; vždy sa poraďte s odborníkom. Nič z vyššie uvedeného neobmedzuje práva, ktoré zákon priznáva spotrebiteľom.\u003c/p>\n\n  \u003ch2>12. Ukončenie vzťahu\u003c/h2>\n  \u003cp>Svoj účet a všetky svoje údaje môžete kedykoľvek zmazať vo svojom profile. Účet, ktorý poruší tieto podmienky, môžeme pozastaviť alebo zrušiť.\u003c/p>\n\n  \u003ch2>13. Zmeny týchto podmienok\u003c/h2>\n  \u003cp>O akejkoľvek významnej zmene vás budeme informovať najmenej 30 dní vopred.\u003c/p>\n\n  \u003ch2>14. Rozhodné právo\u003c/h2>\n  \u003cp>Tieto podmienky sa spravujú španielskym právom. Ak ste spotrebiteľ, môžete sa obrátiť na súdy v mieste svojho bydliska a zostávajú vám zachované práva, ktoré vám priznávajú predpisy o ochrane spotrebiteľa krajiny vášho pobytu.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","hu":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Utolsó frissítés: 2026. 09. 20.\u003c/p>\n\n  \u003ch2>1. Kik vagyunk és mit kínálunk\u003c/h2>\n  \u003cp>A cesta. jogosultja: \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Bármilyen kérdéssel forduljon a cestafitness@gmail.com címhez.\u003c/p>\n  \u003cp>A cesta. étkezéstervezési, makrotápanyag-számítási, testsúly- és testméretkövetési, valamint edzéstervezési és edzésnaplózási eszköz. Tartalmaz fényképes és vonalkódos élelmiszer-azonosítást, mesterséges intelligenciás csevegést, recepteket, animált bemutatókkal ellátott gyakorlatokat, Terhesség és Baba szekciókat, időszakos böjtöt, egészségügyi alkalmazásokkal való összekapcsolást, valamint opcionális közösséget és edzőkeresőt. Nem orvostechnikai eszköz, és nem szakmai táplálkozási tanácsadási szolgáltatás.\u003c/p>\n\n  \u003ch2>2. Az Ön fiókja\u003c/h2>\n  \u003cp>Ön felel jelszava biztonságos megőrzéséért. Fiók létrehozásához legalább 18 évesnek kell lennie. A profiljában szereplő információknak valósnak kell lenniük.\u003c/p>\n\n  \u003ch2>3. Közösség és megosztott tartalom\u003c/h2>\n  \u003cp>Az Ön profilja alapértelmezés szerint privát. Ha nyilvánossá teszi, vagy elfogad egy ismerősi kérelmet, az illető látni fogja az Ön étrendjeit és fényképeit. Ne töltsön fel olyan tartalmat, amely harmadik felek jogait sérti, vagy amely más személyeket azonosít az ő hozzájárulásuk nélkül.\u003c/p>\n  \u003cp>\u003cstrong>Tiltott tartalom.\u003c/strong> Tilos feltölteni, csevegésben elküldeni, vagy gy
