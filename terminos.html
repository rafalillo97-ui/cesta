var DOCS={"es":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Última actualización: 24/09/2026\u003c/p>\n\n  \u003ch2>1. Quiénes somos y qué ofrecemos\u003c/h2>\n  \u003cp>El titular de cesta. es \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Para cualquier consulta, escribe a cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. es una herramienta de planificación de comidas, cálculo de macronutrientes, seguimiento de peso y medidas, y planificación y registro de entrenamientos. Incluye identificación de alimentos por foto y por código de barras, un chat con inteligencia artificial, recetas, ejercicios con demostraciones animadas, secciones de Embarazo y Bebé, ayuno intermitente, conexión con apps de salud, y una comunidad y un buscador de entrenadores opcionales. No es un producto sanitario ni un servicio de asesoramiento nutricional profesional.\u003c/p>\n\n  \u003ch2>2. Tu cuenta\u003c/h2>\n  \u003cp>Eres responsable de mantener segura tu contraseña. Debes tener al menos 18 años para crear una cuenta. La información de tu perfil debe ser veraz.\u003c/p>\n\n  \u003ch2>3. Comunidad y contenido compartido\u003c/h2>\n  \u003cp>Tu perfil es privado por defecto. Si lo haces público o aceptas una amistad, esa persona verá tus menús y fotos. No subas contenido que infrinja derechos de terceros ni que identifique a otras personas sin su consentimiento.\u003c/p>\n  \u003cp>\u003cstrong>Contenido prohibido.\u003c/strong> No está permitido subir, enviar por chat ni intentar hacer pasar por una búsqueda de técnica de ejercicio ningún contenido sexual, de desnudez o insinuante; violento, gráfico o perturbador; racista, homófobo, de odio o discriminatorio por cualquier motivo (origen, religión, orientación sexual, identidad de género, discapacidad u otro); o ilegal según cualquier ley aplicable, incluido cualquier contenido que involucre o sexualice a menores. Esto aplica a fotos de perfil, de progreso, de comida y de productos aportados, a los mensajes de chat entre entrenador y atleta o entre usuarios, y a cualquier texto usado para buscar vídeos de técnica.\u003c/p>\n  \u003cp>Todas las fotos que subas pasan por un filtro automático de moderación con inteligencia artificial antes de aceptarse (más detalle en la Política de Privacidad). Intentar eludir el filtro o subir repetidamente contenido prohibido es motivo de suspensión o cierre inmediato de tu cuenta, sin derecho a reembolso del plan de pago activo, y sin perjuicio de que informemos a las autoridades competentes cuando la ley nos obligue.\u003c/p>\n  \u003cp>Conservas todos los derechos sobre el contenido que subes. Nos das permiso, solo para prestarte el servicio, para almacenarlo, mostrarlo a las personas con las que decidas compartirlo y procesarlo como se explica en la Política de Privacidad.\u003c/p>\n\n  \u003ch2>4. Contenido generado por IA\u003c/h2>\n  \u003cp>Las estimaciones obtenidas por análisis de foto, por el chat con IA o por los resúmenes automáticos son aproximadas y pueden contener errores. Revísalas siempre y no las tomes como consejo médico.\u003c/p>\n\n  \u003ch2>5. Salud, embarazo, bebé y entrenamiento\u003c/h2>\n  \u003cp>La información de la app es de organización personal e información general. No sustituye el consejo de un médico, dietista-nutricionista, matrona, pediatra o entrenador. Consulta con un profesional antes de empezar un programa de ejercicio o cambiar tu alimentación, y especialmente si estás embarazada o en periodo de lactancia, tienes una enfermedad, sigues un tratamiento, o si la información se refiere a un bebé.\u003c/p>\n\n  \u003ch2>6. Entrenadores y atletas\u003c/h2>\n  \u003cp>Los entrenadores que usan cesta. son profesionales independientes. cesta. facilita el contacto y las herramientas, pero no supervisa ni garantiza sus servicios, y la relación entre entrenador y atleta es exclusivamente entre ellos. Los pagos entre entrenador y atleta se gestionan directamente entre ambos, fuera de la app; cesta. no cobra comisión ni interviene en esas transacciones. Ambos se comprometen a tratar con respeto y confidencialidad la información del otro.\u003c/p>\n\n  \u003ch2>7. Planes y precios\u003c/h2>\n  \u003cp>\u003cstrong>Gratis\u003c/strong> — sin coste, con las funciones básicas de planificación, calculadora de macros, base de alimentos y recetas, lista de la compra, registro de entrenamientos, búsqueda por código de barras, importación desde apps de salud, chat con IA y acceso a la comunidad. El análisis de fotos por IA está limitado a 5 al mes y la exportación de datos a 3 veces al mes.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mes o 49,99 €/año, con 7 días de prueba gratuita la primera vez. Incluye lo del plan Gratis y, entre otras funciones, análisis de fotos por IA ilimitado, exportación de datos sin límites, Cheat meals, Embarazo, Bebé, entrenamiento recomendado, seguimiento de medidas y soporte prioritario.\u003c/p>\n  \u003cp>\u003cstrong>Familiar básica\u003c/strong> — 4,99 €/mes. Hasta 4 perfiles bajo un mismo email y contraseña, cada uno con su peso, comidas y entrenamientos independientes, con el nivel Gratis. \u003cstrong>Familiar premium\u003c/strong> — 12,99 €/mes: igual, pero los 4 perfiles tienen Premium completo.\u003c/p>\n  \u003cp>\u003cstrong>Entrenador\u003c/strong> — 9,99 €/mes o 59,99 €/año, con 7 días de prueba gratuita. Es un plan aparte que incluye lo de Premium y el área «Mis atletas» para asesorar a atletas: proponerles menús y entrenamientos, ver su progreso y chatear con ellos.\u003c/p>\n  \u003cp>Lo que incluye cada plan se muestra siempre en la app (pantalla «Mejorar tu plan») y puede evolucionar. Los impuestos que correspondan se muestran antes de pagar. «Soporte prioritario» significa que tu mensaje se atiende antes que los de cuentas gratuitas, sin un tiempo de respuesta garantizado.\u003c/p>\n\n  \u003ch2>7 bis. Módulo Culturismo (suscripción aparte)\u003c/h2>\n  \u003cp>\u003cstrong>Qué es.\u003c/strong> El módulo Culturismo es una herramienta de registro y seguimiento personal: tú anotas lo que ya has decidido tomar (con tu médico o por tu cuenta) y cesta. lo organiza en un calendario y dibuja curvas orientativas. Las curvas son estimaciones matemáticas que usan la vida media que tú indicas o un valor orientativo de fuentes públicas; no miden tus niveles reales en sangre y pueden ser inexactas.\u003c/p>\n  \u003cp>\u003cstrong>Lo que no es.\u003c/strong> cesta. no da consejo médico, diagnóstico ni tratamiento, y no recomienda, prescribe, calcula, ajusta ni sugiere sustancias, dosis o pautas. No vende, suministra ni facilita la obtención de ninguna sustancia, ni fomenta su uso, y no sustituye a un profesional sanitario. Muchas sustancias son medicamentos con receta cuya obtención y uso sin control médico pueden ser ilegales y peligrosos para tu salud; eres el único responsable de cumplir la ley aplicable y de tus decisiones. Si tienes síntomas de alarma, acude a un servicio médico o llama al 112.\u003c/p>\n  \u003cp>\u003cstrong>Solo mayores de 18 años.\u003c/strong> Debes tener 18 años o más y lo confirmas al contratarlo. Podemos suspender el módulo si detectamos que lo usa un menor o un uso contrario a estos términos.\u003c/p>\n  \u003cp>\u003cstrong>Precio y pago.\u003c/strong> 10 €/mes (impuestos incluidos o mostrados antes de pagar), suscripción independiente de tu plan (Gratis, Premium, Familiar o Entrenador) y sin prueba gratuita. Se renueva automáticamente cada mes hasta que la canceles. El pago lo procesa Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Desistimiento y cancelación.\u003c/strong> Al contratar pides que el servicio empiece de inmediato. Como consumidor tienes 14 días para desistir del contrato; si lo ejerces después de haber usado el módulo, deberás abonar la parte proporcional del servicio ya disfrutado. Puedes cancelar cuando quieras desde el propio módulo (botón «Gestionar o cancelar la suscripción»); la cancelación surte efecto al final del periodo ya pagado y no se vuelve a renovar. Para desistir usa el botón «Ejercer mi derecho de desistimiento» del módulo o escríbenos al email de contacto.\u003c/p>\n  \u003cp>\u003cstrong>Tus datos.\u003c/strong> Los datos que registras son tuyos: puedes borrarlos todos en cualquier momento con «Eliminar todos mis datos de Culturismo» y descargarlos con «Descargar mis datos de Culturismo». Al cancelar la suscripción se conservan hasta que los borres, salvo que la cuenta lleve 18 meses inactiva. Ninguna otra persona (entrenadores, amigos, Comunidad) ve estos datos. Más detalle en la Política de privacidad.\u003c/p>\n  \u003cp>\u003cstrong>Chat con IA.\u003c/strong> Con el módulo activo, el chat puede organizar en un calendario lo que tú le cuentes, pero no propone sustancias, dosis ni pautas por iniciativa propia.\u003c/p>\n  \u003cp>\u003cstrong>Sin relación médico-paciente y consulta médica.\u003c/strong> Usar el módulo no crea una relación médico-paciente. Antes de empezar, cambiar o dejar cualquier medicamento, suplemento o pauta, consulta con un profesional sanitario cualificado. Eres responsable de tus decisiones y de los riesgos que conlleven. cesta. no avala el uso de ninguna sustancia fuera de lo autorizado.\u003c/p>\n  \u003cp>\u003cstrong>Legalidad y disponibilidad.\u003c/strong> Muchas de las sustancias que puedes registrar no están autorizadas para uso humano en todos los países, o solo se venden legalmente con receta médica o para investigación. No afirmamos que el módulo, su lista de sustancias ni su contenido sean adecuados, legales o estén disponibles en tu país: eres responsable de cumplir la normativa local. La lista de sustancias solo sirve para seleccionarlas por su nombre y no significa que cesta. las apruebe ni las recomiende.\u003c/p>\n  \u003cp>\u003cstrong>Exactitud, IA y emergencias.\u003c/strong> Los datos y las curvas se basan en lo que tú introduces y en estimaciones que no verificamos, y pueden ser inexactos o incompletos. Las respuestas de la IA se generan automáticamente y pueden contener errores. Ante una emergencia médica o síntomas graves no dependas de la app: llama al 112 (o al número de emergencias de tu país) o acude a un médico.\u003c/p>\n  \u003cp>\u003cstrong>Responsabilidad.\u003c/strong> En la medida permitida por la ley, cesta. no responde de los daños derivados de decisiones que tomes sobre sustancias o tratamientos basándote en la información de la app. Esto no limita los derechos que la ley te reconoce como consumidor ni nuestra responsabilidad por dolo, negligencia grave, muerte o daños personales causados por nuestra culpa.\u003c/p>\n  \u003cp>\u003cstrong>Suspensión.\u003c/strong> Podemos suspender o cancelar el módulo si detectamos un uso contrario a estos términos (por ejemplo, uso por menores, venta o promoción de sustancias o suplantación de identidad), reembolsando la parte proporcional del periodo ya pagado y no disfrutado.\u003c/p>\n\n  \u003ch2>8. Pagos, prueba gratuita, renovación y cancelación\u003c/h2>\n  \u003cp>Los pagos se procesan de forma segura a través de Stripe; nunca vemos ni guardamos los datos de tu tarjeta. Las suscripciones se renuevan automáticamente al final de cada periodo (mensual o anual) salvo que canceles antes. Si cancelas durante la prueba gratuita, no se te cobra nada.\u003c/p>\n  \u003cp>Puedes cancelar, cambiar de plan o actualizar tu método de pago cuando quieras desde el botón «Gestionar» junto a tu plan, que te lleva al portal seguro de Stripe. Si cancelas, mantienes el acceso Premium hasta el final del periodo ya pagado. Si un pago falla, Stripe reintentará el cobro durante unos días; si sigue sin poder cobrarse, tu cuenta pasará al plan Gratis hasta que actualices tu método de pago.\u003c/p>\n  \u003cp>\u003cstrong>Derecho de desistimiento.\u003c/strong> Si eres consumidor, tienes derecho a desistir del contrato en 14 días naturales desde que lo contratas (desde que inicias la prueba o el pago), sin dar explicaciones, escribiendo a cestafitness@gmail.com. Como el servicio digital comienza inmediatamente a tu petición, si desistes tendrás que pagar la parte proporcional del servicio que hayas recibido hasta ese momento. Fuera de ese derecho legal, no hay reembolsos por el tiempo ya transcurrido salvo que la ley aplicable lo exija.\u003c/p>\n\n  \u003ch2>9. Programa de invitaciones y descuentos\u003c/h2>\n  \u003cp>\u003cstrong>Invitar amigos.\u003c/strong> Cuando personas que se registran con tu código contratan un plan de pago, tu suscripción de pago recibe un descuento según cuántas de esas personas estén pagando en ese momento: 5 personas, 10 %; 10 personas, 20 %; 15 personas, 30 %; 20 personas, 40 %; 30 personas, 50 %. Para recibirlo necesitas tener tu propia suscripción de pago activa. El descuento se recalcula si cambia el número de invitados que siguen pagando, se aplica solo a tu propia suscripción y nunca se convierte en dinero.\u003c/p>\n  \u003cp>\u003cstrong>Aportar alimentos.\u003c/strong> Si envías 10 alimentos en un mes y los 10 se validan, tienes un 5 % de descuento en tu siguiente cuota.\u003c/p>\n  \u003cp>Está prohibido registrar cuentas falsas o usar tu propio código para obtener descuentos; podremos retirarlos y suspender las cuentas implicadas. Podemos modificar o cerrar el programa avisando con antelación.\u003c/p>\n\n  \u003ch2>10. Propiedad intelectual y licencias\u003c/h2>\n  \u003cp>cesta. y su logotipo, el diseño, el software, los textos y las traducciones son de su titular y están protegidos por la ley. No puedes copiar, modificar, distribuir ni hacer ingeniería inversa de la aplicación sin autorización escrita.\u003c/p>\n  \u003cp>\u003cstrong>Créditos de terceros.\u003c/strong> Parte de los datos de alimentos y productos procede de Open Food Facts (openfoodfacts.org), disponible bajo la licencia Open Database License (ODbL). Se usan bibliotecas de código abierto (Supabase JS, jsPDF, Sentry, Capacitor, con licencia MIT) y las tipografías Space Grotesk e Inter (licencia SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Disponibilidad y limitación de responsabilidad\u003c/h2>\n  \u003cp>Hacemos lo posible para que la app funcione siempre, pero puede haber interrupciones por mantenimiento o por causas ajenas. cesta. no se hace responsable de decisiones de salud tomadas únicamente en base a la información de la app; consulta siempre a un profesional. Nada de lo anterior limita los derechos que la ley reconoce a los consumidores.\u003c/p>\n\n  \u003ch2>12. Terminar la relación\u003c/h2>\n  \u003cp>Puedes eliminar tu cuenta y todos tus datos en cualquier momento desde tu perfil. Podemos suspender o cerrar una cuenta que incumpla estos términos.\u003c/p>\n\n  \u003ch2>13. Cambios en estos términos\u003c/h2>\n  \u003cp>Notificaremos cualquier cambio relevante con al menos 30 días de antelación.\u003c/p>\n\n  \u003ch2>14. Ley aplicable\u003c/h2>\n  \u003cp>Estos términos se rigen por la ley española. Si eres consumidor, puedes acudir a los tribunales de tu domicilio, y mantienes los derechos que te reconoce la normativa de consumo de tu país de residencia.\u003c/p>\n\n  \u003ch2>15. Contacto\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","en":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Last updated: 24/09/2026\u003c/p>\n\n  \u003ch2>1. Who we are and what we offer\u003c/h2>\n  \u003cp>The owner of cesta. is \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). For any enquiry, write to cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. is a tool for meal planning, macronutrient calculation, weight and measurement tracking, and workout planning and logging. It includes food identification by photo and by barcode, an artificial intelligence chat, recipes, exercises with animated demonstrations, Pregnancy and Baby sections, intermittent fasting, connection with health apps, and an optional community and trainer finder. It is not a medical device or a professional nutritional advisory service.\u003c/p>\n\n  \u003ch2>2. Your account\u003c/h2>\n  \u003cp>You are responsible for keeping your password secure. You must be at least 18 years old to create an account. The information in your profile must be truthful.\u003c/p>\n\n  \u003ch2>3. Community and shared content\u003c/h2>\n  \u003cp>Your profile is private by default. If you make it public or accept a friendship, that person will see your menus and photos. Do not upload content that infringes third-party rights or that identifies other people without their consent.\u003c/p>\n  \u003cp>\u003cstrong>Prohibited content.\u003c/strong> It is not permitted to upload, send by chat or attempt to pass off as an exercise technique search any content that is sexual, nude or suggestive; violent, graphic or disturbing; racist, homophobic, hateful or discriminatory on any ground (origin, religion, sexual orientation, gender identity, disability or other); or illegal under any applicable law, including any content that involves or sexualises minors. This applies to profile photos, progress photos, food photos and photos of contributed products, to chat messages between trainer and athlete or between users, and to any text used to search for technique videos.\u003c/p>\n  \u003cp>All photos you upload go through an automatic artificial intelligence moderation filter before being accepted (more detail in the Privacy Policy). Attempting to circumvent the filter or repeatedly uploading prohibited content is grounds for immediate suspension or closure of your account, with no right to a refund of the active paid plan, and without prejudice to our informing the competent authorities where the law obliges us to do so.\u003c/p>\n  \u003cp>You retain all rights over the content you upload. You grant us permission, solely to provide you with the service, to store it, display it to the people you choose to share it with and process it as explained in the Privacy Policy.\u003c/p>\n\n  \u003ch2>4. AI-generated content\u003c/h2>\n  \u003cp>Estimates obtained through photo analysis, the AI chat or automatic summaries are approximate and may contain errors. Always review them and do not treat them as medical advice.\u003c/p>\n\n  \u003ch2>5. Health, pregnancy, baby and training\u003c/h2>\n  \u003cp>The information in the app is for personal organisation and general information. It does not replace the advice of a doctor, dietitian-nutritionist, midwife, paediatrician or trainer. Consult a professional before starting an exercise programme or changing your diet, and especially if you are pregnant or breastfeeding, have an illness, are undergoing treatment, or if the information concerns a baby.\u003c/p>\n\n  \u003ch2>6. Trainers and athletes\u003c/h2>\n  \u003cp>Trainers who use cesta. are independent professionals. cesta. facilitates contact and provides tools, but does not supervise or guarantee their services, and the relationship between trainer and athlete is exclusively between them. Payments between trainer and athlete are handled directly between the two of them, outside the app; cesta. charges no commission and is not involved in those transactions. Both undertake to treat each other's information with respect and confidentiality.\u003c/p>\n\n  \u003ch2>7. Plans and prices\u003c/h2>\n  \u003cp>\u003cstrong>Free\u003c/strong> — no cost, with the basic planning features, macro calculator, food database and recipes, shopping list, workout logging, barcode search, import from health apps, AI chat and access to the community. AI photo analysis is limited to 5 per month and data export to 3 times per month.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — €7.99/month or €49.99/year, with a 7-day free trial the first time. It includes everything in the Free plan and, among other features, unlimited AI photo analysis, unlimited data export, Cheat meals, Pregnancy, Baby, recommended training, measurement tracking and priority support.\u003c/p>\n  \u003cp>\u003cstrong>Basic Family\u003c/strong> — €4.99/month. Up to 4 profiles under a single email and password, each with its own independent weight, meals and workouts, with the Free tier. \u003cstrong>Premium Family\u003c/strong> — €12.99/month: the same, but all 4 profiles have full Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trainer\u003c/strong> — €9.99/month or €59.99/year, with a 7-day free trial. It is a separate plan that includes everything in Premium and the “My athletes” area for advising athletes: proposing menus and workouts to them, viewing their progress and chatting with them.\u003c/p>\n  \u003cp>What each plan includes is always shown in the app (“Upgrade your plan” screen) and may change over time. Applicable taxes are shown before payment. “Priority support” means that your message is handled before those from free accounts, without a guaranteed response time.\u003c/p>\n\n  \u003ch2>7 bis. Bodybuilding module (separate subscription)\u003c/h2>\n  \u003cp>\u003cstrong>What it is.\u003c/strong> The Bodybuilding module is a personal logging and tracking tool: you record what you have already decided to take (with your doctor or on your own) and cesta. organises it in a calendar and draws indicative curves. The curves are mathematical estimates that use the half-life you enter or an indicative value from public sources; they do not measure your real blood levels and may be inaccurate.\u003c/p>\n  \u003cp>\u003cstrong>What it is not.\u003c/strong> cesta. does not give medical advice, diagnosis or treatment, and does not recommend, prescribe, calculate, adjust or suggest substances, doses or protocols. It does not sell, supply or help you obtain any substance, does not encourage their use, and does not replace a healthcare professional. Many substances are prescription medicines whose acquisition and use without medical supervision may be illegal and dangerous to your health; you alone are responsible for complying with the applicable law and for your decisions. If you have warning symptoms, seek medical care or call your local emergency number.\u003c/p>\n  \u003cp>\u003cstrong>18 and over only.\u003c/strong> You must be 18 or older and you confirm this when you subscribe. We may suspend the module if we detect that a minor is using it or that it is being used contrary to these terms.\u003c/p>\n  \u003cp>\u003cstrong>Price and payment.\u003c/strong> €10/month (taxes included or shown before you pay), a subscription independent of your plan (Free, Premium, Family or Trainer) and with no free trial. It renews automatically every month until you cancel. Payment is processed by Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Withdrawal and cancellation.\u003c/strong> By subscribing you request that the service starts immediately. As a consumer you have 14 days to withdraw from the contract; if you exercise it after having used the module, you must pay the proportional part of the service already enjoyed. You can cancel at any time from the module itself (the “Manage or cancel the subscription” button); cancellation takes effect at the end of the period already paid and it will not renew again. To withdraw, use the “Exercise my right of withdrawal” button in the module or write to us at the contact email.\u003c/p>\n  \u003cp>\u003cstrong>Your data.\u003c/strong> The data you record is yours: you can delete all of it at any time with “Delete all my Bodybuilding data” and download it with “Download my Bodybuilding data”. If you cancel the subscription it is kept until you delete it, unless the account has been inactive for 18 months. No one else (trainers, friends, Community) can see this data. More detail in the Privacy Policy.\u003c/p>\n  \u003cp>\u003cstrong>AI chat.\u003c/strong> With the module active, the chat can organise in a calendar what you tell it, but it does not propose substances, doses or protocols on its own initiative.\u003c/p>\n  \u003cp>\u003cstrong>No doctor-patient relationship; consult a professional.\u003c/strong> Using the module does not create a doctor-patient relationship. Before starting, changing or stopping any medication, supplement or protocol, consult a qualified healthcare professional. You are responsible for your decisions and the risks they involve. cesta. does not endorse the use of any substance outside what is authorised.\u003c/p>\n  \u003cp>\u003cstrong>Legality and availability.\u003c/strong> Many of the substances you can log are not authorised for human use in every country, or are only legally sold with a prescription or for research. We do not represent that the module, its list of substances or its content is appropriate, legal or available in your country: you are responsible for complying with local law. The list of substances only lets you select them by name and does not mean cesta. approves or recommends them.\u003c/p>\n  \u003cp>\u003cstrong>Accuracy, AI and emergencies.\u003c/strong> The data and curves are based on what you enter and on estimates we do not verify, and may be inaccurate or incomplete. AI answers are generated automatically and may contain errors. In a medical emergency or with serious symptoms do not rely on the app: call 112 (or your country's emergency number) or see a doctor.\u003c/p>\n  \u003cp>\u003cstrong>Liability.\u003c/strong> To the extent permitted by law, cesta. is not liable for damage arising from decisions you make about substances or treatments based on the information in the app. This does not limit the rights the law gives you as a consumer or our liability for wilful misconduct, gross negligence, death or personal injury caused by our fault.\u003c/p>\n  \u003cp>\u003cstrong>Suspension.\u003c/strong> We may suspend or cancel the module if we detect use contrary to these terms (for example use by minors, sale or promotion of substances, or impersonation), refunding the proportional part of the period already paid and not enjoyed.\u003c/p>\n\n  \u003ch2>8. Payments, free trial, renewal and cancellation\u003c/h2>\n  \u003cp>Payments are processed securely through Stripe; we never see or store your card details. Subscriptions renew automatically at the end of each period (monthly or annual) unless you cancel beforehand. If you cancel during the free trial, you are not charged anything.\u003c/p>\n  \u003cp>You can cancel, change plan or update your payment method at any time from the “Manage” button next to your plan, which takes you to the secure Stripe portal. If you cancel, you keep Premium access until the end of the period already paid. If a payment fails, Stripe will retry the charge for a few days; if it still cannot be collected, your account will move to the Free plan until you update your payment method.\u003c/p>\n  \u003cp>\u003cstrong>Right of withdrawal.\u003c/strong> If you are a consumer, you have the right to withdraw from the contract within 14 calendar days from the date you enter into it (from when you start the trial or the payment), without giving any reason, by writing to cestafitness@gmail.com. Because the digital service begins immediately at your request, if you withdraw you will have to pay the proportionate part of the service you have received up to that moment. Outside that statutory right, there are no refunds for time already elapsed unless the applicable law requires it.\u003c/p>\n\n  \u003ch2>9. Referral programme and discounts\u003c/h2>\n  \u003cp>\u003cstrong>Inviting friends.\u003c/strong> When people who register with your code take out a paid plan, your paid subscription receives a discount depending on how many of those people are paying at that moment: 5 people, 10%; 10 people, 20%; 15 people, 30%; 20 people, 40%; 30 people, 50%. To receive it you need to have your own active paid subscription. The discount is recalculated if the number of invitees who continue to pay changes, applies only to your own subscription and is never converted into money.\u003c/p>\n  \u003cp>\u003cstrong>Contributing foods.\u003c/strong> If you submit 10 foods in a month and all 10 are validated, you get a 5% discount on your next payment.\u003c/p>\n  \u003cp>Registering fake accounts or using your own code to obtain discounts is prohibited; we may withdraw the discounts and suspend the accounts involved. We may modify or close the programme with prior notice.\u003c/p>\n\n  \u003ch2>10. Intellectual property and licences\u003c/h2>\n  \u003cp>cesta. and its logo, design, software, texts and translations belong to its owner and are protected by law. You may not copy, modify, distribute or reverse engineer the application without written authorisation.\u003c/p>\n  \u003cp>\u003cstrong>Third-party credits.\u003c/strong> Part of the food and product data comes from Open Food Facts (openfoodfacts.org), available under the Open Database License (ODbL). Open-source libraries are used (Supabase JS, jsPDF, Sentry, Capacitor, under the MIT licence) as well as the Space Grotesk and Inter typefaces (SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Availability and limitation of liability\u003c/h2>\n  \u003cp>We do our best to keep the app running at all times, but there may be interruptions due to maintenance or causes beyond our control. cesta. is not responsible for health decisions made solely on the basis of information in the app; always consult a professional. Nothing in the foregoing limits the rights that the law grants to consumers.\u003c/p>\n\n  \u003ch2>12. Ending the relationship\u003c/h2>\n  \u003cp>You may delete your account and all your data at any time from your profile. We may suspend or close an account that breaches these terms.\u003c/p>\n\n  \u003ch2>13. Changes to these terms\u003c/h2>\n  \u003cp>We will notify any material change at least 30 days in advance.\u003c/p>\n\n  \u003ch2>14. Governing law\u003c/h2>\n  \u003cp>These terms are governed by Spanish law. If you are a consumer, you may bring proceedings before the courts of your place of residence, and you keep the rights granted to you by the consumer protection legislation of your country of residence.\u003c/p>\n\n  \u003ch2>15. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","fr":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Dernière mise à jour : 24/09/2026\u003c/p>\n\n  \u003ch2>1. Qui nous sommes et ce que nous proposons\u003c/h2>\n  \u003cp>Le titulaire de cesta. est \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Pour toute demande, écrivez à cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. est un outil de planification des repas, de calcul des macronutriments, de suivi du poids et des mensurations, et de planification et d'enregistrement des entraînements. Il comprend l'identification des aliments par photo et par code-barres, un chat avec intelligence artificielle, des recettes, des exercices avec démonstrations animées, des rubriques Grossesse et Bébé, le jeûne intermittent, la connexion à des applications de santé, ainsi qu'une communauté et un moteur de recherche de coachs facultatifs. Ce n'est ni un dispositif médical ni un service de conseil nutritionnel professionnel.\u003c/p>\n\n  \u003ch2>2. Votre compte\u003c/h2>\n  \u003cp>Vous êtes responsable de la sécurité de votre mot de passe. Vous devez avoir au moins 18 ans pour créer un compte. Les informations de votre profil doivent être exactes.\u003c/p>\n\n  \u003ch2>3. Communauté et contenus partagés\u003c/h2>\n  \u003cp>Votre profil est privé par défaut. Si vous le rendez public ou acceptez une demande d'ami, cette personne verra vos menus et vos photos. Ne téléversez pas de contenu portant atteinte aux droits de tiers ni permettant d'identifier d'autres personnes sans leur consentement.\u003c/p>\n  \u003cp>\u003cstrong>Contenus interdits.\u003c/strong> Il est interdit de téléverser, d'envoyer par chat ou de tenter de faire passer pour une recherche de technique d'exercice tout contenu à caractère sexuel, de nudité ou suggestif ; violent, explicite ou choquant ; raciste, homophobe, haineux ou discriminatoire pour quelque motif que ce soit (origine, religion, orientation sexuelle, identité de genre, handicap ou autre) ; ou illégal au regard de toute loi applicable, y compris tout contenu impliquant ou sexualisant des mineurs. Cela s'applique aux photos de profil, de progression, de repas et de produits ajoutés, aux messages du chat entre coach et athlète ou entre utilisateurs, ainsi qu'à tout texte utilisé pour rechercher des vidéos de technique.\u003c/p>\n  \u003cp>Toutes les photos que vous téléversez passent par un filtre automatique de modération par intelligence artificielle avant d'être acceptées (plus de détails dans la Politique de confidentialité). Tenter de contourner le filtre ou téléverser de façon répétée des contenus interdits constitue un motif de suspension ou de clôture immédiate de votre compte, sans droit au remboursement de l'abonnement payant en cours, et sans préjudice de notre faculté d'informer les autorités compétentes lorsque la loi nous y oblige.\u003c/p>\n  \u003cp>Vous conservez tous les droits sur les contenus que vous téléversez. Vous nous accordez l'autorisation, uniquement pour vous fournir le service, de les stocker, de les afficher aux personnes avec lesquelles vous décidez de les partager et de les traiter comme expliqué dans la Politique de confidentialité.\u003c/p>\n\n  \u003ch2>4. Contenus générés par l'IA\u003c/h2>\n  \u003cp>Les estimations obtenues par l'analyse de photos, par le chat IA ou par les résumés automatiques sont approximatives et peuvent comporter des erreurs. Vérifiez-les toujours et ne les considérez pas comme un avis médical.\u003c/p>\n\n  \u003ch2>5. Santé, grossesse, bébé et entraînement\u003c/h2>\n  \u003cp>Les informations de l'application relèvent de l'organisation personnelle et de l'information générale. Elles ne remplacent pas l'avis d'un médecin, d'un diététicien-nutritionniste, d'une sage-femme, d'un pédiatre ou d'un coach. Consultez un professionnel avant de commencer un programme d'exercice ou de modifier votre alimentation, et en particulier si vous êtes enceinte ou allaitez, si vous êtes atteint(e) d'une maladie, si vous suivez un traitement, ou si les informations concernent un bébé.\u003c/p>\n\n  \u003ch2>6. Coachs et athlètes\u003c/h2>\n  \u003cp>Les coachs qui utilisent cesta. sont des professionnels indépendants. cesta. facilite la mise en relation et fournit les outils, mais ne supervise ni ne garantit leurs services, et la relation entre coach et athlète existe exclusivement entre eux. Les paiements entre coach et athlète sont réglés directement entre eux, en dehors de l'application ; cesta. ne perçoit aucune commission et n'intervient pas dans ces transactions. Tous deux s'engagent à traiter avec respect et confidentialité les informations de l'autre.\u003c/p>\n\n  \u003ch2>7. Formules et tarifs\u003c/h2>\n  \u003cp>\u003cstrong>Gratuit\u003c/strong> — sans frais, avec les fonctions de base de planification, calculateur de macros, base d'aliments et recettes, liste de courses, enregistrement des entraînements, recherche par code-barres, importation depuis des applications de santé, chat IA et accès à la communauté. L'analyse de photos par IA est limitée à 5 par mois et l'exportation de données à 3 fois par mois.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mois ou 49,99 €/an, avec 7 jours d'essai gratuit la première fois. Comprend tout ce que contient la formule Gratuit et, entre autres fonctions, l'analyse de photos par IA illimitée, l'exportation de données sans limite, Cheat meals, Grossesse, Bébé, l'entraînement recommandé, le suivi des mensurations et l'assistance prioritaire.\u003c/p>\n  \u003cp>\u003cstrong>Famille basique\u003c/strong> — 4,99 €/mois. Jusqu'à 4 profils sous une même adresse e-mail et un même mot de passe, chacun avec son poids, ses repas et ses entraînements indépendants, avec le niveau Gratuit. \u003cstrong>Famille premium\u003c/strong> — 12,99 €/mois : identique, mais les 4 profils bénéficient de Premium complet.\u003c/p>\n  \u003cp>\u003cstrong>Coach\u003c/strong> — 9,99 €/mois ou 59,99 €/an, avec 7 jours d'essai gratuit. C'est une formule distincte qui comprend tout Premium ainsi que l'espace « Mes athlètes » pour conseiller des athlètes : leur proposer des menus et des entraînements, consulter leur progression et discuter avec eux.\u003c/p>\n  \u003cp>Le contenu de chaque formule est toujours indiqué dans l'application (écran « Améliorer votre formule ») et peut évoluer. Les taxes applicables sont affichées avant le paiement. « Assistance prioritaire » signifie que votre message est traité avant ceux des comptes gratuits, sans délai de réponse garanti.\u003c/p>\n\n  \u003ch2>7 bis. Module Musculation (abonnement distinct)\u003c/h2>\n  \u003cp>\u003cstrong>Ce que c'est.\u003c/strong> Le module Musculation est un outil de suivi et d'enregistrement personnel : vous notez ce que vous avez déjà décidé de prendre (avec votre médecin ou de votre propre initiative) et cesta. l'organise dans un calendrier et trace des courbes indicatives. Les courbes sont des estimations mathématiques qui utilisent la demi-vie que vous indiquez ou une valeur indicative issue de sources publiques ; elles ne mesurent pas vos taux sanguins réels et peuvent être inexactes.\u003c/p>\n  \u003cp>\u003cstrong>Ce que ce n'est pas.\u003c/strong> cesta. ne donne ni conseil médical, ni diagnostic, ni traitement, et ne recommande, ne prescrit, ne calcule, n'ajuste ni ne suggère de substances, de doses ou de protocoles. Elle ne vend ni ne fournit aucune substance, ne facilite pas leur obtention, n'encourage pas leur usage et ne remplace pas un professionnel de santé. De nombreuses substances sont des médicaments soumis à ordonnance dont l'obtention et l'usage sans contrôle médical peuvent être illégaux et dangereux pour votre santé ; vous êtes seul responsable du respect de la loi applicable et de vos décisions. Si vous présentez des symptômes alarmants, consultez un service médical ou appelez le 112.\u003c/p>\n  \u003cp>\u003cstrong>Réservé aux personnes de 18 ans et plus.\u003c/strong> Vous devez avoir 18 ans ou plus et vous le confirmez lors de la souscription. Nous pouvons suspendre le module si nous constatons qu'il est utilisé par un mineur ou d'une manière contraire aux présentes conditions.\u003c/p>\n  \u003cp>\u003cstrong>Prix et paiement.\u003c/strong> 10 €/mois (taxes incluses ou indiquées avant le paiement), abonnement indépendant de votre formule (Gratuit, Premium, Famille ou Coach) et sans essai gratuit. Il se renouvelle automatiquement chaque mois jusqu'à ce que vous le résiliiez. Le paiement est traité par Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Rétractation et résiliation.\u003c/strong> En souscrivant, vous demandez que le service commence immédiatement. En tant que consommateur, vous disposez de 14 jours pour vous rétracter du contrat ; si vous exercez ce droit après avoir utilisé le module, vous devrez payer la part proportionnelle du service déjà utilisé. Vous pouvez résilier à tout moment depuis le module lui-même (bouton « Gérer ou résilier l'abonnement ») ; la résiliation prend effet à la fin de la période déjà payée et l'abonnement ne se renouvelle plus. Pour vous rétracter, utilisez le bouton « Exercer mon droit de rétractation » du module ou écrivez-nous à l'adresse e-mail de contact.\u003c/p>\n  \u003cp>\u003cstrong>Tes données.\u003c/strong> Les données que tu enregistres t'appartiennent : tu peux toutes les supprimer à tout moment avec « Supprimer toutes mes données de Musculation » et les télécharger avec « Télécharger mes données de Musculation ». Si tu résilies l'abonnement, elles sont conservées jusqu'à ce que tu les supprimes, sauf si le compte est inactif depuis 18 mois. Aucune autre personne (coachs, amis, Communauté) ne voit ces données. Plus de détails dans la Politique de confidentialité.\u003c/p>\n  \u003cp>\u003cstrong>Chat IA.\u003c/strong> Lorsque le module est actif, le chat peut organiser dans un calendrier ce que vous lui indiquez, mais il ne propose ni substances, ni doses, ni protocoles de sa propre initiative.\u003c/p>\n  \u003cp>\u003cstrong>Aucune relation médecin-patient et consultation médicale.\u003c/strong> L'utilisation du module ne crée pas de relation médecin-patient. Avant de commencer, de modifier ou d'arrêter un médicament, un complément ou un protocole, consultez un professionnel de santé qualifié. Vous êtes responsable de vos décisions et des risques qu'elles comportent. cesta. ne cautionne l'usage d'aucune substance en dehors de ce qui est autorisé.\u003c/p>\n  \u003cp>\u003cstrong>Légalité et disponibilité.\u003c/strong> Beaucoup des substances que vous pouvez enregistrer ne sont pas autorisées à l'usage humain dans tous les pays, ou ne sont légalement vendues que sur ordonnance ou à des fins de recherche. Nous n'affirmons pas que le module, sa liste de substances ou son contenu soient adaptés, légaux ou disponibles dans votre pays : vous êtes responsable du respect de la réglementation locale. La liste de substances sert uniquement à les sélectionner par leur nom et ne signifie pas que cesta. les approuve ou les recommande.\u003c/p>\n  \u003cp>\u003cstrong>Exactitude, IA et urgences.\u003c/strong> Les données et les courbes reposent sur ce que vous saisissez et sur des estimations que nous ne vérifions pas, et peuvent être inexactes ou incomplètes. Les réponses de l'IA sont générées automatiquement et peuvent contenir des erreurs. En cas d'urgence médicale ou de symptômes graves, ne comptez pas sur l'application : appelez le 112 (ou le numéro d'urgence de votre pays) ou consultez un médecin.\u003c/p>\n  \u003cp>\u003cstrong>Responsabilité.\u003c/strong> Dans la mesure permise par la loi, cesta. n'est pas responsable des dommages découlant des décisions que vous prenez concernant des substances ou des traitements sur la base des informations de l'application. Cela ne limite ni les droits que la loi vous reconnaît en tant que consommateur ni notre responsabilité en cas de dol, de faute lourde, de décès ou de dommages corporels causés par notre faute.\u003c/p>\n  \u003cp>\u003cstrong>Suspension.\u003c/strong> Nous pouvons suspendre ou résilier le module si nous constatons une utilisation contraire aux présentes conditions (par exemple, utilisation par des mineurs, vente ou promotion de substances ou usurpation d'identité), en remboursant la part proportionnelle de la période déjà payée et non utilisée.\u003c/p>\n\n  \u003ch2>8. Paiements, essai gratuit, renouvellement et résiliation\u003c/h2>\n  \u003cp>Les paiements sont traités de manière sécurisée via Stripe ; nous ne voyons ni ne conservons jamais les données de votre carte. Les abonnements se renouvellent automatiquement à la fin de chaque période (mensuelle ou annuelle), sauf résiliation préalable de votre part. Si vous résiliez pendant l'essai gratuit, rien ne vous est facturé.\u003c/p>\n  \u003cp>Vous pouvez résilier, changer de formule ou mettre à jour votre moyen de paiement à tout moment depuis le bouton « Gérer » situé à côté de votre formule, qui vous redirige vers le portail sécurisé de Stripe. Si vous résiliez, vous conservez l'accès Premium jusqu'à la fin de la période déjà payée. Si un paiement échoue, Stripe retentera le prélèvement pendant quelques jours ; s'il ne peut toujours pas être encaissé, votre compte passera à la formule Gratuit jusqu'à la mise à jour de votre moyen de paiement.\u003c/p>\n  \u003cp>\u003cstrong>Droit de rétractation.\u003c/strong> Si vous êtes consommateur, vous disposez du droit de vous rétracter du contrat dans un délai de 14 jours calendaires à compter de sa conclusion (à compter du début de l'essai ou du paiement), sans avoir à vous justifier, en écrivant à cestafitness@gmail.com. Le service numérique débutant immédiatement à votre demande, si vous vous rétractez, vous devrez payer la part proportionnelle du service que vous avez reçu jusqu'à ce moment. En dehors de ce droit légal, aucun remboursement n'est accordé pour la période déjà écoulée, sauf si la loi applicable l'exige.\u003c/p>\n\n  \u003ch2>9. Programme de parrainage et remises\u003c/h2>\n  \u003cp>\u003cstrong>Parrainer des amis.\u003c/strong> Lorsque des personnes qui s'inscrivent avec votre code souscrivent une formule payante, votre abonnement payant bénéficie d'une remise selon le nombre de ces personnes qui paient à ce moment-là : 5 personnes, 10 % ; 10 personnes, 20 % ; 15 personnes, 30 % ; 20 personnes, 40 % ; 30 personnes, 50 %. Pour en bénéficier, vous devez avoir votre propre abonnement payant actif. La remise est recalculée si le nombre de filleuls qui continuent de payer change, s'applique uniquement à votre propre abonnement et n'est jamais convertie en argent.\u003c/p>\n  \u003cp>\u003cstrong>Contribuer des aliments.\u003c/strong> Si vous soumettez 10 aliments en un mois et que les 10 sont validés, vous bénéficiez d'une remise de 5 % sur votre prochaine échéance.\u003c/p>\n  \u003cp>Il est interdit de créer de faux comptes ou d'utiliser votre propre code pour obtenir des remises ; nous pourrons les retirer et suspendre les comptes concernés. Nous pouvons modifier ou clore le programme moyennant préavis.\u003c/p>\n\n  \u003ch2>10. Propriété intellectuelle et licences\u003c/h2>\n  \u003cp>cesta. et son logo, le design, le logiciel, les textes et les traductions appartiennent à leur titulaire et sont protégés par la loi. Vous ne pouvez pas copier, modifier, distribuer ni décompiler l'application sans autorisation écrite.\u003c/p>\n  \u003cp>\u003cstrong>Crédits de tiers.\u003c/strong> Une partie des données sur les aliments et les produits provient d'Open Food Facts (openfoodfacts.org), disponible sous la licence Open Database License (ODbL). Des bibliothèques open source sont utilisées (Supabase JS, jsPDF, Sentry, Capacitor, sous licence MIT), ainsi que les polices Space Grotesk et Inter (licence SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Disponibilité et limitation de responsabilité\u003c/h2>\n  \u003cp>Nous faisons notre possible pour que l'application fonctionne en permanence, mais des interruptions peuvent survenir pour cause de maintenance ou pour des raisons indépendantes de notre volonté. cesta. n'est pas responsable des décisions de santé prises uniquement sur la base des informations de l'application ; consultez toujours un professionnel. Rien de ce qui précède ne limite les droits que la loi reconnaît aux consommateurs.\u003c/p>\n\n  \u003ch2>12. Fin de la relation\u003c/h2>\n  \u003cp>Vous pouvez supprimer votre compte et toutes vos données à tout moment depuis votre profil. Nous pouvons suspendre ou clôturer un compte qui enfreint les présentes conditions.\u003c/p>\n\n  \u003ch2>13. Modification des présentes conditions\u003c/h2>\n  \u003cp>Nous notifierons toute modification substantielle avec un préavis d'au moins 30 jours.\u003c/p>\n\n  \u003ch2>14. Droit applicable\u003c/h2>\n  \u003cp>Les présentes conditions sont régies par le droit espagnol. Si vous êtes consommateur, vous pouvez saisir les tribunaux de votre domicile, et vous conservez les droits que vous reconnaît la réglementation sur la consommation de votre pays de résidence.\u003c/p>\n\n  \u003ch2>15. Contact\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","de":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Letzte Aktualisierung: 24.09.2026\u003c/p>\n\n  \u003ch2>1. Wer wir sind und was wir anbieten\u003c/h2>\n  \u003cp>Inhaber von cesta. ist \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Bei Fragen schreiben Sie an cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. ist ein Werkzeug zur Mahlzeitenplanung, Makronährstoffberechnung, Verfolgung von Gewicht und Körpermaßen sowie zur Planung und Erfassung von Trainingseinheiten. Es umfasst die Erkennung von Lebensmitteln per Foto und per Barcode, einen Chat mit künstlicher Intelligenz, Rezepte, Übungen mit animierten Demonstrationen, die Bereiche Schwangerschaft und Baby, intermittierendes Fasten, die Verbindung mit Gesundheits-Apps sowie eine optionale Community und eine Trainersuche. Es ist weder ein Medizinprodukt noch eine professionelle Ernährungsberatung.\u003c/p>\n\n  \u003ch2>2. Ihr Konto\u003c/h2>\n  \u003cp>Sie sind dafür verantwortlich, Ihr Passwort sicher aufzubewahren. Zur Kontoerstellung müssen Sie mindestens 18 Jahre alt sein. Die Angaben in Ihrem Profil müssen wahrheitsgemäß sein.\u003c/p>\n\n  \u003ch2>3. Community und geteilte Inhalte\u003c/h2>\n  \u003cp>Ihr Profil ist standardmäßig privat. Wenn Sie es öffentlich machen oder eine Freundschaft annehmen, sieht diese Person Ihre Menüs und Fotos. Laden Sie keine Inhalte hoch, die Rechte Dritter verletzen oder andere Personen ohne deren Einwilligung identifizieren.\u003c/p>\n  \u003cp>\u003cstrong>Verbotene Inhalte.\u003c/strong> Es ist nicht gestattet, Inhalte hochzuladen, per Chat zu versenden oder als Suche nach einer Übungstechnik auszugeben, die sexuell, nackt oder anzüglich sind; gewalttätig, drastisch oder verstörend; rassistisch, homophob, hasserfüllt oder aus irgendeinem Grund diskriminierend (Herkunft, Religion, sexuelle Orientierung, Geschlechtsidentität, Behinderung oder sonstiges); oder nach geltendem Recht rechtswidrig, einschließlich jeglicher Inhalte, die Minderjährige einbeziehen oder sexualisieren. Dies gilt für Profil-, Fortschritts- und Essensfotos sowie Fotos beigesteuerter Produkte, für Chat-Nachrichten zwischen Trainer und Athlet oder zwischen Nutzern und für jeden Text, der zur Suche nach Technikvideos verwendet wird.\u003c/p>\n  \u003cp>Alle Fotos, die Sie hochladen, durchlaufen vor der Annahme einen automatischen Moderationsfilter mit künstlicher Intelligenz (weitere Einzelheiten in der Datenschutzrichtlinie). Der Versuch, den Filter zu umgehen, oder das wiederholte Hochladen verbotener Inhalte ist ein Grund für die sofortige Sperrung oder Kündigung Ihres Kontos, ohne Anspruch auf Erstattung des laufenden kostenpflichtigen Tarifs und unbeschadet unseres Rechts, die zuständigen Behörden zu informieren, wenn das Gesetz uns dazu verpflichtet.\u003c/p>\n  \u003cp>Sie behalten alle Rechte an den Inhalten, die Sie hochladen. Sie räumen uns die Erlaubnis ein, diese ausschließlich zur Erbringung des Dienstes zu speichern, den Personen anzuzeigen, mit denen Sie sie teilen möchten, und sie so zu verarbeiten, wie es in der Datenschutzrichtlinie erläutert ist.\u003c/p>\n\n  \u003ch2>4. KI-generierte Inhalte\u003c/h2>\n  \u003cp>Schätzungen, die durch Fotoanalyse, den KI-Chat oder automatische Zusammenfassungen gewonnen werden, sind ungefähre Werte und können Fehler enthalten. Prüfen Sie sie stets und betrachten Sie sie nicht als ärztlichen Rat.\u003c/p>\n\n  \u003ch2>5. Gesundheit, Schwangerschaft, Baby und Training\u003c/h2>\n  \u003cp>Die Informationen der App dienen der persönlichen Organisation und der allgemeinen Information. Sie ersetzen nicht den Rat eines Arztes, Ernährungsberaters, einer Hebamme, eines Kinderarztes oder Trainers. Sprechen Sie mit einer Fachperson, bevor Sie ein Trainingsprogramm beginnen oder Ihre Ernährung ändern, insbesondere wenn Sie schwanger sind oder stillen, an einer Erkrankung leiden, sich in Behandlung befinden oder wenn sich die Informationen auf ein Baby beziehen.\u003c/p>\n\n  \u003ch2>6. Trainer und Athleten\u003c/h2>\n  \u003cp>Trainer, die cesta. nutzen, sind unabhängige Fachleute. cesta. erleichtert den Kontakt und stellt Werkzeuge bereit, überwacht deren Leistungen jedoch nicht und übernimmt dafür keine Gewähr; die Beziehung zwischen Trainer und Athlet besteht ausschließlich zwischen diesen beiden. Zahlungen zwischen Trainer und Athlet werden unmittelbar zwischen beiden außerhalb der App abgewickelt; cesta. erhebt keine Provision und ist an diesen Transaktionen nicht beteiligt. Beide verpflichten sich, die Informationen des anderen respektvoll und vertraulich zu behandeln.\u003c/p>\n\n  \u003ch2>7. Tarife und Preise\u003c/h2>\n  \u003cp>\u003cstrong>Kostenlos\u003c/strong> — ohne Kosten, mit den Grundfunktionen für Planung, Makro-Rechner, Lebensmitteldatenbank und Rezepte, Einkaufsliste, Trainingsprotokoll, Barcode-Suche, Import aus Gesundheits-Apps, KI-Chat und Zugang zur Community. Die KI-Fotoanalyse ist auf 5 pro Monat und der Datenexport auf 3 Mal pro Monat begrenzt.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/Monat oder 49,99 €/Jahr, mit 7 Tagen kostenloser Testphase beim ersten Mal. Enthält alles aus dem Tarif Kostenlos und unter anderem unbegrenzte KI-Fotoanalyse, unbegrenzten Datenexport, Cheat meals, Schwangerschaft, Baby, empfohlenes Training, Verfolgung der Körpermaße und bevorzugten Support.\u003c/p>\n  \u003cp>\u003cstrong>Familie Basic\u003c/strong> — 4,99 €/Monat. Bis zu 4 Profile unter derselben E-Mail-Adresse und demselben Passwort, jedes mit eigenem Gewicht, eigenen Mahlzeiten und Trainingseinheiten, mit der Stufe Kostenlos. \u003cstrong>Familie Premium\u003c/strong> — 12,99 €/Monat: gleich, aber alle 4 Profile haben vollständiges Premium.\u003c/p>\n  \u003cp>\u003cstrong>Trainer\u003c/strong> — 9,99 €/Monat oder 59,99 €/Jahr, mit 7 Tagen kostenloser Testphase. Es ist ein eigenständiger Tarif, der alles aus Premium sowie den Bereich „Meine Athleten“ zur Betreuung von Athleten umfasst: ihnen Menüs und Trainingseinheiten vorschlagen, ihren Fortschritt einsehen und mit ihnen chatten.\u003c/p>\n  \u003cp>Was jeder Tarif enthält, wird stets in der App angezeigt (Bildschirm „Tarif verbessern“) und kann sich weiterentwickeln. Anfallende Steuern werden vor der Zahlung angezeigt. „Bevorzugter Support“ bedeutet, dass Ihre Nachricht vor denen kostenloser Konten bearbeitet wird, ohne garantierte Antwortzeit.\u003c/p>\n\n  \u003ch2>7 bis. Modul Bodybuilding (separates Abonnement)\u003c/h2>\n  \u003cp>\u003cstrong>Was es ist.\u003c/strong> Das Modul Bodybuilding ist ein Werkzeug zur persönlichen Protokollierung und Nachverfolgung: Du trägst ein, was du bereits einzunehmen beschlossen hast (mit deinem Arzt oder auf eigene Faust), und cesta. ordnet es in einem Kalender und zeichnet Richtkurven. Die Kurven sind mathematische Schätzungen, die die von dir angegebene Halbwertszeit oder einen Richtwert aus öffentlichen Quellen verwenden; sie messen nicht deine tatsächlichen Blutwerte und können ungenau sein.\u003c/p>\n  \u003cp>\u003cstrong>Was es nicht ist.\u003c/strong> cesta. gibt keine medizinische Beratung, Diagnose oder Behandlung und empfiehlt, verschreibt, berechnet, passt nicht an und schlägt keine Substanzen, Dosen oder Schemata vor. cesta. verkauft oder liefert keine Substanz, erleichtert deren Beschaffung nicht, fördert deren Gebrauch nicht und ersetzt keine medizinische Fachkraft. Viele Substanzen sind verschreibungspflichtige Arzneimittel, deren Beschaffung und Anwendung ohne ärztliche Kontrolle illegal und gesundheitsgefährdend sein können; du allein bist für die Einhaltung des geltenden Rechts und für deine Entscheidungen verantwortlich. Bei Warnsymptomen suche einen ärztlichen Dienst auf oder rufe die 112 an.\u003c/p>\n  \u003cp>\u003cstrong>Nur ab 18 Jahren.\u003c/strong> Du musst mindestens 18 Jahre alt sein und bestätigst dies beim Abschluss. Wir können das Modul sperren, wenn wir feststellen, dass es von einem Minderjährigen oder entgegen diesen Bedingungen genutzt wird.\u003c/p>\n  \u003cp>\u003cstrong>Preis und Zahlung.\u003c/strong> 10 €/Monat (inklusive Steuern oder vor der Zahlung angezeigt), ein von deinem Tarif (Kostenlos, Premium, Familie oder Trainer) unabhängiges Abonnement ohne kostenlose Testphase. Es verlängert sich jeden Monat automatisch, bis du kündigst. Die Zahlung wird von Stripe abgewickelt.\u003c/p>\n  \u003cp>\u003cstrong>Widerruf und Kündigung.\u003c/strong> Mit dem Abschluss verlangst du, dass der Dienst sofort beginnt. Als Verbraucher hast du 14 Tage Zeit, den Vertrag zu widerrufen; übst du dieses Recht aus, nachdem du das Modul genutzt hast, musst du den anteiligen Wert des bereits genutzten Dienstes zahlen. Du kannst jederzeit über das Modul selbst kündigen (Schaltfläche „Abonnement verwalten oder kündigen“); die Kündigung wird zum Ende des bereits bezahlten Zeitraums wirksam und das Abonnement verlängert sich nicht mehr. Für den Widerruf nutze die Schaltfläche „Mein Widerrufsrecht ausüben“ im Modul oder schreibe uns an die Kontakt-E-Mail-Adresse.\u003c/p>\n  \u003cp>\u003cstrong>Deine Daten.\u003c/strong> Die Daten, die du erfasst, gehören dir: Du kannst sie jederzeit mit „Alle meine Bodybuilding-Daten löschen“ vollständig löschen und mit „Meine Bodybuilding-Daten herunterladen“ herunterladen. Bei Kündigung des Abonnements werden sie aufbewahrt, bis du sie löschst, es sei denn, das Konto ist seit 18 Monaten inaktiv. Keine andere Person (Trainer, Freunde, Community) sieht diese Daten. Weitere Einzelheiten findest du in der Datenschutzerklärung.\u003c/p>\n  \u003cp>\u003cstrong>KI-Chat.\u003c/strong> Bei aktivem Modul kann der Chat das, was du ihm mitteilst, in einem Kalender ordnen, schlägt aber von sich aus keine Substanzen, Dosen oder Schemata vor.\u003c/p>\n  \u003cp>\u003cstrong>Kein Arzt-Patienten-Verhältnis und ärztliche Beratung.\u003c/strong> Die Nutzung des Moduls begründet kein Arzt-Patienten-Verhältnis. Bevor du ein Medikament, Nahrungsergänzungsmittel oder Schema beginnst, änderst oder absetzt, konsultiere eine qualifizierte medizinische Fachkraft. Du bist für deine Entscheidungen und die damit verbundenen Risiken selbst verantwortlich. cesta. befürwortet nicht die Anwendung irgendeiner Substanz außerhalb des Zulässigen.\u003c/p>\n  \u003cp>\u003cstrong>Rechtmäßigkeit und Verfügbarkeit.\u003c/strong> Viele der Substanzen, die du erfassen kannst, sind nicht in allen Ländern für die Anwendung beim Menschen zugelassen oder werden rechtmäßig nur auf Rezept oder für Forschungszwecke verkauft. Wir sichern nicht zu, dass das Modul, seine Substanzliste oder sein Inhalt in deinem Land geeignet, rechtmäßig oder verfügbar sind: Du bist für die Einhaltung der örtlichen Vorschriften verantwortlich. Die Substanzliste dient nur dazu, sie anhand ihres Namens auszuwählen, und bedeutet nicht, dass cesta. sie billigt oder empfiehlt.\u003c/p>\n  \u003cp>\u003cstrong>Genauigkeit, KI und Notfälle.\u003c/strong> Die Daten und Kurven beruhen auf deinen Eingaben und auf Schätzungen, die wir nicht überprüfen, und können ungenau oder unvollständig sein. KI-Antworten werden automatisch erzeugt und können Fehler enthalten. Verlasse dich bei einem medizinischen Notfall oder schweren Symptomen nicht auf die App: Rufe die 112 (oder die Notrufnummer deines Landes) an oder suche einen Arzt auf.\u003c/p>\n  \u003cp>\u003cstrong>Haftung.\u003c/strong> Soweit gesetzlich zulässig, haftet cesta. nicht für Schäden, die sich aus Entscheidungen ergeben, die du auf Grundlage der Informationen in der App über Substanzen oder Behandlungen triffst. Dies schränkt weder die Rechte ein, die dir das Gesetz als Verbraucher gewährt, noch unsere Haftung für Vorsatz, grobe Fahrlässigkeit, Tod oder Personenschäden, die wir schuldhaft verursacht haben.\u003c/p>\n  \u003cp>\u003cstrong>Sperrung.\u003c/strong> Wir können das Modul sperren oder kündigen, wenn wir eine Nutzung entgegen diesen Bedingungen feststellen (zum Beispiel Nutzung durch Minderjährige, Verkauf oder Bewerbung von Substanzen oder Identitätsanmaßung); dabei erstatten wir den anteiligen Teil des bereits bezahlten, aber nicht genutzten Zeitraums.\u003c/p>\n\n  \u003ch2>8. Zahlungen, kostenlose Testphase, Verlängerung und Kündigung\u003c/h2>\n  \u003cp>Zahlungen werden sicher über Stripe abgewickelt; wir sehen und speichern Ihre Kartendaten zu keinem Zeitpunkt. Abonnements verlängern sich automatisch am Ende jedes Zeitraums (monatlich oder jährlich), sofern Sie nicht vorher kündigen. Wenn Sie während der kostenlosen Testphase kündigen, wird Ihnen nichts berechnet.\u003c/p>\n  \u003cp>Sie können jederzeit über die Schaltfläche „Verwalten“ neben Ihrem Tarif kündigen, den Tarif wechseln oder Ihre Zahlungsmethode aktualisieren; sie führt Sie zum sicheren Stripe-Portal. Wenn Sie kündigen, behalten Sie den Premium-Zugang bis zum Ende des bereits bezahlten Zeitraums. Schlägt eine Zahlung fehl, versucht Stripe den Einzug einige Tage lang erneut; kann er weiterhin nicht erfolgen, wechselt Ihr Konto in den Tarif Kostenlos, bis Sie Ihre Zahlungsmethode aktualisieren.\u003c/p>\n  \u003cp>\u003cstrong>Widerrufsrecht.\u003c/strong> Wenn Sie Verbraucher sind, haben Sie das Recht, den Vertrag innerhalb von 14 Kalendertagen ab Vertragsschluss (ab Beginn der Testphase oder der Zahlung) ohne Angabe von Gründen zu widerrufen, indem Sie an cestafitness@gmail.com schreiben. Da der digitale Dienst auf Ihren Wunsch hin sofort beginnt, müssen Sie im Widerrufsfall den anteiligen Wert des bis dahin erhaltenen Dienstes bezahlen. Außerhalb dieses gesetzlichen Rechts gibt es keine Erstattung für bereits verstrichene Zeit, es sei denn, das anwendbare Recht verlangt dies.\u003c/p>\n\n  \u003ch2>9. Einladungsprogramm und Rabatte\u003c/h2>\n  \u003cp>\u003cstrong>Freunde einladen.\u003c/strong> Wenn Personen, die sich mit Ihrem Code registrieren, einen kostenpflichtigen Tarif abschließen, erhält Ihr kostenpflichtiges Abonnement einen Rabatt, der davon abhängt, wie viele dieser Personen zu diesem Zeitpunkt zahlen: 5 Personen, 10 %; 10 Personen, 20 %; 15 Personen, 30 %; 20 Personen, 40 %; 30 Personen, 50 %. Um ihn zu erhalten, benötigen Sie ein eigenes aktives kostenpflichtiges Abonnement. Der Rabatt wird neu berechnet, wenn sich die Zahl der eingeladenen Personen ändert, die weiterhin zahlen, gilt nur für Ihr eigenes Abonnement und wird niemals in Geld umgewandelt.\u003c/p>\n  \u003cp>\u003cstrong>Lebensmittel beisteuern.\u003c/strong> Wenn Sie in einem Monat 10 Lebensmittel einreichen und alle 10 validiert werden, erhalten Sie 5 % Rabatt auf Ihre nächste Zahlung.\u003c/p>\n  \u003cp>Es ist verboten, gefälschte Konten anzulegen oder den eigenen Code zu verwenden, um Rabatte zu erlangen; wir können die Rabatte entziehen und die beteiligten Konten sperren. Wir können das Programm mit vorheriger Ankündigung ändern oder beenden.\u003c/p>\n\n  \u003ch2>10. Geistiges Eigentum und Lizenzen\u003c/h2>\n  \u003cp>cesta. und sein Logo, das Design, die Software, die Texte und die Übersetzungen gehören dem Inhaber und sind gesetzlich geschützt. Sie dürfen die Anwendung ohne schriftliche Genehmigung weder kopieren, verändern, verbreiten noch zurückentwickeln (Reverse Engineering).\u003c/p>\n  \u003cp>\u003cstrong>Nennung Dritter.\u003c/strong> Ein Teil der Daten zu Lebensmitteln und Produkten stammt von Open Food Facts (openfoodfacts.org) und ist unter der Open Database License (ODbL) verfügbar. Es werden Open-Source-Bibliotheken verwendet (Supabase JS, jsPDF, Sentry, Capacitor, unter MIT-Lizenz) sowie die Schriftarten Space Grotesk und Inter (SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Verfügbarkeit und Haftungsbeschränkung\u003c/h2>\n  \u003cp>Wir tun unser Möglichstes, damit die App stets funktioniert, es kann jedoch zu Unterbrechungen wegen Wartung oder aus Gründen kommen, die wir nicht zu vertreten haben. cesta. haftet nicht für Gesundheitsentscheidungen, die allein auf Grundlage der Informationen der App getroffen werden; wenden Sie sich stets an eine Fachperson. Nichts Vorstehendes schränkt die Rechte ein, die das Gesetz Verbrauchern einräumt.\u003c/p>\n\n  \u003ch2>12. Beendigung der Beziehung\u003c/h2>\n  \u003cp>Sie können Ihr Konto und alle Ihre Daten jederzeit über Ihr Profil löschen. Wir können ein Konto sperren oder kündigen, das gegen diese Bedingungen verstößt.\u003c/p>\n\n  \u003ch2>13. Änderungen dieser Bedingungen\u003c/h2>\n  \u003cp>Wesentliche Änderungen teilen wir mindestens 30 Tage im Voraus mit.\u003c/p>\n\n  \u003ch2>14. Anwendbares Recht\u003c/h2>\n  \u003cp>Diese Bedingungen unterliegen spanischem Recht. Wenn Sie Verbraucher sind, können Sie die Gerichte an Ihrem Wohnsitz anrufen, und Ihnen bleiben die Rechte erhalten, die Ihnen das Verbraucherschutzrecht Ihres Wohnsitzlandes gewährt.\u003c/p>\n\n  \u003ch2>15. Kontakt\u003c/h2>\n  \u003cp>cestafitness@gmail.com\u003c/p>","it":"\u003cp style=\"font-size:11px;color:var(--ink-soft)\">Ultimo aggiornamento: 24/09/2026\u003c/p>\n\n  \u003ch2>1. Chi siamo e cosa offriamo\u003c/h2>\n  \u003cp>Il titolare di cesta. è \u003cstrong>Rafael Pelegrina López de Hierro\u003c/strong> (NIF 77141795W), Calle Lérida, 27, Armilla (Granada). Per qualsiasi richiesta, scrivi a cestafitness@gmail.com.\u003c/p>\n  \u003cp>cesta. è uno strumento per la pianificazione dei pasti, il calcolo dei macronutrienti, il monitoraggio di peso e misure e la pianificazione e registrazione degli allenamenti. Include il riconoscimento degli alimenti tramite foto e codice a barre, una chat con intelligenza artificiale, ricette, esercizi con dimostrazioni animate, le sezioni Gravidanza e Bebè, il digiuno intermittente, il collegamento con app di salute e una community e un motore di ricerca di allenatori facoltativi. Non è un dispositivo medico né un servizio di consulenza nutrizionale professionale.\u003c/p>\n\n  \u003ch2>2. Il tuo account\u003c/h2>\n  \u003cp>Sei responsabile della sicurezza della tua password. Devi avere almeno 18 anni per creare un account. Le informazioni del tuo profilo devono essere veritiere.\u003c/p>\n\n  \u003ch2>3. Community e contenuti condivisi\u003c/h2>\n  \u003cp>Il tuo profilo è privato per impostazione predefinita. Se lo rendi pubblico o accetti un'amicizia, quella persona vedrà i tuoi menu e le tue foto. Non caricare contenuti che violino diritti di terzi o che identifichino altre persone senza il loro consenso.\u003c/p>\n  \u003cp>\u003cstrong>Contenuti vietati.\u003c/strong> Non è consentito caricare, inviare tramite chat né tentare di far passare come ricerca di tecnica di un esercizio alcun contenuto sessuale, di nudità o allusivo; violento, esplicito o sconvolgente; razzista, omofobo, d'odio o discriminatorio per qualsiasi motivo (origine, religione, orientamento sessuale, identità di genere, disabilità o altro); o illegale ai sensi di qualsiasi legge applicabile, compreso qualsiasi contenuto che coinvolga o sessualizzi minori. Ciò vale per le foto del profilo, dei progressi, del cibo e dei prodotti aggiunti, per i messaggi della chat tra allenatore e atleta o tra utenti e per qualsiasi testo utilizzato per cercare video sulla tecnica.\u003c/p>\n  \u003cp>Tutte le foto che carichi vengono sottoposte a un filtro automatico di moderazione con intelligenza artificiale prima di essere accettate (maggiori dettagli nell'Informativa sulla privacy). Tentare di eludere il filtro o caricare ripetutamente contenuti vietati è motivo di sospensione o chiusura immediata del tuo account, senza diritto al rimborso del piano a pagamento attivo e fatta salva la nostra facoltà di informare le autorità competenti quando la legge ci obblighi a farlo.\u003c/p>\n  \u003cp>Conservi tutti i diritti sui contenuti che carichi. Ci concedi l'autorizzazione, al solo fine di fornirti il servizio, a conservarli, mostrarli alle persone con cui decidi di condividerli ed elaborarli come spiegato nell'Informativa sulla privacy.\u003c/p>\n\n  \u003ch2>4. Contenuti generati dall'IA\u003c/h2>\n  \u003cp>Le stime ottenute tramite analisi delle foto, chat con IA o riepiloghi automatici sono approssimative e possono contenere errori. Verificale sempre e non considerarle un parere medico.\u003c/p>\n\n  \u003ch2>5. Salute, gravidanza, bebè e allenamento\u003c/h2>\n  \u003cp>Le informazioni dell'app servono all'organizzazione personale e hanno carattere informativo generale. Non sostituiscono il parere di un medico, dietista-nutrizionista, ostetrica, pediatra o allenatore. Consulta un professionista prima di iniziare un programma di esercizio o di modificare la tua alimentazione, e in particolare se sei in gravidanza o in allattamento, hai una malattia, segui una terapia o se le informazioni riguardano un bebè.\u003c/p>\n\n  \u003ch2>6. Allenatori e atleti\u003c/h2>\n  \u003cp>Gli allenatori che utilizzano cesta. sono professionisti indipendenti. cesta. facilita il contatto e fornisce gli strumenti, ma non supervisiona né garantisce i loro servizi, e il rapporto tra allenatore e atleta intercorre esclusivamente tra loro. I pagamenti tra allenatore e atleta sono gestiti direttamente tra i due, al di fuori dell'app; cesta. non applica commissioni e non interviene in tali transazioni. Entrambi si impegnano a trattare con rispetto e riservatezza le informazioni dell'altro.\u003c/p>\n\n  \u003ch2>7. Piani e prezzi\u003c/h2>\n  \u003cp>\u003cstrong>Gratuito\u003c/strong> — senza costi, con le funzioni di base di pianificazione, calcolatore di macro, database di alimenti e ricette, lista della spesa, registrazione degli allenamenti, ricerca tramite codice a barre, importazione da app di salute, chat con IA e accesso alla community. L'analisi delle foto con IA è limitata a 5 al mese e l'esportazione dei dati a 3 volte al mese.\u003c/p>\n  \u003cp>\u003cstrong>Premium\u003c/strong> — 7,99 €/mese o 49,99 €/anno, con 7 giorni di prova gratuita la prima volta. Include tutto ciò che prevede il piano Gratuito e, tra le altre funzioni, analisi delle foto con IA illimitata, esportazione dei dati senza limiti, Cheat meals, Gravidanza, Bebè, allenamento consigliato, monitoraggio delle misure e assistenza prioritaria.\u003c/p>\n  \u003cp>\u003cstrong>Famiglia base\u003c/strong> — 4,99 €/mese. Fino a 4 profili con la stessa e-mail e la stessa password, ciascuno con il proprio peso, i propri pasti e allenamenti indipendenti, con il livello Gratuito. \u003cstrong>Famiglia premium\u003c/strong> — 12,99 €/mese: uguale, ma tutti e 4 i profili hanno Premium completo.\u003c/p>\n  \u003cp>\u003cstrong>Allenatore\u003c/strong> — 9,99 €/mese o 59,99 €/anno, con 7 giorni di prova gratuita. È un piano a parte che include tutto Premium e l'area «I miei atleti» per assistere gli atleti: proporre loro menu e allenamenti, vedere i loro progressi e chattare con loro.\u003c/p>\n  \u003cp>Ciò che include ciascun piano è sempre mostrato nell'app (schermata «Migliora il tuo piano») e può evolvere. Le imposte applicabili sono indicate prima del pagamento. «Assistenza prioritaria» significa che il tuo messaggio viene gestito prima di quelli degli account gratuiti, senza un tempo di risposta garantito.\u003c/p>\n\n  \u003ch2>7 bis. Modulo Bodybuilding (abbonamento separato)\u003c/h2>\n  \u003cp>\u003cstrong>Cos'è.\u003c/strong> Il modulo Bodybuilding è uno strumento di registrazione e monitoraggio personale: tu annoti ciò che hai già deciso di assumere (con il tuo medico o per conto tuo) e cesta. lo organizza in un calendario e disegna curve indicative. Le curve sono stime matematiche che usano l'emivita che indichi tu o un valore indicativo tratto da fonti pubbliche; non misurano i tuoi livelli reali nel sangue e possono essere imprecise.\u003c/p>\n  \u003cp>\u003cstrong>Cosa non è.\u003c/strong> cesta. non fornisce consulenza medica, diagnosi né trattamento, e non raccomanda, prescrive, calcola, modifica né suggerisce sostanze, dosi o protocolli. Non vende, non fornisce né facilita l'ottenimento di alcuna sostanza, non ne incoraggia l'uso e non sostituisce un professionista sanitario. Molte sostanze sono medicinali con obbligo di prescrizione il cui ottenimento e uso senza controllo medico possono essere illegali e pericolosi per la tua salute; sei l'unico responsabile del rispetto della legge applicabile e delle tue decisioni. Se hai sintomi di allarme, rivolgiti a un servizio medico o chiama il 112.\u003c/p>\n  \u003cp>\u003cstrong>Solo maggiori di 18 anni.\u003c/strong> Devi avere 18 anni o più e lo confermi al momento della sottoscrizione. Possiamo sospendere il modulo se rileviamo che è usato da un minore o in modo contrario ai presenti termini.\u003c/p>\n  \u003cp>\u003cstrong>Prezzo e pagamento.\u003c/strong> 10 €/mese (imposte incluse o mostrate prima del pagamento), abbonamento indipendente dal tuo piano (Gratuito, Premium, Famiglia o Allenatore) e senza prova gratuita. Si rinnova automaticamente ogni mese finché non lo annulli. Il pagamento è elaborato da Stripe.\u003c/p>\n  \u003cp>\u003cstrong>Recesso e annullamento.\u003c/strong> Sottoscrivendo chiedi che il servizio inizi immediatamente. In qualità di consumatore hai 14 giorni per recedere dal contratto; se eserciti il recesso dopo aver usato il modulo, dovrai pagare la parte proporzionale del servizio già fruito. Puoi annullare in qualsiasi momento dal modulo stesso (pulsante «Gestisci o annulla l'abbonamento»); l'annullamento ha effetto alla fine del periodo già pagato e l'abbonamento non si rinnova più. Per recedere usa il pulsante «Esercita il mio diritto di recesso» del modulo oppure scrivici all'indirizzo email di contatto.\u003c/p>\n  \u003cp>\u003cstrong>I tuoi dati.\u003c/strong> I dati che registri sono tuoi: puoi eliminarli tutti in qualsiasi momento con «Elimina tutti i miei dati di Bodybuilding» e scaricarli con «Scarica i miei dati di Bodybuilding». Se annulli l'abbonamento, vengono conservati finché non li elimini, salvo che l'account sia inattivo da 18 mesi. Nessun'altra persona (allenatori, amici, Community) vede questi dati. Maggiori dettagli nell'Informativa sulla privacy.\u003c/p>\n  \u003cp>\u003cstrong>Chat con IA.\u003c/strong> Con il modulo attivo, la chat può organizzare in un calendario ciò che le racconti, ma non propone sostanze, dosi né protocolli di propria iniziativa.\u003c/p>\n  \u003cp>\u003cstrong>Nessun rapporto medico-paziente e consulto medico.\u003c/strong> L'uso del modulo non crea un rapporto medico-paziente. Prima di iniziare, cambiare o interrompere qualsiasi farmaco, integratore o schema, consulta un professionista sanitario qualificato. Sei responsabile delle tue decisioni e dei rischi che comportano. cesta. non avalla l'uso di alcuna sostanza al di fuori di quanto autorizzato.\u003c/p>\n  \u003cp>\u003cstrong>Legalità e disponibilità.\u003c/strong> Molte delle sostanze che puoi registrare non sono autorizzate all'uso umano in tutti i paesi, oppure sono vendute legalmente solo con ricetta medica o per la ricerca. Non affermiamo che il modulo, il suo elenco di sostanze o i suoi contenuti siano adeguati, legali o disponibili nel tuo paese: sei responsabile del rispetto della normativa locale. L'elenco delle sostanze serve solo a selezionarle per nome e non significa che cesta. le approvi né le raccomandi.\u003c/p>\n  \u003cp>\u003cstrong>Accuratezza, IA ed emergenze.\u003c/strong> I dati e le curve si basano su ciò che inserisci e su stime che non verifichiamo, e possono essere imprecisi o incompleti. Le risposte dell'IA sono generate automaticamente e possono contenere errori. In caso di emergenza medica o sintomi gravi non affidarti all'app: chiama il 112 (o il numero di emergenza del tuo paese) o rivolgiti a un medico.\u003c/p>\n  \u003cp>\u003cstrong>Responsabilità.\u003c/strong> Nella misura consentita dalla legge, cesta. non risponde dei danni derivanti dalle decisioni che prendi su sostanze o trattamenti basandoti sulle informazioni dell'app. Ciò non limita i diritti che la legge ti riconosce come consumatore né la nostra responsabilità per dolo, colpa grave, morte o lesioni personali causate da nostra colpa.\u003c/p>\n  \u003cp>\u003cstrong>Sospensione.\u003c/strong> Possiamo sospendere o annullare il modulo se rileviamo un uso contrario ai presenti termini (ad esempio, uso da parte di minori, vendita o promozione di sostanze o sostituzione di persona), rimborsando la parte proporzionale del periodo già pagato e non fruito.\u003c/p>\n\n  \u003ch2>8. Pagamenti, prova gratuita, rinnovo e disdetta\u003c/h2>\n  \u003cp>I pagamenti sono elaborati in modo sicuro tramite Stripe; non vediamo né conserviamo mai i dati della tua carta. Gli abbonamenti si rinnovano automaticamente al termine di ogni periodo (mensile o annuale), salvo disdetta anticipata. Se disdici durante la prova gratuita, non ti viene addebitato nulla.\u003c/p>\n  \u003cp>Puoi disdire, cambiare piano o aggiornare il metodo di pagamento in qualsiasi momento dal pulsante «Gestisci» accanto al tuo piano, che ti porta al portale sicuro di Stripe. Se disdici, mantieni l'accesso Premium fino al termine del periodo già pagato. Se un pagamento non va a buon fine, Stripe ritenterà l'addebito per alcuni giorni; se continua a non essere possibile, il tuo account passerà al piano Gratuito finché non aggiornerai il metodo di pagamento.\u003c/p>\n  \u003cp>\u003cstrong>Diritto di recesso.\u003c/strong> Se sei un consumatore, hai il diritto di recedere dal contratto entro 14 giorni di calendario dalla sua conclusione (dall'inizio della prova o del pagamento), senza fornire alcuna motivazione, scrivendo a cestafitness@gmail.com. Poiché il servizio digitale ha inizio immediatamente su tua richiesta, se recedi dovrai pagare la parte proporzionale del servizio di cui hai usufruito fino a quel momento. Al di fuori di tale diritto legale, non sono previsti rimborsi per il tempo già trascorso, salvo che la legge applicabile lo richieda.\u003c/p>\n\n  \u003ch2>9. Programma di inviti e sconti\u003c/h2>\n  \u003cp>\u003cstrong>Invitare amici.\u003c/strong> Quando le persone che si registrano con il tuo codice sottoscrivono un piano a pagamento, il tuo abbonamento a pagamento riceve uno sconto in base a quante di queste persone stanno pagando in quel momento: 5 persone, 10 %; 10 persone, 20 %; 15 persone, 30 %; 20 persone, 40 %; 30 persone, 50 %. Per ottenerlo devi avere un tuo abbonamento a pagamento attivo. Lo sconto viene ricalcolato se cambia il numero di invitati che continuano a pagare, si applica solo al tuo abbonamento e non viene mai convertito in denaro.\u003c/p>\n  \u003cp>\u003cstrong>Contribuire con alimenti.\u003c/strong> Se invii 10 alimenti in un mese e tutti e 10 vengono convalidati, ottieni uno sconto del 5 % sulla tua prossima quota.\u003c/p>\n  \u003cp>È vietato registrare account falsi o usare il proprio codice per ottenere sconti; potremo revocarli e sospendere gli account coinvolti. Possiamo modificare o chiudere il programma con preavviso.\u003c/p>\n\n  \u003ch2>10. Proprietà intellettuale e licenze\u003c/h2>\n  \u003cp>cesta. e il suo logo, il design, il software, i testi e le traduzioni appartengono al suo titolare e sono protetti dalla legge. Non puoi copiare, modificare, distribuire né decompilare l'applicazione (reverse engineering) senza autorizzazione scritta.\u003c/p>\n  \u003cp>\u003cstrong>Riconoscimenti a terzi.\u003c/strong> Parte dei dati su alimenti e prodotti proviene da Open Food Facts (openfoodfacts.org), disponibile con licenza Open Database License (ODbL). Vengono utilizzate librerie open source (Supabase JS, jsPDF, Sentry, Capacitor, con licenza MIT) e i caratteri tipografici Space Grotesk e Inter (licenza SIL Open Font License).\u003c/p>\n\n  \u003ch2>11. Disponibilità e limitazione di responsabilità\u003c/h2>\n  \u003cp>Facciamo il possibile affinché l'app funzioni sempre, ma possono verificarsi interruzioni per manutenzione o per cause indipendenti dalla nostra volontà. cesta. non è responsabile delle decisioni sulla salute prese unicamente sulla base delle informazioni dell'app; consulta sempre un professionista. Nulla di quanto precede limita i diritti che la legge riconosce ai consumatori.\u003c/p>\n\n  \u003ch2>12. Cessazione del rapporto\u003c/h2>\n  \u003cp>Puoi eliminare il tuo account e tutti i tuoi dati in qualsiasi momento dal tuo profilo. Possiamo sospendere o chiudere un account che violi questi termini.\u003c/p>\n\n  \u003ch2>13. Modifiche a questi termini\u003c/h2>\n  \u003cp>Comunicheremo qualsiasi modifica rilevante con almeno 30 giorni di preavviso.\u003c/p>\n\n  \u003ch2>14. Legge applicabile\u003c/h2>\n  \u003cp>Questi termini sono regolati dalla legge spagnola. Se sei un consumatore, puoi rivolgerti ai tribunali del tuo luogo di residenza e mantieni i diritti che ti riconosce la normativa sui cons
